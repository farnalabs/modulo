features:
    feat-auth:
        description: OAuth authorization, sessions, and user profile
        status: covered
        behaviours:
            # Admin-initiated credential lifecycle (FAR-460)
            - "[x] Admin password reset sets accounts.must_change_password=true and emits a user_password_reset_by_admin audit event; admin user creation emits user_created_by_admin -- both fail-open (a failed audit write never rolls back the change)"
            - "[x] The login response and /me (both /api/v1/auth/me and /api/v1/viewmodel/me) carry must_change_password so the frontend can force the change flow on fresh logins and restored sessions"
            - "[x] When must_change_password is true, App.vue renders ONLY the forced change-password view (all navigation blocked by construction); PUT /api/v1/me/password clears the flag in the same transaction as the hash swap and refresh-token families are blacklisted"
            - "[x] Admin create-user shows the shared credential dialog (email + password + copy) after success and offers a client-side strong-password generator meeting the form's displayed rules (8+ chars, upper+lower+digit)"
    feat-analytics:
        description: Reporting and analytics over runs, costs, and facts
    feat-audit:
        description: Audit trail and audit log
        status: covered
        behaviours:
            # Cryptographic chain (SHA-256 linked events per org)
            - "[x] Every AuditEvent records the SHA-256 of its canonical, compact JSON (sort_keys, separators=(',',':')) over event_type / actor / resource_type+id / payload / request_id / previous_hash / event_id / org / created_at, chaining each event to the prior one in the same organisation and forming a tamper-evident per-org chain with an AuditChainHead row tracking last_event_hash / last_event_id / event_count"
            - "[x] Appends lock the chain head with SELECT ... FOR UPDATE so concurrent transactions cannot fork the chain; a race that creates the head between the lock check and the insert retries up to APPEND_MAX_RETRIES=3 with exponential backoff before re-raising (test_integrity_error_retries_then_succeeds / test_integrity_error_exhausts_retries)"
            - "[x] The first event in an org has a NULL previous_hash; every subsequent event carries the hash of its immediate predecessor (test_first_event_creates_chain_head / test_second_event_links_to_first)"
            - "[x] Append failure handling is typed and retry-scoped: a retryable IntegrityError backs off and retries, while a ProgrammingError (missing table) and SQLAlchemyError propagate immediately without retry"
            - "[x] append_audit_event_isolated emits an event from a fresh post-commit transaction, re-establishing the RLS org + user context lost when SET LOCAL reverts on COMMIT; it fails open (a broken append is logged under log_key and never rolls back the completed operation) and always propagates CancelledError"
            - "[x] Append-only enforcement is defense-in-depth: application-layer SQLAlchemy ORM listeners block UPDATE/DELETE on BOTH AuditEvent and ErrorEvent rows with AppendOnlyViolationError (idempotent, thread-safe, never double-registered), complementing the DB-level Postgres triggers (test_append_only.py)"
            - "[x] Sanitised logging: invalid listing cursors are logged sanitised (never raw CR/LF control characters)"

            # Chain verification
            - "[x] GET /api/v1/admin/audit/verify recomputes the whole chain and returns {valid, total_events, checked_events, truncated, first_gap_index, first_tampered_id, chain_head_match, chain_count_mismatch, detail}; a missing chain head, a chain-head event_count mismatch, truncation, or a degenerate zero-fetch result all fail CLOSED as not valid"
            - "[x] Tamper evidence is actionable: on a break the response reports the expected vs stored previous_hash at the first gap in a human-readable detail string (test_verify_chain_break_detail_first_event / test_verify_chain_break_detail_reports_expected_vs_actual_hash)"
            - "[x] Verification is bounded to the most recent 10,000 events (truncated=true beyond that, reported not valid rather than silently partial)"

            # Browse / export API (all under /api/v1/admin/audit, permission audit.manage)
            - "[x] GET '' lists events with forward-only composite-cursor pagination (JSON {'c':created_at,'i':id} over created_at DESC, id DESC), clamps limit (API default 50) into 1..1000 at the core, filters by event_type / user_id / entity_type / from_date / to_date, always returns total, and an invalid user_id format is 422 while an invalid cursor falls back to the first page"
            - "[x] POST /batch-detail returns full details for up to 100 event ids (BATCH_MAX_SIZE), skipping silently only invalid-UUID entries, so cross-page bulk selection works"
            - "[x] GET /export returns paginated JSON (page / page_size clamped to 1..1000, ordered created_at ASC) with the same filters and a total, driving the admin CSV/JSONL export"
            - "[x] /batch-detail and /export additionally require the audit_viewer feature (no view without the flag); every audit endpoint needs audit.manage"

            # Frontend (AdminAuditLogView, /admin/audit)
            - "[x] The team-tier audit log view verifies chain integrity, exports CSV and JSONL (client-side pagination over /export into audit-log-<date>.csv / .jsonl), and filters by actor user / date range / target entity type with previous/next pagination and filter reset"
        deferrals:
            - Verification is bounded to VERIFY_MAX_EVENTS=10,000 most-recent events — there is no incremental from-chain-head verify for very long chains
            - The export surface is paginated JSON only (no server-side streaming / scan export for the whole org in one response)
    feat-connectors:
        description: External tool connectors
        status: covered
        behaviours:
            # Generic REST integration connector (FAR-408 / FAR-411 / FAR-412).

            # Happy Path
            - "[x] A REST connector instance is creatable with a declarative endpoint (base_url + path + method) and an auth credential profile (bearer / api_key / basic)"
            - "[x] query() is the read surface and write() is the write surface; a mutating verb (PUT/DELETE/PATCH) is intended to be declared on the write surface — the connector does not infer semantics, the author declares the method, and the query/write surface fixes the ACL gate"
            - "[x] A JSON response with a configured records_path JMESPath expression yields a list of dicts that feeds the downstream JMESPath consumer; a top-level JSON array and a whole-object single-record fallback also stay list-of-dicts"
            - "[x] When no records_path is configured, raw / passthrough content-types yield a single uniform {body, content_type, status_code, headers} record, so the result always stays a list-of-dicts (XML covered by test_query_xml_passthrough_yields_uniform_record)"
            - "[x] Templated fields (headers, params, body, path) render from runtime variables via the sandboxed Jinja environment"
            - "[x] Pagination is response-driven: the response's next_cursor (via next_cursor_path JMESPath) is surfaced on the result, while a caller-supplied start cursor is rejected with an actionable error (cursor surfacing covered by test_query_surfaces_next_cursor_from_response)"

            # Config Validation
            - "[x] Config validation rejects an unsupported HTTP method against the allowlist (GET/POST/PUT/PATCH/DELETE/HEAD/OPTIONS) with an actionable ValueError"
            - "[x] JMESPath paths using legacy dot-index syntax (data.items.0) are rejected with an actionable ValueError directing to bracket notation (data.items[0]); a numeric key like data.2024 is never silently rewritten"
            - "[x] verify_tls is configurable (default true) and controls the httpx TLS certificate verify on the connector client"

            # Auth & Credentials
            - "[x] Credentials are stored encrypted as a multi-field JSON dict (auth_mode bearer / api_key / basic) and round-trip through the secrets backend; the credential never reaches LangGraph state, logs, or error detail, and error detail redacts secret values"
            - "[x] api_key auth runs in BOTH header mode (default X-API-Key, or a custom header_name) and query mode (default api_key, or a custom query_param_name)"
            - "[x] api_key-in-query credentials are applied right before the wire, after the injection guard, so the secret is never screened; a rendered/context query param that collides with the credential param name is a hard error, never a silent override"
            - "[x] health_check issues the configured request with the credentials applied and reports the endpoint OK only for a sub-400 status"

            # Security — SSRF / egress / injection
            - "[x] An allowed_hosts allowlist plus core SSRF validation (validate_outbound_url_async wired at the composition root) prevent private / loopback / metadata / off-allowlist targets; a non-http/https scheme is rejected"
            - "[x] Injection guard: rendered header names/values are rejected on CR/LF or C0 control chars, rendered headers may not override the protected set (authorization, proxy-authorization, host, content-length, plus the api_key header name), and query params are URL-encoded by httpx"
            - "[x] On the WRITE surface the rendered URL, header values, params and body are screened by the core output-injection filter (filter_output_for_injection); the READ surface deliberately does NOT run the text classifier to avoid false positives on legitimate search terms"
            - "[x] The api_key credential value is never fed through the injection filter (applied post-screening)"

            # Error Handling
            - "[x] Non-2xx/3xx responses surface a typed RESTStatusError carrying status_code, location and Retry-After metadata instead of silently passing through — redirects are never followed (metadata fields asserted in test_three_xx_carries_status_location_and_retry_after_metadata)"
            - "[x] The response body is capped at max_response_size (default 10 MiB): a Content-Length or streaming body exceeding the cap raises RESTResponseTooLargeError so an unbounded body never stalls a run"
            - "[x] Transport failures (connect / timeout / read) surface as a typed RESTConnectError"
            - "[x] A fan-out source whose cardinality exceeds max_cardinality fails CLOSED before any request is emitted — a Sized source is len()-checked, a lazy generator is buffered to cap+1 then fails — raising RESTCardinalityExceededError with source_cardinality and the cardinality_over_cap flag"
            - "[x] An empty or unresolved fan-out items path succeeds vacuously (0 items, no outbound calls — not a failure)"
            - "[x] A mid-fan-out per-item failure fails the node, raising RESTFanOutFailureError carrying the per-item outcomes and success/failure counts so an operator can reconcile exactly which items were written"
            - "[x] A mid-fan-out cancellation surfaces as RESTFanOutCancelledError carrying partial outcome state"
            - "[x] A saturated per-destination token bucket never spins past the per-item budget — the rate-limit wait is bounded and raises RESTRateLimitTimeoutError"

            # Retry / Idempotency / Concurrency
            - "[x] Idempotent verbs (GET/HEAD) retry on 429/5xx and transient transport failures with exponential backoff + jitter, honouring a Retry-After capped at 30s; mutating verbs retry only when the operation declares an idempotency_header, and never retry otherwise (idempotency key reuse across retries asserted in test_mutating_verb_with_idempotency_header_retries)"
            - "[x] Fan-out emits items SEQUENTIALLY (one request per item, no concurrent or bounded-concurrency fork in v1); each item consumes a token from a per-destination rate bucket — a local per-process TokenBucket keyed by canonical rate key (base_url + path) with no Redis wired, or a SHARED Redis-atomic bucket keyed <tenant_id>:<destination> when a redis_client is provided (FAR-439)"
            - "[x] The connector shares a single lazily-created, connection-pooled httpx.AsyncClient (max_connections / max_keepalive_connections) closed via close() — the shared client is not Redis-backed (only the per-destination rate limiter may be, via the composition-root redis_client)"
            - "[x] The fan-out budget (max_cardinality x per_item_timeout x (max_retries + 1)) is reconciled against the node's timeout_seconds budget by the graph validator at save/run time (validator tests assert the multiplier in test_node_send_budget_*)"
            - "[x] A per-request timeout (default 30s, override via timeout_seconds) applies to both the read and write surfaces; the fan-out path uses its own per_item_timeout (default = connector timeout) (write-timeout surfacing a RESTConnectError asserted in test_write_timeout_is_typed_rest_connect_error_not_crash)"

            # Redaction
            - "[x] Fan-out outcome records persist only a bounded, redacted item_summary / result_summary — never the raw item payload — so a credential-bearing item is not echoed into logs or the persisted run result"

            # Shared per-destination rate limiting (FAR-439) + per-connector OTel metrics (FAR-413)
            - "[x] A shared, Redis-atomic per-destination rate limiter (PerDestinationRateLimiter + RedisTokenBucket, Lua CTL with server-side redis.call('TIME') refill) enforces ONE budget per <tenant_id>:<destination> across a fleet of uvicorn/SAQ workers; a configured shared limiter FAILS CLOSED on Redis outage (SharedBudgetUnavailableError) — it never falls back to a per-process bucket that would multiply the effective cap by N workers (covered by tests/integration/test_rate_bucket_redis.py)"
            - "[x] Shared vs local limiting composes safely: no redis_client wired => the per-process TokenBucket is authoritative (single-worker/dev parity); a shared limiter without a real tenant_id is rejected at the composition root (never a cross-tenant 'default' budget)"
            - "[x] Per-connector OpenTelemetry METRICS are emitted (modulo.connectors.rest.rest_metrics, lazy-initialised + exception-swallowed so metrics never surface as a connector failure): modulo_rest_request_duration_seconds histogram (host/method/outcome, one sample per logical operation), modulo_rest_outcome_total counter (closed cause-code taxonomy, labelled host), modulo_rest_retry_total, modulo_rest_ssrf_blocked_total and modulo_rest_redaction_events_total"
            - "[x] AdminConnectorsView renders a schema-driven structured form for the Generic REST connector type: flat operational config fields (base_url, method, timeout_seconds, verify_tls, on_unknown, records_path, allowed_hosts) are first-class controls, credentials (auth_mode bearer/api_key/basic + per-mode secrets) is a separate never-conflated section, and advanced/templated fields (headers, body, operations, fan_out, rate_limit) remain a JSON editor (FAR-466)"
            - "[x] Invalid method/auth_mode/on_unknown/timeout/advanced-JSON is a loud inline error, never silently accepted; the form submits operational config as config_json and auth as credentials, and leaves empty fields reset to defaults"
        deferrals:
            - Per-tenant weighted concurrency semaphore / bounded-concurrency fan-out fork — fan-out emits sequentially in v1 (no concurrent fork); throughput relies on pipeline-level concurrency limits and the connector's single connection-pooled client
            - "Per-ITEM fan-out outcome trace SPANS — operation-level OTel trace spans (from _TracedConnector: connector.<type>.query/write/health_check emitting connector.type/operation/resource/limit/result_total/error_type + duration) and per-destination outcome/latency METRICS are emitted in v1; only per-item trace spans are deferred"
            - DISTINCT classification layer (request-to-response ingestion classification runs as one opaque hop; a separate deduplicate/classify layer is deferred to FAR-404)

    feat-costs:
        description: Cost tracking, spend limits, cost controls, and cost components
        status: covered
        behaviours:
            # Cost report + run-cost aggregation (GET /api/v1/admin/costs)
            - "[x] The cost report aggregates org spend for the selected period (day/week/month/year) and groups by team or org; each item carries total_spend_usd, total_runs, a summed per-component breakdown (cost components resolved per environment) and per-org annotations, and the response surfaces org_total / org_run_count / legacy_total / has_more plus org_unassigned_components"
            - "[x] An invalid group_by or period query param is rejected with 422 (pattern-constrained, no silent fallback)"
            - "[x] The cost endpoints are admin-only: operators/viewers are refused 403 and an unauthenticated caller 401 (require_permission cost.manage)"

            # CSV export
            - "[x] GET /api/v1/admin/costs/export streams a CSV attachment (entity_id, entity_name, total_spend_usd, total_runs) with a Content-Disposition attachment; only CSV is supported and the period aliases (this_month / last_month / 7d / 30d / 90d) map onto the month/week/year report periods"

            # Spend limits
            - "[x] GET /api/v1/admin/costs/limits returns the org daily spend limit plus one entry per team with its own daily limit (None when unset)"
            - "[x] PUT /api/v1/admin/costs/limits/org sets or clears (explicit null = unlimited) the org daily spend limit; a negative limit is rejected 422"
            - "[x] PUT /api/v1/admin/costs/limits/teams/{team_id} sets or clears a team daily spend limit strictly scoped to the caller's org — a team id from another org is 404 with no mutation, a missing team is 404, and an invalid id or negative limit is 422"

            # Spend-limit / token-budget / circuit-breaker enforcement at run finalize
            - "[x] Org and team daily spend limits are enforced at run finalization: an over-budget run is permanently refused with reason daily_limit_exceeded:organisation / daily_limit_exceeded:team and the run count is not incremented (BDD cost_controls.feature)"
            - "[x] A per-agent token budget is a hard stop: exceeding an agent's budget terminalizes the run as 'budget_exceeded' with the message 'This run exceeded its token budget.'; within budget no override applies and a budget-check failure is fail-open (test_cost_token_budget.py)"
            - "[x] A pipeline circuit breaker trips when the pipeline's rolling monthly spend crosses its threshold, permanently pausing the pipeline trigger until an admin re-enables it; an already-tripped pipeline fails closed (test_circuit_breaker.py)"

            # Cost controls + hard spend ceilings (FAR-391)
            - "[x] GET /api/v1/admin/costs/controls returns teams with daily limits, the org budget, max_run_cost / spend_ceiling (USD at the API boundary, stored as integer cents), org_cumulative_spend_usd, alert thresholds, the circuit-breaker toggle, currency (USD/EUR/GBP) and billing period (monthly/quarterly/annual)"
            - "[x] PUT /api/v1/admin/costs/controls updates cost-control fields; alert_thresholds must be a non-empty list of integers in 1..100 (422 otherwise) and omitted fields are preserved"
            - "[x] The dedicated /ceiling surface manages max_run_cost (per-run) and spend_ceiling (per-org) independently: explicit null clears one ceiling back to unlimited, omitting a field leaves it unchanged, and 0 is a kill-switch; remaining_budget_usd is derived from the org ceiling (test_spend_ceiling_endpoints.py)"
            - "[x] Ceiling enforcement runs before the daily-ledger write: a run exceeding its per-run ceiling or the org cumulative ceiling has its ledger refused (never billed beyond the ceiling) and terminalizes as 'cost_ceiling_exceeded' — except an explicit cancelled status, which is preserved; within ceilings the org cumulative spend is incremented (test_cost_finalize_ceiling.py)"
            - "[x] POST /api/v1/admin/costs/circuit-breaker/{pipeline_id}/reset re-enables a tripped pipeline and re-activates its non-deleted triggers; a missing pipeline is 404"

            # Cost components + formula engine (ADR 019)
            - "[x] Cost-component CRUD lives under /api/v1/admin/costs/components (list / create / update / delete) with an org-level component cap and 409 on a duplicate name"
            - "[x] Component authoring is cross-field validated: self_reported components require a null formula, calculated components require a formula, a rate component requires a source or a registered rate fallback (only e2b_rate), and reserved component names / report keys are rejected (test_cost_components_crud.py)"
            - "[x] The cost formula engine is a hand-rolled tokenizer + recursive-descent parser supporting only + - * /, unary minus and parentheses over a whitelisted identifier registry — no eval; unknown identifiers, division by zero, nesting-depth / length cap breaches and attack strings are rejected (ADR 019, test_cost_formula.py)"

            # Scheduled cost reports
            - "[x] Scheduled cost reports (/reports) are create/list/delete: a report is created (201) with period daily|weekly|monthly, group_by team|org, format csv|json, at least one recipient and a one_time/recurring schedule; missing recipients or an unsupported grouping is 422; delete is 204 and a missing report is 404"

            # Spend anomaly detection
            - "[x] Cost anomalies are surfaced from the org daily-spend ledger: a day whose spend exceeds 2x the rolling 7-day average is reported (fresh detections merge with stored rows so dismissals survive), and dismissing an anomaly is a 204 POST with 404 for a missing one"
        deferrals:
            - "No pre-flight / predictive run-cost ESTIMATE — spend limits and ceilings are enforced reactively at run finalization; there is no 'this run will cost ≈X' projection before dispatch"
            - "Cost-probe ledger self-healing (core/cost_controller/probe.py) tracks run-total vs breakdown consistency as an operational probe, not a surfaced admin report"
