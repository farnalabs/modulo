features:
    feat-auth:
        description: OAuth authorization, sessions, and user profile
    feat-analytics:
        description: Reporting and analytics over runs, costs, and facts
    feat-audit:
        description: Audit trail and audit log
    feat-connectors:
        description: External tool connectors
    feat-costs:
        description: Cost tracking, spend limits, cost controls, and cost components
    feat-dashboard:
        description: Home dashboard, metrics overview, and saved views
    feat-environments:
        description: Environment profiles and run environments
    feat-evals:
        description: Evaluation editor and proposal queue
    feat-feedback:
        description: Feedback inbox
    feat-guardrails:
        description: Guardrail policies
    feat-hitl:
        description: Human-in-the-loop approval gates and review
    feat-library:
        description: Reusable pipeline templates and the template library
    feat-license:
        description: Feature licensing and plan tiers
    feat-lifecycle-maps:
        description: Lifecycle maps and stage workflows
    feat-mcp:
        description: Model Context Protocol tool configuration
    feat-model-backends:
        description: Model backend management and setup
    feat-notifications:
        description: Notifications, email delivery, and notification logs
    feat-observability:
        description: Error dashboard, monitoring, and observability exports
    feat-onboarding:
        description: First-run onboarding wizard for new users and organizations
    feat-org:
        description: Organization settings and feature flags
    feat-pipelines:
        description: Visual pipeline editor, composite editor, and node categories
    feat-plugins:
        description: Plugin registry
    feat-product-analytics:
        description: Product usage and adoption analytics for system administrators
    feat-remy:
        description: Remy assistant configuration and skills
    feat-runs:
        description: Run execution, history, detail, and output diffs
    feat-runtime:
        description: Runtime configuration, rate limits, retention, and sandbox concurrency
    feat-schemas:
        description: Typed JSON schemas, schema editor, inference, and parameter schemas
    feat-sso:
        description: Single sign-on (SSO)
    feat-system-config:
        description: System-level configuration administration
    feat-system-orgs:
        description: System-level organization administration
    feat-teams:
        description: Users, teams, and role-based access
    feat-triggers:
        description: Manual, webhook, and scheduled triggers
    feat-variants:
        description: Variant comparison and AB test models
