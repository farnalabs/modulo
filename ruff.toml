line-length = 120
target-version = "py312"
exclude = ["*.feature", "node_modules", ".git", "__pycache__", "*.egg-info", ".semgrep/tests/"]

[lint]
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "S",
    "ASYNC",
    "RUF",
    "SIM",
    "C4",
    "T20",
    "RET",
    "PYI",
    "FURB",
    # Defensive gate-strengthening: every rule below was verified to have zero
    # current violations (run `ruff check . --extend-select <codes> --statistics`),
    # so enabling them tightens the lint gate against future regressions without
    # touching existing code.
    "G001", "G002", "G003", "G004", "G201",
    "PERF101", "PERF203", "PERF402", "PERF403",
    "PT020", "PT021",
    "Q000", "Q003",
]
ignore = [
    "S101",
    "S105",
    "B008",
]

[lint.per-file-ignores]
"scripts/*" = ["T20", "E402", "E501", "S106", "S603", "S607", "S608", "RUF005", "ASYNC240"]
"backend/scripts/*" = ["T20"]
".github/scripts/*" = ["T20"]
"deploy/*" = ["T20", "S108"]
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S112", "S311", "B007", "B008"]
"docs/**" = ["T20"]
".semgrep/**" = ["F821"]
"docs/api/examples/**" = ["T20", "S108"]
"backend/tests/unit/runtime_provider/*" = ["E402"]
"backend/tests/unit/secrets_backend/*" = ["E402"]
"backend/src/modulo/db/migrations/**" = ["RUF002", "RUF003", "E501"]
"backend/src/modulo/api/routes/scim.py" = ["N803", "N815"]
"backend/src/modulo/api/routes/triggers.py" = ["UP017"]
"backend/src/modulo/core/cron_scheduler.py" = ["UP017"]
"backend/src/modulo/core/reports/scheduler.py" = ["UP017"]
"backend/src/modulo/core/trigger_engine/polling.py" = ["UP017"]
"pipeline-scripts/**" = ["S", "T201", "RET"]
"conftest.py" = ["I001"]
