    # flake8-use-pathlib: every member of the family now has zero current call
    # sites across the whole tree (incl. scripts/, which were migrated to match)
    # — the PTH118/PTH120/PTH123 backlog was cleared in a scan-by-scan migration.
    "PTH100", "PTH101", "PTH102", "PTH103", "PTH104", "PTH105", "PTH106", "PTH107",
