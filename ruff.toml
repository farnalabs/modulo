    "PTH208", "PTH210", "PTH211",
    # flake8-logging hygiene: logger must be obtained via getLogger() with
    # __name__ (LOG001/LOG002), never the deprecated WARN constant (LOG009),
    # never a root-logger call (LOG015).
    "LOG001", "LOG002", "LOG009", "LOG015",
    # Sixth wave of defensive gate-strengthening (verified zero current
    # violations with ruff==0.16.5: `ruff check . --extend-select <codes>
    # --statistics`). Mirrors the backend/pyproject.toml gate. These families
    # close drift and block future regressions: B007 (unused loop variable),
    # B904 (raise without `from` — chain exceptions), RUF009/RUF012/RUF013
    # (mutable defaults / typed-class hygiene), the TODO-comment TD family
    # (author/link/capitalization hygiene), and FIX001 (no stray FIXME).
    "B007", "B904",
    "RUF009", "RUF012", "RUF013",
    "TD004", "TD006", "TD007",
    "FIX001",
    # flake8-datetimez: production time handling must be timezone-aware;
    # remaining violations are intentional naive datetime fixtures in tests/,
    # covered by the tests/** per-file-ignore.
    "DTZ",
    # Seventh wave of defensive gate-strengthening (verified zero current
    # violations with ruff==0.16.5 under both this gate and the
    # backend/pyproject.toml gate: `ruff check . --select PT023,PT026`).
    # Mirrors the backend/pyproject.toml gate. Upon any future regression the
    # newly-flagged decorators must be normalized rather than re-ignored.
    "PT023",  # consistent @pytest.mark.<marker>() parentheses style
    "PT026",  # reject useless arg-free @pytest.mark.usefixtures()
    # Eighth wave of defensive gate-strengthening (verified zero current
    # violations with ruff==0.16.5 under both this gate and the
    # backend/pyproject.toml gate: `ruff check . --select PT001,PT002,PT003,
    # PT007,PT008,PT009,PT010,PT014,PT015,PT016,PT017,PT022,PT024,PT025,PT030,
    # PT031 --statistics`). Mirrors the backend/pyproject.toml gate. These
    # pytest-style rules are all pass-to-enable (zero current violations across
    # the whole tree), so enabling them tightens the test-quality gate against
    # future regressions without touching existing tests.
    "PT001",  # consistent @pytest.fixture() parentheses style
    "PT002",  # no positional arguments to @pytest.fixture()/@pytest.mark.parametrize()
    "PT003",  # @pytest.fixture(scope=...) should not be spelled with scope="function"
    "PT007",  # @pytest.mark.parametrize() values must be a collection, not a bare dict/list
    "PT008",  # no lambda argument to mocker.patch()
    "PT009",  # use plain asserts rather than unittest-style assertEquals() etc.
    "PT010",  # pytest.raises()/pytest.warns() must name at least one exception/warning
    "PT014",  # no duplicated test cases in @pytest.mark.parametrize()
    "PT015",  # no assert that is always False
    "PT016",  # no pytest.fail() without a message
    "PT017",  # no assert inside an except block
    "PT022",  # no unused-yield fixture (use plain return instead)
    "PT024",  # no redundant @pytest.mark.asyncio on an already-coroutine fixture
    "PT025",  # no erroneous use_fixtures() marker on a fixture
    "PT030",  # pytest.warns() too broad (bare Exception) — narrow to the concrete warning
    "PT031",  # pytest.warns() with multiple statements — assert inside the block
    # Ninth wave of defensive gate-strengthening: unlike the pass-to-enable waves
    # above, these rules had a small existing backlog that this PR FIXED, so the
    # gate now also locks the fixes in against future regressions (verified zero
    # remaining violations with ruff==0.16.5 under both the backend and repo-root
    # gates: `ruff check . --select LOG004,LOG014,PLW1510,ARG003,ARG004
    # --statistics`). Mirrors the backend/pyproject.toml gate.
    "LOG004",  # logger.exception() must not be used outside an exception handler
    "LOG014",  # exc_info= must carry the real exception, not rely on ambient state
    "PLW1510", # subprocess.run() needs an explicit `check=` argument
    "ARG003",  # unused class-method argument
    "ARG004",  # unused static-method argument
    # Tenth wave of defensive gate-strengthening: pass-to-enable rules that
    # tighten logging correctness (LOG007/G010/G101/G202), string-quote
    # consistency (Q001/Q002) and stdlib modernization (UP033). Verified zero
    # current violations under both the repo-root and backend gates with
    # ruff==0.16.5: `ruff check . --select LOG007,G010,G101,G202,Q001,Q002,
    # UP033 --statistics`. Mirrors the backend/pyproject.toml gate. (FLY002 was
    # evaluated and dropped: the one join site feeds raw SQL text, so the S608
    # security gate and FLY002 cannot both be satisfied there.)
    "LOG007",  # logging.exception() must not set exc_info=False (defeats its capture)
    "G010",    # logger.warn() is deprecated — use logger.warning()
    "G101",    # logging `extra=` key must not clash with a LogRecord attribute
    "G202",    # no redundant exc_info= on logging calls that pass an exception
    "Q001",    # multiline string quote style must follow the configured inline-quotes
    "Q002",    # docstring quote style must follow the configured inline-quotes
    "UP033",   # @lru_cache(maxsize=None) → @functools.cache
    # Tenth wave (backend sync): T10/TID families block future regressions
    # (verified zero current violations with ruff==0.16.5:
    # `ruff check . --extend-select T10,TID --statistics`).
    "T10",     # no committed debuggers (pdb/ipdb/breakpoint)
    "TID",     # tidy imports — absolute imports only, no out-of-package relatives
    # Eleventh wave of defensive gate-strengthening (a small fixed backlog, then
    # pass-to-enable): PT006/PT013 had a handful of violations that this PR
    # FIXED (verified zero remaining with ruff==0.16.5: `ruff check .
    # --select PT006,PT013 --statistics`). Mirrors the backend/pyproject.toml gate.
    "PT006",   # @pytest.mark.parametrize() names must be a tuple, not a bare str
    "PT013",   # no shadowing `import pytest as _pytest` when `import pytest` exists
]
