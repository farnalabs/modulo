    # B904 (raise without `from` — chain exceptions), RUF009/RUF012/RUF013
    # (mutable defaults / typed-class hygiene), the TODO-comment TD family
    # (author/link/capitalization hygiene), and FIX001 (no stray FIXME).
    "B007", "B904",
    "RUF009", "RUF012", "RUF013",
    "TD004", "TD006", "TD007",
    "FIX001",
