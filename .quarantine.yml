# Flaky-test quarantine registry
# ==============================
# Tests listed here are known-flaky and will be marked xfail by the conftest
# plugin. Each entry must have a reason and an expiry date (ISO 8601).
# When a test's expiry is reached, the gate will refuse to merge/publish
# until either:
#   a) The test is fixed and removed from this list, or
#   b) The expiry is extended with justification.
#
# Format:
#   test_id: "path::test_name" matching pytest's nodeid convention
#   reason: "Brief explanation of flakiness"
#   expiry: "YYYY-MM-DD"
#   owner: "GitHub username or team" (optional)

quarantine:
  # Full-suite-only GC attribution (2026-11-01): an unrelated earlier unit test
  # leaks a never-awaited AsyncMock coroutine. CPython's generational GC then
  # collects it while whichever test happens to be running, so pytest's
  # unraisable-warning gate attributes the failure there. This test passes in
  # isolation and under forced gc; quarantine is a non-strict xfail while the
  # leaking test is located and fixed. PR #2681's merge run hit this victim;
  # main's run the same day hit tests/unit/trigger_engine/test_polling.py.
  # The attribution is non-deterministic under xdist, so every victim observed
  # so far is listed: the leak survives one GC pass and is collected in
  # whichever item runs next.
  - test_id: "tests/unit/test_trigger_engine_pre_guardrail.py::test_handle_webhook_observe_is_advisory"
    reason: "Unrelated leaked AsyncMock coroutine is GC'd during this test in the full unit run (CI 2026-11-01)"
    expiry: "2026-11-15"
    owner: "platform-team"
  - test_id: "tests/unit/trigger_engine/test_trigger_engine.py::test_replay_event_rate_limit_exceeded"
    reason: "Unrelated leaked AsyncMock coroutine is GC'd during this test in the full unit run (CI 2026-11-01)"
    expiry: "2026-11-15"
    owner: "platform-team"

  # Example (illustrative — remove if no currently-quarantined tests):
