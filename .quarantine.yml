# Flaky-test quarantine registry
# ==============================
# Tests listed here are known-flaky and will be marked xfail by the conftest
# plugin. Each entry must have a reason and an expiry date (ISO 8601).
# When a test's expiry is reached, the gate will refuse to merge/publish
# until either:
#   a) The test is fixed and removed from this list, or
#   b) The expiry is extended with justification.
#
# Format:
#   test_id: "path::test_name" matching pytest's nodeid convention
#   reason: "Brief explanation of flakiness"
#   expiry: "YYYY-MM-DD"
#   owner: "GitHub username or team" (optional)

quarantine:
  # Full-suite-only GC attribution (2026-11-01): an unrelated earlier unit test
  # leaked a never-awaited AsyncMock coroutine, which CPython's generational GC
  # collected while whichever test happened to be running. The attribution was
  # non-deterministic under xdist, so every victim observed was listed.
  #
  # RETIRED 2026-11-03. The leak fixes on main (FAR-2273 dependency-override
  # isolation, session-double hardening, #2725 MagicMock for sync result
  # methods) removed the source. Evidence: `tests/unit/` run with xdist and
  # `-W error::pytest.PytestUnraisableExceptionWarning` on 2026-11-03 gave
  # 45116 passed / 11 skipped / 0 failed with the quarantine file bypassed;
  # each former victim's full file also passed 3x serial and 3x under
  # `-n auto` (24 / 151 / 20 / 92 / 38 tests). If the class recurs, re-add an
  # entry with a fresh reason and expiry rather than restoring these without
  # proof.

  # Example (illustrative — remove if no currently-quarantined tests):
  # - test_id: "tests/unit/connectors/test_github.py::test_rate_limit_retry"
  #   reason: "Flaky due to GitHub API rate limit window — fails ~15% of CI runs"
  #   expiry: "2026-08-01"
  #   owner: "platform-team"
  #
  # - test_id: "tests/integration/test_websocket_reconnection.py::test_reconnect_during_deploy"
  #   reason: "Race between server shutdown and client reconnect — needs deterministic fixture"
  #   expiry: "2026-07-15"
  #   owner: "duncan"
