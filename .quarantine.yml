# Flaky-test quarantine registry
# ==============================
# Tests listed here are known-flaky and will be marked xfail by the conftest
# plugin. Each entry must have a reason and an expiry date (ISO 8601).
# When a test's expiry is reached, the gate will refuse to merge/publish
# until either:
#   a) The test is fixed and removed from this list, or
#   b) The expiry is extended with justification.
#
# Format:
#   test_id: "path::test_name" matching pytest's nodeid convention
#   reason: "Brief explanation of flakiness"
#   expiry: "YYYY-MM-DD"
#   owner: "GitHub username or team" (optional)

quarantine:
  # Non-deterministic GC victim (FAR-2674): an unrelated unit test leaks an
  # un-awaited AsyncMock coroutine that CPython collects while this bash-heavy
  # test is running, so pytest's unraisable gate wrongly attributes the
  # failure here. The test passes in isolation. Remove once the leaking test
  # is located (tracked by PR #2684).
  - test_id: "tests/unit/test_deploy_workflow_rehearsal.py::test_release_publication_hold_establishment_handles_absent_and_remote_error[2-Establish release publication hold (cut only)]"
    reason: "GC victim of an unrelated leaked AsyncMock coroutine (FAR-2674); passes in isolation"
    expiry: "2026-11-16"
    owner: "farnalabs/branch-fixer"

