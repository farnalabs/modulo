# Flaky-test quarantine registry
# ==============================
# Tests listed here are known-flaky and will be marked xfail by the conftest
# plugin. Each entry must have a reason and an expiry date (ISO 8601).
# When a test's expiry is reached, the gate will refuse to merge/publish
# until either:
#   a) The test is fixed and removed from this list, or
#   b) The expiry is extended with justification.
#
# Format:
#   test_id: "path::test_name" matching pytest's nodeid convention
#   reason: "Brief explanation of flakiness"
#   expiry: "YYYY-MM-DD"
#   owner: "GitHub username or team" (optional)

quarantine:
  - test_id: "tests/unit/test_far2005_dead_heartbeat_reap.py::TestDeadHeartbeatReapScope::test_non_running_status_is_untouched"
    reason: >-
      Ambient pre-existing AsyncMock leak (FAR-2674 / FAR-2289): an unrelated
      test's never-awaited coroutine is GC'd while this test runs in the full
      unit run, so the escalated PytestUnraisableExceptionWarning fails this
      innocent victim. Passes in isolation and under forced gc (PR #2719 CI run
      41523847563, 2026-11-02).
    expiry: "2026-11-17"
    owner: "platform-team"

  # Example (illustrative — remove if no currently-quarantined tests):
