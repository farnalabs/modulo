# Flaky-test quarantine registry
# ==============================
# Tests listed here are known-flaky and will be marked xfail by the conftest
# plugin. Each entry must have a reason and an expiry date (ISO 8601).
# When a test's expiry is reached, the gate will refuse to merge/publish
# until either:
#   a) The test is fixed and removed from this list, or
#   b) The expiry is extended with justification.
#
# Format:
#   test_id: "path::test_name" matching pytest's nodeid convention
#   reason: "Brief explanation of flakiness"
#   expiry: "YYYY-MM-DD"
#   owner: "GitHub username or team" (optional)
#
# REGISTRY EMPTY (2026-11-03). The 2026-11-01 GC-attribution class has not
# reproduced on main since the leak fixes (FAR-2273 dependency-override
# isolation, session-double hardening, #2725 MagicMock for sync result
# methods). In that class an unrelated earlier unit test leaked a never-awaited
# AsyncMock coroutine; CPython's generational GC then collected it while an
# arbitrary innocent test was running, so the escalated unraisable-warning gate
# blamed that victim. The attribution was non-deterministic under xdist, which
# is why every observed victim was listed while the leak was live.
#
# All 13 remaining victims were retired 2026-11-03 after validation on main @
# 3e51fd5fb with the registry bypassed (`-o quarantine_file=<empty>`):
#   * 3 x full `tests/unit/` under `-n auto` with
#     `-W error::pytest.PytestUnraisableExceptionWarning`:
#     45427 passed, 11 skipped, exit 0 on every run (wall 18:33, 16:26, 15:37);
#     zero PytestUnraisableExceptionWarning occurrences.
#   * each former victim's nodeid: 3 serial runs, plus 3 `-n auto` runs of its
#     file / surrounding directory, all green.
# A single green run would not have justified retirement, because the class is
# GC-timing dependent; the entries were removed only after all of the above.
#
# This file is the mechanism, not a to-do list. Entries are non-strict xfail, so
# any test that no longer reproduces simply XPASSes. Re-add a newly observed
# flake with a reason and an expiry; an entry missing either is not accepted.
# Keep this header, the format below and the requirement intact.

quarantine: []

