# Flaky-test quarantine registry
# ==============================
# Tests listed here are known-flaky and will be marked xfail by the conftest
# plugin. Each entry must have a reason and an expiry date (ISO 8601).
# When a test's expiry is reached, the gate will refuse to merge/publish
# until either:
#   a) The test is fixed and removed from this list, or
#   b) The expiry is extended with justification.
#
# Format:
#   test_id: "path::test_name" matching pytest's nodeid convention
#   reason: "Brief explanation of flakiness"
#   expiry: "YYYY-MM-DD"
#   owner: "GitHub username or team" (optional)

