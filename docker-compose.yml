services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modulo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: modulo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modulo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DATABASE_URL: postgresql+asyncpg://modulo_app:${POSTGRES_PASSWORD:-changeme}@db:5432/modulo
      DATABASE_ADMIN_URL: postgresql+asyncpg://modulo:${POSTGRES_PASSWORD:-changeme}@db:5432/modulo
      # modulo_system (LOGIN, BYPASSRLS) role URL. The entrypoint's
      # bootstrap_role parses the password out of THIS URL when it creates or
      # alters the role, so the role and the URL can never disagree; the
      # backend's cross-org reads (pre-auth SSO provider lookup, Fernet key
      # rotation) use the same URL. Same password as modulo_app by design.
      MODULO_SYSTEM_DATABASE_URL: postgresql+asyncpg://modulo_system:${POSTGRES_PASSWORD:-changeme}@db:5432/modulo
      MODULO_DB: postgres
      SECRET_KEY: modulo-docker-compose-secret-key-32bytes!
      FERNET_KEY: modulo-docker-compose-fernet-key-min-32-bytes!!
      REDIS_URL: redis://redis:6379/0
      MODULO_PUBLIC_URL: http://localhost:8000
      MODULO_USERS: admin:admin
      # The DB capacity monitor (FAR-1882) auto-detects capacity from the
      # Postgres data volume by default. Mount it read-only at
      # DB_CAPACITY_PATH (the default, stated here so mount and setting cannot
      # drift) and the 98% hard-stop arms itself with no DB_CAPACITY_BYTES set.
      DB_CAPACITY_PATH: /var/lib/modulo/db-volume
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./frontend/src/manifest.yaml:/app/manifest.yaml
      # Read-only: the monitor only statvfs()es it. If the container user
      # cannot traverse the mount the probe fails open (capacity "none", stop
      # inert) rather than erroring - set DB_CAPACITY_BYTES to override.
      - pgdata:/var/lib/modulo/db-volume:ro

  # SAQ runs worker — executes run jobs (plan F8 local dev). Required for any
  # pipeline execution.
  saq-runner:
    build: ./backend
    command: ["python", "-m", "saq", "modulo.core.saq_worker.runs_settings"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DATABASE_URL: postgresql+asyncpg://modulo_app:${POSTGRES_PASSWORD:-changeme}@db:5432/modulo
      MODULO_DB: postgres
      SECRET_KEY: modulo-docker-compose-secret-key-32bytes!
      FERNET_KEY: modulo-docker-compose-fernet-key-min-32-bytes!!
      REDIS_URL: redis://redis:6379/0
      MODULO_PUBLIC_URL: http://localhost:8000
      MODULO_USERS: admin:admin
      # DB capacity monitor (FAR-1882). This worker EXECUTES runs, and two
      # run-creation paths run inside that execution: agent-signal child runs
      # (executor._fire_agent_signals -> trigger_engine.agent_signal) and
      # feedback reject-correction runs (node_runner._dispatch_reject_correction
      # -> feedback_manager) - both reaching crud.run.create_run. Without the
      # volume visible here those runs resolve capacity "none" and the 98%
      # hard-stop is inert for them.
      DB_CAPACITY_PATH: /var/lib/modulo/db-volume
    volumes:
      - ./backend/src:/app/src
      # Read-only: the monitor only statvfs()es it. If the container user
      # cannot traverse the mount the probe fails open (capacity "none", stop
      # inert) rather than erroring - set DB_CAPACITY_BYTES to override.
      - pgdata:/var/lib/modulo/db-volume:ro

  # SAQ system worker — owns the scheduler (fire_due_triggers) + reconcile +
  # system crons (plan F8). REQUIRED for local cron/triggers. Web UI bound to
  # 127.0.0.1:8081 via the custom runner.
  saq-system:
    build: ./backend
    command: ["python", "-m", "modulo.core.saq_worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DATABASE_URL: postgresql+asyncpg://modulo_app:${POSTGRES_PASSWORD:-changeme}@db:5432/modulo
      # Required: dispatcher_reconcile (and the other cross-org system crons)
      # build their session factory from this URL and FAIL CLOSED without it
      # (core/cron_helpers.py::_get_system_engine raises), so the cron never
      # runs, no stats heartbeat is ever written, and /healthz/ready reports
      # dispatcher_reconcile `unavailable` — which GATES readiness (503).
      MODULO_SYSTEM_DATABASE_URL: postgresql+asyncpg://modulo_system:${POSTGRES_PASSWORD:-changeme}@db:5432/modulo
      MODULO_DB: postgres
      SECRET_KEY: modulo-docker-compose-secret-key-32bytes!
      FERNET_KEY: modulo-docker-compose-fernet-key-min-32-bytes!!
      REDIS_URL: redis://redis:6379/0
      MODULO_PUBLIC_URL: http://localhost:8000
      MODULO_USERS: admin:admin
      SAQ_AUTH_USERNAME: admin
      SAQ_AUTH_PASSWORD: modulo
      DB_CAPACITY_PATH: /var/lib/modulo/db-volume
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./backend/src:/app/src
      # Cron/polling triggers create their runs in THIS process
      # (cron_helpers.fire_cron_trigger / _run_poll_fire / _create_ongoing_runs
      # all call crud.run.create_run), which is where the 98% hard-stop is
      # enforced - so the volume must be visible here too (FAR-1882).
      - pgdata:/var/lib/modulo/db-volume:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

  # Health watchdog — Gatus (https://gatus.io), config-as-code in
  # deploy/watchdog/. Probes the backend's readiness over the compose network
  # and tells the operator when Modulo is unhealthy — including when the app is
  # fully down, which is the one failure the app cannot report about itself.
  # Enabled by default: it comes up with `docker compose up`.
  #
  # No `depends_on` on the backend, deliberately — this service is the thing
  # that reports the backend being unhealthy, so it must start regardless.
  #
  # Monitoring is on from the first `up`; email alerting stays off until
  # SMTP_HOST / SMTP_PORT / EMAIL_FROM / ALERT_EMAIL_TO are set (the same
  # variables the app uses for HITL email — one SMTP setup serves both). With
  # them unset the container logs one line saying so and keeps monitoring.
  # See deploy/watchdog/README.md and docs/deployment.md §Health watchdog.
  watchdog:
    build: ./deploy/watchdog
    restart: unless-stopped
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    volumes:
      - ./deploy/watchdog/config.yaml:/config/config.yaml:ro
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      # Exec form — the derived image has busybox wget but no shell-form is
      # needed. Exits non-zero when the dashboard does not answer, so a wedged
      # watchdog is visible as `unhealthy` in `docker ps`.
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
