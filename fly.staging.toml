app = 'staging-modulo'

# ===== Machine budget (stay within the org limit) =====
# Standing footprint (verified live 2026-09-02 via `fly scale show`): 1 x app
# (2 CPU, 2gb) + 1 x worker (1 CPU, 2gb) = 2 machines. The [[vm]] blocks below match
# the live machines exactly.
# Whole-org standing (verified 2026-09-02): 11 machines across 7 apps in org
# `personal`, ~8 started 24/7: app-modulo 3 + staging-modulo 2 + modulo-telemetry 2
# (fra, 1 running) + library-modulo 1 (ams, autostop, mostly stopped) + 3 Fly MPG
# Postgres machines (modulo-app-db 2CPU/4gb, modulo-staging-db, library-modulo-db).
# MPG machines bill as separate "MPG Cluster" lines, NOT in the "Machines" usage
# lines (verified against the Aug 2026 invoice). demo-modulo (fly.demo.toml) is NOT
# provisioned - no app, no machines, no cost.
# Staging-specific: every staging deploy launches a one-off pre-migrate machine
# (shared-cpu-1x / 1gb, deploy.yml "Pre-deploy migrations"), destroyed after the
# deploy (`if: always()`); it bills in the 1x "Machines" lines while it runs.
# Rolling deploys peak at N+1 per process group. There is no automated budget guard
# in CI: deploy.yml only prunes group-less strays ("Clean up stray machines") - a
# GROUPED stray is never auto-cleaned; run `fly machines list -a staging-modulo`
# after incidents. The limit is enforced by this standing footprint + manual review
# before scaling up.
# Do NOT add process groups or machines without updating this block.
primary_region = 'lhr'

[deploy]
  strategy = 'rolling'

[release]
  command = "/release.sh"

[build]
  dockerfile = "backend/Dockerfile.fly"

[processes]
  app = ""
  worker = ""

# Web process group — nginx + uvicorn, handles HTTP traffic
[[restart]]
  processes = ['app']
  policy = "never"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1  # budget: staging runs 1 app machine (scaled down 2026-08-15 to stay within the org machine limit)
  processes = ['app']
  # Graceful worker drain window (plan F8).
  kill_timeout = 120

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "240s"
    method = "GET"
    path = "/healthz/ready"
    protocol = "http"

[env]
  MODULO_DB = "postgres"
  # MODULO_SYSTEM_DATABASE_URL is DERIVED AT BOOT (not set here): bootstrap_db.py
  # derives it from DATABASE_URL with the modulo_system role (LOGIN, BYPASSRLS)
  # and entrypoint.sh exports it. It contains a password, so no literal value.
  MODULO_PUBLIC_URL = "https://staging.modulo.run"
  MODULO_PLUGIN_DISCOVERY = "false"
  # Staging-only dev-mode toggle (preview/in-development features via Admin > Feature Flags).
  MODULO_DEV_MODE = "true"
  MODULO_MAX_LOCAL_CONCURRENCY = "4"
  # 2026-09 Redis-usage audit (August Fly invoice) — CANONICAL derivation for
  # BOTH Fly apps: fly.toml cites this block instead of duplicating it.
  #
  # Billing facts: both Fly Redis DBs sit on the Fixed 250MB plan (flat
  # $15/mo, verified 2026-09-02 via `flyctl redis list`: modulo-app-redis and
  # modulo-staging-redis both show plan=Fixed 250MB, eviction enabled, read
  # region ams — the switch took effect). The August invoice ($15.00 prod /
  # $14.03 staging) is the flat/prorated plan price, NOT a PAYG runaway.
  #
  # Why PAYG was rejected: SAQ issues one blocking blmove dequeue poller per
  # concurrency slot (NOT gated by max_concurrent_ops — see
  # saq_worker._effective_redis_pool_size), re-issued every 5s, so polling
  # volume scales linearly with SAQ_WORKER_CONCURRENCY. Staging ran prod
  # parity (2 workers x 20 slots = 40 blocking dequeue pollers ~= 691k dequeue
  # commands/day) plus the system worker's 14 cron-registration EVALSHAs per
  # 5s schedule tick (~276k commands/day) — ~46M commands/month projected at
  # ~$87/mo — all for ~zero human traffic.
  #
  # Staging decision: concurrency 2 per worker (2 slots x 2 workers = 4
  # pollers, ~= 69k dequeue commands/day, a ~10x cut) — still covers staging's
  # preview/e2e runs. Pool invariant (code-accurate): the EFFECTIVE pool is
  # >= concurrency + 5 via the max() floor in
  # saq_worker._effective_redis_pool_size (10 >= 2 + 5, within the settings
  # cap of 50). This trims load/bandwidth rather than billing on Fixed, but is
  # the prerequisite if staging ever returns to PAYG. Prod keeps 20/50 (see
  # fly.toml) and stays cheapest on Fixed while traffic is real.
  SAQ_WORKER_CONCURRENCY = "2"
  # Code-accurate invariant: the effective pool is >= SAQ_WORKER_CONCURRENCY
  # + 5 (max() floor in saq_worker._effective_redis_pool_size — every
  # concurrent blocking dequeue holds one pool connection, plus a 5-connection
  # reserve for the upkeep ops schedule/sweep/abort/worker_info).
  SAQ_REDIS_POOL_SIZE = "10"
  # REQUIRED: Upstash Redis instance. Create with:
  #   fly redis create --name modulo-staging-redis -r lhr,ams --enable-eviction
  # Then store its connection string with `fly secrets set REDIS_URL=...`.
  CORS_ORIGINS = "https://modulo.run,https://staging.modulo.run,http://localhost:5173"

# Worker process-group health check (ADR 021). Top-level [checks], not a service
# check — it does not affect routing. The worker container exposes a liveness
# server on 8082 (entrypoint.sh worker branch) that returns 200 only while BOTH
# SAQ worker subprocesses (runs + system) are alive.
[checks]
  [checks.worker_health]
    interval = "15s"
    timeout = "5s"
    grace_period = "240s"
    method = "GET"
    path = "/"
    port = 8082
    type = "http"
    processes = ['worker']

# Worker process group — SAQ workers only, ALWAYS restart (ADR 021).
# policy = "always" restarts the machine no matter the exit code. "on-failure"
# only restarts a non-zero exit, so a worker machine a rolling deploy leaves
# `stopped` (clean exit / SIGTERM teardown) stays down — the 2026-08-08 prod
# outage. "always" is the Fly-documented policy for long-running background
# workers: crash, clean exit, or deploy replacement all self-heal.
[[restart]]
  processes = ['worker']
  policy = "always"

[[vm]]
  processes = ['app']
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2

[[vm]]
  processes = ['worker']
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
