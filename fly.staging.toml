app = 'staging-modulo'
primary_region = 'lhr'

[deploy]
  strategy = 'rolling'

[build]
  dockerfile = "backend/Dockerfile.fly"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"
    protocol = "http"

[env]
  MODULO_DB = "postgres"
  MODULO_PUBLIC_URL = "https://staging.modulo.run"
  MODULO_PLUGIN_DISCOVERY = "false"
  MODULO_MAX_LOCAL_CONCURRENCY = "4"
  # REQUIRED: Upstash Redis instance. Create with:
  #   fly redis create --name modulo-staging-redis -r lhr,ams --enable-eviction
  # Then store its connection string with `fly secrets set REDIS_URL=...`.
  CORS_ORIGINS = "https://modulo.run,https://staging.modulo.run"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
