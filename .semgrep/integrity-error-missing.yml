rules:
  - id: integrity-error-missing-in-route
    patterns:
      - pattern-inside: |
          @$ROUTER.$METHOD(...)
          async def $HANDLER(...):
            ...
      - pattern-either:
        - pattern: |
            try:
              ...
            except ProgrammingError:
              ...
        - pattern: |
            try:
              ...
            except ProgrammingError as $E:
              ...
      - pattern-not: |
          try:
            ...
          except IntegrityError:
            ...
          except ProgrammingError:
            ...
      - pattern-not: |
          try:
            ...
          except IntegrityError as $E:
            ...
          except ProgrammingError:
            ...
      - pattern-not: |
          try:
            ...
          except IntegrityError:
            ...
          except ProgrammingError as $E:
            ...
      - pattern-not: |
          try:
            ...
          except IntegrityError as $E:
            ...
          except ProgrammingError as $F:
            ...
    message: "Route catches ProgrammingError but not IntegrityError — add `except IntegrityError: raise HTTPException(status_code=409, detail=...)` before ProgrammingError"
    languages: [python]
    severity: WARNING
    paths:
      include: ["**/backend/src/**"]
