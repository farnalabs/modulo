rules:
  - id: sandbox-create-without-wait-for
    patterns:
      - pattern: await AsyncSandbox.create(...)
      - pattern-not-inside: await asyncio.wait_for(...)
    message: "AsyncSandbox.create() hangs if E2B API is slow — wrap in await asyncio.wait_for(AsyncSandbox.create(...), timeout=120)"
    languages: [python]
    severity: ERROR
    paths:
      include: ["**/backend/src/**"]

  - id: sandbox-kill-without-wait-for
    patterns:
      - pattern: await $S.kill(...)
      - pattern-not-inside: await asyncio.wait_for(...)
    message: "sandbox.kill() hangs if E2B API is slow — wrap in await asyncio.wait_for(sandbox.kill(request_timeout=30), timeout=30)"
    languages: [python]
    severity: ERROR
    paths:
      include: ["**/backend/src/**"]

  - id: sandbox-commands-run-without-wait-for
    patterns:
      - pattern: await $S.commands.run(...)
      - pattern-not-inside: await asyncio.wait_for(...)
    message: "sandbox.commands.run() may hang — wrap in await asyncio.wait_for(sandbox.commands.run(...), timeout=sandbox_timeout)"
    languages: [python]
    severity: ERROR
    paths:
      include: ["**/backend/src/**"]

  - id: sandbox-files-read-without-wait-for
    patterns:
      - pattern: await $S.files.read(...)
      - pattern-not-inside: await asyncio.wait_for(...)
    message: "sandbox.files.read() may hang — wrap in await asyncio.wait_for(sandbox.files.read(..., request_timeout=30), timeout=30)"
    languages: [python]
    severity: ERROR
    paths:
      include: ["**/backend/src/**"]

  - id: sandbox-files-write-without-wait-for
    patterns:
      - pattern: await $S.files.write(...)
      - pattern-not-inside: await asyncio.wait_for(...)
    message: "sandbox.files.write() may hang — wrap in await asyncio.wait_for(sandbox.files.write(...), timeout=30)"
    languages: [python]
    severity: ERROR
    paths:
      include: ["**/backend/src/**"]

  - id: agent-prompt-empty-default
    patterns:
      - pattern-either:
          - pattern: $NODE.get("agent_prompt") or ""
          - pattern: $NODE.get("agent_prompt", "")
    message: "empty agent_prompt causes opencode to hang with no instructions — always provide a non-empty prompt template. If optional, validate before dispatch."
    languages: [python]
    severity: ERROR
    paths:
      include: ["**/backend/src/**"]

  - id: agent-prompt-empty-literal
    pattern: '"agent_prompt": ""'
    message: "empty agent_prompt in pipeline config causes opencode to hang — provide a non-empty prompt template"
    languages: [json]
    severity: ERROR
    paths:
      include: ["**/backend/**", "**/tests/**"]
