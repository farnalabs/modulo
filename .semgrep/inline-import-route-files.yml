rules:
  - id: inline-import-route-files
    patterns:
      - pattern-either:
          - pattern: |
              import $MODULE
          - pattern: |
              from $X import $Y
      - pattern-inside: |
          async def $NAME(...):
            ...
    paths:
      include:
        - "**/*/api/routes/*.py"
    message: |
      Module-level imports are preferred over inline imports inside route handler
      functions. Inline imports in route files should only be used for lazy imports
      that break circular dependencies. Move `import $MODULE` to the top of the file.
    severity: WARNING
    languages:
      - python
