# Migration f-string SQL (FAR-915 / GitHub #133).
#
# Migration authoring convention:
#   Alembic ``op.execute()`` cannot bind parameters, so any interpolated DDL in
#   a NEW migration must be built through an identifier guard BEFORE
#   interpolation — a ``_validate_identifier``/``_validate_role_name``-style
#   helper validating against ``^[a-z_][a-z0-9_]*$`` (see
#   ``backend/src/modulo/db/bootstrap_role.py`` for the reference pattern).
#   Interpolating raw values directly into ``op.execute(f"DROP INDEX IF
#   EXISTS {name}")`` is how an untrusted index/constraint name becomes
#   arbitrary DDL.
#
# Scope note: migrations through revision 0247 (head at FAR-915, 2026-09-16)
# already carry f-string DDL and shipped long ago — they are historical
# artifacts and are EXCLUDED below so this rule never fails a CI scan that
# has no baseline commit. Do NOT add a NEW migration to that exclude list
# unless every interpolated value in it is guarded as described above.
# ``backend/tests/unit/semgrep/test_migration_fstring_rule.py`` asserts every
# file currently present in versions/ is still covered by the exclude globs —
# it fails when the cutoff window needs extending.
#
# Pattern note: f-string structural patterns (``op.execute(text(f"$SQL"))``)
# do NOT match in this semgrep version (verified empirically against a probe
# file: structural f-string metavariables never fire) — a line-scoped
# pattern-regex is used instead, which does fire.
rules:
  - id: migration-fstring-sql
    pattern-either:
      - pattern-regex: '\b(?:op|\w+)\.execute\(\s*(?:(?:sa|sqlalchemy)\.)?text\(\s*f[RrBb]?["''][^"'']*\{'
      - pattern-regex: '\b(?:op|\w+)\.execute\(\s*f[RrBb]?["''][^"'']*\{'
    message: >-
      F-string SQL in a migration interpolates values into raw DDL.
      op.execute cannot bind parameters — validate every interpolated
      identifier/value through a regex-guard helper before interpolation
      instead of interpolating raw input.
    languages: [python]
    severity: ERROR
    paths:
      include: ["**/db/migrations/versions/**"]
      exclude:
        - "**/versions/00??_*.py"
        - "**/versions/01??_*.py"
        - "**/versions/02[0-3][0-9]_*.py"
        - "**/versions/024[0-7]_*.py"
