rules:
  - id: bare-raise-in-except
    pattern-regex: (?ms)^\s*except\s+(?:Exception|BaseException|HTTPException)\s*(?:as\s+\w+)?:\s*\n(?:\s*(?:#.*)?\n)*\s*raise\s*(?:#.*)?$
    message: "`except Exception:` handler that only contains a bare `raise` is a silent re-raise - add logging or raise a specific exception (e.g. `raise ... from exc`) so the error is actionable."
    languages: [python]
    severity: ERROR
    paths:
      include: ["**/backend/src/modulo/**"]
