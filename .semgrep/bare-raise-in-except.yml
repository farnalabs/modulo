rules:
  - id: bare-raise-in-except
    patterns:
      - pattern-inside: |
          except $EXC:
            ...
      - pattern: raise
      - pattern-not: raise $X from $Y
      - metavariable-regex:
          metavariable: $EXC
          regex: '.*Exception|.*Error'
    message: "Bare `raise` inside `except Exception:` is ambiguous — use `raise ... from None` to produce a clean error trace, or provide the specific exception context."
    languages: [python]
    severity: ERROR
    paths:
      include: ["**/backend/src/modulo/**"]
