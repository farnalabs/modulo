rules:
  - id: bare-raise-in-except
    patterns:
      - pattern-inside: |
          except $EXC_TYPE:
            ...
          $CODE
      - pattern: raise
      - metavariable-regex:
          metavariable: $EXC_TYPE
          regex: 'Exception|BaseException|HTTPException'
      - pattern-not: raise $EXC from $X
      - pattern-not: raise $EXC from None
    message: "Bare `raise` inside `except Exception:` propagates the original traceback confusingly. Use `raise ... from None` or `raise HTTPException(...) from None` to produce a clean error response."
    languages: [python]
    severity: ERROR
    paths:
      include: ["**/backend/src/modulo/**"]
