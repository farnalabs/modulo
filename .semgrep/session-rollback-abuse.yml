rules:
  - id: session-rollback-abuse
    patterns:
      - pattern: $SESSION.rollback()
      - metavariable-regex:
          metavariable: $SESSION
          regex: ^(session|db_session|db)$
    message: "session.rollback() destroys ALL uncommitted writes, including from concurrent operations. Use savepoint = await session.begin_nested() for local rollback scopes."
    languages: [python]
    severity: ERROR
    paths:
      include: ["**/backend/src/**"]
