rules:
  - id: hitl-gate-edge-mutation-outside-guard
    pattern-regex: "(?:delete|sa_delete)\\(\\s*PipelineEdge\\s*\\)|PipelineEdge\\("
    message: >
      PipelineEdge rows are the HITL-gate store. Deleting or directly
      constructing them OUTSIDE the guarded write paths (replace_pipeline_graph
      / rollback_to_snapshot / the apply_gated_edge_diff primitive in
      db/crud/) or the creation-only allowlist (clone_pipeline, templates,
      library, workflow_import_export) is a gate-weakening bypass
      (hitl-gate-removal-guard-plan.md v19 item 4). Route the write through
      replace_pipeline_graph() so the guard runs.
    languages: [python]
    severity: ERROR
    paths:
      include:
        - "**/backend/src/**"
      exclude:
        - "**/backend/src/modulo/db/crud/pipeline.py"
        - "**/backend/src/modulo/db/crud/pipeline_snapshot_versioning.py"
        - "**/backend/src/modulo/db/crud/hitl_gate_guard.py"
        - "**/backend/src/modulo/core/workflow_import_export/**"
        - "**/backend/src/modulo/api/routes/templates.py"
        - "**/backend/src/modulo/api/routes/library.py"
        - "**/backend/src/modulo/db/models/pipeline_edge.py"
