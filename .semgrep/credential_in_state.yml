rules:
  - id: credential-not-in-state
    patterns:
      - pattern: |
          $STATE["$FIELD"] = $VALUE
      - metavariable-regex:
          metavariable: $STATE
          regex: '(?i)^.*state.*$'
      - metavariable-regex:
          metavariable: $FIELD
          regex: '(api_key|secret|credential|password|token|fernet|private_key)'
    message: "Decrypted credentials must not enter LangGraph state. Use the run-scoped ConnectorHub context object instead."
    languages: [python]
    severity: ERROR
    paths:
      include: ["**/backend/src/**", "**/.semgrep/credential_in_state.py"]
