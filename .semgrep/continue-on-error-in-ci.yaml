rules:
  - id: continue-on-error-in-ci
    pattern: |
      continue-on-error: true
    paths:
      include:
        - "/.github/workflows/*.yml"
    message: >
      `continue-on-error: true` silently masks CI failures. Every CI job must
      fail when it fails. If a job's failure should not block the pipeline, use
      an explicit `if: failure()` aggregate step that reports the collected
      failure with `exit 1` instead.
    languages:
      - generic
    severity: ERROR
