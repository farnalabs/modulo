rules:
  - id: graph-write-missing-is-privileged
    patterns:
      # Cheap narrowing step: restrict candidates to the two graph-write call
      # shapes before the (more expensive) nested negative match runs.
      - pattern-either:
          - pattern: replace_pipeline_graph(...)
          - pattern: rollback_to_snapshot(...)
      # A single negated pass. The call is suppressed ONLY when BOTH guards are
      # present, which is a De Morgan rewrite (NOT A AND NOT B == NOT (A OR B))
      # of the previous two independent `pattern-not` entries. Collapsing them
      # into one `pattern-not` halves the number of deep `...` matching passes
      # over the ~13k-line files this rule protects, keeping it well inside
      # semgrep's default 5s per-rule-per-file budget so the file holding the
      # MCP call site is never skipped as a timeout.
      - pattern-not:
          pattern-either:
            - pattern: replace_pipeline_graph(..., actor=GraphWriteActor(..., is_privileged=$P, ..., caller_type=$CT, ...), ...)
            - pattern: rollback_to_snapshot(..., is_privileged=$P, ..., caller_type=$CT, ...)
    message: >
      ADR 047 service-layer backstop + hitl-gate-removal-guard-plan.md v19:
      replace_pipeline_graph() takes a required actor=GraphWriteActor(...) whose
      is_privileged and caller_type fields are required (no defaults), and
      rollback_to_snapshot() still takes required keyword-only is_privileged=
      and caller_type= arguments (no defaults). A call site that omits either is
      a runtime TypeError AND a gate-guard bypass — always pass both. For
      replace_pipeline_graph the two values live on the GraphWriteActor built
      inline at the call site; for rollback_to_snapshot they are direct keyword
      arguments. The MCP call site must pass caller_type="mcp" as a literal
      (enforced by hitl-review-mcp-caller-type.yml).
    languages: [python]
    severity: ERROR
    paths:
      include: ["**/backend/src/**"]
