rules:
  - id: raw-status-complete
    patterns:
      - pattern-either:
          - pattern: |
              $OBJ.status == "complete"
          - pattern: |
              $OBJ.status == 'complete'
          - pattern: |
              $OBJ.status != "complete"
          - pattern: |
              $OBJ.status != 'complete'
          - patterns:
              - pattern: |
                  $VAR == "complete"
              - metavariable-regex:
                  metavariable: $VAR
                  regex: '.*status.*'
          - patterns:
              - pattern: |
                  $VAR == 'complete'
              - metavariable-regex:
                  metavariable: $VAR
                  regex: '.*status.*'
          - patterns:
              - pattern: |
                  $VAR != "complete"
              - metavariable-regex:
                  metavariable: $VAR
                  regex: '.*status.*'
          - patterns:
              - pattern: |
                  $VAR != 'complete'
              - metavariable-regex:
                  metavariable: $VAR
                  regex: '.*status.*'
          - patterns:
              - pattern: |
                  $VAR in ("complete", ...)
              - metavariable-regex:
                  metavariable: $VAR
                  regex: '.*status.*'
          - patterns:
              - pattern: |
                  $VAR in ('complete', ...)
              - metavariable-regex:
                  metavariable: $VAR
                  regex: '.*status.*'
    message: |
      Raw `status == "complete"` (or `!= "complete"` / `in ("complete", ...)`)
      comparison bypasses the shared status-enum / success-predicate module
      (agent-failure UX design §15.2). A single success predicate
      `is_success = (status == 'complete' OR accepted_as_complete IS TRUE) AND ...`
      is being introduced in a later phase, so consumer code must stop treating
      raw `status == "complete"` as success. Route raw status checks through
      the shared status-enum / success-predicate module instead. Known
      pre-existing consumer sites are path-excluded below until the Phase 2
      accept-as-complete sweep (FAR-146) rewrites them.
    languages: [python]
    severity: WARNING
    metadata:
      cwe:
        - "CWE-697: Incorrect Comparison"
      license: MIT
      version: "1.0"
    paths:
      include:
        - "**/backend/src/**"
      exclude:
        # Pre-existing raw status == 'complete' consumers. These are excluded
        # ONLY until the Phase 2 accept-as-complete sweep (FAR-146) rewrites
        # them onto the shared success predicate - remove the file from this
        # list once its raw status check is gone.
        - "**/backend/src/modulo/api/routes/dashboard.py"
        - "**/backend/src/modulo/db/crud/run.py"
        - "**/backend/src/modulo/core/pipeline_execution.py"
        - "**/backend/src/modulo/core/pipeline_engine/executor.py"
        - "**/backend/src/modulo/core/saq_worker.py"
        - "**/backend/src/modulo/core/feedback_manager/__init__.py"
