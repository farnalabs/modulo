rules:
  - id: all-empty-iterable
    patterns:
      - pattern-either:
          - pattern: all($X for $Y in $Z)
          - pattern: all([$X for $Y in $Z])
      - pattern-not-inside: |
          if not $Z:
            ...
          ...
      - pattern-not: all($X for $Y in ($FIRST, ...))
      - pattern-not: all([$X for $Y in ($FIRST, ...)])
      - pattern-not: all($X for $Y in [$FIRST, ...])
      - pattern-not: all([$X for $Y in [$FIRST, ...]])
    message: "all() on empty iterable returns True — guard with `if not iterable: return False` before the all() call"
    languages: [python]
    severity: ERROR
    paths:
      include: ["**/backend/src/**"]
