rules:
  - id: hitl-gate-mcp-caller-type-literal
    patterns:
      - pattern: |
          replace_pipeline_graph(..., actor=GraphWriteActor(..., caller_type=$CT, ...), ...)
      - pattern-not: |
          replace_pipeline_graph(..., actor=GraphWriteActor(..., caller_type="mcp", ...), ...)
    message: >
      hitl-gate-removal-guard-plan.md v19 §3 item 5: the MCP call site
      (mcp_server.py update_pipeline_graph) MUST pass caller_type="mcp" as a
      LITERAL inside the GraphWriteActor(...) it builds for
      replace_pipeline_graph, never a variable. This literal is the entire MCP
      structural exclusion mechanism — a variable lets the value derive from
      request context, defeating the hardcoded-False privilege override.
      (FAR-1859 moved the six actor/auth arguments off replace_pipeline_graph's
      keyword arguments onto a required GraphWriteActor value object, so this
      rule keys on the nested GraphWriteActor(...) construction.)
    languages: [python]
    severity: ERROR
    paths:
      include:
        - "**/backend/src/modulo/api/mcp_server.py"
