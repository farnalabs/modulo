rules:
  - id: retry-loop-last-exc
    patterns:
      - pattern: |
          for $I in range(...):
            try:
              ...
            except $EXC as $E:
              ...
          ...
          raise $ERR
      - pattern-not: |
          for $I in range(...):
            try:
              ...
            except $EXC as $E:
              ...
              if ...:
                raise
          ...
          raise $ERR
      - pattern-not: |
          for $I in range(...):
            try:
              ...
            except $FINAL:
              ...
              if $I == ...:
                raise
            ...
          ...
          raise $ERR
    message: "Retry exhaustion raises a new exception without chaining the last caught error"
    languages: [python]
    severity: ERROR
    paths:
      include: ["**/backend/src/**"]
