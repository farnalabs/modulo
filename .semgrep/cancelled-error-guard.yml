rules:
  - id: missing-cancelled-error-guard
    patterns:
      - pattern-inside: |
          async def $FUNC(...):
            ...
      - pattern-either:
        - pattern: |
            try:
              ...
            except Exception:
              ...
        - pattern: |
            try:
              ...
            except Exception as $E:
              ...
      - pattern-not: |
          try:
            ...
          except asyncio.CancelledError:
            ...
          except Exception:
            ...
      - pattern-not: |
          try:
            ...
          except asyncio.CancelledError:
            ...
          except Exception as $E:
            ...
    message: "async function missing asyncio.CancelledError guard before except Exception — add `except asyncio.CancelledError: raise` before `except Exception:`"
    languages: [python]
    severity: WARNING
    paths:
      include: ["**/backend/src/**"]
