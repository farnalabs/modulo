# DEPRECATED 2026-07-11 — MariaDB override. MariaDB support was added as premature
# generality (see architecture critique 2026-07-09). Production and demo run on Postgres
# (Supabase). This file is preserved for backward compatibility but is not actively tested
# or maintained.
#
# Original usage: docker compose -f docker-compose.yml -f docker-compose.mariadb.yml up -d
# The backend env vars below are set automatically; no .env changes needed.

services:
  db:
    image: mariadb:12.3
    environment:
      MARIADB_USER: modulo
      MARIADB_PASSWORD: modulo
      MARIADB_DATABASE: modulo
      MARIADB_ROOT_PASSWORD: modulo-root
    ports:
      - "5435:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    environment:
      DATABASE_URL: mysql+aiomysql://modulo:modulo@db:3306/modulo
      MODULO_DB: mariadb

volumes:
  mariadb_data:
