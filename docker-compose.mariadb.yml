# MariaDB override — replaces Postgres with MariaDB 11.4 LTS.
# Usage: docker compose -f docker-compose.yml -f docker-compose.mariadb.yml up -d
# The backend env vars below are set automatically; no .env changes needed.

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_USER: modulo
      MARIADB_PASSWORD: modulo
      MARIADB_DATABASE: modulo
      MARIADB_ROOT_PASSWORD: modulo-root
    ports:
      - "5435:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    environment:
      DATABASE_URL: mysql+asyncmy://modulo:modulo@db:3306/modulo
      MODULO_DB: mariadb

volumes:
  mariadb_data:
