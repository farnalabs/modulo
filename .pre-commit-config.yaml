repos:
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, backend/src/, -ll, -x, backend/src/modulo/model_backends/stub/]
        pass_filenames: false

  - repo: local
    hooks:
      - id: ruff
        name: ruff (locked backend environment)
        entry: uv --directory backend run --no-sync ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format (locked backend environment)
        entry: uv --directory backend run --no-sync ruff format .
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy (locked backend environment)
        entry: uv --directory backend run --no-sync mypy --strict --ignore-missing-imports src/
        language: system
        files: ^backend/src/
        pass_filenames: false
        stages: [manual]
      - id: graph-validate
        name: graph-validate
        entry: powershell -NoProfile -File tools/graph-validate.ps1
        language: system
        files: ^docs/product-map/
        pass_filenames: false
      - id: validate-enforcement-gates
        name: validate enforcement gates
        entry: powershell -NoProfile -File tools/validate-enforcement-gates.ps1
        language: system
        files: ^(\.github/workflows/ci\.yml|AGENTS\.md)$
        pass_filenames: false
      - id: pre-commit-checks
        name: pre-commit checks (Lessons Learned)
        entry: powershell -NoProfile -File tools/run-pre-commit-checks.ps1
        language: system
        files: \.(vue|ts|py|ps1)$
        pass_filenames: false
      - id: pester
        name: Pester 5 PowerShell tests
        entry: powershell -NoProfile -File tools/run-pester-tests.ps1
        language: system
        files: ^tools/.*\.ps1$
        pass_filenames: false
        stages: [pre-commit, manual]
      - id: check-migration-heads
        name: check migration number/revision collisions
        entry: powershell -NoProfile -File tools/run-check-migration-heads.ps1
        language: system
        files: ^backend/src/modulo/db/migrations/versions/.*\.py$
        pass_filenames: false
      - id: semgrep
        name: semgrep
        entry: uv run --project backend --no-sync semgrep scan --config=.semgrep/ --error --baseline-commit=HEAD backend/src/
        language: system
        files: ^backend/src/
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.3
    hooks:
      - id: gitleaks
        args: ['--verbose']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
      - id: pip-audit
        name: pip-audit (backend)
        args:
          - backend/
        files: ^backend/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        stages: [manual]

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: uv --directory backend run lint-imports
        language: system
        files: ^backend/src/
        pass_filenames: false
      - id: generate-api-types
        name: Generate API types from OpenAPI schema
        entry: powershell -NoProfile -File frontend/scripts/generate-api-types.ps1
        language: system
        files: ^backend/src/
        pass_filenames: false
        stages: [manual]
      - id: eslint
        name: ESLint
        entry: bash -c 'cd frontend && npm run lint --if-present'
        language: system
        files: \.(vue|ts|js)$
        pass_filenames: false
      - id: vue-tsc
        name: vue-tsc type check
        entry: bash -c 'cd frontend && npm run type-check --if-present'
        language: system
        files: \.(vue|ts)$
        pass_filenames: false
        stages: [manual]
