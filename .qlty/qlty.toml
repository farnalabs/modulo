# Qlty configuration for farnalabs/modulo.
#
# Checked in so Qlty Cloud uses a deterministic config instead of
# auto-generating a temporary one on every analysis. See
# https://docs.qlty.sh/cli/analysis-configuration for the reference.
#
# Why semgrep is disabled below: the Qlty semgrep plugin's driver hardcodes
# `semgrep --config .semgrep.yaml`, but this repository keeps its Semgrep rules
# in the `.semgrep/` directory (and `.semgrepignore`). There is no root
# `.semgrep.yaml`, so the plugin errors with "unable to find a config; path
# `.semgrep.yaml` does not exist" and Qlty reports the build as errored.
# Semgrep is already run with the correct `--config=.semgrep/` invocation in
# `.github/workflows/ci.yml` and via the pre-commit hook
# (`scripts/run_semgrep.py`), so disabling the Qlty plugin does not remove
# coverage.
#
# actionlint is ENABLED (mode = "block"): the custom `ubicloud-standard-2`
# runner label is declared in `.github/actionlint.yaml`, which Qlty's
# actionlint plugin loads automatically (its `config_files` include
# `.github/actionlint.yaml`). That removes the 55 false-positive runner-label
# findings, so the plugin now runs clean and gates on genuine workflow errors.
#
# zizmor is ENABLED (mode = "comment"): `.github/zizmor.yml` (also declared in
# the plugin's `config_files`) suppresses the four accepted-decision rules
# (unpinned-uses, self-repository, cache-poisoning, secrets-inherit), and this
# PR fixed the 15 error-level template-injection findings. The remaining
# genuine design findings (excessive-permissions, artipacked, low/info-level
# template-injection) are intentionally left visible rather than suppressed, so
# the plugin reports reality. `comment` surfaces them on PRs without failing
# the quality gate on findings we have deliberately accepted.

config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  # Intentional semgrep rule test fixtures — not production code and not part
  # of any lint gate. `.semgrep/tests/` contains deliberate violations that are
  # the POINT of the fixture (the ruff findings actually raised there are
  # S110/SIM105/F841/N806, not F821). Qlty's ruff plugin passes each target
  # explicitly, and ruff's `exclude` only skips paths found by directory
  # discovery — it does not skip files named on the command line — so without
  # this exclusion the fixtures produce phantom findings on every PR.
  "**/.semgrep/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"
# Runner labels are declared in .github/actionlint.yaml, so this runs clean
# and can gate on genuine workflow errors.
mode = "block"

[[plugin]]
name = "bandit"
# Match the repo's pre-commit bandit invocation: -r backend/src/ -ll
# (medium+high severity only) -x backend/src/modulo/model_backends/stub/
args = ["-r", "backend/src/", "-ll", "-x", "backend/src/modulo/model_backends/stub/"]

[[plugin]]
name = "eslint"
package_file = "frontend/package.json"
package_filters = ["eslint"]

[[plugin]]
name = "gitleaks"

[[plugin]]
name = "hadolint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
# Pin to the ruff version the repo actually gates on: backend/uv.lock pins
# ruff==0.16.8 and CI's Lint (Backend) job runs it (`uv run --no-build
# --no-sync ruff check .`), as does the pre-commit hook. Without an explicit
# pin qlty installs its own default (0.14.x) and reports ~22 phantom
# formatting findings plus 8 false-positive RUF100 unused-noqa on
# `# noqa: ASYNC240` (valid in the repo's version).
version = "0.16.8"
# Do NOT pass ["--config", "ruff.toml"] here. That flag overrides ruff's
# per-file config discovery for every target: backend files would stop using
# backend/pyproject.toml, whose `src = ["src"]` informs isort first-party
# resolution, and qlty would report ~1200 false I001 unsorted-imports.
# Qlty runs `ruff check <target>`, and ruff resolves the nearest config by the
# target file's path — exactly matching CI and pre-commit — so the repo's
# per-file-ignores (backend/pyproject.toml for backend, ruff.toml elsewhere)
# and the `.semgrep/**` qlty exclusion above remain in force.

# Disabled: driver hardcodes `--config .semgrep.yaml`, which this repository
# does not have (rules live in `.semgrep/`). See the note at the top of this
# file. Semantic security scanning is covered by CI and the pre-commit hook.
[[plugin]]
name = "semgrep"
mode = "disabled"

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"
# Accepted-decision rules are suppressed in zizmor.yml; remaining genuine
# findings are left visible. `comment` reports them without failing the gate.
mode = "comment"
