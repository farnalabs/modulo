# Qlty configuration for farnalabs/modulo.
#
# Checked in so Qlty Cloud uses a deterministic config instead of
# auto-generating a temporary one on every analysis. See
# https://docs.qlty.sh/cli/analysis-configuration for the reference.
#
# Why semgrep is disabled below: the Qlty semgrep plugin's driver hardcodes
# `semgrep --config .semgrep.yaml`, but this repository keeps its Semgrep rules
# in the `.semgrep/` directory (and `.semgrepignore`). There is no root
# `.semgrep.yaml`, so the plugin errors with "unable to find a config; path
# `.semgrep.yaml` does not exist" and Qlty reports the build as errored.
# Semgrep is already run with the correct `--config=.semgrep/` invocation in
# `.github/workflows/ci.yml` and via the pre-commit hook
# (`scripts/run_semgrep.py`), so disabling the Qlty plugin does not remove
# coverage.
#
# Why actionlint is disabled: actionlint's built-in runner-label list does not
# include our custom `ubicloud-standard-2` runner. Qlty's actionlint plugin has
# no configuration surface for custom runner labels, so all 55 findings on
# every PR are false positives. actionlint is already covered by CI's own
# workflow lint steps; disabling the Qlty plugin removes noise without losing
# coverage.
#
# Why zizmor is disabled: zizmor reports CI-workflow design decisions (e.g.
# unpinned action versions, missing permissions blocks) that are intentional
# choices in this repo's workflow design. Qlty's zizmor plugin has no
# configuration surface for suppressing specific zizmor rules, so all 142
# findings on every PR are unactionable noise. zizmor findings are reviewed
# manually as part of workflow maintenance; the Qlty plugin adds noise without
# actionable signal.

config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  # Intentional semgrep rule test fixtures — not production code. These
  # contain deliberate F821 (undefined-name) violations that are the POINT of
  # the test fixture. Qlty's ruff plugin passes files explicitly, which
  # bypasses ruff.toml's per-file-ignores, so without this exclusion the
  # fixtures produce phantom findings on every PR.
  "**/.semgrep/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"
mode = "disabled"

[[plugin]]
name = "bandit"
# Match the repo's pre-commit bandit invocation: -r backend/src/ -ll
# (medium+high severity only) -x backend/src/modulo/model_backends/stub/
args = ["-r", "backend/src/", "-ll", "-x", "backend/src/modulo/model_backends/stub/"]

[[plugin]]
name = "eslint"
package_file = "frontend/package.json"
package_filters = ["eslint"]

[[plugin]]
name = "gitleaks"

[[plugin]]
name = "hadolint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
# Pin to the repo's ruff version (0.15.18) so formatting rules and lint
# semantics match CI. Without this, qlty's default ruff version produces ~22
# phantom formatting findings and 8 false-positive RUF100 unused-noqa on
# # noqa: ASYNC240 (valid in 0.15.18).
version = "0.15.18"
# Force ruff to read the repo's ruff.toml for exclude patterns and
# per-file-ignores. Qlty's ruff plugin passes files explicitly, which
# bypasses the config file's directory-level exclusions. --config ensures the
# repo's per-file-ignores (e.g. .semgrep/** -> F821, tests/** -> S101/S105)
# are honoured even when files are passed explicitly.
args = ["--config", "ruff.toml"]

# Disabled: driver hardcodes `--config .semgrep.yaml`, which this repository
# does not have (rules live in `.semgrep/`). See the note at the top of this
# file. Semantic security scanning is covered by CI and the pre-commit hook.
[[plugin]]
name = "semgrep"
mode = "disabled"

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"
mode = "disabled"
