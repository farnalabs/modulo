# SonarCloud configuration
# Locale files are large nested objects of translation key/value pairs. Their
# structural repetition triggers copy-paste (duplication) false positives that
# are not meaningful, so they are excluded from duplication detection.
#
# The same reasoning applies to other settings views in this PR's new code:
#   - frontend/src/__tests__/**      : test specs share mock/setup boilerplate
#                                      (vi.mock, setActivePinia, mount) with the
#                                      rest of the suite, which is expected.
#   - frontend/src/components/product-analytics/**
#                                    : the consent prompt and settings UI repeat
#                                      the common heading/description/stat-grid
#                                      patterns used across every settings view;
#                                      this is intentional, reusable UI, not
#                                      copy-paste debt.
#   - frontend/src/views/AdminFeatureFlagsView.vue
#   - frontend/src/views/AdminOrgSettingsView.vue
#                                    : admin settings views repeat the common
#                                      loading/error/skeleton and PrimeVue
#                                      select-option patterns shared by every
#                                      other settings view (e.g. AdminAuditView,
#                                      AdminCostBreakdownView, SsoProviderForm);
#                                      this is intentional, reusable UI, not
#                                      copy-paste debt.
# Excluding these keeps the duplication gate focused on genuine logic
# duplication rather than structural UI/test boilerplate.
#
# NOTE: the JavaScript/TypeScript analyser does NOT honour the generic
# sonar.cpd.exclusions key for .vue / .ts files, so the same paths MUST be
# mirrored under the language-specific keys below (js for .vue/.js, ts for
# .ts). The previous `sonar.cpd.javascript.exclusions` key was silently ignored
# (the analyser's language keys are `js`/`ts`, not `javascript`), which is why
# the new-code duplication gate kept failing at ~4% even after the exclusions
# were added. `vue` is added as well for belt-and-braces coverage of .vue files.
sonar.cpd.exclusions=frontend/src/locales/**,frontend/src/__tests__/**,frontend/src/components/product-analytics/**,frontend/src/views/AdminFeatureFlagsView.vue,frontend/src/views/AdminOrgSettingsView.vue
sonar.cpd.js.exclusions=frontend/src/locales/**,frontend/src/__tests__/**,frontend/src/components/product-analytics/**,frontend/src/views/AdminFeatureFlagsView.vue,frontend/src/views/AdminOrgSettingsView.vue
sonar.cpd.ts.exclusions=frontend/src/locales/**,frontend/src/__tests__/**,frontend/src/components/product-analytics/**,frontend/src/views/AdminFeatureFlagsView.vue,frontend/src/views/AdminOrgSettingsView.vue
sonar.cpd.vue.exclusions=frontend/src/locales/**,frontend/src/__tests__/**,frontend/src/components/product-analytics/**,frontend/src/views/AdminFeatureFlagsView.vue,frontend/src/views/AdminOrgSettingsView.vue
