# SonarCloud configuration (read by SonarSource/sonarqube-scan-action).
#
# Only genuinely non-meaningful, data/framework-shaped repetition is excluded
# from the copy-paste (duplication) gate:
#   * frontend/src/locales/**  : i18n catalogs whose `"key": "value"` structure
#                                is data, not logic, and routinely trips the
#                                gate against existing entries.
#   * frontend/src/__tests__/** : specs share mock/setup boilerplate
#                                (vi.mock, setActivePinia, mount) with the rest
#                                of the suite, which is expected.
#
# Production source added by this PR (consent prompt, settings views, the
# shared ToggleSwitch/ErrorAlert, the store) is intentionally NOT excluded, so
# genuine logic duplication is surfaced rather than hidden by widening the gate.
sonar.cpd.exclusions=frontend/src/locales/**,frontend/src/__tests__/**

# --- CI-based analysis (SonarSource/sonarqube-scan-action; job "sonarcloud-scan"
# in .github/workflows/ci.yml, push-to-main only) ---
# SonarCloud automatic analysis (GitHub App) cannot import coverage reports, so
# the CI scan is the only way coverage reaches the project. The scanner reads
# THIS file (not .sonarcloud.properties, which only applies to automatic analysis).
sonar.projectKey=farnalabs_modulo
sonar.organization=farnalabs
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Exclusions mirror .sonarcloud.properties (the automatic-analysis config) so the
# CI-based analysis keeps the same analysis scope once automatic analysis is disabled.
sonar.exclusions=**/schema.ts,**/locales/**,backend/tests/**
