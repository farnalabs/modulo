# SonarCloud configuration (read by SonarSource/sonarqube-scan-action).
#
# This repo is a mixed-language monorepo: Python backend under backend/src/modulo
# and Vue/TypeScript frontend under frontend/src. Both are analyzed as a single
# SonarCloud project (farnalabs_modulo). Coverage is fed from two reports
# produced in CI (see ci.yml):
#   * backend/coverage.xml        (pytest --cov-report=xml, overwrite this would break the
#                                  backend-test job's coverage-thresholds.sh output)
#   * frontend/coverage/lcov.info (vitest --coverage, v8 provider)

sonar.organization=farnalabs
sonar.projectKey=farnalabs_modulo
sonar.python.version=3.12

# Sources (repo-root relative). Both the Python package and the Vue/TS app.
sonar.sources=backend/src/modulo,frontend/src

# Test directories — excluded from coverage reporting (they are not "product" code).
sonar.tests=backend/tests,frontend/src/__tests__,tests/bdd

# Exclusions: generated/data-shaped/dependency content and test-related noise.
#   * migrations: Alembic migration files are not unit-tested (they run in CI), so including
#     them drags the coverage figure down without adding signal.
#   * frontend/src/locales/** : i18n catalogs are data, not logic (kept out of duplication gate).
#   * frontend/src/__tests__/** : specs share mock/setup boilerplate (kept out of CPD gate).
#   * node_modules / coverage output / stub / .semgrep: never analyze deps or tooling output.
sonar.exclusions=backend/src/modulo/db/migrations/**,frontend/src/locales/**,frontend/src/__tests__/**,frontend/coverage/**,frontend/node_modules/**,backend/src/modulo/stub/**,.semgrep/**

# Coverage report paths (repo-root relative). Backend is produced by
# coverage-thresholds.sh in the backend-test job; frontend by vitest --coverage.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# CPD (copy-paste) exclusions: only genuinely non-meaningful, data/framework-shaped
# repetition is excluded. i18n catalogs ("key": "value" data structure) and test specs
# (shared mock/setup boilerplate) are expected repetition, not logic duplication.
sonar.cpd.exclusions=frontend/src/locales/**,frontend/src/__tests__/**
