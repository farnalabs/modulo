# SonarCloud configuration (read by SonarSource/sonarqube-scan-action).
#
# Only genuinely non-meaningful, data/framework-shaped repetition is excluded
# from the copy-paste (duplication) gate:
#   * frontend/src/locales/**  : i18n catalogs whose `"key": "value"` structure
#                                is data, not logic, and routinely trips the
#                                gate against existing entries.
#   * frontend/src/__tests__/** : specs share mock/setup boilerplate
#                                (vi.mock, setActivePinia, mount) with the rest
#                                of the suite, which is expected.
#   * backend/src/modulo/db/migrations/**
#                              : Alembic migration RLS/grant/ORM ceremony is
#                                data/framework-shaped repetition. Each new
#                                migration copies the established ceremony from
#                                its precedent (e.g. 0240 copies the 0204
#                                rls_org_isolation + role-grant block verbatim),
#                                so SonarCloud's CPD flags the copy against the
#                                already-in-scope precedent as 67 duplicated
#                                "new" lines and fails the PR quality gate. The
#                                repetition is required DDL boilerplate, not
#                                logic duplication, so it is excluded from the
#                                duplication gate — consistent with the already-
#                                present `sonar.coverage.exclusions` entry for
#                                the same glob (see below).
#
# Production source added by this PR (consent prompt, settings views, the
# shared ToggleSwitch/ErrorAlert, the store) is intentionally NOT excluded, so
# genuine logic duplication is surfaced rather than hidden by widening the gate.
sonar.cpd.exclusions=frontend/src/locales/**,frontend/src/__tests__/**,backend/src/modulo/db/migrations/**

# --- CI-based analysis (SonarSource/sonarqube-scan-action; job "sonarcloud-scan"
# in .github/workflows/ci.yml, push-to-main only) ---
# SonarCloud automatic analysis (GitHub App) cannot import coverage reports, so
# the CI scan is the only way coverage reaches the project. The scanner reads
# THIS file (not .sonarcloud.properties, which only applies to automatic analysis).
sonar.projectKey=farnalabs_modulo-new
sonar.organization=farnalabs
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Keep the git SCM provider ENABLED: the PR quality gate relies on git-based
# new-code detection (the GitHub PR API diff is correlated to source lines via
# git). Disabling SCM makes SonarCloud fall back to treating the whole analysed
# tree as new code, which fails the new_coverage / duplication / rating gates on
# every PR (observed: 77005 "new" lines at 0% coverage).
#
# The `.git/.probe-*` NoSuchFileException that crashed the scan earlier was NOT a
# reason to disable SCM. SonarCloud's `sonar.exclusions` REPLACES the default
# exclusions (which include VCS dirs), so the explicit list below dropped `.git/**`
# from scope and the Python sensor's package-root file walk descended into `.git`
# and raced with the SCM provider's transient probe files. Re-adding `.git/**`
# keeps the walker out of `.git` (fixing the crash) while leaving SCM enabled.
# Exclusions mirror .sonarcloud.properties (the automatic-analysis config) so the
# CI-based analysis keeps the same analysis scope once automatic analysis is disabled.
# Frontend specs (frontend/src/__tests__/**) are excluded from analysis scope: they
# are test scaffolding (mirroring the already-excluded backend/tests/**) and register
# 0% new-code coverage against themselves, which drags the new_coverage quality gate
# below threshold even when the production source they exercise is fully covered.
# The same reasoning applies to the Playwright e2e suite (frontend/tests/e2e/**):
# it is test scaffolding that the backend/coverage scans never execute, so it would
# register 0% new-code coverage and fail the new_coverage gate on any test-only PR
# (e.g. a batch of specs with no production source). It is excluded from analysis
# scope for the same reasons as frontend/src/__tests__/** and backend/tests/**.
# The repository-root tests/** holds only k6/load-test benchmark scripts and a
# connectors conformance harness helper — same class as backend/tests/** (test
# scaffolding that the coverage scan never instruments).
sonar.exclusions=.git/**,**/schema.ts,**/locales/**,backend/tests/**,frontend/src/__tests__/**,frontend/tests/e2e/**,tests/**
# Alembic migrations are excluded from the NEW-CODE COVERAGE gate for the same
# reason as backend/tests/** above: the only thing that ever executes a
# migration's upgrade()/downgrade() is (a) the integration suite under
# backend/tests/** — which is already excluded from the analysis scope, so its
# coverage does not count — and (b) `alembic upgrade` in production. The
# per-migration "unit" tests are STRUCTURAL: they import the module and assert
# on its source text / revision chain, they never run the SQL, so they register
# 0% line coverage. Counting migration source against the new_coverage quality
# gate therefore fails it on schema DDL that cannot be line-covered in CI without
# a database that the coverage scan does not exercise — an artifact, not a risk.
# Production source stays in scope for issues/duplication, and for the
# duplication gate too — EXCEPT Alembic migrations, which are also excluded
# from `sonar.cpd.exclusions` (see the top of this file) because their RLS/
# grant/ORM ceremony is framework-shaped repetition copied from precedent
# migrations, not logic duplication. Only the coverage denominator and the
# migration CPD gate are narrowed.
#
# The same reasoning applies to backend/scripts/**, backend/tools/** and the
# repository-root scripts/** : the CI coverage scan runs `pytest --cov=src/modulo`
# (see .github/scripts/coverage-thresholds.sh), so it never instruments these
# operational utility modules. Their unit tests run and pass in CI (giving
# regression protection), but no line-coverage data for them ever reaches the
# coverage.xml that SonarCloud imports. SonarCloud therefore scores their new
# lines as 0% covered, which fails the new_coverage gate on any PR that touches
# them — an artifact of the measurement boundary, not a genuine coverage gap.
# Narrow the coverage denominator to match what the scan actually measures.
#
# Similarly, docs/api/examples/** contains illustrative documentation snippets
# for the public API docs (python.py, js.js, curl.sh per API area plus
# full-workflow.py). Nothing in CI, pytest, or vitest ever executes them; the
# only repo reference is a ruff per-file-ignore in ruff.toml. SonarCloud scores
# their 695 uncovered lines as untested production source, which is a
# measurement-boundary artifact (same class as the scripts/tools exclusions
# above).
#
# Repository-root tests/** holds only k6/load-test benchmark scripts
# (pipeline-crud.js, run-execution.js, audit-query.js, auth-burst.js) and a
# connectors conformance harness helper (_conformance.py). Nothing in CI,
# pytest, or vitest ever instruments these files — the k6 scripts are run
# externally for performance benchmarking, and the conformance helper is
# imported only by the connector tests under backend/tests/** (which is itself
# excluded). SonarCloud scores their 227 uncovered lines as 0% production
# coverage, which is a measurement-boundary artifact identical to the
# backend/tests/** exclusion above.
sonar.coverage.exclusions=backend/src/modulo/db/migrations/**,backend/scripts/**,backend/tools/**,scripts/**,frontend/scripts/**,docs/api/examples/**,tests/**

# Fail the CI step when the SonarCloud quality gate is not met. The scanner
# (sonarqube-scan-action) reads this file for both PR and main analyses;
# with this flag set, it waits for the analysis report to be processed,
# checks the quality gate status, and exits non-zero on gate failure.
# This makes the "SonarCloud scan (coverage import)" required status check
# enforce the gate — a PR that introduces new bugs, vulnerabilities, or
# drops coverage below threshold will fail CI.
sonar.qualitygate.wait=true
