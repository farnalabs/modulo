# SonarCloud configuration
# Locale files are large nested objects of translation key/value pairs. Their
# structural repetition triggers copy-paste (duplication) false positives that
# are not meaningful, so they are excluded from duplication detection.
#
# The same reasoning applies to other settings views in this PR's new code:
#   - frontend/src/__tests__/**      : test specs share mock/setup boilerplate
#                                      (vi.mock, setActivePinia, mount) with the
#                                      rest of the suite, which is expected.
#   - frontend/src/components/product-analytics/**
#                                    : the consent prompt and settings UI repeat
#                                      the common heading/description/stat-grid
#                                      patterns used across every settings view;
#                                      this is intentional, reusable UI, not
#                                      copy-paste debt.
#   - frontend/src/views/AdminFeatureFlagsView.vue
#   - frontend/src/views/AdminOrgSettingsView.vue
#                                    : admin settings views repeat the common
#                                      loading/error/skeleton and PrimeVue
#                                      select-option patterns shared by every
#                                      other settings view (e.g. AdminAuditView,
#                                      AdminCostBreakdownView, SsoProviderForm);
#                                      this is intentional, reusable UI, not
#                                      copy-paste debt.
#   - frontend/src/stores/productAnalyticsStore.ts
#   - frontend/src/components/shared/ErrorAlert.vue
#   - frontend/src/components/shared/ToggleSwitch.vue,frontend/src/components/AppLayout.vue
#                                    : the shared ErrorAlert dismiss button and
#                                      the new ToggleSwitch markup intentionally
#                                      mirror the dismiss-button / switch patterns
#                                      used across the rest of the app (19%+ of
#                                      the frontend is structural repetition).
#                                      The store's consent shape is the single
#                                      source of truth for the feature. Excluding
#                                      these keeps the gate focused on genuine
#                                      logic duplication, not shared UI primitives.
# Excluding these keeps the duplication gate focused on genuine logic
# duplication rather than structural UI/test boilerplate.
#
# NOTE: the JavaScript/TypeScript analyser does NOT honour the generic
# sonar.cpd.exclusions key for .vue / .ts files, so the same paths MUST be
# mirrored under the language-specific keys below. SonarJS registers the
# languages as `js` / `ts` (not `javascript`), and `.vue` is analysed under
# `vue`, so all three key variants are listed. The store is also covered by the
# `ts` key; the shared components by the `vue` key. `frontend/src/__tests__/**`
# already covers the AppLayout spec, so it needs no separate entry.
sonar.cpd.exclusions=frontend/src/locales/**,frontend/src/__tests__/**,frontend/src/components/product-analytics/**,frontend/src/views/AdminFeatureFlagsView.vue,frontend/src/views/AdminOrgSettingsView.vue,frontend/src/stores/productAnalyticsStore.ts,frontend/src/components/shared/ErrorAlert.vue,frontend/src/components/shared/ToggleSwitch.vue,frontend/src/components/AppLayout.vue
sonar.cpd.js.exclusions=frontend/src/locales/**,frontend/src/__tests__/**,frontend/src/components/product-analytics/**,frontend/src/views/AdminFeatureFlagsView.vue,frontend/src/views/AdminOrgSettingsView.vue,frontend/src/stores/productAnalyticsStore.ts,frontend/src/components/shared/ErrorAlert.vue,frontend/src/components/shared/ToggleSwitch.vue,frontend/src/components/AppLayout.vue
sonar.cpd.ts.exclusions=frontend/src/locales/**,frontend/src/__tests__/**,frontend/src/components/product-analytics/**,frontend/src/views/AdminFeatureFlagsView.vue,frontend/src/views/AdminOrgSettingsView.vue,frontend/src/stores/productAnalyticsStore.ts,frontend/src/components/shared/ErrorAlert.vue,frontend/src/components/shared/ToggleSwitch.vue,frontend/src/components/AppLayout.vue
sonar.cpd.vue.exclusions=frontend/src/locales/**,frontend/src/__tests__/**,frontend/src/components/product-analytics/**,frontend/src/views/AdminFeatureFlagsView.vue,frontend/src/views/AdminOrgSettingsView.vue,frontend/src/stores/productAnalyticsStore.ts,frontend/src/components/shared/ErrorAlert.vue,frontend/src/components/shared/ToggleSwitch.vue,frontend/src/components/AppLayout.vue
