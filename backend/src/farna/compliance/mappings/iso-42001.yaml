framework: iso_42001
name: "ISO/IEC 42001:2023 - Information technology - Artificial intelligence - Management system"
source: "ISO/IEC 42001:2023. This pack covers the clauses that touch change approval, human oversight and traceability: clause 8 (operation), clause 9 (performance evaluation), clause 10 (improvement), clause 7.5 (documented information) and Annex A controls A.6.2.4, A.6.2.6 and A.6.2.8."
scope_note: "ISO/IEC 42001 certifies an AI management system (AIMS). Modulo is a control inside the customer's AIMS, not the AIMS itself, so most clauses are customer responsibility or supported rather than satisfied. Clause numbering follows the published standard; the customer should check it against their licensed copy."
rows:
  - id: "iso-42001-8.1"
    clause: "8.1"
    clause_intent: "Operational planning and control covers the processes needed to meet AI system requirements, including the control of planned changes."
    modulo_control: "Each pipeline run executes against an immutable, versioned snapshot with pinned models, prompts, schemas and guardrails, and every configuration change is audited."
    artifact_type: "run_snapshot"
    customer_location: "Snapshot history at GET /api/v1/pipelines/{pipeline_id}/snapshots and the snapshot_id on GET /api/v1/runs/{run_id}."
    coverage: "supported"
    provenance: "observed"
    responsibility: "The AIMS objectives, risk criteria and change-approval policy are the customer's. Modulo evidences that the platform enforced the configuration it was given."

  - id: "iso-42001-8.2"
    clause: "8.2"
    clause_intent: "AI risk assessment is performed at planned intervals and when significant changes occur."
    modulo_control: "Modulo does not perform AI risk assessment. It records the operational changes that would trigger a re-assessment."
    artifact_type: "customer_records"
    customer_location: "The customer's AI risk assessment and its review record."
    coverage: "customer-responsibility"
    provenance: "customer-supplied"
    responsibility: "The customer's AIMS owns the risk assessment, its method and its review cadence."

  - id: "iso-42001-8.3"
    clause: "8.3"
    clause_intent: "AI risk treatment selects and implements controls for the assessed risks."
    modulo_control: "Risks identified in the customer's assessment can be implemented as guardrails, policy gates and human-in-the-loop gates, which Modulo enforces and records at run time, with the applied set frozen into the run snapshot."
    artifact_type: "run_snapshot"
    customer_location: "The guardrail, policy-gate and HITL pins in the run snapshot, readable at GET /api/v1/pipelines/{pipeline_id}/snapshots."
    coverage: "supported"
    provenance: "observed"
    responsibility: "Choosing which treatment is adequate for each risk is the customer's decision."

  - id: "iso-42001-9.1"
    clause: "9.1"
    clause_intent: "The organisation monitors, measures, analyses and evaluates AI system performance and the effectiveness of controls."
    modulo_control: "Evaluation definitions score agent output against a pinned definition version, results are persisted per run and per suite run, and policy gates act on the result."
    artifact_type: "eval_result"
    customer_location: "Eval results at GET /api/v1/runs/{run_id}/evals and suite-level results at GET /api/v1/eval-suites."
    coverage: "supported"
    provenance: "observed"
    responsibility: "Setting the performance thresholds and reviewing the trend as part of management review is the customer's activity."

  - id: "iso-42001-9.2"
    clause: "9.2"
    clause_intent: "Internal audits are conducted at planned intervals to determine whether the AI management system conforms to the organisation's requirements and to the standard."
    modulo_control: "Modulo supplies instance evidence (audit chain, run snapshots, human decisions and eval results) but does not conduct an internal audit."
    artifact_type: "customer_records"
    customer_location: "The customer's internal audit programme, auditor records and findings."
    coverage: "customer-responsibility"
    provenance: "customer-supplied"
    responsibility: "The internal audit programme, its auditors, its sampling and its findings are the customer's."

  - id: "iso-42001-10.2"
    clause: "10.2"
    clause_intent: "Nonconformities are reacted to, their causes evaluated, and corrective action taken and reviewed for effectiveness."
    modulo_control: "Evaluation results and error events can evidence the detection of a nonconformity, and the corrective actions taken inside the application (configuration changes, guardrail updates, autonomy demotions) are recorded with actor and outcome."
    artifact_type: "audit_chain"
    customer_location: "Corrective-action events and their actors are recorded on every tier and read at GET /api/v1/admin/audit (Team tier's audit_viewer feature plus audit.manage), alongside the eval result that triggered the review."
    coverage: "supported"
    provenance: "observed"
    responsibility: "Root-cause analysis and the effectiveness review of a corrective action are the customer's quality process."

  - id: "iso-42001-7.5"
    clause: "7.5"
    clause_intent: "Documented information required by the management system is created, updated and controlled."
    modulo_control: "Pipeline configuration is versioned and snapshotted, and this compliance pack plus the security questionnaire answer bank are versioned with the release they describe rather than published separately on a website."
    artifact_type: "build_identity"
    customer_location: "GET /api/v1/deployment returns the deployed product version, source revision and build timestamp; the pack version is recorded in the compliance evidence index."
    coverage: "supported"
    provenance: "observed"
    responsibility: "The AIMS document register, its review cycle and its approval workflow are the customer's."

  - id: "iso-42001-a.6.2.4"
    clause: "A.6.2.4"
    clause_intent: "AI system verification and validation is performed against defined criteria."
    modulo_control: "Evaluations score output against a pinned definition version, and policy gates can block, warn, escalate or continue based on that result. The result is persisted before the decision is made, so the decision is grounded in a durable record."
    artifact_type: "eval_result"
    customer_location: "Eval results at GET /api/v1/runs/{run_id}/evals, with the eval-definition version recorded on each result."
    coverage: "satisfied"
    provenance: "observed"
    responsibility: "Defining the acceptance criteria and judging whether they are adequate is the customer's responsibility. Modulo evidences that the criteria were applied."

  - id: "iso-42001-a.6.2.6"
    clause: "A.6.2.6"
    clause_intent: "The AI system is operated and monitored according to its intended use, with its performance and behaviour observed."
    modulo_control: "Runs, node outcomes, errors and eval results are recorded per organisation, and readiness and health endpoints expose the instance's operational state."
    artifact_type: "audit_chain"
    customer_location: "Operational events are recorded on every tier and read at GET /api/v1/admin/audit (Team tier's audit_viewer feature plus audit.manage), with instance readiness at GET /healthz/ready."
    coverage: "supported"
    provenance: "observed"
    responsibility: "Choosing the monitoring window, thresholds and escalation path is the customer's operating decision."

  - id: "iso-42001-a.6.2.8"
    clause: "A.6.2.8"
    clause_intent: "Event logs record the operation of the AI system, including the identity of actors, for traceability."
    modulo_control: "Every governance-relevant action appends an audit event carrying actor, resource, payload and outcome to a hash-chained, append-only log, and each run's frozen configuration is preserved as a snapshot; recording is not licence-gated and holds on every tier. READING that log through the product is conditional: the browse route and the chain verifier carry the Team-tier audit_viewer feature plus audit.manage (HTTP 402 on an unlicensed Community install), as do the signed-export evidence-pack and verification-key routes, which additionally return HTTP 503 unless MODULO_EVIDENCE_SIGNING_KEY is configured."
    artifact_type: "audit_chain"
    customer_location: "The audit trail is recorded on every tier. Browsing it at GET /api/v1/admin/audit and checking its integrity at GET /api/v1/admin/audit/verify both require the Team tier's audit_viewer feature plus audit.manage; the signed export at GET /api/v1/admin/audit/evidence-pack additionally requires a configured MODULO_EVIDENCE_SIGNING_KEY."
    coverage: "supported"
    provenance: "observed"
    responsibility: "Retaining the logs beyond the instance's configured retention window, protecting them, and licensing the Team tier if an export off the instance is required, are the customer's responsibility."
