framework: eu_ai_act
name: "EU AI Act - Regulation (EU) 2024/1689"
source: "Regulation (EU) 2024/1689 (Artificial Intelligence Act). This pack covers the obligations that apply to a system which changes software under human oversight: Articles 9, 12, 14, 15, 17, 19, 26, 72 and 73."
scope_note: "The Act places obligations on providers and deployers of AI systems, not on a tool they use. Modulo is a control the customer can use to meet some of those obligations; legal responsibility stays with the customer. Article numbers follow the published regulation and the customer should confirm applicability with their own counsel."
rows:
  - id: "eu-ai-act-art-9"
    clause: "Article 9"
    clause_intent: "A risk-management system is established, implemented, documented and maintained for the AI system across its lifecycle."
    modulo_control: "Modulo provides guardrails and policy gates that implement risk treatment, but it does not establish or maintain a risk-management system."
    artifact_type: "customer_records"
    customer_location: "The provider's risk-management system documentation and its review record."
    coverage: "customer-responsibility"
    provenance: "customer-supplied"
    responsibility: "The provider's risk-management system, including its documented process and its review cycle, is the customer's obligation."

  - id: "eu-ai-act-art-12"
    clause: "Article 12"
    clause_intent: "High-risk AI systems technically allow the automatic recording of events over their lifetime."
    modulo_control: "Every governance-relevant action is recorded automatically in the hash-chained audit trail, and each run's frozen configuration is preserved as a snapshot with its identifier recorded on the run."
    artifact_type: "audit_chain"
    customer_location: "The audit trail at GET /api/v1/admin/audit and its integrity at GET /api/v1/admin/audit/verify."
    coverage: "satisfied"
    provenance: "observed"
    responsibility: "This evidences AI activity that Modulo executes. Activity outside Modulo's execution boundary is not logged and remains the customer's to evidence."

  - id: "eu-ai-act-art-14"
    clause: "Article 14"
    clause_intent: "High-risk AI systems are designed so that they can be effectively overseen by natural persons, including the ability to intervene in or stop the operation."
    modulo_control: "Human-in-the-loop gates pause a run until a recorded human decision, gates marked human_only cannot be decided by any machine credential over REST or MCP, and the guardrail kill switch and run cancellation stop operation."
    artifact_type: "hitl_decision"
    customer_location: "Decisions at GET /api/v1/hitl/reviews and pending gates at GET /api/v1/runs/{run_id}/hitl/pending; containment actions appear in the audit trail."
    coverage: "supported"
    provenance: "observed"
    responsibility: "Assigning oversight to competent, trained persons and defining their authority is the deployer's obligation. Modulo enforces and records the decisions those persons make."

  - id: "eu-ai-act-art-15"
    clause: "Article 15"
    clause_intent: "High-risk AI systems achieve appropriate levels of accuracy, robustness and cybersecurity, and perform consistently across their lifecycle."
    modulo_control: "Evaluation definitions score output against a pinned definition version, policy gates enforce the outcome, and the release pipeline produces a CycloneDX SBOM from the pinned dependency set."
    artifact_type: "eval_result"
    customer_location: "Eval results at GET /api/v1/runs/{run_id}/evals; the SBOM is retained by the operator from the release pipeline."
    coverage: "supported"
    provenance: "observed"
    responsibility: "Declaring the accuracy metrics and acceptable robustness for the customer's use case, and operating host security, remain the customer's obligations."

  - id: "eu-ai-act-art-17"
    clause: "Article 17"
    clause_intent: "A quality-management system is put in place for the AI system, covering strategy, design control, testing, data management and record-keeping."
    modulo_control: "Modulo supplies execution records, evaluation results and change evidence that feed a quality-management system, but it is not itself a quality-management system."
    artifact_type: "customer_records"
    customer_location: "The provider's quality-management system documentation and its controlled procedures."
    coverage: "customer-responsibility"
    provenance: "customer-supplied"
    responsibility: "The quality-management system and its documented procedures are the provider's obligation."

  - id: "eu-ai-act-art-19"
    clause: "Article 19"
    clause_intent: "Automatically generated logs are kept for a period appropriate to the intended purpose, at least six months unless other Union law provides otherwise."
    modulo_control: "The audit trail is append-only and exportable, with configurable run and evidence retention, and the offline-verifiable evidence pack can be retained outside the instance for the full period."
    artifact_type: "audit_chain"
    customer_location: "Retention settings at the run and evidence retention admin routes; the export at GET /api/v1/admin/audit/evidence-pack."
    coverage: "supported"
    provenance: "observed"
    responsibility: "The customer must configure retention to the period the Act requires and store the exported evidence beyond the instance's retention window."

  - id: "eu-ai-act-art-26"
    clause: "Article 26"
    clause_intent: "Deployers use the system according to its instructions, assign human oversight, monitor its operation and keep the logs the system produces."
    modulo_control: "Modulo records the human oversight decisions, the run outcomes and the configuration in use, giving the deployer the operational record the obligation depends on."
    artifact_type: "audit_chain"
    customer_location: "The audit trail at GET /api/v1/admin/audit, with per-run configuration at GET /api/v1/runs/{run_id}."
    coverage: "supported"
    provenance: "observed"
    responsibility: "Using the system as intended, assigning competent oversight and reporting incidents remain the deployer's obligations."

  - id: "eu-ai-act-art-72"
    clause: "Article 72"
    clause_intent: "The provider establishes a post-market monitoring system proportionate to the nature and risks of the AI system."
    modulo_control: "Modulo can supply run outcomes, evaluation regression signals and error records as inputs to post-market monitoring, but it does not operate a post-market monitoring plan."
    artifact_type: "customer_records"
    customer_location: "The provider's post-market monitoring plan and the data it collects, informed by GET /api/v1/runs/{run_id}/evals and the audit trail."
    coverage: "customer-responsibility"
    provenance: "customer-supplied"
    responsibility: "The post-market monitoring plan, its data collection and its review are the provider's obligation."

  - id: "eu-ai-act-art-73"
    clause: "Article 73"
    clause_intent: "Serious incidents are reported to the market surveillance authorities within the deadlines the regulation sets."
    modulo_control: "Modulo does not detect serious incidents as the Act defines them and does not report to any authority."
    artifact_type: "customer_records"
    customer_location: "The provider's incident report to the market surveillance authority and its internal record of that report."
    coverage: "gap"
    provenance: "customer-supplied"
    responsibility: "Detecting and reporting a serious incident, and keeping the record of that report, is entirely the customer's obligation. Modulo offers no capability for it."
