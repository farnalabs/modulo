framework: soc2
name: "SOC 2 Trust Services Criteria (2017, including the 2022 revised points of focus)"
source: "AICPA Trust Services Criteria. This pack covers criteria CC6 (Logical and Physical Access Controls), CC7 (System Operations) and CC8 (Change Management), plus the evidence layer an auditor samples from (EV rows)."
scope_note: "SOC 2 is an attestation about the customer's system, performed by the customer's auditor. Modulo is a component of that system in a self-hosted deployment. Every row states what remains the customer's responsibility; the pack never asserts that the customer's system is compliant."
rows:
  - id: "soc2-cc6.1"
    clause: "CC6.1"
    clause_intent: "Logical access security software, infrastructure and architectures identify and authenticate users and authorise their access."
    modulo_control: "Accounts authenticate by password, a scoped API key, or OIDC / SAML SSO. Every authenticated REST route that reads or mutates organisation data, and every MCP tool, resolves a named permission key to a minimum organisation role (viewer, runner, operator, admin), and tenant-scoped queries are constrained by PostgreSQL row-level security keyed to the principal's organisation. The routes that carry no permission key are deliberate and named: the pre-authentication entry points (password login, OIDC/SAML callback and metadata) and GET /api/v1/deployment run before a principal exists, and GET /api/v1/auth/me and GET /api/v1/auth/csrf-token are authenticated but self-scoped - they return only the caller's own identity or a CSRF token and read no other party's data. SSO, team RBAC and SCIM are Team-tier features and return HTTP 402 on an unlicensed Community install; the role hierarchy and row-level security themselves are always active."
    artifact_type: "audit_chain"
    customer_location: "Access changes are recorded to the hash-chained audit trail on every tier. Browsing them at GET /api/v1/admin/audit, filtered by entity_type=user, entity_type=api_key or entity_type=organisation, and checking chain integrity at GET /api/v1/admin/audit/verify both require the Team tier's audit_viewer feature plus audit.manage. The query parameter is entity_type (its internal name is resource_type): a request that sends resource_type instead is silently ignored and returns EVERY event unfiltered."
    coverage: "supported"
    provenance: "observed"
    responsibility: "The customer configures its identity provider, role assignments and network boundary, and must hold the Team tier to use SSO, team RBAC or SCIM. Modulo evidences the access changes performed inside it, not the customer's IdP configuration."

  - id: "soc2-cc6.2"
    clause: "CC6.2"
    clause_intent: "New internal and external users are registered and authorised before access is granted, and access is removed when it is no longer required."
    modulo_control: "Organisation membership is created by invitation, or by SCIM 2.0 provisioning when the Team tier's scim feature is licensed and a shared MODULO_SCIM_TOKEN is configured. Org role and team membership are set explicitly. User creation, user updates and API-key changes each append an audit event to the organisation's hash chain."
    artifact_type: "audit_chain"
    customer_location: "Audit events user_updated, organisation_user_created, api_key_updated and api_access_post / api_access_put are recorded on every tier. Reading them at GET /api/v1/admin/audit requires the Team tier's audit_viewer feature plus audit.manage."
    coverage: "supported"
    provenance: "observed"
    responsibility: "Approval of a joiner or a leaver is the customer's HR and access-request process. Modulo records only the resulting account and role changes."

  - id: "soc2-cc6.3"
    clause: "CC6.3"
    clause_intent: "Access is authorised by role on a least-privilege basis and removed when roles change or employment ends."
    modulo_control: "A four-level organisation role hierarchy plus team RBAC (the RBAC layer is Team-tier; the role hierarchy itself is always active). Every authenticated route that reads or mutates organisation data, and every MCP tool, names a permission key with a registered minimum role, and an unknown or misspelt key fails closed at import rather than silently admitting the caller. The exceptions named on the CC6.1 row - the pre-authentication entry points, GET /api/v1/deployment, GET /api/v1/auth/me and GET /api/v1/auth/csrf-token - resolve no permission key because they either run before a principal exists or are self-scoped."
    artifact_type: "audit_chain"
    customer_location: "Role and grant changes surface as user_updated and api_access_put audit events, recorded on every tier. Reading them at GET /api/v1/admin/audit requires the Team tier's audit_viewer feature plus audit.manage."
    coverage: "supported"
    provenance: "observed"
    responsibility: "The customer decides who holds which role. Modulo enforces and evidences the roles it was given."

  - id: "soc2-cc6.6"
    clause: "CC6.6"
    clause_intent: "Logical access security measures protect against threats originating outside the system boundary."
    modulo_control: "Modulo provides application-level authentication, JWT algorithm pinning, API-key scoping and per-key rate limiting. It does not operate the network perimeter, web application firewall or host hardening."
    artifact_type: "customer_records"
    customer_location: "The customer's WAF, reverse-proxy, TLS-termination and network-segmentation configuration, plus the deployment checklist shipped at docs/deployment-security.md."
    coverage: "customer-responsibility"
    provenance: "customer-supplied"
    responsibility: "Perimeter controls and host hardening are the customer's responsibility in a self-hosted deployment; Modulo cannot observe or evidence them."

  - id: "soc2-cc6.7"
    clause: "CC6.7"
    clause_intent: "Transmission, movement and removal of information are restricted, with encryption in transit and at rest."
    modulo_control: "Modulo runs entirely in the customer's infrastructure with no phone-home telemetry, encrypts stored connector and model credentials with Fernet, and keeps decrypted credentials out of run state, checkpoints and logs."
    artifact_type: "customer_records"
    customer_location: "The customer's TLS configuration and database or disk encryption settings. The product's own credential handling is described in docs/security/secret-management.md."
    coverage: "customer-responsibility"
    provenance: "customer-supplied"
    responsibility: "TLS certificates, database encryption at rest and backup-media encryption are configured and evidenced by the customer's platform team."

  - id: "soc2-cc7.1a"
    clause: "CC7.1"
    clause_intent: "The entity detects and monitors configuration changes that introduce security risk."
    modulo_control: "Pipeline, agent, connector, guardrail and organisation settings changes each append to the hash-chained audit trail. Pipeline configuration is versioned, and every run executes against an immutable snapshot rather than the live row."
    artifact_type: "audit_chain"
    customer_location: "Configuration-change audit events are recorded on every tier and read at GET /api/v1/admin/audit (Team tier's audit_viewer feature plus audit.manage), alongside the per-pipeline snapshot history at GET /api/v1/pipelines/{pipeline_id}/snapshots."
    coverage: "supported"
    provenance: "observed"
    responsibility: "Detecting changes made outside Modulo, such as host, database or network changes, remains the customer's monitoring responsibility."

  - id: "soc2-cc7.1b"
    clause: "CC7.1"
    clause_intent: "The entity detects and monitors new vulnerabilities in infrastructure and software."
    modulo_control: "A CycloneDX software bill of materials is generated for every release from the pinned dependency set, and a documented dependency policy defines severity service levels plus the pip-audit and pnpm audit --audit-level=critical gates run in CI."
    artifact_type: "release_sbom"
    customer_location: "The release pipeline's sbom-cyclonedx workflow artefact, or regenerate it with python backend/scripts/generate-sbom.py. The policy is at docs/security/dependency-policy.md."
    coverage: "supported"
    provenance: "customer-supplied"
    responsibility: "The customer must retain the SBOM for each release it deploys and operate its own patching cadence for the host and runtime."

  - id: "soc2-cc7.2"
    clause: "CC7.2"
    clause_intent: "The entity monitors system components for anomalies indicative of malicious acts, natural disasters or errors."
    modulo_control: "Run outcomes, node-level errors, evaluation results and readiness signals are recorded per organisation. Evaluations score agent output against a pinned definition version, so a behavioural drift is visible rather than inferred."
    artifact_type: "eval_result"
    customer_location: "Eval results for a run at GET /api/v1/runs/{run_id}/evals; suite-level results and regression alerting at GET /api/v1/eval-suites."
    coverage: "supported"
    provenance: "observed"
    responsibility: "Alert routing, on-call response and host or infrastructure monitoring are the customer's operating process."

  - id: "soc2-cc7.3"
    clause: "CC7.3"
    clause_intent: "Security events are evaluated to determine whether they constitute a security incident."
    modulo_control: "Every governance-relevant action is an audit event carrying actor, resource, payload and outcome, and that trail is recorded on every tier. REVIEWING it through the product is conditional on the Team tier: the browse route, the chain verifier, the evidence pack and the verification key all carry the Team-tier audit_viewer feature (HTTP 402 on an unlicensed Community install) alongside audit.manage, and the export additionally needs a configured MODULO_EVIDENCE_SIGNING_KEY. On a Community install the events exist and are hash-chained, but the product gives the operator no admin route through which to browse or verify them, so this row's review step is not supported on Community."
    artifact_type: "audit_chain"
    customer_location: "GET /api/v1/admin/audit for browsing and GET /api/v1/admin/audit/verify for chain integrity both require the Team tier's audit_viewer feature plus audit.manage (HTTP 402 on an unlicensed Community install); the events themselves are recorded on every tier. GET /api/v1/admin/audit/evidence-pack for a signed export additionally requires a configured MODULO_EVIDENCE_SIGNING_KEY."
    coverage: "supported"
    provenance: "observed"
    responsibility: "Deciding whether an event is an incident, and recording that decision, is the customer's triage process. Modulo ships a template at docs/security/incident-response-playbook.md; reviewing the trail through the product's admin routes requires the Team tier's audit_viewer feature, and exporting it off the instance additionally requires MODULO_EVIDENCE_SIGNING_KEY."

  - id: "soc2-cc7.4"
    clause: "CC7.4"
    clause_intent: "The entity responds to identified security incidents by executing a defined incident-response programme."
    modulo_control: "Modulo does not operate the customer's incident response. It records, as audit events, the containment actions performed inside the application. Run cancellation genuinely stops a run, and so does a HITL rejection when the gate has no reject or correction target and does not set on_reject: proceed - a reject target routes the run downstream instead, and on_reject: proceed continues it along the normal path. Trigger or organisation pausing stops new trigger-initiated runs. The guardrail kill switch is NOT a stop and must not be counted as containment: enabling it downgrades every bound guardrail to observe (shadow-only, compute-and-log), weakening a control rather than halting execution."
    artifact_type: "customer_records"
    customer_location: "The customer's incident record and post-incident review, supported by the in-application containment actions recorded on every tier and read at GET /api/v1/admin/audit (Team tier's audit_viewer feature plus audit.manage)."
    coverage: "customer-responsibility"
    provenance: "customer-supplied"
    responsibility: "Incident declaration, containment, communication and the evidence of that response belong to the customer."

  - id: "soc2-cc7.5"
    clause: "CC7.5"
    clause_intent: "The entity identifies, develops and implements activities to recover from identified security incidents."
    modulo_control: "Backup and restore runbooks are shipped with the product, and the runtime refuses to start against an unmigrated database rather than serving on an inconsistent schema. The restore itself is executed by the customer's operators."
    artifact_type: "customer_records"
    customer_location: "The customer's restore-test record, guided by docs/operations/backup.md."
    coverage: "customer-responsibility"
    provenance: "customer-supplied"
    responsibility: "Backup configuration, restore drills and recovery-time evidence are the customer's responsibility; the shipped runbook is guidance, not evidence."

  - id: "soc2-cc8.1a"
    clause: "CC8.1"
    clause_intent: "Changes are authorised and approved before implementation."
    modulo_control: "A human-in-the-loop gate marked human_only (the fail-safe default for every gate) interrupts the run until a decision is recorded, at EVERY autonomy level - human_only overrides autonomy - and the decision record persists on the claim row even when a worker job is lost. Such a gate cannot be claimed, approved or rejected by an API key or a programmatic token over REST; a browser session can, and - while the org-wide mcp_human_linked_hitl_authority flag is on, which is the default on every tier - so may a consent-derived, human-linked OAuth credential over MCP. deliver_manual stays browser-only on every path. Only a gate that explicitly opts out with human_only: false follows the pipeline's autonomy level, where fully_autonomous skips it and notify_on_complete auto-approves it at run time; the default gate is never skipped."
    artifact_type: "hitl_decision"
    customer_location: "Decisions at GET /api/v1/hitl/reviews and pending gates at GET /api/v1/runs/{run_id}/hitl/pending; the pipeline's autonomy level and each gate's human_only flag are on GET /api/v1/pipelines/{pipeline_id}."
    coverage: "supported"
    provenance: "observed"
    responsibility: "This covers changes executed as Modulo pipeline runs. A gate configured with human_only: false produces no human decision when its pipeline is set to notify_on_complete or fully_autonomous, and changes made outside the platform must use the customer's own approval process."

  - id: "soc2-cc8.1b"
    clause: "CC8.1"
    clause_intent: "Changes are designed, developed, configured, documented, tested and implemented in a controlled way."
    modulo_control: "Every run executes against an immutable snapshot of the pipeline graph with pinned models, schemas, prompts, guardrails and policy gates. The snapshot id is recorded on the run, so the exact configuration that produced an output can be re-read later."
    artifact_type: "run_snapshot"
    customer_location: "Snapshot history at GET /api/v1/pipelines/{pipeline_id}/snapshots, and the snapshot_id on GET /api/v1/runs/{run_id}."
    coverage: "satisfied"
    provenance: "observed"
    responsibility: "Modulo evidences the configuration and its per-run freeze. Judging whether the change was the right change remains the reviewer's responsibility."

  - id: "soc2-cc8.1c"
    clause: "CC8.1"
    clause_intent: "Changes to the level of automation applied to a system are authorised rather than assumed."
    modulo_control: "Earned autonomy is never automatic. A promotion is an explicit approval capped by the pipeline's maximum autonomy level, applies only to runs created afterwards, and records the previous level, the new level and the reason; a demotion is equally audited."
    artifact_type: "autonomy_change"
    customer_location: "Audit events pipeline.autonomy_promotion_decided and pipeline.autonomy_demoted, recorded on every tier and read at GET /api/v1/admin/audit (Team tier's audit_viewer feature plus audit.manage)."
    coverage: "satisfied"
    provenance: "observed"
    responsibility: "Choosing the autonomy ceiling for a pipeline, and approving each promotion, is the customer's governance decision."

  - id: "soc2-ev-1"
    clause: "EV-1"
    clause_intent: "The evidence supporting an audit assertion is complete, append-only and tamper-evident."
    modulo_control: "Audit events are hash-chained with a per-organisation chain head and event count, the model layer blocks mutation of recorded events, and the chain can be recomputed and compared with the stored head - all of which hold on every tier, because recording and immutability are not licence-gated. RUNNING that verification through the product requires the Team tier: the verify route carries the audit_viewer feature plus audit.manage (HTTP 402 on an unlicensed Community install). The verifier checks at most 10,000 events per call: on a larger trail it returns truncated=true with valid=false, which is a partial-check signal, not evidence of tampering."
    artifact_type: "audit_chain"
    customer_location: "The chain is recorded on every tier; GET /api/v1/admin/audit/verify (Team tier's audit_viewer feature plus audit.manage) returns the re-derived chain result, the checked and total event counts, and the truncated flag - read valid=false together with truncated=true as an incomplete check rather than an integrity failure."
    coverage: "satisfied"
    provenance: "observed"
    responsibility: "The customer must protect the database and its backups, and must read the verifier's truncated flag before treating valid=false as tampering. Modulo proves internal consistency of its own chain, not the integrity of the host."

  - id: "soc2-ev-2"
    clause: "EV-2"
    clause_intent: "The evidence can be exported for an auditor in a form that survives leaving the instance."
    modulo_control: "When both preconditions hold, a signed, offline-verifiable evidence pack carries the audit events, a canonical manifest and an Ed25519 signature, and is verifiable with only the pack and a pre-published public key, with no network access and no Modulo service. Both are REQUIRED and neither is a default: the evidence-pack and verification-key routes carry the Team-tier audit_viewer feature (HTTP 402 on an unlicensed Community install) and signing returns HTTP 503 unless MODULO_EVIDENCE_SIGNING_KEY is configured. On a Community install the trail is still recorded on every tier, but the same audit_viewer feature gates browsing it and verifying its chain, so the trail exists without an admin route to review it and cannot be exported in a form that survives leaving the instance."
    artifact_type: "audit_chain"
    customer_location: "GET /api/v1/admin/audit/evidence-pack for the pack and GET /api/v1/admin/audit/verification-key for the key - both require the Team tier's audit_viewer feature and a configured MODULO_EVIDENCE_SIGNING_KEY. The verification format is documented in docs/offline-verifiable-evidence.md."
    coverage: "supported"
    provenance: "observed"
    responsibility: "The customer must license the Team tier, configure MODULO_EVIDENCE_SIGNING_KEY, publish the verification key to the auditor and retain the exported pack for the audit period. The in-instance chain proves the record Modulo holds; only the export moves it beyond the instance."
