[alembic]
script_location = src/modulo/db/migrations
prepend_sys_path = .
path_separator = os
# NO sqlalchemy.url DEFAULT. env.py resolves the migration target from
# DATABASE_ADMIN_URL / DATABASE_URL (process environment or the backend/.env
# the application itself reads) and refuses to run when neither is set.
# A URL here is a trap: `alembic upgrade heads` used to fall back to a
# hardcoded localhost database whenever DATABASE_URL lived only in .env, so a
# custom or remote deployment silently migrated the wrong database
# (FAR-2183 F5). Do not add one back.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
