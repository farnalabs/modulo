# Security Audit Policy
# ---------------------
# Dependency versions are pinned to minimums that fix known CVEs where possible.
# Run `pip-audit` after any dependency change. The CI workflow
# (.github/workflows/security-audit.yml) runs weekly and on PRs touching deps.
# See docs/security/dependency-policy.md for severity SLAs and false-positive process.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modulo"
version = "0.1.0"
description = "Self-hosted agentic SDLC platform"
requires-python = ">=3.12"
dependencies = [
    # Settings
    "pydantic-settings>=2.3.0",
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    # LangGraph + LangChain
    # PYSEC-2026-83 / CVE-2026-28277: RCE via msgpack checkpoint deserialization
    "langgraph>=1.0.10",
    # Required by langgraph>=1.0.10
    "langchain-core>=1.2.31",
    "langchain-anthropic>=1.4.0",
    # PYSEC-2026-76 / CVE-2026-41488: SSRF via TOCTOU in _url_to_size()
    "langchain-openai>=1.1.14",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    # MariaDB (async MySQL)
    "asyncmy>=0.2.9",
    # HTTP client (GitHub connector)
    "httpx>=0.27.0",
    # Auth + crypto
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    # SSO / OIDC
    "authlib>=1.3.0",
    # SSO / SAML 2.0
    "python3-saml>=1.16.0",
    # XML parsing (safe, for SAML)
    "defusedxml>=0.7.1",
    # Templating
    "jinja2>=3.1.4",
    # YAML
    "pyyaml>=6.0.1",
    "jsonschema>=4.26.0",
    # Observability
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    # Structured logging
    "python-json-logger>=2.0.0",
    # Task queue (optional alpha)
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "croniter>=2.0.0",
    "jmespath>=1.0.1",
    "mcp>=1.0.0",
    # Fixes CVE-2025-64439 (RCE via jsonplus) and CVE-2026-27794 (RCE via pickle)
    "langgraph-checkpoint-postgres>=3.0.0",
    "psycopg-binary>=3.3.4",
    "types-jmespath>=1.1.0.20260508",
    # Runtime environments
    "e2b>=0.15.0",
    # CLI
    "click>=8.1.0",
    "tqdm>=4.66.0",
]

[project.scripts]
modulo = "modulo.cli.backup:cli"
modulo-migrate = "modulo.cli.migrate:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-bdd>=7.2.0",
    "pytest-xdist>=3.5.0",
    "pytest-playwright>=0.5.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "testcontainers[postgres]>=4.5.0",
    "factory-boy>=3.3.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
    "semgrep>=1.70.0",
    "import-linter>=2.1",
    "pre-commit>=3.7.0",
    "types-PyYAML>=6.0.12",
    "types-passlib>=1.7.7",
    "pip-audit>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/modulo"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear (real bugs)
    "S",        # flake8-bandit (security)
    "ASYNC",    # flake8-async (sync calls in async context)
    "RUF",      # ruff-specific rules
]
ignore = [
    "S101",     # assert allowed in tests
    "S105",     # hardcoded passwords (test fixtures have them)
    "B008",     # FastAPI Depends() in function defaults is the idiomatic pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"src/modulo/auth/sso.py" = ["N817"]
"tests/unit/auth/test_sso.py" = ["N817"]
"src/modulo/api/routes/scim.py" = ["N815", "N803"]
"tests/unit/scim/test_scim_provisioning.py" = ["N815", "N803"]
"src/modulo/db/repositories/locks.py" = ["ASYNC109"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain.*", "testcontainers.*", "factory.*", "jose.*", "passlib.*", "celery", "celery.*", "croniter", "croniter.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.bdd", "tests.bdd.*", "tests.bdd.steps", "tests.bdd.steps.*"]
ignore_missing_imports = true
allow_untyped_decorators = true
allow_untyped_defs = true
disallow_any_unimported = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q -m 'not awaiting-implementation'"
markers = [
    "integration: marks tests as integration tests (require Postgres)",
    "e2e: marks tests as end-to-end (require browser + running app)",
    "slow: marks tests as slow",
    "awaiting-implementation: marks scenarios that define desired behaviour not yet delivered",
]

[tool.coverage.run]
source = ["src/modulo"]
omit = ["*/tests/*", "*/migrations/*", "*/stub/*"]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

# [tool.uv.scripts]  -- removed; this field is not supported by hatchling/pip
lint-imports = "lint-imports"

[tool.importlinter]
root_package = "modulo"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.1.0",
    "playwright>=1.60.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3.1",
    "respx>=0.23.1",
    "ruff>=0.15.18",
]
