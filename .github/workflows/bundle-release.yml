name: "Bundle: single-install artifact (bundle-v*)"

# FAR-670 -- P1a bundle pipeline for the single-install native distribution
# (ADR 031). This workflow is now a reusable workflow_call invoked by
# release-unified.yml (FAR-1869). It builds the linux-amd64 tar.gz artifact,
# generates SHA256SUMS, signs the release manifest, and produces cosign/SLSA
# attestations. The caller (release-unified.yml) pushes the bundle-v* tag
# and creates the GitHub Release.

on:
  workflow_call:
    inputs:
      version:
        description: "Release version in X.Y.Z form (e.g. 0.1.0)"
        type: string
        required: true
      rc_tag:
        description: "RC tag being released (e.g. v0.1.0-rc1)"
        type: string
        required: true
      ref:
        description: "Git ref to build from (the RC tag for cut/recut; main for a dry-run)"
        type: string
        required: true
    secrets:
      BUNDLE_MANIFEST_SIGNING_KEY:
        required: true
      GH_TOKEN:
        required: true

concurrency:
  group: bundle-${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  version-parity:
    # Shared-constants rule (ADR 031, Decision 3/11): the bundle's pinned
    # majors must match the docker-compose.yml image tags. This is the CI
    # assertion over scripts/bundle-versions.env; a later ticket also asserts
    # it from the compose side. Fail loudly on drift -- never warn.
    name: Assert bundle versions match docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build from the RC commit, never from whatever the caller's ref
          # happens to be: a recut after main moved must publish artefacts that
          # match the tagged/validated RC.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Assert bundle-versions.env majors match docker-compose.yml tags
        run: |
          set -euo pipefail
          source scripts/bundle-versions.env

          pg_compose_major="$(grep -m1 -E '^[[:space:]]*image:[[:space:]]*postgres:' docker-compose.yml | sed -E 's/.*postgres:([0-9]+).*/\1/' || true)"
          redis_compose_major="$(grep -m1 -E '^[[:space:]]*image:[[:space:]]*redis:' docker-compose.yml | sed -E 's/.*redis:([0-9]+).*/\1/' || true)"

          case "${pg_compose_major}" in
            '' | *[!0-9]*) echo "::error::could not parse a postgres major version from docker-compose.yml (got '${pg_compose_major}')"; exit 1 ;;
            *) : ;;
          esac
          case "${redis_compose_major}" in
            '' | *[!0-9]*) echo "::error::could not parse a redis major version from docker-compose.yml (got '${redis_compose_major}')"; exit 1 ;;
            *) : ;;
          esac
          if [ "${PG_MAJOR}" != "${pg_compose_major}" ]; then
            echo "::error::version drift: bundle pins PostgreSQL major ${PG_MAJOR} (scripts/bundle-versions.env) but docker-compose.yml pins major ${pg_compose_major}. Bump both together."
            exit 1
          fi
          if [ "${REDIS_MAJOR}" != "${redis_compose_major}" ]; then
            echo "::error::version drift: bundle pins Redis major ${REDIS_MAJOR} (scripts/bundle-versions.env) but docker-compose.yml pins major ${redis_compose_major}. Bump both together."
            exit 1
          fi
          echo "parity OK: postgres ${PG_MAJOR}, redis ${REDIS_MAJOR} (bundle == docker-compose)"

  bundle:
    # linux-amd64 only for now; the matrix structure below is where linux-arm64
    # slots in (scripts/bundle-versions.env already carries the arm64 pins).
    name: Bundle linux-${{ matrix.arch }}
    needs: version-parity
    # Ubuntu 22.04 (glibc 2.35) build baseline -- see scripts/bundle-versions.env. Do NOT change without re-checking the glibc floor.
    runs-on: ubuntu-22.04
    # The caller supplies the workflow token, but this reusable job only checks
    # out the requested ref and uploads workflow artefacts. It never creates a
    # tag, pushes a ref, or calls a repository-write API, so read is sufficient
    # and keeps the reusable contract valid for the unified dry-run caller.
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build from the RC commit (see version-parity above).
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve pinned versions (scripts/bundle-versions.env)
        run: |
          set -euo pipefail
          source scripts/bundle-versions.env
           case "${{ matrix.arch }}" in
             amd64) PBS_TARBALL="$PBS_AMD64_TARBALL"; PBS_SHA256="$PBS_CPYTHON_AMD64_SHA256" ;;
             arm64) PBS_TARBALL="$PBS_ARM64_TARBALL"; PBS_SHA256="$PBS_CPYTHON_ARM64_SHA256" ;;
             *) echo "::error::unsupported matrix arch: ${{ matrix.arch }}" >&2; exit 1 ;;
           esac

          VERSION_NUM="${{ inputs.version }}"
          {
            echo "ARCH=${{ matrix.arch }}"
            echo "VERSION_NUM=${VERSION_NUM}"
            echo "PBS_RELEASE=${PBS_RELEASE}"
            echo "PBS_TARBALL=${PBS_TARBALL}"
            echo "PBS_SHA256=${PBS_SHA256}"
            echo "PG_VERSION=${PG_VERSION}"
            echo "PG_SOURCE_URL=${PG_SOURCE_URL}"
            echo "PG_SOURCE_SHA256=${PG_SOURCE_SHA256}"
            echo "PG_REQUIRED_EXTENSIONS=${PG_REQUIRED_EXTENSIONS}"
            echo "REDIS_VERSION=${REDIS_VERSION}"
            echo "BUNDLE_ROOT=modulo-${VERSION_NUM}-linux-${{ matrix.arch }}"
            echo "TARBALL_NAME=modulo-${VERSION_NUM}-linux-${{ matrix.arch }}.tar.gz"
          } >> "$GITHUB_ENV"

      - name: Download and sha256-verify python-build-standalone
        run: |
          set -euo pipefail
          mkdir -p downloads
          curl -fsSL --proto '=https' --retry 3 --retry-delay 2 -o "downloads/${PBS_TARBALL}" \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE}/${PBS_TARBALL}"
          echo "${PBS_SHA256}  ${PBS_TARBALL}" | (cd downloads && sha256sum --check --strict -)

      - name: Install pinned PostgreSQL source-build dependencies
        run: |
          set -euo pipefail
          # PostgreSQL is compiled only in this release workflow, never in the
          # product runtime or customer installer. The explicit Jammy package
          # list keeps the source build reproducible and documents why the
          # configure flags below need no distro PostgreSQL package:
          # build-essential = compiler/linker/make; flex+bison = parser tools;
          # ca-certificates/curl/tar/gzip = verified source retrieval/extraction.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential \
            bison \
            ca-certificates \
            curl \
            flex \
            gzip \
            tar

      - name: Download and sha256-verify pinned PostgreSQL source
        run: |
          set -euo pipefail
          mkdir -p downloads
          curl -fsSL --proto '=https' --retry 3 --retry-delay 2 -o "downloads/postgresql-${PG_VERSION}.tar.gz" "${PG_SOURCE_URL}"
          echo "${PG_SOURCE_SHA256}  postgresql-${PG_VERSION}.tar.gz" | (cd downloads && sha256sum --check --strict -)
          test -s "downloads/postgresql-${PG_VERSION}.tar.gz"

      - name: Verify PostgreSQL extension inventory before source build
        run: |
          set -euo pipefail
          # Keep the supported inventory explicit. An empty inventory is valid,
          # but any product/runtime requirement must be added deliberately before
          # contrib is built or the release can pass.
          required_extensions="${PG_REQUIRED_EXTENSIONS}"
          extension_hits="$(mktemp)"
          trap 'rm -f "$extension_hits"' EXIT
          grep -RniE --include='*.py' --include='*.sql' \
            -e 'CREATE[[:space:]]+EXTENSION' \
            -e 'required_extensions?' \
            -e 'extension_requirements?' \
            backend/src/modulo/db/migrations backend/src/modulo > "$extension_hits" || true
          if [ -s "$extension_hits" ]; then
            while IFS= read -r hit; do
              extension_name="$(printf '%s\n' "$hit" | sed -nE 's/.*CREATE[[:space:]]+EXTENSION([[:space:]]+IF[[:space:]]+NOT[[:space:]]+EXISTS)?[[:space:]]+([a-zA-Z0-9_]+).*/\2/p' | head -n1)"
              if [ -z "$extension_name" ]; then
                echo "::error::unclassified PostgreSQL extension requirement: $hit" >&2
                exit 1
              fi
              case ",$required_extensions," in
                *,"$extension_name",*) ;;
                *) echo "::error::PostgreSQL extension $extension_name is required but not in PG_REQUIRED_EXTENSIONS" >&2; exit 1 ;;
              esac
            done < "$extension_hits"
          fi
          if [ -n "$required_extensions" ]; then
            echo "PostgreSQL extension inventory: $required_extensions"
          else
            echo "PostgreSQL extension inventory is explicitly empty"
          fi

      - name: Build and sha256-verify PostgreSQL from pinned upstream source
        run: |
          set -euo pipefail
          rm -rf pg-src pg-build "build/${BUNDLE_ROOT}/pg"
          mkdir -p pg-src pg-build "build/${BUNDLE_ROOT}/pg"
          tar -xzf "downloads/postgresql-${PG_VERSION}.tar.gz" -C pg-src --strip-components=1
          test -x pg-src/configure
          BUNDLE_PG_PREFIX="$PWD/build/${BUNDLE_ROOT}/pg"
          (
            cd pg-build
            ../pg-src/configure \
                --prefix="$BUNDLE_PG_PREFIX" \
              --without-readline \
              --without-zlib \
              --without-icu \
              --without-llvm
            # No contrib build: the preceding inventory scan proves whether
            # product/runtime SQL requires an extension.
            make -j"$(nproc)"
            make install
          )
          test -x "$BUNDLE_PG_PREFIX/bin/postgres"
          test -x "$BUNDLE_PG_PREFIX/bin/initdb"
          test -x "$BUNDLE_PG_PREFIX/bin/pg_dump"
          test -f "$BUNDLE_PG_PREFIX/share/postgresql/postgres.bki"
          test -d "$BUNDLE_PG_PREFIX/share/postgresql/timezonesets"
          test -z "${PG_REQUIRED_EXTENSIONS}"
          test "$("$BUNDLE_PG_PREFIX/bin/pg_config" --version)" = "PostgreSQL ${PG_VERSION}"
          sharedir="$("$BUNDLE_PG_PREFIX/bin/pg_config" --sharedir)"
          test "$sharedir" = "$BUNDLE_PG_PREFIX/share/postgresql"
          case "$sharedir" in
            "$BUNDLE_PG_PREFIX"/*) : ;;
            *) echo "::error::PostgreSQL sharedir escaped the bundle prefix: $sharedir" >&2; exit 1 ;;
          esac

      - name: Build and sha256-verify Redis from pinned upstream source
        run: |
          set -euo pipefail
          source scripts/bundle-versions.env
          mkdir -p downloads
          curl -fsSL --proto '=https' --retry 3 --retry-delay 2 -o "downloads/redis-src.tar.gz" "${REDIS_SOURCE_URL}"
          if [ ! -s downloads/redis-src.tar.gz ]; then
            echo "::error::Redis source tarball is missing or empty after download: downloads/redis-src.tar.gz"
            exit 1
          fi
          # The manifest names the file RELATIVE to the directory sha256sum
          # runs in. Keep the name bare: `cd downloads` + a `downloads/`-prefixed
          # path looks for downloads/downloads/redis-src.tar.gz and fails.
          echo "${REDIS_SOURCE_SHA256}  redis-src.tar.gz" | (cd downloads && sha256sum --check --strict -)
          rm -rf redis-src
          mkdir -p redis-src
          tar -xzf downloads/redis-src.tar.gz -C redis-src --strip-components=1
          make -C redis-src -j"$(nproc)"
          rm -rf build/redis-install
          make -C redis-src PREFIX="$PWD/build/redis-install" install
          test -x build/redis-install/bin/redis-server
          test -x build/redis-install/bin/redis-cli

      - name: Install patchelf (bundle RUNPATH tool)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends patchelf
          patchelf --version

      - name: Assemble bundle layout
        run: |
          set -euo pipefail
          source scripts/bundle-versions.env
          BUNDLE="build/${BUNDLE_ROOT}"
          mkdir -p "$BUNDLE/runtime" "$BUNDLE/pg" "$BUNDLE/redis"

          # CPython runtime (glibc build -- x86_64/aarch64-unknown-linux-gnu).
          # Strip the top-level `python/` dir so runtime/ IS the interpreter
          # tree: runtime/bin/python3.12, runtime/lib/...
          tar -xzf "downloads/${PBS_TARBALL}" -C "$BUNDLE/runtime" --strip-components=1

          # PostgreSQL server + client were compiled directly into the bundle
          # prefix so pg_config --sharedir and runtime data remain relocatable.
          test -x "$BUNDLE/pg/bin/postgres"
          test -x "$BUNDLE/pg/bin/initdb"
          test -x "$BUNDLE/pg/bin/pg_dump"
          test -f "$BUNDLE/pg/share/postgresql/postgres.bki"
          test -d "$BUNDLE/pg/share/postgresql/timezonesets"
          sharedir="$("$BUNDLE/pg/bin/pg_config" --sharedir)"
          test "$sharedir" = "$BUNDLE/pg/share/postgresql"
          case "$sharedir" in
            "$BUNDLE"/*) : ;;
            *) echo "::error::bundled PostgreSQL sharedir escaped the bundle: $sharedir" >&2; exit 1 ;;
          esac

          # Redis, compiled from source on this runner (see the build step above).
          cp -a build/redis-install/bin/. "$BUNDLE/redis/"
          test -x "$BUNDLE/redis/redis-server"
          test -x "$BUNDLE/redis/redis-cli"
          # Also copy redis binaries to pg/bin so the bundled-binaries verification finds them.
          cp -a build/redis-install/bin/. "$BUNDLE/pg/bin/"
          test -x "$BUNDLE/pg/bin/redis-server"
          test -x "$BUNDLE/pg/bin/redis-cli"
          # PostgreSQL's source build installs libpq beside the server. Bake
          # an $ORIGIN-relative RUNPATH into every bundled ELF so the loader
          # finds pg/lib with no inherited environment at all; the launcher
          # deliberately scrubs every LD_* variable at boot (ADR 031 Decision 2).
          test -f "${BUNDLE}/pg/lib/libpq.so.5"

          for binary in "${BUNDLE}"/pg/bin/*; do
            [ -f "$binary" ] || continue
            if readelf -h "$binary" >/dev/null 2>&1; then
              patchelf --set-rpath "\$ORIGIN/../lib" "$binary"
            fi
          done

          # Native bundle entrypoint. Keep this as a small POSIX wrapper so the
          # shipped command uses the bundled CPython runtime and dependencies,
          # while the implementation remains in modulo.cli.main.
          cat > "$BUNDLE/launcher" <<'LAUNCHER'
          #!/bin/sh
          set -eu

          case "$0" in
            */*) launcher_dir=${0%/*} ;;
            *) launcher_dir=. ;;
          esac
          BUNDLE_ROOT=$(CDPATH= cd -- "$launcher_dir" && pwd)
          SITE_PACKAGES="$BUNDLE_ROOT/backend/.venv/lib/python3.12/site-packages"
          export PATH="$BUNDLE_ROOT/runtime/bin:$BUNDLE_ROOT/pg/bin:$BUNDLE_ROOT/redis${PATH:+:$PATH}"
          export PYTHONPATH="$BUNDLE_ROOT/backend/src:$SITE_PACKAGES"
          export MODULO_BUNDLED_BIN_DIR="$BUNDLE_ROOT/pg/bin"

          exec "$BUNDLE_ROOT/runtime/bin/python3" -c \
            'from modulo.cli.main import cli; cli()' "$@"
          LAUNCHER
          chmod 755 "$BUNDLE/launcher"

          echo "bundle-v${VERSION_NUM}" > "$BUNDLE/VERSION"

      - name: Scan shipped PostgreSQL ELF files for build and host paths
        run: |
          set -euo pipefail
          BUNDLE="$(cd "build/${BUNDLE_ROOT}" && pwd)"
          build_prefix="$PWD/build/${BUNDLE_ROOT}/pg"
          fail=0
          checked=0
          while IFS= read -r -d '' binary; do
            checked=$((checked + 1))
            if ! readelf -h "$binary" >/dev/null 2>&1; then
              echo "::error::executable under pg/bin is not an ELF binary: $binary" >&2
              fail=1
              continue
            fi
            if strings -a "$binary" | grep -Fq "$build_prefix"; then
              echo "::error::PostgreSQL ELF embeds the original build prefix: $binary" >&2
              fail=1
            fi
            while IFS= read -r forbidden; do
              echo "::error::PostgreSQL ELF embeds an unexpected absolute PostgreSQL path ($forbidden): $binary" >&2
              fail=1
            done < <(strings -a "$binary" | grep -E '/(usr|opt|home)/[^ ]*(postgresql|pgsql)' | sort -u || true)
            if readelf -d "$binary" | grep -Eq 'R(PATH|UNPATH).*\[(/|[^]]*:[^$])'; then
              echo "::error::executable has an absolute or non-origin dynamic library path: $binary" >&2
              fail=1
            fi
            if readelf -d "$binary" | grep -Eq 'NEEDED.*\[/'; then
              echo "::error::executable has an absolute dynamic dependency: $binary" >&2
              fail=1
            fi
          done < <(find "$BUNDLE/pg/bin" -type f -perm /111 -print0)
          if [ "$checked" -eq 0 ]; then
            echo "::error::no executable files found under pg/bin" >&2
            exit 1
          fi
          exit "$fail"

      - name: Assert bundled service binaries stay within the glibc 2.35 floor
        run: |
          set -euo pipefail
          BUNDLE="build/${BUNDLE_ROOT}"
          floor="2.35"
          fail=0
          checked=0
          check_binary() {
            local bin="$1"
            local max
            checked=$((checked + 1))
            max="$(objdump -p "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -Vu | tail -n1)"
            if [ -z "$max" ]; then
              echo "::error::could not determine the glibc requirement of ${bin}" >&2
              fail=1
              return
            fi
            if [ "$(printf '%s\n%s\n' "$floor" "$max" | sort -V | tail -n1)" != "$floor" ]; then
              echo "::error::${bin} requires GLIBC_${max}, above the ${floor} floor (would fail on Ubuntu 22.04)" >&2
              fail=1
            else
              echo "ok: ${bin} max GLIBC_${max} (<= ${floor})"
            fi
          }
          while IFS= read -r -d '' binary; do
            check_binary "$binary"
          done < <(find "$BUNDLE/pg/bin" "$BUNDLE/redis" -type f -perm /111 -print0)
          if [ "$checked" -eq 0 ]; then
            echo "::error::no executable ELF files found for glibc validation" >&2
            exit 1
          fi
          exit "$fail"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Stage backend into the bundle
        working-directory: backend
        run: |
          set -euo pipefail
          # Keep the global --no-build supply-chain boundary. These three IBM
          # COS packages are the only locked sdist-only dependencies; install
          # their exact locked archives separately below with build hashes.
          IBM_COS_BUILD_CONSTRAINTS="$(mktemp)"
          trap 'rm -f "${IBM_COS_BUILD_CONSTRAINTS}"' EXIT
          cat > "${IBM_COS_BUILD_CONSTRAINTS}" <<'EOF'
          pip==26.2.2 --hash=sha256:fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70
          setuptools==84.2.1 --hash=sha256:ca140b45d5325a9478f880e351484f62fef15f336462e449ca0c03c873d589c2
          EOF

          uv sync --frozen --no-dev --no-build \
            --no-install-package ibm-cos-sdk \
            --no-install-package ibm-cos-sdk-core \
            --no-install-package ibm-cos-sdk-s3transfer

          uv pip install --python .venv/bin/python \
            --require-build-hashes \
            --build-constraints "${IBM_COS_BUILD_CONSTRAINTS}" \
            --no-deps \
            'ibm-cos-sdk @ https://files.pythonhosted.org/packages/98/b8/b99f17ece72d4bccd7e75539b9a294d0f73ace5c6c475d8f2631afd6f65b/ibm_cos_sdk-2.14.3.tar.gz#sha256=643b6f2aa1683adad7f432df23407d11ae5adb9d9ad01214115bee77dc64364a' \
            'ibm-cos-sdk-core @ https://files.pythonhosted.org/packages/7e/45/80c23aa1e13175a9deefe43cbf8e853a3d3bfc8dfa8b6d6fe83e5785fe21/ibm_cos_sdk_core-2.14.3.tar.gz#sha256=85dee7790c92e8db69bf39dae4c02cac211e3c1d81bb86e64fa2d1e929674623' \
            'ibm-cos-sdk-s3transfer @ https://files.pythonhosted.org/packages/f3/ff/c9baf0997266d398ae08347951a2970e5e96ed6232ed0252f649f2b9a7eb/ibm_cos_sdk_s3transfer-2.14.3.tar.gz#sha256=2251ebfc4a46144401e431f4a5d9f04c262a0d6f95c88a8e71071da056e55f72'
          BUNDLE="../build/${BUNDLE_ROOT}"
          mkdir -p "$BUNDLE/backend"
          cp -a src "$BUNDLE/backend/src"
          cp pyproject.toml uv.lock "$BUNDLE/backend/"
          cp -a .venv "$BUNDLE/backend/.venv"

      - name: Smoke the bundled launcher
        run: |
          set -euo pipefail
          BUNDLE="build/${BUNDLE_ROOT}"
          test -x "$BUNDLE/launcher"
          if grep -qF 'PLACEHOLDER' "$BUNDLE/launcher"; then
            echo 'launcher still contains the retired placeholder' >&2
            exit 1
          fi
          env -i HOME="$HOME" PATH="$BUNDLE/runtime/bin:$BUNDLE/pg/bin:$BUNDLE/redis" \
            "$BUNDLE/launcher" apply --help

      - name: Assert bundled libpq is reachable and loaded from the bundle
        run: |
          set -euo pipefail
          BUNDLE="$(cd "build/${BUNDLE_ROOT}" && pwd)"
          test -f "$BUNDLE/pg/lib/libpq.so.5"
          checked=0
          for binary in "$BUNDLE"/pg/bin/*; do
            [ -f "$binary" ] || continue
            if ! readelf -d "$binary" 2>/dev/null | grep -Fq 'libpq.so.5'; then
              continue
            fi
            checked=$((checked + 1))
            if ! readelf -d "$binary" | grep -Fq 'ORIGIN/../lib'; then
              echo "::error::$(basename "$binary") does not carry RUNPATH \$ORIGIN/../lib; bundled libpq is unreachable at runtime" >&2
              exit 1
            fi
            resolved="$(env -i PATH=/usr/bin:/bin ldd "$binary" | grep -F 'libpq.so.5 =>' | sed 's/.* => //; s/ .*//')"
            if [ -z "$resolved" ] || [ "$(realpath "$resolved")" != "$(realpath "$BUNDLE/pg/lib/libpq.so.5")" ]; then
              echo "::error::$(basename "$binary") resolves libpq outside the bundle: ${resolved:-<none>}" >&2
              exit 1
            fi
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::no bundled binary links libpq.so.5 - cannot prove reachability" >&2
            exit 1
          fi

          # Execute with the loader's library trace and pin the loaded libpq to
          # the bundle. This is deliberately stronger than `ldd`: on a host
          # that HAS libpq, a missing/incorrect RUNPATH would silently fall
          # back to the system copy, so asserting the resolved path is inside
          # the bundle is what catches the regression. On a libpq-less host an
          # unreachable bundle fails the exec outright.
          trace="$(env -i LD_DEBUG=libs "$BUNDLE/pg/bin/pg_dump" --version 2>&1 >/dev/null)"
          if ! printf '%s\n' "$trace" | grep -Fq "$BUNDLE/pg/lib/libpq.so.5" \
            && ! printf '%s\n' "$trace" | grep -Fq "$BUNDLE/pg/bin/../lib/libpq.so.5"; then
            echo "::error::pg_dump did not load libpq from the bundle" >&2
            printf '%s\n' "$trace" | head -50 >&2
            exit 1
          fi
          echo "checked ${checked} binary/binaries; libpq loaded from $BUNDLE/pg/lib/libpq.so.5"

      - name: Set up Node + pnpm (pinned to match frontend/package.json)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend dist (pnpm) and stage into the bundle
        run: |
          set -euo pipefail
          cd frontend
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          BUNDLE="../build/${BUNDLE_ROOT}"
          mkdir -p "$BUNDLE/frontend-dist"
          cp -a dist/. "$BUNDLE/frontend-dist/"

      - name: Generate SHA256SUMS over every shipped file
        run: |
          set -euo pipefail
          cd "build/${BUNDLE_ROOT}"
          TMP_SUMS="$(mktemp)"
          find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$TMP_SUMS"
          mv "$TMP_SUMS" SHA256SUMS
          wc -l SHA256SUMS

      - name: Create tar.gz and its release checksum
        run: |
          set -euo pipefail
          cd build
          tar -czf "${TARBALL_NAME}" "${BUNDLE_ROOT}"
          sha256sum "${TARBALL_NAME}" > SHA256SUMS
          cat SHA256SUMS
          ls -lh "${TARBALL_NAME}"

      # FAR-675 (ADR 031 Decision 3, P1b): build -> SIGN the release manifest ->
      # publish (the chain of custody). The manifest covers every shipped
      # artifact (the tarball + the major bundled binaries' sha256+version) and
      # is signed with the ed25519 private key in the CI secret
      # BUNDLE_MANIFEST_SIGNING_KEY (hex).
      - name: Smoke the final PostgreSQL tarball after relocation as an unprivileged user
        run: |
          set -euo pipefail
          tarball="build/${TARBALL_NAME}"
          original_bundle="$(cd "build/${BUNDLE_ROOT}" && pwd)"
          smoke_root="$(mktemp -d)"
          smoke_user="modulo-pg-smoke"
          cleanup() {
            if id "$smoke_user" >/dev/null 2>&1; then sudo userdel "$smoke_user" >/dev/null 2>&1 || true; fi
            if [ -d "$smoke_root/original" ] && [ ! -e "$original_bundle" ]; then mv "$smoke_root/original" "$original_bundle"; fi
            rm -rf "$smoke_root"
          }
          trap cleanup EXIT
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin "$smoke_user"
          mv "$original_bundle" "$smoke_root/original"
          test ! -e "$original_bundle"
          extract_root="$smoke_root/extracted"
          mkdir -p "$extract_root"
          tar -xzf "$tarball" -C "$extract_root"
          smoke_bundle="$extract_root/$BUNDLE_ROOT"
          smoke_data="$smoke_root/data"
          smoke_socket="$smoke_root/socket"
          smoke_dump="$smoke_root/roundtrip.sql"
          smoke_script="$smoke_root/run-smoke.sh"
          mkdir -p "$smoke_data" "$smoke_socket"
          cat > "$smoke_script" <<'SMOKE_EOF'
          #!/usr/bin/env bash
          set -eu
          : "${SMOKE_BUNDLE:?SMOKE_BUNDLE is required}"
          : "${PGDATA:?PGDATA is required}"
          : "${SMOKE_SOCKET:?SMOKE_SOCKET is required}"
          : "${SMOKE_DUMP:?SMOKE_DUMP is required}"
          test "$(pg_config --sharedir)" = "$SMOKE_BUNDLE/pg/share/postgresql"
          case "$(pg_config --sharedir)" in "$SMOKE_BUNDLE"/*) : ;; *) exit 1 ;; esac
          initdb --pgdata "$PGDATA" --username modulo --auth=trust --locale C
          pg_ctl --pgdata "$PGDATA" --log "$PGDATA/postgres.log" \
            --options="-k $SMOKE_SOCKET -p 55432" start -w
          trap 'pg_ctl --pgdata "$PGDATA" stop -m fast -w' EXIT
          psql --host "$SMOKE_SOCKET" --port 55432 --username modulo --dbname postgres \
            --command "SELECT 1;"
          psql --host "$SMOKE_SOCKET" --port 55432 --username modulo --dbname postgres \
            --command "SET TIME ZONE 'America/New_York'; SELECT now() AT TIME ZONE 'UTC';"
          createdb --host "$SMOKE_SOCKET" --port 55432 --username modulo roundtrip
          psql --host "$SMOKE_SOCKET" --port 55432 --username modulo --dbname roundtrip \
            --command "CREATE TABLE proof(value integer); INSERT INTO proof VALUES (2192);"
          pg_dump --format=custom --host "$SMOKE_SOCKET" --port 55432 --username modulo --file "$SMOKE_DUMP" roundtrip
          dropdb --host "$SMOKE_SOCKET" --port 55432 --username modulo roundtrip
          createdb --host "$SMOKE_SOCKET" --port 55432 --username modulo roundtrip
          pg_restore --exit-on-error --host "$SMOKE_SOCKET" --port 55432 --username modulo --dbname roundtrip "$SMOKE_DUMP"
          test "$(psql --host "$SMOKE_SOCKET" --port 55432 --username modulo --dbname roundtrip --tuples-only --no-align --command "SELECT value FROM proof")" = "2192"
          SMOKE_EOF
          chmod 0755 "$smoke_script"
          chown -R "$smoke_user:$smoke_user" "$smoke_root"
          sudo -u "$smoke_user" env -i \
            HOME="$smoke_root/home" \
            PATH="$smoke_bundle/pg/bin:/usr/bin:/bin" \
            PGDATA="$smoke_data" \
            SMOKE_BUNDLE="$smoke_bundle" \
            SMOKE_SOCKET="$smoke_socket" \
            SMOKE_DUMP="$smoke_dump" \
            bash "$smoke_script"

          if grep -R -E '/(usr|opt|home)/[^ ]*(postgresql|pgsql)' "$smoke_data/postgres.log"; then
            echo "::error::final PostgreSQL tarball smoke used a host PostgreSQL path" >&2
            exit 1
          fi
          echo "final tarball PostgreSQL relocation smoke passed: initdb, postgres, psql, timezone, pg_dump/restore"

      - name: Generate and sign the SIGNED release manifest

        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.BUNDLE_MANIFEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MANIFEST_SIGNING_KEY}" ]; then
            echo "::error::BUNDLE_MANIFEST_SIGNING_KEY is NOT set - refusing to publish an UNSIGNED release manifest."
            echo "::error::Provisioning is the ONE-TIME owner task (Duncan): generate an ed25519 keypair; add the private key's hex as the repo secret BUNDLE_MANIFEST_SIGNING_KEY; paste the public half into backend/src/modulo/launcher/manifest.py (_TRUST_ROWS) and scripts/install.sh (TRUST_KEY_CURRENT_B64/NEXT_B64). Rotation per ADR 031 Decision 3."
            exit 1
          fi
          cd backend
          uv run --no-sync --no-build python - <<'PYEOF'
          import hashlib, json, os, sys

          sys.path.insert(0, "src")
          from modulo.launcher import manifest as manifest_module

          version = os.environ["VERSION_NUM"]
          arch = os.environ["ARCH"]
          tarball_name = os.environ["TARBALL_NAME"]
          bundle_dirname = os.environ["BUNDLE_ROOT"]
          build_root = os.path.join("..", "build")
          pg_version = os.environ.get("PG_VERSION") or "unknown"
          redis_version = os.environ.get("REDIS_VERSION") or "unknown"

          def digest_for(path):
              with open(path, "rb") as handle:
                  return hashlib.sha256(handle.read()).hexdigest()

          artifacts = [{"name": tarball_name, "sha256": digest_for(os.path.join(build_root, tarball_name)), "version": version}]
          for shipped, component in (("pg/bin/postgres", pg_version), ("pg/bin/pg_dump", pg_version), ("redis/redis-server", redis_version)):
              shipped_path = os.path.join(build_root, bundle_dirname, shipped)
              if os.path.isfile(shipped_path):
                  artifacts.append({"name": shipped, "sha256": digest_for(shipped_path), "version": component})
          manifest = manifest_module.build_release_manifest(
              release=f"bundle-v{version}",
              platform=f"linux-{arch}",
              generated_at=os.environ.get("GITHUB_SHA", ""),
              components={"postgres": pg_version, "redis": redis_version, "python": "3.12"},
              artifacts=artifacts,
          )
          payload = json.dumps(manifest, indent=2, sort_keys=True).encode("utf-8")
          signing_key = os.environ["MANIFEST_SIGNING_KEY"]
          if len(signing_key) != 64:
              raise SystemExit("BUNDLE_MANIFEST_SIGNING_KEY must be exactly 32-byte Ed25519 private-key hex")
          try:
              int(signing_key, 16)
          except ValueError as exc:
              raise SystemExit("BUNDLE_MANIFEST_SIGNING_KEY must contain only hexadecimal characters") from exc
          signature = manifest_module.sign_release_bytes(
              payload, key_id=manifest_module._KEY_ID_CURRENT, private_key_hex=signing_key
          )
          if signature["key_id"] != manifest_module._KEY_ID_CURRENT:
              raise SystemExit("generated manifest signature used an unexpected key_id")
          try:
              verified_key_id = manifest_module.verify_signature(payload, signature)
          except manifest_module.ManifestSecurityError as exc:
              raise SystemExit(f"generated manifest signature failed trust-store verification: {exc}") from exc
          if verified_key_id != manifest_module._KEY_ID_CURRENT:
              raise SystemExit("generated manifest signature did not verify under the expected current key_id")
          print(f"manifest signature verified under expected key_id {verified_key_id}")
          with open(os.path.join(build_root, "RELEASE_MANIFEST.json"), "wb") as handle:
              handle.write(payload)
          with open(os.path.join(build_root, "RELEASE_MANIFEST.json.sig"), "w", encoding="utf-8") as handle:
              handle.write(json.dumps(signature))

          PYEOF

      - name: Upload bundle artefacts as workflow outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-artefacts-${{ matrix.arch }}
          path: |
            build/${{ env.TARBALL_NAME }}
            build/SHA256SUMS
            build/RELEASE_MANIFEST.json
            build/RELEASE_MANIFEST.json.sig
          if-no-files-found: error
          retention-days: 30
