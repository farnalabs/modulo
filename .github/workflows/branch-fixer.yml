name: "Fix: Modulo Branch Fixer"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to fix'
        required: true
        type: number
      branch:
        description: 'Head branch of the PR'
        required: true
        type: string
      feedback:
        description: 'Review feedback or failure description'
        required: true
        type: string
      force:
        description: 'Set true to bypass Branch Fixer coalescing (an intentional re-fire). Automated callers must NOT set this.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # pull-requests: read is required by the "Resolve PR head SHA" step below:
  # it reads the PR through the REST API to find the current head SHA.
  pull-requests: read

jobs:
  trigger-modulo-fixer:
    name: Trigger Modulo Branch Fixer
    runs-on: ubicloud-standard-2
    # Manual-delivery label protocol:
    # The `manual-delivery` label on a PR tells the ci.yml caller
    # (notify-pr-failure job) to skip dispatching this Branch Fixer. The label
    # guard lives in ci.yml because workflow_dispatch events carry no
    # github.event.pull_request context, so the check cannot be evaluated here.
    # Manual `workflow_dispatch` invocations MUST check the PR's labels
    # themselves before calling this workflow.
    steps:
      - name: Resolve PR head SHA
        id: head-sha
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          # Escape hatch: the coalesce gate keys on (prNumber, headSha) and
          # cannot tell a human's intentional re-fire from an automated
          # re-dispatch of the same commit. `force: true` therefore skips the
          # lookup entirely and writes an empty output, so the payload omits
          # headSha - and a payload with no headSha derives no coalesce key, so
          # the delivery always creates a run. Automated callers (the PR
          # Housekeeper) must NOT set it: they take the default `false` and get
          # normal coalescing.
          if [ "${FORCE}" = "true" ]; then
            echo "::notice::force=true - skipping head SHA resolution so this dispatch is never coalesced."
            echo "head_sha=" >> "${GITHUB_OUTPUT:-/dev/null}"
            exit 0
          fi

          # headSha: coalescing parity with ci.yml. The Branch Fixer's webhook
          # trigger folds repeated deliveries for the same (prNumber, headSha)
          # within its coalesce window into ONE run. ci.yml's notify-pr-failure
          # already sends headSha, but this dispatch path did not - so every
          # PR Housekeeper re-dispatch for an unchanged PR minted another full
          # fixer run. Resolving the PR's current head SHA lets a repeat on the
          # SAME commit coalesce, while a new commit changes the SHA and still
          # dispatches a fresh run.
          #
          # FAIL OPEN, by design: a dispatch must never be blocked here. If the
          # lookup fails the output stays empty, the webhook step omits the
          # headSha key entirely, and the payload behaves exactly as it did
          # before this step existed (an absent headSha derives no coalesce key,
          # so the delivery creates a run as before).
          #
          # The explicit /repos/farnalabs/modulo/... REST path keeps this step
          # independent of any git remote layout (the workflow gains a minimal
          # checkout below only so the dispatch step can call the shared
          # scripts/dispatch_with_retry.sh; `gh` here uses GH_TOKEN + the
          # explicit path, exactly as it did before that checkout existed).
          HEAD_SHA=""
          GH_RC=0
          HEAD_SHA=$(gh api "repos/farnalabs/modulo/pulls/${PR_NUMBER}" --jq '.head.sha' 2>/tmp/head_sha_stderr.txt) || GH_RC=$?
          if [ "$GH_RC" -ne 0 ] || [ -z "$HEAD_SHA" ]; then
            ERR=$(head -c 300 /tmp/head_sha_stderr.txt 2>/dev/null | tr '\n' ' ' || true)
            echo "::warning::Could not resolve the head SHA for PR #${PR_NUMBER} (rc=${GH_RC}) - dispatching without headSha, so this delivery will not coalesce.${ERR:+ gh api stderr: $ERR}"
            HEAD_SHA=""
          fi
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT:-/dev/null}"

      # The dispatch step calls scripts/dispatch_with_retry.sh, which lives
      # in the repo — a minimal checkout provides it. persist-credentials:
      # false and fetch-depth: 1 keep it cheap and credential-light.
      - name: Check out the dispatch script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Send webhook to Modulo Branch Fixer
        id: webhook
        env:
          DISPATCH_URL: ${{ secrets.MODULO_BRANCH_FIXER_WEBHOOK_URL }}
          DISPATCH_SECRET: ${{ secrets.MODULO_BRANCH_FIXER_HMAC_SECRET }}
          DISPATCH_LABEL: "Modulo Branch Fixer"
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH: ${{ inputs.branch }}
          FEEDBACK: ${{ inputs.feedback }}
          HEAD_SHA: ${{ steps.head-sha.outputs.head_sha }}
        run: |
          # headSha is added only when the lookup above resolved it. An empty
          # headSha key would derive no coalesce key anyway, but omitting it
          # keeps the "no headSha = no coalescing" contract explicit, and an
          # unchanged payload is what the fallback path has always sent.
          BODY=$(jq -n \
            --arg branchName "${BRANCH}" \
            --argjson prNumber "${PR_NUMBER}" \
            --arg headSha "${HEAD_SHA}" \
            --arg failureDescription "${FEEDBACK}" \
            --arg repo "farnalabs/modulo" \
            '{branchName: $branchName, prNumber: $prNumber, failureDescription: $failureDescription, repository: $repo}
             + (if $headSha == "" then {} else {headSha: $headSha} end)')
          # One shared retry policy (scripts/dispatch_with_retry.sh): the old
          # inline loop retried 429/5xx five times with backoff and then fell
          # through to `echo "Branch Fixer notified"` — a FAILED dispatch was
          # reported as success and the run exited 0, so a PR whose fixer
          # dispatch was refused had NO durable signal it was never handed to
          # the fixer. The script exits 1 on a failed dispatch (class-named
          # ::error:: annotation + run summary), so the job fails visibly.
          DISPATCH_BODY="${BODY}" bash scripts/dispatch_with_retry.sh
