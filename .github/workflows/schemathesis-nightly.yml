name: "Schemathesis API Fuzz (nightly)"

on:
  schedule:
    - cron: "0 3 * * *"    # 03:00 UTC daily
  workflow_dispatch:

jobs:
  schemathesis-fuzz:
    name: API fuzz testing (${{ matrix.group }})
    runs-on: ubicloud-standard-2
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Each group runs in its own job: every schemathesis example spins the
        # full app lifespan (migrations + seeding) via from_asgi, and running
        # all groups in one job exceeded the ephemeral runner's usable window
        # (~10 min infra kill, exit 143). Splitting per group keeps each job
        # short enough to complete.
        group: [pipelines, schemas, libraries, connectors, model-backends]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Start Postgres
        working-directory: backend
        shell: bash
        run: |
          docker run -d --name modulo-ci-pg \
            -e POSTGRES_USER=modulo_test \
            -e POSTGRES_PASSWORD=modulo_test \
            -e POSTGRES_DB=modulo_test \
            -p 5433:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec modulo-ci-pg pg_isready -U modulo_test 2>/dev/null && { echo "Postgres ready"; break; }
            sleep 2
          done
      - name: Start Redis
        working-directory: backend
        shell: bash
        run: |
          docker rm -f modulo-ci-redis 2>/dev/null || true
          docker run -d --name modulo-ci-redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            docker exec modulo-ci-redis redis-cli ping 2>/dev/null && { echo "Redis ready"; break; }
            sleep 2
          done
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Schemathesis API fuzz testing
        working-directory: backend
        shell: bash
        timeout-minutes: 60
        run: uv run --no-build --no-sync pytest tests/integration/test_schemathesis.py -x --timeout=600
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo_test:modulo_test@localhost:5433/modulo_test"
          REDIS_URL: "redis://localhost:6379/0"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          SCHEMA_GROUP: "${{ matrix.group }}"
      - name: Stop containers
        if: always()
        run: docker rm -f modulo-ci-pg modulo-ci-redis 2>/dev/null || true
