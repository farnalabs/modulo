name: "Merge: Queue"

# --- PR conventions consumed by this workflow ---
# 1. Linear tickets: include FAR-<number> in the PR title to auto-close on merge.
# 2. GitHub issues: include a closing keyword (Closes #N, Fixes #N, Resolves #N)
#    in the PR title OR body to auto-close on merge. Keywords are case-insensitive
#    and may be followed by a colon (e.g. "Closes: #123"). The [partial] marker
#    in the title suppresses auto-close; a comment is posted instead.
# 3. Partial sweeps: add [partial] to the PR title to comment instead of close.

on:
  schedule:
    # Off-boundary minutes dodge the scheduler sampling that drops round-boundary crons on high-activity repos (FAR-492).
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  # Trigger design (FAR-1428; supersedes the FAR-492 event-driven design):
  # the queue runs ONLY on schedule, workflow_dispatch and the
  # repository_dispatch self-chain below. GitHub's scheduler drops most
  # high-frequency cron events on this high-activity repo (FAR-492), so the
  # reliable cadence is the app's PR Housekeeper pipeline dispatching this
  # workflow (workflow_dispatch) every 15 min; the merge-queue-watchdog
  # workflow also re-arms it via repository_dispatch when the queue has been
  # idle >=15 min. FAR-492 had added pull_request_review and check_suite
  # triggers; they were removed in FAR-1428 because the event-gate filtering
  # ran on billed runners and produced ~7,000 runs/month (82% of all runs),
  # and the shared concurrency group displaced pending runs.
  repository_dispatch:
    # Self-chaining (stateless, FAR-492): a pass that found approved
    # PRs still waiting on CI dispatches 'merge-queue-chain' ~10 min ahead.
    # Deliberately repository_dispatch instead of `gh workflow run` because
    # GitHub has a caching bug where workflow_dispatch on a recently modified
    # workflow returns HTTP 422 "Workflow does not have 'workflow_dispatch'
    # trigger". GITHUB_TOKEN is exempt from the recursive-run block for
    # workflow_dispatch/repository_dispatch, and the queue job already holds
    # contents:write.
    types: [merge-queue-chain]

env:
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  FERNET_KEY: ${{ secrets.FERNET_KEY }}
  # THE single git-credential mechanism for this workflow (FAR-1940). It is an
  # env-driven `url.<base>.insteadOf` rewrite, so the token travels in the
  # remote URL and git sends ONE Authorization header. The default token is
  # GITHUB_TOKEN, which authenticates GitHub git fetches so `uv sync --frozen`
  # can resolve git-pinned dependencies (e.g. pytest-bdd @ refs/pull/827/head)
  # without an anonymous fetch-by-SHA, which GitHub rejects from CI runners.
  #
  # Do NOT add a second mechanism -- specifically not a persisted
  # `http.<url>.extraheader` Authorization header (which actions/checkout
  # writes when persist-credentials is left at its default, and which the push
  # steps used to set for themselves). Configuring the same PAT twice made git
  # send two Authorization headers on every push and GitHub's receive-pack
  # rejected it: `remote: Duplicate header: "Authorization"` (2026-10-13, run
  # 39026353546) -- neither branch push could complete. Push steps that need the
  # workflows-scoped PAT override GIT_CONFIG_KEY_0 for their own step only, and
  # only the token changes; the rewrite itself stays here.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf'
  GIT_CONFIG_VALUE_0: "https://github.com/"

permissions:
  contents: read

jobs:
  freeze-gate:
    name: Release freeze gate
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      frozen: ${{ steps.check.outputs.frozen }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for release-freeze tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Alpha release process: while the 'release-freeze' tag exists,
          # main is frozen and the merge queue must not merge anything.
          # Manual escape: delete the 'release-freeze' tag. Do NOT use Release ->
          # release as an escape - that promotes GA prematurely.
          # The retry/backoff/fail-closed policy lives in the shared helper
          # (.github/scripts/release-freeze-check.py) so it cannot diverge from
          # the pre-merge TOCTOU re-verify step below. A transient gh/API blip
          # (e.g. 503s or snapshot-lock contention during a pipeline burst)
          # cannot masquerade as a freeze; we still FAIL CLOSED, but only after
          # the call persists in failing across retries. A genuine release freeze
          # (tag present) is detected on the very first successful response.
          OUT=$(python3 .github/scripts/release-freeze-check.py) || true
          VERDICT="${OUT%%|*}"
          MSG="${OUT#*|}"
          case "$VERDICT" in
            frozen)
              echo "frozen=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Release freeze ACTIVE ('release-freeze' tag present) - merge queue paused." ;;
            open)
              echo "frozen=false" >> "$GITHUB_OUTPUT" ;;
            fail-closed)
              # Fail CLOSED: a *persistent* API error must never be read as "not
              # frozen", or a gh failure would silently lift the freeze mid-release.
              # Skipping this 15-min tick costs nothing; a wrongly-open gate costs the RC.
              echo "frozen=true" >> "$GITHUB_OUTPUT"
              echo "::error::$MSG - failing CLOSED, skipping this merge-queue tick." ;;
            *)
              # Helper produced no usable verdict (e.g. python3 missing) -> fail CLOSED.
              echo "frozen=true" >> "$GITHUB_OUTPUT"
              echo "::error::release-freeze helper produced no verdict ($OUT) - failing CLOSED, skipping this merge-queue tick." ;;
          esac

  event-gate:
    name: Event relevance gate (FAR-492)
    # Cheap context-only filter. schedule/workflow_dispatch always pass;
    # repository_dispatch (self-chain) honors the payload's not-before time so
    # chained passes pace ~10 min apart - the wait happens HERE on a tiny idle
    # runner, NOT inside the queue job, which would hold the merge-queue
    # concurrency slot and delay other runs. The merge-queue concurrency group
    # is scoped to the `queue` job precisely so this sleep cannot hold it.
    # (The pull_request_review and check_suite paths were removed in FAR-1428.)
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Decide whether this trigger should run the queue
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          CHAIN_DEPTH: ${{ github.event.client_payload.depth || 0 }}
          CHAIN_READY_AT: ${{ github.event.client_payload.ready_at || 0 }}
        shell: bash
        run: |
          set -euo pipefail
          # Numeric hardening: expressions above default missing payload fields
          # to 0, but reject anything non-numeric before bash arithmetic.
          case "$CHAIN_DEPTH" in ''|*[!0-9]*) CHAIN_DEPTH=0 ;; esac
          case "$CHAIN_READY_AT" in ''|*[!0-9]*) CHAIN_READY_AT=0 ;; esac
          SHOULD_RUN=false
          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              SHOULD_RUN=true ;;
            repository_dispatch)
              # Self-chaining pass (FAR-492). Depth-capped: after 12 chained
              # passes the loop re-anchors to the 15-min cron sweep instead of
              # chaining forever.
              if [ "$EVENT_ACTION" = "merge-queue-chain" ]; then
                if [ "$CHAIN_DEPTH" -ge 12 ]; then
                  echo "Self-chain depth cap reached - deferring to the cron sweep."
                else
                  NOW=$(date -u +%s)
                  WAIT=$((CHAIN_READY_AT - NOW))
                  if [ "$WAIT" -gt 660 ]; then
                    # Malformed/foreign payload safety cap (11 min).
                    WAIT=660
                  fi
                  if [ "$WAIT" -gt 0 ]; then
                    echo "Chained pass not due yet - waiting ${WAIT}s (paced self-chain)."
                    sleep "$WAIT"
                  fi
                  SHOULD_RUN=true
                fi
              fi ;;
          esac
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Event gate: event=$EVENT_NAME action=${EVENT_ACTION:-n/a} -> should_run=$SHOULD_RUN"

  queue:
    name: Merge queue -> main
    needs: [freeze-gate, event-gate]
    if: needs.freeze-gate.outputs.frozen == 'false' && needs.event-gate.outputs.should_run == 'true'
    # The merge-queue concurrency group lives on THIS job, not at workflow
    # level: only this job merges to main, so only it needs serialising. At
    # workflow level the group was held by the whole run - including the
    # event-gate ~10-min pacing sleep - so every chained pass queued behind an
    # incumbent's sleep and waited out the full ~10 min before its own turn.
    concurrency:
      group: merge-queue
      cancel-in-progress: false
    # 60 is the measured ceiling plus dispatch headroom. The last successful pass
    # took 37.0 min, of which the backend/frontend validation step alone was
    # 34.3 min; at the former 45-min timeout that left only ~8 min for the
    # collection/merge/post steps AND up to three Branch Fixer dispatches (two
    # of them BEFORE validation). Each dispatch can now use its whole retry
    # budget (see DISPATCH_BUDGET_SECONDS: 120 on those steps), so a
    # late-but-successful dispatch would have spent the 45-min margin - and a
    # cancelled job skips both the merge steps and the failure()-gated final
    # notification, i.e. the silent drop FAR-2066 exists to remove. Still
    # bounded: this job holds the merge-queue concurrency lock
    # (cancel-in-progress: false), so an unbounded hold would stall every
    # later queue pass. (History: 30 was the old failure ceiling at a 29.1-min
    # observed pass - backend 19.9 + frontend 7.2 sequential.)
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
      # The "Close GitHub issues referenced by merged PRs" step runs
      # `gh issue comment` / `gh issue close`, which need issues:write on
      # GITHUB_TOKEN; without it every call 403s and the step silently
      # fail-opens. Least privilege holds: this step only touches issues
      # in this repo.
      issues: write
    runs-on: ubicloud-standard-2
    steps:
      - name: Cancel stale stuck runs (self-healing — belt-and-braces)
        # BELT-AND-BRACES: the authoritative out-of-lock sweep is
        # merge-queue-watchdog.yml (a separate workflow with its own concurrency
        # group). This in-job sweep runs ONLY when the lock is free — i.e. when
        # it is not needed for the chicken-and-egg failure mode (a stuck run
        # holding the lock prevents THIS job from starting). It still catches
        # stale runs that accumulated between watchdog ticks.
        #
        # A run that is in_progress with a job that never got picked up by a
        # runner (startedAt: null) holds the merge-queue concurrency group lock
        # (cancel-in-progress: false), blocking every later queue run. This sweep
        # cancels such runs once they exceed ~10 minutes so THIS run can proceed.
        # Best-effort: every subcommand below is guarded (2>/dev/null || echo/true)
        # so the script always exits 0 and can never fail the queue run itself.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Sweeping for stale in-progress 'Merge: Queue' runs stuck with no started job..."
          NOW=$(date -u +%s)
          CUTOFF=$((NOW - 600))
          IN_PROGRESS=$(gh run list --workflow merge-queue.yml --status in_progress --limit 50 --json databaseId,createdAt 2>/dev/null || echo "[]")
          CANDIDATES=$(echo "$IN_PROGRESS" | jq -r --argjson me "${{ github.run_id }}" '.[] | select(.databaseId != $me) | select(.createdAt != null) | @base64' 2>/dev/null || true)
          for CAND in $CANDIDATES; do
            RUN_ID=$(echo "$CAND" | base64 -d | jq -r '.databaseId' 2>/dev/null || echo "0")
            CREATED=$(echo "$CAND" | base64 -d | jq -r '.createdAt' 2>/dev/null || echo "")
            CREATED_TS=$(date -u -d "$CREATED" +%s 2>/dev/null || echo "$NOW")
            echo "  Checking run #$RUN_ID (created $CREATED)..."
            if [ "$CREATED_TS" -ge "$CUTOFF" ]; then
              echo "    Run #$RUN_ID is younger than 10 min - leaving it."
              continue
            fi
            # Only cancel if at least one job is queued but never started
            UNSTARTED=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" --jq '[.jobs[] | select(.started_at == null)] | length' 2>/dev/null || echo "0")
            if [ "$UNSTARTED" -gt 0 ]; then
              echo "    Run #$RUN_ID has $UNSTARTED queued job(s) never started for >10 min - cancelling."
              gh run cancel "$RUN_ID" --repo ${{ github.repository }} 2>/dev/null && echo "    Cancelled run #$RUN_ID." || echo "    Cancel of #$RUN_ID failed (ignoring)."
            else
              echo "    Run #$RUN_ID has no unstarted jobs - leaving it."
            fi
          done
          echo "Stuck-run sweep complete."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          # FAR-1940: do not persist a token credential into .git/config. The
          # single credential mechanism here is the workflow-level
          # `url.<base>.insteadOf` rewrite (token in the remote URL); the
          # http.extraheader Authorization header checkout leaves behind when
          # this stays at its default was the SECOND mechanism, and the pair is
          # what made git send two Authorization headers and GitHub reject every
          # push ("remote: Duplicate header:"). This matches the repo-wide
          # convention (every other checkout in .github/workflows/ sets it).
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Configure git
        run: |
          git config user.name "modulo-merge-bot"
          git config user.email "bot@modulo.run"

      - name: Check main CI status
        id: check-ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Checking main branch CI status..."
          CI_RUN=$(gh run list --workflow ci.yml --branch main --limit 1 --json conclusion,databaseId 2>/dev/null || echo "[]")
          CI_CONCLUSION=$(echo "$CI_RUN" | jq -r '.[0].conclusion // "unknown"' 2>/dev/null || echo "unknown")
          echo "Latest main CI run conclusion: $CI_CONCLUSION"
          if [ "$CI_CONCLUSION" = "success" ]; then
            echo "Main CI is green - proceeding with merge queue."
            echo "main_ci_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Main CI is $CI_CONCLUSION - proceeding anyway."
            echo "main_ci_ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Clean up stale failed merge-queue branches
        if: steps.check-ci.outputs.main_ci_ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Cleaning up stale merge-queue branches (older than 7 days)..."
          CUTOFF=$(date -d '7 days ago' +%s)
          gh api repos/farnalabs/modulo/branches --paginate --jq '.[].name' | { grep -E '^merge-queue/(failed|active)-' || true; } | while IFS= read -r branch; do
            # Extract timestamp from branch name: merge-queue/<failed|active>-<timestamp>
            BRANCH_TS=$(echo "$branch" | sed -E 's/^merge-queue\/(failed|active)-//')
            if [ "$BRANCH_TS" -lt "$CUTOFF" ] 2>/dev/null; then
              echo "  Deleting stale branch: $branch"
              git push origin --delete "refs/heads/$branch" 2>/dev/null || true
            fi
          done
          echo "Cleanup complete."

      - name: Create merge-queue branch from main
        run: |
          git branch -D merge-queue 2>/dev/null || true
          git checkout -b merge-queue
          echo "merge-queue branch reset to main"

      - name: Collect open PRs (oldest first, approved only)
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Fetching open PRs sorted by age..."
          gh pr list --state open --json number,title,headRefName,baseRefName,createdAt --limit 50 2>&1 | \
            jq 'sort_by(.createdAt)' > /tmp/all_prs.json
          ALL_COUNT=$(jq 'length' /tmp/all_prs.json)
          echo "Found $ALL_COUNT open PR(s)"

          # Filter to only PRs approved by farnalabs or modulo-reviewbot
          APPROVED_COUNT=0
          echo "[]" > /tmp/prs.json
          rm -f /tmp/ci_pending_prs.txt

          jq -c '.[]' /tmp/all_prs.json | while IFS= read -r pr; do
            NUM=$(echo "$pr" | jq -r '.number')
            TITLE=$(echo "$pr" | jq -r '.title')

            echo -n "  PR #$NUM ($TITLE) -- "

            # Same-repo author gate (FAR-264): a fork / external-author PR must
            # NEVER be auto-merged by this queue. The decision is delegated to
            # the versioned, unit-tested helper
            # (.github/scripts/same-repo-author-guard.py) so merge and review
            # cannot diverge. Any failure to resolve the PR's head repository or
            # author association fails CLOSED (skipped), never merged; an
            # external PR needs a human/approved path instead.
            AUTHOR_FILE=$(mktemp)
            if gh api "repos/${{ github.repository }}/pulls/$NUM" > "$AUTHOR_FILE" 2>/dev/null; then
              AUTHOR_OUT=$(python3 .github/scripts/same-repo-author-guard.py "$AUTHOR_FILE" "${{ github.repository }}" 2>/dev/null) || true
            else
              AUTHOR_OUT=""
            fi
            rm -f "$AUTHOR_FILE"
            AUTHOR_VERDICT="${AUTHOR_OUT%%|*}"
            if [ "$AUTHOR_VERDICT" != "ok" ]; then
              echo "skipping - same-repo author gate: ${AUTHOR_OUT#*|}"
              continue
            fi

            # Base-branch gate: the queue merges into main, so only PRs that
            # target main are eligible. A stacked PR (base = another feature
            # branch) cannot be squash-merged into main correctly: its head
            # carries the whole unmerged base branch, which conflicts with the
            # changes main has taken since that base was cut (2026-10-20: PR
            # #2029, stacked on unmerged #2017, was collected as approved and
            # GREEN, then conflicted on classify.py / trigger-engine.md /
            # manifest.yaml, failing every queue pass and starving the whole
            # queue of merges). The stacked PR becomes eligible the moment its
            # base lands and it is retargeted (retarget-stacked-prs.py).
            BASE_REF=$(echo "$pr" | jq -r '.baseRefName')
            if [ "$BASE_REF" != "main" ]; then
              echo "skipping - base branch '$BASE_REF' is not main (stacked PR: its base must land and it must be retargeted first)"
              continue
            fi

            # Check for approval reviews
            APPROVERS=$(gh pr view "$NUM" --json reviews --jq '.reviews[]? | select(.state == "APPROVED") | .author.login' 2>/dev/null | sort -u)

            MERGEABLE=false
            if echo "$APPROVERS" | grep -qE '^(farnalabs|modulo-reviewbot)$'; then
              echo "approved by $APPROVERS"
              MERGEABLE=true
            fi

            # FAR-1099 fast-lane: PR is also mergeable if it has the
            # fast-lane:test-infra label AND the fast-lane check is green on
            # the PR's current head SHA AND CI is green. The label is applied
            # by live pipeline config on app.modulo.run (Branch Fixer), which
            # is delivered separately — until then this path is inert.
            if [ "$MERGEABLE" = "false" ]; then
              LABELS=$(gh pr view "$NUM" --json labels --jq '.labels[].name' 2>/dev/null || echo "")
              if echo "$LABELS" | grep -q '^fast-lane:test-infra$'; then
                # Check fast-lane CI check status on current head SHA
                HEAD_SHA=$(gh pr view "$NUM" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "")
                FL_CHECK=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs?per_page=100" \
                  --jq '[.check_runs[] | select(.name == "fast-lane-eligible") | .conclusion] | first // "none"' 2>/dev/null || echo "none")
                if [ "$FL_CHECK" = "success" ]; then
                  MERGEABLE=true
                  echo "fast-lane eligible (label + check green)"
                else
                  echo "fast-lane check not green ($FL_CHECK) -- skipping"
                fi
              fi
            fi

            if [ "$MERGEABLE" = "true" ]; then
              # Check CI status - only include PRs with passing CI
              #
              # INVARIANT (FAR-1843): this gate must reflect PRODUCT CI only.
              # "CI: Fast Validation" may contain nothing but product-
              # validation jobs whose failure genuinely invalidates the PR —
              # never a webhook dispatch, notifier, or external-service ping.
              # The PR-reviewer dispatch was moved OUT of ci.yml into
              # pr-review.yml (workflow_run-triggered) precisely so a review-
              # dispatch outage can never mark this run failed and block every
              # merge (2026-10-15: five hours, 28+ PRs, self-amplifying
              # sandbox-cap starvation). Do not re-couple any non-product job
              # into ci.yml; give it its own workflow. Guarded by
              # backend/tests/architecture/test_workflow_structure.py.
              CI_BRANCH=$(echo "$pr" | jq -r ".headRefName")
              CI_CONCLUSION=$(gh run list --branch "$CI_BRANCH" --workflow "CI: Fast Validation" --limit 1 --json conclusion --jq ".[0].conclusion" 2>/dev/null || echo "unknown")
              if [ "$CI_CONCLUSION" != "success" ]; then
                echo "  skipping - CI not passing (latest: $CI_CONCLUSION)"
                # FAR-492: a still-running/queued (or unknown) CI is a "waiting"
                # state the self-chain step keeps pace with. A FAILED CI is
                # deliberately NOT chained - the Branch Fixer loop owns that;
                # the next scheduled/dispatched pass picks the PR up once the
                # fixed CI is green, so chaining here would only burn light passes.
                case "$CI_CONCLUSION" in
                  ""|null|unknown|in_progress|queued|pending|requested|waiting)
                    echo "$NUM" >> /tmp/ci_pending_prs.txt ;;
                esac
              else
                echo "$pr" >> /tmp/approved_prs.json
                APPROVED_COUNT=$((APPROVED_COUNT + 1))
                # Workflow-touching PR detection (2026-10-01 defect): a PR that
                # modifies .github/workflows/* can only be merged by a
                # workflows-capable credential - GITHUB_TOKEN (the github-actions
                # App) has no `workflows` permission under `permissions:` at all.
                # Emit a distinct, searchable annotation for every queued PR that
                # carries one so a workflow PR can never be silently stuck again.
                WF_COUNT=$(gh api "repos/${{ github.repository }}/pulls/$NUM/files?per_page=100" \
                  --jq '[.[].filename | select(startswith(".github/workflows/"))] | length' 2>/dev/null || echo "")
                case "$WF_COUNT" in
                  0|"") ;;
                  *[!0-9]*) ;;
                  *) echo "::warning::PR #$NUM modifies .github/workflows/* — requires a workflow-scoped merge" ;;
                esac
              fi
            else
              echo "not approved yet -- skipping"
            fi
          done

          # FAR-492: count via temp file - the while loop above runs in a
          # pipeline subshell, so variable mutations there do not survive.
          CI_PENDING=0
          if [ -f /tmp/ci_pending_prs.txt ]; then
            CI_PENDING=$(sort -u /tmp/ci_pending_prs.txt | grep -c . || true)
          fi
          echo "Approved PRs still waiting on CI: $CI_PENDING"

          # Combine approved PRs into the prs.json file
          if [ -f /tmp/approved_prs.json ]; then
            jq -s '.' /tmp/approved_prs.json > /tmp/prs.json
          fi

          PR_COUNT=$(jq 'length' /tmp/prs.json)
          echo "Approved PRs ready for queue: $PR_COUNT"
          {
            echo "pr_count=$PR_COUNT"
            echo "all_count=$ALL_COUNT"
            echo "ci_pending_count=$CI_PENDING"
          } >> "$GITHUB_OUTPUT"

      - name: Exit early if no approved PRs
        if: steps.collect.outputs.pr_count == '0'
        run: |
          echo "No approved PRs to process."
          echo "Total open: ${{ steps.collect.outputs.all_count }}, approved: 0"
          echo "PRs need an APPROVED review from farnalabs or modulo-reviewbot."
          exit 0

      - name: Merge PRs into merge-queue (oldest first)
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Bound per-pass batch size so one pass's collection/merge/validation
          # cost cannot grow without bound as the backlog grows (a growing batch
          # is what tipped the ~29-min sequential baseline past the 30-min job
          # cap). Oldest-first order is preserved (prs.json is createdAt-sorted);
          # PRs beyond the cap simply wait for the next pass (~15 min cadence via
          # the Housekeeper dispatch / cron / self-chain). Per-PR merge semantics
          # are unchanged: every PR in the batch still runs the full combined
          # backend+frontend validation and the freeze/TOCTOU guards before
          # `gh pr merge`.
          BATCH_LIMIT=12
          TOTAL_APPROVED=$(jq 'length' /tmp/prs.json 2>/dev/null || echo 0)
          if [ "$TOTAL_APPROVED" -gt "$BATCH_LIMIT" ]; then
            echo "Approved PRs ready: $TOTAL_APPROVED - merging the oldest $BATCH_LIMIT this pass; $((TOTAL_APPROVED - BATCH_LIMIT)) wait for the next cycle."
            jq ".[0:$BATCH_LIMIT]" /tmp/prs.json > /tmp/prs_batch.json
          else
            cp /tmp/prs.json /tmp/prs_batch.json
          fi

          merged_prs=""
          conflict_prs=""
          noop_prs=""
          closeable_prs=""
          unproven_prs=""
          migration_skip_prs=""

          # Per-PR duplicate verdicts from classify_duplicate below, as
          # "<pr>\t<close|keep>\t<evidence>". Written before anything is closed so
          # the closure comment can state the evidence it acted on (FAR-2064).
          : > /tmp/duplicate_verdicts.txt

          # FAR-2098: the head SHA of each conflicted PR, as "<num> <sha>" per
          # line, so 'Notify fixer of conflicts' can tell "the same conflict,
          # already notified" from "a new conflict state" and stop re-dispatching
          # an unchanged head every ~15-min pass (PR #2144, 2026-10-21: 8 retry
          # attempts per pass against a fixer already at its 8-run cap).
          # Deliberately a PARALLEL file rather than a new format for
          # /tmp/conflict_prs.txt: three other consumers read that file as a
          # whitespace-separated PR-number list (the Alembic-heads rebuild, the
          # merge-conflict payload, the CI-failure payload), and its shape is
          # their contract. An entry is missing only when the SHA could not be
          # resolved, and the notify step then dispatches without dedupe.
          : > /tmp/conflict_pr_heads.txt

          # Refresh origin/main so the duplicate content check compares against
          # the current upstream tip rather than the checkout snapshot. A failed
          # refresh is not fatal: classify_duplicate falls back to the local main
          # branch and, if neither is resolvable, keeps the PR open.
          if ! git fetch origin main >/dev/null 2>&1; then
            echo "::warning::could not refresh origin/main before the duplicate content check - falling back to the local main branch"
          fi

          # --- FAR-2064: a no-op squash is not proof a PR is already on main ---
          # `git diff --cached --quiet` after `git merge --squash` only says
          # nothing was STAGED. That can mean the content is on main, but it can
          # equally mean an EARLIER PR in this same batch already contributed the
          # content (it is then in the queue branch, not yet on main), that the
          # branch was rebuilt, or that the merge produced nothing for some other
          # reason. Treating the no-op as "already on main" closed six live PRs
          # on 2026-10-21 (#2163/FAR-1866, #2157/FAR-1887, #2151/FAR-2012,
          # #2158/FAR-2049, #2150/FAR-2051, #2152/FAR-2053) - every one had
          # commits upstream did not - and the closures marked six Linear tickets
          # Done. The only true positive that day (#2164/FAR-2048) had an EMPTY
          # diff, where "nothing to merge" was correct.
          #
          # So: never close on the no-op alone. classify_duplicate below runs a
          # content check and prints "<close|keep>\t<evidence>"; only a POSITIVE
          # confirmation of "nothing upstream that main lacks" is closeable, and
          # anything unproven or unevaluable stays OPEN with an annotation (fail
          # open - an open PR costs a re-check next pass, a wrong close loses the
          # work and marks a ticket Done).
          #
          # The check reads the SAME `pr-<n>` ref the squash-merge above consumed,
          # so it can never reason about a different commit than the one that
          # produced the no-op. Exit statuses are captured explicitly because this
          # step runs under `bash -e` (`git diff --quiet` exits 1 for "differs").
          classify_duplicate() {
            local num="${1}"
            local ref="pr-${num}" base diff_rc plus cherry_out
            local -a paths=()
            if ! git rev-parse --verify --quiet "refs/heads/${ref}" >/dev/null; then
              printf 'keep\t%s\n' "the PR head ref ${ref} is not available locally, so its content could not be compared with main"
              return 0
            fi
            base=$(git rev-parse --verify --quiet origin/main || git rev-parse --verify --quiet main || true)
            if [ -z "${base}" ]; then
              printf 'keep\t%s\n' "neither origin/main nor main is available to compare the PR against"
              return 0
            fi
            if ! git merge-base "${base}" "${ref}" >/dev/null 2>&1; then
              printf 'keep\t%s\n' "the PR head shares no merge base with main, so its content could not be compared"
              return 0
            fi
            # (1) Empty diff at the merge base: the PR contributes nothing at all.
            # This is the leg the #2164 control legitimately closed on.
            diff_rc=0
            git diff --quiet "${base}...${ref}" || diff_rc=$?
            if [ "${diff_rc}" -eq 0 ]; then
              printf 'close\t%s\n' "the PR has an empty diff against main (nothing to merge)"
              return 0
            fi
            if [ "${diff_rc}" -ne 1 ]; then
              printf 'keep\t%s\n' "comparing the PR against main failed (git diff exited ${diff_rc})"
              return 0
            fi
            # (2) Every path the PR touches already matches main byte for byte.
            # This is the shape a squash merge leaves behind, where patch-ids
            # cannot match because the commits were combined into one.
            mapfile -t paths < <(git diff --name-only "${base}...${ref}" 2>/dev/null || true)
            if [ "${#paths[@]}" -gt 0 ]; then
              diff_rc=0
              git diff --quiet "${base}" "${ref}" -- "${paths[@]}" || diff_rc=$?
              if [ "${diff_rc}" -eq 0 ]; then
                printf 'close\t%s\n' "every path the PR changes is already identical on main"
                return 0
              fi
            fi
            # (3) Commits not in main by id, but each with a patch-equivalent
            # commit upstream. Any '+' means real content main does not have.
            if ! cherry_out=$(git cherry "${base}" "${ref}" 2>/dev/null); then
              printf 'keep\t%s\n' "git cherry could not be computed against main"
              return 0
            fi
            if [ -z "${cherry_out}" ]; then
              if git merge-base --is-ancestor "${ref}" "${base}" 2>/dev/null; then
                printf 'close\t%s\n' "the PR head is already an ancestor of main"
                return 0
              fi
              printf 'keep\t%s\n' "git cherry lists no commits ahead of main, which is ambiguous rather than proof"
              return 0
            fi
            plus=$(printf '%s\n' "${cherry_out}" | grep -c '^+' || true)
            if [ "${plus}" -eq 0 ]; then
              printf 'close\t%s\n' "every commit on the PR is already upstream by patch-id"
              return 0
            fi
            printf 'keep\t%s\n' "${plus} commit(s) on the PR are not upstream (git cherry marks them '+'), so the no-op does not prove the changes are on main"
            return 0
          }

          # Migration-number gate (pre-merge, per PR). A PR that adds a migration
          # file whose numeric prefix is already held by a DIFFERENT filename does
          # NOT conflict in git (the filenames differ) but produces two Alembic
          # heads on the combined branch, which fails `alembic upgrade head` at
          # startup. Excluding it here - BEFORE it is squash-merged into the
          # batch - is what stops one malformed PR poisoning every other PR in
          # the batch. 2026-10-20: PR #2029 added 0321_pipeline_queue_timeout
          # while main held 0321_organisation_cost_state; ten approved PRs were
          # squash-merged into the batch, the heads gate failed afterwards, and
          # the whole batch was abandoned (~4 hours, 10 PRs blocked by one).
          #
          # Semantics mirror the detector this replaces: only migration files a
          # PR adds (or renames onto) are checked; renames/deletions release
          # their old prefix; an already-accepted PR's claim stays authoritative
          # so a colliding second PR cannot steal the prefix. Accepted PRs extend
          # the map, so two PRs in the SAME batch that claim one prefix are also
          # caught (the second is excluded).
          MIG_DIR="backend/src/modulo/db/migrations/versions"
          declare -A prefix_holder
          while IFS= read -r fname; do
            [ -z "$fname" ] && continue
            base=$(basename "$fname")
            prefix="${base%%_*}"
            [ -n "$prefix" ] && prefix_holder["$prefix"]="$base"
          done < <(git ls-tree --name-only main -- "$MIG_DIR/" 2>/dev/null | grep '\.py$' || true)
          : > /tmp/migration_collision_prs.txt
          : > /tmp/migration_collision_details.txt

          while IFS= read -r pr; do
            NUM=$(echo "$pr" | jq -r '.number')
            TITLE=$(echo "$pr" | jq -r '.title')

            # Skip already-closed
            PR_STATE=$(gh pr view "$NUM" --json state,closed 2>/dev/null) || true
            if echo "$PR_STATE" | jq -e '.state == "CLOSED" or .closed == true' > /dev/null 2>&1; then
              continue
            fi

            # Re-verify review decision immediately before queueing (TOCTOU guard, PR #535 incident)
            REVIEW_DECISION=$(gh pr view "$NUM" --json reviewDecision --jq '.reviewDecision' 2>/dev/null || echo "unknown")
            if [ "$REVIEW_DECISION" != "APPROVED" ]; then
              echo "  skipping PR #$NUM - reviewDecision is '$REVIEW_DECISION' at queue time (must be APPROVED)"
              continue
            fi

            echo ""
            echo "=== PR #$NUM: $TITLE ==="

            # Ensure clean working tree
            git reset --hard HEAD 2>/dev/null || true
            git fetch origin "+refs/pull/$NUM/head:refs/heads/pr-$NUM" 2>&1

            # --- Migration-number gate: exclude, never poison the batch ---
            # Evaluated BEFORE the squash-merge so a colliding PR can never enter
            # the combined branch. The PR stays OPEN (untouched) for the next
            # cycle; the Branch Fixer is notified by the dedicated step below.
            #
            # This PR's own claims/releases are STAGED and applied only if the PR
            # is accepted. Applying them as we scan would leave a SKIPPED PR's
            # other migration prefixes in the accumulated map, causing later PRs
            # to be excluded for a prefix nothing in the batch actually holds.
            COLLIDES=false
            unset staged_claim staged_release 2>/dev/null || true
            declare -A staged_claim=()
            declare -A staged_release=()

            # effective_prefix_holder returns the filename currently holding the
            # prefix, treating this PR's staged releases/claims as already applied.
            effective_prefix_holder() {
              local p="$1"
              if [ -n "${staged_claim[$p]+x}" ]; then
                printf '%s' "${staged_claim[$p]}"
                return 0
              fi
              if [ -n "${prefix_holder[$p]+x}" ]; then
                if [ -n "${staged_release[$p]+x}" ] && [ "${staged_release[$p]}" = "${prefix_holder[$p]}" ]; then
                  return 0
                fi
                printf '%s' "${prefix_holder[$p]}"
              fi
              return 0
            }

            while IFS=$'\t' read -r status path extra; do
              [ -z "$path" ] && continue
              case "$status" in
                R*)
                  # Rename: the old path releases its prefix, the new path claims its own.
                  old_base=$(basename "$path")
                  old_prefix="${old_base%%_*}"
                  new_base=$(basename "$extra")
                  new_prefix="${new_base%%_*}"
                  if [ -n "$old_prefix" ]; then staged_release["$old_prefix"]="$old_base"; fi
                  if [ -n "$new_prefix" ]; then
                    HOLDER=$(effective_prefix_holder "$new_prefix")
                    if [ -n "$HOLDER" ] && [ "$HOLDER" != "$new_base" ]; then
                      COLLIDES=true
                      echo "    MIGRATION COLLISION: PR #$NUM adds $new_base, prefix $new_prefix already held by $HOLDER"
                      echo "PR #$NUM: adds $new_base, numeric prefix $new_prefix is already held by $HOLDER" >> /tmp/migration_collision_details.txt
                    else
                      staged_claim["$new_prefix"]="$new_base"
                    fi
                  fi
                  ;;
                D)
                  # Deletion: release the prefix if this PR removed the file holding it.
                  base=$(basename "$path")
                  prefix="${base%%_*}"
                  if [ -n "$prefix" ]; then staged_release["$prefix"]="$base"; fi
                  ;;
                *)
                  # Addition or modification of a migration file. Only genuinely
                  # NEW prefixes extend the accumulated set - the existing holder
                  # (main or an earlier-accepted PR) stays authoritative so a
                  # colliding PR cannot steal the prefix and cause false positives
                  # on later PRs that touch the original file.
                  base=$(basename "$path")
                  prefix="${base%%_*}"
                  [ -z "$prefix" ] && continue
                  HOLDER=$(effective_prefix_holder "$prefix")
                  if [ -n "$HOLDER" ] && [ "$HOLDER" != "$base" ]; then
                    COLLIDES=true
                    echo "    MIGRATION COLLISION: PR #$NUM adds $base, prefix $prefix already held by $HOLDER"
                    echo "PR #$NUM: adds $base, numeric prefix $prefix is already held by $HOLDER" >> /tmp/migration_collision_details.txt
                  else
                    staged_claim["$prefix"]="$base"
                  fi
                  ;;
              esac
            done < <(git diff --name-status "main...pr-${NUM}" -- "$MIG_DIR" 2>/dev/null || true)

            if [ "$COLLIDES" = "true" ]; then
              migration_skip_prs="$migration_skip_prs $NUM"
              echo "PR #$NUM EXCLUDED from this batch (migration-number collision - combining it would produce multiple Alembic heads). The rest of the batch is unaffected."
              continue
            fi

            # Accepted: commit this PR's staged releases/claims to the batch map.
            for prefix in "${!staged_release[@]}"; do
              if [ -n "${prefix_holder[$prefix]+x}" ] && [ "${prefix_holder[$prefix]}" = "${staged_release[$prefix]}" ]; then
                unset 'prefix_holder[$prefix]'
              fi
            done
            for prefix in "${!staged_claim[@]}"; do
              prefix_holder["$prefix"]="${staged_claim[$prefix]}"
            done

            echo "Attempting squash-merge into merge-queue..."
            if git merge --squash "pr-$NUM" 2>&1; then
              # A no-op squash merge (nothing staged) does NOT establish that the
              # PR's changes are on main - see the classify_duplicate comment
              # above. Either way nothing is committed: no commit means the
              # downstream 'git log main..merge-queue' would not name this PR, so
              # it is never counted as merged here. It is recorded as a duplicate
              # CANDIDATE, and only a positive content check makes it closeable.
              if git diff --cached --quiet; then
                VERDICT=$(classify_duplicate "$NUM")
                DUP_STATE=${VERDICT%%$'\t'*}
                DUP_EVIDENCE=${VERDICT#*$'\t'}
                printf '%s\t%s\t%s\n' "$NUM" "$DUP_STATE" "$DUP_EVIDENCE" >> /tmp/duplicate_verdicts.txt
                noop_prs="$noop_prs $NUM"
                echo "PR #$NUM has no changes to merge -- duplicate candidate: $DUP_STATE ($DUP_EVIDENCE)"
                if [ "$DUP_STATE" = "close" ]; then
                  closeable_prs="$closeable_prs $NUM"
                else
                  unproven_prs="$unproven_prs $NUM"
                  echo "::warning::PR #$NUM produced no changes to merge but is NOT proven to be on main ($DUP_EVIDENCE) - keeping it OPEN for the next pass."
                fi
              else
                git commit -m "squash! Merge PR #$NUM: $TITLE"
                echo "PR #$NUM merged successfully."
                merged_prs="$merged_prs $NUM"
              fi
            else
              git merge --abort 2>/dev/null || true
              git reset --hard HEAD 2>/dev/null || true
              echo "MERGE CONFLICT in PR #$NUM -- skipping."
              conflict_prs="$conflict_prs $NUM"
              # FAR-2098: record the exact head that conflicted. `pr-$NUM` is the
              # ref this iteration just fetched and tried to squash-merge, so it
              # IS the conflicted commit - no extra API call and no staleness
              # from reading the PR again later. A PR whose SHA cannot be
              # resolved simply gets no entry here, and the notify step then
              # dispatches without dedupe (fail open) rather than suppressing.
              CONFLICT_HEAD=$(git rev-parse --verify --quiet "refs/heads/pr-$NUM" 2>/dev/null || true)
              if [ -n "$CONFLICT_HEAD" ]; then
                printf '%s %s\n' "$NUM" "$CONFLICT_HEAD" >> /tmp/conflict_pr_heads.txt
              else
                echo "::warning::PR #$NUM: could not resolve the conflicted head SHA - the merge-conflict notification for this PR will not be deduped (fail open)."
              fi
            fi
          done < <(jq -c '.[]' /tmp/prs_batch.json)

          merged_prs=$(echo "$merged_prs" | xargs)
          conflict_prs=$(echo "$conflict_prs" | xargs)
          noop_prs=$(echo "$noop_prs" | xargs)
          closeable_prs=$(echo "$closeable_prs" | xargs)
          unproven_prs=$(echo "$unproven_prs" | xargs)
          migration_skip_prs=$(echo "$migration_skip_prs" | xargs)

          # Store PR numbers in files for later steps
          echo "$merged_prs" > /tmp/merged_prs.txt
          echo "$conflict_prs" > /tmp/conflict_prs.txt
          echo "$noop_prs" > /tmp/noop_prs.txt
          echo "$closeable_prs" > /tmp/closeable_prs.txt
          echo "$unproven_prs" > /tmp/unproven_prs.txt
          echo "$migration_skip_prs" > /tmp/migration_collision_prs.txt

          migration_skip_count=0
          if [ -n "$migration_skip_prs" ]; then
            migration_skip_count=$(echo "$migration_skip_prs" | wc -w)
          fi

          {
            echo "merged_prs=$merged_prs"
            echo "conflict_prs=$conflict_prs"
            echo "noop_prs=$noop_prs"
            echo "closeable_prs=$closeable_prs"
            echo "unproven_prs=$unproven_prs"
            echo "migration_collision_prs=$migration_skip_prs"
            echo "merged_count=$(echo "$merged_prs" | wc -w)"
            echo "conflict_count=$(echo "$conflict_prs" | wc -w)"
            echo "noop_count=$(echo "$noop_prs" | wc -w)"
            echo "closeable_count=$(echo "$closeable_prs" | wc -w)"
            echo "unproven_count=$(echo "$unproven_prs" | wc -w)"
            echo "migration_collision_count=$migration_skip_count"
          } >> "$GITHUB_OUTPUT"

          echo ""
          echo "=== Results ==="
          echo "Merged: $merged_prs"
          echo "No changes to merge: $noop_prs"
          echo "  confirmed already on main (closeable): $closeable_prs"
          echo "  NOT confirmed on main (kept open): $unproven_prs"
          echo "Conflicts: $conflict_prs"
          echo "Excluded (migration-number collision): $migration_skip_prs"
          if [ "$migration_skip_count" -gt 0 ]; then
            echo "::warning::Excluded $migration_skip_count PR(s) from this batch for migration-number collisions: $migration_skip_prs - the rest of the batch continues."
          fi
          if [ -n "$unproven_prs" ]; then
            echo "::warning::Kept $unproven_prs open: each produced no changes to merge, but its content was not proven to be on main. They are re-checked next pass."
          fi

      - name: Close duplicate PRs (changes confirmed already on main)
        if: steps.merge.outputs.closeable_count != '0' && steps.merge.outputs.closeable_count != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # FAR-2064: only PRs the merge step POSITIVELY confirmed have nothing
          # upstream that main lacks appear in /tmp/closeable_prs.txt. A no-op
          # squash merge on its own is not proof - trusting it closed six live PRs
          # on 2026-10-21 - so unproven PRs are never listed here; they stay open
          # and are annotated in the merge step instead.
          #
          # Audit trail: every bot closure must post its reason STATING THE
          # EVIDENCE, and the close is conditional on that comment landing -- a
          # silent close is indistinguishable from a buggy or malicious one (see
          # AGENTS.md Lessons Learned, PR #2092), and a reason without its
          # evidence cannot be checked by a reader.
          # The list holds bare PR numbers (whitespace-separated integers), so
          # iterating over words is intended; a line-oriented read would add a
          # missing-file failure path for no benefit.
          # shellcheck disable=SC2013
          for NUM in $(cat /tmp/closeable_prs.txt 2>/dev/null); do
            EVIDENCE=$(awk -F '\t' -v n="$NUM" '$1 == n { print $3 }' /tmp/duplicate_verdicts.txt 2>/dev/null)
            if [ -z "$EVIDENCE" ]; then
              # No recorded evidence is precisely the uncertainty this check
              # exists to refuse: post nothing, close nothing.
              echo "::error::PR #$NUM is listed as closeable but no verdict evidence was recorded for it - leaving it OPEN."
              continue
            fi
            echo "  Closing duplicate PR #$NUM (evidence: $EVIDENCE)..."
            CLOSE_REASON="Auto-closed by the merge queue as a duplicate. Evidence: $EVIDENCE. Squash-merging this PR into the queue branch produced no commit, and a content check against main positively confirmed the PR has nothing upstream that main lacks. If this was a mistake, reopen the PR and re-request a review."
            COMMENT_URL=$(gh pr comment "$NUM" --body "$CLOSE_REASON" 2>&1) || COMMENT_URL=""
            if [ -z "$COMMENT_URL" ]; then
              echo "::error::closure comment failed for PR #$NUM - leaving the PR OPEN rather than closing without an audit trail. Reason NOT posted: $CLOSE_REASON"
              continue
            fi
            echo "  Posted closure reason for PR #$NUM: $COMMENT_URL"
            if ! gh pr close "$NUM"; then
              echo "::error::failed to close PR #$NUM after posting the closure reason ($COMMENT_URL) - it stays open."
            fi
          done

      - name: Notify fixer of conflicts
        if: steps.merge.outputs.conflict_count != '0' && steps.merge.outputs.conflict_count != ''
        env:
          DISPATCH_URL: ${{ secrets.MODULO_BRANCH_FIXER_WEBHOOK_URL }}
          DISPATCH_SECRET: ${{ secrets.MODULO_BRANCH_FIXER_HMAC_SECRET }}
          DISPATCH_LABEL: "Modulo Branch Fixer"
          # 120s, not the 300s default: this job has a 60-min timeout with only
          # ~8 min measured headroom (37.0-min baseline, validation 34.3 min)
          # and TWO of its three dispatches run BEFORE the batch validation.
          DISPATCH_BUDGET_SECONDS: 120
          # Needed by the undelivered-notification fallback below (FAR-1939):
          # `gh pr comment` authenticates with the job's GITHUB_TOKEN, which
          # carries pull-requests:write (see the job's permissions block).
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -z "$DISPATCH_URL" ]; then echo "No webhook URL configured -- skipping notification"; exit 0; fi
          CONFLICTS=$(cat /tmp/conflict_prs.txt 2>/dev/null || echo "")

          # --- FAR-2098: never re-notify the fixer about an UNCHANGED head ---------
          # The queue re-dispatched the same conflicted PR on every ~15-min pass.
          # PR #2144 sat conflicted all day on 2026-10-21 and each pass burned 8
          # retry attempts against a fixer already at its 8-run cap (HTTP 429),
          # accumulated `merge-queue/failed-*` branches, and spent up to 120s of
          # this job's ~8 min headroom - on retries that could not change the
          # outcome, because re-notifying the same commit asks the fixer to
          # reconcile the same conflict again.
          #
          # So a dispatch is suppressed when the PR ITSELF records that this exact
          # head was already notified inside a cooldown. The record is a hidden
          # marker inside a comment this step posts on the PR - durable, visible
          # in the PR, and no cross-pass state file:
          #   <!-- merge-queue-fixer-notified head=<sha> at=<iso8601> -->
          # It is written on a successful dispatch AND inside the FAR-1939 durable
          # comment on a failed one, so the record always exists wherever a
          # notification attempt was made. A changed head ALWAYS dispatches.
          #
          # FAIL OPEN, ALWAYS. Every lookup or parse problem below - no recorded
          # head, a failed `gh api`, unparseable JSON, no comments, no marker, a
          # malformed marker, an unparseable timestamp - dispatches exactly as
          # before and emits a ::warning::. The dedupe must never be able to
          # suppress a needed notification; its worst failure is a redundant one.
          #
          # BOUNDED READ: at most MAX_COMMENT_PAGES pages of COMMENTS_PER_PAGE
          # comments, NEWEST FIRST (`sort=created&direction=desc`). The normal
          # path is ONE request, because this workflow writes the marker and it is
          # therefore the newest comment on a conflicted PR unless newer comments
          # arrived after it. If no marker is found inside that bound the pass
          # dispatches (fail open), so a long comment thread costs a redundant
          # notification, never a lost one.
          #
          # Residual risk (accepted, FAR-2098): anyone who can comment on the PR
          # can paste the marker. An exact head match only ever suppresses ONE
          # notification, and either a new commit (the fix, which changes the head)
          # or the cooldown expiry recovers it. A future-dated `at` is rejected
          # outright below rather than trusted, so a marker cannot suppress
          # indefinitely - and a stale marker whose head matches can never survive
          # a force-push, because a force-push changes the head SHA.
          REPO="${GITHUB_REPOSITORY:-}"
          COOLDOWN_SECONDS=86400
          MAX_COMMENT_PAGES=3
          COMMENTS_PER_PAGE=100
          MARKER_RE='<!--[[:space:]]*merge-queue-fixer-notified[[:space:]]+head=([0-9A-Fa-f]{7,64})[[:space:]]+at=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z)[[:space:]]*-->'

          # The head SHA the merge step recorded for this PR. Prints nothing when
          # there is no entry, which the caller treats as "unknown -> dispatch".
          conflict_head_sha() {
            local num="$1" path="/tmp/conflict_pr_heads.txt"
            [ -f "$path" ] || return 0
            awk -v want="$num" '($1 == want) { print $2; exit }' "$path" 2>/dev/null || return 0
            return 0
          }

          # 0 = this exact head was already notified inside the cooldown: skip the
          # dispatch. 1 = dispatch. EVERY error path returns 1 with a warning.
          fixer_notified_recently() {
            local num="$1" head="$2"
            local page=1 comments="" match_token="" body="" page_count=0
            local marker_head="" marker_at="" at_epoch="" now_epoch="" expiry=""
            now_epoch=$(date -u +%s 2>/dev/null) || now_epoch=""
            if [ -z "$now_epoch" ]; then
              echo "::warning::PR #$num: could not read the clock, so the ${COOLDOWN_SECONDS}s notification cooldown cannot be evaluated - dispatching the Branch Fixer notification (fail open)."
              return 1
            fi
            while [ "$page" -le "$MAX_COMMENT_PAGES" ]; do
              if ! comments=$(gh api "repos/${REPO}/issues/${num}/comments?per_page=${COMMENTS_PER_PAGE}&sort=created&direction=desc&page=${page}" 2>/dev/null); then
                echo "::warning::PR #$num: could not read the PR's comments (page ${page}) - dispatching the Branch Fixer notification without dedupe (fail open)."
                return 1
              fi
              # Newest first: only the most recent marker describes the current
              # notification state, so take the first match on the newest page.
              if ! match_token=$(printf '%s' "$comments" | jq -r 'if type == "array" then ([ .[] | (.body // "") | select(contains("merge-queue-fixer-notified")) ] | (.[0] // "") | @base64) else error("comments response is not an array") end' 2>/dev/null); then
                echo "::warning::PR #$num: the PR's comments response was not parseable JSON - dispatching the Branch Fixer notification without dedupe (fail open)."
                return 1
              fi
              if [ -n "$match_token" ]; then
                body=$(printf '%s' "$match_token" | base64 -d 2>/dev/null) || body=""
                if [[ "$body" =~ $MARKER_RE ]]; then
                  marker_head="${BASH_REMATCH[1]}"
                  marker_at="${BASH_REMATCH[2]}"
                  break
                fi
                echo "::warning::PR #$num: a fixer-notification marker on page ${page} is malformed (no exact head/at fields) - dispatching without dedupe (fail open)."
                return 1
              fi
              if ! page_count=$(printf '%s' "$comments" | jq -r 'if type == "array" then length else error("comments response is not an array") end' 2>/dev/null); then
                echo "::warning::PR #$num: could not read the PR's comment count (page ${page}) - dispatching the Branch Fixer notification without dedupe (fail open)."
                return 1
              fi
              # A page shorter than the page size is the last one.
              if [ "${page_count:-0}" -lt "$COMMENTS_PER_PAGE" ]; then
                break
              fi
              page=$((page + 1))
            done
            if [ -z "$marker_head" ]; then
              # Never notified for a head we can see (or the marker is older than
              # the read bound): dispatch.
              return 1
            fi
            if [ "$marker_head" != "$head" ]; then
              echo "PR #${num}: the head changed since the last fixer notification (${marker_head} -> ${head}) - notifying."
              return 1
            fi
            if ! at_epoch=$(date -u -d "$marker_at" +%s 2>/dev/null); then
              echo "::warning::PR #$num: the fixer-notification marker's timestamp (${marker_at}) could not be parsed - dispatching (fail open)."
              return 1
            fi
            if [ "$at_epoch" -gt "$now_epoch" ]; then
              echo "::warning::PR #$num: the fixer-notification marker's timestamp (${marker_at}) is in the future - ignoring the marker and dispatching (fail open)."
              return 1
            fi
            if [ $((now_epoch - at_epoch)) -lt "$COOLDOWN_SECONDS" ]; then
              expiry=$(date -u -d "@$((at_epoch + COOLDOWN_SECONDS))" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null) || expiry=""
              if [ -z "$expiry" ]; then
                expiry="epoch $((at_epoch + COOLDOWN_SECONDS))"
              fi
              echo "::notice::PR #${num}: the Branch Fixer was already notified about head ${head} at ${marker_at} - skipping the dispatch. The cooldown expires at ${expiry}; a changed head notifies immediately."
              return 0
            fi
            echo "PR #${num}: the last fixer notification for head ${head} was at ${marker_at}, outside the ${COOLDOWN_SECONDS}s cooldown - notifying again."
            return 1
          }

          NOTIFY_PRS=""
          DEDUPED_PRS=""
          for NUM in $CONFLICTS; do
            if [ -z "$NUM" ]; then continue; fi
            # /tmp/conflict_prs.txt is written by the merge step from jq'd PR
            # numbers. Anything else is unexpected input: skip it rather than
            # pass it into a `gh` command line.
            case "$NUM" in
              *[!0-9]*)
                echo "::warning::ignoring an unexpected entry in the conflict list ('${NUM}') - the merge step writes PR numbers."
                continue
                ;;
            esac
            if [ -z "$REPO" ]; then
              echo "::warning::GITHUB_REPOSITORY is empty, so the notification history cannot be read - dispatching without dedupe (fail open)."
              NOTIFY_PRS="$NOTIFY_PRS $NUM"
              continue
            fi
            PR_HEAD=$(conflict_head_sha "$NUM")
            if [ -z "$PR_HEAD" ]; then
              echo "::warning::PR #$NUM: no head SHA was recorded for this conflict, so \"already notified for this head\" cannot be established - dispatching without dedupe (fail open)."
              NOTIFY_PRS="$NOTIFY_PRS $NUM"
              continue
            fi
            if fixer_notified_recently "$NUM" "$PR_HEAD"; then
              DEDUPED_PRS="$DEDUPED_PRS $NUM"
              continue
            fi
            NOTIFY_PRS="$NOTIFY_PRS $NUM"
          done
          TARGETS=$(printf '%s\n' "$NOTIFY_PRS" | xargs 2>/dev/null || true)
          DEDUPED_PRS=$(printf '%s\n' "$DEDUPED_PRS" | xargs 2>/dev/null || true)
          if [ -n "$DEDUPED_PRS" ]; then
            echo "FAR-2098 dedupe: kept the Branch Fixer notification for${DEDUPED_PRS} (already notified for the current head inside the ${COOLDOWN_SECONDS}s cooldown)."
          fi
          if [ -z "$TARGETS" ] && [ -n "$DEDUPED_PRS" ]; then
            # Every conflicted PR already carries a notification record for its
            # current head. Dispatch nothing AND post no comment: the record is
            # already on each PR, and a second "the Branch Fixer was never
            # notified" comment would now be false (FAR-2092's signal must mean
            # what it says).
            echo "::notice::FAR-2098 dedupe: every conflicted PR was already notified for its current head - no Branch Fixer dispatch and no new PR comment this pass (deduped:${DEDUPED_PRS:- <none>})."
            exit 0
          fi
          if [ -z "$TARGETS" ]; then
            # Defensive: nothing could be deduped and no PR number survived (the
            # step's `if:` gate normally prevents an empty list). Keep the
            # pre-FAR-2098 behaviour of dispatching that (empty) list rather than
            # inventing a new path.
            TARGETS="$CONFLICTS"
          fi
          # taskKind marks this as a CONFLICT task so the Branch Fixer selects the
          # conflict task profile (ONE long attempt) rather than the CI-failure
          # retry ladder — the same structural marker pr-conflict-reconcile.yml
          # sends (FAR-1956). Without it the `phase` alone left the receiver to
          # guess the task kind; FAR-2033 measured 13 budget-hit runs here that
          # inherited the wrong profile. Extra payload keys flow through
          # harmlessly; an absent marker keeps the ladder, so older dispatches
          # keep working.
          # The payload names only the PRs this pass actually notifies (FAR-2098:
          # an unchanged head is not re-notified). The shape is unchanged; the
          # set is the dedupe's whole point.
          BODY=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg phase "merge-conflict" \
            --arg taskKind "conflict" \
            --arg conflictPrs "$TARGETS" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{repository: $repo, phase: $phase, taskKind: $taskKind, conflictPrs: $conflictPrs, runUrl: $run_url}')
          # One shared retry policy (scripts/dispatch_with_retry.sh): 429
          # (capacity) and 000/502/503/504 (transient) retry with exponential
          # backoff + jitter, bounded by an attempt cap AND a 300s wall-clock
          # budget and honouring Retry-After; every other status is terminal.
          # The 400 "Duplicate webhook payload" handled no-op (FAR-1097) and
          # the per-attempt timestamp+HMAC signing (the server enforces a
          # +/-300s replay window on X-Modulo-Timestamp) are the script's
          # defaults, mirroring the inline ladder this replaced. The script
          # exits 1 when the dispatch is never delivered, and it writes
          # machine-readable results (last HTTP / class / detail / attempt
          # count) to DISPATCH_RESULT_FILE so the durable comments below cite
          # the real values. The caller's own success flag is DISPATCH_OK, kept
          # distinct from the script's DISPATCH_DELIVERED in that file.
          DISPATCH_RESULT_FILE="/tmp/last_dispatch_result_conflicts.env"
          rm -f "${DISPATCH_RESULT_FILE}"
          DISPATCH_OK="false"
          # FAR-2098: stamped once, before the outcome is known, so BOTH arms can
          # record the attempt for the dedupe. An empty value (clock unavailable)
          # only means no marker is written and the PR is re-notified next pass.
          DISPATCH_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null) || DISPATCH_AT=""
          if DISPATCH_RESULT_FILE="${DISPATCH_RESULT_FILE}" \
             DISPATCH_BODY="${BODY}" bash scripts/dispatch_with_retry.sh; then
            DISPATCH_OK="true"
            echo "Fixer notified of conflicts in PRs: $TARGETS"
            # FAR-2098: the dispatch was DELIVERED, so record it on each PR with
            # the hidden marker the next pass parses. Best-effort BY DESIGN: the
            # notification has already succeeded, so a comment failure only costs
            # a redundant notification next pass (no marker -> fail open) - it
            # must never fail this pass, and it must never post anything claiming
            # a notification failed.
            for NUM in $TARGETS; do
              [ -z "$NUM" ] && continue
              PR_HEAD=$(conflict_head_sha "$NUM")
              if [ -z "$PR_HEAD" ] || [ -z "$DISPATCH_AT" ]; then
                echo "::warning::PR #$NUM: the Branch Fixer was notified, but the dedupe marker could not be written (head='${PR_HEAD}', at='${DISPATCH_AT}') - this PR will be re-notified next pass (fail open)."
                continue
              fi
              NOTIFIED_BODY="The merge queue asked the Branch Fixer to reconcile this PR's merge conflict with main (head ${PR_HEAD}). It will not ask again for this same head within 24 hours; a new commit always notifies immediately.

          <!-- merge-queue-fixer-notified head=${PR_HEAD} at=${DISPATCH_AT} -->"
              if gh pr comment "$NUM" --body "$NOTIFIED_BODY" > /dev/null 2>&1; then
                echo "::notice::PR #$NUM: recorded the fixer notification for head ${PR_HEAD}."
              else
                echo "::warning::PR #$NUM: could not post the fixer-notification marker comment - this PR will be re-notified next pass (fail open)."
              fi
            done
          fi
          if [ "$DISPATCH_OK" != "true" ]; then
            # shellcheck disable=SC1090
            source "${DISPATCH_RESULT_FILE}" 2>/dev/null || true
            LAST_HTTP="${DISPATCH_LAST_HTTP:-unknown}"
            DETAIL="${DISPATCH_LAST_DETAIL:-unknown}"
            # FAR-1939: an undelivered notification must never be SILENT, and it
            # must be attributable to the PR(s) it concerns. On 2026-10-13 (run
            # 39026353546) every attempt returned HTTP 429 ("Concurrent run
            # limit of 5 reached") and the only trace was this ::error:: inside
            # an already-failing run's log - PR #1925 stayed conflicted with
            # nothing on the PR, or anywhere durable, saying the Branch Fixer
            # had never been asked to reconcile it. So: name the PR(s) in the
            # annotation AND leave a durable comment on each of them. The retry
            # policy itself (cap, budget, backoff) is the SHARED one.
            #
            # 2026-10-21 (run 39633573993): this step then exited 1
            # UNCONDITIONALLY, and that DISCARDED a completed merge. The
            # 'Merge PRs into merge-queue' step had already succeeded (it wrote
            # `squash! Merge PR #2153` and logged 'PR #2153 merged successfully'),
            # then this step failed on `HTTP 429: Concurrent run limit of 8
            # reached` and every later step - combined validation, `gh pr merge`
            # to main, Linear/GitHub ticket closing, cleanup - was skipped. The
            # batch was thrown away because a NOTIFICATION could not be
            # delivered.
            #
            # So the hard failure is now narrower than "the webhook failed": it
            # is "the signal is actually LOST". Each attempt to record the
            # failure on a PR is counted. If every affected PR got its durable
            # comment, the FAR-1939 intent (never silent, attributable to the
            # PR) is satisfied, so this step warns loudly and exits 0 - the pass
            # continues to validation and merge. It exits 1 only when at least
            # one affected PR has NO signal at all (its comment failed), or when
            # no PR could be identified to attribute the failure to.
            DURABLE_COMMENT_PR_COUNT=0
            UNDELIVERED_PR_COUNT=0
            UNDELIVERED_PRS=""
            # FAR-2098: $TARGETS, not $CONFLICTS - a PR deduped above was never
            # dispatched this pass, so claiming its notification failed would be
            # false. The record for it is the marker already on the PR.
            for NUM in $TARGETS; do
              [ -z "$NUM" ] && continue
              UNDELIVERED_BODY="The merge queue could NOT deliver its merge-conflict notification to the Branch Fixer for this PR: every webhook attempt failed (last HTTP ${LAST_HTTP}: ${DETAIL}). Until the conflict is reconciled, this PR stays conflicted and the queue keeps skipping it. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              # FAR-2098: this durable comment also RECORDS the attempt for this
              # head, so the next pass can tell this conflict is already known
              # instead of dispatching it again every ~15 min. No marker (no
              # resolvable head, or no clock) means the next pass retries.
              PR_HEAD=$(conflict_head_sha "$NUM")
              if [ -n "$PR_HEAD" ] && [ -n "$DISPATCH_AT" ]; then
                # The marker line is indented to the block scalar's own
                # indentation so the YAML block continues (and the leading
                # whitespace it leaves in the comment body is harmless: the
                # parser anchors on the `<!--` token).
                UNDELIVERED_BODY="${UNDELIVERED_BODY}

          <!-- merge-queue-fixer-notified head=${PR_HEAD} at=${DISPATCH_AT} -->"
              else
                echo "::warning::PR #$NUM: the dedupe marker could not be written into the undelivered-notification comment (head='${PR_HEAD}', at='${DISPATCH_AT}') - this PR will be re-notified next pass (fail open)."
              fi
              if gh pr comment "$NUM" --body "$UNDELIVERED_BODY" > /dev/null 2>&1; then
                echo "::notice::PR #$NUM: posted a comment recording that the Branch Fixer was never notified."
                DURABLE_COMMENT_PR_COUNT=$((DURABLE_COMMENT_PR_COUNT + 1))
              else
                echo "::error::PR #$NUM: could not post the undelivered-notification comment either — this PR has NO durable signal that the Branch Fixer was never asked to reconcile it (webhook HTTP ${LAST_HTTP}: ${DETAIL})."
                UNDELIVERED_PR_COUNT=$((UNDELIVERED_PR_COUNT + 1))
                UNDELIVERED_PRS="$UNDELIVERED_PRS $NUM"
              fi
            done
            UNDELIVERED_PRS="${UNDELIVERED_PRS# }"
            if [ "$UNDELIVERED_PR_COUNT" -ne 0 ] || [ "$DURABLE_COMMENT_PR_COUNT" -eq 0 ]; then
              echo "::error::Branch Fixer webhook dispatch failed for PR(s) ${TARGETS:-<none>} (HTTP ${LAST_HTTP}: ${DETAIL}) and the durable failure comment could not be recorded on every affected PR (recorded on ${DURABLE_COMMENT_PR_COUNT}, failed on ${UNDELIVERED_PR_COUNT}: ${UNDELIVERED_PRS:-<none>}) — the merge-conflict notification now has NO durable signal. Failing hard."
              exit 1
            fi
            echo "::warning::Branch Fixer webhook dispatch failed for PR(s) ${TARGETS:-<none>} (HTTP ${LAST_HTTP}: ${DETAIL}) — merge-conflict notification was not delivered, BUT a durable comment recording the failure was posted on all ${DURABLE_COMMENT_PR_COUNT} affected PR(s). The signal is not silent, so this pass CONTINUES to validation and merge instead of discarding a completed batch."
            exit 0
          fi

      - name: Exit if nothing to merge
        if: steps.merge.outputs.merged_count == '0'
        run: |
          echo "No PRs could be merged into queue. Exiting."
          exit 0

      - name: Push merge-queue branch (for reference)
        if: steps.merge.outputs.merged_count != '0'
        env:
          # Workflow-scoped PAT, carried by the workflow's SINGLE git-credential
          # mechanism: the env-driven `url.<base>.insteadOf` rewrite below puts
          # the token in the push URL, and only the token differs from the
          # workflow-level default. The reference branch can contain merged
          # .github/workflows/* changes, which GITHUB_TOKEN (the github-actions
          # App) can NEVER push - GitHub has no `workflows` permission key for
          # the App token at all (2026-10-01: reference pushes were rejected
          # server-side with "refusing to allow a GitHub App to create or update
          # workflow ... without `workflows` permission").
          #
          # FAR-1940: this step used to ALSO persist an
          # http.https://github.com/.extraheader Authorization header with the
          # same PAT. Two mechanisms, two Authorization headers on the wire, and
          # GitHub answered `remote: Duplicate header: "Authorization"` - so the
          # push never happened. Keep exactly one mechanism.
          GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.MODULO_REVIEWBOT_TOKEN }}@github.com/.insteadOf'
        shell: bash
        run: |
          TIMESTAMP=$(date +%s)
          # Best-effort: the reference branch is a debug aid only - a rejection
          # must not abort the queue before the real gates (migration heads,
          # backend, frontend) run. It is still LOUD (FAR-1940): the ::error::
          # annotation makes a credential regression searchable in the run
          # summary instead of leaving the queue silently without a reference
          # branch.
          if git push origin "merge-queue:refs/heads/merge-queue/active-${TIMESTAMP}" 2>&1; then
            echo "branch_ref=merge-queue/active-$TIMESTAMP" >> "$GITHUB_ENV"
          else
            echo "::error::Reference push failed (workflows-scoped PAT rejected or network error - the git output above names the reason). Queue continues without a reference branch."
          fi

      - name: Initialize failure tracking
        if: steps.merge.outputs.merged_count != '0'
        shell: bash
        run: |
          echo "" > /tmp/failure_description.txt

      - name: Install backend deps
        if: steps.merge.outputs.merged_count != '0'
        working-directory: backend
        run: uv sync --frozen

      - name: Check migration heads (hard gate, isolates the offending PR)
        id: migration_heads
        if: steps.merge.outputs.merged_count != '0'
        shell: bash
        run: |
          # Migration heads must be exactly 1 on the combined branch. Parallel PRs
          # can each add a migration off the same base, creating multiple heads
          # that only appear when combined. A multi-head chain breaks app startup
          # (`alembic upgrade head` fails).
          #
          # ISOLATION (2026-10-20): a multi-head graph used to abandon the ENTIRE
          # batch - ten approved PRs merged into the validation branch, the heads
          # gate failed, and nothing reached main for ~4 hours, every tick. A
          # single malformed PR must never hold the rest of the batch hostage. So
          # when heads != 1, attribute each batch-introduced head to the PR that
          # introduced it, DROP those PR(s) from the batch, rebuild the branch and
          # re-validate; the remaining PRs still merge. Attribution is mechanical
          # (the head's migration file is not on main, so exactly one batch PR's
          # `main...pr-N` diff adds it), not heuristic. If a batch head cannot be
          # attributed, the step FAILS with the exact revisions/files named - the
          # dropped-attribution case is a real defect, never a silent batch loss.
          MIG_DIR="backend/src/modulo/db/migrations/versions"
          HEADS_FILE=/tmp/alembic_heads.txt
          : > /tmp/migration_heads_offenders.txt
          HEAD_COUNT=0

          compute_heads() {
            ( cd backend && uv run --no-build --no-sync python -m alembic heads 2>&1 ) | tee "$HEADS_FILE"
            HEAD_COUNT=$(grep -c "\(head\)\|\(effective head\)" "$HEADS_FILE" || true)
          }

          # Rebuild `merge-queue` from main by squash-merging every PR still in
          # /tmp/merged_prs.txt except the offenders. Any PR that now conflicts
          # (it already passed the collect/merge guards, so this is rare) is
          # dropped too and reported alongside the conflicts - never merged blind.
          rebuild_batch_without() {
            local offenders="$1"
            local new_merged=""
            local new_conflict=""
            local NUM
            local batch_words
            # /tmp/merged_prs.txt is a SINGLE whitespace-separated line (the merge
            # step's format, also consumed by the CI-failure webhook payload), so
            # split on whitespace rather than assuming one PR per line.
            batch_words=$(xargs < /tmp/merged_prs.txt 2>/dev/null || true)
            git checkout -B merge-queue main >/dev/null 2>&1
            for NUM in $batch_words; do
              [ -z "$NUM" ] && continue
              case " $offenders " in *" $NUM "*) continue ;; esac
              git fetch origin "+refs/pull/$NUM/head:refs/heads/pr-$NUM" >/dev/null 2>&1 || true
              if ! git rev-parse --verify -q "pr-$NUM" >/dev/null 2>&1; then
                echo "  PR #$NUM branch unavailable during rebuild - dropping it from this batch"
                continue
              fi
              if git merge --squash "pr-$NUM" >/dev/null 2>&1; then
                if git diff --cached --quiet; then
                  echo "  PR #$NUM has no changes relative to the rebuilt branch (already on main) - dropping as duplicate"
                else
                  git commit -q -m "squash! Merge PR #$NUM"
                  new_merged="$new_merged $NUM"
                fi
              else
                git merge --abort >/dev/null 2>&1 || true
                git reset --hard HEAD >/dev/null 2>&1 || true
                echo "  MERGE CONFLICT in PR #$NUM during rebuild - dropping it from this batch"
                new_conflict="$new_conflict $NUM"
              fi
            done
            printf '%s\n' "$(echo "$new_merged" | xargs)" > /tmp/merged_prs.txt
            if [ -n "$new_conflict" ]; then
              local prior_conflicts
              prior_conflicts=$(cat /tmp/conflict_prs.txt 2>/dev/null || true)
              # Never read and truncate the same file in one pipeline: write the
              # merged list aside, then swap it in.
              printf '%s %s\n' "$prior_conflicts" "$(echo "$new_conflict" | xargs)" | xargs | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs > /tmp/conflict_prs.new
              mv /tmp/conflict_prs.new /tmp/conflict_prs.txt
            fi
          }

          MAX_DROP_ROUNDS=3
          ROUND=0
          while :; do
            compute_heads
            echo "Alembic heads on the combined batch: $HEAD_COUNT"
            if [ "$HEAD_COUNT" -eq 1 ]; then
              break
            fi

            if [ "$ROUND" -ge "$MAX_DROP_ROUNDS" ]; then
              echo "::error::Could not resolve the Alembic multi-head graph after $MAX_DROP_ROUNDS drop-and-rebuild rounds. Heads: $(grep -E '\(head\)|\(effective head\)' "$HEADS_FILE" | paste -sd ', ' -). Excluded so far: $(xargs < /tmp/migration_heads_offenders.txt 2>/dev/null). Refusing to merge a multi-head batch."
              echo "Migration heads check failed (multi-head graph could not be attributed/resolved)" >> /tmp/failure_description.txt
              exit 1
            fi
            ROUND=$((ROUND + 1))

            echo "::warning::Batch has $HEAD_COUNT Alembic heads - attributing the offending PR(s) and dropping them so the rest of the batch can land (round $ROUND/$MAX_DROP_ROUNDS)."
            BATCH_WORDS=$(xargs < /tmp/merged_prs.txt 2>/dev/null || true)
            mapfile -t HEAD_REVS < <(grep -E '\(head\)|\(effective head\)' "$HEADS_FILE" | awk '{print $1}' | sort -u)
            OFFENDERS=""
            UNATTRIBUTED=""
            for REV in "${HEAD_REVS[@]}"; do
              [ -z "$REV" ] && continue
              HEAD_FILE="$MIG_DIR/${REV}.py"
              # A revision id normally equals the filename stem, but history holds
              # at least one exception (0152_add_indexes.py ->
              # 0152_dismissed_by_user_id_index), so fall back to locating the
              # file by its `revision` assignment. Attribution must never depend
              # on the stem convention.
              if ! git cat-file -e "merge-queue:${HEAD_FILE}" 2>/dev/null; then
                case "$REV" in
                  *[!A-Za-z0-9_.-]*) : ;;
                  *)
                    FOUND_FILE=$(grep -rl --include='*.py' -E "^revision(:[^=]*)? *= *\"${REV}\"" "$MIG_DIR" 2>/dev/null | head -1 || true)
                    if [ -n "$FOUND_FILE" ]; then HEAD_FILE="$FOUND_FILE"; fi
                    ;;
                esac
              fi
              if git cat-file -e "main:${HEAD_FILE}" 2>/dev/null; then
                echo "  head $REV (${HEAD_FILE}) is already on main - not attributable to a batch PR"
                continue
              fi
              # Exactly one batch PR adds this file (two PRs adding one path would
              # have conflicted at squash-merge time, not here). Scan the batch's
              # own PR diffs - the PR branches were fetched by the merge step.
              FOUND_PRS=""
              for CAND in $BATCH_WORDS; do
                [ -z "$CAND" ] && continue
                git rev-parse --verify -q "pr-$CAND" >/dev/null 2>&1 || continue
                if git diff --name-only "main...pr-${CAND}" -- "$HEAD_FILE" 2>/dev/null | grep -qx "$HEAD_FILE"; then
                  FOUND_PRS="$FOUND_PRS $CAND"
                fi
              done
              FOUND_PRS=$(echo "$FOUND_PRS" | xargs)
              if [ -z "$FOUND_PRS" ]; then
                echo "  head $REV (${HEAD_FILE}) is not on main and no batch PR adds it - cannot attribute"
                UNATTRIBUTED="$UNATTRIBUTED $REV(${HEAD_FILE})"
              else
                echo "  head $REV (${HEAD_FILE}) introduced by batch PR(s): $FOUND_PRS"
                for FOUND_PR in $FOUND_PRS; do
                  echo "PR #$FOUND_PR: adds ${HEAD_FILE} (revision '$REV'), which branches the migration graph into multiple Alembic heads on the combined batch." >> /tmp/migration_collision_details.txt
                done
                OFFENDERS="$OFFENDERS $FOUND_PRS"
              fi
            done
            OFFENDERS=$(echo "$OFFENDERS" | xargs | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)

            if [ -z "$OFFENDERS" ]; then
              echo "::error::Alembic reports $HEAD_COUNT heads but none is attributable to a batch PR (heads: $(grep -E '\(head\)|\(effective head\)' "$HEADS_FILE" | paste -sd ', ' -); unattributed: ${UNATTRIBUTED:-none on main}). Main's own migration graph is broken, or a PR rewrote an existing migration's down_revision; refusing to merge."
              echo "Migration heads check failed (multi-head graph not attributable to a batch PR)" >> /tmp/failure_description.txt
              exit 1
            fi

            # MINIMAL DROP: a fork has more than one head, and dropping ANY
            # branch at that fork resolves it - but dropping every attributed PR
            # would also delay a legitimate PR that merely extends the chain
            # (e.g. one chained onto the surviving head). So first try each
            # candidate ALONE and keep the single drop that yields one head; only
            # when no single drop fixes the graph is the whole set dropped.
            ORIGINAL_BATCH=$(xargs < /tmp/merged_prs.txt 2>/dev/null || true)
            OFFENDER_SET=""
            CANDIDATE_COUNT=$(echo "$OFFENDERS" | wc -w)
            if [ "$CANDIDATE_COUNT" -gt 1 ]; then
              for CANDIDATE in $OFFENDERS; do
                printf '%s\n' "$ORIGINAL_BATCH" > /tmp/merged_prs.txt
                echo "  trying a minimal drop of PR #$CANDIDATE alone..."
                rebuild_batch_without "$CANDIDATE"
                compute_heads
                if [ "$HEAD_COUNT" -eq 1 ]; then
                  OFFENDER_SET="$CANDIDATE"
                  echo "  minimal drop found: dropping PR #$CANDIDATE alone restores a single head"
                  break
                fi
              done
            fi
            if [ -z "$OFFENDER_SET" ]; then
              OFFENDER_SET="$OFFENDERS"
            fi

            echo "Dropping from the batch (migration-head offenders): $OFFENDER_SET"
            echo "$OFFENDER_SET" >> /tmp/migration_heads_offenders.txt
            for NUM in $OFFENDER_SET; do
              printf '%s\n' "$NUM" >> /tmp/migration_collision_prs.txt
            done

            # Restore the full batch, then rebuild without the chosen offender(s)
            # so the branch state matches /tmp/merged_prs.txt.
            printf '%s\n' "$ORIGINAL_BATCH" > /tmp/merged_prs.txt
            rebuild_batch_without "$OFFENDER_SET"
            echo "Batch rebuilt without the offender(s). Re-validating migration heads..."
          done

          OFFENDERS_FOUND=false
          if [ -s /tmp/migration_heads_offenders.txt ]; then
            OFFENDERS_FOUND=true
          fi
          REMAINING=$(xargs < /tmp/merged_prs.txt 2>/dev/null || true)
          REMAINING_COUNT=$(echo "$REMAINING" | wc -w)
          {
            echo "offenders_found=$OFFENDERS_FOUND"
            echo "offenders=$(xargs < /tmp/migration_heads_offenders.txt 2>/dev/null)"
            echo "remaining_prs=$REMAINING"
            echo "remaining_count=$REMAINING_COUNT"
          } >> "$GITHUB_OUTPUT"
          echo "Migration heads OK ($HEAD_COUNT head) for the remaining batch: '$REMAINING'"
          if [ "$OFFENDERS_FOUND" = "true" ]; then
            echo "::warning::Isolated the multi-head failure to PR(s) $(xargs < /tmp/migration_heads_offenders.txt); the remaining $REMAINING_COUNT PR(s) continue through validation and merge."
          fi

      - name: Notify fixer of migration collisions (PRs excluded from the batch)
        # Runs for BOTH exclusion sources: the pre-merge migration-number gate in
        # the merge step, and the heads check's drop-and-rebuild (which appends
        # what it dropped to the same list). `always()` matters - an excluded PR
        # must be reported even if the batch later fails validation.
        if: always() && (steps.merge.outputs.migration_collision_count != '0' || steps.migration_heads.outputs.offenders_found == 'true')
        env:
          DISPATCH_URL: ${{ secrets.MODULO_BRANCH_FIXER_WEBHOOK_URL }}
          DISPATCH_SECRET: ${{ secrets.MODULO_BRANCH_FIXER_HMAC_SECRET }}
          DISPATCH_LABEL: "Modulo Branch Fixer"
          # 120s, not the 300s default: this job has a 60-min timeout with only
          # ~8 min measured headroom (37.0-min baseline, validation 34.3 min)
          # and TWO of its three dispatches run BEFORE the batch validation.
          DISPATCH_BUDGET_SECONDS: 120
          # Needed by the durable comments below: `gh pr comment` authenticates
          # with the job's GITHUB_TOKEN, which carries pull-requests:write.
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          COLLISIONS=$(xargs < /tmp/migration_collision_prs.txt 2>/dev/null || true)
          if [ -z "$COLLISIONS" ]; then
            echo "No migration-collision PRs to notify about."
            exit 0
          fi

          # Durable, attributable record on every excluded PR, posted BEFORE (and
          # independently of) the webhook. The old detector exited early when the
          # webhook URL was unset, which with skip-instead-of-abort would leave a
          # PR silently excluded from every batch with no trace on the PR itself.
          # This comment is also the PR's FIRST durable signal, so a PR whose
          # exclusion comment fails is tracked in NO_SIGNAL_PRS and the
          # dispatch-failure gate below only clears it if that second comment
          # lands (a PR's signal is lost only when BOTH comments fail).
          NO_SIGNAL_PRS=""
          DETAILS=$(cat /tmp/migration_collision_details.txt 2>/dev/null || true)
          for NUM in $COLLISIONS; do
            [ -z "$NUM" ] && continue
            THIS_DETAIL=$(echo "$DETAILS" | grep -F "PR #$NUM:" || true)
            if [ -z "$THIS_DETAIL" ]; then
              THIS_DETAIL="PR #$NUM: the batch's combined migration graph did not resolve to a single Alembic head once this PR was included."
            fi
            COMMENT_BODY=$(printf '%s\n' \
              "The merge queue EXCLUDED this PR from the current merge batch: combining it with the rest of the batch breaks the Alembic migration graph (more than one head), which fails \`alembic upgrade head\` at app startup." \
              "" \
              "**Why this PR:**" \
              "" \
              "$THIS_DETAIL" \
              "" \
              "The rest of the approved batch was validated and merged without it. This PR stays OPEN and is skipped again on the next queue tick until the migration is renumbered - give it the next free numeric prefix and chain \`down_revision\` to the current main head (see \`scripts/run_check_migration_heads.py\`)." \
              "" \
              "Queue tick: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            if gh pr comment "$NUM" --body "$COMMENT_BODY" > /dev/null 2>&1; then
              echo "  PR #$NUM: posted the exclusion reason as a durable comment."
            else
              echo "::error::PR #$NUM: could not post the exclusion-reason comment - the PR is excluded from the batch with no durable trace."
              NO_SIGNAL_PRS="$NO_SIGNAL_PRS $NUM"
            fi
          done

          if [ -z "$DISPATCH_URL" ]; then
            echo "No webhook URL configured -- skipping Branch Fixer notification (the PR comment above is the durable record)."
            exit 0
          fi

          echo "Migration-collision PRs excluded from the batch: $COLLISIONS"
          # taskKind marks this as a CONFLICT task so the Branch Fixer selects the
          # conflict task profile (ONE long attempt) rather than the CI-failure
          # retry ladder — the same structural marker pr-conflict-reconcile.yml
          # sends (FAR-1956). A migration-number collision is conflict-class work:
          # renumber the migration and rebase/merge main, not a generic CI-failure
          # fix. Without this marker FAR-2033 measured 8 budget-hit runs on this
          # path inheriting the wrong profile. Extra payload keys flow through
          # harmlessly; an absent marker keeps the ladder.
          BODY=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg phase "migration-collision" \
            --arg taskKind "conflict" \
            --arg collisionPrs "$COLLISIONS" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{repository: $repo, phase: $phase, taskKind: $taskKind, collisionPrs: $collisionPrs, runUrl: $run_url}')
          # One shared retry policy (scripts/dispatch_with_retry.sh) - see the
          # merge-conflict notify step above for the contract. The script exits
          # 1 when the dispatch is never delivered and writes the real last
          # HTTP / class / detail / attempt count to DISPATCH_RESULT_FILE.
          DISPATCH_RESULT_FILE="/tmp/last_dispatch_result_migration.env"
          rm -f "${DISPATCH_RESULT_FILE}"
          DISPATCH_OK="false"
          if DISPATCH_RESULT_FILE="${DISPATCH_RESULT_FILE}" \
             DISPATCH_BODY="${BODY}" bash scripts/dispatch_with_retry.sh; then
            DISPATCH_OK="true"
            echo "Fixer notified of migration collisions in PRs: $COLLISIONS"
          fi
          if [ "$DISPATCH_OK" != "true" ]; then
            # shellcheck disable=SC1090
            source "${DISPATCH_RESULT_FILE}" 2>/dev/null || true
            LAST_HTTP="${DISPATCH_LAST_HTTP:-unknown}"
            DETAIL="${DISPATCH_LAST_DETAIL:-unknown}"
            # FAR-1939: an undelivered notification must never be SILENT, and it
            # must be attributable to the PR(s) it concerns (see the merge-
            # conflict notify step above for the incident). The excluded PR(s)
            # already got the durable exclusion comment above; record the failed
            # dispatch on each of them too.
            #
            # 2026-10-21 (see the merge-conflict step above): an unconditional
            # `exit 1` here would abort the pass for a NOTIFICATION failure and
            # discard a batch that had not yet been validated or merged. So the
            # step now fails only when a PR's signal is actually LOST - i.e. BOTH
            # its exclusion comment and this dispatch-failure comment failed.
            # NO_SIGNAL_PRS is seeded by the exclusion loop above; a successful
            # comment here clears that PR from it.
            UNDELIVERED_PR_COUNT=0
            for NUM in $COLLISIONS; do
              [ -z "$NUM" ] && continue
              UNDELIVERED_BODY="The merge queue could NOT deliver its migration-number-collision notification to the Branch Fixer for this PR: every webhook attempt failed (last HTTP ${LAST_HTTP}: ${DETAIL}). This PR has been EXCLUDED from the merge batch and its migration must be renumbered before it can land. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              if gh pr comment "$NUM" --body "$UNDELIVERED_BODY" > /dev/null 2>&1; then
                echo "::notice::PR #$NUM: posted a comment recording that the Branch Fixer was never notified."
                if [ -n "$NO_SIGNAL_PRS" ]; then
                  REMAINING_NO_SIGNAL=""
                  for P in $NO_SIGNAL_PRS; do
                    if [ "$P" != "$NUM" ]; then REMAINING_NO_SIGNAL="$REMAINING_NO_SIGNAL $P"; fi
                  done
                  NO_SIGNAL_PRS="$REMAINING_NO_SIGNAL"
                fi
              else
                echo "::error::PR #$NUM: could not post the undelivered-notification comment either — this PR has NO durable signal that the Branch Fixer was never asked to renumber its migration (webhook HTTP ${LAST_HTTP}: ${DETAIL})."
                UNDELIVERED_PR_COUNT=$((UNDELIVERED_PR_COUNT + 1))
                # No set mutation: a PR is in NO_SIGNAL_PRS only because its
                # exclusion comment already failed, and it stays there. A PR
                # whose exclusion comment landed keeps that durable signal, so a
                # failed dispatch-failure comment here does NOT make it silent.
              fi
            done
            NO_SIGNAL_PRS="${NO_SIGNAL_PRS# }"
            if [ -n "$NO_SIGNAL_PRS" ]; then
              echo "::error::Branch Fixer webhook dispatch failed for PR(s) ${COLLISIONS:-<none>} (HTTP ${LAST_HTTP}: ${DETAIL}) and PR(s) ${NO_SIGNAL_PRS} have NO durable signal at all (no exclusion comment and no dispatch-failure comment; ${UNDELIVERED_PR_COUNT} dispatch-failure comment(s) failed) — the migration-collision notification is SILENT for them. Failing hard."
              exit 1
            fi
            echo "::warning::Branch Fixer webhook dispatch failed for PR(s) ${COLLISIONS:-<none>} (HTTP ${LAST_HTTP}: ${DETAIL}) — migration-collision notification was not delivered, BUT every affected PR carries a durable comment recording it (the exclusion reason and/or the dispatch failure). The signal is not silent, so this pass CONTINUES instead of discarding the batch."
            exit 0
          fi

      # Backend lint+tests and the full frontend pipeline run CONCURRENTLY in
      # this one step (previously two sequential steps: backend ~20 min then
      # frontend ~7 min = ~27 min of validation). The frontend runs as a
      # background subshell while the backend lint tools run in the background
      # and pytest in the foreground, exactly as before; every gate is
      # preserved and still blocks the merge — this is a wall-clock change
      # only. Total validation wall-clock is now ~max(backend, frontend) ~ 20
      # min instead of their sum.
      #
      # Failure accounting is now precise: each side's failure appends its own
      # line to /tmp/failure_description.txt (the Branch Fixer notification
      # consumes it), replacing both the old backend-step appends and the
      # separate 'Capture frontend failures' step — which, being `if:
      # failure()`, used to append "Frontend checks failed" even when the
      # BACKEND step was the one that failed and frontend never ran.
      - name: Backend lint + tests and frontend checks (concurrent)
        # remaining_count is set by the heads check: if EVERY PR in the batch was
        # dropped as a migration-head offender the branch is just main, so the
        # ~20-minute combined validation has nothing new to prove and is skipped.
        if: steps.merge.outputs.merged_count != '0' && steps.migration_heads.outputs.remaining_count != '0'
        shell: bash
        run: |
          # --- Frontend checks: background subshell (was a separate sequential step) ---
          # `set -e` is inherited by the subshell (GH Actions default shell is
          # `bash -eo pipefail`), so the first failing pnpm command aborts the
          # subshell with that exit status, matching the old step's behaviour.
          (
            set -euo pipefail
            cd frontend
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm run lint --quiet
            pnpm run type-check
            pnpm run test:unit
            pnpm run build
          ) &
          FRONTEND_PID=$!

          # --- Backend lint tools: background (unchanged from the old step) ---
          cd backend
          uv run --no-build --no-sync ruff check . &
          RUFF_PID=$!
          uv run --no-build --no-sync mypy src/modulo/ &
          MYPY_PID=$!
          uv run --no-build --no-sync bandit -r src/modulo/ -ll &
          BANDIT_PID=$!
          uv run --no-build --no-sync ruff format --check . &
          RUFF_FORMAT_PID=$!

          # --- Backend tests: foreground (unchanged command) ---
          # `set +e` around the pytest invocation so its exit code is CAPTURED
          # rather than aborting the step under -e before the failure
          # description is written (the old script's `TEST_EXIT=$?` line was
          # unreachable on a pytest failure for that reason).
          set +e
          uv run --no-build --no-sync pytest tests/unit/ -x -q --timeout=120 --dist worksteal -W "error::pytest.PytestUnraisableExceptionWarning" --disable-warnings
          TEST_EXIT=$?
          set -e

          # Collect lint results
          LINT_FAIL=0
          wait $RUFF_PID || LINT_FAIL=1
          wait $MYPY_PID || LINT_FAIL=1
          wait $BANDIT_PID || LINT_FAIL=1
          wait $RUFF_FORMAT_PID || LINT_FAIL=1

          # Collect frontend result
          FRONTEND_EXIT=0
          wait $FRONTEND_PID || FRONTEND_EXIT=1

          # Report failures (each gate appends its own description line)
          FAIL=0
          if [ $LINT_FAIL -ne 0 ]; then
            echo "Backend lint failed" >> /tmp/failure_description.txt
            FAIL=1
          fi
          if [ $TEST_EXIT -ne 0 ]; then
            echo "Backend unit tests failed" >> /tmp/failure_description.txt
            FAIL=1
          fi
          if [ $FRONTEND_EXIT -ne 0 ]; then
            echo "Frontend checks failed" >> /tmp/failure_description.txt
            FAIL=1
          fi
          if [ $FAIL -ne 0 ]; then
            exit 1
          fi

      # Skips the merge (job stays GREEN) instead of failing: a failure here
      # would trip this job's failure() plumbing - false "frontend failed"
      # notes and a phantom ci-failure dispatch to the Branch Fixer during
      # the exact window the freeze protects. The ::error:: annotations
      # surface the abort in the run summary for the human overseer.
      - name: Re-verify freeze before merging (TOCTOU guard)
        id: toctou
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # A queue tick can pass freeze-gate minutes before the RC is cut;
          # re-check here so a just-started freeze stops this tick from merging.
          # Same shared helper + fail-closed policy as freeze-gate, so the two
          # safety-critical checks cannot diverge (a single gh blip mid-tick
          # must not abort the merge, but a persistent outage must).
          OUT=$(python3 .github/scripts/release-freeze-check.py) || true
          VERDICT="${OUT%%|*}"
          MSG="${OUT#*|}"
          case "$VERDICT" in
            frozen)
              echo "::error::Release freeze became ACTIVE after this tick passed the gate - aborting merge."
              echo "aborted=true" >> "$GITHUB_OUTPUT" ;;
            open)
              echo "Freeze re-check clean - proceeding to merge." ;;
            fail-closed)
              # Fail CLOSED: a *persistent* API error here must abort the merge,
              # never proceed - a gh failure must not silently open the gate.
              echo "::error::$MSG - aborting this merge tick (fail CLOSED)."
              echo "aborted=true" >> "$GITHUB_OUTPUT" ;;
            *)
              # Helper produced no usable verdict (e.g. python3 missing) -> fail CLOSED.
              echo "::error::release-freeze helper produced no verdict ($OUT) - aborting this merge tick (fail CLOSED)."
              echo "aborted=true" >> "$GITHUB_OUTPUT" ;;
          esac

      # If CI passed -- merge source PRs
      - name: Merge source PRs via gh pr merge
        id: ghmerge
        # remaining_count excludes PRs the heads check dropped from the batch.
        if: success() && steps.merge.outputs.merged_count != '0' && steps.migration_heads.outputs.remaining_count != '0' && steps.toctou.outputs.aborted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Workflows-capable credential, used ONLY for PRs that touch
          # .github/workflows/* (selected per-PR in the loop below).
          # MODULO_REVIEWBOT_TOKEN is a classic PAT (vault: github-reviewbot-pat,
          # login modulo-reviewbot) whose X-OAuth-Scopes include `workflow` and
          # whose repo permissions include push:true on farnalabs/modulo (both
          # probed live 2026-10-01). GITHUB_TOKEN - the github-actions App
          # installation token - has no `workflows` permission key at all and
          # never can, so GitHub refuses it server-side on any PR that modifies
          # a workflow file (2026-10-01: merge-queue run 36798142570, PR #1127
          # stuck approved + green for ~21h behind a silently-successful run).
          WORKFLOW_PAT: ${{ secrets.MODULO_REVIEWBOT_TOKEN }}
          # FAR-530: the merge step's own output is the authoritative record of
          # which PRs squash-merged into the queue branch (oldest first). It does
          # not depend on ref ordering the way a git-log range scrape does.
          # Kept as a FALLBACK only: /tmp/merged_prs.txt is authoritative because
          # the migration-heads drop-and-rebuild step rewrites it, and a dropped
          # PR must never be gh-merged from a stale step output.
          MERGE_STEP_PRS: ${{ steps.merge.outputs.merged_prs }}
        shell: bash
        run: |
          # FAR-530: primary source is /tmp/merged_prs.txt (the merge step writes
          # it, the heads step rewrites it after dropping offenders); the merge
          # step's output and the git-log range stay as defensive fallbacks.
          PR_NUMS=$(xargs < /tmp/merged_prs.txt 2>/dev/null || true)
          [ -z "$PR_NUMS" ] && PR_NUMS="$MERGE_STEP_PRS"
          [ -z "$PR_NUMS" ] && PR_NUMS=$(git log main..merge-queue --oneline | grep -oP 'PR #\K\d+' | tac || true)
          echo "Merging source PRs (in oldest-first order):"
          echo "$PR_NUMS"

          # FAR-530: record which PRs ACTUALLY merge to main via gh (the close
          # step consumes this; guard-skipped PRs must never have tickets closed).
          GH_MERGED=""
          FAILED=""
          for NUM in $PR_NUMS; do
            echo "  Merging PR #$NUM..."

            # Re-verify review decision immediately before merge (TOCTOU guard, PR #535 incident)
            REVIEW_DECISION=$(gh pr view "$NUM" --json reviewDecision --jq '.reviewDecision' 2>/dev/null || echo "unknown")
            if [ "$REVIEW_DECISION" != "APPROVED" ]; then
              echo "  PR #$NUM reviewDecision is '$REVIEW_DECISION' -- skipping merge (stays open for next queue cycle)"
              continue
            fi

            # Same-repo author gate re-verify (FAR-264, defense in depth): the
            # collect step already gated this, but the PR's head repository /
            # author state can change between collection and merge, so re-check
            # immediately before merging - fail closed, like the reviewDecision
            # re-verify above. An external verdict skips WITHOUT joining FAILED
            # (the PR was never meant to auto-merge; a human path owns it).
            AUTHOR_FILE=$(mktemp)
            if gh api "repos/${{ github.repository }}/pulls/$NUM" > "$AUTHOR_FILE" 2>/dev/null; then
              AUTHOR_OUT=$(python3 .github/scripts/same-repo-author-guard.py "$AUTHOR_FILE" "${{ github.repository }}" 2>/dev/null) || true
            else
              AUTHOR_OUT=""
            fi
            rm -f "$AUTHOR_FILE"
            if [ "${AUTHOR_OUT%%|*}" != "ok" ]; then
              echo "  PR #$NUM same-repo author gate: ${AUTHOR_OUT#*|} -- skipping merge (fail closed)"
              continue
            fi

            # SHA-pin guard (FAR-455): the approving review must cover the CURRENT PR
            # head. A review approved against an OLDER head must never grant merge for
            # newer unreviewed code — otherwise a force-push/merge after the approval
            # silently auto-merges unreviewed code (a TOCTOU on the approval itself).
            #
            # We use a TIMESTAMP-based staleness check rather than strict commit_id
            # equality, for two reasons (see PR #2089 review):
            #   (1) GitHub's reviews API can report a review's commit_id as the
            #       head-at-read-time rather than head-at-review-time (observed on
            #       #1386), so an equality check can falsely pass the very TOCTOU it
            #       exists to block.
            #   (2) Strict equality wrongly voids the approval on MERGE-ONLY head moves
            #       (merging origin/main in), which the repo's review policy does NOT
            #       treat as invalidating approval.
            # We therefore block when ANY NON-MERGE commit (single parent) in the PR was
            # committed AFTER the approval's submitted_at — i.e. real code landed after
            # the approval. We walk the FULL commit list (not just HEAD): a post-approval
            # fix commit hidden behind a later merge (HEAD becomes a 2-parent merge) must
            # still be flagged. Merge-only pushes (every commit >=2 parents) keep the
            # approval valid, and any API failure fails CLOSED (skip, never merge).
             HEAD_OID=$(gh pr view "$NUM" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "")
             if [ -z "$HEAD_OID" ]; then
               echo "  PR #$NUM could not resolve head oid -- skipping merge (fail closed)"
               continue
             fi
             # SHA-pin TOCTOU guard. The decision is delegated to a versioned, unit-tested
             # Python script (.github/scripts/merge-queue-approve-guard.py) instead of inline
             # bash because (a) the reviews/commits lists are paginated via `gh api --paginate`
             # and arrive as MULTIPLE concatenated JSON documents -- naive `jq` only sees the
             # first page, which previously made STALE_COUNT multi-line and the guard FAIL OPEN
             # on the >100-item large-PR path -- and (b) the timestamp walk is non-trivial and
             # needs coverage (backend/tests/unit/scripts/test_merge_queue_approve_guard.py).
             # The script merges ALL pages first, then blocks when ANY non-merge (single-parent)
             # commit was committed AFTER the latest APPROVED review's submitted_at. Merge-only
             # head moves keep the approval valid; any error fails CLOSED (stale -> skip), never
             # fails open.
             REVIEWS_FILE=$(mktemp)
             COMMITS_FILE=$(mktemp)
             gh api --paginate "repos/${{ github.repository }}/pulls/$NUM/reviews?per_page=100" > "$REVIEWS_FILE" 2>/dev/null || true
             gh api --paginate "repos/${{ github.repository }}/pulls/$NUM/commits?per_page=100" > "$COMMITS_FILE" 2>/dev/null || true
             GUARD_OUT=$(python3 .github/scripts/merge-queue-approve-guard.py "$REVIEWS_FILE" "$COMMITS_FILE" "$HEAD_OID" 2>/dev/null) || true
             rm -f "$REVIEWS_FILE" "$COMMITS_FILE"
             if [ -z "$GUARD_OUT" ]; then
               GUARD_OUT="stale|guard script produced no output - fail closed"
             fi
             GUARD_VERDICT="${GUARD_OUT%%|*}"
             if [ "$GUARD_VERDICT" != "ok" ]; then
               echo "  PR #$NUM SHA-pin guard: ${GUARD_OUT#*|} -- skipping merge (fail closed)"
               continue
             fi
             # No post-approval non-merge code (merge-only head moves keep approval valid).
             echo "  PR #$NUM ${GUARD_OUT#*|}"

            # Workflow-scoped merge credential, selected per-PR (Wall A / Wall B,
            # 2026-10-01). A PR that touches .github/workflows/* merges with the
            # workflows-capable PAT; every other PR keeps `github.token` so its
            # merge behaviour stays byte-identical - including the deliberate
            # push-event suppression that the manual 'Trigger main CI and deploy
            # after merge' step below is built around (GITHUB_TOKEN-authored
            # merges fire no push:main workflows; PAT merges do, which would
            # double-run ci.yml/deploy.yml AND newly fire bdd.yml,
            # main-integration.yml, fast-lane-post-merge.yml and
            # publish-images.yml on every ordinary merge).
            MERGE_TOKEN="$GH_TOKEN"
            WF_COUNT=$(gh api "repos/${{ github.repository }}/pulls/$NUM/files?per_page=100" \
              --jq '[.[].filename | select(startswith(".github/workflows/"))] | length' 2>/dev/null || echo "")
            case "$WF_COUNT" in
              0|"") ;;
              *[!0-9]*)
                echo "  PR #$NUM: could not determine workflow-file status (got '$WF_COUNT') - merging with github.token" ;;
              *)
                if [ -z "$WORKFLOW_PAT" ]; then
                  echo "::error::PR #$NUM modifies .github/workflows/* but secrets.MODULO_REVIEWBOT_TOKEN is empty - GITHUB_TOKEN cannot merge it (the GitHub App has no workflows permission)."
                  FAILED="$FAILED $NUM"
                  continue
                fi
                MERGE_TOKEN="$WORKFLOW_PAT"
                echo "  PR #$NUM modifies .github/workflows/* - merging with the workflow-scoped PAT" ;;
            esac
            if GH_TOKEN="$MERGE_TOKEN" gh pr merge --squash "$NUM" 2>&1; then
              echo "    PR #$NUM merged --"
              GH_MERGED="$GH_MERGED $NUM"
              # Delete the PR's source branch right after a successful merge
              # (best-effort: a delete failure must never fail the queue). Use the
              # GitHub API to delete the remote ref -- gh pr merge --delete-branch
              # would also try to delete the LOCAL branch, which is unreliable from
              # a checkout on merge-queue. Never delete main, and never delete a
              # branch for a fork PR: headRefName names the fork's branch, and
              # deleting it on THIS repo could remove an unrelated branch here that
              # happens to share the same name.
              HEAD_REF=$(gh pr view "$NUM" --json headRefName --jq '.headRefName' 2>/dev/null || echo "")
              HEAD_REPO=$(gh pr view "$NUM" --json headRepositoryOwner --jq '.headRepositoryOwner.login' 2>/dev/null || echo "")
              if [ -n "$HEAD_REF" ] && [ "$HEAD_REF" != "main" ] && [ "$HEAD_REPO" = "${{ github.repository_owner }}" ]; then
                # FAR-917: before deleting, check if any open PR uses this branch as
                # its base. GitHub auto-closes a PR when its base branch is deleted,
                # so a stacked/child PR would silently vanish (PR #597 -> #602 incident).
                # FAIL SAFE on the query: a failed `gh pr list` must NOT be read as
                # "zero children" -- the previous `|| echo "0"` did exactly that and
                # deleted the branch, silently closing the child PR. Only a clean
                # numeric 0 permits deletion; empty/non-numeric protects the branch.
                CHILD_PRS=$(gh pr list --state open --json number,baseRefName \
                  --jq "[.[] | select(.baseRefName == \"$HEAD_REF\")] | length" 2>/dev/null) || CHILD_PRS=""
                case "$CHILD_PRS" in
                  '' )
                    echo "::warning::FAR-917: could not determine open child PRs for $HEAD_REF - keeping branch (fail safe)"
                    ;;
                  0 )
                    gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$HEAD_REF" 2>/dev/null && echo "    Deleted source branch $HEAD_REF for PR #$NUM" || echo "    Could not delete branch $HEAD_REF (may already be gone)"
                    ;;
                  * )
                    echo "    FAR-917: branch $HEAD_REF is base of $CHILD_PRS open PR(s) -- skipping deletion (see stacked-pr-guard step)"
                    ;;
                esac
              fi
            else
              echo "    PR #$NUM failed to merge via gh -- leaving OPEN for the next queue cycle (see below)"
              FAILED="$FAILED $NUM"
            fi
          done

          # A failed `gh pr merge` is NOT terminal: the queue runs on a ~15-min
          # cron and is designed to skip-and-retry. Transient failures (CI not
          # yet complete at collection time, a GitHub API blip, a momentary
          # branch-protection state) must not kill an approved, mergeable PR --
          # closing here destroyed PR #885 that way (FAR-1146). So for each PR
          # in $FAILED we do NOT close, comment, or delete the branch: we emit a
          # loud warning and leave the PR open for the next cycle to retry.
          # `failed_gh_merge` is still written to $GITHUB_OUTPUT below because
          # downstream steps read it - and the job's FINAL step turns a non-empty
          # list into a ::error:: + a FAILED run, so a PR left unmerged can never
          # again hide behind a green 'Merge: Queue' conclusion (2026-10-01:
          # every tick concluded success while PR #1127 sat unmerged).
          for NUM in $FAILED; do
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "::warning::PR #$NUM: squash-merge attempt failed; PR stays OPEN for the next queue cycle (not closed). See run $RUN_URL for the outcome and logs."
          done

          GH_MERGED=$(echo "$GH_MERGED" | xargs)
          echo "$GH_MERGED" > /tmp/gh_merged_prs.txt
          echo "gh_merged_pr_nums=$GH_MERGED" >> "$GITHUB_OUTPUT"

          echo "failed_gh_merge=$(echo "$FAILED" | xargs)" >> "$GITHUB_OUTPUT"

      - name: Self-report merged PRs to Modulo (fail-open, best-effort)
        if: success() && steps.merge.outputs.merged_count != '0' && steps.toctou.outputs.aborted != 'true'
        env:
          MODULO_SELF_REPORT_URL: ${{ secrets.MODULO_SELF_REPORT_URL }}
          MODULO_SELF_REPORT_TOKEN: ${{ secrets.MODULO_SELF_REPORT_TOKEN }}
        shell: bash
        run: |
          # FAR-145 follow-up (workflow self-report): the merge queue DISCOVERS the
          # PRs it merges but never emitted work_item_refs, so the merge stage of a
          # lifecycle-map journey (backend/src/modulo/core/lifecycle_map/) never
          # advanced autonomously. This step emits a self-report payload matching
          # the work-item-refs contract in self_report.py ({kind, ref, status?}
          # entries — advisory operator claims that confirm/match existing journey
          # rows only, never mint). The parser reads the payload's work_item_refs
          # list directly (one of its recognised self-report keys).
          #
          # stage_id: "merge" names the lifecycle-map stage this workflow completes.
          # The merge stage is EXTERNAL (a GitHub Actions workflow, not a Modulo
          # pipeline), so it has no pipeline_id for the advancement service to
          # resolve; the endpoint uses stage_id to advance the journey into it.
          #
          # FAIL-OPEN BY DESIGN: discovery + the optional POST are guarded so a
          # Modulo outage can NEVER fail the merge queue. The payload is always
          # recorded in the log; the POST only fires when MODULO_SELF_REPORT_URL is
          # configured. The endpoint is POST
          # /api/v1/lifecycle-maps/{lifecycle_map_id}/journeys/self-report
          # (FAR-143); the URL secret points at the dogfood map's endpoint.
          PR_NUMS=$(git log main..merge-queue --oneline 2>/dev/null | grep -oP 'PR #\K\d+' | tac || true)
          [ -z "$PR_NUMS" ] && { echo "No PRs merged this cycle - nothing to self-report."; exit 0; }

          # Ref contract: kind "pr" + bare number — webhook-minted journeys are keyed
          # (org, "pr", "<number>") and the canonical journey key is uuid5(org:kind:ref), so kind "github_pr" would never match (the leading "#" was already stripped by canonicalisation and was never the issue).
          REFS="[]"
          for NUM in $PR_NUMS; do
            REFS=$(echo "$REFS" | jq -c --arg ref "${NUM}" '. + [{"kind": "pr", "ref": $ref, "status": "done"}]' 2>/dev/null || echo "$REFS")
          done
          PAYLOAD=$(jq -n --argjson refs "$REFS" \
            '{event: "workflow_self_report", source: "github_actions", workflow: "merge-queue", stage_id: "merge", work_item_refs: $refs}' 2>/dev/null) \
            || PAYLOAD='{"event":"workflow_self_report","source":"github_actions","workflow":"merge-queue","stage_id":"merge","work_item_refs":[]}'

          echo "=== Modulo self-report payload (merged PRs) ==="
          echo "$PAYLOAD"

          if [ -z "$MODULO_SELF_REPORT_URL" ]; then
            echo "::notice::MODULO_SELF_REPORT_URL not configured - merged PRs recorded in log only, POST skipped (fail-open)."
            exit 0
          fi

          # Capture status + body: a 200 with {"accepted":0,"unmatched":1} must
          # NOT read as success — that masking is the exact FAR-666 failure mode.
          # Keep -sS (stderr stays visible: connection/TLS errors reach the log);
          # drop -f so we can branch on the real HTTP status code.
          HTTP_CODE=$(curl -sS -o "${RUNNER_TEMP}/self-report-body.json" -w '%{http_code}' --max-time 15 -X POST "$MODULO_SELF_REPORT_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $MODULO_SELF_REPORT_TOKEN" \
            -d "$PAYLOAD") || HTTP_CODE="000"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::Modulo self-report POST failed (HTTP $HTTP_CODE): $(cat "${RUNNER_TEMP}/self-report-body.json" 2>/dev/null || echo 'no body') - merged PRs recorded in log only (fail-open)."
            exit 0
          fi

          ACCEPTED=$(jq -r '.accepted // 0' "${RUNNER_TEMP}/self-report-body.json" 2>/dev/null || echo 0)
          UNMATCHED=$(jq -r '.unmatched // 0' "${RUNNER_TEMP}/self-report-body.json" 2>/dev/null || echo 0)
          REJECTED=$(jq -r '.rejected // 0' "${RUNNER_TEMP}/self-report-body.json" 2>/dev/null || echo 0)
          REF_COUNT=$(echo "$PAYLOAD" | jq '.work_item_refs | length' 2>/dev/null || echo 0)
          if [ "$UNMATCHED" -gt 0 ] || { [ "$ACCEPTED" -eq 0 ] && [ "$REF_COUNT" -gt 0 ]; }; then
            echo "::warning::Modulo self-report matched no journeys (accepted=$ACCEPTED unmatched=$UNMATCHED rejected=$REJECTED) - check the ref kind/ref contract (expected kind 'pr' + bare PR number matching webhook-minted journeys)"
            exit 0
          fi
          echo "Self-report delivered to Modulo (accepted=$ACCEPTED unmatched=$UNMATCHED)."

      - name: Close Linear tickets for merged PRs
        if: success() && steps.merge.outputs.merged_count != '0' && steps.toctou.outputs.aborted != 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          # FAR-530: PRs that ACTUALLY merged to main this run (gh pr merge
          # succeeded), recorded by the ghmerge step - never re-derived from a
          # git-log range whose emptiness depends on step ordering.
          GH_MERGED_PRS: ${{ steps.ghmerge.outputs.gh_merged_pr_nums }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Build the candidate PR list from two sources (FAR-530):
          #   1. Primary: PRs gh-merged by THIS run (ghmerge step output).
          #   2. Fallback sweep: any PR merged after this run started, so a
          #      merge path that produced no output is still caught. GitHub
          #      returns both timestamps as ISO-8601 UTC, which compare
          #      correctly lexicographically.
          RUN_STARTED_AT=$(gh run view "${{ github.run_id }}" --repo "$REPO" --json createdAt --jq '.createdAt' 2>/dev/null || echo "")
          gh pr list --repo "$REPO" --state merged --limit 20 --json number,title,mergedAt 2>/dev/null \
            | jq -r --arg start "$RUN_STARTED_AT" \
                '.[] | select(.mergedAt != null) | select($start == "" or .mergedAt >= $start) | .number' \
            > /tmp/close_sweep_nums.txt || true

          : > /tmp/close_candidates.txt
          for NUM in $GH_MERGED_PRS; do echo "$NUM" >> /tmp/close_candidates.txt; done
          cat /tmp/close_sweep_nums.txt >> /tmp/close_candidates.txt
          sort -u /tmp/close_candidates.txt -o /tmp/close_candidates.txt
          CANDIDATES=$(tr '\n' ' ' < /tmp/close_candidates.txt | xargs)
          [ -z "$CANDIDATES" ] && { echo "No PRs merged this cycle - nothing to close."; exit 0; }
          echo "Candidate PRs for Linear close: $CANDIDATES"

          if [ -z "$LINEAR_API_KEY" ]; then
            echo "::warning::LINEAR_API_KEY not configured - skipping Linear ticket close (fail-open)."
            exit 0
          fi

          # Resolve the FAR team id once - the result is identical for every PR.
          TEAM_ID=$(curl -sS --max-time 30 -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" \
            -d '{"query":"{ teams(first: 50) { nodes { id key } } }"}' \
            | jq -r '.data.teams.nodes[] | select(.key == "FAR") | .id' 2>/dev/null || echo "")
          if [ -z "$TEAM_ID" ]; then
            echo "::warning::Could not resolve FAR team id - skipping Linear ticket close (fail-open)."
            exit 0
          fi

          # Resolve the FAR team's "Done" workflow state by name instead of a
          # hard-coded workspace UUID, so the close target can't silently drift.
          DONE_STATE_ID=$(curl -sS --max-time 30 -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" \
            -d "{\"query\":\"query(\$teamId: String!) { team(id: \$teamId) { states { nodes { id name } } } }\",\"variables\":{\"teamId\":\"$TEAM_ID\"}}" \
            | jq -r '.data.team.states.nodes[] | select(.name == "Done") | .id' 2>/dev/null || echo "")
          if [ -z "$DONE_STATE_ID" ]; then
            echo "::warning::Could not resolve FAR 'Done' workflow state - skipping Linear ticket close (fail-open)."
            exit 0
          fi

          # [partial] contract: a multi-PR sweep for one feature lands one slice
          # at a time. Every PR in the sweep EXCEPT THE FINAL ONE carries a
          # [partial] token in its title (case-insensitive). For such PRs this
          # step posts a Linear COMMENT on each referenced ticket instead of
          # moving it to Done, so an early slice cannot prematurely close the
          # whole sweep; the sweep owner closes the ticket manually when the
          # final slice merges. Titles without [partial] keep the existing
          # close-on-merge behaviour byte-for-byte.
          for NUM in $CANDIDATES; do
            TITLE=$(gh pr view "$NUM" --json title --jq '.title' 2>/dev/null || echo "")
            # FAR-530: close ALL FAR-ids in a title (one PR can resolve several),
            # deduplicated - the old 'head -1' structurally dropped the rest.
            TICKETS=$(echo "$TITLE" | grep -oP 'FAR-\d+' | sort -u || true)
            if [ -z "$TICKETS" ]; then
              echo "PR #$NUM has no FAR-xxx ticket in title - skipping Linear close"
              continue
            fi
            # One [partial] detection per PR (not per ticket) - the marker
            # describes the PR's slice status, not individual tickets.
            PARTIAL=$(echo "$TITLE" | grep -qi '\[partial\]' && echo "yes" || echo "no")
            for TICKET in $TICKETS; do
              if [ "$PARTIAL" = "yes" ]; then
                echo "PR #$NUM title carries [partial] - commenting on $TICKET instead of closing"
              else
                echo "Closing Linear ticket $TICKET for PR #$NUM"
              fi
              # Lookup the issue directly by identifier: Linear's documented
              # issue(id:) query accepts identifiers like "FAR-458". The previous
              # team.issues(filter: {identifier: ...}) query was ALWAYS a GraphQL
              # validation error ("Field \"identifier\" is not defined by type
              # \"IssueFilter\""), so every close attempt failed open with
              # "Ticket not found" (FAR-530 root cause).
              ISSUE_ID=$(curl -sS --max-time 30 -X POST https://api.linear.app/graphql \
                -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" \
                -d "{\"query\":\"query(\$identifier: String!) { issue(id: \$identifier) { id identifier state { name } } }\",\"variables\":{\"identifier\":\"$TICKET\"}}" \
                | jq -r '.data.issue.id // empty' 2>/dev/null || echo "")
              if [ -z "$ISSUE_ID" ]; then
                echo "::warning::Ticket $TICKET not found in Linear - skipping"
                continue
              fi
              if [ "$PARTIAL" = "yes" ]; then
                # Partial slice: comment on the ticket and leave it open. The
                # mutation travels via jq --arg (values, never string
                # interpolation), so title characters can't break the payload.
                COMMENT_BODY=$(printf 'PR #%s merged (partial slice): "%s". Ticket left open - close it manually when the sweep completes.' "$NUM" "$TITLE")
                COMMENT_PAYLOAD=$(jq -n \
                  --arg q 'mutation($input: CommentCreateInput!) { commentCreate(input: $input) { success comment { id } } }' \
                  --arg id "$ISSUE_ID" --arg body "$COMMENT_BODY" \
                  '{query: $q, variables: { input: { issueId: $id, body: $body } } }' \
                  2>/dev/null || echo "")
                COMMENT_OK=$(curl -sS --max-time 30 -X POST https://api.linear.app/graphql \
                  -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" \
                  -d "$COMMENT_PAYLOAD" \
                  | jq -r '.data.commentCreate.success' 2>/dev/null || echo "")
                if [ "$COMMENT_OK" = "true" ]; then
                  echo "  $TICKET <- partial-slice comment posted (ticket left open)"
                else
                  echo "::warning::Failed to comment on $TICKET for PR #$NUM (fail-open)"
                fi
                continue
              fi
              RESULT=$(curl -sS --max-time 30 -X POST https://api.linear.app/graphql \
                -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" \
                -d "{\"query\":\"mutation(\$id: String!, \$stateId: String!) { issueUpdate(id: \$id, input: { stateId: \$stateId }) { issue { id state { name } } } }\",\"variables\":{\"id\":\"$ISSUE_ID\",\"stateId\":\"$DONE_STATE_ID\"}}" \
                | jq -r '.data.issueUpdate.issue.state.name' 2>/dev/null || echo "")
              if [ -n "$RESULT" ]; then
                echo "  $TICKET -> $RESULT"
              else
                echo "::warning::Failed to close $TICKET (fail-open)"
              fi
            done
          done

      - name: Close GitHub issues referenced by merged PRs
        if: success() && steps.merge.outputs.merged_count != '0' && steps.toctou.outputs.aborted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Reuse the same candidate-PR list as the Linear close step (FAR-530):
          # PRs that ACTUALLY merged to main this run (gh pr merge succeeded),
          # plus a fallback sweep of PRs merged after this run started.
          GH_MERGED_PRS: ${{ steps.ghmerge.outputs.gh_merged_pr_nums }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Rebuild the candidate PR list (same two-source pattern as the Linear
          # close step above): primary source is ghmerge output; fallback sweep
          # catches any merge that produced no output.
          RUN_STARTED_AT=$(gh run view "${{ github.run_id }}" --repo "$REPO" --json createdAt --jq '.createdAt' 2>/dev/null || echo "")
          gh pr list --repo "$REPO" --state merged --limit 20 --json number,title,mergedAt 2>/dev/null \
            | jq -r --arg start "$RUN_STARTED_AT" \
                '.[] | select(.mergedAt != null) | select($start == "" or .mergedAt >= $start) | .number' \
            > /tmp/gh_close_sweep_nums.txt || true

          : > /tmp/gh_close_candidates.txt
          for NUM in $GH_MERGED_PRS; do echo "$NUM" >> /tmp/gh_close_candidates.txt; done
          cat /tmp/gh_close_sweep_nums.txt >> /tmp/gh_close_candidates.txt
          sort -u /tmp/gh_close_candidates.txt -o /tmp/gh_close_candidates.txt
          CANDIDATES=$(tr '\n' ' ' < /tmp/gh_close_candidates.txt | xargs)
          [ -z "$CANDIDATES" ] && { echo "No PRs merged this cycle - nothing to close for GitHub issues."; exit 0; }
          echo "Candidate PRs for GitHub issue close: $CANDIDATES"

          # Closing-keyword regex: matches case-insensitive fixes/closes/resolves
          # followed by optional whitespace and #<number>. The separator group
          # accepts any mix of comma and "and" separators as one match, so
          # (Closes #12, #34 and #56) and (Closes #12 and #34, #56) both yield
          # every reference for the downstream #N extraction. The leading
          # (^|[[:space:]]+) prevents matching inside words (e.g. "closesourced")
          # while allowing a match at the start of a line.
          CLOSING_REGEX='(^|[[:space:]]+)(fixes|closes|resolves):?[[:space:]]+#[0-9]+(([[:space:]]*,[[:space:]]*|[[:space:]]+and[[:space:]]+)#[0-9]+)*'

          for NUM in $CANDIDATES; do
            TITLE=$(gh pr view "$NUM" --json title --jq '.title' 2>/dev/null || echo "")
            BODY=$(gh pr view "$NUM" --json body --jq '.body // ""' 2>/dev/null || echo "")

            # [partial] detection: a PR that is one slice of a multi-PR sweep
            # must comment instead of close, exactly like the Linear step.
            PARTIAL=$(echo "$TITLE" | grep -qi '\[partial\]' && echo "yes" || echo "no")

            # Extract closing references from BOTH title and body. First strip
            # fenced code blocks so a Fixes #1 inside a code fence is not treated
            # as a real closing reference (GitHub's renderer skips code fences).
            # Handles ``` and ~~~ fences, indented or flush-left, and only closes
            # on a matching delimiter character. The grep produces lines like
            # "  Closes #42" or "  Fixes #94"; we pull the issue number from each
            # match, deduplicated.
            ISSUES=$(echo "$TITLE"$'\n'"$BODY" \
              | awk '
                  {
                    stripped = $0
                    sub(/^[[:space:]]*/, "", stripped)
                    if (in_fence) {
                      if (stripped ~ ("^" fence_char fence_char fence_char)) in_fence = 0
                      next
                    }
                    if (stripped ~ /^```/ || stripped ~ /^~~~/ ) { fence_char = substr(stripped, 1, 1); in_fence = 1; next }
                    print
                  }' \
              | grep -ioE "$CLOSING_REGEX" \
              | grep -oE '#[0-9]+' \
              | sed 's/^#//' \
              | sort -un || true)

            if [ -z "$ISSUES" ]; then
              echo "PR #$NUM has no closing-keyword issue references - skipping"
              continue
            fi

            for ISSUE_NUM in $ISSUES; do
              # Safety: only close issues in THIS repo (never cross-repo).
              # gh issue view defaults to the current repo via GH_REPO/GITHUB_REPOSITORY.
              if [ "$PARTIAL" = "yes" ]; then
                # Check current state: skip if already closed (idempotent).
                ISSUE_STATE=$(gh issue view "$ISSUE_NUM" --json state --jq '.state' 2>/dev/null || echo "")
                if [ "$ISSUE_STATE" = "CLOSED" ]; then
                  echo "Issue #$ISSUE_NUM is already closed - skipping comment"
                  continue
                fi
                if [ -z "$ISSUE_STATE" ]; then
                  echo "::warning::Could not fetch state for issue #$ISSUE_NUM (API error or not found) - skipping comment (fail-open)"
                  continue
                fi
                echo "PR #$NUM carries [partial] - commenting on issue #$ISSUE_NUM instead of closing"
                COMMENT_BODY="PR #$NUM merged (partial slice): \"$TITLE\". Issue left open - close it manually when the sweep completes."
                if ! gh issue comment "$ISSUE_NUM" --body "$COMMENT_BODY" > /dev/null 2>&1; then
                  echo "::warning::Failed to comment on issue #$ISSUE_NUM for PR #$NUM (fail-open)"
                else
                  echo "  issue #$ISSUE_NUM <- partial-slice comment posted (issue left open)"
                fi
                continue
              fi

              # Check current state: skip if already closed (idempotent).
              ISSUE_STATE=$(gh issue view "$ISSUE_NUM" --json state --jq '.state' 2>/dev/null || echo "")
              if [ "$ISSUE_STATE" = "CLOSED" ]; then
                echo "Issue #$ISSUE_NUM is already closed - skipping"
                continue
              fi
              if [ -z "$ISSUE_STATE" ]; then
                echo "::warning::Could not fetch state for issue #$ISSUE_NUM (API error or not found) - skipping (fail-open)"
                continue
              fi

              echo "Closing GitHub issue #$ISSUE_NUM for PR #$NUM"
              RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              CLOSE_REASON="Auto-closed by the merge queue: PR #$NUM merged and referenced this issue. See run $RUN_URL for details."

              # Post the closure comment FIRST (the comment IS the audit trail,
              # per the bot-PR-closures lesson in AGENTS.md). If the comment
              # fails, still close but emit a visible warning.
              if ! gh issue comment "$ISSUE_NUM" --body "$CLOSE_REASON" > /dev/null 2>&1; then
                echo "::warning::closure comment failed for issue #$ISSUE_NUM - closing without audit-trail comment. Reason NOT posted: $CLOSE_REASON"
              fi
              if gh issue close "$ISSUE_NUM" > /dev/null 2>&1; then
                echo "  issue #$ISSUE_NUM -> CLOSED"
              else
                echo "::warning::Failed to close issue #$ISSUE_NUM (fail-open)"
              fi
            done
          done

      # FAR-917: Before deleting any branch, detect open PRs whose BASE is that
      # branch. GitHub auto-closes a PR when its base branch is deleted, so a
      # stacked/child PR would silently vanish. The script retargets child PRs to
      # main when possible; when not, it protects the branch (skips deletion) and
      # posts a loud explanation on the child PR.
      - name: Find and retarget stacked PRs (FAR-917)
        id: stacked_pr_guard
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Collect all branches we are about to delete: merged PR head refs
          # (same source as the defense-in-depth sweep). FAIL SAFE: if this query
          # fails we cannot know which branches might have child PRs, so we set
          # skip_deletions and the sweep deletes NOTHING this tick. The previous
          # `|| true` treated a failed query as an EMPTY branch list and let the
          # sweep (which re-queries independently) delete unprotected branches.
          if gh api "repos/${{ github.repository }}/pulls?state=closed&per_page=100&sort=updated&direction=desc" --paginate \
               --jq '.[] | select(.merged_at != null) | select(.head.repo.id == .base.repo.id) | .head.ref' \
               2>/tmp/branches_to_delete.err | sort -u > /tmp/branches_to_delete.txt; then
            : # enumeration succeeded
          else
            echo "::error title=FAR-917 stacked-PR guard::could not enumerate branches slated for deletion ($(head -1 /tmp/branches_to_delete.err 2>/dev/null)) -- skipping ALL branch deletions this tick (fail safe)"
            {
              echo "protected_branches="
              echo "retargeted_prs="
              echo "skip_deletions=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH_COUNT=$(wc -l < /tmp/branches_to_delete.txt 2>/dev/null || echo 0)
          echo "Branches slated for deletion: $BRANCH_COUNT"

          if [ "$BRANCH_COUNT" -eq 0 ]; then
            echo "No branches to check -- skipping stacked PR detection."
            echo "protected_branches=" >> "$GITHUB_OUTPUT"
            echo "retargeted_prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Run the retarget script: it finds open PRs whose base matches any
          # branch in the list, retargets them to main, and outputs protected
          # branches. On any query failure the script protects EVERY slated
          # branch (it never exits non-zero for that, so the post-merge CI/deploy
          # dispatch below still runs).
          # Branches are passed one-per-line via a bash array: git refs cannot
          # contain whitespace, so the old whitespace-split string was equivalent,
          # but the array never word-splits and is what ci.yml already uses for
          # file lists (mapfile idiom).
          mapfile -t BRANCHES < /tmp/branches_to_delete.txt
          python3 .github/scripts/retarget-stacked-prs.py "${BRANCHES[@]}" main

      - name: Delete branches whose PRs are already merged (defense-in-depth)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PROTECTED_BRANCHES: ${{ steps.stacked_pr_guard.outputs.protected_branches }}
          SKIP_DELETIONS: ${{ steps.stacked_pr_guard.outputs.skip_deletions }}
        shell: bash
        run: |
          # Defense-in-depth sweep: catch (a) branches whose PR was merged outside
          # this queue run (e.g. manual merges) and (b) any branch whose delete
          # failed in the per-PR step above. Every delete is best-effort so a
          # failure can never fail the queue. Never delete main, and never delete
          # a branch that is the head of an OPEN PR (a merged branch can be reused).
          # FAR-917: also skip branches that are the BASE of an open stacked PR
          # (protected by the retarget step above -- child PRs could not be
          # retargeted, so the base must stay to prevent silent closure).
          if [ "${SKIP_DELETIONS:-false}" = "true" ]; then
            echo "::warning::FAR-917: the stacked-PR guard could not enumerate merged branches -- skipping the branch sweep this tick (fail safe)."
            exit 0
          fi
          echo "Sweeping for branches whose PRs are already merged..."
          # List merged PRs (paginated) and collect their head branches -- but only
          # branches that live on THIS repo (skip fork PRs: a fork head ref may
          # collide with an unrelated same-named branch here).
          gh api "repos/${{ github.repository }}/pulls?state=closed&per_page=100&sort=updated&direction=desc" --paginate --jq '.[] | select(.merged_at != null) | select(.head.repo.id == .base.repo.id) | .head.ref' 2>/dev/null | sort -u > /tmp/merged_heads.txt || true
          # Branches that still exist on origin
          gh api "repos/${{ github.repository }}/branches" --paginate --jq '.[].name' 2>/dev/null | sort -u > /tmp/remote_branches.txt || true
          # Open PR head refs -- never delete a branch an open PR points at
          gh api "repos/${{ github.repository }}/pulls?state=open&per_page=100" --paginate --jq '.[].head.ref' 2>/dev/null | sort -u > /tmp/open_heads.txt || true
          # FAR-917: protected base branches -- child PRs could not be retargeted
          echo "$PROTECTED_BRANCHES" | tr ' ' '\n' | sort -u > /tmp/protected_bases.txt 2>/dev/null || true
          # Delete every branch that has a merged PR (guard each delete; never fail the queue)
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "main" ] && continue
            if grep -qx "$branch" /tmp/open_heads.txt 2>/dev/null; then
              echo "  Skipping $branch (head of an open PR)"
              continue
            fi
            if grep -qx "$branch" /tmp/protected_bases.txt 2>/dev/null; then
              echo "  Skipping $branch (FAR-917: base of an open stacked PR that could not be retargeted)"
              continue
            fi
            if grep -qx "$branch" /tmp/merged_heads.txt 2>/dev/null; then
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$branch" 2>/dev/null && echo "  Deleted merged branch: $branch" || echo "  Could not delete $branch (may already be gone)"
            fi
          done < /tmp/remote_branches.txt
          echo "Merged-branch sweep complete."

      - name: Trigger main CI and deploy after merge
        if: success() && steps.merge.outputs.merged_count != '0' && steps.migration_heads.outputs.remaining_count != '0' && steps.toctou.outputs.aborted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Merges landed on main - dispatching CI and deploy workflows..."
          gh workflow run ci.yml --ref main
          gh workflow run deploy.yml --ref main
          echo "Dispatched 'CI: Fast Validation' and 'Deploy: Staging + Prod' on main."

      - name: Clean up remote merge-queue branch
        if: success() && steps.merge.outputs.merged_count != '0'
        shell: bash
        run: |
          git push origin --delete "refs/heads/${{ env.branch_ref }}" 2>/dev/null || true
          echo "Cleaned up merge-queue remote branch."

      # FAR-492 self-chaining fallback - STATELESS design, chosen over the
      # counter-based alternative because it needs no cross-run persisted
      # state: the dispatch payload itself carries {depth, ready_at}; the
      # event-gate job honors the not-before time (~10-min pacing on a tiny
      # idle runner) and the depth cap (12, then re-anchor to the 15-min cron).
      # Idle passes chain NOTHING - the next Housekeeper dispatch / watchdog
      # re-arm / cron tick re-fires the queue - so the loop self-terminates
      # when nothing waits.
      #
      # FAR-1099 CI-stall detection: when approved PRs are stuck with no CI
      # conclusion for >2 hours, fail loudly and post a Linear comment. This
      # catches the same silent-death shape as the 2026-09-17 deadlock where a
      # flaky test blocked every deploy for 3 days.
      - name: Self-chain next pass while approved PRs wait on CI (FAR-492)
        if: success() && steps.collect.outputs.ci_pending_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_DEPTH: ${{ github.event.client_payload.depth || 0 }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          case "$CHAIN_DEPTH" in ''|*[!0-9]*) CHAIN_DEPTH=0 ;; esac

          # --- CI-stall detection (FAR-1099) ---
          # For each pending PR, check whether its CI workflow run has concluded.
          # The collect step already identified this PR as CI-pending via
          # `gh run list --branch <branch> --workflow "CI: Fast Validation"`,
          # so we use the same source (workflow run start time + conclusion)
          # rather than the unreliable check-runs API. Required behaviour
          # (Hopper spec):
          #   - No CI conclusion on the head SHA within 30 minutes →
          #     re-dispatch the self-chain (keep pacing).
          #   - Unresolved after 2 hours → fail a step loudly with
          #     ::error:: and post a Linear comment.
          STALL_FOUND=false
          STALL_REPORT=""
          # Only PRs that actually breached the 2h threshold are recorded here,
          # so the Linear-comment loop below never notifies about a
          # freshly-pending (non-stalled) PR.
          STALLED_PRS_FILE=/tmp/ci_stalled_prs.txt
          : > "$STALLED_PRS_FILE"
          NOW=$(date -u +%s)
          if [ -f /tmp/ci_pending_prs.txt ]; then
            while IFS= read -r PR_NUM; do
              [ -z "$PR_NUM" ] && continue
              CI_BRANCH=$(gh pr view "$PR_NUM" --json headRefName --jq '.headRefName' 2>/dev/null || echo "")
              [ -z "$CI_BRANCH" ] && continue
              # Use the same source as the collect step: workflow run conclusion + status.
              # Age the pending window from the CURRENT attempt's start (`startedAt`),
              # not `createdAt`: createdAt is pinned to the run's first creation and
              # does NOT advance on a re-run, so an actively-progressing attempt 2+
              # was misreported as stalled once attempt 1's createdAt aged past 2h
              # (2026-10-07: PR #1374's Test (Backend) was still running while its
              # attempt-1 createdAt showed 188min). Fall back to createdAt only when
              # startedAt is empty (a run queued but never picked up by a runner).
              CI_RUN=$(gh run list --branch "$CI_BRANCH" --workflow "CI: Fast Validation" --limit 1 \
                --json conclusion,createdAt,startedAt,status 2>/dev/null || echo "[]")
              CI_CONCLUSION=$(echo "$CI_RUN" | jq -r '.[0].conclusion // empty' 2>/dev/null || echo "")
              CI_CREATED=$(echo "$CI_RUN" | jq -r '.[0].createdAt // empty' 2>/dev/null || echo "")
              CI_STARTED=$(echo "$CI_RUN" | jq -r '.[0].startedAt // empty' 2>/dev/null || echo "")
              CI_SINCE="${CI_STARTED:-$CI_CREATED}"
              if [ -n "$CI_CONCLUSION" ]; then
                echo "  PR #$PR_NUM: CI concluded ($CI_CONCLUSION) — not stalled"
                continue
              fi
              if [ -z "$CI_SINCE" ]; then
                echo "  PR #$PR_NUM: no CI run found — skipping stall check"
                continue
              fi
              CI_EPOCH=$(date -u -d "$CI_SINCE" +%s 2>/dev/null || echo "$NOW")
              AGE_S=$((NOW - CI_EPOCH))
              AGE_MIN=$((AGE_S / 60))
              echo "  PR #$PR_NUM: CI pending for ${AGE_MIN}min (since $CI_SINCE)"

              if [ "$AGE_S" -gt 7200 ]; then
                # >2 hours — hard fail + Linear comment
                STALL_FOUND=true
                STALL_REPORT="$STALL_REPORT PR #$PR_NUM (${AGE_MIN}min)"
                echo "$PR_NUM" >> "$STALLED_PRS_FILE"
                echo "::error::FAR-1099: PR #$PR_NUM CI stalled for ${AGE_MIN}min (>2h threshold). Flaky test or CI infrastructure failure."
              elif [ "$AGE_S" -gt 1800 ]; then
                # >30 minutes — re-dispatch self-chain to keep pacing
                echo "  PR #$PR_NUM: CI pending ${AGE_MIN}min (>30min) — re-dispatching self-chain"
              fi
            done < /tmp/ci_pending_prs.txt
          fi

          if [ "$STALL_FOUND" = "true" ]; then
            # Post Linear comment about the stall
            if [ -n "$LINEAR_API_KEY" ]; then
              # Iterate only the PRs that breached the 2h threshold — not every
              # CI-pending PR — so freshly-pending PRs are not misreported.
              while IFS= read -r PR_NUM; do
                [ -z "$PR_NUM" ] && continue
                PR_TITLE=$(gh pr view "$PR_NUM" --json title --jq '.title' 2>/dev/null || echo "")
                FAR_TICKET=$(echo "$PR_TITLE" | grep -oP 'FAR-\d+' | head -1 || true)
                if [ -n "$FAR_TICKET" ]; then
                  HEAD_SHA=$(gh pr view "$PR_NUM" --json headRefOid --jq '.headRefOid' 2>/dev/null | cut -c1-12)
                  COMMENT_BODY="FAR-1099 merge-queue CI stall detected: PR #$PR_NUM has been pending CI for >2 hours on head SHA $HEAD_SHA. This blocks all subsequent approved PRs from merging. Flaky test or CI infrastructure failure suspected. Merge queue tick: ${{ github.run_id }}."
                  # Build both GraphQL payloads with jq --arg: the PR title /
                  # comment body may contain quotes or escapes that would
                  # otherwise break (or inject into) the JSON request body.
                  QUERY_PAYLOAD=$(jq -n \
                    --arg q 'query($id: String!) { issue(id: $id) { id } }' \
                    --arg id "$FAR_TICKET" \
                    '{query: $q, variables: {id: $id}}')
                  ISSUE_ID=$(curl -sS --max-time 30 -X POST https://api.linear.app/graphql \
                    -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" \
                    -d "$QUERY_PAYLOAD" \
                    | jq -r '.data.issue.id // empty' 2>/dev/null || echo "")
                  if [ -n "$ISSUE_ID" ]; then
                    MUTATION_PAYLOAD=$(jq -n \
                      --arg q 'mutation($input: CommentCreateInput!) { commentCreate(input: $input) { success } }' \
                      --arg id "$ISSUE_ID" --arg body "$COMMENT_BODY" \
                      '{query: $q, variables: {input: {issueId: $id, body: $body}}}')
                    curl -sS --max-time 30 -X POST https://api.linear.app/graphql \
                      -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" \
                      -d "$MUTATION_PAYLOAD" \
                      > /dev/null 2>&1 || echo "::warning::Failed to post Linear comment for $FAR_TICKET"
                  fi
                fi
              done < "$STALLED_PRS_FILE"
            fi
            echo "::error::FAR-1099: CI stall detected — PRs with stalled CI:$STALL_REPORT. Merge queue halted until CI resolves."
            exit 1
          fi

          # --- Normal self-chain (FAR-492) ---
          NEXT_DEPTH=$((CHAIN_DEPTH + 1))
          READY_AT=$(( $(date -u +%s) + 600 ))
          PAYLOAD=$(jq -n --argjson depth "$NEXT_DEPTH" --argjson ready_at "$READY_AT" \
            '{event_type: "merge-queue-chain", client_payload: {depth: $depth, ready_at: $ready_at}}')
          # repository_dispatch, NOT `gh workflow run`: GitHub 422s
          # workflow_dispatch on a recently modified workflow ("Workflow does
          # not have 'workflow_dispatch' trigger" caching bug). GITHUB_TOKEN is
          # exempt from the recursive-run block for repository_dispatch.
          if gh api -X POST "repos/${{ github.repository }}/dispatches" --input - <<< "$PAYLOAD" 2>&1; then
            echo "Chained next queue pass (~10 min out, depth $NEXT_DEPTH) - keeps pace while CI runs."
          else
            # Non-fatal: the Housekeeper dispatch + cron + watchdog re-arm still cover the queue.
            echo "::warning::repository_dispatch chain failed - Housekeeper dispatch + cron + watchdog keep coverage."
          fi

      # If CI failed or conflicts -- preserve for fixer
      - name: Preserve merge-queue branch on CI failure
        if: failure() && steps.merge.outputs.merged_count != '0'
        env:
          # Same workflow-scoped PAT, carried by the SAME single mechanism as the
          # reference push above (the env-driven `url.<base>.insteadOf` rewrite):
          # the preserved branch can contain merged .github/workflows/* changes,
          # which GITHUB_TOKEN (the github-actions App) can never push
          # (2026-10-01).
          #
          # FAR-1940: the http.extraheader Authorization header that used to
          # double-configure this PAT is gone - two mechanisms made git send two
          # Authorization headers and GitHub rejected the push with
          # `remote: Duplicate header: "Authorization"`, which is why this step
          # could not preserve a branch at all.
          GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.MODULO_REVIEWBOT_TOKEN }}@github.com/.insteadOf'
        shell: bash
        run: |
          TIMESTAMP=$(date +%s)
          # NOT best-effort (FAR-1940): the Branch Fixer notification below
          # carries this branch name, so a fixer run with no preserved branch has
          # nothing to repair. A failed push therefore FAILS this step - the job
          # is already failing, so this adds no new failure mode, it only makes
          # the real one visible (the git output above names the reason).
          if git push origin "merge-queue:refs/heads/merge-queue/failed-${TIMESTAMP}" 2>&1; then
            echo "branch_ref=merge-queue/failed-$TIMESTAMP" >> "$GITHUB_ENV"
            echo "Preserved merge-queue branch at merge-queue/failed-$TIMESTAMP"
          else
            echo "::error::Could not preserve the merge-queue branch (workflows-scoped PAT rejected or network error - see git output above). The Branch Fixer notification below carries no branch to repair."
            exit 1
          fi

      - name: Notify branch-fixer on CI failure
        if: failure() && steps.merge.outputs.merged_count != '0'
        env:
          DISPATCH_URL: ${{ secrets.MODULO_BRANCH_FIXER_WEBHOOK_URL }}
          DISPATCH_SECRET: ${{ secrets.MODULO_BRANCH_FIXER_HMAC_SECRET }}
          DISPATCH_LABEL: "Modulo Branch Fixer"
          # 120s, not the 300s default: this job has a 60-min timeout with only
          # ~8 min measured headroom (37.0-min baseline, validation 34.3 min)
          # and TWO of its three dispatches run BEFORE the batch validation.
          DISPATCH_BUDGET_SECONDS: 120
          # Needed by the undelivered-notification fallback below (FAR-1939):
          # `gh pr comment` authenticates with the job's GITHUB_TOKEN, which
          # carries pull-requests:write (see the job's permissions block).
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -z "$DISPATCH_URL" ]; then echo "No webhook URL configured -- skipping notification"; exit 0; fi
          MERGED=$(cat /tmp/merged_prs.txt 2>/dev/null || echo "")
          CONFLICTS=$(cat /tmp/conflict_prs.txt 2>/dev/null || echo "")
          FAILURE_DESC=$(cat /tmp/failure_description.txt 2>/dev/null || echo "CI check failed")
          # Deliberately NO taskKind: this is a CI-failure task, so the absent
          # marker must keep selecting the CI-failure retry ladder. Only the
          # conflict-class dispatches above carry `taskKind: conflict` (FAR-2033).
          BODY=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg phase "ci-failure" \
            --arg branchName "${{ env.branch_ref }}" \
            --arg merged_prs "$MERGED" \
            --arg conflict_prs "$CONFLICTS" \
            --arg failure_description "$FAILURE_DESC" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{repository: $repo, phase: $phase, branchName: $branchName, mergedPrs: $merged_prs, conflictPrs: $conflict_prs, failureDescription: $failure_description, runUrl: $run_url}')
          # One shared retry policy (scripts/dispatch_with_retry.sh) - see the
          # merge-conflict notify step above for the contract. The script exits
          # 1 when the dispatch is never delivered and writes the real last
          # HTTP / class / detail / attempt count to DISPATCH_RESULT_FILE.
          DISPATCH_RESULT_FILE="/tmp/last_dispatch_result_ci_failure.env"
          rm -f "${DISPATCH_RESULT_FILE}"
          DISPATCH_OK="false"
          if DISPATCH_RESULT_FILE="${DISPATCH_RESULT_FILE}" \
             DISPATCH_BODY="${BODY}" bash scripts/dispatch_with_retry.sh; then
            DISPATCH_OK="true"
            echo "Fixer notified of CI failure"
          fi
          if [ "$DISPATCH_OK" != "true" ]; then
            # shellcheck disable=SC1090
            source "${DISPATCH_RESULT_FILE}" 2>/dev/null || true
            LAST_HTTP="${DISPATCH_LAST_HTTP:-unknown}"
            DETAIL="${DISPATCH_LAST_DETAIL:-unknown}"
            # FAR-1939: an undelivered notification must never be SILENT, and it
            # must be attributable to the PR(s) it concerns (see the merge-
            # conflict notify step for the incident). The affected PRs are the
            # ones whose combined validation on the queue branch failed, plus any
            # conflicts reported alongside it; each gets the durable comment.
            #
            # 2026-10-21 (see the merge-conflict notify step): the step now fails
            # only when the signal is actually LOST - i.e. at least one affected
            # PR could not get its durable comment (or no PR could be identified
            # at all). If every affected PR got one, the job is already failing
            # for the real reason, so this step warns and exits 0 rather than
            # adding a second, misleading failure.
            DURABLE_COMMENT_PR_COUNT=0
            UNDELIVERED_PR_COUNT=0
            UNDELIVERED_PRS=""
            AFFECTED=$(echo "$MERGED $CONFLICTS" | xargs)
            for NUM in $AFFECTED; do
              [ -z "$NUM" ] && continue
              UNDELIVERED_BODY="The merge queue could NOT deliver its CI-failure notification to the Branch Fixer for this PR: every webhook attempt failed (last HTTP ${LAST_HTTP}: ${DETAIL}). The combined validation on the merge-queue branch failed (${FAILURE_DESC}), so nothing was merged and no fix was dispatched. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              if gh pr comment "$NUM" --body "$UNDELIVERED_BODY" > /dev/null 2>&1; then
                echo "::notice::PR #$NUM: posted a comment recording that the Branch Fixer was never notified."
                DURABLE_COMMENT_PR_COUNT=$((DURABLE_COMMENT_PR_COUNT + 1))
              else
                echo "::error::PR #$NUM: could not post the undelivered-notification comment either — this PR has NO durable signal that the Branch Fixer was never asked to fix the queue branch (webhook HTTP ${LAST_HTTP}: ${DETAIL})."
                UNDELIVERED_PR_COUNT=$((UNDELIVERED_PR_COUNT + 1))
                UNDELIVERED_PRS="$UNDELIVERED_PRS $NUM"
              fi
            done
            UNDELIVERED_PRS="${UNDELIVERED_PRS# }"
            if [ "$UNDELIVERED_PR_COUNT" -ne 0 ] || [ "$DURABLE_COMMENT_PR_COUNT" -eq 0 ]; then
              echo "::error::Branch Fixer webhook dispatch failed for PR(s) ${AFFECTED:-<none>} (HTTP ${LAST_HTTP}: ${DETAIL}) and the durable failure comment could not be recorded on every affected PR (recorded on ${DURABLE_COMMENT_PR_COUNT}, failed on ${UNDELIVERED_PR_COUNT}: ${UNDELIVERED_PRS:-<none>}) — the CI-failure notification now has NO durable signal. Failing hard."
              exit 1
            fi
            echo "::warning::Branch Fixer webhook dispatch failed for PR(s) ${AFFECTED:-<none>} (HTTP ${LAST_HTTP}: ${DETAIL}) — CI-failure notification was not delivered, BUT a durable comment recording the failure was posted on all ${DURABLE_COMMENT_PR_COUNT} affected PR(s). The job still fails for the real validation reason; this notification step does not add a second failure."
            exit 0
          fi

      # The run's verdict on unmerged PRs. MUST stay the LAST step of this job:
      # placed here, every downstream success()-gated step (ticket close, CI/deploy
      # dispatch, cleanup, self-chain) has already run for the PRs that DID merge,
      # and the failure()-gated Branch Fixer notification has already run (or been
      # correctly skipped) for real CI failures - so this step fails the run for
      # exactly one reason: a PR the queue attempted to merge and could not.
      #
      # 2026-10-01 defect: `gh pr merge` failures were recorded, warned about, and
      # then swallowed - every tick concluded `success` while PR #1127 sat approved,
      # CI-green and unmerged for ~21 hours (Wall A: GitHub App has no `workflows`
      # permission; Wall B: gh's client-side blockedReason refused before calling
      # the API). The queue also merges other PRs behind a failure, so the run
      # looked healthy. A silent success is what hid the bug - this step removes it.
      - name: Fail the run when a PR was left unmerged
        if: always() && steps.ghmerge.outputs.failed_gh_merge != ''
        env:
          FAILED_PRS: ${{ steps.ghmerge.outputs.failed_gh_merge }}
        shell: bash
        run: |
          LIST="PR #${FAILED_PRS// /, #}"
          echo "::error::Merge queue could not merge ${LIST} this tick - the PR(s) stay OPEN for the next cycle, but this run is FAILED so a PR left unmerged can never be reported as a silent success. Per-PR reasons are in the 'Merge source PRs via gh pr merge' step logs."
          {
            echo "## Merge queue: PR(s) left unmerged"
            echo ""
            echo "${LIST} failed to merge this tick and remain open. This run is marked failed so the outcome is visible."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
