name: Merge to Main

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: merge-to-main
  cancel-in-progress: false

jobs:
  merge:
    name: Batch merge PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure git
        run: |
          git config user.name "modulo-merge-bot"
          git config user.email "bot@modulo.run"

      - name: Collect open PRs
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Fetching open PRs..."
          PR_LIST=$(gh pr list --state open --json number,title,headRefName 2>&1) || echo "[]"
          PR_COUNT=$(echo "$PR_LIST" | jq 'length')
          echo "Found $PR_COUNT open PR(s)"
          echo "pr_list=$PR_LIST" >> "$GITHUB_OUTPUT"
          echo "pr_count=$PR_COUNT" >> "$GITHUB_OUTPUT"
          echo "$PR_LIST" | jq -c '.[]' | while read -r pr; do
            NUM=$(echo "$pr" | jq -r '.number')
            TITLE=$(echo "$pr" | jq -r '.title')
            echo "  #$NUM: $TITLE"
          done

      - name: Merge and test each PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LIST_JSON: ${{ steps.prs.outputs.pr_list }}
          SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
          FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="
        shell: bash
        run: |
          merged=0
          skipped=0
          failed=""

          while IFS= read -r pr; do
            NUM=$(echo "$pr" | jq -r '.number')
            TITLE=$(echo "$pr" | jq -r '.title')
            REF=$(echo "$pr" | jq -r '.headRefName')

            echo ""
            echo "============================================================"
            echo "Processing PR #$NUM: $TITLE"
            echo "============================================================"

            # Fetch the PR branch
            echo "Fetching PR #$NUM..."
            git fetch origin "+refs/pull/$NUM/head:refs/heads/pr-$NUM" 2>&1

            # Try to squash-merge
            echo "Attempting squash-merge..."
            if git merge --squash "pr-$NUM" 2>&1; then
              git commit -m "squash! Merge PR #$NUM: $TITLE" 2>&1
              echo "Merge commit created."
            else
              echo "PR #$NUM has merge conflicts — skipping."
              git merge --abort 2>/dev/null || true
              skipped=$((skipped + 1))
              continue
            fi

            # ── Run test suite ──────────────────────────────────────
            echo "Running test suite for PR #$NUM..."

            # Backend lint
            echo "--- ruff check ---"
            cd backend
            uv run --no-sync ruff check . && echo "ruff passed" || { echo "ruff FAILED"; cd ..; git reset --hard HEAD~1; failed="$failed $NUM"; continue; }
            cd ..

            echo "--- mypy ---"
            cd backend
            uv run --no-sync mypy src/modulo/ && echo "mypy passed" || { echo "mypy FAILED"; cd ..; git reset --hard HEAD~1; failed="$failed $NUM"; continue; }
            cd ..

            echo "--- bandit ---"
            cd backend
            uv run --no-sync bandit -r src/modulo/ -ll && echo "bandit passed" || { echo "bandit FAILED"; cd ..; git reset --hard HEAD~1; failed="$failed $NUM"; continue; }
            cd ..

            # Backend unit tests
            echo "--- backend unit tests ---"
            cd backend
            uv run --no-sync pytest tests/unit/ -x -q --timeout=120 && echo "backend tests passed" || { echo "backend tests FAILED"; cd ..; git reset --hard HEAD~1; failed="$failed $NUM"; continue; }
            cd ..

            # Frontend checks
            echo "--- frontend npm ci ---"
            cd frontend
            npm ci 2>&1 && echo "npm ci passed" || { echo "npm ci FAILED"; cd ..; git reset --hard HEAD~1; failed="$failed $NUM"; continue; }
            cd ..

            echo "--- frontend lint ---"
            cd frontend
            npm run lint -- --quiet 2>&1 && echo "frontend lint passed" || { echo "frontend lint FAILED"; cd ..; git reset --hard HEAD~1; failed="$failed $NUM"; continue; }
            cd ..

            echo "--- frontend type-check ---"
            cd frontend
            npm run type-check 2>&1 && echo "type-check passed" || { echo "type-check FAILED"; cd ..; git reset --hard HEAD~1; failed="$failed $NUM"; continue; }
            cd ..

            echo "--- frontend unit tests ---"
            cd frontend
            npm run test:unit 2>&1 && echo "frontend unit tests passed" || { echo "frontend unit tests FAILED"; cd ..; git reset --hard HEAD~1; failed="$failed $NUM"; continue; }
            cd ..

            echo "--- frontend build ---"
            cd frontend
            npm run build 2>&1 && echo "build passed" || { echo "build FAILED"; cd ..; git reset --hard HEAD~1; failed="$failed $NUM"; continue; }
            cd ..

            # All tests passed — keep this merge
            merged=$((merged + 1))
            echo "PR #$NUM: ALL TESTS PASSED — merged."
          done < <(echo "$PR_LIST_JSON" | jq -c '.[]')

          echo ""
          echo "============================================================"
          echo "Merge batch complete: $merged merged, $skipped skipped (conflicts), $failed failed (tests)"
          echo "============================================================"
          if [ "$merged" -eq 0 ]; then
            echo "No PRs merged — nothing to push."
            exit 1
          fi

      - name: Push to main
        run: |
          echo "Pushing merged PR(s) to main..."
          git push origin main
          echo "Done."
