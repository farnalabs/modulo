name: Merge Queue

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to squash-merge'
        required: true
        type: number

permissions:
  contents: write

concurrency:
  group: merge-queue
  cancel-in-progress: false

jobs:
  prepare-merge:
    name: Test-merge PR #${{ inputs.pr_number }}
    runs-on: ubuntu-latest
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure git
        shell: bash
        run: |
          git config user.name "modulo-merge-bot"
          git config user.email "bot@modulo.run"
      - name: Fetch and squash-merge PR
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=${{ inputs.pr_number }}
          echo "Fetching PR #$PR_NUM..."
          git fetch origin refs/pull/$PR_NUM/head:refs/heads/pr-$PR_NUM
          echo "Creating squash merge..."
          git merge --squash pr-$PR_NUM
          git commit -m "squash! Merge PR #$PR_NUM"
          MERGE_SHA=$(git rev-parse HEAD)
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "Merge commit: $MERGE_SHA"
      - name: Push merge to validation branch
        shell: bash
        run: |
          git push origin ${{ steps.merge.outputs.merge_sha }}:refs/heads/merge-queue/pr-${{ inputs.pr_number }} --force

  ci:
    name: Run CI on merge
    needs: prepare-merge
    uses: ./.github/workflows/ci.yml

  push-to-main:
    name: Push to main
    needs: [prepare-merge, ci]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-merge.outputs.merge_sha }}
      - name: Push to main
        shell: bash
        run: |
          git push origin ${{ needs.prepare-merge.outputs.merge_sha }}:main
          echo "Pushed to main: ${{ needs.prepare-merge.outputs.merge_sha }}"
      - name: Clean up validation branch
        if: always()
        shell: bash
        run: |
          git push origin --delete refs/heads/merge-queue/pr-${{ inputs.pr_number }} || true

  notify-fixer:
    name: Notify auto-fixer on failure
    needs: [prepare-merge, ci]
    if: failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Send webhook to Modulo fixer
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.MODULO_MERGE_FIXER_WEBHOOK_URL }}
          HMAC_SECRET: ${{ secrets.MODULO_MERGE_FIXER_HMAC_SECRET }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then echo "No webhook URL configured"; exit 0; fi
          TIMESTAMP=$(date +%s)
          BODY=$(cat <<ENDJSON
          {
            "repository": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}",
            "pr_number": ${{ inputs.pr_number }},
            "event": "merge-queue",
            "phase": "ci",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          ENDJSON
          )
          PAYLOAD="${TIMESTAMP}.${BODY}"
          HMAC=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$HMAC_SECRET" | sed 's/^.* //')
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
            -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
            -d "$BODY"
          echo "Modulo fixer notified of merge-queue failure"
