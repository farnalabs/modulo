name: Merge to Main

on:
  workflow_dispatch:

concurrency:
  group: merge-to-main
  cancel-in-progress: false

jobs:
  check-conditions:
    name: Check merge conditions
    runs-on: ubuntu-latest
    outputs:
      should_merge: ${{ steps.check.outputs.should_merge }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Count passing PRs and time since last merge
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          $prCount = 0
          $prs = gh pr list --state open --json number --jq 'length' 2>$null
          if ($prs) { $prCount = [int]$prs }
          Write-Host "Open PRs: $prCount"

          $passingCount = 0
          if ($prCount -gt 0) {
            $prUrls = gh pr list --state open --json url --jq '.[].url' 2>$null
            foreach ($url in $prUrls) {
              $checkInfo = gh pr view $url --json statusCheckRollup --jq '[.statusCheckRollup[]? | select(.conclusion == "SUCCESS" or .conclusion == "NEUTRAL")] | length' 2>$null
              $totalInfo = gh pr view $url --json statusCheckRollup --jq '.statusCheckRollup | length' 2>$null
              if ($checkInfo -and $totalInfo) {
                $checks = [int]$checkInfo
                $total = [int]$totalInfo
                if ($checks -eq $total -and $total -gt 0) { $passingCount++ }
              }
            }
          }
          Write-Host "Passing PRs: $passingCount"

          $lastMerge = git log -1 --format=%ct origin/main 2>$null
          if (-not $lastMerge) { $lastMerge = "0" }
          $now = [int][DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $hoursSince = [math]::Max(0, ($now - [int]$lastMerge) / 3600)
          Write-Host "Hours since last merge: $([math]::Round($hoursSince, 1))"

          $shouldMerge = "false"
          if ($passingCount -ge 6) {
            $shouldMerge = "true"
            Write-Host "Trigger: $passingCount passing PRs (threshold met)"
          } elseif ($passingCount -gt 0 -and $hoursSince -ge 6) {
            $shouldMerge = "true"
            Write-Host "Trigger: $passingCount passing PRs, $([math]::Round($hoursSince, 1))h since last merge (timeout met)"
          } else {
            Write-Host "Conditions not met"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "should_merge=$shouldMerge"

  do-merge:
    name: Squash-merge and test
    needs: check-conditions
    if: needs.check-conditions.outputs.should_merge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure git
        shell: bash
        run: |
          git config user.name "modulo-merge-bot"
          git config user.email "bot@modulo.run"
      - name: Squash-merge passing PRs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prs = gh pr list --state open --json number,title --jq '.[]' 2>$null
          if (-not $prs) { Write-Host "No open PRs"; exit 0 }
          $merged = 0
          $conflicts = 0
          foreach ($pr in $prs) {
            $num = $pr.number
            $title = ($pr.title -replace '[<>:"/\\|?*]', '')[0..80] -join ''
            $checks = gh pr view $num --json statusCheckRollup --jq '[.statusCheckRollup[]? | select(.conclusion == "SUCCESS" or .conclusion == "NEUTRAL")] | length' 2>$null
            $total = gh pr view $num --json statusCheckRollup --jq '.statusCheckRollup | length' 2>$null
            if ([int]$checks -ne [int]$total -or [int]$total -le 0) { continue }
            Write-Host "Merging PR #$num: $title"
            git fetch origin +refs/pull/$num/head:refs/heads/pr-$num 2>&1
            git merge --squash pr-$num 2>$null
            if ($LASTEXITCODE -eq 0) {
              git commit -m "squash! Merge PR #$num: $title"
              $merged++
            } else {
              Write-Host "Conflict in PR #$num — skipping"
              git merge --abort 2>$null
              $conflicts++
            }
          }
          Write-Host "Merged $merged PR(s), $conflicts conflict(s)"
          if ($merged -eq 0 -and $conflicts -eq 0) { throw "No passing PRs to merge" }
          if ($merged -eq 0) { throw "All PRs had conflicts — cannot merge" }
      - name: Run full test suite
        shell: bash
        run: |
          Write-Host "Starting Docker services..."
          docker compose -f docker-compose.local.yml up -d 2>&1
          Write-Host "Running backend unit tests..."
          Push-Location backend
          uv run pytest tests/unit/ -x -q --timeout=60
          if ($LASTEXITCODE -ne 0) { throw "Backend unit tests failed" }
          Pop-Location
          Write-Host "Running frontend checks..."
          Push-Location frontend
          npm ci 2>&1
          npm run type-check
          if ($LASTEXITCODE -ne 0) { throw "Frontend type check failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend build failed" }
          Pop-Location
      - name: Push to main
        if: success()
        shell: bash
        run: |
          git push origin main
          Write-Host "Pushed all changes to main"
      - name: Notify Modulo merge-fixer on failure
        if: failure()
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.MODULO_MERGE_FIXER_WEBHOOK_URL }}
          HMAC_SECRET: ${{ secrets.MODULO_MERGE_FIXER_HMAC_SECRET }}
        run: |
          if (-not $env:WEBHOOK_URL) { Write-Host "No webhook URL configured"; exit 0 }
          $body = @{
            repository = "${{ github.repository }}"
            run_id = "${{ github.run_id }}"
            run_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | ConvertTo-Json -Compress
          $ts = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $payload = "$ts.$body"
          $hmac = [System.Security.Cryptography.HMACSHA256]::new([Text.Encoding]::UTF8.GetBytes($env:HMAC_SECRET))
          $hash = $hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($payload))
          $sig = "sha256=" + ($hash | ForEach-Object { $_.ToString("x2") }) -join ''
          $headers = @{ "Content-Type" = "application/json"; "X-Modulo-Webhook-Secret" = $sig; "X-Modulo-Timestamp" = "$ts" }
          Invoke-RestMethod -Uri $env:WEBHOOK_URL -Method Post -Body $body -Headers $headers -ContentType "application/json"
          Write-Host "Modulo merge-fixer notified"
