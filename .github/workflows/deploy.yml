name: Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pipeline-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  check-context:
    name: Check CI result and context
    runs-on: ubicloud-standard-2
    outputs:
      branch: ${{ steps.context.outputs.branch }}
      is_main: ${{ steps.context.outputs.is_main }}
      ci_passed: ${{ steps.context.outputs.ci_passed }}
      head_sha: ${{ steps.context.outputs.head_sha }}
    steps:
      - name: Determine context
        id: context
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
            if [ "$CONCLUSION" = "success" ]; then
              echo "ci_passed=true" >> "$GITHUB_OUTPUT"
            else
              echo "ci_passed=false" >> "$GITHUB_OUTPUT"
            fi
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
            if [ "$BRANCH" = "main" ]; then
              echo "is_main=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_main=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ci_passed=true" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            if [ "${{ github.ref_name }}" = "main" ]; then
              echo "is_main=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_main=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  deploy-staging:
    name: Deploy to staging
    needs: [check-context]
    if: needs.check-context.outputs.ci_passed == 'true'
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-context.outputs.head_sha }}
          fetch-depth: 1

      - name: Capture git metadata
        id: git
        uses: ./.github/actions/capture-git-metadata

      - name: Deploy to staging-modulo
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          export FLYCTL_INSTALL="/home/runner/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"

          MAX_RETRIES=3
          RETRY_DELAY=10
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "--- Deploy attempt $attempt of $MAX_RETRIES ---"
            if fly deploy --app staging-modulo --config fly.staging.toml \
              --build-arg "GIT_SHA=${{ steps.git.outputs.git-sha }}" \
              --build-arg "GIT_BRANCH=${{ steps.git.outputs.git-branch }}" \
              --build-arg "GIT_COMMIT_TIMESTAMP=${{ steps.git.outputs.git-commit-timestamp }}" \
              --build-arg "GIT_COMMIT_MESSAGE=${{ steps.git.outputs.git-commit-message }}" \
              --build-arg "BUILD_TIMESTAMP=${{ steps.git.outputs.build-timestamp }}"; then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            else
              EXIT_CODE=$?
              if [ $attempt -lt $MAX_RETRIES ]; then
                DELAY=$((RETRY_DELAY * 2 ** (attempt - 1)))
                echo "Deploy failed (exit $EXIT_CODE) — retrying in ${DELAY}s..."
                sleep $DELAY
              else
                echo "Deploy failed after $MAX_RETRIES attempts"
                exit $EXIT_CODE
              fi
            fi
          done

      - name: Verify deployment
        uses: ./.github/actions/verify-deployment
        with:
          url: https://staging.modulo.run

      - name: Check deployed SHA
        shell: pwsh
        run: |
          $expectedSha = "${{ needs.check-context.outputs.head_sha }}".Substring(0, 7)
          $info = curl -s -m 10 "https://staging.modulo.run/api/v1/deployment" 2>$null
          if (-not $info) { Write-Host "No deployment info"; exit 1 }
          $deployInfo = $info | ConvertFrom-Json
          $deployedSha = if ($deployInfo.git_sha) { $deployInfo.git_sha.Substring(0, 7) } else { "?" }
          if ($deployedSha -ne $expectedSha) {
            Write-Host "SHA MISMATCH: deployed=$deployedSha expected=$expectedSha"
            exit 1
          }
          Write-Host "staging.modulo.run SHA match: $deployedSha"

  staging-e2e:
    name: Staging E2E (smoke + WCAG + regression)
    needs: [check-context, deploy-staging]
    timeout-minutes: 60
    if: needs.check-context.outputs.ci_passed == 'true'
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-context.outputs.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wait for staging health
        shell: pwsh
        timeout-minutes: 5
        run: |
          Write-Host "Waiting for staging.modulo.run ..."
          for ($i=0; $i -lt 60; $i++) {
            try {
              $r = curl -s -f "https://staging.modulo.run/healthz" 2>$null
              if ($LASTEXITCODE -eq 0) { Write-Host "Staging ready after ${i}s"; exit 0 }
            } catch {}
            Start-Sleep -Seconds 5
          }
          exit 1

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run @smoke Playwright tests against staging
        id: smoke-tests
        run: npm run test:e2e:smoke -- --reporter=line
        timeout-minutes: 10
        env:
          E2E_TARGET: staging
          E2E_NO_WEBSERVER: "true"
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_STAGING_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_STAGING_ADMIN_PASSWORD }}
        continue-on-error: true


      - name: Run WCAG audit on staging
        id: wcag-tests
        run: npx playwright test staging-wcag --output=test-results/wcag
        env:
          E2E_TARGET: staging
          E2E_NO_WEBSERVER: "true"
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_STAGING_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_STAGING_ADMIN_PASSWORD }}
        continue-on-error: true

      - name: Run @staging-regression tests against staging
        id: regression-tests
        run: npx playwright test --grep "@staging-regression" --reporter=line
        timeout-minutes: 30
        env:
          E2E_TARGET: staging
          E2E_NO_WEBSERVER: "true"
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_STAGING_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_STAGING_ADMIN_PASSWORD }}
        continue-on-error: true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: frontend/test-results/
          if-no-files-found: ignore
      - name: Fail on test failure
        if: steps.smoke-tests.outcome == 'failure' || steps.wcag-tests.outcome == 'failure' || steps.regression-tests.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "::error::One or more staging suites failed."
          exit 1

  deploy-production:
    name: Deploy to app.modulo.run
    needs: [check-context]
    if: needs.check-context.outputs.is_main == 'true' && needs.check-context.outputs.ci_passed == 'true'
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-context.outputs.head_sha }}
          fetch-depth: 1

      - name: Capture git metadata
        id: git
        uses: ./.github/actions/capture-git-metadata

      - name: Deploy to app-modulo
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          export FLYCTL_INSTALL="/home/runner/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"

          MAX_RETRIES=3
          RETRY_DELAY=10
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "--- Deploy attempt $attempt of $MAX_RETRIES ---"
            if fly deploy --app app-modulo --config fly.toml \
              --build-arg "GIT_SHA=${{ steps.git.outputs.git-sha }}" \
              --build-arg "GIT_BRANCH=${{ steps.git.outputs.git-branch }}" \
              --build-arg "GIT_COMMIT_TIMESTAMP=${{ steps.git.outputs.git-commit-timestamp }}" \
              --build-arg "GIT_COMMIT_MESSAGE=${{ steps.git.outputs.git-commit-message }}" \
              --build-arg "BUILD_TIMESTAMP=${{ steps.git.outputs.build-timestamp }}"; then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            else
              EXIT_CODE=$?
              if [ $attempt -lt $MAX_RETRIES ]; then
                DELAY=$((RETRY_DELAY * 2 ** (attempt - 1)))
                echo "Deploy failed (exit $EXIT_CODE) — retrying in ${DELAY}s..."
                sleep $DELAY
              else
                echo "Deploy failed after $MAX_RETRIES attempts"
                exit $EXIT_CODE
              fi
            fi
          done

      - name: Verify deployment
        uses: ./.github/actions/verify-deployment
        with:
          url: https://app.modulo.run

      - name: Check deployed SHA
        shell: pwsh
        run: |
          $expectedSha = "${{ needs.check-context.outputs.head_sha }}".Substring(0, 7)
          $info = curl -s -m 10 "https://app.modulo.run/api/v1/deployment" 2>$null
          if (-not $info) { Write-Host "No deployment info"; exit 1 }
          $deployInfo = $info | ConvertFrom-Json
          $deployedSha = if ($deployInfo.git_sha) { $deployInfo.git_sha.Substring(0, 7) } else { "?" }
          if ($deployedSha -ne $expectedSha) {
            Write-Host "SHA MISMATCH: deployed=$deployedSha expected=$expectedSha"
            exit 1
          }
          Write-Host "app.modulo.run SHA match: $deployedSha"
