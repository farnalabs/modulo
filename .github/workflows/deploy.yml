name: "Deploy: Staging + Prod"

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pipeline-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:

  pre-deploy-tests:
    name: Pre-deploy tests (fast + expensive)
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Fast tests (belt-and-braces re-run)
      - name: Backend lint
        working-directory: backend
        run: |
          uv sync --frozen
          uv run --no-sync ruff check .
          uv run --no-sync mypy src/modulo/
          uv run --no-sync bandit -r src/modulo/ -ll
          (cd .. && uv run --project backend --no-sync semgrep --config=.semgrep/ --baseline-commit HEAD^ --error .)
          uv run --no-sync pip-audit

      - name: Backend unit tests
        working-directory: backend
        run: uv run --no-sync pytest tests/unit/ -x -q --timeout=120 --dist worksteal
        env:
          DATABASE_URL: "postgresql+asyncpg://unused:unused@localhost/unused"

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci --force
          npm run lint -- --quiet
          npm run type-check
          npm run test:unit
          npm run build
          npm audit --audit-level=critical

      # Expensive tests
      - name: Start Postgres
        shell: bash
        run: |
          docker rm -f modulo-ci-pg 2>/dev/null || true
          docker run -d --name modulo-ci-pg \
            -e POSTGRES_USER=modulo_test \
            -e POSTGRES_PASSWORD=modulo_test \
            -e POSTGRES_DB=modulo_test \
            -p 5433:5432 \
            postgres:16-alpine
          for i in $(seq 1 60); do
            docker exec modulo-ci-pg pg_isready -U modulo_test 2>/dev/null && { echo "Postgres ready"; break; }
            sleep 2
          done

      - name: Start Redis
        shell: bash
        run: |
          docker rm -f modulo-ci-redis 2>/dev/null || true
          docker run -d --name modulo-ci-redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            docker exec modulo-ci-redis redis-cli ping 2>/dev/null && { echo "Redis ready"; break; }
            sleep 2
          done

      - name: Integration tests
        working-directory: backend
        run: uv run --no-sync pytest tests/integration/ -m integration -n 2 --cov=src/modulo --cov-report=xml --cov-fail-under=0 -q
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo_test:modulo_test@localhost:5433/modulo_test"
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Schemathesis API fuzz testing
        shell: bash
        run: uv run --no-sync pytest tests/integration/test_schemathesis.py -x --timeout=120
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo_test:modulo_test@localhost:5433/modulo_test"
          REDIS_URL: "redis://localhost:6379/0"
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Security audit
        working-directory: backend
        run: |
          uv run pip-audit
          (cd .. && uv run --project backend --no-sync semgrep --config=.semgrep/ --error .)
        env:
          SEMGREP_BASELINE_COMMIT: "HEAD^"

      - name: Stop containers
        if: always()
        shell: bash
        run: |
          docker rm -f modulo-ci-pg 2>/dev/null || true
          docker rm -f modulo-ci-redis 2>/dev/null || true

  deploy-staging:
    name: Deploy to staging
    needs: [pre-deploy-tests]
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Capture git metadata
        id: git
        uses: ./.github/actions/capture-git-metadata

      - name: Deploy to staging-modulo
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          export FLYCTL_INSTALL="/home/runner/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"

          MAX_RETRIES=3
          RETRY_DELAY=10
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "--- Deploy attempt $attempt of $MAX_RETRIES ---"
            if fly deploy --app staging-modulo --config fly.staging.toml \
              --build-arg "GIT_SHA=${{ steps.git.outputs.git-sha }}" \
              --build-arg "GIT_BRANCH=${{ steps.git.outputs.git-branch }}" \
              --build-arg "GIT_COMMIT_TIMESTAMP=${{ steps.git.outputs.git-commit-timestamp }}" \
              --build-arg "GIT_COMMIT_MESSAGE=${{ steps.git.outputs.git-commit-message }}" \
              --build-arg "BUILD_TIMESTAMP=${{ steps.git.outputs.build-timestamp }}"; then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            else
              EXIT_CODE=$?
              if [ $attempt -lt $MAX_RETRIES ]; then
                DELAY=$((RETRY_DELAY * 2 ** (attempt - 1)))
                echo "Deploy failed (exit $EXIT_CODE) -- retrying in ${DELAY}s..."
                sleep $DELAY
              else
                echo "Deploy failed after $MAX_RETRIES attempts"
                exit $EXIT_CODE
              fi
            fi
          done

      - name: Verify deployment
        uses: ./.github/actions/verify-deployment
        with:
          url: https://staging.modulo.run

      - name: Check deployed SHA
        shell: pwsh
        run: |
          $expectedSha = "main".Substring(0, 7)
          $info = curl -s -m 10 "https://staging.modulo.run/api/v1/deployment" 2>$null
          if (-not $info) { Write-Host "No deployment info"; exit 1 }
          $deployInfo = $info | ConvertFrom-Json
          $deployedSha = if ($deployInfo.git_sha) { $deployInfo.git_sha.Substring(0, 7) } else { "?" }
          if ($deployedSha -ne $expectedSha) {
            Write-Host "SHA MISMATCH: deployed=$deployedSha expected=$expectedSha"
            exit 1
          }
          Write-Host "staging.modulo.run SHA match: $deployedSha"

  staging-e2e:
    name: Staging E2E (smoke + WCAG + regression)
    needs: [deploy-staging]
    timeout-minutes: 60
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wait for staging health
        shell: pwsh
        timeout-minutes: 5
        run: |
          Write-Host "Waiting for staging.modulo.run ..."
          for ($i=0; $i -lt 60; $i++) {
            try {
              $r = curl -s -f "https://staging.modulo.run/healthz" 2>$null
              if ($LASTEXITCODE -eq 0) { Write-Host "Staging ready after ${i}s"; exit 0 }
            } catch {}
            Start-Sleep -Seconds 5
          }
          exit 1

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run @regression Playwright tests against staging
        id: regression-tests
        run: npx playwright test --grep "@regression" --reporter=line
        timeout-minutes: 60
        env:
          E2E_TARGET: staging
          E2E_NO_WEBSERVER: "true"
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_STAGING_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_STAGING_ADMIN_PASSWORD }}
        continue-on-error: true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: frontend/test-results/
          if-no-files-found: ignore
      - name: Fail on test failure
        if: steps.regression-tests.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "::error::One or more staging suites failed."
          exit 1

  deploy-production:
    name: Deploy to app.modulo.run
    needs: [staging-e2e]
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Capture git metadata
        id: git
        uses: ./.github/actions/capture-git-metadata

      - name: Deploy to app-modulo
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          export FLYCTL_INSTALL="/home/runner/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"

          MAX_RETRIES=3
          RETRY_DELAY=10
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "--- Deploy attempt $attempt of $MAX_RETRIES ---"
            if fly deploy --app app-modulo --config fly.toml \
              --build-arg "GIT_SHA=${{ steps.git.outputs.git-sha }}" \
              --build-arg "GIT_BRANCH=${{ steps.git.outputs.git-branch }}" \
              --build-arg "GIT_COMMIT_TIMESTAMP=${{ steps.git.outputs.git-commit-timestamp }}" \
              --build-arg "GIT_COMMIT_MESSAGE=${{ steps.git.outputs.git-commit-message }}" \
              --build-arg "BUILD_TIMESTAMP=${{ steps.git.outputs.build-timestamp }}"; then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            else
              EXIT_CODE=$?
              if [ $attempt -lt $MAX_RETRIES ]; then
                DELAY=$((RETRY_DELAY * 2 ** (attempt - 1)))
                echo "Deploy failed (exit $EXIT_CODE) -- retrying in ${DELAY}s..."
                sleep $DELAY
              else
                echo "Deploy failed after $MAX_RETRIES attempts"
                exit $EXIT_CODE
              fi
            fi
          done

      - name: Verify deployment
        uses: ./.github/actions/verify-deployment
        with:
          url: https://app.modulo.run

      - name: Check deployed SHA
        shell: pwsh
        run: |
          $expectedSha = "main".Substring(0, 7)
          $info = curl -s -m 10 "https://app.modulo.run/api/v1/deployment" 2>$null
          if (-not $info) { Write-Host "No deployment info"; exit 1 }
          $deployInfo = $info | ConvertFrom-Json
          $deployedSha = if ($deployInfo.git_sha) { $deployInfo.git_sha.Substring(0, 7) } else { "?" }
          if ($deployedSha -ne $expectedSha) {
            Write-Host "SHA MISMATCH: deployed=$deployedSha expected=$expectedSha"
            exit 1
          }
          Write-Host "app.modulo.run SHA match: $deployedSha"
  prod-smoke:
    name: Prod smoke tests
    needs: [deploy-production]
    if: always() && needs.deploy-production.result == 'success'
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run @smoke Playwright tests against app.modulo.run
        run: npm run test:e2e:smoke -- --reporter=line
        timeout-minutes: 10
        env:
          E2E_TARGET: app
          E2E_NO_WEBSERVER: "true"
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_STAGING_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_STAGING_ADMIN_PASSWORD }}
        continue-on-error: true

      - name: Fail on smoke test failure
        if: steps.smoke-tests.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "::error::Smoke tests against production failed."
          exit 1
