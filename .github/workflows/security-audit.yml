name: Security Audit

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - name: pip-audit (backend)
        working-directory: backend
        run: uv run pip-audit
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep (block new findings)
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            baseline="origin/$GITHUB_BASE_REF"
          else
            baseline="HEAD^"
          fi
          uv --directory backend run --no-sync semgrep --config=.semgrep/ --baseline-commit "$baseline" --error .

  container-scan:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build ./backend -t modulo-backend:${{ github.sha }}

      - name: Build frontend image
        run: docker build ./frontend -t modulo-frontend:${{ github.sha }}

      - name: Scan backend with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: modulo-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH

      - name: Scan frontend with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: modulo-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH

      - name: Upload backend SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: backend

      - name: Upload frontend SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: frontend
