name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modulo_test
          POSTGRES_PASSWORD: modulo_test
          POSTGRES_DB: modulo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.4"
      - name: Install backend deps
        working-directory: backend
        run: uv pip install -e ".[dev]"
      - name: Run integration tests
        working-directory: backend
        run: |
          pytest tests/integration/ \
            -m integration \

            --cov=src/modulo \
            --cov-report=xml \
            --cov-fail-under=0 \
            -q
        env:
          SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
          FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="
          DATABASE_URL: "postgresql+asyncpg://modulo_test:modulo_test@localhost:5433/modulo_test"
          TESTCONTAINERS_RYUK_DISABLED: "true"
