# Break-glass daily status sweep (break-glass admin recovery plan §3, "(A)
# alerting = ... + the daily modulo-break-glass status --all operator sweep").
#
# A scheduled workflow that connects as modulo_breakglass with secrets from the
# vault, runs `modulo-break-glass status --all --json` inside a Fly machine
# (which has native access to the DB via the flycast private network), and
# wires the non-zero-exit-on-live-rows condition to an alert.
#
# FAILURE SEMANTICS: the sweep fails loudly (non-zero exit) when any live
# break-glass row exists. It NEVER auto-fixes — a live row is a deliberate
# operator action (TTL-bound credential); the alert is the point.
#
# SECRETS TO PROVISION (GitHub Actions secrets on this repo):
#   MODULO_BREAK_GLASS_DATABASE_URL   — asyncpg URL for the modulo_breakglass role
#   MODULO_BREAK_GLASS_SECRET         — primary operator secret (>= 24 chars)
#   MODULO_BREAK_GLASS_STANDBY_SECRET — rotation standby secret
#   MODULO_BREAK_GLASS_OPERATOR_SECRET — value equal to the primary (or standby)
#   FLY_API_TOKEN                     — Fly.io deploy token (for fly ssh console)
# No real secret values live in this file.

name: "Break-glass daily status sweep"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: break-glass-daily-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: modulo-break-glass status --all sweep
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - name: Run daily break-glass status sweep (inside Fly machine)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          MODULO_BREAK_GLASS_SECRET: ${{ secrets.MODULO_BREAK_GLASS_SECRET }}
          MODULO_BREAK_GLASS_STANDBY_SECRET: ${{ secrets.MODULO_BREAK_GLASS_STANDBY_SECRET }}
          MODULO_BREAK_GLASS_OPERATOR_SECRET: ${{ secrets.MODULO_BREAK_GLASS_OPERATOR_SECRET }}
          MODULO_BREAK_GLASS_DATABASE_URL: ${{ secrets.MODULO_BREAK_GLASS_DATABASE_URL }}
        run: |
          set -e
          echo "Running sweep inside Fly machine..."
          # Run the CLI inside a Fly machine (has native flycast DB access)
          OUTPUT=$(fly ssh console -a app-modulo --command "
            export MODULO_BREAK_GLASS_DATABASE_URL='$MODULO_BREAK_GLASS_DATABASE_URL'
            export MODULO_BREAK_GLASS_SECRET='$MODULO_BREAK_GLASS_SECRET'
            export MODULO_BREAK_GLASS_STANDBY_SECRET='$MODULO_BREAK_GLASS_STANDBY_SECRET'
            export MODULO_BREAK_GLASS_OPERATOR_SECRET='$MODULO_BREAK_GLASS_OPERATOR_SECRET'
            cd /app && python3 -m modulo.cli.break_glass status --all --json --secret \"\$MODULO_BREAK_GLASS_OPERATOR_SECRET\"
          " 2>&1) || true
          echo "$OUTPUT"
          # Check for PreconditionError (exit 5) — either live rows or auth failure
          if echo "$OUTPUT" | grep -q "PreconditionError"; then
            # Try to parse JSON output — if present, it's live rows; if not, auth failure
            if echo "$OUTPUT" | python3 -c "
            import sys, json
            data = sys.stdin.read()
            for line in data.split(chr(10)):
                line = line.strip()
                if line.startswith('[') or line.startswith('{'):
                    try:
                        rows = json.loads(line)
                        if isinstance(rows, list) and len(rows) > 0:
                            sys.exit(0)
                        break
                    except:
                        continue
            sys.exit(1)
            "; then
              echo "::error::LIVE BREAK-GLASS ROWS: $(echo "$OUTPUT" | python3 -c "import sys,json; [print(r.get('org_id',''),r.get('account_id',''),r.get('state','')) for r in (json.loads(next(l for l in sys.stdin.read().split(chr(10)) if l.strip().startswith('['))) or []) if r.get('state')=='live']")"
              exit 5
            else
              echo "::error::OPERATOR AUTH FAILURE — MODULO_BREAK_GLASS_OPERATOR_SECRET may be misprovisioned or rotated"
              exit 1
            fi
          fi
          echo "Sweep CLEAN — no live break-glass rows"
          exit 0

      - name: Upload sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: break-glass-daily-sweep
          path: .github/workflows/break-glass-daily-sweep.yml  # placeholder; real evidence lives on the Fly machine
          if-no-files-found: warn
          retention-days: 90
