name: Mutation Testing (Frontend)

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      mutate:
        description: 'Files to mutate (comma-separated globs)'
        required: false
        default: 'src/stores/**/*.ts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-frontend:
    name: Mutation (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run mutation tests
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'frontend/src/' | grep -E '\.(ts|vue)$' | sed 's|^frontend/||' | paste -sd ',' | sed 's/,/, /g')
            if [ -z "$CHANGED" ]; then
              echo "No frontend source files changed — skipping mutation tests"
              exit 0
            fi
            echo "Mutating files: $CHANGED"
            npx stryker run --mutate "$CHANGED"
          else
            npx stryker run --mutate "${{ github.event.inputs.mutate || 'src/stores/**/*.ts' }}"
          fi
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-frontend
          path: frontend/reports/mutation/
      - name: Show mutation score
        if: always()
        shell: bash
        run: |
          if [ -f reports/mutation/mutation-report.json ]; then
            SCORE=$(cat reports/mutation/mutation-report.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('mutationScore', 'N/A'))" 2>/dev/null || echo "N/A")
            echo "Mutation score: $SCORE%"
          fi
