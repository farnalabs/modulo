name: "CI: Tier 1b Nightly (heavy)"
on:
  schedule:
    # Nightly at 03:07 UTC (offset from other nightlies to avoid runner pileup).
  - cron: "7 3 * * *"
  workflow_dispatch:
env:
  TESTCONTAINERS_RYUK_DISABLED: "true"

permissions:
  contents: read
jobs:
  tier1b-nightly:
    name: "Tier 1b testcontainers (heavy: gitlab, vllm, tgi)"
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Free up disk space
        # Heavy Tier 1b images (gitlab CE, vllm, tgi) are multi-GB; the runner's
        # local disk is the binding constraint. Remove preinstalled toolchains
        # the suite never uses. Fail-open: a missing path or absent
        # passwordless sudo is not an error.
      shell: bash
      run: |
        echo "disk before:"; df -h / || true
        for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                    /usr/local/share/boost /usr/local/share/powershell; do
          if [ -d "$path" ]; then
            echo "removing $path"; sudo -n rm -rf "$path" || true
          fi
        done
        sudo -n apt-get clean || true
        echo "disk after:"; df -h / || true
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        python-version: "3.12"
        enable-cache: true
      # NOSONAR githubactions:S8541: pytest-bdd is a pinned source-archive dep (no
      # wheel) and ibm-cos-sdk is sdist-only, so `--no-build` hard-fails the sync on
      # a cold uv cache. `--frozen` locks the exact revisions, so the builds are
      # deterministic and trusted (no untrusted setup scripts execute).
    - run: uv sync --frozen    # NOSONAR
    - name: Run Tier 1b heavy connector + model-server suites
      run: |
        uv run --no-build --no-sync pytest \
          tests/integration/test_tier1b_connectors_heavy.py \
          tests/integration/test_tier1b_models_heavy.py \
          -q --tb=short --timeout=3600 -p no:warnings
