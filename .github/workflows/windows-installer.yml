name: "Windows: Build Installer (Inno Setup)"

# FAR-2338: the release build consumes the separately produced native Windows
# payload, restages it with the release version marker, compiles the Inno Setup
# installer, and signs the installer with Azure Trusted Signing. Dry-run still
# validates the installer contract without downloading or publishing a payload.
#
# FAR-2315: the compile-check and redaction-unit jobs are the real gates for
# deploy/windows/modulo.iss. They run on every release invocation AND on pull
# requests that touch the installer, so a Pascal script that cannot compile, or
# a Redact() that does not redact, cannot merge.

on:
  workflow_call:
    inputs:
      version:
        description: "Release version in X.Y.Z form"
        type: string
        required: true
      rc_tag:
        description: "RC tag being released"
        type: string
        required: true
      ref:
        description: "Git ref to validate"
        type: string
        required: true
      mode:
        description: "Build mode: dry-run, cut, recut, promote"
        type: string
        default: dry-run
  pull_request:
    paths:
      - 'deploy/windows/**'
      - 'scripts/create-windows-launcher.ps1'
      - 'scripts/windows/build-launcher.ps1'
      - 'scripts/test-windows-installer.ps1'
      - '.github/workflows/windows-installer.yml'

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

permissions:
  contents: read

jobs:
  compile-check:
    name: Compile installer (Inno Setup)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Install Inno Setup (preinstalled, choco fallback)
        run: |
          $ErrorActionPreference = 'Stop'

          # FAR-2331: the windows-latest image already ships Inno Setup (6.7.1 at
          # the time of writing). Chocolatey refuses to replace a newer install with
          # an older pin, so use the preinstalled ISCC.exe when it exists and only
          # fall back to a Chocolatey install when it is missing.
          function Find-Iscc {
            $found = Get-Command -Name 'ISCC.exe' -ErrorAction SilentlyContinue
            if ($found) {
              return $found.Source
            }
            foreach ($programFiles in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
              if ($programFiles) {
                $candidate = Join-Path $programFiles 'Inno Setup 6\ISCC.exe'
                if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                  return $candidate
                }
              }
            }
            return $null
          }

          $isccPath = Find-Iscc
          if ($isccPath) {
            Write-Host "Using preinstalled Inno Setup: $isccPath"
          } else {
            Write-Host 'Inno Setup is not preinstalled; installing it with Chocolatey.'
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "choco install innosetup exited $LASTEXITCODE"
            }
            $isccPath = Find-Iscc
          }
          if (-not $isccPath) {
            throw 'ISCC.exe is not available: it is not on PATH or under Program Files\Inno Setup 6, and the Chocolatey install did not provide it.'
          }

          $versionInfo = (Get-Item -LiteralPath $isccPath).VersionInfo
          Write-Host "ISCC: $isccPath (product version: $($versionInfo.ProductVersion), file version: $($versionInfo.FileVersion))"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $isccPath)
      - name: Compile the installer and run the contract tests
        run: |
          $ErrorActionPreference = 'Stop'
          # -RequireIscc: this job owns the compilation proof, so a missing
          # ISCC must fail the job instead of silently skipping it. The
          # script prints ISCC's own output on a non-zero exit and writes it to
          # iscc-<case>.log, which the next step uploads as the diagnosis trail.
          ./scripts/test-windows-installer.ps1 -RequireIscc
      - name: Upload ISCC compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iscc-output
          path: iscc-*.log
          if-no-files-found: ignore

  redaction-unit:
    name: Redaction unit test (Free Pascal)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler
      - name: Compile and execute the extracted Redact() fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          # -RequireFpc: this job owns the fpc proofs (Redact() behaviour and
          # the [Code] stub compile), so a missing compiler must fail the job.
          ./scripts/test-windows-installer.ps1 -RequireFpc

  version-parity:
    name: Assert bundle versions match
    if: ${{ github.event_name == 'workflow_call' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Validate shared bundle pins
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'scripts/bundle-versions.env')) {
            throw 'scripts/bundle-versions.env is missing'
          }
          Write-Host 'bundle-versions.env loaded; no native Windows pins are currently available.'

  build:
    name: Build Windows installer
    if: ${{ github.event_name == 'workflow_call' }}
    needs: [version-parity, compile-check]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION_NUM: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Inno Setup
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Iscc {
            $found = Get-Command -Name 'ISCC.exe' -ErrorAction SilentlyContinue
            if ($found) { return $found.Source }
            foreach ($programFiles in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
              if ($programFiles) {
                $candidate = Join-Path $programFiles 'Inno Setup 6\ISCC.exe'
                if (Test-Path -LiteralPath $candidate -PathType Leaf) { return $candidate }
              }
            }
            return $null
          }
          $isccPath = Find-Iscc
          if (-not $isccPath) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup exited $LASTEXITCODE" }
            $isccPath = Find-Iscc
          }
          if (-not $isccPath) { throw 'ISCC.exe is unavailable' }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $isccPath)
      - name: Dry-run contract summary
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/test-windows-installer.ps1 -RequireIscc
          @'
          ## Windows installer dry-run

          Installer contract compiled successfully. Native release payload download, signing, attestation, and publication were skipped.
          '@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Download native Windows payload
        if: ${{ inputs.mode != 'dry-run' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-native-artifacts
          path: ${{ runner.temp }}\windows-native-artifacts
      - name: Stage native Windows payload
        if: ${{ inputs.mode != 'dry-run' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'windows-native-artifacts\windows-native-artifacts.zip'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'windows-native-artifacts.zip is missing' }
          $payload = Join-Path $env:RUNNER_TEMP 'windows-native-payload'
          if (Test-Path -LiteralPath $payload) { Remove-Item -LiteralPath $payload -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $payload -Force
          $stageScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/windows/build-launcher.ps1'
          . $stageScript
          $staged = Join-Path $env:RUNNER_TEMP 'windows-bundle-staged'
          Invoke-WindowsBundleStaging -StagePath $staged -PythonRoot (Join-Path $payload 'runtime/python') -BackendSource (Join-Path $payload 'backend/src') -SitePackagesSource (Join-Path $payload 'runtime/python/Lib/site-packages') -FrontendDistSource (Join-Path $payload 'frontend-dist') -LauncherPath (Join-Path $payload 'bin/modulo.exe') -Version $env:VERSION_NUM
          Copy-Item -LiteralPath (Join-Path $payload 'pg') -Destination $staged -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $payload 'redis') -Destination $staged -Recurse -Force
          if (-not (Test-Path -LiteralPath (Join-Path $staged 'modulo-runtime.json') -PathType Leaf)) { throw 'staged runtime marker is missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $staged 'bin/modulo.exe') -PathType Leaf)) { throw 'staged native launcher is missing' }
          "BUNDLE_DIR=$staged" | Add-Content -Path $env:GITHUB_ENV
      - name: Compile Windows installer
        if: ${{ inputs.mode != 'dry-run' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'native-installer'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & ISCC "/DVERSION_NUM=$env:VERSION_NUM" '/DBUNDLE_ARCH=amd64' "/DBUNDLE_DIR=$env:BUNDLE_DIR" "/O$output" 'deploy/windows/modulo.iss'
          if ($LASTEXITCODE -ne 0) { throw "installer compilation exited $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $output "modulo-$env:VERSION_NUM-windows-amd64.exe") -PathType Leaf)) {
            throw 'compiled Windows installer is missing'
          }
      - name: Upload unsigned Windows installer
        if: ${{ inputs.mode != 'dry-run' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer-unsigned-${{ inputs.version }}
          path: ${{ runner.temp }}\native-installer
          if-no-files-found: error
          retention-days: 30

  sign:
    name: Sign Windows installer (Azure Trusted Signing)
    needs: [build, compile-check]
    if: ${{ github.event_name == 'workflow_call' && inputs.mode != 'dry-run' && needs.build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download unsigned Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer-unsigned-${{ inputs.version }}
          path: ${{ runner.temp }}\native-installer
      - name: Log in to Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign with Azure Trusted Signing
        uses: Azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: farnasigning
          certificate-profile-name: farna-public-trust
          files-folder: ${{ runner.temp }}\\native-installer
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Upload signed Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer-signed-${{ inputs.version }}
          path: ${{ runner.temp }}\native-installer
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest Windows installer
    needs: [build, sign]
    if: ${{ github.event_name == 'workflow_call' && inputs.mode != 'dry-run' && needs.build.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download signed Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer-signed-${{ inputs.version }}
          path: release-artefacts
      - name: Verify the signed installer is present
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          installer="release-artefacts/modulo-${VERSION}-windows-amd64.exe"
          test -s "$installer"
          sha256sum "$installer"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release-artefacts/modulo-*-windows-amd64.exe
      - name: Upload attested Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer-${{ inputs.version }}
          path: release-artefacts/modulo-*-windows-amd64.exe
          if-no-files-found: error
          retention-days: 30
