name: "Windows: Build Installer (Inno Setup)"

# FAR-2231: build only from provisioned native inputs. No placeholder runtime,
# launcher, manifest, signature, or installer artifact is ever manufactured.

on:
  workflow_call:
    inputs:
      version:
        description: "Release version in X.Y.Z form"
        type: string
        required: true
      rc_tag:
        description: "RC tag being released"
        type: string
        required: true
      ref:
        description: "Git ref to validate"
        type: string
        required: true
      mode:
        description: "Build mode: dry-run, cut, recut, promote"
        type: string
        default: dry-run

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

permissions:
  contents: read

jobs:
  build:
    name: Build native Windows bundle and installer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION_NUM: ${{ inputs.version }}
      MODE: ${{ inputs.mode }}
      INPUT_ROOT: ${{ vars.WINDOWS_BUNDLE_INPUT_ROOT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Dry-run summary
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          @'
          ## Windows installer dry-run

          Dry-run performs no build and uploads no artifact. A real run requires provisioned native launcher, Windows CPython, PostgreSQL, Redis, support binaries, frontend distribution, backend environment, and signed release-manifest inputs.
          '@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Verify provisioned native inputs
        if: ${{ inputs.mode != 'dry-run' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:INPUT_ROOT)) { throw 'WINDOWS_BUNDLE_INPUT_ROOT is not provisioned.' }
          $required = @('launcher', 'runtime', 'pg', 'redis', 'bin', 'frontend-dist', 'backend\.venv', 'RELEASE_MANIFEST.json', 'RELEASE_MANIFEST.json.sig')
          foreach ($relative in $required) {
            $path = Join-Path $env:INPUT_ROOT $relative
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing provisioned Windows bundle input: $path" }
          }
      - name: Build native Windows bundle
        if: ${{ inputs.mode != 'dry-run' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:INPUT_ROOT
          & "$env:GITHUB_WORKSPACE/scripts/build-windows-bundle.ps1" -Version $env:VERSION_NUM `
            -LauncherPath (Join-Path $root 'launcher') `
            -RuntimeDirectory (Join-Path $root 'runtime') `
            -PostgresDirectory (Join-Path $root 'pg') `
            -RedisDirectory (Join-Path $root 'redis') `
            -BinDirectory (Join-Path $root 'bin') `
            -FrontendDistDirectory (Join-Path $root 'frontend-dist') `
            -BackendVenvDirectory (Join-Path $root 'backend\.venv') `
            -ReleaseManifestPath (Join-Path $root 'RELEASE_MANIFEST.json') `
            -ReleaseManifestSignaturePath (Join-Path $root 'RELEASE_MANIFEST.json.sig')
      - name: Install Inno Setup and compile final installer
        if: ${{ inputs.mode != 'dry-run' }}
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --version=6.2.2 --yes --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "ISCC.exe missing: $iscc" }
          & $iscc '/Qp' "/O$env:GITHUB_WORKSPACE/build/windows" "/Fmodulo-$env:VERSION_NUM-windows-amd64" "/DVERSION_NUM=$env:VERSION_NUM" '/DBUNDLE_ARCH=amd64' "/DBUNDLE_DIR=$env:GITHUB_WORKSPACE/build/windows-bundle" 'deploy/windows/modulo.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          $installer = Join-Path $env:GITHUB_WORKSPACE "build/windows/modulo-$env:VERSION_NUM-windows-amd64.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Final installer missing: $installer" }
      - name: Upload final Windows installer artifact
        if: ${{ inputs.mode != 'dry-run' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ inputs.version }}
          path: build/windows/modulo-${{ inputs.version }}-windows-amd64.exe
          if-no-files-found: error
          retention-days: 30

  sign:
    name: Sign Windows installer (Azure Trusted Signing)
    needs: build
    if: ${{ inputs.mode != 'dry-run' && needs.build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse until signing credentials are provisioned
        run: throw 'Azure Trusted Signing is not provisioned; refusing to claim a signed Windows installer.'

  attest:
    name: Attest Windows installer
    needs: [build, sign]
    if: ${{ inputs.mode != 'dry-run' && needs.build.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          echo '::error::Windows attestation is blocked until the real signed installer artifact is available.'
          exit 1

  publish:
    name: Publish Windows installer
    needs: [build, attest]
    if: ${{ inputs.mode == 'promote' && needs.build.result == 'success' && needs.attest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          echo '::error::Windows publication is blocked until native build, signing, and attestation artifacts exist.'
          exit 1
