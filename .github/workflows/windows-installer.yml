name: "Windows: Build Installer (Inno Setup)"

# FAR-679 / FAR-2231: Windows publication is fail-closed until the native
# bundle inputs and FAR-2229 launcher contract are provisioned. No placeholder
# executable, operator-supplied service directory, or relabeled Linux bundle.

on:
  workflow_call:
    inputs:
      version:
        description: "Release version in X.Y.Z form"
        type: string
        required: true
      rc_tag:
        description: "RC tag being released"
        type: string
        required: true
      ref:
        description: "Git ref to validate"
        type: string
        required: true
      mode:
        description: "Build mode: dry-run, cut, recut, promote"
        type: string
        default: dry-run

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

permissions:
  contents: read

jobs:
  build:
    name: Build native Windows bundle and installer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION_NUM: ${{ inputs.version }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Validate native bundle prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE/scripts/build-windows-bundle.ps1" -Version $env:VERSION_NUM -ValidateOnly
      - name: Build native Windows bundle
        if: ${{ inputs.mode != 'dry-run' }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE/scripts/build-windows-bundle.ps1" -Version $env:VERSION_NUM
      - name: Install Inno Setup
        if: ${{ inputs.mode != 'dry-run' }}
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --version=6.2.2 --yes --no-progress
          $isccDir = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'
          if (-not (Test-Path -LiteralPath (Join-Path $isccDir 'ISCC.exe'))) { throw "ISCC.exe missing under $isccDir" }
          & (Join-Path $isccDir 'ISCC.exe') "/Qp" "/DVERSION_NUM=$env:VERSION_NUM" '/DBUNDLE_ARCH=amd64' "/DBUNDLE_DIR=$env:GITHUB_WORKSPACE/build/windows-bundle" 'deploy/windows/modulo.iss'
      - name: Dry-run summary
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          @'
          ## Windows installer dry-run

          The real native bundle prerequisite check was executed. Missing pinned Windows inputs, Redis provenance, or the FAR-2229 launcher seam fail this job; no placeholder artefact is manufactured.
          '@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

  sign:
    name: Sign Windows installer (Azure Trusted Signing)
    needs: build
    if: ${{ inputs.mode != 'dry-run' && needs.build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse until installer artefact is wired
        run: throw 'Signing handoff is intentionally blocked until the native bundle build and artifact upload are provisioned.'

  attest:
    name: Attest Windows installer
    needs: [build, sign]
    if: ${{ inputs.mode != 'dry-run' && needs.build.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          echo '::error::Windows attestation is blocked until a real signed native installer artifact is available.'
          exit 1

  publish:
    name: Publish Windows installer
    needs: [build, attest]
    if: ${{ inputs.mode == 'promote' && needs.build.result == 'success' && needs.attest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          echo '::error::Windows publication is blocked until native build, signing, and attestation artifacts exist.'
          exit 1
