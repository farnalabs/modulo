name: "Deploy staleness check (prod vs main)"

# FAR-528 defense-in-depth: the deploy workflow's throttle step can (and did)
# skip every run while concluding SUCCESS -- production starved for 2 days on
# the Aug 30 build while five deploy runs showed green. This cron compares the
# PRODUCTION app's build SHA against origin/main HEAD and fails loudly when
# prod has not caught up within the grace window.
#
# The age is computed from production's BUILD_TIMESTAMP (the Docker build arg
# injected by deploy.yml), NOT from origin/main HEAD's commit date. On an
# active repo main HEAD is always minutes-to-hours old, so measuring staleness
# from main's commit date produces an age that never exceeds the grace window
# (FAR-910: the original condition was unreachable in practice).
#
# Division of labour: deploy-watchdog.yml (*/30) is the fly-level SELF-HEAL --
# it compares the fly image tag vs main HEAD and re-dispatches deploy.yml to
# heal WITHIN this check's grace window. If this check's ::error:: fires,
# the watchdog failed to heal -- investigate the watchdog, not this check.
#
# FAR-910: escalation path -- on failure, a Linear ticket is auto-created with
# the staleness detail (prod SHA, main HEAD, hours stale) so the signal
# reaches the ready queue, not just the Actions tab. The warning branches
# (unreachable endpoint, missing SHA) remain warn-only for transient failures;
# persistent blindness is covered by the uptime-monitor (FAR-400) and the
# deploy-watchdog's own escalation (3 consecutive failures).

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-prod-staleness:
    name: Prod build SHA vs origin/main HEAD
    runs-on: ubicloud-standard-2
    steps:
      - name: Compare prod build SHA against origin/main HEAD
        id: staleness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Grace window: how long production is allowed to lag behind main
          # HEAD before starvation is declared. Covers the deploy throttle
          # (DEPLOY_INTERVAL_HOURS, default 3h) + pre-deploy CI + staging
          # E2E (~2h) + retry headroom. Default 6h; overridable via the
          # STALENESS_GRACE_HOURS repo variable.
          GRACE_HOURS: ${{ vars.STALENESS_GRACE_HOURS || 6 }}
        run: |
          # ---- 1. main HEAD (for comparison + diagnostics) ----
          MAIN_JSON="$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq '{sha: .sha, date: .commit.committer.date}' 2>/dev/null || true)"
          if [ -z "$MAIN_JSON" ]; then
            echo "::warning::Deploy staleness check could not read origin/${{ github.ref_name }} HEAD (gh api error) - cannot determine staleness this cycle. Transient failures are warned, not failed; repeated warnings on consecutive runs still deserve investigation."
            exit 0
          fi
          MAIN_SHA="$(echo "$MAIN_JSON" | jq -r .sha)"
          MAIN_DATE="$(echo "$MAIN_JSON" | jq -r .date)"

          # ---- 2. Prod metadata: SHA + build timestamp ----
          PROD_JSON="$(curl -fsS -m 15 "https://app.modulo.run/api/v1/deployment" 2>/dev/null || true)"
          PROD_SHA="$(echo "$PROD_JSON" | jq -r '.git_sha // empty' 2>/dev/null || true)"
          if [ -z "$PROD_SHA" ]; then
            echo "::warning::Deploy staleness check could not read the production build SHA from https://app.modula.run/api/v1/deployment (unreachable, or the build metadata env vars are missing) - cannot determine staleness this cycle."
            exit 0
          fi
          PROD_BUILD_TS="$(echo "$PROD_JSON" | jq -r '.build_timestamp // empty' 2>/dev/null || true)"

          MAIN_SHORT="${MAIN_SHA:0:7}"
          PROD_SHORT="${PROD_SHA:0:7}"
          echo "origin/${{ github.ref_name }} HEAD: $MAIN_SHORT ($MAIN_DATE)"
          echo "app.modulo.run build SHA: $PROD_SHORT (${PROD_BUILD_TS:-unknown})"

          # ---- 3. Fast path: prod is current ----
          if [ "$MAIN_SHORT" = "$PROD_SHORT" ]; then
            echo "::notice::Production is current with origin/${{ github.ref_name }} ($PROD_SHORT)."
            exit 0
          fi

          # ---- 4. Compute staleness from production's build timestamp ----
          # The age measures "how long has production been serving a commit
          # that is NOT main HEAD?" -- computed from prod's BUILD_TIMESTAMP,
          # not from main HEAD's commit date. On an active repo main HEAD is
          # always fresh, so the old metric (NOW - MAIN_DATE) never exceeded
          # the grace window (FAR-910 root cause).
          if [ -n "$PROD_BUILD_TS" ]; then
            PROD_BUILD_SEC=$(date -u -d "$PROD_BUILD_TS" +%s 2>/dev/null || echo "0")
          else
            PROD_BUILD_SEC=0
          fi
          NOW_TS=$(date -u +%s)

          if [ "$PROD_BUILD_SEC" -gt 0 ]; then
            AGE_H=$(( (NOW_TS - PROD_BUILD_SEC) / 3600 ))
          else
            # build_timestamp unavailable or unparseable -- fail loud rather
            # than silently skip: prod is behind main and we cannot determine
            # how far behind.
            AGE_H=-1
          fi

          # Diagnostic outputs (also used by the Linear ticket step)
          echo "head_age_hours=${AGE_H}" >> "$GITHUB_OUTPUT"
          echo "main_sha=${MAIN_SHORT}" >> "$GITHUB_OUTPUT"
          echo "prod_sha=${PROD_SHORT}" >> "$GITHUB_OUTPUT"
          echo "grace_hours=${GRACE_HOURS}"
          echo "prod_build_ts=${PROD_BUILD_TS:-unknown}"

          if [ "$AGE_H" -lt 0 ]; then
            echo "::error::PRODUCTION DEPLOY STARVATION: app.modulo.run is running $PROD_SHORT (behind main $MAIN_SHORT) but the build timestamp is missing or unparseable from /api/v1/deployment - cannot confirm staleness age. Treat as starvation: investigate the deploy pipeline."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$AGE_H" -ge "$GRACE_HOURS" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::error::PRODUCTION DEPLOY STARVATION: app.modulo.run is running $PROD_SHORT, built ${AGE_H}h ago (>= ${GRACE_HOURS}h grace), but origin/${{ github.ref_name }} HEAD is $MAIN_SHORT. The deploy pipeline has not released main's HEAD - check the 'Deploy: Staging + Prod' workflow runs and the throttle step. If no deploy is in flight, use workflow_dispatch with force_deploy=true."
            exit 1
          fi

          echo "::notice::Production ($PROD_SHORT, built ${AGE_H}h ago) is behind origin/${{ github.ref_name }} HEAD ($MAIN_SHORT) but within the ${GRACE_HOURS}h grace window - the deploy pipeline may still be in flight (throttle batches up to DEPLOY_INTERVAL_HOURS)."

      - name: Create Linear ticket on starvation
        if: failure()
        shell: bash
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "LINEAR_API_KEY not set - skipping ticket (workflow failure still alerts via GitHub)."
            exit 0
          fi
          HEAD_AGE="${{ steps.staleness.outputs.head_age_hours }}"
          MAIN_SHA="${{ steps.staleness.outputs.main_sha }}"
          PROD_SHA="${{ steps.staleness.outputs.prod_sha }}"
          GRACE="${{ steps.staleness.outputs.grace_hours }}"
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          TITLE="DEPLOY STARVATION: prod stale ${HEAD_AGE}h (FAR-910)"
          DESC="Production deploy starvation detected at ${TS}.\nProd SHA: ${PROD_SHA:-unknown}\nMain HEAD: ${MAIN_SHA:-unknown}\nHours stale: ${HEAD_AGE:-unknown}h\nGrace window: ${GRACE:-6}h\nThe deploy pipeline has not released main's HEAD within the grace window.\nIf no deploy is in flight, force one: gh workflow run 'Deploy: Staging + Prod' --ref main -f force_deploy=true\nThis is FAR-910 -- deploy staleness + watchdog checks must escalate, not annotate green runs."

          BODY=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$(echo -e "$DESC")" \
            '{
              query: "mutation($i: IssueCreateInput!){ issueCreate(input:$i){ success issue { identifier url } } }",
              variables: { i: {
                teamId: "ae855baf-6439-4980-97fb-38da80129485",
                title: $title,
                description: $desc,
                priority: 1
              } }
            }')
          RESULT=$(curl -sS -f --max-time 20 -X POST "https://api.linear.app/graphql" \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d "$BODY" 2>&1) || true
          if echo "$RESULT" | grep -q '"success":true'; then
            TICKET_ID=$(echo "$RESULT" | jq -r '.data.issueCreate.issue.identifier // "unknown"')
            echo "Created Linear ticket: $TICKET_ID"
          else
            echo "::warning::Failed to create Linear ticket: $RESULT"
          fi
