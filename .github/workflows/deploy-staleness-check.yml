name: "Deploy staleness check (prod vs main)"

# FAR-528 defense-in-depth: the deploy workflow's throttle step can (and did)
# skip every run while concluding SUCCESS -- production starved for 2 days on
# the Aug 30 build while five deploy runs showed green. This cron compares the
# PRODUCTION app's build SHA against origin/main HEAD and fails loudly when
# prod has not caught up within the grace window.
#
# The age is computed from production's BUILD_TIMESTAMP (the Docker build arg
# injected by deploy.yml), NOT from origin/main HEAD's commit date. On an
# active repo main HEAD is always minutes-to-hours old, so measuring staleness
# from main's commit date produces an age that never exceeds the grace window
# (FAR-910: the original condition was unreachable in practice).
#
# FAR-2116 (the detection gap this adds): the check above was CORRECT and it
# DID fire throughout the 2026-10-23..25 outage (prod 46h stale, ::error::
# every run) -- but its only escalation was a Linear ticket, and FAR-1407's
# "dedupe on the condition" append sent every one of those escalations as a
# comment on a single ticket opened on 2026-10-02 (FAR-1404) that had sat in
# Backlog for three weeks. A red run in the Actions tab plus a comment on a
# month-old backlog ticket reached nobody. Two things change here:
#
#   1. A human channel: on a health TRANSITION (healthy -> unhealthy, and
#      unhealthy -> healthy) the operator is emailed through the same Zoho
#      SMTP secrets issue-notify.yml already uses. The email names the deploy
#      workflow, the consecutive-failure count, prod's build age and the main
#      HEAD it is behind -- actionable without opening anything.
#   2. A second condition: N consecutive FAILED deploy runs (default 2), not
#      only "prod is stale". During the outage production lagged by hours, so
#      the existing condition covered it -- but a deploy can fail repeatedly
#      while prod is still inside the grace window, and that must alert too.
#
# The transition (not every-tick) email is derived from THIS workflow's own
# run history: the previous completed run's health step conclusion is the
# durable state vector, so no new state store is introduced. An unreadable or
# missing previous verdict is treated as UNKNOWN and emails the current state
# (fail loud, never silently suppress the first alert after this change).
#
# Division of labour: deploy-watchdog.yml (*/30) is the fly-level SELF-HEAL --
# it compares the fly image tag vs main HEAD and re-dispatches deploy.yml to
# heal WITHIN this check's grace window. If this check's ::error:: fires,
# the watchdog failed to heal -- investigate the watchdog, not this check.
#
# FAR-910: escalation path -- on failure, a Linear ticket is auto-created with
# the staleness detail (prod SHA, main HEAD, hours stale) so the signal
# reaches the ready queue, not just the Actions tab. The warning branches
# (unreachable endpoint, missing SHA) remain warn-only for transient failures;
# persistent blindness is covered by the product's own in-app alerting (the
# readiness-degradation email plus the worker-liveness watchdog; FAR-1571 for
# the advisory class) and the deploy-watchdog's own escalation (3 consecutive
# failures).
# FAR-1407: the escalation dedupes on the CONDITION (title marker + open
# state), not on the run -- an existing open starvation ticket gets the
# latest figures appended as a comment instead of a fresh duplicate ticket
# every cron run. The run still fails; only the ticket creation is deduped.

on:
  schedule:
    # FAR-2116: tightened from "0 */2" so a 2-consecutive-failure condition is
    # surfaced within ~30 minutes of the second failure completing instead of
    # up to two hours later. The workflow is one 30s job (a couple of API
    # reads), and */30 is the cadence the sibling deploy-watchdog.yml already
    # runs at. The staleness half is unaffected by the extra ticks (6h grace).
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # Read the deploy workflow's run/job history (consecutive-failure count and
  # the previous health verdict).
  actions: read

jobs:
  check-prod-staleness:
    name: Deploy health (staleness + consecutive failures)
    runs-on: ubicloud-standard-2
    steps:
      # The evaluator lives in .github/scripts/deploy_health.py so every
      # threshold and transition below is proved by a unit test
      # (backend/tests/unit/scripts/test_deploy_health.py) rather than by
      # hoping a cron tick behaves.
      - name: Checkout the deploy-health evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Evaluate deploy health (staleness + consecutive failures)
        id: health
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          # Grace window: how long production is allowed to lag behind main
          # HEAD before starvation is declared. Covers the deploy throttle
          # (DEPLOY_INTERVAL_HOURS, default 3h) + pre-deploy CI + staging
          # E2E (~2h) + retry headroom. Default 6h; overridable via the
          # STALENESS_GRACE_HOURS repo variable.
          GRACE_HOURS: ${{ vars.STALENESS_GRACE_HOURS || 6 }}
          # FAR-2116: consecutive FAILED deploy runs before the deploy itself is
          # declared unhealthy. 2 is the ticket's suggestion: a single red
          # deploy is normal (transient npm timeout, a flake in pre-deploy CI),
          # two in a row is not.
          FAILURE_THRESHOLD: ${{ vars.DEPLOY_FAILURE_ALERT_THRESHOLD || 2 }}
        run: |
          set -o pipefail

          # Each unreadable source is REMOVED rather than written empty: an
          # absent file is the UNKNOWN signal the evaluator expects, so a
          # transient API failure can never be read as "no failures".
          WORK="/tmp/deploy-health"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          if gh api "repos/$REPOSITORY/commits/$REF_NAME" \
              --jq '{sha: .sha, date: .commit.committer.date}' > "$WORK/main.json" 2>/dev/null; then
            echo "Read origin/$REF_NAME HEAD."
          else
            rm -f "$WORK/main.json"
            echo "::warning::Deploy health check could not read origin/$REF_NAME HEAD (gh api error) - the staleness half is UNKNOWN this cycle."
          fi

          if curl -fsS -m 15 "https://app.modulo.run/api/v1/deployment" > "$WORK/prod.json" 2>/dev/null; then
            echo "Read the production deployment metadata."
          else
            rm -f "$WORK/prod.json"
            echo "::warning::Deploy health check could not read the production build metadata from https://app.modulo.run/api/v1/deployment (unreachable, or the build metadata env vars are missing) - the staleness half is UNKNOWN this cycle."
          fi

          if gh run list --repo "$REPOSITORY" --workflow deploy.yml --branch main --limit 15 \
              --json databaseId,status,conclusion,headSha,displayTitle,createdAt,url \
              > "$WORK/runs.json" 2>/dev/null; then
            echo "Read the deploy workflow's run history."
          else
            rm -f "$WORK/runs.json"
            echo "::warning::Deploy health check could not list deploy.yml runs (gh API error) - the consecutive-failure half is UNKNOWN this cycle."
          fi

          python3 .github/scripts/deploy_health.py evaluate \
            --main-json "$WORK/main.json" \
            --prod-json "$WORK/prod.json" \
            --runs-json "$WORK/runs.json" \
            --grace-hours "$GRACE_HOURS" \
            --failure-threshold "$FAILURE_THRESHOLD" \
            --github-output "$GITHUB_OUTPUT" \
            --verdict-out "$WORK/verdict.json"
          {
            echo "verdict_json=$WORK/verdict.json"
            echo "work_dir=$WORK"
          } >> "$GITHUB_OUTPUT"

      # FAR-2139: the transition decision, the message and the SMTP send are ONE
      # shared step with deploy-watchdog.yml (.github/scripts/deploy-health-notify.sh),
      # rendered by .github/scripts/deploy_health.py. Two copies of an escalation
      # channel are exactly what drifted out of reach in the 2026-10-23..25 outage.
      - name: Email the operator on a deploy-health transition
        id: notify
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_HEALTHY: ${{ steps.health.outputs.healthy }}
          VERDICT_JSON: ${{ steps.health.outputs.verdict_json }}
          WORKFLOW_NAME: "Deploy staleness check (prod vs main)"
          VERDICT_STEP_NAME: "Fail the run when deploy health is unhealthy"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy.yml
          # --- Zoho SMTP (the existing email path issue-notify.yml uses) ---
          ZOHO_SMTP_USER: ${{ secrets.ZOHO_SMTP_USER }}
          ZOHO_SMTP_PASS: ${{ secrets.ZOHO_SMTP_PASS }}
          ISSUE_NOTIFY_EMAIL: ${{ secrets.ISSUE_NOTIFY_EMAIL }}
          ISSUE_NOTIFY_FROM: ${{ secrets.ISSUE_NOTIFY_FROM }}
        run: bash .github/scripts/deploy-health-notify.sh

      - name: Create Linear ticket on starvation
        if: always() && steps.health.outputs.stale == 'true'
        shell: bash
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "LINEAR_API_KEY not set - skipping ticket (workflow failure still alerts via GitHub)."
            exit 0
          fi
          HEAD_AGE="${{ steps.health.outputs.age_hours }}"
          MAIN_SHA="${{ steps.health.outputs.main_sha }}"
          PROD_SHA="${{ steps.health.outputs.prod_sha }}"
          GRACE="${{ steps.health.outputs.grace_hours }}"
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          TITLE="DEPLOY STARVATION: prod stale ${HEAD_AGE}h (FAR-910)"
          # FAR-1407: dedupe KEY is the condition marker (title prefix), not
          # the run-specific figures in TITLE. One continuous starvation = one
          # open ticket + appended comments, not one ticket per cron run.
          MARKER="DEPLOY STARVATION"
          DESC="Production deploy starvation detected at ${TS}.\nProd SHA: ${PROD_SHA:-unknown}\nMain HEAD: ${MAIN_SHA:-unknown}\nHours stale: ${HEAD_AGE:-unknown}h\nGrace window: ${GRACE:-6}h\nThe deploy pipeline has not released main's HEAD within the grace window.\nIf no deploy is in flight, force one: gh workflow run 'Deploy: Staging + Prod' --ref main -f force_deploy=true\nThe operator was also emailed on the health transition (FAR-2116), so this ticket is the durable queue record rather than the only signal."
          # Latest figures: appended to an existing open ticket instead of
          # creating a duplicate (FAR-1407).
          UPDATE=$(printf 'Escalation still active at %s.\nProd SHA: %s\nMain HEAD: %s\nHours stale: %sh\nGrace window: %sh\nAppended by the deploy staleness check instead of opening a duplicate ticket (FAR-1407: dedupe on the condition, not the run).' "$TS" "${PROD_SHA:-unknown}" "${MAIN_SHA:-unknown}" "${HEAD_AGE:-unknown}" "${GRACE:-6}")

          # ---- FAR-1407: dedupe on the CONDITION, not the run ----
          # Search Linear for an existing OPEN ticket for this condition
          # (team + title marker + state type in backlog/unstarted/started =
          # Backlog / Todo / In Progress). Done ("completed") and Canceled
          # ("canceled") are excluded BY the server-side filter, so a closed
          # tracker never suppresses a later recurrence: once the condition
          # clears and the ticket is closed, the next starvation's search
          # comes back empty and a fresh ticket is created.
          # FAIL OPEN BY CONSTRUCTION: the create below is skipped only when
          # the search returns a well-formed issue UUID. A transport failure,
          # an API error, or a malformed response all leave EXISTING_ID empty
          # and fall through to create - the alert is never silently dropped.
          SEARCH_BODY=$(jq -n \
            --arg marker "$MARKER" \
            '{
              query: "query($m: String!){ issues(filter:{ team:{ id:{ eq:\"ae855baf-6439-4980-97fb-38da80129485\" } }, title:{ contains:$m }, state:{ type:{ in:[\"backlog\",\"unstarted\",\"started\"] } } }, first:1){ nodes { id identifier state { name } } } }",
              variables: { m: $marker }
            }')
          SEARCH_RESULT=$(curl -sS -f --max-time 20 -X POST "https://api.linear.app/graphql" \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d "$SEARCH_BODY" 2>&1) || SEARCH_RESULT=""
          EXISTING_ID=""
          EXISTING_REF=""
          SEARCH_OK=""
          if [ -n "$SEARCH_RESULT" ]; then
            if echo "$SEARCH_RESULT" | jq -e '.data.issues' >/dev/null 2>&1; then
              SEARCH_OK="true"
            fi
            EXISTING_ID=$(echo "$SEARCH_RESULT" | jq -r '.data.issues.nodes[0].id // ""' 2>/dev/null) || EXISTING_ID=""
            EXISTING_REF=$(echo "$SEARCH_RESULT" | jq -r '.data.issues.nodes[0].identifier // ""' 2>/dev/null) || EXISTING_REF=""
          fi
          # Accept only a well-formed UUID; anything else counts as "search
          # yielded nothing" and fails open to the create below.
          if ! printf '%s' "$EXISTING_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            EXISTING_ID=""
          fi

          if [ "$SEARCH_OK" = "true" ] && [ -n "$EXISTING_ID" ]; then
            # Open ticket exists for this condition - append the latest
            # figures, do NOT create a duplicate.
            COMMENT_BODY=$(jq -n \
              --arg i "$EXISTING_ID" \
              --arg b "$UPDATE" \
              '{
                query: "mutation($i: String!, $b: String!){ commentCreate(input:{ issueId:$i, body:$b }){ success comment { id } } }",
                variables: { i: $i, b: $b }
              }')
            CRES=$(curl -sS -f --max-time 20 -X POST "https://api.linear.app/graphql" \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d "$COMMENT_BODY" 2>&1) || CRES=""
            if echo "$CRES" | grep -q '"success":true'; then
              echo "Deduplicated (FAR-1407): appended the latest figures to open ticket $EXISTING_REF - no new ticket created."
            else
              echo "::warning::Open ticket $EXISTING_REF exists but appending the update failed: $CRES - no duplicate created; the next run retries the comment."
            fi
            exit 0
          fi

          if [ "$SEARCH_OK" != "true" ]; then
            # Fail OPEN LOUDLY: search/API failure must never read as
            # "no ticket needed" - warn and create anyway.
            echo "::warning::Linear dedup search failed or returned an unexpected response - failing OPEN: creating a fresh ticket anyway (FAR-1407: never suppress the escalation). Response: ${SEARCH_RESULT:-<empty>}"
          fi

          BODY=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$(echo -e "$DESC")" \
            '{
              query: "mutation($i: IssueCreateInput!){ issueCreate(input:$i){ success issue { identifier url } } }",
              variables: { i: {
                teamId: "ae855baf-6439-4980-97fb-38da80129485",
                title: $title,
                description: $desc,
                priority: 1
              } }
            }')
          RESULT=$(curl -sS -f --max-time 20 -X POST "https://api.linear.app/graphql" \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d "$BODY" 2>&1) || true
          if echo "$RESULT" | grep -q '"success":true'; then
            TICKET_ID=$(echo "$RESULT" | jq -r '.data.issueCreate.issue.identifier // "unknown"')
            echo "Created Linear ticket: $TICKET_ID"
          else
            echo "::warning::Failed to create Linear ticket: $RESULT"
          fi

      - name: Fail the run when deploy health is unhealthy
        if: always() && steps.health.outputs.healthy == 'false'
        shell: bash
        env:
          CONSECUTIVE: ${{ steps.health.outputs.consecutive_failures }}
          FAILURE_THRESHOLD: ${{ steps.health.outputs.failure_threshold }}
          AGE_HOURS: ${{ steps.health.outputs.age_hours }}
          GRACE_HOURS: ${{ steps.health.outputs.grace_hours }}
          PROD_SHA: ${{ steps.health.outputs.prod_sha }}
          MAIN_SHA: ${{ steps.health.outputs.main_sha }}
        run: |
          # The red run IS the durable state vector the transition email reads
          # (the next tick inspects this step's conclusion), and it keeps the
          # long-standing Actions-tab signal. It runs LAST so every notify /
          # ticket step above still executes.
          echo "::error::Deploy health UNHEALTHY: ${CONSECUTIVE} consecutive failed deploy run(s) (threshold ${FAILURE_THRESHOLD}), production ${PROD_SHA} at ${AGE_HOURS:-unknown}h (grace ${GRACE_HOURS}h) behind origin/main ${MAIN_SHA}."
          exit 1

      # FAR-2157: a tick that measured NOTHING must not read back as healthy.
      # When every source was unreadable the evaluator returns healthy=None,
      # the verdict step above is skipped, and the run concludes SUCCESS - in
      # run history that is indistinguishable from a healthy tick, so the
      # NEXT tick's transition email treats it as a healthy verdict and can
      # silently swallow the recovery email (an alert that is never closed).
      # This step runs ONLY on the unmeasured path; its presence is the
      # durable machine-readable signal `deploy_health.parse_previous_verdict`
      # reads (the jobs API exposes step names and conclusions, not outputs).
      # It still concludes success: an unmeasurable tick is not a deploy
      # failure, and the ::warning::s above name what could not be read.
      - name: Record the unmeasured tick (FAR-2157)
        if: always() && steps.health.outputs.healthy == ''
        shell: bash
        run: |
          echo "::warning::NO MEASUREMENT — deploy health could not be evaluated this tick, so this green run is NOT a healthy verdict (FAR-2157). The next tick treats it as UNKNOWN."
          {
            echo "## NOT MEASURED — deploy health UNKNOWN (FAR-2157)"
            echo ""
            echo "Every source this tick needed was unreadable, so neither the staleness nor"
            echo "the consecutive-failure half was evaluated. This run concludes success because"
            echo "an unmeasurable tick is not a deploy failure - it is NOT evidence that"
            echo "production is healthy. No transition email is inferred from it."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
