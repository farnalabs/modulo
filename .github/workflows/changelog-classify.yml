# Changelog classification check (FAR-1155)
#
# Enforces a "changelog:" label on PRs that change user-facing paths
# (backend/src/**, frontend/src/**). The verdict is published as a SYNTHETIC
# check run named "changelog-classified" on the PR's head SHA: success =
# classified (or no user-facing paths), failure = missing label (the message
# names all four labels so the fix is one click). PRs touching none of those
# paths pass with a ::notice::.
#
# Label state is read LIVE from the issue labels endpoint, with the event
# payload (github.event.pull_request.labels) as a fallback. The changelog:*
# label is applied by the PR-creation flow a few seconds AFTER the `opened` /
# `agent-generated` events fire; a queued run can therefore execute after the
# label exists while its event payload still pre-dates it. Using the payload
# alone produced a false red on those early runs, leaving FAILED superseded
# check-runs on the head SHA that the PR Reviewer and the merge queue count as
# failures — permanently blocking an otherwise-green PR (observed 2026-10-05
# on PR #1285: `changelog: none` applied at 07:57:56, but the `opened` run,
# started at 07:58:10, still saw only `agent-generated` and failed). Reading
# the live labels removes that race. The payload is only a fallback for when
# the labels API call fails.
#
# FAR-1527: this workflow now ALSO hosts the fast-lane classifier, merged in
# from the former fast-lane-classify.yml (identical pull_request triggers, so
# one runner per event instead of two), plus a path-derived label sync. The
# fast-lane conclusion contract is preserved EXACTLY — same synthetic
# check-run name ("fast-lane-eligible"), same three-way conclusion
# (success = eligible, neutral = ineligible, failure = classifier error
# rc=2), same `checks: write` permission, same classifier invocation — and
# the merge queue keeps reading that check run BY NAME.
#
# STEP ORDER IS LOAD-BEARING: the classifier and its check-run step run
# FIRST (after checkout + uv setup). Everything after them (the changelog
# gate, the label sync) can fail without ever suppressing or superseding the
# fast-lane check run; the check-run step keeps its original
# `if: always()` (a failed checkout/setup leaves rc empty → `*` → failure,
# exactly the standalone workflow's behaviour).
#
# FAR-1738: opening a PR fires `opened` and the auto-applied `agent-generated`
# label fires a near-simultaneous `labeled`, so TWO runs of this workflow
# execute per head SHA (a third event — the changelog:* label landing, or
# `unlabeled` — adds more). Historically each run's job check run carried its
# own gate verdict, so one SHA accumulated 2-3 "Changelog classification"
# check runs and a single genuine violation was reported 2-3 times over; the
# paired failures were the single largest GitHub failure source in the week
# before this change. Run-level dedupe is NOT possible without endangering
# the fast-lane contract (see the concurrency note below), so the gate is
# deduplicated at the VERDICT level instead:
#
#   * Every run still executes the gate, but the verdict is UPSERTED into a
#     single synthetic check run ("changelog-classified") keyed on the head
#     SHA — never POSTed as a new row per run. The step claims the slot early
#     (POSTs an in_progress row when none exists, so a near-simultaneous
#     duplicate converges on the same row) and completes it at the end by
#     RE-LISTING every row with that name on the SHA and PATCHing each one
#     to the computed conclusion — the re-list is taken at publish time (not
#     at claim time), so even a true-simultaneity double-POST (two runs that
#     both saw an empty claim-time list) converges within the same run
#     rather than waiting for a later same-SHA event.
#   * Last-writer-wins is a FEATURE: a later run that sees the changelog:*
#     label overwrites an earlier failure with success on the SAME row, so a
#     superseded verdict can no longer block a PR (the #1285 false-red class
#     self-heals without a re-run).
#   * The job's own check run ("Changelog classification") is no longer the
#     gate verdict — the job stays green when the gate fails so duplicates
#     cannot pile up red job check runs. The red lives solely on the
#     changelog-classified row. If the row cannot be created/completed (API
#     error), the step fails the job: a gate that cannot publish its verdict
#     fails CLOSED, never silently open.
#   * Label sync now also runs after a gate violation (previously a red gate
#     step stopped the job first); it is an idempotent reconciliation and is
#     unaffected by duplicates (it already tolerates concurrent runs).
#
# NO workflow-level or job-level concurrency (deliberate; carried over from
# BOTH former workflows, and re-verified under FAR-1738). Cancel-based dedupe
# is unsafe here: cancelling a run/job completes its check runs with
# conclusion `cancelled`, which the PR Reviewer counts as FAILED (only
# success/skipped/neutral pass) and the app-leg merge queue's checks_pass
# (success-only) also fails — a CANCELLED "Changelog classification" row
# therefore blocks an otherwise-green PR and dispatches a Branch Fixer run
# for a non-failure (observed 2026-10-04 on PR #1253). Job/workflow-level
# `cancel-in-progress: false` does not dedupe either: it only serialises, and
# a third same-SHA event displaces the single pending slot with a
# cancellation (the pending-displacement behaviour documented in
# merge-queue-watchdog.yml). And a blanket cancel across THIS workflow would
# sometimes cancel the only publisher of the fast-lane check run. The
# verdict-upsert above gives one gate verdict per head SHA with no
# cancellation and no risk to the fast-lane publisher.

name: "Check: Changelog classification"

on:
  pull_request:
    # Superset of both former workflows' triggers: changelog-classify.yml had
    # no `branches:` filter, fast-lane-classify.yml had `branches: [main]`.
    # Every PR targets main, so the union changes nothing observable and the
    # changelog gate keeps covering every base branch.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  # The live-label read hits GET /repos/{repo}/issues/{n}/labels, and the
  # path-derived label sync creates repo labels and adds/removes labels on
  # this PR through the same issue-labels endpoints (a pull request is an
  # issue for them), so `issues` must be writable; `pull-requests` covers the
  # PR changed-file list read (GET /repos/{repo}/pulls/{n}/files) and any
  # pull-request-scoped label write GitHub resolves through that scope.
  issues: write
  pull-requests: write
  # Both synthetic check runs are published via POST / PATCH
  # /repos/{owner}/{repo}/check-runs: the fast-lane classifier's
  # "fast-lane-eligible" (read by the merge queue BY NAME) and the changelog
  # gate's "changelog-classified" (FAR-1738 verdict upsert). This permission
  # is load-bearing (FAR-1099 / FAR-1738).
  checks: write

jobs:
  changelog-classify:
    # FAR-1738: this job's own check run ("Changelog classification") is NOT
    # the gate verdict — the verdict is the synthetic "changelog-classified"
    # check run upserted per head SHA (see the header). The job stays green
    # on a gate violation; a red job row now means an infrastructure failure
    # (verdict row could not be created/completed, or label sync failed).
    name: Changelog classification
    if: github.event_name == 'pull_request'
    runs-on: ubicloud-standard-2
    env:
      CHECK_NAME: "changelog-classified"
      FAST_LANE_CHECK_NAME: "fast-lane-eligible"
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No persisted credentials: everything below talks to GitHub through
          # an explicit GH_TOKEN env (the repo is public, so the label-sync's
          # `git fetch origin main` works anonymously too).
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true

      # --- fast-lane classifier (merged from fast-lane-classify.yml, FAR-1099) ---
      # FAR-1099: classify PRs for fast-lane eligibility. Runs the classifier
      # script that checks (1) all changed paths are class-A (test-infra only),
      # (2) guardrails pass (cap, no test-weakening, SHA-pinned check). The
      # result is a named check run ("fast-lane-eligible") on the PR's head SHA
      # that the merge-queue reads when evaluating fast-lane eligibility.
      #
      # The classifier step captures its exit code into a step output and
      # ALWAYS exits 0, so the job stays green for every PR (class-B included)
      # and the merge-queue collect step / notify-pr-failure are not broken. A
      # separate step publishes the eligibility signal as the named check run.
      #
      # `continue-on-error` is not used anywhere here (forbidden by
      # .semgrep/continue-on-error-in-ci.yaml): where a non-fatal outcome is
      # genuinely needed it is reported explicitly rather than suppressed. The
      # check-run approach satisfies both constraints: the job stays green (no
      # continue-on-error), and ineligibility is published as a `neutral`
      # (non-failing) check run — never a red one — so the feature stays inert
      # for every non-fast-lane PR. The merge-queue grants the fast lane only
      # on a `success` conclusion, so `neutral` is a correct, non-blocking
      # denial. A red check here would trigger the Branch Fixer on every
      # class-B PR.
      - name: Run fast-lane classifier
        id: classify
        env:
          # The suspension guardrail reads the FAST_LANE_SUSPENDED_UNTIL
          # repository variable, which the Actions integration token
          # (github.token) cannot read — it returns HTTP 403 "Resource not
          # accessible by integration", fail-closing the guardrail and pinning
          # every fast-lane PR to `neutral` (observed on PR #907/#904, blocking
          # the fix for broken main).  The reviewer PAT can read variables
          # (fast-lane-suspension.yml uses it to write them), so prefer it and
          # fall back to github.token only when the secret is unavailable.
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
        run: |
          set +e
          uv run --no-build --project backend --no-sync python scripts/fast_lane_classify.py \
            --pr-number ${{ github.event.pull_request.number }} \
            --head-sha ${{ github.event.pull_request.head.sha }} \
            --repo ${{ github.repository }} \
            --base-ref "origin/${{ github.event.pull_request.base.ref }}"
          rc=$?
          echo "classify_rc=$rc" >> "$GITHUB_OUTPUT"
          # Always exit 0: the job stays green (workflow run = success) for
          # every PR. The eligibility signal is the named check run created
          # below, not the job conclusion.
          exit 0
      - name: Create fast-lane-eligible check run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FAST_LANE_CHECK_NAME: ${{ env.FAST_LANE_CHECK_NAME }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
        run: |
          RC="${{ steps.classify.outputs.classify_rc }}"
          # Conclusion contract (FAR-1099):
          #   0 -> success  : class-A and (if labelled) guardrails pass
          #   1 -> neutral  : class-B / unlabelled — NOT a failure. The PR takes
          #                   the normal reviewed lane. A `failure` here would
          #                   put a red check on every non-fast-lane PR, re-
          #                   dispatching the Branch Fixer and breaking the
          #                   feature's "side-effect-free for existing PRs"
          #                   guarantee.
          #   * -> failure  : rc=2 is a genuine classifier/usage error.
          case "$RC" in
            0)
              CONCLUSION="success"
              TITLE="Fast-lane eligible"
              SUMMARY="PR is fast-lane eligible (class-A, guardrails pass). Merge-queue may skip review for this PR." ;;
            1)
              CONCLUSION="neutral"
              TITLE="Fast-lane ineligible"
              SUMMARY="PR is NOT fast-lane eligible (class-B or guardrail violation). Standard review lane applies." ;;
            *)
              CONCLUSION="failure"
              TITLE="Fast-lane classifier error"
              SUMMARY="The fast-lane classifier exited with code ${RC} (usage/infra error). Eligibility could not be determined; standard review lane applies." ;;
          esac
          # Build the body with jq so the nested `output` object is sent
          # correctly (a dotted `-f output.title=` sends a literal key and
          # GitHub drops it, leaving the check run with no title/summary).
          BODY=$(jq -n \
            --arg name "$FAST_LANE_CHECK_NAME" \
            --arg sha "$HEAD_SHA" \
            --arg conclusion "$CONCLUSION" \
            --arg title "$TITLE" \
            --arg summary "$SUMMARY" \
            '{name: $name, head_sha: $sha, status: "completed", conclusion: $conclusion, output: {title: $title, summary: $summary}}')
          gh api "repos/${{ github.repository }}/check-runs" \
            --method POST \
            --input - <<< "$BODY" \
            --jq '.id'
          echo "fast-lane check run created: conclusion=$CONCLUSION on $HEAD_SHA"

      # --- changelog gate (FAR-1155 evaluation; FAR-1738 verdict upsert) ---
      #
      # The evaluation logic below is unchanged from FAR-1155; what changed is
      # HOW the verdict is published (see the header's FAR-1738 section). The
      # step claims a single per-head-SHA check run ("changelog-classified")
      # early, evaluates, then PATCHes the verdict onto that row. The job's
      # own check run is NOT the gate verdict: this step exits 0 even when the
      # gate fails, so a duplicate run cannot pile up a second red job check
      # run, and a later run's success PATCHES OVER an earlier failure on the
      # same row (last-writer-wins self-healing). The verdict is published by
      # re-listing every "changelog-classified" row on the SHA at publish
      # time and PATCHing each one, so a double-POST race converges within
      # the same run. A failure to create or complete the verdict row fails
      # the JOB (fail-closed) — a gate that cannot publish its verdict never
      # passes silently.
      - name: Require a changelog:* label on user-facing changes
        id: changelog-gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ env.BASE_REF }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          EVENT_LABELS_JSON: ${{ env.EVENT_LABELS_JSON }}
          REPO: ${{ env.REPO }}
          CHECK_NAME: ${{ env.CHECK_NAME }}
        run: |
          set -euo pipefail

          CREATED_IDS=""
          COMPLETED="false"

          # If this step dies AFTER creating the in_progress slot and BEFORE
          # the final PATCH below, complete the rows it created as `failure`
          # so the head SHA is never left with a stuck in_progress gate row
          # (the app-leg merge queue's checks_pass polls for all check runs
          # completed and would fail-close on it forever). The trap never
          # masks the original exit status.
          # Invoked indirectly via `trap on_exit EXIT` - shellcheck has no
          # call-site for a trap handler, so it reports the body unreachable.
          # shellcheck disable=SC2317
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$COMPLETED" != "true" ] && [ -n "$CREATED_IDS" ]; then
              while IFS= read -r id; do
                [ -n "$id" ] || continue
                BODY=$(jq -n '{
                  status: "completed",
                  conclusion: "failure",
                  output: {
                    title: "Changelog gate internal error",
                    summary: "The changelog gate crashed before publishing its verdict; treated as failure (fail-closed). Re-run this workflow or push a commit to re-evaluate."
                  }}')
                gh api "repos/${GITHUB_REPOSITORY}/check-runs/${id}" \
                  --method PATCH --input - <<< "$BODY" >/dev/null \
                  || echo "::warning::changelog-gate: could not complete check run ${id} after a step error"
              done <<< "$CREATED_IDS"
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          # FAR-1738: claim the verdict slot EARLY. Every duplicate run of
          # this workflow for the same head SHA converges on the SAME
          # "changelog-classified" check run: if any row with that name
          # already exists on the SHA (completed, in_progress, or an
          # in_progress row left by a concurrent duplicate / crashed earlier
          # run), reuse its id(s); otherwise create an in_progress row now.
          # The verdict PATCH at the end updates that row instead of POSTing
          # a new duplicate per run — so N runs produce ONE gate verdict.
          rc=0
          EXISTING_IDS="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100&filter=all&check_name=${CHECK_NAME}" \
            --jq '.check_runs[] | select(.name == "'"${CHECK_NAME}"'") | .id')" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::changelog-gate: could not list existing '${CHECK_NAME}' check runs on ${HEAD_SHA} (rc=${rc}); failing closed rather than evaluating without a verdict slot."
            exit 1
          fi
          if [ -z "$EXISTING_IDS" ]; then
            BODY=$(jq -n \
              --arg name "$CHECK_NAME" \
              --arg sha "$HEAD_SHA" \
              '{name: $name, head_sha: $sha, status: "in_progress"}')
            rc=0
            NEW_ID="$(gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
              --method POST --input - <<< "$BODY" --jq '.id')" || rc=$?
            if [ "$rc" -ne 0 ] || [ -z "$NEW_ID" ]; then
              echo "::error::changelog-gate: could not create the '${CHECK_NAME}' check run (rc=${rc}); failing closed."
              exit 1
            fi
            CREATED_IDS="$NEW_ID"
          fi

          # Resolve the diff base the same way ci.yml's integration-changed
          # job does: actions/checkout checks out the PR merge commit, whose
          # first parent is the base branch; fall back to origin/<base> only
          # when HEAD is not a merge commit.
          if git rev-parse -q --verify "HEAD^2" >/dev/null 2>&1; then
            BASE="HEAD^"
          else
            BASE="origin/${BASE_REF}"
          fi
          CHANGED="$(git diff --name-only "$BASE" HEAD -- backend/src frontend/src || true)"

          if [ -z "$CHANGED" ]; then
            echo "::notice::PR #${PR_NUMBER} touches no user-facing paths (backend/src, frontend/src) — no changelog label required."
            VERDICT="success"
            TITLE="Changelog classification satisfied"
            SUMMARY="PR #${PR_NUMBER} touches no user-facing paths (backend/src, frontend/src); no changelog:* label required."
          else
            # Prefer the CURRENT label set over the event snapshot (see the
            # header comment). A changelog label applied moments after the
            # triggering event may not be live yet, so re-check with a short
            # bounded grace window before declaring the gate violated.
            #
            # A successful labels API call is authoritative even when it returns
            # an empty set: that is how the gate notices a REMOVED changelog
            # label. The event payload is the fallback only while every API call
            # fails, so distinguish success from failure by exit status rather
            # than treating an empty response as an empty label set.
            #
            # --paginate: a changelog:* label beyond the first page (the labels
            # endpoint returns 30 per page) must still be seen. gh applies --jq
            # per page, so collect the names as newline-separated text and
            # rebuild a single JSON array locally; --slurp is not available on
            # this runner's gh. On API failure the event payload stays as the
            # LABELS_JSON fallback.
            LABELS_JSON="$EVENT_LABELS_JSON"
            HAS_LABEL="false"
            for attempt in 1 2 3; do
              if LIVE_LABELS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name' 2>/dev/null)"; then
                LABELS_JSON="$(printf '%s\n' "$LIVE_LABELS" | jq -Rsc 'split("\n") | map(select(length>0))')"
              fi
              # Any label starting with "changelog:" satisfies the gate.
              # Labels arrive as a JSON array (toJSON / the labels endpoint)
              # so no separator character can split or merge a label name.
              if jq -e 'any(.[]; startswith("changelog:"))' >/dev/null 2>&1 <<< "$LABELS_JSON"; then
                HAS_LABEL="true"
                break
              fi
              [ "$attempt" = "3" ] || sleep 4
            done

            if [ "$HAS_LABEL" = "true" ]; then
              echo "PR #${PR_NUMBER} changes user-facing paths and carries a changelog:* label."
              printf 'Changed user-facing paths:\n%s\n' "$CHANGED"
              VERDICT="success"
              TITLE="Changelog classification satisfied"
              SUMMARY="PR #${PR_NUMBER} changes user-facing paths and carries a changelog:* label.
          Changed user-facing paths:
          ${CHANGED}"
            else
              echo "Changed user-facing paths:"
              printf '%s\n' "$CHANGED"
              VERDICT="failure"
              TITLE="Changelog classification missing"
              SUMMARY="PR #${PR_NUMBER} changes user-facing paths (backend/src/**, frontend/src/**) but has no changelog classification label. Apply exactly one of: 'changelog: breaking' (Breaking Changes), 'changelog: feature' (Features), 'changelog: fix' (Fixes), 'changelog: none' (no entry — the correct, honest label for internal/refactor/test/docs/infra work).
          Changed user-facing paths:
          ${CHANGED}"
            fi
          fi

          # FAR-1738: publish the verdict by UPSERT — RE-LIST every
          # "changelog-classified" row on the head SHA at publish time and
          # PATCH each one to the computed conclusion. Re-listing here (not
          # reusing the claim-time EXISTING_IDS) closes the double-POST
          # race: two near-simultaneous runs that both saw an empty
          # claim-time list each POST their own row, so each run's
          # claim-time view holds only its own id — the publish-time
          # re-list sees BOTH rows and converges them to the same verdict
          # within the same run. Without it, diverging rows sit on the SHA
          # until a later same-SHA event reconciles them, and if no event
          # comes one red row can block the PR. Last-writer-wins still
          # holds across runs: a later run that sees a freshly-applied
          # changelog:* label overwrites an earlier failure — a superseded
          # verdict can no longer block a PR.
          rc=0
          VERDICT_IDS="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100&filter=all&check_name=${CHECK_NAME}" \
            --jq '.check_runs[] | select(.name == "'"${CHECK_NAME}"'") | .id')" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::changelog-gate: could not re-list '${CHECK_NAME}' check runs on ${HEAD_SHA} at publish time (rc=${rc}); failing closed."
            exit 1
          fi
          # Belt-and-braces: a row this run just POSTed must never be
          # dropped by a stale re-list response; union it back in.
          if [ -n "${CREATED_IDS:-}" ]; then
            VERDICT_IDS="$(printf '%s\n%s\n' "$VERDICT_IDS" "$CREATED_IDS" | sort -u)"
          fi
          if [ -z "$VERDICT_IDS" ]; then
            echo "::error::changelog-gate: no '${CHECK_NAME}' check run found on ${HEAD_SHA} to publish the verdict onto; failing closed."
            exit 1
          fi
          BODY=$(jq -n \
            --arg conclusion "$VERDICT" \
            --arg title "$TITLE" \
            --arg summary "$SUMMARY" \
            '{status: "completed", conclusion: $conclusion, output: {title: $title, summary: $summary}}')
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            if ! gh api "repos/${GITHUB_REPOSITORY}/check-runs/${id}" \
                --method PATCH --input - <<< "$BODY" >/dev/null; then
              echo "::error::changelog-gate: could not publish verdict '${VERDICT}' to check run ${id}; failing closed."
              exit 1
            fi
            echo "changelog-classified check run ${id} -> ${VERDICT}"
          done <<< "$VERDICT_IDS"
          COMPLETED="true"

          if [ "$VERDICT" = "failure" ]; then
            # The annotation keeps the human-visible log signal; enforcement
            # is the red changelog-classified check run, NOT the job
            # conclusion (the job stays green on a gate violation so
            # duplicate runs cannot stack red job check runs — FAR-1738).
            echo "::error::PR #${PR_NUMBER} changes user-facing paths (backend/src/**, frontend/src/**) but has no changelog classification label. Apply exactly one of: 'changelog: breaking' (Breaking Changes), 'changelog: feature' (Features), 'changelog: fix' (Fixes), 'changelog: none' (no entry — the correct, honest label for internal/refactor/test/docs/infra work)."
          fi
          exit 0

      # --- path-derived label sync (FAR-1527) ---
      #
      # Reconciles a small MANAGED label set derived from the changed paths:
      #   db: migrations               <- backend/src/modulo/db/migrations/**
      #   risk: high                   <- globs in .github/high-risk-paths.yaml
      #   area: backend                <- backend/**
      #   area: frontend               <- frontend/**
      #   area: ci                     <- .github/** + deploy/**
      #   area: docs                   <- docs/** + *.md
      #
      # The high-risk globs are read from origin/main ONLY (`git fetch origin
      # main` + `git show origin/main:.github/high-risk-paths.yaml`) — never
      # from the PR head — so a PR cannot weaken the registry and de-label
      # itself. That file stays the single source of truth: no glob list is
      # duplicated in this workflow (only its `registry_file` self-reference
      # is appended, which the registry itself declares always-high-risk).
      #
      # Labels are HUMAN-FACING ONLY. No downstream automation may read them:
      # no gate, router, merge-queue rule or pipeline consumes `db: migrations`,
      # `risk: high` or `area: *` — automation reads check runs, code paths and
      # the changelog:* labels directly. These labels exist purely for people
      # scanning PR lists.
      #
      # Reconciliation touches ONLY the managed names: compute the desired set,
      # read the PR's current labels, then ADD missing and REMOVE stale
      # managed names only. It uses POST (add) + DELETE (remove) per label and
      # NEVER PUT /issues/{n}/labels — a PUT replaces the entire label set and
      # would wipe changelog:*, agent-generated, manual-delivery, etc.
      #
      # Failure posture: prerequisite READS (PR file list, origin/main
      # registry, repo label list, PR label list) fail LOUD but NON-FATAL —
      # a ::warning:: and the sync is skipped for this run. Genuine
      # logic/write failures below fail the step; nothing is masked with
      # `|| true`.
      - name: Sync path-derived labels
        id: label-sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          MANAGED=("db: migrations" "risk: high" "area: backend" "area: frontend" "area: ci" "area: docs")

          # --- prerequisite 1: changed files from the GitHub API ---------------
          # `rc=0; out=$(...) || rc=$?` survives Actions' `bash -e -o pipefail`
          # so a failed API call reaches the skip branch instead of aborting the
          # step. previous_filename is included so a rename out of (or into) a
          # managed path still counts. count >= 3000 is GitHub's file-list cap:
          # a truncated list would produce an incomplete desired set and wrongly
          # REMOVE valid labels, so it skips instead of reconciling.
          rc=0
          FILES="$(gh api --paginate "/repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')" || rc=$?
          COUNT="$(printf '%s\n' "$FILES" | grep -c . || true)"
          if [ "$rc" -ne 0 ] || [ "$COUNT" -eq 0 ] || [ "$COUNT" -ge 3000 ]; then
            echo "::warning::label-sync skipped: unreliable changed-file list (rc=${rc}, count=${COUNT})"
            exit 0
          fi

          # --- prerequisite 2: high-risk globs from origin/main ONLY -----------
          if ! git fetch origin main --quiet; then
            echo "::warning::label-sync skipped: could not fetch origin/main to read .github/high-risk-paths.yaml"
            exit 0
          fi
          if ! REGISTRY="$(git show origin/main:.github/high-risk-paths.yaml)"; then
            echo "::warning::label-sync skipped: .github/high-risk-paths.yaml is unreadable on origin/main"
            exit 0
          fi
          # Parse the `high_risk_paths` list (quoted `- "glob"` entries only) —
          # comments and blank lines inside the block are ignored, and the list
          # ends at the first non-list line.
          RISK_GLOBS="$(printf '%s\n' "$REGISTRY" | awk '
            /^high_risk_paths:/ { inlist = 1; next }
            inlist && /^[ \t]*-[ \t]*"/ {
              line = $0
              sub(/^[ \t]*-[ \t]*/, "", line)
              gsub(/"/, "", line)
              print line
              next
            }
            inlist && (/^[ \t]*#/ || /^[ \t]*$/) { next }
            inlist { inlist = 0 }
          ')"
          # The registry also names itself as always-high-risk (registry_file);
          # reading that key keeps the mirror faithful without duplicating any
          # glob in this workflow.
          REG_FILE="$(printf '%s\n' "$REGISTRY" | awk -F'"' '/^registry_file:/ { print $2; exit }')"
          if [ -n "$REG_FILE" ]; then
            RISK_GLOBS="${RISK_GLOBS}"$'\n'"${REG_FILE}"
          fi
          if [ -z "$RISK_GLOBS" ]; then
            echo "::warning::label-sync skipped: no high-risk globs parsed from origin/main's .github/high-risk-paths.yaml"
            exit 0
          fi

          # A registry glob used as a shell pattern: bash `case` performs glob
          # matching without FNM_PATHNAME, so `dir/**` matches across slashes
          # exactly like the PR Reviewer's router treats it.
          is_high_risk() {
            local file="$1" glob
            while IFS= read -r glob; do
              [ -z "$glob" ] && continue
              # $glob is a REGISTRY GLOB on purpose - quoting it would turn
              # pattern matching into a literal string compare (see above).
              # shellcheck disable=SC2254
              case "$file" in
                $glob) return 0 ;;
              esac
            done <<< "$RISK_GLOBS"
            return 1
          }

          # --- compute the desired managed set from the changed paths ----------
          HAS_MIGRATIONS=false
          HAS_BACKEND=false
          HAS_FRONTEND=false
          HAS_CI=false
          HAS_DOCS=false
          HAS_RISK=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              backend/src/modulo/db/migrations/*) HAS_MIGRATIONS=true ;;
              backend/*) HAS_BACKEND=true ;;
              frontend/*) HAS_FRONTEND=true ;;
              .github/*|deploy/*) HAS_CI=true ;;
              docs/*|*.md) HAS_DOCS=true ;;
            esac
            if is_high_risk "$file"; then
              HAS_RISK=true
            fi
          done <<< "$FILES"

          DESIRED=()
          if [ "$HAS_MIGRATIONS" = true ]; then DESIRED+=("db: migrations"); fi
          if [ "$HAS_RISK" = true ]; then DESIRED+=("risk: high"); fi
          if [ "$HAS_BACKEND" = true ]; then DESIRED+=("area: backend"); fi
          if [ "$HAS_FRONTEND" = true ]; then DESIRED+=("area: frontend"); fi
          if [ "$HAS_CI" = true ]; then DESIRED+=("area: ci"); fi
          if [ "$HAS_DOCS" = true ]; then DESIRED+=("area: docs"); fi

          # --- read current labels (repository + PR) ---------------------------
          if ! REPO_LABELS="$(gh api --paginate "repos/${REPO}/labels" --jq '.[].name')"; then
            echo "::warning::label-sync skipped: could not read the repository's label list"
            exit 0
          fi
          if ! CURRENT="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name')"; then
            echo "::warning::label-sync skipped: could not read PR #${PR_NUMBER}'s current labels"
            exit 0
          fi
          # Split the newline list into a real array: comparing a needle
          # against the whole multi-line blob (a scalar) would never match,
          # so stale managed labels would never be removed.
          CURRENT_LIST=()
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              CURRENT_LIST+=("$line")
            fi
          done <<< "$CURRENT"

          # Every managed label must exist on the repo before it can be
          # attached; create-if-absent (idempotent via --force) so a deleted
          # managed label cannot make every PR's sync fail.
          for name in "${MANAGED[@]}"; do
            if ! printf '%s\n' "$REPO_LABELS" | grep -Fxq "$name"; then
              gh label create "$name" --force -R "$REPO"
            fi
          done

          in_list() {
            local needle="$1" item
            shift
            for item in "$@"; do
              if [ "$item" = "$needle" ]; then
                return 0
              fi
            done
            return 1
          }

          # --- reconcile: ONLY managed names — add missing, remove stale --------
          for name in "${MANAGED[@]}"; do
            want=false
            if in_list "$name" "${DESIRED[@]}"; then want=true; fi
            attached=false
            if in_list "$name" "${CURRENT_LIST[@]}"; then attached=true; fi

            if [ "$want" = true ] && [ "$attached" = false ]; then
              BODY="$(jq -n --arg l "$name" '{labels: [$l]}')"
              gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/labels" \
                --input - <<< "$BODY" --jq '.[].name' >/dev/null
              echo "label added: ${name}"
            elif [ "$want" = false ] && [ "$attached" = true ]; then
              ENCODED="$(jq -rn --arg v "$name" '$v | @uri')"
              if ! gh api --method DELETE \
                  "repos/${REPO}/issues/${PR_NUMBER}/labels/${ENCODED}" >/dev/null; then
                # 404 here means a concurrent run removed it first (both
                # `opened` and `labeled` runs reconcile). Only a label that is
                # provably STILL attached after a failed DELETE is a failure.
                drc=0
                AGAIN="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name')" || drc=$?
                if [ "$drc" -ne 0 ]; then
                  echo "::error::label-sync: failed to remove '${name}' from PR #${PR_NUMBER}, and the label list could not be re-read (rc=${drc})"
                  exit 1
                fi
                if printf '%s\n' "$AGAIN" | grep -Fxq "$name"; then
                  echo "::error::label-sync: could not remove '${name}' from PR #${PR_NUMBER} — still attached"
                  exit 1
                fi
                echo "label '${name}' was already removed by a concurrent run"
              else
                echo "label removed: ${name}"
              fi
            fi
          done
          echo "label-sync complete: desired=${#DESIRED[@]} of ${#MANAGED[@]} managed labels on PR #${PR_NUMBER}"
