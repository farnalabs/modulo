name: CI

on:
  pull_request:
    branches: [main, staging-queue]
  push:
    branches: [main, staging-queue]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
  FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="

jobs:
  # ── Fast jobs — run on ALL events (PR + push + manual) ──────────────────────

  backend-lint:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src/modulo/
      - run: uv run --no-sync bandit -r src/modulo/ -ll
      - name: Semgrep (block new findings)
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            baseline="origin/$GITHUB_BASE_REF"
          else
            baseline="HEAD^"
          fi
          uv run --no-sync semgrep --config=../.semgrep/ --baseline-commit "$baseline" --error .
      - run: uv run --no-sync pip-audit

  backend-test:
    name: Test (Backend) - ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run unit tests with coverage
        shell: pwsh
        run: ../.github/scripts/coverage-thresholds.ps1
        env:
          DATABASE_URL: "postgresql+asyncpg://unused:unused@localhost/unused"
      - name: Schemathesis API fuzz testing
        shell: pwsh
        run: uv run --no-sync pytest tests/integration/test_schemathesis.py -x --timeout=120
        env:
          DATABASE_URL: "postgresql+asyncpg://unused:unused@localhost/unused"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.os }}
          path: backend/coverage.xml

  frontend:
    name: Frontend and WCAG
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Run WCAG contrast tests
        run: npx playwright test wcag-contrast
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build
      - run: npm audit

  product-map-validate:
    name: Product map validation
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Validate product map graph
        shell: powershell
        run: |
          & tools\graph-validate.ps1 -CI

  manifest-validate:
    name: Manifest validation
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifest.yaml
        shell: powershell
        run: |
          & tools\validate-manifest.ps1 -CI

  powershell-tests:
    name: PowerShell tests (Pester 5)
    runs-on: [self-hosted, windows, docker]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: .tool-cache/powershell
          key: pester-5.7.1-${{ runner.os }}-${{ runner.arch }}
      - name: Run PowerShell tests
        shell: powershell
        run: |
          & tools\run-pester-tests.ps1

  gitleaks:
    name: Secret scan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        shell: powershell
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/gitleaks/gitleaks/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "windows.*x64" }
          if (-not $asset) { throw "No Windows x64 asset found in latest release" }
          $zip = "$env:TEMP\gitleaks.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\gitleaks" -Force
          $exe = Get-ChildItem -Path "$env:TEMP\gitleaks" -Recurse -Filter "gitleaks.exe" | Select-Object -First 1
          if (-not $exe) { throw "gitleaks.exe not found in archive" }
          $dir = $exe.DirectoryName
          echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run gitleaks
        shell: powershell
        run: gitleaks detect --no-git --source . --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Full jobs — run ONLY on push (not PRs) ─────────────────────────────────

  backend-integration:
    name: Integration tests
    if: github.event_name == 'push'
    runs-on: self-hosted
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, powershell-tests, gitleaks]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12.4"
      - name: Start Postgres
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          docker rm -f modulo-ci-pg 2>$null
          docker run -d --name modulo-ci-pg `
            -e POSTGRES_USER=modulo_test `
            -e POSTGRES_PASSWORD=modulo_test `
            -e POSTGRES_DB=modulo_test `
            -p 5433:5432 `
            postgres:16-alpine
          Write-Host "Waiting for Postgres..."
          for ($i=0; $i -lt 60; $i++) {
            $ok = docker exec modulo-ci-pg pg_isready -U modulo_test 2>$null
            if ($?) { Write-Host "Postgres ready"; break }
            Start-Sleep -Seconds 2
          }
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Run integration tests
        working-directory: backend
        run: uv run --no-sync pytest tests/integration/ -m integration -n 2 --cov=src/modulo --cov-report=xml --cov-fail-under=0 -q
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo_test:modulo_test@localhost:5433/modulo_test"
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Stop Postgres
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          docker rm -f modulo-ci-pg 2>$null

  bdd-e2e:
    name: BDD / E2E Tests
    if: github.event_name == 'push'
    runs-on: self-hosted
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, powershell-tests, gitleaks]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Start Postgres
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          docker rm -f modulo-ci-pg 2>$null
          docker run -d --name modulo-ci-pg `
            -e POSTGRES_USER=modulo `
            -e POSTGRES_PASSWORD=modulo `
            -e POSTGRES_DB=modulo `
            -p 5432:5432 `
            postgres:16-alpine
          Write-Host "Waiting for Postgres..."
          for ($i=0; $i -lt 60; $i++) {
            $ok = docker exec modulo-ci-pg pg_isready -U modulo 2>$null
            if ($?) { Write-Host "Postgres ready"; break }
            Start-Sleep -Seconds 2
          }
      - name: Start Redis
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          docker rm -f modulo-ci-redis 2>$null
          docker run -d --name modulo-ci-redis `
            -p 6379:6379 `
            redis:7-alpine
          Write-Host "Waiting for Redis..."
          for ($i=0; $i -lt 30; $i++) {
            $ok = docker exec modulo-ci-redis redis-cli ping 2>$null
            if ($?) { Write-Host "Redis ready"; break }
            Start-Sleep -Seconds 2
          }
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Install Playwright browsers
        working-directory: backend
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Pre-create alembic_version table
        shell: powershell
        run: |
          docker exec modulo-ci-pg psql -U modulo -d modulo -c "CREATE TABLE IF NOT EXISTS alembic_version (version_num VARCHAR(255) NOT NULL PRIMARY KEY);"
      - name: Run migrations
        working-directory: backend
        run: uv run --no-sync alembic upgrade heads
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo:modulo@localhost:5432/modulo"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start backend
        working-directory: backend
        shell: cmd
        run: start /b uv run --no-sync uvicorn modulo.api.main:app --host 0.0.0.0 --port 8000 > C:\actions-runner\_work\modulo\modulo\backend.log 2>&1
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo:modulo@localhost:5432/modulo"
          MODULO_PUBLIC_URL: "http://localhost:8000"
          MODULO_USERS: "admin:admin"
          CORS_ORIGINS: "http://localhost:4173"
          MODULO_PLUGIN_DISCOVERY: "false"
          REDIS_URL: "redis://localhost:6379/0"
      - name: Serve frontend
        working-directory: frontend
        shell: powershell
        run: Start-Process -NoNewWindow -FilePath "cmd.exe" -ArgumentList "/c npm run preview -- --port 4173"
      - name: Wait for healthz
        shell: powershell
        run: |
          for ($i=0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:8000/healthz" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { Write-Host "Backend healthy after ${i}s"; exit 0 }
            } catch {}
            Start-Sleep -Seconds 2
          }
          Write-Host "=== Backend log ==="
          Get-Content "C:\actions-runner\_work\modulo\modulo\backend.log" -TotalCount 100 -ErrorAction SilentlyContinue
          Write-Host "=== Process check ==="
          Get-Process -Name "uv" -ErrorAction SilentlyContinue | Format-Table Id, ProcessName
          exit 1
      - name: Wait for frontend
        shell: powershell
        run: npx wait-on http://localhost:4173 --timeout 30000
      - name: Run BDD tests
        working-directory: backend
        run: uv run --no-sync pytest tests/bdd/ -m e2e --base-url http://localhost:4173 -q
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo:modulo@localhost:5432/modulo"
      - name: Cleanup containers
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          docker rm -f modulo-ci-pg 2>$null
          docker rm -f modulo-ci-redis 2>$null

  docker-build:
    name: Docker build and scan
    if: github.event_name == 'push'
    runs-on: [self-hosted, windows, docker]
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, powershell-tests, gitleaks]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          push: false
          tags: modulo-backend:${{ github.sha }}

      - name: Build frontend development image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: modulo-frontend-dev:${{ github.sha }}

      - name: Build frontend production image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          load: true
          push: false
          tags: modulo-frontend:${{ github.sha }}

      - name: Scan backend image with Trivy
        id: scan-backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: modulo-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL
          exit-code: 1

      - name: Scan frontend development image with Trivy
        id: scan-frontend-dev
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: modulo-frontend-dev:${{ github.sha }}
          format: sarif
          output: trivy-frontend-dev.sarif
          severity: CRITICAL
          exit-code: 1

      - name: Scan frontend production image with Trivy
        id: scan-frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: modulo-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL
          exit-code: 1

      - name: Upload backend SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: backend

      - name: Upload frontend SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: frontend

      - name: Upload frontend development SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-dev.sarif
          category: frontend-development

      - name: Enforce vulnerability scan results
        if: steps.scan-backend.outcome == 'failure' || steps.scan-frontend-dev.outcome == 'failure' || steps.scan-frontend.outcome == 'failure'
        shell: powershell
        run: |
          Write-Host "::error::One or more container images contain critical vulnerabilities."
          exit 1

  security-audit:
    name: Security audit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, powershell-tests, gitleaks]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - name: pip-audit (backend)
        working-directory: backend
        run: uv run pip-audit
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit
      - name: Semgrep (block new findings)
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            baseline="origin/$GITHUB_BASE_REF"
          else
            baseline="HEAD^"
          fi
          uv --directory backend run --no-sync semgrep --config=.semgrep/ --baseline-commit "$baseline" --error .

  # ── Failure notifications ──────────────────────────────────────────────────

  notify-push-failure:
    name: Notify Modulo fixer
    if: failure() && github.event_name == 'push'
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, powershell-tests, gitleaks, backend-integration, bdd-e2e, docker-build, security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Send webhook to Modulo fixer
        shell: pwsh
        env:
          WEBHOOK_URL: ${{ secrets.MODULO_MERGE_FIXER_WEBHOOK_URL }}
          HMAC_SECRET: ${{ secrets.MODULO_MERGE_FIXER_HMAC_SECRET }}
        run: |
          if (-not $env:WEBHOOK_URL) { Write-Host "No webhook URL configured"; exit 0 }
          $body = @{
            repository = "${{ github.repository }}"
            run_id = "${{ github.run_id }}"
            branch = "${{ github.ref_name }}"
            event = "${{ github.event_name }}"
            run_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | ConvertTo-Json -Compress
          $ts = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $payload = "$ts.$body"
          $hmac = [System.Security.Cryptography.HMACSHA256]::new([Text.Encoding]::UTF8.GetBytes($env:HMAC_SECRET))
          $hash = $hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($payload))
          $sig = "sha256=" + ($hash | ForEach-Object { $_.ToString("x2") }) -join ''
          $headers = @{ "Content-Type" = "application/json"; "X-Modulo-Webhook-Secret" = $sig; "X-Modulo-Timestamp" = "$ts" }
          Invoke-RestMethod -Uri $env:WEBHOOK_URL -Method Post -Body $body -Headers $headers -ContentType "application/json"
          Write-Host "Modulo fixer notified"

  notify-pr-failure:
    name: Notify on PR failure
    if: failure() && github.event_name == 'pull_request'
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, powershell-tests, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR
        shell: pwsh
        run: |
          Write-Host "::error::CI checks failed for this PR. Check the workflow run for details."
