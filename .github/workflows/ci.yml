name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Lint (Backend)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src/modulo/
      - run: uv run --no-sync bandit -r src/modulo/ -ll
      - run: uv run --no-sync python -m semgrep --config=../.semgrep/ .; exit 0

  frontend:
    name: Frontend
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build

  product-map-validate:
    name: Product map validation
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Validate product map graph
        shell: powershell
        run: |
          & "C:\Users\dunca\Dropbox\Modulo\Development\Dev-Harness\tools\graph-validate.ps1" -CI

  gitleaks:
    name: Secret scan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        shell: powershell
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/gitleaks/gitleaks/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "windows.*x64" }
          if (-not $asset) { throw "No Windows x64 asset found in latest release" }
          $zip = "$env:TEMP\gitleaks.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\gitleaks" -Force
          $exe = Get-ChildItem -Path "$env:TEMP\gitleaks" -Recurse -Filter "gitleaks.exe" | Select-Object -First 1
          if (-not $exe) { throw "gitleaks.exe not found in archive" }
          $dir = $exe.DirectoryName
          echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run gitleaks
        shell: powershell
        run: gitleaks detect --no-git --source . --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
