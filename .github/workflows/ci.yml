name: "CI: Fast Validation"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
  FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="

jobs:
  # Fast jobs run on ALL events (PR + push + manual)

  backend-lint:
    name: Lint (Backend)
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src/modulo/
      - run: uv run --no-sync bandit -r src/modulo/ -ll
      - name: Semgrep (block new findings)
        working-directory: .
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            baseline="origin/$GITHUB_BASE_REF"
          else
            baseline="HEAD^"
          fi
          uv run --project backend --no-sync semgrep --config=.semgrep/ --baseline-commit "$baseline" --error .
      - run: uv run --no-sync pip-audit
      - name: Import-linter architecture contracts
        run: uv run --no-sync lint-imports

  backend-test:
    name: Test (Backend)
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run unit tests with coverage
        shell: bash
        run: ../.github/scripts/coverage-thresholds.sh
        env:
          DATABASE_URL: "postgresql+asyncpg://unused:unused@localhost/unused"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  frontend:
    name: Frontend and WCAG
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --force
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Validate Playwright test compilation
        run: npx playwright test --list
      - name: Run WCAG contrast tests
        run: npx playwright test wcag-contrast
      - run: npm run lint
      - run: npm run type-check
      - name: Run unit tests (vitest)
        # FAR-101: ubicloud-standard-2 is 2 vCPU. package.json's `test:unit`
        # script hardcodes --maxWorkers=4, which saturates both cores with 4
        # concurrently-loading jsdom environments (Vue SFC + ECharts/reka-ui/
        # vue-query) and starves setImmediate (flushPromises) by 10+s. Cap the
        # runner at 2 workers — matches actual CPU capacity, not a race-hiding
        # hack. Invoke vitest directly so the script's --maxWorkers=4 is never
        # inherited. 15000ms test/hook timeouts (vite.config.ts, from #817)
        # remain the safety net for heavy mount+settle specs.
        run: npx vitest run src --pool=threads --maxWorkers=2
      - run: npm run build
      - run: npm audit --audit-level=critical

  product-map-validate:
    name: Product map validation
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Setup PowerShell
        shell: bash
        run: |
          if ! command -v pwsh &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq powershell
          fi
      - name: Validate product map graph
        shell: bash
        run: pwsh -NoProfile -File tools/graph-validate.ps1 -CI

  manifest-validate:
    name: Manifest validation
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Setup PowerShell
        shell: bash
        run: |
          if ! command -v pwsh &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq powershell
          fi
      - name: Validate manifest.yaml
        shell: bash
        run: pwsh -NoProfile -File tools/validate-manifest.ps1 -CI

  tools-tests:
    name: PowerShell tool tests (Pester)
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Setup PowerShell
        shell: bash
        run: |
          if ! command -v pwsh &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq powershell
          fi
      - name: Run Pester suite under tools/tests
        shell: bash
        run: pwsh -NoProfile -File tools/run-pester-tests.ps1

  gitleaks:
    name: Secret scan
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



  migration-heads-check:
    name: Check migration heads
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify single migration head
        working-directory: backend
        shell: bash
        run: |
          uv sync --frozen
          uv run --no-sync python -m alembic heads 2>&1 | tee /tmp/alembic_heads.txt
          HEAD_COUNT=$(grep -c "\(head\)\|\(effective head\)" /tmp/alembic_heads.txt || true)
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "::error::Alembic migration graph has $HEAD_COUNT heads (expected 1). Create a merge migration."
            exit 1
          fi
          echo "Migration heads OK ($HEAD_COUNT head)"

      # Numeric-prefix collision check vs base. `alembic heads` above catches TWO
      # head migrations, but NOT a numeric-prefix collision: two migrations that
      # both use prefix 0065_ (e.g. the PR's 0065_cost_components + main's
      # 0065_reconcile_staging_schema) that are manually chained (one's
      # down_revision is the other) produce a single head, so the multi-head check
      # can't see the collision. We hit exactly this on PR #671 (A1); it was caught
      # only because the two files were separate heads. Fail early here instead.
      - name: Check numeric migration-prefix collisions vs base
        if: github.event_name == 'pull_request'
        working-directory: backend
        shell: bash
        run: |
          MIG_DIR="src/modulo/db/migrations/versions"
          BASE="origin/${{ github.base_ref }}"

          # Migration files changed by this PR vs its merge-base.
          CHANGED=$(git diff --name-only "${BASE}...HEAD" -- "${MIG_DIR}/" || true)
          if [ -z "$CHANGED" ]; then
            echo "No migration files changed by this PR -- skipping migration-prefix collision check"
            exit 0
          fi

          # All migration filenames on the base (main) side.
          BASE_FILES=$(git ls-tree --name-only "${BASE}" "${MIG_DIR}/" | sed 's|.*/||' || true)

          echo "Migration files changed by this PR:"
          printf '%s\n' "$CHANGED" | sed 's/^/  /'
          echo ""

          COLLISION=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Skip deletions/renamed-away files: only files still present in the
            # PR tree can collide after merge.
            if ! git cat-file -e "HEAD:${f}" 2>/dev/null; then
              echo "  (skip) not present in PR tree: ${f}"
              continue
            fi
            base_f=$(basename "$f")
            prefix=$(printf '%s' "$base_f" | cut -d_ -f1)
            while IFS= read -r bf; do
              [ -z "$bf" ] && continue
              bprefix=$(printf '%s' "$bf" | cut -d_ -f1)
              if [ "$bprefix" = "$prefix" ] && [ "$bf" != "$base_f" ]; then
                echo "::error::Numeric migration-prefix collision: ${base_f} collides with ${bf}. Renumber to the next free prefix (e.g. 0066, 0067...) and set down_revision to the actual current head."
                COLLISION=1
              fi
            done <<< "$BASE_FILES"
          done <<< "$CHANGED"

          if [ "$COLLISION" -eq 1 ]; then
            exit 1
          fi
          echo "No migration-prefix collision"
          exit 0

  # Break-glass deploy gate = acceptance (b) of the break-glass admin recovery
  # plan §3: automated staging verification = the boot-time allow-list assertion
  # + the connectivity smoke that FAILS boot when ENABLED AND
  # boot-failure-mode=fail. Runs the breakglass_gate-tagged regression suite
  # (test_break_glass_gate.py) against testcontainers Postgres with the
  # PRODUCTION bootstrap_role.py, in BOTH directions (clean config passes, a
  # rogue grant FAILS the assertion) plus the transient-vs-fatal discriminator.
  break-glass-deploy-gate:
    name: Break-glass deploy gate
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Break-glass boot allow-list + connectivity smoke
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run --no-sync pytest tests/integration/test_break_glass_gate.py -q --tb=short --timeout=300 -p no:warnings

  notify-pr-failure:
    name: Trigger Branch Fixer
    # The `manual-delivery` label must only suppress the webhook dispatch step
    # below, NOT the whole job: a job-level skip surfaces this check as
    # "skipped" in the check-runs API, which the PR Reviewer flags as a
    # non-green signal on every such PR. The check itself always reports
    # success on pull_request events; the label guard lives on the dispatch
    # step so it keeps its documented meaning ("do not auto-dispatch the
    # Branch Fixer").
    if: github.event_name == 'pull_request' && always()
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, tools-tests, gitleaks, break-glass-deploy-gate]
    runs-on: ubicloud-standard-2
    permissions:
      actions: write
      pull-requests: write
    steps:
      - name: Check retry limit
        id: retry-check
        if: (failure() || cancelled()) && !contains(github.event.pull_request.labels.*.name, 'manual-delivery')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          BRANCH="${{ github.event.pull_request.head.ref }}"

          # Count how many times the branch fixer has already pushed fix commits
          # to this PR. Each successful fix produces exactly one commit with
          # committer "modulo-branch-fixer".
          FIX_COUNT=$(gh api "/repos/${{ github.repository }}/pulls/${PR_NUM}/commits?per_page=100" \
            --jq '[.[] | select(.commit.committer.name == "modulo-branch-fixer")] | length' 2>/dev/null || echo "0")

          echo "fix_attempts=$FIX_COUNT" >> "$GITHUB_OUTPUT"
          echo "PR #${PR_NUM} on '${BRANCH}' -- branch fixer has pushed $FIX_COUNT fix commit(s)."

          if [ "$FIX_COUNT" -ge 3 ]; then
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Branch fixer exhausted after $FIX_COUNT attempts against PR #${PR_NUM}."
            gh pr comment "$PR_NUM" --body "## Branch Fixer Exhausted

            The automated branch fixer has attempted $FIX_COUNT fixes against this PR but CI is still failing. Manual intervention is required.

            The branch fixer will not retry again on this PR."
          else
            echo "exhausted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Modulo Branch Fixer
        if: (failure() || cancelled()) && steps.retry-check.outputs.exhausted == 'false' && !contains(github.event.pull_request.labels.*.name, 'manual-delivery')
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUM: ${{ github.event.pull_request.number }}
          WEBHOOK_URL: ${{ secrets.MODULO_BRANCH_FIXER_WEBHOOK_URL }}
          HMAC_SECRET: ${{ secrets.MODULO_BRANCH_FIXER_HMAC_SECRET }}
        shell: bash
        run: |
          TIMESTAMP=$(date +%s)
          BODY=$(cat << ENDJSON
          {
            "branchName": "${BRANCH}",
            "prNumber": ${PR_NUM},
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "failureDescription": "CI checks failed on PR #${PR_NUM} (branch: ${BRANCH})"
          }
          ENDJSON
          )
          echo "PR #${PR_NUM} on branch '${BRANCH}' -- CI checks failed."
          echo "Sending to Modulo Branch Fixer pipeline..."
          HMAC=$(echo -n "${TIMESTAMP}.${BODY}" | openssl dgst -sha256 -hmac "${HMAC_SECRET}" | sed 's/^.* //')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
            -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
            -d "${BODY}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY_RESP=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "202" ]; then
            echo "Modulo Branch Fixer accepted (run: $(echo $BODY_RESP | jq -r '.run_id // "unknown"'))"
          elif [ "$HTTP_CODE" = "429" ]; then
            echo "::warning::Modulo Branch Fixer rate-limited -- $(echo $BODY_RESP | jq -r '.detail // "too many requests"')"
          else
            echo "::warning::Modulo Branch Fixer returned HTTP $HTTP_CODE: $(echo $BODY_RESP | jq -r '.detail // "unknown"')"
          fi

      - name: Report Branch Fixer check status
        if: success()
        run: echo "Branch Fixer trigger check passed (all required checks green or fixer dispatched)."

  notify-pr-review:
    name: Trigger PR Reviewer
    if: github.event_name == 'pull_request' && success()
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, tools-tests, gitleaks, break-glass-deploy-gate]
    runs-on: ubicloud-standard-2
    steps:
      - name: Send webhook to Modulo PR Review Agent
        env:
          MODULO_WEBHOOK_URL: ${{ secrets.MODULO_PR_REVIEW_WEBHOOK_URL }}
          MODULO_WEBHOOK_SECRET: ${{ secrets.MODULO_PR_REVIEW_WEBHOOK_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          TIMESTAMP=$(date +%s)
          PAYLOAD=$(cat << ENDJSON
          {
            "action": "check_run",
            "repository": {"full_name": "${REPO}"},
            "pull_request": {
              "number": ${PR_NUMBER},
              "head": {"sha": "${SHA}", "ref": "${BRANCH}"}
            }
          }
          ENDJSON
          )
          BODY=$(echo "${PAYLOAD}")
          HMAC=$(echo -n "${TIMESTAMP}.${BODY}" | openssl dgst -sha256 -hmac "${MODULO_WEBHOOK_SECRET}" | sed 's/^.* //')

          # Retry with exponential backoff on 429/5xx (max 5 attempts, ~5 min total)
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${MODULO_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
              -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
              -d "${BODY}")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY_RESP=$(echo "$RESPONSE" | sed '$d')
            if [ "$HTTP_CODE" = "202" ]; then
              echo "PR Reviewer accepted (run: $(echo $BODY_RESP | jq -r '.run_id // "unknown"'))"
              break
            elif [ "$HTTP_CODE" = "429" ] || [ "$HTTP_CODE" -ge 500 ]; then
              DELAY=$((2 ** (i - 1) * 5))
              echo "::warning::PR Reviewer returned HTTP $HTTP_CODE (attempt $i/5) — retrying in ${DELAY}s"
              sleep "$DELAY"
            else
              echo "::warning::PR Reviewer returned HTTP $HTTP_CODE: $(echo $BODY_RESP | jq -r '.detail // "unknown"')"
              break
            fi
          done
          echo "PR Reviewer notified"
