name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Lint (Backend)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src/modulo/
      - run: uv run --no-sync bandit -r src/modulo/ -ll
      - run: uv run --no-sync semgrep --config=../.semgrep/ .

  frontend:
    name: Frontend
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build

  gitleaks:
    name: Secret scan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        shell: powershell
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/gitleaks/gitleaks/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*windows*amd64*" -or $_.name -like "*windows*x86_64*" }
          if (-not $asset) { $asset = $release.assets | Where-Object { $_.name -like "*windows*" } | Select-Object -First 1 }
          $zip = "$env:TEMP\gitleaks.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\gitleaks" -Force
          $dir = "$env:TEMP\gitleaks"
          if (-not (Test-Path "$dir\gitleaks.exe")) {
            $dir = (Get-ChildItem -Path "$env:TEMP\gitleaks" -Recurse -Filter "gitleaks.exe" | Select-Object -First 1).DirectoryName
          }
          echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run gitleaks
        shell: powershell
        run: gitleaks detect --no-git --source . --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
