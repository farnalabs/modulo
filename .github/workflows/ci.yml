name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy .
        continue-on-error: true
      - run: uv run bandit -r .
      - run: uv run semgrep --config=../.semgrep/ .

  backend-test:
    name: Test (Backend ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, mariadb]
        include:
          - backend: sqlite
            database_url: "sqlite+aiosqlite:///./test.db"
            modulo_db: sqlite
            pytest_marker: "not awaiting-implementation and not integration"
          - backend: mariadb
            database_url: "mysql+asyncmy://modulo:modulo@localhost:5435/modulo"
            modulo_db: mariadb
            pytest_marker: "not awaiting-implementation and not integration"
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: modulo
          MARIADB_DATABASE: modulo
          MARIADB_USER: modulo
          MARIADB_PASSWORD: modulo
        ports:
          - 5435:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m '${{ matrix.pytest_marker }}' --timeout 60 -q
        env:
          SECRET_KEY: "ci-secret-key-not-for-production"
          FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="
          DATABASE_URL: ${{ matrix.database_url }}
          MODULO_DB: ${{ matrix.modulo_db }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
