name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src/modulo/
      - run: uv run --no-sync bandit -r src/modulo/ -ll
      - run: uv run --no-sync semgrep --config=../.semgrep/ .
      - run: uv run --no-sync pip-audit

  backend-test:
    name: Test (Backend) - ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run unit tests with coverage
        shell: pwsh
        run: ../.github/scripts/coverage-thresholds.ps1
        env:
          DATABASE_URL: "postgresql+asyncpg://unused:unused@localhost/unused"
          SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
          FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="
      - name: Schemathesis API fuzz testing
        shell: pwsh
        run: uv run --no-sync pytest tests/integration/test_schemathesis.py -x --timeout=120
        env:
          DATABASE_URL: "postgresql+asyncpg://unused:unused@localhost/unused"
          SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
          FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.os }}
          path: backend/coverage.xml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build
      - run: npm audit

  docker-build:
    name: Build (Docker)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        shell: powershell
        run: docker build ./backend -t modulo-backend:${{ github.sha }}
      - name: Build frontend image
        shell: powershell
        run: docker build ./frontend -t modulo-frontend:${{ github.sha }}

  product-map-validate:
    name: Product map validation
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Validate product map graph
        shell: powershell
        run: |
          & tools\graph-validate.ps1 -CI

  manifest-validate:
    name: Manifest validation
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifest.yaml
        shell: powershell
        run: |
          & tools\validate-manifest.ps1 -CI

  gitleaks:
    name: Secret scan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        shell: powershell
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/gitleaks/gitleaks/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "windows.*x64" }
          if (-not $asset) { throw "No Windows x64 asset found in latest release" }
          $zip = "$env:TEMP\gitleaks.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\gitleaks" -Force
          $exe = Get-ChildItem -Path "$env:TEMP\gitleaks" -Recurse -Filter "gitleaks.exe" | Select-Object -First 1
          if (-not $exe) { throw "gitleaks.exe not found in archive" }
          $dir = $exe.DirectoryName
          echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run gitleaks
        shell: powershell
        run: gitleaks detect --no-git --source . --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
