name: "CI: Fast Validation"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
  FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="

jobs:
  # Fast jobs run on ALL events (PR + push + manual)

  backend-lint:
    name: Lint (Backend)
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src/modulo/
      - run: uv run --no-sync bandit -r src/modulo/ -ll
      - name: Semgrep (block new findings)
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            baseline="origin/$GITHUB_BASE_REF"
          else
            baseline="HEAD^"
          fi
          uv run --no-sync semgrep --config=../.semgrep/ --baseline-commit "$baseline" --error .
      - run: uv run --no-sync pip-audit
      - name: Import-linter architecture contracts
        run: uv run --no-sync lint-imports

  backend-test:
    name: Test (Backend)
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run unit tests with coverage
        shell: bash
        run: ../.github/scripts/coverage-thresholds.sh
        env:
          DATABASE_URL: "postgresql+asyncpg://unused:unused@localhost/unused"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  frontend:
    name: Frontend and WCAG
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --force
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Validate Playwright test compilation
        run: npx playwright test --list
      - name: Run WCAG contrast tests
        run: npx playwright test wcag-contrast
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build
      - run: npm audit --audit-level=critical

  product-map-validate:
    name: Product map validation
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Setup PowerShell
        shell: bash
        run: |
          if ! command -v pwsh &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq powershell
          fi
      - name: Validate product map graph
        shell: bash
        run: pwsh -NoProfile -File tools/graph-validate.ps1 -CI

  manifest-validate:
    name: Manifest validation
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Setup PowerShell
        shell: bash
        run: |
          if ! command -v pwsh &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq powershell
          fi
      - name: Validate manifest.yaml
        shell: bash
        run: pwsh -NoProfile -File tools/validate-manifest.ps1 -CI


  gitleaks:
    name: Secret scan
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



  notify-pr-failure:
    name: Trigger Branch Fixer
    if: github.event_name == 'pull_request' && always()
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, gitleaks]
    runs-on: ubicloud-standard-2
    permissions:
      actions: write
      pull-requests: write
    steps:
      - name: Check retry limit
        id: retry-check
        if: failure() || cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          BRANCH="${{ github.event.pull_request.head.ref }}"

          # Count how many times the branch fixer has already pushed fix commits
          # to this PR. Each successful fix produces exactly one commit with
          # committer "modulo-branch-fixer".
          FIX_COUNT=$(gh api "/repos/${{ github.repository }}/pulls/${PR_NUM}/commits?per_page=100" \
            --jq '[.[] | select(.commit.committer.name == "modulo-branch-fixer")] | length' 2>/dev/null || echo "0")

          echo "fix_attempts=$FIX_COUNT" >> "$GITHUB_OUTPUT"
          echo "PR #${PR_NUM} on '${BRANCH}' -- branch fixer has pushed $FIX_COUNT fix commit(s)."

          if [ "$FIX_COUNT" -ge 3 ]; then
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Branch fixer exhausted after $FIX_COUNT attempts against PR #${PR_NUM}."
            gh pr comment "$PR_NUM" --body "## Branch Fixer Exhausted

            The automated branch fixer has attempted $FIX_COUNT fixes against this PR but CI is still failing. Manual intervention is required.

            The branch fixer will not retry again on this PR."
          else
            echo "exhausted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Modulo Branch Fixer
        if: (failure() || cancelled()) && steps.retry-check.outputs.exhausted == 'false'
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUM: ${{ github.event.pull_request.number }}
          WEBHOOK_URL: ${{ secrets.MODULO_BRANCH_FIXER_WEBHOOK_URL }}
          HMAC_SECRET: ${{ secrets.MODULO_BRANCH_FIXER_HMAC_SECRET }}
        shell: bash
        run: |
          TIMESTAMP=$(date +%s)
          BODY=$(cat << ENDJSON
          {
            "branchName": "${BRANCH}",
            "prNumber": ${PR_NUM},
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "failureDescription": "CI checks failed on PR #${PR_NUM} (branch: ${BRANCH})"
          }
          ENDJSON
          )
          echo "PR #${PR_NUM} on branch '${BRANCH}' -- CI checks failed."
          echo "Sending to Modulo Branch Fixer pipeline..."
          HMAC=$(echo -n "${TIMESTAMP}.${BODY}" | openssl dgst -sha256 -hmac "${HMAC_SECRET}" | sed 's/^.* //')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
            -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
            -d "${BODY}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY_RESP=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "202" ]; then
            echo "Modulo Branch Fixer accepted (run: $(echo $BODY_RESP | jq -r '.run_id // "unknown"'))"
          elif [ "$HTTP_CODE" = "429" ]; then
            echo "::warning::Modulo Branch Fixer rate-limited -- $(echo $BODY_RESP | jq -r '.detail // "too many requests"')"
          else
            echo "::warning::Modulo Branch Fixer returned HTTP $HTTP_CODE: $(echo $BODY_RESP | jq -r '.detail // "unknown"')"
          fi

  notify-pr-review:
    name: Trigger PR Reviewer
    if: github.event_name == 'pull_request' && success()
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, gitleaks]
    runs-on: ubicloud-standard-2
    steps:
      - name: Send webhook to Modulo PR Review Agent
        env:
          MODULO_WEBHOOK_URL: ${{ secrets.MODULO_PR_REVIEW_WEBHOOK_URL }}
          MODULO_WEBHOOK_SECRET: ${{ secrets.MODULO_PR_REVIEW_WEBHOOK_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          TIMESTAMP=$(date +%s)
          PAYLOAD=$(cat << ENDJSON
          {
            "action": "check_run",
            "repository": {"full_name": "${REPO}"},
            "pull_request": {
              "number": ${PR_NUMBER},
              "head": {"sha": "${SHA}", "ref": "${BRANCH}"}
            }
          }
          ENDJSON
          )
          BODY=$(echo "${PAYLOAD}")
          HMAC=$(echo -n "${TIMESTAMP}.${BODY}" | openssl dgst -sha256 -hmac "${MODULO_WEBHOOK_SECRET}" | sed 's/^.* //')

          # Retry with exponential backoff on 429/5xx (max 5 attempts, ~5 min total)
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${MODULO_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
              -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
              -d "${BODY}")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY_RESP=$(echo "$RESPONSE" | sed '$d')
            if [ "$HTTP_CODE" = "202" ]; then
              echo "PR Reviewer accepted (run: $(echo $BODY_RESP | jq -r '.run_id // "unknown"'))"
              break
            elif [ "$HTTP_CODE" = "429" ] || [ "$HTTP_CODE" -ge 500 ]; then
              DELAY=$((2 ** (i - 1) * 5))
              echo "::warning::PR Reviewer returned HTTP $HTTP_CODE (attempt $i/5) — retrying in ${DELAY}s"
              sleep "$DELAY"
            else
              echo "::warning::PR Reviewer returned HTTP $HTTP_CODE: $(echo $BODY_RESP | jq -r '.detail // "unknown"')"
              break
            fi
          done
          echo "PR Reviewer notified"

  modulo-smoke-test:
    name: Run Modulo Smoke Test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, gitleaks]
    runs-on: ubicloud-standard-2
    steps:
      - name: Smoke test not applicable
        if: github.event_name != 'push'
        run: echo "Smoke test only runs on push events; not applicable for event '${{ github.event_name }}'."
      - name: Trigger Sandbox E2E Test and verify completion
        if: github.event_name == 'push' && needs.backend-lint.result == 'success' && needs.backend-test.result == 'success' && needs.frontend.result == 'success' && needs.product-map-validate.result == 'success' && needs.manifest-validate.result == 'success' && needs.gitleaks.result == 'success'
        env:
          WEBHOOK_URL: ${{ secrets.MODULO_SMOKE_TEST_WEBHOOK_URL }}
          HMAC_SECRET: ${{ secrets.MODULO_SMOKE_TEST_HMAC_SECRET }}
          API_KEY: ${{ secrets.MODULO_SMOKE_TEST_API_KEY }}
        run: |
          TIMESTAMP=$(date +%s)
          PAYLOAD=$(cat << ENDJSON
          {"test":"ci-smoke","timestamp":"${TIMESTAMP}"}
          ENDJSON
          )
          BODY=$(echo "${PAYLOAD}")
          HMAC=$(echo -n "${TIMESTAMP}.${BODY}" | openssl dgst -sha256 -hmac "${HMAC_SECRET}" | sed "s/^.* //")
          echo "Triggering smoke test..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
            -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
            -d "${BODY}")
          HTTP_CODE=$(echo "${RESPONSE}" | tail -1)
          BODY_RESP=$(echo "${RESPONSE}" | sed "$ d")
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "202" ]; then echo "::error::Trigger failed"; exit 1; fi
          RUN_ID=$(echo "${BODY_RESP}" | python3 -c "import sys,json; print(json.load(sys.stdin).get(\"run_id\",\"\"))")
          echo "Run: ${RUN_ID}"
          for i in $(seq 1 30); do
            sleep 2
            STATUS_RESP=$(curl -s -H "Authorization: Bearer ${API_KEY}" "https://app.modulo.run/api/v1/runs/${RUN_ID}")
            STATUS=$(echo "${STATUS_RESP}" | python3 -c "import sys,json; print(json.load(sys.stdin).get(\"status\",\"\"))")
            ERROR=$(echo "${STATUS_RESP}" | python3 -c "import sys,json; print(json.load(sys.stdin).get(\"error_code\",\"\"))")
            echo "  status=${STATUS} error=${ERROR}"
            if [ "${STATUS}" = "complete" ]; then echo "- Smoke test passed!"; exit 0; fi
            if [ "${STATUS}" = "failed" ]; then echo "::error::Failed: ${ERROR}"; exit 1; fi
          done
          echo "::error::Timed out"; exit 1
