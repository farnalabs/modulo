name: "CI: Fast Validation"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # NOTE (FAR-773): the weekly Bundled Runner backstop cron deliberately does
  # NOT live here. A schedule trigger fires the ENTIRE fast-validation suite;
  # the backstop only needs the one harness job, so it now lives in
  # runner-ci-backstop.yml (weekly cron -> the shared reusable
  # runner-ci-harness.yml with force=true).

env:
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  FERNET_KEY: ${{ secrets.FERNET_KEY }}
  # Authenticate GitHub git fetches so `uv sync --frozen` can resolve git-pinned
  # dependencies (e.g. pytest-bdd @ refs/pull/827/head) without an anonymous
  # fetch-by-SHA, which GitHub rejects from CI runners.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf'
  GIT_CONFIG_VALUE_0: "https://github.com/"

permissions:
  contents: read

# FAR-1427: cancel runs superseded by a newer push to the same PR so a
# Branch Fixer / reviewer push storm does not bill a full ~56 runner-min suite
# for every intermediate SHA. Cancellation is scoped to pull_request events
# ONLY: every other event (push to main, workflow_dispatch) gets a group keyed
# on the unique run id, so it can never be cancelled - nor can a queued main
# run be displaced as the single "pending" run of a shared group.
# notify-pr-failure treats `cancelled()` as a failure, so it carries a
# superseded-SHA guard (see the "Skip if this run was superseded" step).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast jobs run on ALL events (PR + push + manual)

  changes:
    # FAR-1427: one cheap, checkout-free path detector feeding the path gates
    # on the heavy jobs below (Frontend and WCAG, Tier 1b testcontainers,
    # SonarCloud scan). It reads the PR file list from the GitHub API (no
    # checkout, no toolchain: a few seconds) and publishes three outputs:
    #
    #   frontend      - the Frontend and WCAG job has something to validate:
    #                   anything under frontend/, the e2e route-coverage script,
    #                   or this workflow itself.
    #   sonar         - the change is NOT docs-only (markdown + docs/ outside
    #                   docs/api/examples/). SonarCloud analyses source,
    #                   workflows, Dockerfiles and config, so anything else keeps
    #                   it running.
    #   backend_heavy - the change is NOT confined to frontend/ + docs. The
    #                   Tier 1b suites drive backend connectors/model servers
    #                   against containers and read nothing under frontend/ or
    #                   docs/ (verified by grep).
    #
    # Every output is "true" for every event except pull_request (push to main,
    # workflow_dispatch, merge-queue dispatches ALWAYS run everything), and the
    # detector FAILS OPEN: any API error, a 3000+ file PR (the API's cap), or
    # an empty list sets all three to true with a ::warning::. Gated jobs skip
    # at STEP level, never job level, so their check still reports "success"
    # (a job-level skip is surfaced as a non-green "skipped" check, which the
    # PR Reviewer flags - same reason notify-pr-failure gates at step level).
    #
    # Test (Backend) is deliberately NOT gated: backend/tests/architecture/
    # read frontend/ (product map, manifest, login field), and its coverage
    # artifact feeds SonarCloud and the coverage gate.
    name: Detect changed paths
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      sonar: ${{ steps.detect.outputs.sonar }}
      backend_heavy: ${{ steps.detect.outputs.backend_heavy }}
    steps:
      - name: Detect changed paths
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          all_true() {
            {
              echo "frontend=true"
              echo "sonar=true"
              echo "backend_heavy=true"
            } >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event ${EVENT_NAME}: path gates disabled - running everything."
            all_true
            exit 0
          fi
          # `rc=0; out=$(...) || rc=$?` survives Actions' `bash -e -o pipefail`
          # so a failed API call reaches the fail-open branch below instead of
          # aborting the step. Rename sources are included so moving a file out
          # of a gated area still counts as touching it.
          rc=0
          FILES="$(gh api --paginate "/repos/${REPO}/pulls/${PR_NUM}/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')" || rc=$?
          COUNT=$(printf '%s\n' "$FILES" | grep -c . || true)
          if [ "$rc" -ne 0 ] || [ "$COUNT" -eq 0 ] || [ "$COUNT" -ge 3000 ]; then
            echo "::warning::could not obtain a reliable changed-file list (rc=${rc}, count=${COUNT}); running everything (fail open)"
            all_true
            exit 0
          fi
          echo "Changed files (${COUNT}):"
          printf '%s\n' "$FILES" | sort -u | sed 's/^/  /'
          FRONTEND=false; SONAR=true; BACKEND=true
          if printf '%s\n' "$FILES" | grep -qE '^(frontend/|\.github/workflows/ci\.yml$|\.github/scripts/check_e2e_route_coverage\.py$)'; then
            FRONTEND=true
          fi
          # docs-only: every file is markdown, or lives under docs/ (but not the
          # docs/api/examples/ code samples Sonar analyses).
          NON_DOCS=$(printf '%s\n' "$FILES" | awk 'NF && !/\.mdx?$/ && (/^docs\/api\/examples\// || !/^docs\//)' | wc -l)
          if [ "$NON_DOCS" -eq 0 ]; then
            SONAR=false
          fi
          # backend-heavy: false only when everything is under frontend/ or docs.
          NON_BACKEND_FREE=$(printf '%s\n' "$FILES" | awk 'NF && !/^frontend\// && !/\.mdx?$/ && (/^docs\/api\/examples\// || !/^docs\//)' | wc -l)
          if [ "$NON_BACKEND_FREE" -eq 0 ]; then
            BACKEND=false
          fi
          {
            echo "frontend=${FRONTEND}"
            echo "sonar=${SONAR}"
            echo "backend_heavy=${BACKEND}"
          } >> "$GITHUB_OUTPUT"
          echo "frontend=${FRONTEND} sonar=${SONAR} backend_heavy=${BACKEND}"

  backend-lint:
    name: Lint (Backend)
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-build --no-sync ruff check .
      - name: Ruff format check
        run: uv run --no-build --no-sync ruff format --check .
      - run: uv run --no-build --no-sync mypy src/modulo/
      - run: uv run --no-build --no-sync bandit -r src/modulo/ -ll
      - name: Vulture (block new dead code)
        # BLOCKING: no continue-on-error, no `|| true`. The repo-root
        # .vulture_whitelist.py (framework-contract + test-referenced symbols)
        # is the only sanctioned dead-code escape hatch; anything else fails CI.
        # At --min-confidence 60 unused functions/methods/classes block (see
        # scripts/run_vulture.py for the full finding-type semantics).
        working-directory: .
        run: uv run --no-build --project backend --no-sync python scripts/run_vulture.py
      - name: Semgrep (block new findings)
        working-directory: .
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            baseline="origin/$GITHUB_BASE_REF"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            baseline="HEAD^"
          else
            baseline=""
          fi
          if [ -n "$baseline" ]; then
            uv run --no-build --project backend --no-sync semgrep --config=.semgrep/ --baseline-commit "$baseline" --error .
          else
            uv run --no-build --project backend --no-sync semgrep --config=.semgrep/ --error .
          fi
      - name: Semgrep rule tests (--test)
        # Exercise the rule fixture tree so a rule's `# ruleid` / `# ok` guards
        # actually enforce the intended match. The directory form (`--test
        # .semgrep/`) is dead on this semgrep version for a dot-prefixed config
        # dir (get_config_filenames drops configs whose parent starts with `.`),
        # so pair each rule with its matching-stem fixture explicitly. `set -e`
        # aborts this step (red CI) if any fixture fails to match.
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          for rule in .semgrep/no-raw-httpx-client.yml; do
            base="$(basename "$rule" .yml)"
            if [ -f ".semgrep/tests/${base}.py" ]; then
              uv run --no-build --project backend --no-sync semgrep --config="$rule" --test ".semgrep/tests/${base}.py"
            fi
          done
      - name: pip-audit (bounded retry on transient PyPI service errors)
        # pip-audit's PyPI vulnerability service raises ServiceError on any
        # non-404 HTTP error (pip_audit/_service/pypi.py: `raise ServiceError
        # from http_error`), so a transient `503 Server Error: Backend is
        # unhealthy` from pypi.org fails this required check outright — observed
        # on main at 675eac3b. Retry ONLY when the log shows that transient
        # signature (or a PyPI connection error), never when pip-audit reports
        # actual vulnerabilities, so a genuine finding is never masked. Mirrors
        # the signature-gated retry used for the SonarCloud scan below.
        run: |
          set -uo pipefail
          LOG="$(mktemp)"
          trap 'rm -f "$LOG"' EXIT
          for attempt in 1 2 3; do
            : > "$LOG"
            set +e
            uv run --no-build --no-sync pip-audit 2>&1 | tee "$LOG"
            RC=${PIPESTATUS[0]}
            set -e
            if [ "$RC" -eq 0 ]; then
              echo "::notice::pip-audit succeeded on attempt ${attempt}/3."
              exit 0
            fi
            if grep -qE "pip_audit\._service\.interface\.(ServiceError|ConnectionError)|[0-9]{3} Server Error|Backend is unhealthy|Could not connect to PyPI|PyPI is not redirecting properly" "$LOG"; then
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::pip-audit hit a transient PyPI service error (attempt ${attempt}/3); retrying."
                sleep $((attempt * 10))
              else
                echo "::warning::pip-audit hit a transient PyPI service error on the final attempt (3/3); not retrying."
              fi
              continue
            fi
            echo "::error::pip-audit failed with a non-transient error or found vulnerabilities; not retrying."
            exit "$RC"
          done
          echo "::error::pip-audit still hit a transient PyPI service error after 3 attempts."
          exit 1
      - name: Import-linter architecture contracts
        run: uv run --no-build --no-sync lint-imports
      - name: Validate sidebar nav translations
        working-directory: .
        run: uv run --no-build --project backend --no-sync python scripts/run_validate_translations.py
      - name: Trivy filesystem scan (dependency CVEs + misconfigs)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'
          # Pin the vulnerability DB to the canonical GHCR repository instead of
          # relying on Trivy's default priority list
          # [mirror.gcr.io/aquasec/trivy-db:2, ghcr.io/aquasecurity/trivy-db:2].
          # The GCR mirror intermittently serves a 404 on the artifact layer
          # (`unexpected status code 404 Not Found`), and Trivy's
          # shouldTryOtherRepo() only falls through to the next repository on a
          # transport error (TOOMANYREQUESTS) or BLOB_UNKNOWN - a plain 404 is
          # neither, so it aborts on the first repo and never tries ghcr.io,
          # failing this required check on a transient mirror outage (observed
          # on PR #1253 head 8dbed89f: job 111383553258). Pinning to the
          # canonical repo still allows a re-run to recover, but removes the
          # flaky mirror from the critical path.
          db-repository: 'ghcr.io/aquasecurity/trivy-db:2'
          skip-dirs: '**/.venv,**/node_modules,**/.git,**/.agents,**/.pytest_cache,**/dist,**/build'

  backend-test:
    name: Test (Backend)
    # FAR-1427 (cheap-first): wait for Lint (Backend) (~2.4 min) so a push that
    # fails lint/mypy/bandit/vulture/semgrep does not burn ~25 runner-min of
    # unit tests. Trade-off: +~2.4 min wall-clock on every green run. If lint
    # fails this job is skipped and every dependent (coverage-gate, Sonar) is
    # skipped with it - the run still concludes FAILURE because lint failed,
    # and notify-pr-failure's failure() sees the failed ancestor.
    needs: [backend-lint]
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run unit tests with coverage
        shell: bash
        run: ../.github/scripts/coverage-thresholds.sh
        env:
          DATABASE_URL: "postgresql+asyncpg://unused:${{ secrets.POSTGRES_PASSWORD || 'unused' }}@localhost/unused"
      - name: Run architecture tests
        # The architecture suite scans all of src/modulo for structural
        # violations (raw SQL f-strings, sensitive data logging, module-level
        # side effects, bare session.rollback, login-field drift, Dockerfile
        # Python version drift). It previously only ran via pre-commit for a
        # single file, which let a raw f-string SQL regression (probe.py) slip
        # through on main (PR #690). Wire the whole package into CI so the
        # enforcement actually gates merges.
        shell: bash
        run: uv run --no-build --no-sync pytest tests/architecture/ -q --tb=short --timeout=120 -p no:warnings -n auto
      - name: Run connector contract tests
        # The connector contract suite drives each connector (filesystem,
        # REST, shell, npm, pypi) against a real in-process HTTP server or
        # a recorded VCR cassette — no Docker and no external network, so
        # it is safe for this job. It lives outside tests/unit, tests/bdd
        # and tests/integration, so no workflow collected it and it could
        # regress silently. Run it here alongside the other non-Docker
        # suites.
        shell: bash
        run: uv run --no-build --no-sync pytest tests/connectors/ -q --tb=short --timeout=180 -p no:warnings
      - name: Run email settings BDD scenarios
        # The admin email-settings BDD feature file is self-contained (no
        # browser/live app), so it runs here rather than only in the unit
        # suite. Without this step, CI never exercises the email-settings
        # BDD scenarios.
        shell: bash
        run: >
          uv run --no-build --no-sync pytest tests/bdd/steps/test_email_settings.py
          tests/bdd/features/infra/test_health_steps.py
          -q --tb=short --timeout=120 -p no:warnings
      - name: Run repaired step-rot BDD modules
        # The step-definition repairs for auth/eval/hitl (FAR-246) live in
        # test_auth, test_eval, test_eval_block_steps and test_hitl. These are
        # self-contained (no browser/live app), so wire them into CI — a green
        # PR that never exercised the repaired steps would not validate them.
        # test_eval_scorer_gates registers the llm_judge/regex scorer feature
        # files (product-map review pass), also self-contained.
        shell: bash
        run: |
          uv run --no-build --no-sync pytest tests/bdd/steps/test_auth.py tests/bdd/steps/test_eval.py \
            tests/bdd/steps/test_eval_block_steps.py tests/bdd/steps/test_hitl.py \
            tests/bdd/steps/test_eval_scorer_gates.py \
            -q --tb=short --timeout=120 -p no:warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  integration-changed:
    # Runs the integration test files a PR (or push) actually changed. The
    # full integration suite only runs in the deploy pipeline's pre-deploy
    # gate, so a broken integration test merged to main sails through PR CI
    # and blocks every deploy (2026-08-14: PR #1266 added an assert-after-
    # delete to an integration test; 6 deploys failed before it was
    # caught). Skips green when no backend/tests/integration/ files changed.
    name: Integration tests (changed)
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Detect changed integration test files
        id: changed
        shell: bash
        # The job sets `working-directory: backend`, which makes the
        # `backend/tests/integration/` pathspec below resolve to
        # `backend/backend/tests/integration/` (always empty) and silently skip
        # every PR. Run the Detect step from the repo root so the pathspec
        # matches the real tree (cf. PR #224 review feedback).
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # actions/checkout checks out the GitHub merge commit for the PR
            # (refs/pull/N/merge); its first parent IS the base branch, so diff
            # against that directly. Do NOT use a remote-tracking origin/<base>
            # ref here: actions/checkout does not always fetch it, and
            # `git diff origin/main HEAD` then errors (suppressed by `|| true`)
            # yielding an empty list and silently skipping every integration
            # test (PR #2190). Fall back to origin/<base> only when HEAD is not
            # a merge commit.
            if git rev-parse -q --verify "HEAD^2" >/dev/null 2>&1; then
              BASE="HEAD^"
            else
              BASE="origin/$GITHUB_BASE_REF"
            fi
          else
            BASE="HEAD^"
          fi
          CHANGED="$(git diff --name-only "$BASE" HEAD -- backend/tests/integration/ || true)"
          # Keep only files that actually exist in the PR tree - a deleted or
          # renamed-away integration test would otherwise be fed to pytest below
          # and error "file or directory not found" (exit 4). Mirrors the
          # migration-prefix collision check's HEAD-existence guard.
          #
          # Keep only pytest-collectable test modules (test_*.py / *_test.py).
          # Support files under tests/integration/ - conftest.py, __init__.py -
          # are NOT collectable: passing one to pytest collects 0 tests and it
          # exits 5 ("no tests collected"), failing the job although nothing is
          # broken (PR #614 changed only conftest.py). A conftest-only change is
          # still exercised by the deploy pipeline's pre-deploy integration gate,
          # which runs the full suite with Docker available.
          : > /tmp/integration-changed.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            base="${f##*/}"
            case "$base" in
              test_tier1b_*.py)
                # The Tier 1b testcontainers suites own dedicated CI jobs with
                # boot budgets sized for their real readiness windows: the light
                # set runs in tier1b-light (--timeout=900) and the heavy set
                # (gitlab, vllm, tgi) is nightly-only in tier1b-nightly
                # (--timeout=3600). Feeding them to this job's --timeout=300
                # turns their real boot (sonarqube 600s, gitlab 1800s) into
                # pytest-timeout ERRORs (PR #773). Light coverage is unaffected:
                # tier1b-light runs on every PR regardless of changed paths.
                echo "  (skip) Tier 1b suite has a dedicated CI job: ${f}"
                continue
                ;;
              test_*.py|*_test.py) ;;
              *)
                echo "  (skip) not a collectable test module: ${f}"
                continue
                ;;
            esac
            if ! git cat-file -e "HEAD:${f}" 2>/dev/null; then
              echo "  (skip) not present in PR tree: ${f}"
              continue
            fi
            printf '%s\n' "${f#backend/}" >> /tmp/integration-changed.txt
          done <<< "$CHANGED"
          CHANGED="$(tr '\n' ' ' < /tmp/integration-changed.txt | sed 's/ *$//')"
          echo "changed_files=${CHANGED}" >> "$GITHUB_OUTPUT"
          if [ -n "$CHANGED" ]; then
            echo "Changed integration test files: ${CHANGED}"
          else
            echo "No collectable integration test modules changed - skipping."
          fi
      - name: Start Postgres (integration dependency)
        if: steps.changed.outputs.changed_files != ''
        shell: bash
        run: |
          docker rm -f modulo-ci-pg 2>/dev/null || true
          docker run -d --name modulo-ci-pg \
            -e POSTGRES_USER=modulo_test \
            -e POSTGRES_PASSWORD=modulo_test \
            -e POSTGRES_DB=modulo_test \
            -p 5433:5432 \
            postgres:16-alpine
          for i in $(seq 1 60); do
            if docker exec modulo-ci-pg pg_isready -U modulo_test 2>/dev/null; then
              echo "Postgres ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres did not become ready within the retry budget"
          docker logs modulo-ci-pg 2>/dev/null || true
          exit 1
      - name: Start Redis (integration dependency)
        if: steps.changed.outputs.changed_files != ''
        shell: bash
        run: |
          docker rm -f modulo-ci-redis 2>/dev/null || true
          docker run -d --name modulo-ci-redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            if docker exec modulo-ci-redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Redis did not become ready within the retry budget"
          docker logs modulo-ci-redis 2>/dev/null || true
          exit 1
      - name: Run changed integration tests
        if: steps.changed.outputs.changed_files != ''
        shell: bash
        run: |
          # Expand the newline-delimited list via mapfile - never interpolate
          # PR-controlled filenames into `run:` (shell metacharacters and
          # spaces would be executed/split). The list was written to a temp
          # file by the Detect step.
          mapfile -t TEST_FILES < /tmp/integration-changed.txt
          echo "Running: pytest ${TEST_FILES[*]}"
          uv run --no-build --no-sync pytest "${TEST_FILES[@]}" -q --tb=short --timeout=300 -p no:warnings
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DATABASE_URL: "postgresql+asyncpg://modulo_test:modulo_test@localhost:5433/modulo_test"
          # The Start Redis step above provisions Redis but never exported its
          # URL.  Without REDIS_URL, integration tests that require Redis
          # (e.g. test_schemathesis.py) silently collect 0 tests and pytest
          # exits 5 ("no tests collected"), failing the job.  The deploy
          # pre-deploy gate and schemathesis-nightly.yml both set REDIS_URL.
          REDIS_URL: "redis://localhost:6379/0"

  tier1b-light:
    # Tier 1b connectors (FAR-934): container-hosted LIGHT set only.
    # Boots self-hostable connector servers + light local model servers via
    # Testcontainers and drives the real Modulo connectors/backends against
    # them. The heavy set (gitlab, vllm, tgi) is nightly-only — see
    # tier1b-nightly.yml (it must NOT be a schedule trigger here: a
    # schedule trigger fires this ENTIRE fast-validation suite, FAR-773).
    name: Tier 1b testcontainers (light)
    # FAR-1427 (cheap-first): also waits for Lint (Backend), see backend-test.
    needs: [changes, backend-lint]
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.backend_heavy == 'true'
        with:
          persist-credentials: false
      - name: Free up disk space
        if: needs.changes.outputs.backend_heavy == 'true'
        # The Tier 1b suites pull many container images and the runner's local
        # disk is the binding constraint: on ubicloud-standard-2 the suite has
        # been observed with 0-2 MB free, which aborts Docker pulls and kills
        # the shared Postgres Testcontainer mid-run (teardown ERRORs, PR #773).
        # Remove preinstalled toolchains the suite never uses. Fail-open: a
        # missing path or absent passwordless sudo is not an error.
        shell: bash
        run: |
          echo "disk before:"; df -h / || true
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /usr/local/share/powershell; do
            if [ -d "$path" ]; then
              echo "removing $path"; sudo -n rm -rf "$path" || true
            fi
          done
          sudo -n apt-get clean || true
          echo "disk after:"; df -h / || true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        if: needs.changes.outputs.backend_heavy == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
      # NOSONAR githubactions:S8541: pytest-bdd is a pinned source-archive dep (no
      # wheel) and ibm-cos-sdk is sdist-only, so `--no-build` hard-fails the sync on
      # a cold uv cache. `--frozen` locks the exact revisions, so the builds are
      # deterministic and trusted (no untrusted setup scripts execute).
      - run: uv sync --frozen  # NOSONAR
        if: needs.changes.outputs.backend_heavy == 'true'
      - name: Run Tier 1b light connector + model-server suites
        if: needs.changes.outputs.backend_heavy == 'true'
        run: |
          uv run --no-build --no-sync pytest \
            tests/integration/test_tier1b_connectors_light.py \
            tests/integration/test_tier1b_models_light.py \
            -q --tb=short --timeout=900 -p no:warnings
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          # Tier 1b fixtures deliberately loud-skip (with a recorded reason)
          # when a server cannot be stood up on the runner; successes assert
          # against REAL server responses only.

  runner-ci-harness:
    # Bundled Runner CI harness (FAR-773): boots the deploy/compose/
    # runner-ci.yml rig (socket-proxy + dind + workspace network) and runs
    # the docker-marked harness suite against it. The job body lives in the
    # reusable runner-ci-harness.yml so the weekly drift backstop
    # (runner-ci-backstop.yml) runs the exact same steps with
    # force=true instead of a schedule trigger here re-firing this ENTIRE
    # fast-validation suite just to reach one job.
    name: Bundled Runner harness (compose + socket-proxy + dind)
    uses: ./.github/workflows/runner-ci-harness.yml
    secrets: inherit

  frontend:
    name: Frontend and WCAG
    needs: [changes]
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.frontend == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: needs.changes.outputs.frontend == 'true'
        with:
          version: 11.28.5
      - uses: actions/setup-node@v6
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: needs.changes.outputs.frontend == 'true'
      # FAR-1427 (cheap-first): lint + type-check run before the Playwright
      # browser download and the WCAG/vitest/build steps, so a lint or type
      # failure fails the job in ~2 min instead of after ~6. No new job
      # dependency (and no added wall-clock) - same steps, cheaper-first order.
      - run: pnpm run lint
        if: needs.changes.outputs.frontend == 'true'
      - run: pnpm run type-check
        if: needs.changes.outputs.frontend == 'true'
      - name: Install Playwright browsers
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm exec playwright install chromium
      - name: Validate Playwright test compilation
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm exec playwright test --list
      - name: Run WCAG contrast tests
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm exec playwright test wcag-contrast
      - name: Run unit tests (vitest)
        if: needs.changes.outputs.frontend == 'true'
        # FAR-101: ubicloud-standard-2 is 2 vCPU. package.json's `test:unit`
        # script hardcodes --maxWorkers=4, which saturates both cores with 4
        # concurrently-loading jsdom environments (Vue SFC + ECharts/reka-ui/
        # vue-query) and starves setImmediate (flushPromises) by 10+s. Cap the
        # runner at 2 workers — matches actual CPU capacity, not a race-hiding
        # hack. Invoke vitest directly so the script's --maxWorkers=4 is never
        # inherited. 15000ms test/hook timeouts (vite.config.ts, from #817)
        # remain the safety net for heavy mount+settle specs.
        #
        # Coverage flags added for the changed-lines coverage gate: v8 provider
        # + lcov reporter produces frontend/coverage/lcov.info, which the
        # coverage-gate job downloads to run diff-cover against changed lines.
        run: pnpm exec vitest run src --pool=threads --maxWorkers=2 --coverage --coverage.provider=v8 --coverage.reporter=lcov
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.frontend == 'true'
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
      - run: pnpm run build
        if: needs.changes.outputs.frontend == 'true'
      - name: Audit dependencies (critical)
        if: needs.changes.outputs.frontend == 'true'
        # Best-effort against npm registry outages: a failed audit caused by an
        # unreachable advisory endpoint must not block CI. Real critical
        # vulnerabilities still fail the build; only registry/network errors
        # are downgraded to a warning.
        #
        # SECURITY: the original grep matched free text (e.g. 'timeout') across
        # the FULL audit output, including advisory titles. A genuine critical
        # vulnerability whose advisory text happened to mention 'timeout' was
        # silently downgraded to a warning — a false PASS on a security gate.
        # We now parse the structured `--json` output and only downgrade when
        # the failure is genuinely a registry/network outage (an 'error' node
        # with no reported vulnerabilities). A real advisory is always failed
        # closed.
        run: |
          # Capture rc defensively: under Actions' `bash -e -o pipefail` the
          # original `out=$(...); rc=$?` aborted the step before rc was read,
          # leaving the outage downgrade unreachable (dead code). `rc=0; out=$(...)
          # || rc=$?` survives set -e so the downgrade branch actually runs.
          rc=0; out=$(pnpm audit --audit-level=critical --json 2>&1) || rc=$?
          if [ $rc -eq 0 ]; then
            echo "$out"
            exit 0
          fi
          # Default to failing closed (real vulnerability). Only downgrade to a
          # warning when the failure is a registry/network outage: pnpm emits an
          # 'error' JSON node and reports no vulnerabilities on an outage.
          # Require an explicit `j.error` — a real advisory has no `error` node,
          # so it always fails the build closed (the previous `!j.vulnerabilities
          # || empty` also downgraded parseable JSON like `{}`, a false PASS).
          if echo "$out" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const j=JSON.parse(s);if(j&&j.error)process.exit(0);}catch(e){}process.exit(1);});'; then
            echo "::warning::pnpm audit could not reach the npm registry (outage); not failing CI."
            echo "$out"
            exit 0
          fi
          echo "$out"
          exit $rc
      - name: E2E route coverage gate
        if: needs.changes.outputs.frontend == 'true'
        # FAR-637: every production route must be referenced by at least one
        # e2e spec (guards against routes rotting with zero e2e coverage, e.g.
        # /pipelines/:id/editor, FAR-616). Known-uncovered MVP routes are
        # tracked in FAR-638; until those specs land this gate MUST stay
        # NON-ENFORCING so it cannot block this PR's merge or freeze every
        # future PR (a permanently red required check defeats the gate). The
        # per-route table still prints to the step summary as the live tracker
        # for the FAR-638 fill. Flip to enforcing (make the reporting step
        # fail closed on rc=1) once the FAR-638 specs land. Runs last so a red
        # gate never starves the checks above. The job defaults to frontend/
        # as working directory, but the script reads the repo tree, so run it
        # from the repo root (it locates the tree relative to itself).
        #
        # `continue-on-error` (not used in this workflow, and silently masks
        # failures) was removed.
        # Instead the script's exit code is captured into the
        # `route_coverage_rc` output; the reporting step exits 0 so the
        # required check stays green (uncovered routes are non-enforcing), and
        # a genuine breakage (rc=2) is surfaced by the aggregate step below.
        id: route-coverage
        working-directory: .
        run: |
          set +e
          python3 .github/scripts/check_e2e_route_coverage.py
          rc=$?
          echo "route_coverage_rc=$rc" >> "$GITHUB_OUTPUT"
          # rc=1 (uncovered routes) is NON-ENFORCING until FAR-638 lands:
          # report it (the table is already printed to $GITHUB_STEP_SUMMARY)
          # but do not block the merge. rc=2 (malformed router / missing e2e
          # dir) is a real breakage and is allowed to fail the job.
          if [ "$rc" -eq 1 ]; then
            exit 0
          fi
          exit "$rc"
      - name: E2E route coverage gate (fail closed)
        # Replacement for the banned `continue-on-error`: an explicit
        # aggregate step that only runs when a real failure occurred (the
        # reporting step passes rc=2 through), ending with `exit 1` so the
        # required check genuinely fails rather than being silently masked.
        if: (failure() && steps.route-coverage.outputs.route_coverage_rc == '2') && needs.changes.outputs.frontend == 'true'
        run: |
          echo "::error::E2E route coverage gate failed (rc=2: malformed router or missing e2e directory). See the 'E2E route coverage gate' step output." >&2
          exit 1

  sonarcloud-scan:
    name: SonarCloud scan (coverage import)
    # SonarCloud automatic analysis (the GitHub App) cannot import coverage
    # reports, so a CI-based scanner run is the only way the coverage measure
    # (and the README coverage badge) exists. Originally gated to push-to-main
    # to bound runner cost (the badge tracks main, not PRs), but the "SonarCloud
    # scan (coverage import)" status check is REQUIRED for merge, so it must also
    # run on pull_request — otherwise the check is never produced on a PR and the
    # merge gate can never go green. Reuses the coverage-report artifact
    # backend-test already uploads (and the frontend-coverage artifact the
    # frontend job uploads) instead of re-running either suite.
    # workflow_dispatch is allowed so this job can be validated manually.
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && needs.backend-test.result == 'success'
      && (github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch')
    # FAR-1430: `frontend` is a need only so its coverage artifact is ready to
    # download. Sonar must still run when `frontend` FAILS (it ran independently
    # before), so the condition above replaces the implicit success() with
    # !cancelled() + an explicit backend-test success check (the old behaviour:
    # skipped when backend-test fails/is skipped). frontend (~7 min) finishes
    # well inside backend-test (~25 min), so this adds no wall-clock.
    needs: [backend-test, frontend, changes]
    runs-on: ubicloud-standard-2
    # A job-level block REPLACES the workflow default. actions: read is needed
    # by `gh run download` (Actions artifacts REST API) in the frontend-coverage
    # step; contents: read is for checkout. The scan authenticates with
    # SONAR_TOKEN and posts nothing to GitHub, so no other scope is needed.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.sonar == 'true'
        with:
          fetch-depth: 0   # SonarCloud needs full history for blame/new-code detection
          persist-credentials: false
      - name: Download backend coverage report
        if: needs.changes.outputs.sonar == 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: backend    # artifact root is backend/ (upload path backend/coverage.xml) → restores backend/coverage.xml
      - uses: actions/setup-node@v6
        # Node only: SonarCloud's JS/TS analysis needs a Node runtime on the
        # runner. pnpm, the dependency install and the vitest run are NOT needed
        # here (FAR-1430) - the coverage is downloaded from the frontend job.
        if: needs.changes.outputs.sonar == 'true'
        with:
          node-version: "22"
      - name: Download frontend coverage report (from the frontend job)
        # FAR-1430: the `frontend` job already runs the identical vitest
        # coverage command and uploads frontend/coverage/lcov.info as the
        # `frontend-coverage` artifact (always(), when the path gate says
        # frontend is in scope). Re-running vitest here cost ~3-4 min of runner
        # time per CI run. A missing lcov is a NON-FATAL Sonar warning, never a
        # job failure: the frontend job may have failed before producing
        # coverage, and on a PR that touches no frontend path it does not run
        # its steps at all (there is then no artifact; Sonar's PR gate measures
        # new-code coverage only). `gh run download` inside an `if` is used
        # instead of actions/download-artifact so a missing artifact cannot fail
        # the step, and without the banned continue-on-error setting. Push to
        # main / dispatch always have frontend=true, so the artifact normally
        # exists there and the main coverage measure stays complete.
        if: needs.changes.outputs.sonar == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if gh run download "$RUN_ID" --repo "$REPO" --name frontend-coverage --dir frontend/coverage; then
            ls -l frontend/coverage/lcov.info
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "::warning::frontend-coverage artifact unavailable (frontend job failed before producing coverage, or was cancelled); Sonar will import no JS coverage for this run."
            else
              # push to main / dispatch: frontend=true, so the artifact must
              # exist. Loud, but do not fail the scan (it still reports).
              echo "::error::frontend-coverage artifact unavailable on ${EVENT_NAME}; Sonar will import NO JS coverage for this run (main coverage measure and badge will dip). Check the frontend job and this step's permissions."
            fi
          fi
      - name: Install SonarScanner CLI
        if: needs.changes.outputs.sonar == 'true'
        # The pinned SonarSource/sonarqube-scan-action is NOT used for the scan
        # itself: its work would run before any retry could wrap it, and the
        # repo's .semgrep/continue-on-error-in-ci.yaml rule bans the
        # continue-on-error setting as a way to keep a step going. So the CLI
        # is installed here exactly as the action does — pinned version, GPG
        # signature verified against the SonarSource key — and the scan step
        # below runs it with a bounded retry for the known transient
        # `.git/.probe-*` race (see that step's comment).
        #
        # The version pin matters and is retained from the action config: 8.1.0
        # is the scanner SonarCloud accepts. The previous 7.2.0.5079 failed
        # against SonarCloud with "Error 500 on .../batch/project.protobuf"
        # (all earlier API calls succeed), taking the required check red on every
        # branch; v8.2.2 of the action shipped exactly 8.1.0.6389. Keep
        # SONAR_SCANNER_VERSION in sync with the upstream
        # SonarSource/sonarqube-scan-action `sonar-scanner-version` file when
        # upgrading.
        env:
          SONAR_SCANNER_VERSION: "8.1.0.6389"
          SONAR_SCANNER_BINARIES_URL: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli
        run: |
          set -euo pipefail
          ZIP_URL="${SONAR_SCANNER_BINARIES_URL}/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux-x64.zip"
          INSTALL_DIR="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/sonar-scanner-cli/manual"
          mkdir -p "$INSTALL_DIR"
          curl -sSL --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 5 --max-time 300 -o /tmp/sonar-cli.zip "$ZIP_URL"
          curl -sSL --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 5 --max-time 60 -o /tmp/sonar-cli.zip.asc "${ZIP_URL}.asc"
          # Fail closed if GPG is unavailable; never fall back to an unverified
          # download of a binary that will execute on this runner.
          #
          # gpg has no built-in retry (unlike curl's --retry), so a transient
          # keyserver hiccup would fail the install outright. Retry the fetch a
          # bounded number of times with a backoff, mirroring the curl steps.
          for attempt in 1 2 3; do
            if gpg --batch --keyserver hkps://keyserver.ubuntu.com \
                 --keyserver-options timeout=30 \
                 --recv-keys 679F1EE92B19609DE816FDE81DB198F93525EC1A; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::gpg keyserver fetch failed after 3 attempts; failing closed (no unverified fallback)."
              exit 1
            fi
            echo "::warning::gpg keyserver fetch failed (attempt ${attempt}/3); retrying."
            sleep $((attempt * 5))
          done
          gpg --batch --verify /tmp/sonar-cli.zip.asc /tmp/sonar-cli.zip
          unzip -q -o /tmp/sonar-cli.zip -d "$INSTALL_DIR"
          SCANNER="$INSTALL_DIR/sonar-scanner-${SONAR_SCANNER_VERSION}-linux-x64/bin/sonar-scanner"
          test -x "$SCANNER"
          echo "SCANNER=$SCANNER" >> "$GITHUB_ENV"
          "$SCANNER" --version
      - name: SonarCloud scan
        if: needs.changes.outputs.sonar == 'true'
        # Two known environment-only, intermittent scanner failures are retried;
        # any other error is genuine and fails the check immediately.
        #
        #   1. Transient race in SonarCloud's Python sensor: PackageRootResolver's
        #      unconditional Files.walk(baseDir) in FileProvider descends into
        #      `.git/` and races with the SCM provider's short-lived `.git/.probe-*`
        #      files, crashing the scan with `java.nio.file.NoSuchFileException:
        #      .../.git/.probe-<uuid>` (upstream SONARPY-2120; `.git/**` in
        #      sonar.exclusions cannot prevent it because FileProvider walks the
        #      filesystem, not the file index, and sonar.scm.disabled=true cannot
        #      be used because the new-code quality gate needs SCM blame).
        #   2. A plugin-classloader race in the security (taint) engine:
        #      `java.lang.LinkageError: loader org.sonar.classloader.ClassRealm
        #      attempted duplicate abstract class definition for
        #      org.sonar.plugins.python.api.IssueLocation` raised from
        #      com.sonar.security.frontend.python while two threads define the
        #      same class on one loader. Observed on main 2026-10-10 (run
        #      38021176294): the SAME commit 2b06bc01c scanned green 28 min
        #      earlier (run 38019518160) and the scanner ships no code change, so
        #      it is environment-only, never a code or quality-gate failure.
        #
        # Both are matched by an exact log signature, never a quality-gate
        # failure or any other error, so a genuine red check is never masked.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          set -uo pipefail
          # One log file for the whole step, truncated per attempt so the
          # signature grep never sees a previous attempt's output; removed on
          # every exit path (success, non-transient failure, exhaustion).
          LOG="$(mktemp)"
          trap 'rm -f "$LOG"' EXIT
          for attempt in 1 2 3; do
            : > "$LOG"
            set +e
            "$SCANNER" -Dsonar.projectBaseDir=. 2>&1 | tee "$LOG"
            RC=${PIPESTATUS[0]}
            set -e
            if [ "$RC" -eq 0 ]; then
              echo "::notice::SonarCloud scan succeeded on attempt ${attempt}/3."
              exit 0
            fi
            if grep -qE "NoSuchFileException: .*\.git/\.probe-|attempted duplicate abstract class definition" "$LOG"; then
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::SonarCloud scan hit a known transient scanner failure (attempt ${attempt}/3); retrying."
                sleep $((attempt * 15))
              else
                echo "::warning::SonarCloud scan hit a known transient scanner failure on the final attempt (3/3); not retrying."
              fi
              continue
            fi
            echo "::error::SonarCloud scan failed with a non-transient error (neither the .git/.probe-* race nor the security-engine duplicate-class LinkageError); not retrying."
            exit "$RC"
          done
          echo "::error::SonarCloud scan still hit a known transient scanner failure after 3 attempts; failing the required check (upstream SONARPY-2120 / security-engine plugin-classloader race)."
          exit 1

  sonar-new-issues-gate:
    # Free SonarCloud's quality gate ("Sonar way") is new-code RATIO-based
    # (new_reliability/security/maintainability_rating > 1, new_coverage < 80,
    # new_duplicated_lines_density > 3, new_security_hotspots_reviewed < 100)
    # with NO new-issue-count condition, and the free tier cannot customise the
    # gate. A PR that introduces one or two new smells still passes every
    # rating condition - which is how 74 reliability-impact issues (mostly
    # python:S7503) accumulated on main. This gate closes that hole: query the
    # SonarCloud API for THIS PR's analysis and fail on ANY new unresolved
    # issue. Fail-closed by design: an API error, an unexpected HTTP status,
    # or a response without a numeric .total fails the job - it never passes
    # on unknown state, and it carries no continue-on-error.
    #
    # PR-analysis-only: there is no pullRequest analysis on push to main, so
    # the job runs on pull_request events only. The path gate is STEP-level
    # (never job-level), matching the scan job and FAR-1427: a docs-only PR's
    # check still reports success rather than a non-green "skipped".
    # needs: sonarcloud-scan so the analysis is queryable by the time this
    # runs - the scanner waits for SonarCloud to process the upload
    # (sonar.qualitygate.wait=true in sonar-project.properties), so once the
    # scan job succeeds the PR issues are in the API. merge-queue.yml decides
    # on the whole ci.yml run conclusion, so a failing gate blocks merges with
    # no merge-queue change (same mechanism as coverage-gate).
    name: New issues gate (SonarCloud)
    if: github.event_name == 'pull_request'
    needs: [sonarcloud-scan, changes]
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    steps:
      - name: Fail on any new SonarCloud issue in this PR
        if: needs.changes.outputs.sonar == 'true'
        shell: bash
        env:
          # SONAR_TOKEN / PR_NUMBER mapped through env (githubactions:S7630):
          # GitHub expressions are interpolated before bash parses the script,
          # so via env they are data, never code. Same pattern as the scan job.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN secret is not available; cannot evaluate the new-issues gate (failing closed)."
            exit 1
          fi
          # One source of truth for the host and project key inside this script.
          SONAR_HOST="https://sonarcloud.io"
          SONAR_COMPONENT="farnalabs_modulo-new"
          BODY="$(mktemp)"
          CURL_ERR="$(mktemp)"
          trap 'rm -f "$BODY" "$CURL_ERR"' EXIT
          API="${SONAR_HOST}/api/issues/search?componentKeys=${SONAR_COMPONENT}&pullRequest=${PR_NUMBER}&resolved=false&ps=1"
          # Basic auth: the token is the username, the password is empty.
          # Capture the HTTP status explicitly (no -f): a guard must distinguish
          # "API failed" from "no issues", and every non-200 fails closed below.
          set +e
          HTTP_CODE=$(curl -sS --max-time 30 -u "${SONAR_TOKEN}:" \
            -o "$BODY" -w '%{http_code}' "$API" 2>"$CURL_ERR")
          CURL_RC=$?
          set -e
          if [ "$CURL_RC" -ne 0 ]; then
            echo "::error::SonarCloud issues API request failed (curl exit ${CURL_RC}): $(cat "$CURL_ERR" 2>/dev/null || echo 'no stderr'); failing closed."
            exit 1
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::SonarCloud issues API returned HTTP ${HTTP_CODE} (expected 200); failing closed. Body: $(head -c 500 "$BODY")"
            exit 1
          fi
          TOTAL=$(jq -r '.total' "$BODY" 2>/dev/null || echo "unparsed")
          if ! [[ "$TOTAL" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected SonarCloud API response (no numeric .total); failing closed. Body: $(head -c 500 "$BODY")"
            exit 1
          fi
          if [ "$TOTAL" -gt 0 ]; then
            echo "::error::PR ${PR_NUMBER} introduces ${TOTAL} new SonarCloud issue(s) (unresolved on this PR's analysis). The free Sonar way gate has no issue-count condition, so this CI gate is what blocks them."
            # Best-effort detail listing; the job already fails either way.
            curl -sS --max-time 30 -u "${SONAR_TOKEN}:" \
              "${SONAR_HOST}/api/issues/search?componentKeys=${SONAR_COMPONENT}&pullRequest=${PR_NUMBER}&resolved=false&ps=100" \
              | jq -r '.issues[]? | "- \(.severity) [\(.rule)] \(.component): \(.message)"' 2>/dev/null || true
            exit 1
          fi
          echo "No new SonarCloud issues on PR ${PR_NUMBER}."

  coverage-gate:
    # Enforces a coverage threshold on the lines each PR actually changes
    # (the analogue of SonarCloud's new_coverage). Free SonarCloud cannot
    # customise quality gates, so we run diff-cover ourselves in CI.
    # merge-queue.yml skips any PR whose latest CI run is not green, so a
    # failing coverage-gate job already blocks merges — no changes to the
    # merge queue are needed.
    name: Coverage gate (changed lines)
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    needs: [backend-test, frontend, changes]
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # diff-cover needs full history to compute the merge base
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Fetch base branch for diff comparison
        # diff-cover compares against `origin/${{ github.base_ref }}`. actions/checkout
        # fetches the PR head (and its full history) but NOT the base-branch ref, so
        # `origin/main` does not exist locally. Without this, diff-cover crashes with
        # "unknown revision origin/main...HEAD", which the gate treats as a failure
        # (fail-closed) and blocks the merge. Fetch the base ref explicitly so the
        # comparison target resolves. Works for both pull_request (base_ref set) and
        # workflow_dispatch (falls back to main).
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
      - name: Download backend coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: backend
      - name: Download frontend coverage report
        # FAR-1427: the frontend job skips its steps (no lcov artifact) when the
        # PR touches no frontend path; there is then no changed JS to gate.
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Run changed-lines coverage gate
        working-directory: backend
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
        run: |
          # Provision an isolated venv with ONLY the gate's dependency
          # (diff-cover) using `--no-build`, so no third-party setup scripts
          # ever execute (resolves githubactions:S8541). A full `uv sync` would
          # build the git-pinned pytest-bdd archive and the sdist-only
          # ibm-cos-sdk, both of which trip S8541; diff-cover 10.5.1 and all of
          # its dependencies are pure-Python wheels, so a build-free install is
          # safe and far faster than syncing the whole project.
          uv venv .venv
          uv pip install --python .venv --no-build "diff-cover==10.5.1"
          # Run the gate with the venv's Python directly so it finds diff-cover
          # next to this interpreter. The script validates its CLI args before
          # any subprocess.
          # FAR-1427: with no frontend change the frontend job produced no lcov
          # (and the download above is skipped), so the JavaScript leg has no
          # report and no changed lines. Tolerate that missing JS report ONLY
          # then, via the NARROW --allow-missing-js-report flag: the Python leg
          # stays strict (the global --allow-missing-reports must never be
          # passed in CI).
          EXTRA_ARGS=()
          if [ "$FRONTEND_CHANGED" != "true" ]; then
            EXTRA_ARGS+=(--allow-missing-js-report)
          fi
          .venv/bin/python ../scripts/run_coverage_gate.py \
            --compare-branch "origin/$BASE_REF" \
            --python-report coverage.xml \
            --js-report ../frontend/coverage/lcov.info \
            "${EXTRA_ARGS[@]}"

  schema-freshness:
    # Regenerates frontend/src/lib/api/schema.ts from the backend's OpenAPI and
    # FAILS if the committed schema differs from what the generator produces.
    # Any backend API change (routes, request/response models) therefore forces
    # `pnpm run generate:api` in the same PR. Mirrors scripts/run_generate_api_types.py:
    # dump the OpenAPI JSON by importing modulo.api.main, then feed it to
    # openapi-typescript. Runs on ALL events (PR + push to main + manual) so a
    # schema that drifts out of sync on main is caught immediately.
    name: Schema freshness
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Dump OpenAPI schema from backend
        working-directory: backend
        shell: bash
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./modulo-gen-test.db"
          SECRET_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          FERNET_KEY: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          MODULO_CSRF_ENABLED: "false"
        run: |
          cat > /tmp/gen_openapi.py <<'EOF'
          import os, json, sys
          sys.tracebacklimit = 0
          from modulo.api.main import app
          with open("/tmp/modulo_openapi.json", "w", encoding="utf-8") as f:
              json.dump(app.openapi(), f, ensure_ascii=False)
          print(f"Schema: {os.path.getsize('/tmp/modulo_openapi.json')} bytes")
          EOF
          uv run --no-build --no-sync python /tmp/gen_openapi.py
      - name: Generate TypeScript types
        # Pin the openapi-typescript version to the one in frontend/package.json
        # (7.13.0) so the gate is deterministic — a bare `pnpm dlx openapi-typescript`
        # would pull the latest release and cause version-skew churn between local
        # (`pnpm run generate:api`, uses the lockfile install) and CI.
        working-directory: frontend
        shell: bash
        run: pnpm dlx openapi-typescript@7.13.0 /tmp/modulo_openapi.json --output src/lib/api/schema.ts
      - name: Fail if schema.ts is stale
        shell: bash
        run: |
          if git diff --exit-code -- frontend/src/lib/api/schema.ts; then
            echo "schema.ts is up to date"
          else
            echo "::error::frontend/src/lib/api/schema.ts is stale. Run 'pnpm run generate:api' from frontend/ and commit the regenerated file."
            exit 1
          fi

  gitleaks:
    name: Secret scan
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The SARIF artifact upload hits a 403 from the runner's blob-storage
          # proxy in this environment, which fails the whole job even when no
          # leaks are found. The scan itself still runs and reports; we just
          # skip the (non-essential) artifact upload that returns Forbidden.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"



  migration-heads-check:
    name: Check migration heads
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify single migration head
        working-directory: backend
        shell: bash
        run: |
          uv sync --frozen
          uv run --no-build --no-sync python -m alembic heads 2>&1 | tee /tmp/alembic_heads.txt
          HEAD_COUNT=$(grep -c "\(head\)\|\(effective head\)" /tmp/alembic_heads.txt || true)
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "::error::Alembic migration graph has $HEAD_COUNT heads (expected 1). Create a merge migration."
            exit 1
          fi
          echo "Migration heads OK ($HEAD_COUNT head)"

      # Numeric-prefix collision check vs base. `alembic heads` above catches TWO
      # head migrations, but NOT a numeric-prefix collision: two migrations that
      # both use prefix 0065_ (e.g. the PR's 0065_cost_components + main's
      # 0065_reconcile_staging_schema) that are manually chained (one's
      # down_revision is the other) produce a single head, so the multi-head check
      # can't see the collision. We hit exactly this on PR #671 (A1); it was caught
      # only because the two files were separate heads. Fail early here instead.
      - name: Check numeric migration-prefix collisions vs base
        if: github.event_name == 'pull_request'
        working-directory: backend
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          MIG_DIR="src/modulo/db/migrations/versions"
          BASE="origin/$BASE_REF"

          # Migration files changed by this PR vs its merge-base.
          CHANGED=$(git diff --name-only "${BASE}...HEAD" -- "${MIG_DIR}/" || true)
          if [ -z "$CHANGED" ]; then
            echo "No migration files changed by this PR -- skipping migration-prefix collision check"
            exit 0
          fi

          # All migration filenames on the base (main) side.
          BASE_FILES=$(git ls-tree --name-only "${BASE}" "${MIG_DIR}/" | sed 's|.*/||' || true)

          echo "Migration files changed by this PR:"
          printf '%s\n' "$CHANGED" | sed 's/^/  /'
          echo ""

          COLLISION=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Skip deletions/renamed-away files: only files still present in the
            # PR tree can collide after merge.
            if ! git cat-file -e "HEAD:${f}" 2>/dev/null; then
              echo "  (skip) not present in PR tree: ${f}"
              continue
            fi
            base_f=$(basename "$f")
            prefix=$(printf '%s' "$base_f" | cut -d_ -f1)
            while IFS= read -r bf; do
              [ -z "$bf" ] && continue
              bprefix=$(printf '%s' "$bf" | cut -d_ -f1)
              if [ "$bprefix" = "$prefix" ] && [ "$bf" != "$base_f" ]; then
                echo "::error::Numeric migration-prefix collision: ${base_f} collides with ${bf}. Renumber to the next free prefix (e.g. 0066, 0067...) and set down_revision to the actual current head."
                COLLISION=1
              fi
            done <<< "$BASE_FILES"
          done <<< "$CHANGED"

          if [ "$COLLISION" -eq 1 ]; then
            exit 1
          fi
          echo "No migration-prefix collision"
          exit 0

  # Break-glass deploy gate = acceptance (b) of the break-glass admin recovery
  # plan sec. 3: automated staging verification = the boot-time allow-list assertion
  # + the connectivity smoke that FAILS boot when ENABLED AND
  # boot-failure-mode=fail. Runs the breakglass_gate-tagged regression suite
  # (test_break_glass_gate.py) against testcontainers Postgres with the
  # PRODUCTION bootstrap_role.py, in BOTH directions (clean config passes, a
  # rogue grant FAILS the assertion) plus the transient-vs-fatal discriminator.
  # Also runs the FAR-190/192 streak-engine SQL suite
  # (test_trigger_streak_engine_sql.py) — the only per-PR run of the
  # trigger_events vocabulary constraint + deactivation SQL against real
  # Postgres (FAR-192 FIX 3).
  break-glass-deploy-gate:
    name: Break-glass deploy gate
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Break-glass boot allow-list + connectivity smoke
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run --no-build --no-sync pytest tests/integration/test_break_glass_gate.py tests/integration/test_trigger_streak_engine_sql.py -q --tb=short --timeout=300 -p no:warnings

  notify-pr-failure:
    name: Trigger Branch Fixer
    # The `manual-delivery` label must only suppress the webhook dispatch step
    # below, NOT the whole job: a job-level skip surfaces this check as
    # "skipped" in the check-runs API, which the PR Reviewer flags as a
    # non-green signal on every such PR. The check itself always reports
    # success on pull_request events; the label guard lives on the dispatch
    # step so it keeps its documented meaning ("do not auto-dispatch the
    # Branch Fixer").
    if: github.event_name == 'pull_request' && always()
    # FAR-1429: `needs` must list EVERY job that can fail on a PR. failure() and
    # success() in the steps below consider all ancestor jobs, so a failing job
    # missing from this list (tier1b-light, sonarcloud-scan,
    # migration-heads-check were) never reached the Branch Fixer / reviewer
    # gate. A job that is merely SKIPPED is neither failure() nor cancelled();
    # every job here either always runs (path gates are step-level) or is only
    # skipped because an ancestor already failed, which is itself a failure.
    needs: [changes, backend-lint, backend-test, integration-changed, tier1b-light, frontend, sonarcloud-scan, sonar-new-issues-gate, coverage-gate, schema-freshness, gitleaks, migration-heads-check, break-glass-deploy-gate]
    runs-on: ubicloud-standard-2
    permissions:
      actions: write
      pull-requests: write
    steps:
      - name: Skip if this run was superseded by a newer push
        id: superseded-check
        if: failure() || cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # FAR-1427: this workflow now cancels in-progress pull_request runs
          # when a newer push lands (workflow-level concurrency). A job with
          # `always()` still run on cancellation, and this job deliberately
          # treats `cancelled()` as a failure, so a superseded (cancelled) run
          # would otherwise dispatch the Branch Fixer - and post the
          # "exhausted" comment - for a STALE head SHA. The newer push has its
          # own run that owns the outcome. Compare this run's head SHA with the
          # PR's current head: if they differ, this run is stale - do nothing.
          # Fail OPEN (treat as current) on any API/parse failure: a genuine
          # CI failure must not be silently dropped on an API blip; the Branch
          # Fixer webhook already coalesces duplicates by (prNumber, headSha).
          CURRENT_SHA=$(gh api "/repos/${{ github.repository }}/pulls/${PR_NUM}" --jq '.head.sha' 2>/dev/null || echo "")
          if [ -n "$CURRENT_SHA" ] && [ "$CURRENT_SHA" != "$HEAD_SHA" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Run is for ${HEAD_SHA} but PR #${PR_NUM} head is now ${CURRENT_SHA} - superseded run, skipping Branch Fixer dispatch."
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check retry limit
        id: retry-check
        if: (failure() || cancelled()) && steps.superseded-check.outputs.superseded != 'true' && !contains(github.event.pull_request.labels.*.name, 'manual-delivery')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # PR_NUM / BRANCH are mapped through the step env block (S7630):
          # GitHub expressions inside a run block are interpolated before the
          # shell parses the script, so untrusted branch-name content could
          # break out into code execution. Via env: they are data, never code.
          # (Same pattern as the "Trigger Modulo Branch Fixer" step below.)

          # Count how many times the branch fixer has already pushed fix commits
          # to this PR. Each successful fix produces exactly one commit with
          # committer "modulo-branch-fixer".
          FIX_COUNT=$(gh api "/repos/${{ github.repository }}/pulls/${PR_NUM}/commits?per_page=100" \
            --jq '[.[] | select(.commit.committer.name == "modulo-branch-fixer")] | length' 2>/dev/null || echo "0")

          echo "fix_attempts=$FIX_COUNT" >> "$GITHUB_OUTPUT"
          echo "PR #${PR_NUM} on '${BRANCH}' -- branch fixer has pushed $FIX_COUNT fix commit(s)."

          if [ "$FIX_COUNT" -ge 3 ]; then
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Branch fixer exhausted after $FIX_COUNT attempts against PR #${PR_NUM}."
            gh pr comment "$PR_NUM" --body "## Branch Fixer Exhausted

            The automated branch fixer has attempted $FIX_COUNT fixes against this PR but CI is still failing. Manual intervention is required.

            The branch fixer will not retry again on this PR."
          else
            echo "exhausted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if a merge-queue run is already in flight for this PR
        id: queue-check
        if: (failure() || cancelled()) && steps.superseded-check.outputs.superseded != 'true' && steps.retry-check.outputs.exhausted == 'false' && !contains(github.event.pull_request.labels.*.name, 'manual-delivery')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          # A green CI run entered the merge queue, and then a THIRD-PARTY PR's
          # merge (or a review event) advanced main and cancelled this PR's
          # now-stale queue run. That cancellation surfaces as
          # (failure() || cancelled()) here and dispatches a Branch Fixer run
          # even though nothing is broken and the queue is already re-running
          # this branch. If a merge-queue run for this PR is still in flight,
          # the queue owns the outcome — do not dispatch a competing fixer run.
          #
          # How a queue run is associated with THIS PR (verified against the
          # Actions API): since FAR-1428 the queue runs only on schedule /
          # workflow_dispatch / repository_dispatch, all of which run on main
          # (head_branch 'main', prs []), so this guard now matches only legacy
          # review/check_suite-triggered runs still in flight and is otherwise
          # a harmless no-op; it is kept (fail-closed) rather than deleted. We
          # match on head branch, head SHA, OR the run's associated PR - never
          # on event. A run that has not finished is reported by the
          # Actions API as `queued`, `in_progress`, `pending`, `requested` or
          # `waiting` — observed live: the in-flight Merge: Queue run for this
          # very PR reports status "pending", NOT "queued"/"in_progress", so
          # keying on those two alone silently misses it. The only terminal run
          # status is `completed` (cancelled/skipped/failed runs are all
          # status "completed" with a distinct conclusion), so we treat ANY
          # non-completed status as in flight. The queue's concurrency group is
          # FIFO (cancel-in-progress: false), so a fixer racing a still-queued
          # run is exactly the race this guard must lose.
          #
          # Fail CLOSED on any query/parse failure: the old `|| echo 0`
          # converted an API/jq blip into "no queue run in flight" and re-
          # dispatched the fixer against a live queue run — silently
          # reintroducing the bug this guard exists to fix.
          if ! RUNS_JSON=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/merge-queue.yml/runs?per_page=100" \
            2>/dev/null); then
            echo "queue_in_flight=true" >> "$GITHUB_OUTPUT"
            echo "::error::Could not query 'Merge: Queue' runs (GitHub API error) — failing CLOSED and skipping Branch Fixer dispatch to avoid racing the queue."
            exit 0
          fi
          IN_FLIGHT=$(printf '%s' "$RUNS_JSON" | jq \
            --arg branch "${BRANCH}" \
            --arg sha "${HEAD_SHA}" \
            --argjson pr "${PR_NUM:-0}" \
            '[ .workflow_runs[]
               | select(.status != "completed")
               | select(
                   .head_branch == $branch
                   or .head_sha == $sha
                   or ([.pull_requests[]?.number] | index($pr) != null)
                 )
             ] | length' 2>/dev/null) || IN_FLIGHT=""
          if [ -z "$IN_FLIGHT" ]; then
            echo "queue_in_flight=true" >> "$GITHUB_OUTPUT"
            echo "::error::Could not parse 'Merge: Queue' runs (jq failed) — failing CLOSED and skipping Branch Fixer dispatch to avoid racing the queue."
            exit 0
          fi
          if [ "$IN_FLIGHT" -gt 0 ]; then
            echo "queue_in_flight=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Merge queue run already in flight for PR #${PR_NUM} ('${BRANCH}') — skipping Branch Fixer dispatch (queue owns the outcome)."
          else
            echo "queue_in_flight=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Modulo Branch Fixer
        if: (failure() || cancelled()) && steps.superseded-check.outputs.superseded != 'true' && steps.retry-check.outputs.exhausted == 'false' && steps.queue-check.outputs.queue_in_flight != 'true' && !contains(github.event.pull_request.labels.*.name, 'manual-delivery')
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WEBHOOK_URL: ${{ secrets.MODULO_BRANCH_FIXER_WEBHOOK_URL }}
          HMAC_SECRET: ${{ secrets.MODULO_BRANCH_FIXER_HMAC_SECRET }}
        shell: bash
        run: |
          TIMESTAMP=$(date +%s)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # jq -n --arg/--argjson JSON-escapes every value, so a crafted branch
          # name (legal in git refnames, e.g. containing '"') cannot inject
          # keys or break the payload. See FAR-568.
          #
          # headSha (FAR-1034): the Branch Fixer's webhook trigger coalesces
          # repeated CI-failure events by (prNumber, headSha), so the payload
          # MUST carry the failing commit's head SHA. Without it the modulo
          # side could not distinguish a duplicate event (same commit still
          # failing) from a genuinely new failure (new commit), and every
          # event launched a separate full fixer run.
          #
          # fingerprint: the same stable failure identity the Branch Fixer
          # embeds in a fix PR body and matches on at run start, so it must be
          # DETERMINISTIC rather than composed by the model (prose drifts
          # between runs and let two runs raise two PRs for the same failure).
          # Shape: <workflow>|<failed PR or main>|<head sha>. Mirrors the
          # payload key deploy.yml sends (PR #1126).
          FINGERPRINT="CI: Fast Validation|pr:${PR_NUM}|${HEAD_SHA}"
          BODY=$(jq -n \
            --arg branchName "${BRANCH}" \
            --argjson prNumber "${PR_NUM}" \
            --arg headSha "${HEAD_SHA}" \
            --arg runUrl "${RUN_URL}" \
            --arg failureDescription "CI checks failed on PR #${PR_NUM} (branch: ${BRANCH})" \
            --arg fingerprint "${FINGERPRINT}" \
            '{branchName: $branchName, prNumber: $prNumber, headSha: $headSha, runUrl: $runUrl, failureDescription: $failureDescription, fingerprint: $fingerprint}')
          echo "PR #${PR_NUM} on branch '${BRANCH}' -- CI checks failed."
          echo "Sending to Modulo Branch Fixer pipeline..."
          # Retry with exponential backoff on transient network failures (curl HTTP 000) and 429/5xx (max 5
          # attempts, ~5 min total). TIMESTAMP and HMAC are recomputed per
          # attempt: the server enforces a +/-300s replay window on
          # X-Modulo-Timestamp, so a signature computed once would fall
          # outside the window after backoff sleep.
          DISPATCHED="false"
          LAST_HTTP=""
          for i in 1 2 3 4 5; do
            TIMESTAMP=$(date +%s)
            HMAC=$(echo -n "${TIMESTAMP}.${BODY}" | openssl dgst -sha256 -hmac "${HMAC_SECRET}" | sed 's/^.* //')
            # `|| RESPONSE=""` stops the default `bash -e` (GitHub Actions adds
            # it to `run:` steps) from aborting this retry loop on the FIRST
            # curl failure. Without it a curl timeout (exit 28) killed the step
            # immediately, so the HTTP 000 retry branch below (the whole point
            # of the loop) never ran and a transient webhook blip permanently
            # lost the dispatch.
            RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 30 -X POST "${WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
              -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
              -d "${BODY}") || RESPONSE=""
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            # A failed curl writes no body, so tail -1 is empty; normalise it to
            # the HTTP 000 sentinel the retry/no-op branches key off.
            [ -n "$HTTP_CODE" ] || HTTP_CODE="000"
            BODY_RESP=$(echo "$RESPONSE" | sed '$d')
            LAST_HTTP="$HTTP_CODE"
            if [ "$HTTP_CODE" = "202" ]; then
              RESP_STATUS=$(echo $BODY_RESP | jq -r '.status // "accepted"')
              if [ "$RESP_STATUS" = "coalesced" ]; then
                # FAR-1034 handled no-op: duplicate CI-failure for the same
                # PR + head SHA within the coalesce window — intentionally no
                # new run. Not an error, not retried.
                echo "::notice::Modulo Branch Fixer coalesced (duplicate CI-failure for same PR + head SHA — suppressed)"
              else
                echo "Modulo Branch Fixer accepted (run: $(echo $BODY_RESP | jq -r '.run_id // "unknown"'))"
              fi
              DISPATCHED="true"
              break
            elif [ "$HTTP_CODE" = "400" ] && echo "$BODY_RESP" | grep -q "Duplicate webhook payload"; then
              # FAR-1097 follow-up: HTTP 400 "Duplicate webhook payload" is the
              # engine's byte-level idempotency guard (DuplicateWebhookError) —
              # the identical delivery was already ACCEPTED within the ~5-min
              # dedup window (a concurrent run or a workflow re-run). It is a
              # handled no-op, NOT a dispatch failure; retrying would only
              # re-hit the same window.
              echo "::notice::Modulo Branch Fixer duplicate delivery suppressed (identical payload already accepted within the dedup window)"
              DISPATCHED="true"
              break
            elif [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" = "429" ] || [ "$HTTP_CODE" -ge 500 ]; then
              DELAY=$((2 ** (i - 1) * 5))
              echo "::warning::Modulo Branch Fixer returned HTTP $HTTP_CODE (attempt $i/5) — retrying in ${DELAY}s"
              sleep "$DELAY"
            else
              echo "::warning::Modulo Branch Fixer returned HTTP $HTTP_CODE: $(echo $BODY_RESP | jq -r '.detail // "unknown"')"
              break
            fi
          done
          if [ "$DISPATCHED" != "true" ]; then
            DETAIL=$(echo "$BODY_RESP" | jq -r '.detail // "unknown"' 2>/dev/null || echo "unknown"); DETAIL=${DETAIL:-unknown}
            echo "::error::Branch Fixer webhook dispatch failed (HTTP ${LAST_HTTP}: ${DETAIL}) — CI failure was not handed to the autonomous fix loop."
            gh pr comment "$PR_NUM" --body "## Branch Fixer Dispatch Failed

            The CI failure notification could not be delivered to the Branch Fixer pipeline after multiple retries.

            **HTTP status:** \`${LAST_HTTP}\`
            **Detail:** ${DETAIL}

            The automated fix loop is **not active** for this PR. Manual investigation may be needed." || echo "::warning::Failed to post dispatch-failure comment on PR #${PR_NUM}"
            exit 1
          fi

      - name: Report Branch Fixer check status
        if: success()
        run: echo "Branch Fixer trigger check passed (all required checks green or fixer dispatched)."

  notify-main-failure:
    name: Trigger Branch Fixer on main CI failure
    # When CI fails on a push or workflow_dispatch to main, dispatch the
    # Branch Fixer so it creates a fix branch, diagnoses, and raises a PR.
    # This closes the gap where main CI failures outside the deploy
    # pre-deploy gate (e.g. SonarCloud, schema freshness, secret scan)
    # had no automated fix mechanism. The Branch Fixer creates its own
    # fix branch from main — branchName: main, prNumber: 0 signals this.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && always()
    needs: [backend-lint, backend-test, integration-changed, frontend, runner-ci-harness, sonarcloud-scan, schema-freshness, gitleaks, migration-heads-check, break-glass-deploy-gate]
    runs-on: ubicloud-standard-2
    permissions:
      actions: write
    steps:
      - name: Trigger Modulo Branch Fixer
        # Only dispatch on a real failure. A manually cancelled main run is an
        # intentional action, not a CI break, so we must not dispatch the
        # Branch Fixer for it.
        # Step-level failure() only reflects failures in previous steps WITHIN
        # THIS JOB — it does NOT see failed jobs in `needs:`. Use
        # `needs.*.result` instead (cf. self-report-ci job and deploy.yml's
        # fixer job which use the same pattern).
        if: contains(needs.*.result, 'failure')
        env:
          WEBHOOK_URL: ${{ secrets.MODULO_BRANCH_FIXER_WEBHOOK_URL }}
          HMAC_SECRET: ${{ secrets.MODULO_BRANCH_FIXER_HMAC_SECRET }}
          MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          TIMESTAMP=$(date +%s)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # headSha (FAR-1034): mirrors the notify-pr-failure payload so the
          # Branch Fixer trigger can coalesce repeated failures at the same
          # main SHA.
          FINGERPRINT="CI: Fast Validation|main|${MAIN_SHA}"
          BODY=$(jq -n \
            --arg branchName "main" \
            --argjson prNumber 0 \
            --arg headSha "${MAIN_SHA}" \
            --arg runUrl "${RUN_URL}" \
            --arg failureDescription "CI checks failed on main at ${{ github.sha }}. The Branch Fixer should create a fix branch from main, diagnose the failure, fix it, and raise a PR." \
            --arg fingerprint "${FINGERPRINT}" \
            '{branchName: $branchName, prNumber: $prNumber, headSha: $headSha, runUrl: $runUrl, failureDescription: $failureDescription, fingerprint: $fingerprint}')
          echo "CI checks failed on main (${{ github.sha }}) -- dispatching Branch Fixer."
          # Retry with exponential backoff on transient network failures (curl HTTP 000) and 429/5xx (max 5
          # attempts, ~5 min total). TIMESTAMP and HMAC are recomputed per
          # attempt: the server enforces a +/-300s replay window on
          # X-Modulo-Timestamp, so a signature computed once would fall
          # outside the window after backoff sleep.
          DISPATCHED="false"
          LAST_HTTP=""
          for i in 1 2 3 4 5; do
            TIMESTAMP=$(date +%s)
            HMAC=$(echo -n "${TIMESTAMP}.${BODY}" | openssl dgst -sha256 -hmac "${HMAC_SECRET}" | sed 's/^.* //')
            # `|| RESPONSE=""` stops the default `bash -e` (GitHub Actions adds
            # it to `run:` steps) from aborting this retry loop on the FIRST
            # curl failure. Without it a curl timeout (exit 28) killed the step
            # immediately, so the HTTP 000 retry branch below (the whole point
            # of the loop) never ran and a transient webhook blip permanently
            # lost the dispatch.
            RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 30 -X POST "${WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
              -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
              -d "${BODY}") || RESPONSE=""
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            # A failed curl writes no body, so tail -1 is empty; normalise it to
            # the HTTP 000 sentinel the retry/no-op branches key off.
            [ -n "$HTTP_CODE" ] || HTTP_CODE="000"
            BODY_RESP=$(echo "$RESPONSE" | sed '$d')
            LAST_HTTP="$HTTP_CODE"
            if [ "$HTTP_CODE" = "202" ]; then
              RESP_STATUS=$(echo $BODY_RESP | jq -r '.status // "accepted"')
              if [ "$RESP_STATUS" = "coalesced" ]; then
                echo "::notice::Branch Fixer coalesced (duplicate CI-failure for same sha — suppressed)"
              else
                echo "Branch Fixer accepted (run: $(echo $BODY_RESP | jq -r '.run_id // "unknown"'))"
              fi
              DISPATCHED="true"
              break
            elif [ "$HTTP_CODE" = "400" ] && echo "$BODY_RESP" | grep -q "Duplicate webhook payload"; then
              # FAR-1097 follow-up: HTTP 400 "Duplicate webhook payload" is the
              # engine's byte-level idempotency guard (DuplicateWebhookError) —
              # the identical delivery was already ACCEPTED within the ~5-min
              # dedup window (a concurrent run or a workflow re-run). It is a
              # handled no-op, NOT a dispatch failure.
              echo "::notice::Branch Fixer duplicate delivery suppressed (identical payload already accepted within the dedup window)"
              DISPATCHED="true"
              break
            elif [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" = "429" ] || [ "$HTTP_CODE" -ge 500 ]; then
              DELAY=$((2 ** (i - 1) * 5))
              echo "::warning::Branch Fixer returned HTTP $HTTP_CODE (attempt $i/5) — retrying in ${DELAY}s"
              sleep "$DELAY"
            else
              echo "::warning::Branch Fixer returned HTTP $HTTP_CODE: $(echo $BODY_RESP | jq -r '.detail // "unknown"')"
              break
            fi
          done
          if [ "$DISPATCHED" != "true" ]; then
            DETAIL=$(echo "$BODY_RESP" | jq -r '.detail // "unknown"' 2>/dev/null || echo "unknown"); DETAIL=${DETAIL:-unknown}
            echo "::error::Branch Fixer webhook dispatch failed (HTTP ${LAST_HTTP}: ${DETAIL}) — main CI failure was not handed to the autonomous fix loop."
            exit 1
          fi

  notify-pr-review:
    name: Trigger PR Reviewer
    # Mirror the notify-pr-failure pattern above: a job-level `success()`
    # surfaces this check as "skipped" in the check-runs API whenever any
    # needed job fails or is cancelled (e.g. a runner outage), and the PR
    # Reviewer flags that as a non-green signal. The check itself always
    # reports success on pull_request events; the "only dispatch when all
    # needed checks are green" logic lives on the webhook step below.
    if: github.event_name == 'pull_request' && always()
    # FAR-1429: `needs` must list EVERY job that can fail on a PR. failure() and
    # success() in the steps below consider all ancestor jobs, so a failing job
    # missing from this list (tier1b-light, sonarcloud-scan,
    # migration-heads-check were) never reached the Branch Fixer / reviewer
    # gate. A job that is merely SKIPPED is neither failure() nor cancelled();
    # every job here either always runs (path gates are step-level) or is only
    # skipped because an ancestor already failed, which is itself a failure.
    needs: [changes, backend-lint, backend-test, integration-changed, tier1b-light, frontend, sonarcloud-scan, sonar-new-issues-gate, coverage-gate, schema-freshness, gitleaks, migration-heads-check, break-glass-deploy-gate]
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Skip PR Reviewer when head already reviewed or only merged since last review
        id: review-check
        if: success() && !contains(github.event.pull_request.labels.*.name, 'manual-delivery')
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Guard the wiring: the dedup script is a no-op if the repo was not
          # checked out (GitHub Actions runners start with an empty workspace),
          # so the notify-pr-review job checks out the repo first. The
          # deterministic path must fail LOUDLY, not fall through to the
          # fail-open `|| echo "skip=false"` below, or a wiring bug silently
          # dispatches every webhook and defeats the dedup feature.
          test -f .github/scripts/pr-review-dedup.py || { echo "::error::pr-review-dedup.py not found - dedup disabled"; exit 1; }
          # Fetch the PR's reviews and commits JSON, then run the versioned
          # dedup decision script (.github/scripts/pr-review-dedup.py).
          # The script handles multi-line bodies and pipe chars correctly
          # (naive cut -d'|' is line-oriented and corrupts the SHA), and
          # fails open (dispatch) on any load error or ambiguous state.
          gh api "/repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" --paginate > /tmp/pr-reviews.json 2>/dev/null || echo "[]" > /tmp/pr-reviews.json
          gh api "/repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100" --paginate > /tmp/pr-commits.json 2>/dev/null || echo "[]" > /tmp/pr-commits.json
          SKIP_OUTPUT=$(python3 .github/scripts/pr-review-dedup.py /tmp/pr-reviews.json /tmp/pr-commits.json "${HEAD_SHA}" 2>/tmp/pr-dedup-err || echo "skip=false")
          echo "${SKIP_OUTPUT}" >> "$GITHUB_OUTPUT"
          echo "PR Reviewer dedup: ${SKIP_OUTPUT}"
          cat /tmp/pr-dedup-err
      - name: Send webhook to Modulo PR Review Agent
        if: success() && steps.review-check.outputs.skip != 'true' && !contains(github.event.pull_request.labels.*.name, 'manual-delivery')
        env:
          MODULO_WEBHOOK_URL: ${{ secrets.MODULO_PR_REVIEW_WEBHOOK_URL }}
          MODULO_WEBHOOK_SECRET: ${{ secrets.MODULO_PR_REVIEW_WEBHOOK_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # jq -n --arg/--argjson JSON-escapes every value, so a crafted branch
          # name (legal in git refnames, e.g. containing '"') cannot inject
          # keys or break the payload. See FAR-568.
          BODY=$(jq -n \
            --arg repo "${REPO}" \
            --argjson prNumber "${PR_NUMBER}" \
            --arg sha "${SHA}" \
            --arg ref "${BRANCH}" \
            '{action: "check_run", repository: {full_name: $repo}, pull_request: {number: $prNumber, head: {sha: $sha, ref: $ref}}}')

          # Retry with exponential backoff on network failures (curl HTTP 000) and 429/5xx (max 5 attempts, ~5 min total)
          # TIMESTAMP and HMAC are recomputed PER ATTEMPT: the server enforces a
          # +/-300s replay window on X-Modulo-Timestamp, so a signature computed
          # once (before a slow attempt) would fall outside the window after a
          # 429/5xx retry and be rejected as a replay — silently losing the
          # review. Recomputing each iteration keeps every signature fresh.
          DISPATCHED="false"
          LAST_HTTP=""
          for i in 1 2 3 4 5; do
            TIMESTAMP=$(date +%s)
            HMAC=$(echo -n "${TIMESTAMP}.${BODY}" | openssl dgst -sha256 -hmac "${MODULO_WEBHOOK_SECRET}" | sed 's/^.* //')
            # `|| RESPONSE=""` stops the default `bash -e` (GitHub Actions adds
            # it to `run:` steps) from aborting this retry loop on the FIRST
            # curl failure. Without it a curl timeout (exit 28) killed the step
            # immediately, so the HTTP 000 retry branch below (the whole point
            # of the loop) never ran and a transient webhook blip permanently
            # lost the review trigger.
            RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 30 -X POST "${MODULO_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
              -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
              -d "${BODY}") || RESPONSE=""
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            # A failed curl writes no body, so tail -1 is empty; normalise it to
            # the HTTP 000 sentinel the retry/no-op branches key off.
            [ -n "$HTTP_CODE" ] || HTTP_CODE="000"
            BODY_RESP=$(echo "$RESPONSE" | sed '$d')
            LAST_HTTP="$HTTP_CODE"
            if [ "$HTTP_CODE" = "202" ]; then
              echo "PR Reviewer accepted (run: $(echo $BODY_RESP | jq -r '.run_id // "unknown"'))"
              DISPATCHED="true"
              break
            elif [ "$HTTP_CODE" = "400" ] && echo "$BODY_RESP" | grep -q "Duplicate webhook payload"; then
              # FAR-1097 follow-up: HTTP 400 "Duplicate webhook payload" is the
              # engine's byte-level idempotency guard (DuplicateWebhookError) —
              # the identical delivery was already ACCEPTED within the ~5-min
              # dedup window (e.g. two concurrent CI runs both dispatching the
              # same PR+SHA check_run). It is a handled no-op, NOT a dispatch
              # failure; retrying would only re-hit the same window.
              echo "::notice::PR Reviewer duplicate delivery suppressed (identical payload already accepted within the dedup window)"
              DISPATCHED="true"
              break
            elif [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" = "429" ] || [ "$HTTP_CODE" -ge 500 ]; then
              DELAY=$((2 ** (i - 1) * 5))
              echo "::warning::PR Reviewer returned HTTP $HTTP_CODE (attempt $i/5) retrying in ${DELAY}s"
              sleep "$DELAY"
            else
              echo "::warning::PR Reviewer returned HTTP $HTTP_CODE: $(echo $BODY_RESP | jq -r '.detail // "unknown"')"
              break
            fi
          done
          if [ "$DISPATCHED" != "true" ]; then
            DETAIL=$(echo "$BODY_RESP" | jq -r '.detail // "unknown"' 2>/dev/null || echo "unknown"); DETAIL=${DETAIL:-unknown}
            echo "::error::PR Reviewer webhook dispatch failed (HTTP ${LAST_HTTP}: ${DETAIL}) — PR review was not triggered."
            exit 1
          fi
          echo "PR Reviewer notified"

      - name: Report PR Reviewer check status
        if: success()
        run: echo "PR Reviewer trigger check passed (all required checks green, webhook sent or suppressed by manual-delivery label)."

  self-report-ci:
    name: Self-report CI stage to Modulo
    # FAR-666: the lifecycle-map "Farnalabs SDLC (dogfooding)" journey's CI
    # Validate stage is EXTERNAL (a GitHub Actions workflow, not a Modulo
    # pipeline), so no pipeline run ever advanced it — merge-queue.yml reports
    # the "merge" stage and deploy.yml the "deploy" stage, but nothing reported
    # "ci". This job closes that gap once the PR-validation jobs have finished.
    #
    # stage_id: "ci" names the lifecycle-map stage this workflow completes. The
    # stage is EXTERNAL, so it has no pipeline_id for the advancement service to
    # resolve; the endpoint uses stage_id to advance the journey into it.
    #
    # REF CONTRACT: the work-item ref uses kind "pr" + the BARE PR number.
    # Webhook triggers mint journeys keyed (org, "pr", "<number>") and the
    # canonical journey key is uuid5(NAMESPACE, "{org}:{kind}:{ref}") — kind
    # "github_pr" would never match, so confirm_reported_refs would find no
    # journey and the report would be dropped as unmatched. (The leading "#"
    # is stripped by canonicalisation — it was never the issue.)
    #
    # FAIL-OPEN BY DESIGN: discovery + the optional POST are guarded so a Modulo
    # outage can NEVER fail CI. The payload is always recorded in the log; the
    # POST only fires when MODULO_SELF_REPORT_URL is configured, and a POST
    # failure is downgraded to a ::warning::. The endpoint is POST
    # /api/v1/lifecycle-maps/{lifecycle_map_id}/journeys/self-report (FAR-143);
    # the URL secret points at the dogfood map's endpoint.
    #
    # NOT a required check: this job is observability only.
    if: github.event_name == 'pull_request' && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [backend-lint, backend-test, integration-changed, frontend, coverage-gate, sonarcloud-scan, sonar-new-issues-gate, schema-freshness, gitleaks, migration-heads-check, break-glass-deploy-gate]
    runs-on: ubicloud-standard-2
    steps:
      - name: Self-report CI Validate stage to Modulo (fail-open, best-effort)
        env:
          MODULO_SELF_REPORT_URL: ${{ secrets.MODULO_SELF_REPORT_URL }}
          MODULO_SELF_REPORT_TOKEN: ${{ secrets.MODULO_SELF_REPORT_TOKEN }}
          # Mapped through the step env block (S7630): GitHub expressions inside
          # a run block are interpolated before the shell parses the script, so
          # via env: the value is data, never code. (Same pattern as the
          # notify-* jobs above.)
          PR_NUM: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          # Exactly one ref: the PR this CI run validates. jq --arg JSON-escapes
          # the value; kind "pr" + bare number matches the webhook-minted
          # journey family (see the job comment above).
          PAYLOAD=$(jq -n --arg ref "${PR_NUM}" \
            '{event: "workflow_self_report", source: "github_actions", workflow: "ci", stage_id: "ci", work_item_refs: [{"kind": "pr", "ref": $ref, "status": "done"}]}')

          echo "=== Modulo self-report payload (CI Validate) ==="
          echo "$PAYLOAD"

          if [ -z "$MODULO_SELF_REPORT_URL" ]; then
            echo "::notice::MODULO_SELF_REPORT_URL not configured - CI stage recorded in log only, POST skipped (fail-open)."
            exit 0
          fi

          # Capture status + body: a 200 with {"accepted":0,"unmatched":1} must
          # NOT read as success — that masking is the exact FAR-666 failure mode.
          # Keep -sS (stderr stays visible: connection/TLS errors reach the log);
          # drop -f so we can branch on the real HTTP status code.
          HTTP_CODE=$(curl -sS -o "${RUNNER_TEMP}/self-report-body.json" -w '%{http_code}' --max-time 15 -X POST "$MODULO_SELF_REPORT_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $MODULO_SELF_REPORT_TOKEN" \
            -d "$PAYLOAD") || HTTP_CODE="000"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::Modulo self-report POST failed (HTTP $HTTP_CODE): $(cat "${RUNNER_TEMP}/self-report-body.json" 2>/dev/null || echo 'no body') - CI stage recorded in log only (fail-open)."
            exit 0
          fi

          ACCEPTED=$(jq -r '.accepted // 0' "${RUNNER_TEMP}/self-report-body.json" 2>/dev/null || echo 0)
          UNMATCHED=$(jq -r '.unmatched // 0' "${RUNNER_TEMP}/self-report-body.json" 2>/dev/null || echo 0)
          REJECTED=$(jq -r '.rejected // 0' "${RUNNER_TEMP}/self-report-body.json" 2>/dev/null || echo 0)
          REF_COUNT=$(echo "$PAYLOAD" | jq '.work_item_refs | length' 2>/dev/null || echo 0)
          if [ "$UNMATCHED" -gt 0 ] || { [ "$ACCEPTED" -eq 0 ] && [ "$REF_COUNT" -gt 0 ]; }; then
            echo "::warning::Modulo self-report matched no journeys (accepted=$ACCEPTED unmatched=$UNMATCHED rejected=$REJECTED) - check the ref kind/ref contract (expected kind 'pr' + bare PR number matching webhook-minted journeys)"
            exit 0
          fi
          echo "Self-report delivered to Modulo (accepted=$ACCEPTED unmatched=$UNMATCHED)."
