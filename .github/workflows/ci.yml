name: CI

on:
  workflow_dispatch:

env:
  SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
  FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="

jobs:
  # ── Fast jobs — run on ALL events (PR + push + manual) ──────────────────────

  backend-lint:
    name: Lint (Backend)
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src/modulo/
      - run: uv run --no-sync bandit -r src/modulo/ -ll
      - name: Semgrep (block new findings)
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            baseline="origin/$GITHUB_BASE_REF"
          else
            baseline="HEAD^"
          fi
          uv run --no-sync semgrep --config=../.semgrep/ --baseline-commit "$baseline" --error .
      - run: uv run --no-sync pip-audit

  backend-test:
    name: Test (Backend) - ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run unit tests with coverage
        shell: bash
        run: ../.github/scripts/coverage-thresholds.sh
        env:
          DATABASE_URL: "postgresql+asyncpg://unused:unused@localhost/unused"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.os }}
          path: backend/coverage.xml

  frontend:
    name: Frontend and WCAG
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Run WCAG contrast tests
        run: npx playwright test wcag-contrast
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build
      - run: npm audit

  product-map-validate:
    name: Product map validation
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Setup PowerShell
        shell: bash
        run: |
          if ! command -v pwsh &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq powershell
          fi
      - name: Validate product map graph
        shell: bash
        run: pwsh -NoProfile -File tools/graph-validate.ps1 -CI

  manifest-validate:
    name: Manifest validation
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Setup PowerShell
        shell: bash
        run: |
          if ! command -v pwsh &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq powershell
          fi
      - name: Validate manifest.yaml
        shell: bash
        run: pwsh -NoProfile -File tools/validate-manifest.ps1 -CI


  gitleaks:
    name: Secret scan
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Full jobs — run ONLY on push (not PRs) ─────────────────────────────────

  backend-integration:
    name: Integration tests
    if: github.event_name == 'push'
    runs-on: ubicloud-standard-2
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, gitleaks]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12.4"
      - name: Start Postgres
        shell: bash
        run: |
          docker rm -f modulo-ci-pg 2>/dev/null || true
          docker run -d --name modulo-ci-pg \
            -e POSTGRES_USER=modulo_test \
            -e POSTGRES_PASSWORD=modulo_test \
            -e POSTGRES_DB=modulo_test \
            -p 5433:5432 \
            postgres:16-alpine
          echo "Waiting for Postgres..."
          for i in $(seq 1 60); do
            docker exec modulo-ci-pg pg_isready -U modulo_test 2>/dev/null && { echo "Postgres ready"; break; }
            sleep 2
          done
      - name: Start Redis
        shell: bash
        run: |
          docker rm -f modulo-ci-redis 2>/dev/null || true
          docker run -d --name modulo-ci-redis \
            -p 6379:6379 \
            redis:7-alpine
          echo "Waiting for Redis..."
          for i in $(seq 1 30); do
            docker exec modulo-ci-redis redis-cli ping 2>/dev/null && { echo "Redis ready"; break; }
            sleep 2
          done
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Run integration tests
        working-directory: backend
        run: uv run --no-sync pytest tests/integration/ -m integration -n 2 --cov=src/modulo --cov-report=xml --cov-fail-under=0 -q
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo_test:modulo_test@localhost:5433/modulo_test"
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Schemathesis API fuzz testing
        shell: bash
        run: uv run --no-sync pytest tests/integration/test_schemathesis.py -x --timeout=120
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo_test:modulo_test@localhost:5433/modulo_test"
          REDIS_URL: "redis://localhost:6379/0"
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Stop containers
        if: always()
        shell: bash
        run: |
          docker rm -f modulo-ci-pg 2>/dev/null || true
          docker rm -f modulo-ci-redis 2>/dev/null || true

  bdd-e2e:
    name: BDD / E2E Tests
    if: github.event_name == 'push'
    runs-on: ubicloud-standard-2
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, gitleaks]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Start Postgres
        shell: bash
        run: |
          docker rm -f modulo-ci-pg 2>/dev/null || true
          docker run -d --name modulo-ci-pg \
            -e POSTGRES_USER=modulo \
            -e POSTGRES_PASSWORD=modulo \
            -e POSTGRES_DB=modulo \
            -p 5432:5432 \
            postgres:16-alpine
          echo "Waiting for Postgres..."
          for i in $(seq 1 60); do
            docker exec modulo-ci-pg pg_isready -U modulo 2>/dev/null && { echo "Postgres ready"; break; }
            sleep 2
          done
      - name: Start Redis
        shell: bash
        run: |
          docker rm -f modulo-ci-redis 2>/dev/null || true
          docker run -d --name modulo-ci-redis \
            -p 6379:6379 \
            redis:7-alpine
          echo "Waiting for Redis..."
          for i in $(seq 1 30); do
            docker exec modulo-ci-redis redis-cli ping 2>/dev/null && { echo "Redis ready"; break; }
            sleep 2
          done
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Install Playwright browsers
        working-directory: backend
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Pre-create alembic_version table
        shell: bash
        run: |
          docker exec modulo-ci-pg psql -U modulo -d modulo -c "CREATE TABLE IF NOT EXISTS alembic_version (version_num VARCHAR(255) NOT NULL PRIMARY KEY);"
      - name: Run migrations
        working-directory: backend
        run: uv run --no-sync alembic upgrade heads
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo:modulo@localhost:5432/modulo"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start backend
        working-directory: backend
        shell: bash
        run: nohup uv run --no-sync uvicorn modulo.api.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo:modulo@localhost:5432/modulo"
          MODULO_PUBLIC_URL: "http://localhost:8000"
          MODULO_USERS: "admin:admin"
          CORS_ORIGINS: "http://localhost:4173"
          MODULO_PLUGIN_DISCOVERY: "false"
          REDIS_URL: "redis://localhost:6379/0"
      - name: Serve frontend
        working-directory: frontend
        shell: bash
        run: nohup npm run preview -- --port 4173 > /dev/null 2>&1 &
      - name: Wait for healthz
        shell: bash
        run: |
          for i in $(seq 1 60); do
            curl -s -o /dev/null -m 2 http://localhost:8000/healthz && { echo "Backend healthy after ${i}s"; exit 0; }
            sleep 2
          done
          echo "=== Backend log ==="
          head -n 100 backend/backend.log 2>/dev/null || true
          echo "=== Process check ==="
          ps aux | grep uv || true
          exit 1
      - name: Wait for frontend
        shell: bash
        run: npx wait-on http://localhost:4173 --timeout 30000
      - name: Run BDD tests
        working-directory: backend
        run: uv run --no-sync pytest tests/bdd/ -m e2e --base-url http://localhost:4173 -q
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo:modulo@localhost:5432/modulo"
      - name: Cleanup containers
        if: always()
        shell: bash
        run: |
          docker rm -f modulo-ci-pg 2>/dev/null || true
          docker rm -f modulo-ci-redis 2>/dev/null || true

  docker-build:
    name: Docker build and scan
    if: github.event_name == 'push'
    runs-on: ubicloud-standard-2
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, gitleaks]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          push: false
          tags: modulo-backend:${{ github.sha }}

      - name: Build frontend development image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: modulo-frontend-dev:${{ github.sha }}

      - name: Build frontend production image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          load: true
          push: false
          tags: modulo-frontend:${{ github.sha }}

      - name: Scan backend image with Trivy
        id: scan-backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: modulo-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL
          exit-code: 1

      - name: Scan frontend development image with Trivy
        id: scan-frontend-dev
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: modulo-frontend-dev:${{ github.sha }}
          format: sarif
          output: trivy-frontend-dev.sarif
          severity: CRITICAL
          exit-code: 1

      - name: Scan frontend production image with Trivy
        id: scan-frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: modulo-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL
          exit-code: 1

      - name: Upload backend SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: backend

      - name: Upload frontend SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: frontend

      - name: Upload frontend development SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-dev.sarif
          category: frontend-development

      - name: Enforce vulnerability scan results
        if: steps.scan-backend.outcome == 'failure' || steps.scan-frontend-dev.outcome == 'failure' || steps.scan-frontend.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::One or more container images contain critical vulnerabilities."
          exit 1

  security-audit:
    name: Security audit
    if: github.event_name == 'push'
    runs-on: ubicloud-standard-2
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, gitleaks]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - name: pip-audit (backend)
        working-directory: backend
        run: uv run pip-audit
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit
      - name: Semgrep (block new findings)
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            baseline="origin/$GITHUB_BASE_REF"
          else
            baseline="HEAD^"
          fi
          uv --directory backend run --no-sync semgrep --config=.semgrep/ --baseline-commit "$baseline" --error .

  # ── Failure notifications ──────────────────────────────────────────────────

  notify-push-failure:
    name: Notify Modulo fixer
    if: github.event_name == 'push' && (failure() || cancelled())
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, gitleaks, backend-integration, bdd-e2e, docker-build, security-audit]
    runs-on: ubicloud-standard-2
    steps:
      - name: Send webhook to Modulo fixer
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.MODULO_MERGE_FIXER_WEBHOOK_URL }}
          HMAC_SECRET: ${{ secrets.MODULO_MERGE_FIXER_HMAC_SECRET }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then echo "No webhook URL configured"; exit 0; fi
          TIMESTAMP=$(date +%s)
          BODY=$(cat <<ENDJSON
          {
            "repository": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}",
            "branch": "${{ github.ref_name }}",
            "event": "${{ github.event_name }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          ENDJSON
          )
          PAYLOAD="${TIMESTAMP}.${BODY}"
          HMAC=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$HMAC_SECRET" | sed 's/^.* //')
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
            -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
            -d "$BODY"
          echo "Modulo fixer notified"

  notify-pr-failure:
    name: Notify Modulo fixer
    if: github.event_name == 'pull_request' && (failure() || cancelled())
    needs: [backend-lint, backend-test, frontend, product-map-validate, manifest-validate, gitleaks]
    runs-on: ubicloud-standard-2
    steps:
      - name: Send webhook to Modulo fixer
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.MODULO_MERGE_FIXER_WEBHOOK_URL }}
          HMAC_SECRET: ${{ secrets.MODULO_MERGE_FIXER_HMAC_SECRET }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then echo "No webhook URL configured"; exit 0; fi
          TIMESTAMP=$(date +%s)
          BODY=$(cat <<ENDJSON
          {
            "action": "check_run",
            "repository": {"full_name": "${{ github.repository }}"},
            "run_id": "${{ github.run_id }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "pull_request": {
              "number": ${{ github.event.pull_request.number }},
              "head": {
                "sha": "${{ github.event.pull_request.head.sha }}",
                "ref": "${{ github.event.pull_request.head.ref }}"
              },
              "base": {
                "ref": "${{ github.event.pull_request.base.ref }}"
              }
            }
          }
          ENDJSON
          )
          PAYLOAD="${TIMESTAMP}.${BODY}"
          HMAC=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$HMAC_SECRET" | sed 's/^.* //')
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
            -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
            -d "$BODY"
          echo "Modulo fixer notified of PR failure"
