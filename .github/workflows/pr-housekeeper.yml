# PR Housekeeper
# Scans all open PRs and handles stale/abandoned PRs automatically.
# Runs every 30 minutes alongside the merge queue.
# NON-AI tasks only: CI re-dispatch, reminders, conflict notices, stale closing.
# AI fix work is dispatched to the Modulo Branch Fixer pipeline via webhook.

name: PR Housekeeper

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  housekeep:
    name: PR Housekeeper
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Check main CI
        id: check-main
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
          BF_WEBHOOK_URL: ${{ secrets.MODULO_BRANCH_FIXER_WEBHOOK_URL }}
          BF_HMAC_SECRET: ${{ secrets.MODULO_BRANCH_FIXER_HMAC_SECRET }}
        shell: bash
        run: |
          CI_STATUS=$(gh run list --repo farnalabs/modulo --workflow CI --branch main --limit 1 --json conclusion --jq '.[0].conclusion' 2>/dev/null || echo 'unknown')
          echo 'Main CI: '$CI_STATUS
          if [ '"$CI_STATUS"' = 'failure' ]; then
            echo 'main_ci=failing' >> $GITHUB_OUTPUT
            if [ -n '"$BF_WEBHOOK_URL"' ]; then
              TS=$(date +%s)
              BODY=$(jq -n --arg bn 'main' --arg fd 'Main CI failing' '{branchName: $bn, failureDescription: $fd}')
              HMAC=$(echo -n '"$TS.$BODY"' | openssl dgst -sha256 -hmac '"$BF_HMAC_SECRET"' | sed 's/^.* //')
              curl -s -X POST '"$BF_WEBHOOK_URL"' -H 'Content-Type: application/json' -H 'X-Modulo-Timestamp: $TS' -H 'X-Modulo-Webhook-Secret: sha256=$HMAC' -d '"$BODY"' || true
            fi
          else
            echo 'main_ci=ok' >> $GITHUB_OUTPUT
          fi

      - name: List all open PRs
        id: list
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
        shell: bash
        run: |
          echo "Fetching open PRs..."
          gh pr list --state open --json number,title,headRefName,createdAt,updatedAt,mergeable,reviews,statusCheckRollup --limit 50 > /tmp/prs.json
          COUNT=$(jq 'length' /tmp/prs.json)
          echo "Found $COUNT open PR(s)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Process each PR
        if: steps.check-main.outputs.main_ci == 'ok' && steps.list.outputs.count > 0
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
          BF_WEBHOOK_URL: ${{ secrets.MODULO_BRANCH_FIXER_WEBHOOK_URL }}
          BF_HMAC_SECRET: ${{ secrets.MODULO_BRANCH_FIXER_HMAC_SECRET }}
        run: |
          NOW=$(date +%s)
          ACTIONS=""

          jq -c '.[]' /tmp/prs.json | while IFS= read -r pr; do
            NUM=$(echo "$pr" | jq -r '.number')
            TITLE=$(echo "$pr" | jq -r '.title')
            REF=$(echo "$pr" | jq -r '.headRefName')
            CREATED=$(echo "$pr" | jq -r '.createdAt')
            UPDATED=$(echo "$pr" | jq -r '.updatedAt')
            MERGEABLE=$(echo "$pr" | jq -r '.mergeable')
            REVIEW_STATE=$(echo "$pr" | jq -r '.reviews[-1].state // "none"')
            CHECKS=$(echo "$pr" | jq -r '.statusCheckRollup // []')

            CREATED_TS=$(date -d "$CREATED" +%s 2>/dev/null || echo 0)
            UPDATED_TS=$(date -d "$UPDATED" +%s 2>/dev/null || echo 0)
            AGE_HOURS=$(( (NOW - CREATED_TS) / 3600 ))
            STALE_HOURS=$(( (NOW - UPDATED_TS) / 3600 ))

            echo "---"

            # Check retry limit: skip if housekeeper has already pushed 3+ commits to this PR
            HK_COUNT=$(gh api "/repos/${{ github.repository }}/pulls/${NUM}/commits?per_page=100" \
              --jq '[.[] | select(.commit.committer.name == "modulo-housekeeper")] | length' 2>/dev/null || echo "0")
            if [ "$HK_COUNT" -ge 3 ]; then
              echo "  SKIP - housekeeper already pushed $HK_COUNT commits to PR #$NUM (limit 3)"
              continue
            fi

            echo "PR #$NUM: $TITLE (age: ${AGE_HOURS}h, stale: ${STALE_HOURS}h, mergeable: $MERGEABLE, review: $REVIEW_STATE)"

            if [ "$STALE_HOURS" -lt 0 ] && [ "$REVIEW_STATE" != "CHANGES_REQUESTED" ]; then
              echo "  SKIP - updated recently (<1h)"
              continue
            fi

            CHECKS_COUNT=$(echo "$CHECKS" | jq 'length')
            STALE_CHECKS=$(echo "$CHECKS" | jq '[.[] | select(.status == "QUEUED" or .status == "PENDING" or .status == "EXPECTED")] | length')
            FAILED_CHECKS=$(echo "$CHECKS" | jq '[.[] | select(.conclusion == "FAILURE" or .conclusion == "ACTION_REQUIRED")] | length')

            # Rule 1: No CI checks at all — webhook may have failed
            if [ "$CHECKS_COUNT" -eq 0 ]; then
              echo "  ACTION: No CI checks — re-dispatching CI"
              gh workflow run ci.yml --ref "$REF" 2>/dev/null && echo "  CI dispatched" || echo "  WARNING: Could not dispatch CI"
              ACTIONS="$ACTIONS ci-dispatch-$NUM"
              continue
            fi

            # Rule 2: CI stuck on pending checks
            if [ "$STALE_CHECKS" -gt 0 ] && [ "$STALE_HOURS" -ge 0 ]; then
              echo "  ACTION: ${STALE_CHECKS} check(s) stuck — re-dispatching CI"
              gh workflow run ci.yml --ref "$REF" 2>/dev/null && echo "  CI dispatched" || echo "  WARNING: Could not dispatch CI"
              ACTIONS="$ACTIONS ci-redispatch-$NUM"
              continue
            fi

            # Rule 3: CI failed — dispatch to Modulo Branch Fixer pipeline
            if [ "$FAILED_CHECKS" -gt 0 ] && [ "$STALE_HOURS" -ge 0 ]; then
              echo "  ACTION: ${FAILED_CHECKS} check(s) failed — dispatching to Modulo Branch Fixer"
              if [ -n "$BF_WEBHOOK_URL" ]; then
                TIMESTAMP=$(date +%s)
                BODY=$(cat << ENDJSON
                {
                  "branchName": "${REF}",
                  "prNumber": ${NUM},
                  "failureDescription": "PR Housekeeper detected ${FAILED_CHECKS} failed CI check(s) on PR #${NUM} (branch: ${REF})"
                }
          ENDJSON
                )
                HMAC=$(echo -n "${TIMESTAMP}.${BODY}" | openssl dgst -sha256 -hmac "${BF_HMAC_SECRET}" | sed 's/^.* //')
                for attempt in 10 20 40; do
                  RESP=$(curl -s -w "\n%{http_code}" -X POST "${BF_WEBHOOK_URL}" \
                    -H "Content-Type: application/json" \
                    -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
                    -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
                    -d "${BODY}")
                  HTTP=$(echo "$RESP" | tail -1)
                  if [ "$HTTP" = "202" ] || [ "$HTTP" = "200" ]; then
                    echo "  Branch Fixer pipeline accepted (attempt $attempt)"
                    break
                  elif [ "$HTTP" = "429" ]; then
                    echo "  Rate limited (attempt $attempt) - retrying in ${attempt}s"
                    sleep "$attempt"
                  else
                    echo "  WARNING: Branch Fixer returned HTTP $HTTP (attempt $attempt)"
                    sleep "$attempt"
                  fi
                done
              else
                echo "  WARNING: No Branch Fixer webhook URL configured - cannot dispatch fix"
              fi
              ACTIONS="$ACTIONS branch-fix-notified-$NUM"
              continue
            fi

            # Rule 4: CHANGES_REQUESTED - dispatch to Modulo Branch Fixer
            if [ "$REVIEW_STATE" = "CHANGES_REQUESTED" ] && [ "$STALE_HOURS" -ge 0 ]; then
              echo "  ACTION: CHANGES_REQUESTED for ${STALE_HOURS}h - dispatching to Modulo Branch Fixer"
              if [ -n "$BF_WEBHOOK_URL" ]; then
                TIMESTAMP=$(date +%s)
                BODY=$(cat << ENDJSON
                {
                  "branchName": "${REF}",
                  "prNumber": ${NUM},
                  "failureDescription": "PR Housekeeper: modulo-reviewbot requested changes on PR #${NUM} (branch: ${REF})"
                }
          ENDJSON
                )
                HMAC=$(echo -n "${TIMESTAMP}.${BODY}" | openssl dgst -sha256 -hmac "${BF_HMAC_SECRET}" | sed 's/^.* //')
                for attempt in 10 20 40; do
                  RESP=$(curl -s -w "\n%{http_code}" -X POST "${BF_WEBHOOK_URL}" \
                    -H "Content-Type: application/json" \
                    -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
                    -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
                    -d "${BODY}")
                  HTTP=$(echo "$RESP" | tail -1)
                  if [ "$HTTP" = "202" ] || [ "$HTTP" = "200" ]; then
                    echo "  Branch Fixer pipeline accepted (attempt $attempt)"
                    break
                  elif [ "$HTTP" = "429" ]; then
                    echo "  Rate limited (attempt $attempt) - retrying in ${attempt}s"
                    sleep "$attempt"
                  else
                    echo "  WARNING: Branch Fixer returned HTTP $HTTP (attempt $attempt)"
                    sleep "$attempt"
                  fi
                done
              else
                echo "  WARNING: No Branch Fixer webhook URL configured - cannot dispatch fix"
              fi
              ACTIONS="$ACTIONS bf-review-fix-$NUM"
              continue
            fi


            # Rule 5: Approved but has merge conflicts
            if [ "$REVIEW_STATE" = "APPROVED" ] && [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "  ACTION: Approved but has merge conflicts — posting rebase reminder"
              echo "## PR Housekeeper Notice" > /tmp/pr-msg.txt
              echo "" >> /tmp/pr-msg.txt
              echo "This PR is approved but has merge conflicts with main. Please rebase." >> /tmp/pr-msg.txt
              gh pr comment "$NUM" --body-file /tmp/pr-msg.txt 2>/dev/null || echo "  WARNING: Could not post comment"
              ACTIONS="$ACTIONS conflict-notify-$NUM"
              continue
            fi

            # Rule 6: Stale >24h with no progress — close
            if [ "$AGE_HOURS" -ge 24 ] && [ "$CHECKS_COUNT" -eq 0 ] && [ "$REVIEW_STATE" = "none" ]; then
              echo "  ACTION: PR stale >24h — closing"
              echo "## PR Housekeeper" > /tmp/pr-msg.txt
              echo "" >> /tmp/pr-msg.txt
              echo "This PR has been open for over 24 hours with no activity. Closing as stale." >> /tmp/pr-msg.txt
              gh pr close "$NUM" --comment-file /tmp/pr-msg.txt 2>/dev/null || echo "  WARNING: Could not close PR"
              ACTIONS="$ACTIONS closed-$NUM"
              continue
            fi

            echo "  No action needed"
          done

          echo ""
          if [ -n "$ACTIONS" ]; then
            echo "=== Actions taken: $ACTIONS ==="
          else
            echo "=== No actions needed ==="
          fi
