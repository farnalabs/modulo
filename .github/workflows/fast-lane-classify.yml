name: "CI: Fast Lane Classify"

# FAR-1099: Classify PRs for fast-lane eligibility. The job's natural
# conclusion IS the check run ("fast-lane-eligible") that the merge-queue
# reads. No synthetic Check Runs API post — no continue-on-error, no
# neutral-conclusion bug.
#
# This workflow is SEPARATE from ci.yml ("CI: Fast Validation") so that a
# class-B failure here does NOT break the CI run that the merge-queue and
# notify-pr-failure depend on. Class-B PRs stay mergeable; the fast-lane
# check simply concludes "failure" (ineligible).

on:
  pull_request:
    branches: [main]

jobs:
  fast-lane-eligible:
    name: fast-lane-eligible
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Classify PR for fast-lane eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HAS_LABEL=""
          if echo '${{ toJSON(github.event.pull_request.labels.*.name) }}' | grep -q 'fast-lane:test-infra'; then
            HAS_LABEL="--has-label"
          fi
          uv run --no-build --project backend --no-sync python scripts/fast_lane_classify.py \
            --pr-number ${{ github.event.pull_request.number }} \
            --head-sha ${{ github.event.pull_request.head.sha }} \
            --repo ${{ github.repository }} \
            --base-ref "origin/${{ github.event.pull_request.base.ref }}" \
            $HAS_LABEL
