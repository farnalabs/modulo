name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for production deploy'
        required: true

permissions:
  contents: read
  id-token: write
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.env.name }}
    environment: ${{ matrix.env.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env:
          - name: app
            fly-app: app-modulo
            fly-config: fly.toml
            host: app.modulo.run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Log deploy reason
        shell: pwsh
        run: 'Write-Host "Production deploy reason: ${{ inputs.reason }}"'

      - name: Capture git metadata
        id: git
        uses: ./.github/actions/capture-git-metadata

      - id: deploy
        name: Deploy to ${{ matrix.env.name }}.modulo.run
        shell: pwsh
        run: |
          fly deploy --app ${{ matrix.env.fly-app }} --config ${{ matrix.env.fly-config }} `
            --build-arg "GIT_SHA=${{ steps.git.outputs.git-sha }}" `
            --build-arg "GIT_BRANCH=${{ steps.git.outputs.git-branch }}" `
            --build-arg "GIT_COMMIT_TIMESTAMP=${{ steps.git.outputs.git-commit-timestamp }}" `
            --build-arg "GIT_COMMIT_MESSAGE=${{ steps.git.outputs.git-commit-message }}" `
            --build-arg "BUILD_TIMESTAMP=${{ steps.git.outputs.build-timestamp }}"

      - name: Verify deployment
        uses: ./.github/actions/verify-deployment
        with:
          url: https://${{ matrix.env.host }}

      - name: Rollback on verification failure
        if: failure() && steps.deploy.outcome == 'success'
        shell: pwsh
        run: |
          Write-Host "Deploy succeeded but verification failed - rolling back ${{ matrix.env.fly-app }}"
          fly rollback --app ${{ matrix.env.fly-app }}

  consistency:
    name: Cross-environment check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify deployed SHAs
        shell: pwsh
        run: |
          $expectedSha = git rev-parse HEAD
          $expectedSha7 = $expectedSha.Substring(0, 7)
          $allOk = $true
          foreach ($url in @("https://app.modulo.run")) {
            $info = curl.exe -s -m 10 "$url/api/v1/deployment" 2>$null
            if ($info) {
              $deployInfo = $info | ConvertFrom-Json
              $deployedSha = if ($deployInfo.git_sha -and $deployInfo.git_sha.Length -ge 7) { $deployInfo.git_sha.Substring(0, 7) } else { "?" }
              if ($deployedSha -ne $expectedSha7) {
                Write-Host "$url - SHA MISMATCH: $deployedSha != $expectedSha7"
                $allOk = $false
              } else {
                Write-Host "$url - SHA match: $deployedSha"
              }
            } else {
              Write-Host "$url - no deployment info available"
              $allOk = $false
            }
          }
          if (-not $allOk) { exit 1 }
