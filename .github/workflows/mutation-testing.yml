name: "Mutation Testing (weekly baseline)"

on:
  schedule:
    # Weekly on Sunday at 04:00 UTC (offset from other nightlies)
    - cron: "0 4 * * 0"
  workflow_dispatch:

env:
  # Authenticate GitHub git fetches so `uv sync --frozen` can resolve git-pinned
  # dependencies without an anonymous fetch-by-SHA, which GitHub rejects from CI runners.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf'
  GIT_CONFIG_VALUE_0: "https://github.com/"

jobs:
  mutation-baseline:
    name: "Mutation testing (graph_validator + rls)"
    runs-on: ubicloud-standard-2
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run mutmut on high-value modules
        run: |
          # Scope to a SMALL high-value set only — mutation runs are long.
          # Full configured path set is in [tool.mutmut] source_paths in pyproject.toml.
          uv run mutmut run \
            --paths-to-mutate src/modulo/core/graph_validator/ src/modulo/db/rls.py \
            --runner "pytest tests/unit/ -x -q --timeout=60 -m 'not integration and not e2e'"
      - name: Generate mutation report
        if: always()
        run: |
          echo "## Mutation Testing Report" > /tmp/mutation-report.md
          echo "" >> /tmp/mutation-report.md
          echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> /tmp/mutation-report.md
          echo "**Commit:** ${{ github.sha }}" >> /tmp/mutation-report.md
          echo "**Modules:** \`src/modulo/core/graph_validator/\`, \`src/modulo/db/rls.py\`" >> /tmp/mutation-report.md
          echo "" >> /tmp/mutation-report.md
          echo "### Results" >> /tmp/mutation-report.md
          echo "" >> /tmp/mutation-report.md
          # mutmut results are in .mutmut-cache (SQLite). Dump summary if available.
          if [ -f .mutmut-cache ]; then
            uv run python -c "
          import sqlite3, sys
          conn = sqlite3.connect('.mutmut-cache')
          cur = conn.cursor()
          try:
              cur.execute('SELECT status, COUNT(*) FROM mutant GROUP BY status')
              rows = cur.fetchall()
              total = sum(r[1] for r in rows)
              killed = sum(r[1] for r in rows if r[0] == 'killed')
              survived = sum(r[1] for r in rows if r[0] == 'survived')
              for status, count in sorted(rows):
                  print(f'| {status} | {count} |')
              print(f'| **Total** | **{total}** |')
              if total > 0:
                  print(f'| **Kill rate** | **{killed/total*100:.1f}%** |')
              if survived > 0:
                  print()
                  print('### Survived mutants (unconstrained logic)')
                  print()
                  cur.execute(\"SELECT filename, line_number, mutator_name FROM mutant WHERE status = 'survived' ORDER BY filename, line_number\")
                  for fn, line, mut in cur.fetchall():
                      print(f'- \`{fn}:{line}\` — {mut}')
          except Exception as e:
              print(f'Could not parse cache: {e}')
          " >> /tmp/mutation-report.md 2>&1 || echo "Cache not available or empty." >> /tmp/mutation-report.md
          else
            echo "No .mutmut-cache found — mutmut may not have run." >> /tmp/mutation-report.md
          fi
      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: |
            backend/.mutmut-cache
            /tmp/mutation-report.md
          retention-days: 30
