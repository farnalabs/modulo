name: "Deploy: Staleness Watchdog"

# Self-heals "main ahead of prod with no deploy in flight" by re-arming the
# deploy itself.
#
# Incident (2026-09-03 23:52 UTC): the merge queue correctly dispatched
# deploy.yml after a PR merge; the deploy failed on a transient npm registry
# timeout inside the pre-deploy frontend checks. deploy.yml's
# "Trigger Branch Fixer on deploy failure" step DID its job - it dispatched
# the Branch Fixer at main (branchName: main). But the Branch Fixer's remit
# is code fixes: it diagnoses a failure, raises a fix PR, and stops - and a
# transient npm timeout has nothing on main to fix, so no fix PR could ever
# materialise and NOTHING re-armed the deploy itself. Prod stayed 4 commits
# stale for ~15h until a manual re-dispatch. The gap is neither detection nor
# code-fixing; it is the missing re-arm. This watchdog's unique job is
# re-arming failed/gapped deploys (failed runs, throttle no-ops, dispatch
# gaps) so staleness heals itself within deploy-staleness-check.yml's grace
# window.
#
# Division of labour with deploy-staleness-check.yml (independent cron; both
# must exist):
#   - deploy-staleness-check.yml = app-level VISIBILITY (2-hourly): reads the
#     app's /api/v1/deployment build SHA vs origin/main; 6h grace; escalates
#     with ::error:: once staleness exceeds the grace window. It does NOT
#     heal.
#   - deploy-watchdog.yml (this file) = fly-level SELF-HEAL (*/30): compares
#     the fly image tag vs main HEAD and dispatches deploy.yml to heal WITHIN
#     that grace window.
#   - Escalation semantics: if staleness-check's ::error:: fires, the
#     watchdog failed to heal - investigate the watchdog. If this watchdog's
#     3-consecutive-failure ::error:: cap fires, deploy.yml itself is broken -
#     investigate deploy.yml.
#
# FAR-2139 (the escalation gap): during the 2026-10-23..25 outage this
# watchdog hit its 3-failure cap TEN times and every escalation landed in the
# same unread place - a red run in the Actions tab plus a comment on a
# three-week-old Backlog ticket. Both workflows now escalate through ONE
# shared email-on-transition step (.github/scripts/deploy-health-notify.sh):
# entering unhealthy and recovering each send exactly one email through the
# Zoho SMTP secrets issue-notify.yml already uses, and the message is rendered
# by the same .github/scripts/deploy_health.py renderer the staleness check
# uses. A single failed deploy still never alerts (the 3-run cap below is the
# watchdog's floor); the Linear ticket leg is gated on the structured health
# verdict rather than on `failure()` of a step.

on:
  schedule:
    # FAR-492: GitHub DROPS high-frequency cron events on high-activity repos
    # (a sibling */10 workflow collapsed to 2-4 runs/day; 1/day crons never
    # missed). */30 is an UNVERIFIED BEST-EFFORT band: the lesson's data
    # proves only >=1/day is safe on this repo, so treat every tick as
    # opportunistic and verify run history before trusting liveness.
    # Residual risks: GitHub auto-disables scheduled workflows after 60 days
    # of repo inactivity, and dropped ticks are silent - staleness-check's
    # independent escalation covers these watchdog liveness gaps. If cron
    # proves unreliable here, the known reliability upgrade is a
    # PR-Housekeeper dispatch leg calling this workflow.
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Overlapping scheduled ticks must not pile up, and an in-flight tick
# (possibly about to dispatch a deploy) must not be cancelled by the next.
concurrency:
  group: deploy-watchdog
  cancel-in-progress: false

# contents: read -> checkout + commits/compare API reads
# actions: write -> `gh workflow run deploy.yml` re-dispatch
# FAR-528: use github.token for same-repo API reads - a PAT lacking the
# Actions scope gets a 404 that looks exactly like "no runs found", which
# historically starved production deploys for 2 days.
permissions:
  contents: read
  actions: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  watchdog:
    name: Detect prod staleness + re-dispatch deploy
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      # Design contract: every gh/flyctl call is wrapped so an API hiccup
      # logs a ::warning:: and exits 0 (failing safe - never dispatch blind),
      # with the verdict emitted as UNKNOWN so a blind tick is never read as
      # "no failures". The non-zero exits are the two real escalation states -
      # the 3-consecutive-failure cap and a failed re-dispatch - and each one
      # is visible in the Actions tab AND emailed (FAR-2139). Dispatch is
      # ALWAYS plain: deploy.yml's throttle anchor
      # only counts runs whose "Deploy to app.modulo.run" job SUCCEEDED, so a
      # FAILED deploy never advances the throttle window and a plain dispatch
      # re-runs full pre-deploy CI and deploys once CI passes - the throttle
      # never needs bypassing, and bypassing it on a red main would only
      # re-fire the Branch Fixer webhook on every tick.
      - name: Check prod staleness and re-dispatch deploy if needed
        id: watchdog
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -o pipefail

          REPO="${{ github.repository }}"
          DEPLOY_WORKFLOW="deploy.yml"
          PROD_APP="app-modulo"
          PROD_URL="https://app.modulo.run"
          # The watchdog's own escalation floor (FAR-910/FAR-954): it stops
          # re-dispatching after this many consecutive failed deploys. It is
          # deliberately HIGHER than the staleness check's 2-run threshold, so
          # a single flaky deploy never alerts; only an exhausted self-heal does.
          CONSECUTIVE_FAILURE_CAP=3
          # Shared staleness grace, used only for the figures block of the
          # transition email (the staleness check owns the age measurement).
          GRACE_HOURS="${{ vars.STALENESS_GRACE_HOURS || 6 }}"

          # ---- 0. The verdict the escalation legs read (FAR-2139) ----
          # deploy-watchdog escalates through ONE structured verdict instead of
          # a step's failure colour: the email edge, the Linear ticket leg and
          # the run's red/green state all read `healthy`. The ticket leg used
          # to hang off `failure()`, which could not distinguish "deploy.yml is
          # broken" from "a different step broke" and could not express
          # UNKNOWN at all.
          #
          #   true  -> the watchdog is NOT escalating: production is in sync,
          #            a deploy is in flight, or this tick re-dispatched one.
          #            These carry a recovery_detail when "production is
          #            current" is not yet true, so a recovery email never
          #            overstates it -- and a recovery arriving from a healthy
          #            tick (the normal post-incident path: cap hit -> human
          #            fixes deploy.yml -> deploy in flight -> in sync) is not
          #            swallowed by the in-flight tick in between.
          #   false -> self-heal is exhausted (the 3-failure cap) or the
          #            re-dispatch itself failed
          #   empty -> UNKNOWN: this tick could not decide (unreadable API,
          #            unresolvable prod SHA, diverged main). UNKNOWN must
          #            never read as "no failures" and never clears an alert
          #            (see deploy-health-notify.sh).
          #
          # The verdict is the state vector the next tick reads back: the
          # "Fail the run when the deploy watchdog is unhealthy" step FAILS on
          # `false` and is SKIPPED otherwise, which is what makes the email
          # transition-based with no state store.
          VERDICT_DIR="/tmp/deploy-health"
          rm -rf "$VERDICT_DIR"
          mkdir -p "$VERDICT_DIR"
          VERDICT_JSON="$VERDICT_DIR/verdict.json"
          MAIN_SHORT=""
          PROD_SHA=""
          FAILED_STREAK=0
          RUNS_CONSIDERED=0

          # emit_verdict <healthy> <summary> <notes> [condition] [recovery_detail]
          emit_verdict() {
            local healthy="$1" summary="$2" notes="$3" condition="${4:-}" recovery_detail="${5:-}"
            jq -n \
              --arg h "$healthy" \
              --arg summary "$summary" \
              --arg notes "$notes" \
              --arg recovery_detail "$recovery_detail" \
              --arg main "$MAIN_SHORT" \
              --arg prod "$PROD_SHA" \
              --arg cf "$FAILED_STREAK" \
              --arg cap "$CONSECUTIVE_FAILURE_CAP" \
              --arg rc "$RUNS_CONSIDERED" \
              --arg grace "$GRACE_HOURS" \
              '{
                healthy: (if $h == "" then null else ($h == "true") end),
                stale: false,
                consecutive_failures: ($cf | tonumber),
                failure_threshold: ($cap | tonumber),
                age_hours: null,
                grace_hours: ($grace | tonumber),
                main_sha: (if $main == "" then "unknown" else $main end),
                prod_sha: (if $prod == "" then "unknown" else $prod end),
                prod_build_ts: "unknown",
                runs_considered: ($rc | tonumber),
                last_failed: {},
                summary: $summary,
                notes: (if $notes == "" then [] else [$notes] end),
                recovery_detail: $recovery_detail
              }' > "$VERDICT_JSON"
            {
              echo "healthy=$healthy"
              echo "verdict_json=$VERDICT_JSON"
              echo "summary=$summary"
              echo "condition=$condition"
              echo "prod_sha=$PROD_SHA"
              echo "main_sha=$MAIN_SHORT"
              echo "consecutive_failures=$FAILED_STREAK"
              echo "failure_threshold=$CONSECUTIVE_FAILURE_CAP"
            } >> "$GITHUB_OUTPUT"
          }

          # ---- 1. Deploy-run state: is a deploy already trying? ----
          # databaseId is needed to read each run's "Deploy to app.modulo.run"
          # job conclusion (FAR-2152: a throttled no-op's RUN conclusion is
          # success, so run-level data alone cannot tell a deploy from a skip).
          RUNS_JSON="$(gh run list --repo "$REPO" --workflow "$DEPLOY_WORKFLOW" --branch main --limit 10 --json databaseId,status,conclusion 2>/dev/null)" || RUNS_JSON=""
          if [ -z "$RUNS_JSON" ]; then
            echo "::warning::Deploy-staleness watchdog: could not list deploy.yml runs (gh API error) - failing safe, no dispatch. Next tick retries. Verdict is UNKNOWN, never 'no failures'."
            emit_verdict "" "" "the watchdog could not list deploy.yml runs, so it cannot tell whether deploys are failing"
            exit 0
          fi

          ACTIVE_COUNT="$(PAYLOAD="$RUNS_JSON" python3 -c '
          import json, os
          try:
              runs = json.loads(os.environ["PAYLOAD"])
          except Exception:
              runs = []
          print(sum(1 for r in runs if r.get("status") in ("in_progress", "queued")))
          ')" || ACTIVE_COUNT="0"
          if [ "$ACTIVE_COUNT" != "0" ]; then
            echo "Deploy run(s) in progress/queued ($ACTIVE_COUNT) - nothing to do."
            # Not escalating: a deploy is already trying. This MUST be recorded
            # as healthy rather than UNKNOWN, otherwise the post-incident
            # recovery path (cap -> human fix -> deploy in flight -> in sync)
            # loses the recovery email to the in-flight tick in between.
            emit_verdict "true" "the deploy watchdog is not escalating (deploy in flight)" \
              "a deploy run is in progress/queued, so this tick did not compare production against origin/main" "" \
              "A deploy run is in progress, so the pipeline is expected to converge on its own; the deploy watchdog is not escalating and no action is needed."
            exit 0
          fi

          # ---- 2. main HEAD ----
          # The checkout above is pinned to ref: main, so HEAD IS main's tip
          # regardless of which ref dispatched this run (schedule ticks always
          # run main; a manual dispatch from a feature branch must still
          # compare prod against MAIN, not the branch tip).
          MAIN_SHA="$(git rev-parse HEAD 2>/dev/null)" || MAIN_SHA=""
          if [ -z "$MAIN_SHA" ]; then
            echo "::warning::Deploy-staleness watchdog: could not resolve main HEAD sha - failing safe, no dispatch. Next tick retries. Verdict is UNKNOWN."
            emit_verdict "" "" "the watchdog could not resolve origin/main HEAD"
            exit 0
          fi
          MAIN_SHORT="${MAIN_SHA:0:12}"

          # ---- 3. Prod SHA: fly image tag -> complete release -> deployment endpoint ----
          if ! bash .github/scripts/install-flyctl.sh; then
            echo "::warning::Deploy-staleness watchdog: flyctl install failed - failing safe, no dispatch. Next tick retries. Verdict is UNKNOWN."
            emit_verdict "" "" "the watchdog could not install flyctl, so it could not read production's version"
            exit 0
          fi
          export FLYCTL_INSTALL="/home/runner/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"

          if ! fly status --app "$PROD_APP" --json > /tmp/prod-status.json 2>/dev/null; then
            echo "::warning::Deploy-staleness watchdog: fly status --app $PROD_APP failed - continuing; the fallbacks below may still yield the prod SHA."
            : > /tmp/prod-status.json
          fi

          # Extract the deploy SHA (registry.fly.io/app-modulo:deploy-<12-char-sha>).
          #
          # PRIMARY: fly status Machines filtered to STARTED machines in the
          # serving "app" process group (group extraction is deploy.yml's
          # worker-parse precedent). The group filter matters: a long-lived
          # `fly_app_console` machine (fly console/SSH session) runs whatever
          # image it was launched with and pollutes any "any started machine
          # with a deploy tag" extraction - observed LIVE 2026-09-04 on prod:
          # a started fly_app_console machine carried a stale
          # deploy-a9b3ad4cb520 tag that is not even in the release history.
          #
          # FALLBACK: when the machines view is empty or shows >1 distinct
          # sha (mid-rollout residue after a failed deploy, a leaked console
          # machine, flyctl shape drift), fall back to `fly releases` - the
          # first release with Status "complete" (newest-first) is what prod
          # settled on. This is deploy.yml's own rollback precedent (LAST_GOOD,
          # deploy.yml "Post-deploy verify + auto-rollback" step) and is
          # unambiguous by construction: a failed rollout is never "complete",
          # so the last COMPLETE release is what prod actually serves.
          #
          # LAST RESORT: when BOTH fly paths yield nothing (image-tag
          # convention drift - an IMAGE_LABEL format change or app rename
          # would otherwise silence the watchdog forever, green runs while
          # prod rots), the bash wrapper below reads the app-level
          # /api/v1/deployment build SHA - the same source
          # deploy-staleness-check.yml uses - so the watchdog can never
          # silently degrade to warn-only.
          PROD_SHAS="$(PROD_APP="$PROD_APP" python3 - <<'PYEOF'
          import json, os, re, subprocess

          # tag format defined by deploy.yml IMAGE_LABEL (12-char sha) - update both together.
          SHA_RE = re.compile(r"deploy-([0-9a-f]{12})")

          def process_group(m):
              cfg = m.get("config") or {}
              meta = cfg.get("metadata") or {}
              env = cfg.get("env") or {}
              return (meta.get("fly_process_group") or env.get("FLY_PROCESS_GROUP") or "").strip()

          def started_app_shas(machines):
              shas = set()
              for m in machines if isinstance(machines, list) else []:
                  if not isinstance(m, dict):
                      continue
                  if str(m.get("state") or "").lower() != "started":
                      continue
                  if process_group(m) != "app":
                      continue
                  candidates = []
                  ref = m.get("image_ref")
                  if isinstance(ref, dict) and ref.get("tag"):
                      candidates.append(str(ref["tag"]))
                  cfg = m.get("config")
                  if isinstance(cfg, dict) and cfg.get("image"):
                      candidates.append(str(cfg["image"]))
                  for c in candidates:
                      mo = SHA_RE.search(c)
                      if mo:
                          shas.add(mo.group(1))
              return sorted(shas)

          def machines_from_status(data):
              if isinstance(data, dict):
                  return data.get("Machines") or data.get("machines") or []
              if isinstance(data, list):
                  return data
              return []

          def sha_from_latest_complete_release():
              try:
                  out = subprocess.run(
                      ["fly", "releases", "--app", os.environ.get("PROD_APP", ""), "--json"],
                      capture_output=True, text=True, timeout=60)
                  releases = json.loads(out.stdout)
              except Exception:
                  return ""
              if not isinstance(releases, list):
                  return ""
              for r in releases:
                  if not isinstance(r, dict):
                      continue
                  if str(r.get("Status") or "").lower() == "complete":
                      mo = SHA_RE.search(str(r.get("ImageRef") or ""))
                      return mo.group(1) if mo else ""
              return ""

          shas = []
          try:
              with open("/tmp/prod-status.json") as f:
                  data = json.load(f)
              shas = started_app_shas(machines_from_status(data))
          except Exception:
              shas = []
          if len(shas) != 1:
              alt = sha_from_latest_complete_release()
              if alt:
                  shas = [alt]
              else:
                  shas = []
          print(" ".join(shas))
          PYEOF
          )" || PROD_SHAS=""
          SHA_COUNT="$(echo "$PROD_SHAS" | wc -w | tr -d ' ')"

          PROD_SHA=""
          SHA_SOURCE=""
          if [ "$SHA_COUNT" -gt 1 ]; then
            echo "::warning::Deploy-staleness watchdog: multiple distinct prod SHAs ($PROD_SHAS) - unexpected after disambiguation - failing safe, no dispatch. Next tick retries. Verdict is UNKNOWN."
            emit_verdict "" "" "the watchdog found multiple distinct production SHAs and could not decide"
            exit 0
          elif [ "$SHA_COUNT" -eq 1 ]; then
            PROD_SHA="$PROD_SHAS"
            SHA_SOURCE="fly image tag"
          else
            # Green-while-rotting guard (last resort): when the fly image-tag
            # convention drifts, BOTH fly paths return nothing forever and the
            # watchdog would degrade to warn-only - green ticks while prod
            # rots, the exact failure this workflow exists to prevent. Read
            # the app-level build SHA the same way deploy-staleness-check.yml
            # does; it is the same value deploy.yml verifies post-deploy.
            PROD_SHA="$(curl -fsS -m 15 "$PROD_URL/api/v1/deployment" 2>/dev/null | jq -r '.git_sha // empty' 2>/dev/null || true)"
            if [ -n "$PROD_SHA" ]; then
              PROD_SHA="${PROD_SHA:0:12}"
              echo "::warning::Deploy-staleness watchdog: no prod SHA from $PROD_APP fly image tags (started-app machines AND latest-complete-release both empty) - using the LAST-RESORT app-level deployment endpoint ($PROD_URL/api/v1/deployment) as the prod SHA source. The primary fly-tag path may have drifted - check deploy.yml's IMAGE_LABEL convention."
              SHA_SOURCE="deployment endpoint (last-resort)"
            else
              echo "::warning::Deploy-staleness watchdog: could not extract a prod SHA from any source (fly status machines, latest complete release, $PROD_URL/api/v1/deployment) - failing safe, no dispatch. Next tick retries. Verdict is UNKNOWN."
              emit_verdict "" "" "the watchdog could not determine which build production serves"
              exit 0
            fi
          fi

          # ---- 4. In sync, or is main genuinely ahead? ----
          if [ "$PROD_SHA" = "$MAIN_SHORT" ]; then
            echo "prod=$PROD_SHA main=$MAIN_SHORT - in sync. Nothing to do."
            # The ONE healthy state: production serves main HEAD, so a
            # recovery email (previous run escalated) can truthfully say so.
            emit_verdict "true" "" ""
            exit 0
          fi
          # compare(base=PROD, head=MAIN): status "ahead" = prod is behind main
          # (STALE); "behind" = prod is ahead of main (never deploy older main
          # over a newer prod); "identical" = full shas match; "diverged" =
          # main was rewritten since prod's deploy - ambiguous, never blindly
          # dispatch over it. An API failure (incl. a prod sha unresolvable on
          # main) fails safe below.
          CMP_STATUS="$(gh api "repos/$REPO/compare/$PROD_SHA...$MAIN_SHORT" --jq '.status' 2>/dev/null)" || CMP_STATUS=""
          case "$CMP_STATUS" in
            "ahead")
              echo "STALE: prod=$PROD_SHA is behind main=$MAIN_SHORT with no deploy in flight."
              ;;
            "identical")
              echo "prod=$PROD_SHA main=$MAIN_SHORT - in sync (compare). Nothing to do."
              emit_verdict "true" "" ""
              exit 0
              ;;
            "behind")
              echo "prod=$PROD_SHA is AHEAD of main=$MAIN_SHORT - not stale; nothing to do."
              # Not a recovery: production is not serving main HEAD.
              emit_verdict "" "" "production is ahead of origin/main (main rewritten?), so the watchdog did not evaluate deploy staleness"
              exit 0
              ;;
            "diverged")
              echo "::warning::Deploy-staleness watchdog: prod=$PROD_SHA has DIVERGED from main=$MAIN_SHORT (main rewritten?) - ambiguous, failing safe, no dispatch. Human review recommended."
              emit_verdict "" "" "production has diverged from origin/main, so the watchdog could not decide"
              exit 0
              ;;
            *)
              echo "::warning::Deploy-staleness watchdog: compare API failed or prod sha $PROD_SHA unresolvable on main (status: '${CMP_STATUS:-<empty>}') - failing safe, no dispatch. Next tick retries."
              emit_verdict "" "" "the compare API failed, so the watchdog could not decide deploy staleness"
              exit 0
              ;;
          esac

          # ---- 5. Dispatch decision: plain dispatch only, capped at 3 consecutive failures ----
          # deploy.yml's throttle anchor only counts runs whose "Deploy to
          # app.modulo.run" job SUCCEEDED - a FAILED deploy never advances the
          # throttle window - so a plain dispatch after a failure re-runs full
          # pre-deploy CI and deploys once CI passes; the throttle is never an
          # obstacle here. The only runaway-retry protection needed is a cap:
          # when the last 3 completed deploy runs ALL failed (every one tried
          # and failed), further re-dispatches would only churn CI and re-fire
          # the Branch Fixer webhook - stop and escalate instead. Fewer than 3
          # completed runs (fresh history) or any success among them ->
          # dispatch (a throttled no-op success counts as a success: bounded
          # churn is accepted and staleness-check escalates if it persists).
          #
          # FAR-954: throttled runs (Deploy to app.modulo.run skipped) are NOT
          # failures — they did not attempt a deploy. Counting them as failures
          # would cap the re-dispatch after just 3 throttle events, even though
          # no deploy was attempted. Filter them out of the consecutive-failure
          # check: only runs where the deploy job actually ran and failed count.
          # FAR-2152: attach each completed run's "Deploy to app.modulo.run"
          # JOB conclusion. A throttled run's RUN conclusion is success while
          # its deploy job is skipped - it deployed nothing. The enrichment
          # fails open: without the field the walk below falls back to the run
          # conclusion (the pre-FAR-2152 behaviour).
          if [ -n "$RUNS_JSON" ]; then
            RUNS_JSON_FILE="$(mktemp)"
            ENRICHED_RUNS_FILE="$(mktemp)"
            printf '%s' "$RUNS_JSON" > "$RUNS_JSON_FILE"
            if python3 .github/scripts/deploy_run_attempts.py enrich \
                --runs-json "$RUNS_JSON_FILE" --out "$ENRICHED_RUNS_FILE" --repo "$REPO"; then
              RUNS_JSON="$(cat "$ENRICHED_RUNS_FILE")"
            else
              echo "::warning::deploy-watchdog: could not enrich the deploy run history with deploy-job conclusions - the failure streak uses run conclusions this tick (a throttled no-op may read as a success)."
            fi
            rm -f "$RUNS_JSON_FILE" "$ENRICHED_RUNS_FILE"
          fi

          RECENT_JSON="$(PAYLOAD="$RUNS_JSON" python3 - <<'PYEOF'
          import json, os
          try:
              runs = json.loads(os.environ["PAYLOAD"])
          except Exception:
              runs = []

          def attempted(r):
              """True/False when known, None when the enrichment is absent."""
              raw = r.get("deploy_job_conclusion")
              if raw is None:
                  return None
              value = str(raw).strip().lower()
              if value in ("", "unknown", "missing", "none", "null"):
                  return None
              return value != "skipped"

          # FAR-954 / FAR-2152: a throttled run (deploy job SKIPPED) deployed
          # nothing. With the job conclusion we can now tell it apart from a
          # real success, so it is NEUTRAL - skipped entirely rather than
          # counted as "ok" (which would break a streak of real failures) or
          # as a failure (which would cap the re-dispatch on no-ops).
          completed = [r for r in runs if r.get("status") == "completed"]
          attempted_runs = [r for r in completed if attempted(r) is not False][:3]
          conclusions = []
          for r in attempted_runs:
              c = r.get("conclusion") or "none"
              if c == "success":
                  conclusions.append("success")
              elif c == "failure":
                  conclusions.append("failure")
              # skipped, cancelled — not a real attempt, skip
          all_failed = len(conclusions) == 3 and all(c != "success" for c in conclusions)
          # The leading failure streak over COMPLETED runs (newest first), for
          # the shared email renderer's figures. A throttled no-op is neutral:
          # the walk continues past it instead of breaking the streak.
          streak = 0
          for r in runs:
              if r.get("status") != "completed":
                  continue
              if attempted(r) is False:
                  continue
              if (r.get("conclusion") or "") == "failure":
                  streak += 1
              else:
                  break
          print(json.dumps({
              "all_failed": all_failed,
              "failed_streak": streak,
              "runs_considered": len(completed),
          }))
          PYEOF
          )" || RECENT_JSON=""
          if [ -n "$RECENT_JSON" ]; then
            ALL_FAILED="$(printf '%s' "$RECENT_JSON" | jq -r '.all_failed')"
            FAILED_STREAK="$(printf '%s' "$RECENT_JSON" | jq -r '.failed_streak')"
            RUNS_CONSIDERED="$(printf '%s' "$RECENT_JSON" | jq -r '.runs_considered')"
          else
            # Cannot evaluate the streak: keep the heal attempt (never stop
            # dispatching because a local computation failed) but report the
            # verdict as UNKNOWN rather than "no failures".
            ALL_FAILED="false"
            FAILED_STREAK="0"
            RUNS_CONSIDERED="0"
            echo "::warning::Deploy-staleness watchdog: could not evaluate the deploy failure streak locally - attempting the re-dispatch anyway, but the verdict is UNKNOWN (never 'no failures')."
            RECENT_UNKNOWN="true"
          fi

          echo "sha_source=${SHA_SOURCE}" >> "$GITHUB_OUTPUT"

          if [ "$ALL_FAILED" = "true" ]; then
            # The escalation floor: three consecutive deploys actually ran and
            # failed. This is the watchdog's UNHEALTHY state - its self-heal is
            # exhausted - and it is what the email edge and the ticket leg key
            # on (never `failure()` of this step).
            echo "::error::deploy-watchdog: 3 consecutive failed deploys; not re-dispatching - investigate deploy.yml failures; deploy-staleness-check.yml escalates staleness independently"
            emit_verdict "false" "3 consecutive failed deploys (self-heal exhausted)" "" "cap"
            exit 1
          fi

          echo "Prod is stale (prod=$PROD_SHA main=$MAIN_SHORT, prod sha source: $SHA_SOURCE) - re-dispatching deploy.yml (plain dispatch; the deploy throttle is authoritative)."
          if ! gh workflow run "$DEPLOY_WORKFLOW" --repo "$REPO" --ref main; then
            echo "::error::Deploy-staleness watchdog: prod is STALE (prod=$PROD_SHA main=$MAIN_SHORT) and the plain re-dispatch of deploy.yml FAILED. Next tick retries; if it persists, dispatch manually: gh workflow run \"Deploy: Staging + Prod\" --ref main"
            # UNHEALTHY: production is stale and the self-heal mechanism itself
            # is broken. No shared condition expresses this, so the measured
            # detail travels in the verdict's notes (same email renderer).
            emit_verdict "false" "watchdog could not re-dispatch deploy.yml" "the deploy watchdog could not re-dispatch deploy.yml while production served ${PROD_SHA} and origin/main was ${MAIN_SHORT}" "dispatch-failed"
            exit 1
          fi
          echo "Watchdog re-dispatched deploy.yml (prod=$PROD_SHA main=$MAIN_SHORT)."
          if [ "${RECENT_UNKNOWN:-}" = "true" ]; then
            emit_verdict "true" "the deploy watchdog re-dispatched deploy.yml" \
              "production served ${PROD_SHA} and origin/main was ${MAIN_SHORT} when this tick re-dispatched deploy.yml; the failure streak could not be evaluated locally" "" \
              "Production was behind origin/main and the watchdog re-dispatched deploy.yml, but it could not evaluate the deploy failure streak locally. It is not escalating; check the deploy run if production stays stale."
          else
            # Not escalating: the self-heal path worked. A later in-sync tick
            # (or the staleness check's 6h grace) covers a deploy that fails
            # after this dispatch, and the recovery email is accurate because
            # it carries the measured detail rather than claiming prod is current.
            emit_verdict "true" "the deploy watchdog re-dispatched deploy.yml" \
              "production served ${PROD_SHA} and origin/main was ${MAIN_SHORT} when this tick re-dispatched deploy.yml" "" \
              "Production was behind origin/main and the watchdog re-dispatched deploy.yml, so it is no longer escalating. No action is needed unless production stays stale."
          fi

      # FAR-2139: the human channel. During the 2026-10-23..25 outage this
      # watchdog hit its cap ten times; every escalation was a red run plus a
      # comment on a three-week-old Backlog ticket, and nobody was told. This
      # step is shared verbatim with deploy-staleness-check.yml
      # (.github/scripts/deploy-health-notify.sh) so the two cannot drift into
      # two message formats: transition in (healthy -> unhealthy) and
      # transition out (unhealthy -> healthy) are the only emails.
      - name: Email the operator on a deploy-health transition
        id: notify
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_HEALTHY: ${{ steps.watchdog.outputs.healthy }}
          VERDICT_JSON: ${{ steps.watchdog.outputs.verdict_json }}
          WORKFLOW_NAME: "Deploy: Staleness Watchdog"
          VERDICT_STEP_NAME: "Fail the run when the deploy watchdog is unhealthy"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy.yml
          ZOHO_SMTP_USER: ${{ secrets.ZOHO_SMTP_USER }}
          ZOHO_SMTP_PASS: ${{ secrets.ZOHO_SMTP_PASS }}
          ISSUE_NOTIFY_EMAIL: ${{ secrets.ISSUE_NOTIFY_EMAIL }}
          ISSUE_NOTIFY_FROM: ${{ secrets.ISSUE_NOTIFY_FROM }}
        run: bash .github/scripts/deploy-health-notify.sh

      - name: Create Linear ticket on watchdog escalation
        # FAR-2139: gated on the REAL health condition, not on `failure()` of a
        # step. `failure()` could not tell "deploy.yml is broken" from "the
        # checkout broke", and it could never fire for an UNKNOWN verdict.
        if: always() && steps.watchdog.outputs.healthy == 'false'
        shell: bash
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "LINEAR_API_KEY not set - skipping ticket (the operator was emailed on the transition; this run also shows red)."
            exit 0
          fi
          PROD_SHA="${{ steps.watchdog.outputs.prod_sha }}"
          MAIN_SHA="${{ steps.watchdog.outputs.main_sha }}"
          CONDITION="${{ steps.watchdog.outputs.condition }}"
          SUMMARY="${{ steps.watchdog.outputs.summary }}"
          CONSECUTIVE="${{ steps.watchdog.outputs.consecutive_failures }}"
          SHA_SOURCE="${{ steps.watchdog.outputs.sha_source }}"
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [ "$CONDITION" = "cap" ]; then
            TITLE="DEPLOY WATCHDOG GAVE UP: 3 consecutive failures (FAR-910)"
            DESC="The deploy watchdog detected ${CONSECUTIVE:-3} consecutive failed deploys and stopped re-dispatching at ${TS}. Prod SHA: ${PROD_SHA:-unknown} Main HEAD: ${MAIN_SHA:-unknown} SHA source: ${SHA_SOURCE:-unknown}. deploy.yml itself is broken -- investigate the deploy workflow failures. The deploy-staleness-check.yml escalates staleness independently. This is FAR-910 -- deploy watchdog terminal case must escalate, not annotate. The operator was also emailed on the health transition (FAR-2139)."
          elif [ "$CONDITION" = "dispatch-failed" ]; then
            TITLE="DEPLOY WATCHDOG DISPATCH FAILED (FAR-910)"
            DESC="The deploy watchdog could not re-dispatch deploy.yml at ${TS}. Prod SHA: ${PROD_SHA:-unknown} Main HEAD: ${MAIN_SHA:-unknown}. The prod is stale and the watchdog dispatch mechanism failed. Check the GitHub Actions token scope and workflow_dispatch permissions. This is FAR-910. The operator was also emailed on the health transition (FAR-2139)."
          else
            TITLE="DEPLOY WATCHDOG UNHEALTHY (FAR-910)"
            DESC="The deploy watchdog evaluated UNHEALTHY at ${TS}: ${SUMMARY:-an unnamed condition}. Prod SHA: ${PROD_SHA:-unknown} Main HEAD: ${MAIN_SHA:-unknown}. This is FAR-910 (deploy health must escalate, not annotate) and FAR-2139 (the operator is emailed on the transition)."
          fi

          # FAR-1407: dedupe KEY = the condition title itself. The three
          # watchdog titles are static (no run-specific figures), so each
          # condition has its own key: gave-up / dispatch-failed / failed
          # dedupe INDEPENDENTLY - one open ticket per condition, plus
          # appended comments, not one ticket per cron run.
          MARKER="$TITLE"
          # Latest figures: appended to an existing open ticket instead of
          # creating a duplicate (FAR-1407).
          UPDATE=$(printf 'Watchdog escalation still active at %s.\nCondition: %s\nProd SHA: %s\nMain HEAD: %s\nSHA source: %s\nAppended by the deploy watchdog instead of opening a duplicate ticket (FAR-1407: dedupe on the condition, not the run).' "$TS" "$TITLE" "${PROD_SHA:-unknown}" "${MAIN_SHA:-unknown}" "${SHA_SOURCE:-unknown}")

          # ---- FAR-1407: dedupe on the CONDITION, not the run ----
          # Search Linear for an existing OPEN ticket for this condition
          # (team + title marker + state type in backlog/unstarted/started =
          # Backlog / Todo / In Progress). Done ("completed") and Canceled
          # ("canceled") are excluded BY the server-side filter, so a closed
          # tracker never suppresses a later recurrence: once the condition
          # clears and the ticket is closed, the next occurrence's search
          # comes back empty and a fresh ticket is created.
          # FAIL OPEN BY CONSTRUCTION: the create below is skipped only when
          # the search returns a well-formed issue UUID. A transport failure,
          # an API error, or a malformed response all leave EXISTING_ID empty
          # and fall through to create - the alert is never silently dropped.
          SEARCH_BODY=$(jq -n \
            --arg marker "$MARKER" \
            '{
              query: "query($m: String!){ issues(filter:{ team:{ id:{ eq:\"ae855baf-6439-4980-97fb-38da80129485\" } }, title:{ contains:$m }, state:{ type:{ in:[\"backlog\",\"unstarted\",\"started\"] } } }, first:1){ nodes { id identifier state { name } } } }",
              variables: { m: $marker }
            }')
          SEARCH_RESULT=$(curl -sS -f --max-time 20 -X POST "https://api.linear.app/graphql" \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d "$SEARCH_BODY" 2>&1) || SEARCH_RESULT=""
          EXISTING_ID=""
          EXISTING_REF=""
          SEARCH_OK=""
          if [ -n "$SEARCH_RESULT" ]; then
            if echo "$SEARCH_RESULT" | jq -e '.data.issues' >/dev/null 2>&1; then
              SEARCH_OK="true"
            fi
            EXISTING_ID=$(echo "$SEARCH_RESULT" | jq -r '.data.issues.nodes[0].id // ""' 2>/dev/null) || EXISTING_ID=""
            EXISTING_REF=$(echo "$SEARCH_RESULT" | jq -r '.data.issues.nodes[0].identifier // ""' 2>/dev/null) || EXISTING_REF=""
          fi
          # Accept only a well-formed UUID; anything else counts as "search
          # yielded nothing" and fails open to the create below.
          if ! printf '%s' "$EXISTING_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            EXISTING_ID=""
          fi

          if [ "$SEARCH_OK" = "true" ] && [ -n "$EXISTING_ID" ]; then
            # Open ticket exists for this condition - append the latest
            # figures, do NOT create a duplicate.
            COMMENT_BODY=$(jq -n \
              --arg i "$EXISTING_ID" \
              --arg b "$UPDATE" \
              '{
                query: "mutation($i: String!, $b: String!){ commentCreate(input:{ issueId:$i, body:$b }){ success comment { id } } }",
                variables: { i: $i, b: $b }
              }')
            CRES=$(curl -sS -f --max-time 20 -X POST "https://api.linear.app/graphql" \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d "$COMMENT_BODY" 2>&1) || CRES=""
            if echo "$CRES" | grep -q '"success":true'; then
              echo "Deduplicated (FAR-1407): appended the latest figures to open ticket $EXISTING_REF - no new ticket created."
            else
              echo "::warning::Open ticket $EXISTING_REF exists but appending the update failed: $CRES - no duplicate created; the next run retries the comment."
            fi
            exit 0
          fi

          if [ "$SEARCH_OK" != "true" ]; then
            # Fail OPEN LOUDLY: search/API failure must never read as
            # "no ticket needed" - warn and create anyway.
            echo "::warning::Linear dedup search failed or returned an unexpected response - failing OPEN: creating a fresh ticket anyway (FAR-1407: never suppress the escalation). Response: ${SEARCH_RESULT:-<empty>}"
          fi

          BODY=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            '{
              query: "mutation($i: IssueCreateInput!){ issueCreate(input:$i){ success issue { identifier url } } }",
              variables: { i: {
                teamId: "ae855baf-6439-4980-97fb-38da80129485",
                title: $title,
                description: $desc,
                priority: 1
              } }
            }')
          RESULT=$(curl -sS -f --max-time 20 -X POST "https://api.linear.app/graphql" \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d "$BODY" 2>&1) || true
          if echo "$RESULT" | grep -q '"success":true'; then
            TICKET_ID=$(echo "$RESULT" | jq -r '.data.issueCreate.issue.identifier // "unknown"')
            echo "Created Linear ticket: $TICKET_ID"
          else
            echo "::warning::Failed to create Linear ticket: $RESULT"
          fi

      # FAR-2139: the durable state vector the NEXT tick reads back. It FAILS
      # exactly when the evaluated health was unhealthy and is SKIPPED
      # otherwise (healthy or UNKNOWN), which is what makes the email edge a
      # transition rather than a per-tick shout with no state store. It runs
      # LAST so the notify and ticket legs above always execute. This name is
      # the VERDICT_STEP_NAME the notify step reads -- rename both together.
      - name: Fail the run when the deploy watchdog is unhealthy
        if: always() && steps.watchdog.outputs.healthy == 'false'
        shell: bash
        env:
          SUMMARY: ${{ steps.watchdog.outputs.summary }}
          PROD_SHA: ${{ steps.watchdog.outputs.prod_sha }}
          MAIN_SHA: ${{ steps.watchdog.outputs.main_sha }}
          CONSECUTIVE: ${{ steps.watchdog.outputs.consecutive_failures }}
        run: |
          echo "::error::Deploy health UNHEALTHY: ${SUMMARY:-deploy watchdog escalation} (prod ${PROD_SHA:-unknown}, origin/main ${MAIN_SHA:-unknown}, ${CONSECUTIVE:-unknown} consecutive failed deploys). The operator was emailed on the transition (FAR-2139)."
          exit 1

      # FAR-2157: the watchdog's UNKNOWN verdicts are recorded, never read back
      # as healthy. Every path above emits an explicit verdict; the UNKNOWN
      # ones (nothing readable) leave `healthy` empty, skip the verdict step
      # below, and would otherwise be indistinguishable from a healthy tick in
      # run history - which lets the NEXT tick's transition email treat them as
      # healthy and silently swallow the recovery. This step runs ONLY when the
      # verdict was UNKNOWN, and its presence is the durable machine-readable
      # signal `deploy_health.parse_previous_verdict` reads.
      - name: Record the unmeasured tick (FAR-2157)
        if: always() && steps.watchdog.outputs.healthy == ''
        shell: bash
        run: |
          echo "::warning::NO MEASUREMENT — the deploy watchdog could not evaluate deploy health this tick, so this green run is NOT a healthy verdict (FAR-2157). The next tick treats it as UNKNOWN."
          {
            echo "## NOT MEASURED — deploy watchdog UNKNOWN (FAR-2157)"
            echo ""
            echo "The watchdog could not read the state it needs (see the warnings above), so"
            echo "it neither escalated nor cleared. This run concludes success because an"
            echo "unmeasurable tick is not a deploy failure - it is NOT evidence that"
            echo "production is healthy or that the watchdog was satisfied."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
