name: "BDD / E2E Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DATABASE_URL: "postgresql+asyncpg://modulo:${{ secrets.POSTGRES_PASSWORD || 'modulo' }}@localhost:5432/modulo"
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  FERNET_KEY: ${{ secrets.FERNET_KEY }}
  # Authenticate GitHub git fetches so `uv sync --frozen` can resolve git-pinned
  # dependencies (e.g. pytest-bdd @ refs/pull/827/head) without an anonymous
  # fetch-by-SHA, which GitHub rejects from CI runners.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf'
  GIT_CONFIG_VALUE_0: "https://github.com/"
  REDIS_URL: "redis://localhost:6379/0"
  MODULO_PUBLIC_URL: "http://localhost:8000"
  MODULO_USERS: "admin:admin"
  CORS_ORIGINS: "http://localhost:4173"
  MODULO_PLUGIN_DISCOVERY: "false"
  MODULO_CSRF_ENABLED: "false"

concurrency:
  group: bdd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The changed-path detector reads GET /repos/{repo}/pulls/{n}/files with
  # github.token, so the token needs pull-request read (mirrors ci.yml's
  # `changes` job).
  pull-requests: read

jobs:
  bdd:
    name: BDD (full suite)
    runs-on: ubicloud-standard-2
    timeout-minutes: 60
    steps:
      # FAR-1527: one cheap, checkout-free path detector gating the expensive
      # steps below. Same fail-open design as ci.yml's `changes` job (FAR-1427
      # - see the comment block there): it reads the PR file list from the
      # GitHub API (no checkout, no toolchain: a few seconds) and writes one
      # output:
      #
      #   bdd - the suite has something to validate. "false" only when the
      #         change is confined to frontend/ + docs (the Tier 1b rule:
      #         nothing under those trees reads the backend, and a docs-only
      #         change exercises no code). Every other event (push to main,
      #         workflow_dispatch) and every unreliable read sets it "true".
      #
      # The gate is STEP-level, never job-level: a job-level skip surfaces as
      # a non-green "skipped" check that the PR Reviewer flags (same reason
      # notify-pr-failure and k8s-conformance gate at step level). The job
      # still reports "success" for every PR; the Docker/Playwright/serve
      # steps simply do not run. FAIL-OPEN: any API error, a 3000+ file PR
      # (the API's cap), or an empty list runs the full suite.
      - name: Detect changed paths
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          all_true() {
            echo "bdd=true" >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event ${EVENT_NAME}: path gate disabled - running the full BDD/E2E suite."
            all_true
            exit 0
          fi
          # `rc=0; out=$(...) || rc=$?` survives Actions' `bash -e -o pipefail`
          # so a failed API call reaches the fail-open branch below instead of
          # aborting the step. Rename sources are included so moving a file out
          # of (or into) a gated area still counts as touching it.
          rc=0
          FILES="$(gh api --paginate "/repos/${REPO}/pulls/${PR_NUM}/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')" || rc=$?
          COUNT=$(printf '%s\n' "$FILES" | grep -c . || true)
          if [ "$rc" -ne 0 ] || [ "$COUNT" -eq 0 ] || [ "$COUNT" -ge 3000 ]; then
            echo "::warning::could not obtain a reliable changed-file list (rc=${rc}, count=${COUNT}); running the full BDD/E2E suite (fail open)"
            all_true
            exit 0
          fi
          echo "Changed files (${COUNT}):"
          printf '%s\n' "$FILES" | sort -u | sed 's/^/  /'
          # Same rule as ci.yml's backend_heavy output: the suite only needs
          # to run when the change touches something outside frontend/ +
          # docs (docs/api/examples/ code samples count as source, as in ci.yml).
          BDD=true
          NON_BACKEND_FREE=$(printf '%s\n' "$FILES" | awk 'NF && !/^frontend\// && !/\.mdx?$/ && (/^docs\/api\/examples\// || !/^docs\//)' | wc -l)
          if [ "$NON_BACKEND_FREE" -eq 0 ]; then
            BDD=false
          fi
          echo "bdd=${BDD}" >> "$GITHUB_OUTPUT"
          echo "bdd=${BDD} (step-level gate: the job still reports success either way)"

      - name: Checkout
        if: steps.detect.outputs.bdd == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        if: steps.detect.outputs.bdd == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up pnpm
        if: steps.detect.outputs.bdd == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.4

      - name: Set up Node
        if: steps.detect.outputs.bdd == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Start Postgres
        if: steps.detect.outputs.bdd == 'true'
        shell: bash
        run: |
          docker rm -f modulo-bdd-pg 2>/dev/null || true
          docker run -d --name modulo-bdd-pg \
            -e POSTGRES_USER=modulo \
            -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'modulo' }} \
            -e POSTGRES_DB=modulo \
            -p 5432:5432 \
            postgres:16-alpine
          echo "Waiting for Postgres..."
          for i in $(seq 1 60); do
            if docker exec modulo-bdd-pg pg_isready -U modulo >/dev/null 2>&1; then
              echo "Postgres ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time"
          docker logs modulo-bdd-pg
          exit 1

      - name: Start Redis
        if: steps.detect.outputs.bdd == 'true'
        shell: bash
        run: |
          docker rm -f modulo-bdd-redis 2>/dev/null || true
          docker run -d --name modulo-bdd-redis \
            -p 6379:6379 \
            redis:7-alpine
          echo "Waiting for Redis..."
          for i in $(seq 1 30); do
            if docker exec modulo-bdd-redis redis-cli ping >/dev/null 2>&1; then
              echo "Redis ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Redis did not become ready in time"
          docker logs modulo-bdd-redis
          exit 1

      - name: Install backend deps
        if: steps.detect.outputs.bdd == 'true'
        working-directory: backend
        run: uv sync --frozen

      - name: Install Playwright browsers
        if: steps.detect.outputs.bdd == 'true'
        working-directory: backend
        run: |
          # `playwright install --with-deps` runs `apt-get update` across every
          # configured apt source. The runner image ships a google-chrome apt
          # source (dl.google.com) that intermittently returns a hash-sum
          # mismatch, which makes the unrelated system-dep install fail and takes
          # down the whole BDD suite. Chromium does not need google-chrome-stable,
          # so drop that source and retry to ride out any transient mirror errors.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome-stable.list 2>/dev/null || true
          install_ok=0
          for i in 1 2 3; do
            if uv run --no-build --no-sync playwright install --with-deps chromium; then
              install_ok=1
              break
            fi
            echo "Playwright browser install attempt $i failed, retrying..."
            sleep 5
          done
          if [ "$install_ok" -ne 1 ]; then
            echo "Playwright browser install failed after 3 attempts"
            exit 1
          fi

      - name: Pre-create alembic_version table
        if: steps.detect.outputs.bdd == 'true'
        shell: bash
        run: |
          docker exec modulo-bdd-pg psql -U modulo -d modulo -c "CREATE TABLE IF NOT EXISTS alembic_version (version_num VARCHAR(255) NOT NULL PRIMARY KEY);"

      - name: Run migrations
        if: steps.detect.outputs.bdd == 'true'
        working-directory: backend
        run: uv run --no-build --no-sync alembic upgrade heads

      - name: Install frontend deps
        if: steps.detect.outputs.bdd == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build frontend
        if: steps.detect.outputs.bdd == 'true'
        working-directory: frontend
        run: pnpm run build

      - name: Start backend
        if: steps.detect.outputs.bdd == 'true'
        working-directory: backend
        shell: bash
        run: |
          nohup uv run --no-build --no-sync uvicorn modulo.api.main:app --host 0.0.0.0 --port 8000 > backend-bdd.log 2>&1 &

      - name: Serve frontend preview
        if: steps.detect.outputs.bdd == 'true'
        working-directory: frontend
        shell: bash
        run: |
          nohup pnpm run preview -- --port 4173 --host 0.0.0.0 > frontend-bdd.log 2>&1 &

      - name: Wait for backend healthz
        if: steps.detect.outputs.bdd == 'true'
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "=== Backend log ==="
          cat backend/backend-bdd.log 2>/dev/null || true
          echo "=== Process check ==="
          ps aux | grep -i uvicorn || true
          exit 1

      - name: Wait for frontend ready
        if: steps.detect.outputs.bdd == 'true'
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4173/ >/dev/null 2>&1; then
              echo "Frontend ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "=== Frontend log ==="
          cat frontend/frontend-bdd.log 2>/dev/null || true
          exit 1

      - name: Run BDD tests (full suite)
        if: steps.detect.outputs.bdd == 'true'
        working-directory: backend
        timeout-minutes: 50
        run: uv run --no-build --no-sync pytest tests/bdd/ -q --base-url http://localhost:4173 --timeout=120 -p no:warnings

      - name: Cleanup containers
        if: always() && steps.detect.outputs.bdd == 'true'
        shell: bash
        run: |
          docker rm -f modulo-bdd-pg 2>/dev/null || true
          docker rm -f modulo-bdd-redis 2>/dev/null || true
