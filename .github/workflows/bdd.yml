name: BDD / E2E Tests

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bdd:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12.4"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Start Postgres
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          docker rm -f modulo-bdd-pg 2>$null
          docker run -d --name modulo-bdd-pg `
            -e POSTGRES_USER=modulo `
            -e POSTGRES_PASSWORD=modulo `
            -e POSTGRES_DB=modulo `
            -p 5432:5432 `
            postgres:16-alpine
          Write-Host "Waiting for Postgres..."
          for ($i=0; $i -lt 60; $i++) {
            $ok = docker exec modulo-bdd-pg pg_isready -U modulo 2>$null
            if ($?) { Write-Host "Postgres ready"; break }
            Start-Sleep -Seconds 2
          }
      - name: Start Redis
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          docker rm -f modulo-bdd-redis 2>$null
          docker run -d --name modulo-bdd-redis `
            -p 6379:6379 `
            redis:7-alpine
          Write-Host "Waiting for Redis..."
          for ($i=0; $i -lt 30; $i++) {
            $ok = docker exec modulo-bdd-redis redis-cli ping 2>$null
            if ($?) { Write-Host "Redis ready"; break }
            Start-Sleep -Seconds 2
          }
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Install Playwright browsers
        working-directory: backend
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Pre-create alembic_version table
        shell: powershell
        run: |
          docker exec modulo-bdd-pg psql -U modulo -d modulo -c "CREATE TABLE IF NOT EXISTS alembic_version (version_num VARCHAR(255) NOT NULL PRIMARY KEY);"
      - name: Run migrations
        working-directory: backend
        run: uv run --no-sync alembic upgrade heads
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo:modulo@localhost:5432/modulo"
          SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
          FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start backend
        working-directory: backend
        shell: powershell
        run: |
          $log = "C:\actions-runner\_work\modulo\modulo\backend.log"
          $p = Start-Process -NoNewWindow -RedirectStandardOutput $log -PassThru -FilePath "uv" -ArgumentList "run --no-sync uvicorn modulo.api.main:app --host 0.0.0.0 --port 8000"
          Write-Host "Backend PID: $($p.Id)"
          Start-Sleep -Seconds 3
          Get-Content $log -TotalCount 20
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo:modulo@localhost:5432/modulo"
          SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
          FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="
          MODULO_PUBLIC_URL: "http://localhost:8000"
          MODULO_USERS: "admin:admin"
          CORS_ORIGINS: "http://localhost:4173"
          MODULO_PLUGIN_DISCOVERY: "false"
          REDIS_URL: "redis://localhost:6379/0"
      - name: Serve frontend
        working-directory: frontend
        shell: powershell
        run: Start-Process -NoNewWindow -FilePath "cmd.exe" -ArgumentList "/c npm run preview -- --port 4173"
      - name: Wait for healthz
        shell: powershell
        run: |
          for ($i=0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:8000/healthz" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { Write-Host "Backend healthy after ${i}s"; exit 0 }
            } catch {}
            Start-Sleep -Seconds 2
          }
          Write-Host "=== Backend log ==="
          Get-Content "C:\actions-runner\_work\modulo\modulo\backend.log" -TotalCount 100 -ErrorAction SilentlyContinue
          Write-Host "=== Process check ==="
          Get-Process -Name "uv" -ErrorAction SilentlyContinue | Format-Table Id, ProcessName
          exit 1
      - name: Wait for frontend
        shell: powershell
        run: npx wait-on http://localhost:4173 --timeout 30000
      - name: Run BDD tests
        working-directory: backend
        run: uv run --no-sync pytest tests/bdd/ -m e2e --base-url http://localhost:4173 -q
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo:modulo@localhost:5432/modulo"
          SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
          FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="
      - name: Cleanup containers
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          docker rm -f modulo-bdd-pg 2>$null
          docker rm -f modulo-bdd-redis 2>$null
