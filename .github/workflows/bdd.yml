name: "BDD / E2E Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DATABASE_URL: "postgresql+asyncpg://modulo:${{ secrets.POSTGRES_PASSWORD || 'modulo' }}@localhost:5432/modulo"
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  FERNET_KEY: ${{ secrets.FERNET_KEY }}
  REDIS_URL: "redis://localhost:6379/0"
  MODULO_PUBLIC_URL: "http://localhost:8000"
  MODULO_USERS: "admin:admin"
  CORS_ORIGINS: "http://localhost:4173"
  MODULO_PLUGIN_DISCOVERY: "false"
  MODULO_CSRF_ENABLED: "false"

concurrency:
  group: bdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bdd:
    name: BDD (full suite)
    runs-on: ubicloud-standard-2
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Start Postgres
        shell: bash
        run: |
          docker rm -f modulo-bdd-pg 2>/dev/null || true
          docker run -d --name modulo-bdd-pg \
            -e POSTGRES_USER=modulo \
            -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'modulo' }} \
            -e POSTGRES_DB=modulo \
            -p 5432:5432 \
            postgres:16-alpine
          echo "Waiting for Postgres..."
          for i in $(seq 1 60); do
            if docker exec modulo-bdd-pg pg_isready -U modulo >/dev/null 2>&1; then
              echo "Postgres ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time"
          docker logs modulo-bdd-pg
          exit 1

      - name: Start Redis
        shell: bash
        run: |
          docker rm -f modulo-bdd-redis 2>/dev/null || true
          docker run -d --name modulo-bdd-redis \
            -p 6379:6379 \
            redis:7-alpine
          echo "Waiting for Redis..."
          for i in $(seq 1 30); do
            if docker exec modulo-bdd-redis redis-cli ping >/dev/null 2>&1; then
              echo "Redis ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Redis did not become ready in time"
          docker logs modulo-bdd-redis
          exit 1

      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen

      - name: Install Playwright browsers
        working-directory: backend
        run: uv run --no-build --no-sync playwright install --with-deps chromium

      - name: Pre-create alembic_version table
        shell: bash
        run: |
          docker exec modulo-bdd-pg psql -U modulo -d modulo -c "CREATE TABLE IF NOT EXISTS alembic_version (version_num VARCHAR(255) NOT NULL PRIMARY KEY);"

      - name: Run migrations
        working-directory: backend
        run: uv run --no-build --no-sync alembic upgrade heads

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Start backend
        working-directory: backend
        shell: bash
        run: |
          nohup uv run --no-build --no-sync uvicorn modulo.api.main:app --host 0.0.0.0 --port 8000 > backend-bdd.log 2>&1 &

      - name: Serve frontend preview
        working-directory: frontend
        shell: bash
        run: |
          nohup pnpm run preview -- --port 4173 --host 0.0.0.0 > frontend-bdd.log 2>&1 &

      - name: Wait for backend healthz
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "=== Backend log ==="
          cat backend/backend-bdd.log 2>/dev/null || true
          echo "=== Process check ==="
          ps aux | grep -i uvicorn || true
          exit 1

      - name: Wait for frontend ready
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4173/ >/dev/null 2>&1; then
              echo "Frontend ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "=== Frontend log ==="
          cat frontend/frontend-bdd.log 2>/dev/null || true
          exit 1

      - name: Run BDD tests (full suite)
        working-directory: backend
        timeout-minutes: 50
        run: uv run --no-build --no-sync pytest tests/bdd/ -q --base-url http://localhost:4173 --timeout=120 -p no:warnings

      - name: Cleanup containers
        if: always()
        shell: bash
        run: |
          docker rm -f modulo-bdd-pg 2>/dev/null || true
          docker rm -f modulo-bdd-redis 2>/dev/null || true
