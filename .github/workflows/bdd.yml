name: BDD / E2E Tests

on:
  push:
    branches: [main]

jobs:
  bdd:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modulo
          POSTGRES_PASSWORD: modulo
          POSTGRES_DB: modulo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.4"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Install Playwright browsers
        working-directory: backend
        run: uv run playwright install --with-deps chromium
      - name: Pre-create alembic_version table
        run: |
          PGPASSWORD=modulo psql -h localhost -U modulo -d modulo -c \
            "CREATE TABLE IF NOT EXISTS alembic_version (version_num VARCHAR(255) NOT NULL PRIMARY KEY);"
      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade heads
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo:modulo@localhost:5432/modulo"
          SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
          FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start backend
        working-directory: backend
        run: |
          uv run uvicorn modulo.api.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo "Backend PID: $!"
          sleep 3
          head -20 /tmp/backend.log
        shell: bash
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo:modulo@localhost:5432/modulo"
          SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
          FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="
          MODULO_PUBLIC_URL: "http://localhost:8000"
          MODULO_USERS: "admin:admin"
          CORS_ORIGINS: "http://localhost:4173"
          MODULO_PLUGIN_DISCOVERY: "false"
          REDIS_URL: "redis://redis:6379/0"
      - name: Serve frontend
        working-directory: frontend
        run: npm run preview -- --port 4173 &
      - name: Wait for healthz
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "=== Backend log ==="
          head -100 /tmp/backend.log || echo "(no backend log)"
          echo "=== Process check ==="
          ps aux | grep uvicorn || echo "(no uvicorn process)"
          exit 1
      - name: Wait for frontend
        run: npx wait-on http://localhost:4173 --timeout 30000
      - name: Run BDD tests
        working-directory: backend
        run: |
          uv run pytest tests/bdd/ \
            -m e2e \
            --base-url http://localhost:4173 \
            -q
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo:modulo@localhost:5432/modulo"
          SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
          FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="
