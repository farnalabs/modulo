name: "Release: Legacy Entry Point (Retired)"

# RETIRED: Release: Unified Pipeline is the sole executable release path.
#
# This workflow remains only so an old bookmark or automation call fails loudly
# with migration instructions. It deliberately has no checkout, mutation, or
# dispatch logic, and has no write
# permissions, tags, releases, freeze changes, dispatches, publishes, changelog
# writes, or environments. Do not add release logic here.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Retired input; use mode on Release: Unified Pipeline"
        type: choice
        required: true
        options:
          - cut
          - recut
          - release
          - dry-run
      version:
        description: "Retired input; pass the version to Release: Unified Pipeline"
        type: string
        required: false

permissions:
  contents: read

jobs:
  retired:
    name: Reject retired release entry point
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail closed with migration instructions
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This release entry point is retired and cannot perform release actions."
          echo "Use 'Release: Unified Pipeline' (.github/workflows/release-unified.yml) instead."
          echo "Modes are: cut, recut, promote, and dry-run."
          echo "Example: gh workflow run \"Release: Unified Pipeline\" -f mode=dry-run -f version=0.4.0"
          exit 1
