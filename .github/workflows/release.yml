name: "Release: Legacy Entry Point (Deprecated)"

# Deprecated compatibility wrapper for operators who still have the old workflow
# bookmarked. This workflow deliberately has no release-mutating jobs: it cannot
# create tags, move release-freeze, create GitHub Releases, publish packages, or
# dispatch release work. Use release-unified.yml instead.
#
# Migration:
#   gh workflow run "Release: Unified Pipeline" -f mode=dry-run -f version=X.Y.Z
#   gh workflow run "Release: Unified Pipeline" -f mode=cut -f version=X.Y.Z
#   gh workflow run "Release: Unified Pipeline" -f mode=recut -f version=X.Y.Z
#   gh workflow run "Release: Unified Pipeline" -f mode=promote -f version=X.Y.Z

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Deprecated. Use release-unified.yml with mode=dry-run|cut|recut|promote."
        type: choice
        required: true
        options:
          - cut
          - recut
          - release
          - dry-run
      version:
        description: "Version to migrate (X.Y.Z); this wrapper does not use it to mutate release state."
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-legacy-wrapper
  cancel-in-progress: false

jobs:
  deprecated:
    name: "Deprecated - use Release: Unified Pipeline"
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refuse legacy release path
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "::error::The legacy release workflow is disabled and performed no release action."
          echo "::error::Run 'Release: Unified Pipeline' with mode=${ACTION/release/promote} and version=${VERSION}."
          echo "No tags, releases, freeze markers, package publishes, or release dispatches were created."
          exit 1
