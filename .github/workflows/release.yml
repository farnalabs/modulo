name: Release

on:
  workflow_dispatch:
    inputs:
      publish_docker_hub:
        description: 'Push all-in-one image to Docker Hub'
        type: boolean
        default: false
      version:
        description: 'Version string (e.g. 0.0.0-test-publish)'
        type: string
        required: true
      publish_pypi:
        description: 'Publish Python package to PyPI'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build Python package
        run: |
          pip install build
          cd backend
          python -m build

      - name: Package version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all-in-one image to ghcr.io
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.all-in-one
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.publish_docker_hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push all-in-one image to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.publish_docker_hub
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.all-in-one
          push: true
          tags: |
            docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/modulo:${{ steps.version.outputs.VERSION }}
            docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/modulo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish to PyPI
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist/

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            backend/dist/*.whl
            backend/dist/*.tar.gz
