name: "Release: Cut / Recut / Promote"

# Alpha release process.
# The code freeze on main is signalled by the existence of the 'release-freeze'
# tag; merge-queue.yml's freeze-gate job pauses merging while it exists.
#
#   cut     - tag vX.Y.Z-rcN at main HEAD, push release-freeze, trigger rc-validate
#   recut   - after a manually-merged fix on main: tag the NEXT RC, re-freeze
#   release - promote vX.Y.Z GA at the validated RC commit and lift the freeze (requires a successful rc-validate run recorded as validated/<rc>)
#   dry-run - rehearse the whole release: build every artefact, publish NOTHING
#
# Dry-run (FAR-1867, extended by FAR-1868): the "publishes nothing" guarantee is
# STRUCTURAL, not a prose promise. A dry-run pushes no tag of any kind - not
# `v*`, not `release-freeze`, not `validated/*` (a single `v*` push would itself
# fire publish-images.yml and push container images) - performs no registry push,
# and creates no GitHub Release, CHANGELOG commit, PyPI package, Helm OCI tag,
# attestation or deploy. It DOES build and upload an SBOM as a workflow
# ARTEFACT (the `produce-sbom` job, which runs for every action): generating a
# file inside the run is not publishing - the artefact never leaves the run,
# reaches no registry or release, and creates no attestation. It is therefore
# safe to run during an active freeze. Any publish-shaped job added below MUST
# be gated with `if: inputs.action != 'dry-run'`, which is what keeps that
# property true as the workflow grows. See docs/release-process.md.
#
# platforms: v1 ships the container images for linux/amd64 ONLY. That is what
#   publish-images.yml actually builds and pushes today, and it is asserted here
#   rather than assumed. The remaining slots are named so the gap stays labelled:
#     linux/arm64   - Planned (P2). docs/system-requirements.md lists it as
#                     Planned (P2); scripts/bundle-versions.env already carries
#                     the arm64 pins; bundle-release.yml already carries a
#                     disabled arm64 matrix leg. Nothing in .github/workflows
#                     cross-builds arm64 today, so wiring it into the publish
#                     path (and adding the leg to the matrix below) is a later
#                     slice's work.
#     macOS         - Planned (P2), out of scope for v1 (FAR-1873; ADR 031).
#     Windows       - Planned (P3), out of scope for v1 (FAR-1873; ADR 031).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "cut = new RC + freeze | recut = next RC after manual fix | release = promote GA + unfreeze | dry-run = build all, publish nothing"
        type: choice
        required: true
        options:
          - cut
          - recut
          - release
          - dry-run
      version:
        description: "Release version in X.Y.Z form (e.g. 0.1.0)"
        type: string
        required: true

# Least privilege at the workflow level: the only write scopes are granted on
# the job that needs them (SonarCloud githubactions:S8233). Only the `release`
# job pushes tags / the CHANGELOG commit and dispatches rc-validate.yml; the
# dry-run, build-images and stub jobs are strictly read-only.
permissions:
  contents: read

concurrency:
  group: release-process
  cancel-in-progress: false

jobs:
  release:
    name: Release (${{ inputs.action }})
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    # contents: write - push the RC/GA/release-freeze tags, push the CHANGELOG
    #   commit to main, and create the GitHub Release.
    # actions: write  - `gh workflow run rc-validate.yml` (workflow_dispatch).
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "modulo-release-bot"
          git config user.email "bot@modulo.run"

      - name: Validate version input
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be semver X.Y.Z (e.g. 0.1.0); got '$VERSION'"
            exit 1
          fi

      - name: Cut release candidate and freeze main
        id: cut
        if: inputs.action == 'cut' || inputs.action == 'recut'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          BASE="v${VERSION}"

          # Next free RC number for this version.
          N=1
          while git rev-parse -q --verify "refs/tags/${BASE}-rc${N}" >/dev/null 2>&1; do
            N=$((N+1))
          done
          RC_TAG="${BASE}-rc${N}"

          echo "Tagging RC: $RC_TAG at $(git rev-parse --short HEAD)"
          git tag -a "$RC_TAG" -m "Release candidate $RC_TAG"
          git push origin "$RC_TAG"

          # The freeze signal: merge-queue.yml's freeze-gate pauses while this
          # tag exists. Force-move it on recut so the gate always tracks the
          # latest freeze.
          git tag -f -a release-freeze -m "Release freeze active (for $RC_TAG)"
          git push origin release-freeze --force

          # Kick off validation against the deployed RC (app.modulo.run).
          gh workflow run rc-validate.yml --ref main -f rc_tag="$RC_TAG"
          echo "Triggered rc-validate.yml for $RC_TAG."

      - name: Promote to GA and lift the freeze
        if: inputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          GA_TAG="v${VERSION}"

          # Safety 1: only promote OUT of an active freeze.
          if ! git rev-parse -q --verify "refs/tags/release-freeze" >/dev/null 2>&1; then
            echo "::error::No release freeze active ('release-freeze' tag missing) - refusing to promote. Run 'cut' first."
            exit 1
          fi

          # Safety 2: never overwrite an existing GA tag.
          if git rev-parse -q --verify "refs/tags/${GA_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${GA_TAG} already exists - refusing to overwrite."
            exit 1
          fi

          # Safety 3: promote exactly the validated RC commit, not whatever
          # happens to be on main right now.
          LATEST_RC=$(git tag --list "${GA_TAG}-rc*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST_RC" ]; then
            echo "::error::No ${GA_TAG}-rc* tags found - nothing to promote."
            exit 1
          fi
           RC_SHA=$(git rev-parse "${LATEST_RC}^{commit}")
           # The checkout at workflow start reflects a possibly-stale local ref;
           # fetch live main so HEAD_SHA reflects what is actually on main now
           # (a commit could have landed between checkout and this step).
           git fetch origin main
           HEAD_SHA=$(git rev-parse origin/main)
          if [ "$RC_SHA" != "$HEAD_SHA" ]; then
            echo "::error::main HEAD (${HEAD_SHA}) is not the latest RC ${LATEST_RC} (${RC_SHA}). Re-cut or investigate before promoting."
            exit 1
          fi

          # Safety 4: GA may only be promoted from a VALIDATED RC. rc-validate.yml
          # pushes validated/<rc_tag> on success; its commit must equal the RC.
          VALIDATED_TAG="validated/${LATEST_RC}"
          if ! git rev-parse -q --verify "refs/tags/${VALIDATED_TAG}" >/dev/null 2>&1; then
            echo "::error::No validation marker ${VALIDATED_TAG} - rc-validate.yml has not recorded a successful validation for ${LATEST_RC}. Wait for (or re-run) validation before promoting."
            exit 1
          fi
          VAL_SHA=$(git rev-parse "${VALIDATED_TAG}^{commit}")
          if [ "$VAL_SHA" != "$RC_SHA" ]; then
            echo "::error::Validation marker ${VALIDATED_TAG} points at ${VAL_SHA}, not the RC commit ${RC_SHA}. Re-run validation."
            exit 1
          fi

          echo "Promoting $LATEST_RC to GA as $GA_TAG"
          git tag -a "$GA_TAG" -m "Release $GA_TAG (promoted from $LATEST_RC)"
          git push origin "$GA_TAG"

          # Lift the freeze: the merge queue resumes on its next tick.
          git push origin --delete release-freeze
          echo "Freeze lifted - merge queue resumes."

      - name: Update CHANGELOG.md and create the GitHub Release
        # Runs only after the GA tag above has been CREATED AND PUSHED — the
        # tag is the release identity. Everything here is therefore
        # non-fatal to the tagging: a changelog/notes/release failure logs a
        # loud annotation and continues (never aborts before the tag exists;
        # the tag lives in the previous step regardless). Exit code: non-zero
        # only when the CHANGELOG.md commit/push itself failed (that IS a
        # required deliverable and must turn the job red); notes-generation
        # and `gh release create` failures are ::warning:: only, per contract.
        if: inputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -uo pipefail
          GA_TAG="v${VERSION}"
          rc=0
          NOTES_FILE="$(mktemp)"

          # 1. Previous tag: nearest tag on the GA commit's parent. Fetch tags
          #    first: on a re-run of this step alone (the tagging step above is
          #    not re-run) ${GA_TAG} may exist only on origin, and a missing
          #    local tag makes `git describe` fail silently and fall back to
          #    full history from the root commit — quietly listing the whole
          #    project as new. First-ever release has no predecessor — fall
          #    back to the root commit so the initial CHANGELOG section still
          #    covers full history.
          git fetch origin --tags 2>/dev/null || echo "::warning::Unable to fetch tags from origin; proceeding with local tags only (a missing ${GA_TAG} falls back to full history)."
          PREV="$(git describe --tags --abbrev=0 "${GA_TAG}^" 2>/dev/null || true)"
          if [ -z "$PREV" ]; then
            echo "::notice::No previous tag before ${GA_TAG}; generating the changelog from the repository root."
            PREV="$(git rev-list --max-parents=0 "$GA_TAG" | tail -n1)"
          fi
          echo "Changelog range: ${PREV}..${GA_TAG}"

          # 2. Sync the local main branch to origin/main before committing
          #    (main was frozen for the whole cut/promote cycle, but fetch
          #    anyway so the push cannot be rejected on a stale base). A
          #    failed sync must NOT reach `git push origin main` below — that
          #    would push a stale local main and falsely report success.
          if ! git fetch origin main || ! git checkout -B main origin/main; then
            echo "::error::Could not sync local main to origin/main before committing CHANGELOG.md for ${GA_TAG}. The tag is safe; re-run this step or commit manually."
            rc=1
          fi

          # 3. Generate the CHANGELOG.md section + the GitHub Release notes.
          #    stdout of the script IS the release notes body; --output
          #    upserts the section into CHANGELOG.md (idempotent on re-run).
          if [ "$rc" -eq 0 ]; then
            if ! python3 scripts/generate_changelog.py \
                --from "$PREV" --to "$GA_TAG" \
                --version "$VERSION" --output CHANGELOG.md > "$NOTES_FILE"; then
              echo "::warning::scripts/generate_changelog.py failed for ${GA_TAG}; falling back to minimal release notes. The tag itself is pushed and intact."
              printf 'See CHANGELOG.md in the repository for details.\n' > "$NOTES_FILE"
              rc=1
            fi

            # 4. Commit the updated CHANGELOG.md to main. (git add first, then
            #    diff --cached: the file does not exist on main yet, so a plain
            #    `git diff -- CHANGELOG.md` would silently miss the new file.)
            if [ "$rc" -eq 0 ]; then
              git add CHANGELOG.md
              if git diff --cached --quiet; then
                echo "CHANGELOG.md already up to date for ${GA_TAG} - nothing to commit."
              elif git commit -m "changelog: ${GA_TAG}" && git push origin main; then
                echo "CHANGELOG.md committed to main for ${GA_TAG}."
              else
                echo "::error::Failed to commit/push CHANGELOG.md for ${GA_TAG} to main. The tag is safe; re-run this step or commit manually."
                rc=1
              fi
            fi
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            printf 'See CHANGELOG.md in the repository for details.\n' > "$NOTES_FILE"
          fi

          # 5. Create the GitHub Release. NON-FATAL: on failure log a loud
          #    ::warning:: and continue — the tag is the release identity and
          #    must never be lost to a notes failure.
          if ! gh release create "$GA_TAG" --title "$GA_TAG" --notes-file "$NOTES_FILE"; then
            echo "::warning::GitHub Release creation failed for ${GA_TAG} (notes/release non-fatal). The tag ${GA_TAG} is pushed and intact; create the release manually or re-run this step."
          else
            echo "GitHub Release created for ${GA_TAG}."
          fi

          exit $rc

  # ===========================================================================
  # Dry-run rehearsal (FAR-1867, release slice 3)
  #
  # Resolves what a real `cut` WOULD do and proves the release is coherent,
  # while publishing nothing. Read-only: it resolves a tag name, reads HEAD, and
  # writes a step summary. It creates no tag, pushes nothing, and touches neither
  # `release-freeze` nor CHANGELOG.md, so it is safe to run during a freeze.
  # ===========================================================================
  dry-run:
    name: Dry-run rehearsal (${{ inputs.version }})
    if: inputs.action == 'dry-run'
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the RC-number lookup below sees every existing tag.
          fetch-depth: 0
          ref: main

      - name: Validate version input
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be semver X.Y.Z (e.g. 0.1.0); got '$VERSION'"
            exit 1
          fi

      - name: Rehearse the release (no tags, no pushes, no publishes)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BASE="v${VERSION}"

          # Next free RC number - the SAME resolution the live `cut` step uses.
          # Read-only: this inspects existing tags and creates none.
          N=1
          while git rev-parse -q --verify "refs/tags/${BASE}-rc${N}" >/dev/null 2>&1; do
            N=$((N+1))
          done
          RC_TAG="${BASE}-rc${N}"
          HEAD_SHA="$(git rev-parse HEAD)"

          {
            echo "## Dry-run rehearsal - nothing was published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Resolved version | ${VERSION} |"
            echo "| main HEAD | ${HEAD_SHA} |"
            echo "| RC tag a real cut would create | ${RC_TAG} |"
            echo "| GA tag a real release would create | ${BASE} |"
            echo ""
            echo "A real cut WOULD have: tagged ${RC_TAG} at ${HEAD_SHA}, force-moved"
            echo "the release-freeze tag to it, and dispatched rc-validate.yml for it."
            echo ""
            echo "This run deliberately did none of that and published nothing: no git"
            echo "tag, no container image, no GitHub Release, no CHANGELOG commit, no"
            echo "PyPI package, no Helm chart, no attestation, no deploy."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Dry-run OK: a real cut would have created ${RC_TAG} at ${HEAD_SHA}; nothing was published."

  # ===========================================================================
  # Artefact build (FAR-1867, release slice 3)
  #
  # Builds every container image with publishing SUPPRESSED, so a dry-run proves
  # the Dockerfiles build without touching a registry. This is a build SKELETON:
  # the publish path (registry login, push, and the image smoke checks) is owned
  # by later slices and stubbed below, so the smoke checks that gate
  # publish-images.yml (the 2026-07-06 crash-loop regression) are deliberately
  # NOT duplicated here - they belong with the publish path that FAR-1869 wires
  # into this workflow. A `push: false` build produces no loadable image, so it
  # could not run them even if it wanted to.
  #
  # linux/amd64 only, matching what v1 actually ships (see the `platforms:`
  # header comment). Cross-building arm64 under QEMU would rehearse a platform no
  # publish path produces, and it is the slowest, most flake-prone leg - so it is
  # left labelled rather than enabled, mirroring bundle-release.yml.
  # ===========================================================================
  build-images:
    name: Build ${{ matrix.image }} (no push)
    if: inputs.action == 'dry-run'
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # Never let one image's failure cancel the others - a dry-run should
      # surface every broken Dockerfile in one pass.
      fail-fast: false
      matrix:
        # Built from `include` only (no base list), mirroring the context/file
        # pairing of publish-images.yml exactly so the rehearsal exercises the
        # same Dockerfiles the real publish will.
        include:
          - image: all-in-one
            context: .
            dockerfile: deploy/docker/Dockerfile.all-in-one
            image_name: ${{ github.repository }}
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
            image_name: ${{ github.repository }}/backend
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.prod
            image_name: ${{ github.repository }}/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ${{ matrix.image }} (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Only the platform v1 ships (see the `platforms:` header comment).
          platforms: linux/amd64
          # Publishing is SUPPRESSED: a dry-run must never reach a registry.
          push: false
          # The tag mirrors the real publish shape (FAR-1869) and is never
          # pushed. buildx notes "No output specified" here - that is expected,
          # because a dry-run intentionally produces no exportable artefact.
          tags: ghcr.io/${{ matrix.image_name }}:dry-run-${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ===========================================================================
  # SBOM production (FAR-1868, release slice 4)
  #
  # Runs for EVERY action, dry-run included: a dry-run must prove the SBOM
  # builds. Generating the file and uploading it as a workflow ARTEFACT is not a
  # publish - the artefact stays inside the run, reaches no registry and no
  # release, and creates no attestation (see the header guarantee above).
  # ===========================================================================
  produce-sbom:
    name: Produce CycloneDX SBOM
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The SBOM must describe the release source, not whichever ref the
          # dispatch happened to target (the `release` job promotes main's HEAD).
          ref: main
          persist-credentials: false

      - name: Set up Python 3.12
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"

      # `--with pyyaml` installs PyYAML into the ephemeral environment and
      # pins the run to the Python 3.12 above (UV_PYTHON), so it does not
      # depend on an unversioned `python` existing on the runner's PATH.
      - name: Generate the CycloneDX SBOM
        run: uv run --no-project --with pyyaml python backend/scripts/generate-sbom.py --output sbom.json

      # Exiting 0 only proves the script ran. Assert the FILE is a usable
      # CycloneDX document, so an empty/degenerate SBOM cannot ship green.
      - name: Verify the SBOM is valid CycloneDX
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project python - <<'PY'
          import json
          import sys

          with open("sbom.json", encoding="utf-8") as handle:
              bom = json.load(handle)

          if bom.get("bomFormat") != "CycloneDX":
              sys.exit(f"sbom.json is not CycloneDX: bomFormat={bom.get('bomFormat')!r}")
          components = bom.get("components") or []
          if not components:
              sys.exit("sbom.json has no components - an SBOM with no dependencies is not a release artefact")
          print(f"Valid CycloneDX SBOM: specVersion={bom.get('specVersion')} components={len(components)}")
          PY

      - name: Upload the SBOM artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.json
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # Build provenance attestations (FAR-1868, release slice 4)
  #
  # This is the PRODUCER for the fail-closed `gh attestation verify` gate in
  # native-release-smoke.yml. Attestations are publish-shaped (they are uploaded
  # to the repo's attestations API), so the job is gated off for dry-run.
  #
  # Subjects attested here are the released FILE artefacts. Today that is the
  # SBOM, which `produce-sbom` generates for every action. The release bundle's
  # file artefacts - the tarball, `SHA256SUMS` and `RELEASE_MANIFEST.json` - are
  # produced by `publish-release-bundle`, still a FAR-1869 stub; when that job
  # becomes real it stages them into `release-artefacts/` and the SAME glob
  # attests them with no per-file step. Nothing here fabricates a subject for a
  # file that was not produced: the SBOM is a hard requirement (this job `needs`
  # the producer), and a partially-staged bundle fails rather than being
  # attested as if complete.
  #
  # Container images are NOT attested here: their publish path
  # (`publish-images`) is also a FAR-1869 stub, so no registry digest exists
  # yet. Attesting an image requires that digest - inventing one is forbidden -
  # so the image attestation is a named gap owned by FAR-1869, recorded in the
  # job summary below.
  # ===========================================================================
  attest-artefacts:
    name: Attest released artefacts
    needs: produce-sbom
    if: inputs.action != 'dry-run'
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    permissions:
      contents: read
      # actions/attest-build-provenance signs with the workflow's OIDC identity
      # and uploads to the repo's attestations API.
      id-token: write
      attestations: write
    steps:
      - name: Download the SBOM artefact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom-cyclonedx
          path: release-artefacts

      - name: Check the file-artefact subject set
        shell: bash
        run: |
          set -euo pipefail
          # The SBOM is produced for every action by `produce-sbom`, which this
          # job `needs`. A missing SBOM is a hard failure - never a silently
          # skipped attestation.
          if [ ! -f release-artefacts/sbom.json ]; then
            echo "::error::sbom.json is missing from the sbom-cyclonedx artefact - refusing to attest a subject that was not produced"
            exit 1
          fi

          # The release-bundle file artefacts are staged here by
          # `publish-release-bundle` (FAR-1869). While that job is a stub they
          # do not exist; once it lands, a bundle that is only PARTIALLY staged
          # must never be attested as if it were complete.
          shopt -s nullglob
          tarballs=(release-artefacts/modulo-*.tar.gz)
          sums=(release-artefacts/SHA256SUMS)
          manifests=(release-artefacts/RELEASE_MANIFEST.json)

          present=0
          if [ "${#tarballs[@]}" -gt 0 ]; then present=$((present + 1)); fi
          if [ "${#sums[@]}" -gt 0 ]; then present=$((present + 1)); fi
          if [ "${#manifests[@]}" -gt 0 ]; then present=$((present + 1)); fi

          if [ "$present" -ne 0 ] && [ "$present" -ne 3 ]; then
            echo "::error::partial release bundle staged for attestation (${present}/3 artefact sets) - refusing to attest an incomplete bundle"
            exit 1
          fi
          if [ "$present" -eq 0 ]; then
            echo "::notice::release-bundle file artefacts are not produced yet (publish-release-bundle is a FAR-1869 stub) - this run attests the SBOM only."
          fi

      - name: Attest the file artefacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # One glob over the staged directory: the SBOM today, plus the
          # tarball/SHA256SUMS/manifest once FAR-1869 stages them. The action
          # hard-fails if no subject matches, so this cannot pass vacuously.
          subject-path: release-artefacts/*

      - name: Record the artefact sets this job does not attest
        shell: bash
        run: |
          {
            echo "## Build attestations"
            echo ""
            echo "| Artefact set | Status |"
            echo "|---|---|"
            echo "| File artefacts (the SBOM today; the bundle tarball / SHA256SUMS / RELEASE_MANIFEST.json once FAR-1869 produces them) | Attested in this job |"
            echo "| Container images (all-in-one, backend, frontend, runner) | **Not attested - no image digest exists yet.** Publishing is a stub owned by FAR-1869; an image attestation needs its registry digest, and no digest is invented here. |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Deliberate stubs for the later release slices (FAR-1869 .. FAR-1872).
  #
  # Each is a named, visible no-op: the slot exists so the release path is
  # legible end-to-end, and it can never run, so it can never be mistaken for
  # working. The guard is `if: inputs.action == 'never'` - a value the `action`
  # input cannot take, so the condition is never satisfiable. It is written that
  # way rather than as `if: false` because actionlint rejects a constant
  # condition (`if-cond`: "constant expression in condition. remove the if:
  # section"), and the lint gate must stay green. Each is replaced with a real
  # job by the ticket named on it. See docs/release-process.md.
  # ===========================================================================

  # FAR-1869 (release slice 5) - versioned GHCR publish of the images, including
  # the first-ever publish of the runner image.
  publish-images:
    name: "STUB FAR-1869 - publish container images"
    if: inputs.action == 'never'
    runs-on: ubicloud-standard-2
    environment: release
    permissions:
      contents: read
    steps:
      - name: Not implemented yet
        run: |
          echo "STUB (FAR-1869, release slice 5): publish the versioned container images to GHCR."
          echo "Not implemented yet. This is the publish path - registry login, the image push,"
          echo "and the per-image smoke checks - and is owned by FAR-1869. Keeping it a no-op"
          echo "guarantees a dry-run can never reach a registry push."

  # FAR-1869 (release slice 5) - the native release bundle and the release record.
  publish-release-bundle:
    name: "STUB FAR-1869 - release bundle, GitHub Release, Helm chart"
    if: inputs.action == 'never'
    runs-on: ubicloud-standard-2
    environment: release
    permissions:
      contents: read
    steps:
      - name: Not implemented yet
        run: |
          echo "STUB (FAR-1869, release slice 5): build, sign and attest the native release bundle"
          echo "from scripts/bundle-versions.env, push bundle-v*, create the GitHub Release with its"
          echo "assets, and push the Helm chart to OCI. Owned by FAR-1869."

  # FAR-1870 (release slice 6) - the deterministic RC soak.
  dispatch-rc-soak:
    name: "STUB FAR-1870 - dispatch the RC soak"
    if: inputs.action == 'never'
    runs-on: ubicloud-standard-2
    environment: release
    permissions:
      contents: read
    steps:
      - name: Not implemented yet
        run: |
          echo "STUB (FAR-1870, release slice 6): dispatch 'Deploy: Staging + Prod' with"
          echo "force_deploy=true and then rc-validate.yml, so an RC is actually soaked and the"
          echo "validated/<rc> marker a real release requires can be produced. Owned by FAR-1870."

  # FAR-1871 (release slice 7) - the PyPI package.
  publish-pypi:
    name: "STUB FAR-1871 - publish the Python package"
    if: inputs.action == 'never'
    runs-on: ubicloud-standard-2
    environment: release
    permissions:
      contents: read
    steps:
      - name: Not implemented yet
        run: |
          echo "STUB (FAR-1871, release slice 7): superseded by the unified release workflow."
          echo "The live PyPI publish path is promote-only in release-unified.yml."

  # FAR-1872 (release slice 8) - release documentation and version pins.
  pin-release-docs:
    name: "STUB FAR-1872 - pin the released version in docs"
    if: inputs.action == 'never'
    runs-on: ubicloud-standard-2
    environment: release
    permissions:
      contents: read
    steps:
      - name: Not implemented yet
        run: |
          echo "STUB (FAR-1872, release slice 8): write the versioned install command into README.md"
          echo "and the version-pin table in the docs. Note the compose TAG template is deliberately"
          echo "never rewritten to a fixed version. Owned by FAR-1872."
