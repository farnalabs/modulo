name: "Release: Cut / Recut / Promote"

# Alpha release process.
# The code freeze on main is signalled by the existence of the 'release-freeze'
# tag; merge-queue.yml's freeze-gate job pauses merging while it exists.
#
#   cut     - tag vX.Y.Z-rcN at main HEAD, push release-freeze, trigger rc-validate
#   recut   - after a manually-merged fix on main: tag the NEXT RC, re-freeze
#   release - promote vX.Y.Z GA at the validated RC commit and lift the freeze (requires a successful rc-validate run recorded as validated/<rc>)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "cut = new RC + freeze | recut = next RC after manual fix | release = promote GA + unfreeze"
        type: choice
        required: true
        options:
          - cut
          - recut
          - release
      version:
        description: "Release version in X.Y.Z form (e.g. 0.1.0)"
        type: string
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: release-process
  cancel-in-progress: false

jobs:
  release:
    name: Release (${{ inputs.action }})
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "modulo-release-bot"
          git config user.email "bot@modulo.run"

      - name: Validate version input
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be semver X.Y.Z (e.g. 0.1.0); got '$VERSION'"
            exit 1
          fi

      - name: Cut release candidate and freeze main
        id: cut
        if: inputs.action == 'cut' || inputs.action == 'recut'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          BASE="v${VERSION}"

          # Next free RC number for this version.
          N=1
          while git rev-parse -q --verify "refs/tags/${BASE}-rc${N}" >/dev/null 2>&1; do
            N=$((N+1))
          done
          RC_TAG="${BASE}-rc${N}"

          echo "Tagging RC: $RC_TAG at $(git rev-parse --short HEAD)"
          git tag -a "$RC_TAG" -m "Release candidate $RC_TAG"
          git push origin "$RC_TAG"

          # The freeze signal: merge-queue.yml's freeze-gate pauses while this
          # tag exists. Force-move it on recut so the gate always tracks the
          # latest freeze.
          git tag -f -a release-freeze -m "Release freeze active (for $RC_TAG)"
          git push origin release-freeze --force

          # Kick off validation against the deployed RC (app.modulo.run).
          gh workflow run rc-validate.yml --ref main -f rc_tag="$RC_TAG"
          echo "Triggered rc-validate.yml for $RC_TAG."

      - name: Promote to GA and lift the freeze
        if: inputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          GA_TAG="v${VERSION}"

          # Safety 1: only promote OUT of an active freeze.
          if ! git rev-parse -q --verify "refs/tags/release-freeze" >/dev/null 2>&1; then
            echo "::error::No release freeze active ('release-freeze' tag missing) - refusing to promote. Run 'cut' first."
            exit 1
          fi

          # Safety 2: never overwrite an existing GA tag.
          if git rev-parse -q --verify "refs/tags/${GA_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${GA_TAG} already exists - refusing to overwrite."
            exit 1
          fi

          # Safety 3: promote exactly the validated RC commit, not whatever
          # happens to be on main right now.
          LATEST_RC=$(git tag --list "${GA_TAG}-rc*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST_RC" ]; then
            echo "::error::No ${GA_TAG}-rc* tags found - nothing to promote."
            exit 1
          fi
           RC_SHA=$(git rev-parse "${LATEST_RC}^{commit}")
           # The checkout at workflow start reflects a possibly-stale local ref;
           # fetch live main so HEAD_SHA reflects what is actually on main now
           # (a commit could have landed between checkout and this step).
           git fetch origin main
           HEAD_SHA=$(git rev-parse origin/main)
          if [ "$RC_SHA" != "$HEAD_SHA" ]; then
            echo "::error::main HEAD (${HEAD_SHA}) is not the latest RC ${LATEST_RC} (${RC_SHA}). Re-cut or investigate before promoting."
            exit 1
          fi

          # Safety 4: GA may only be promoted from a VALIDATED RC. rc-validate.yml
          # pushes validated/<rc_tag> on success; its commit must equal the RC.
          VALIDATED_TAG="validated/${LATEST_RC}"
          if ! git rev-parse -q --verify "refs/tags/${VALIDATED_TAG}" >/dev/null 2>&1; then
            echo "::error::No validation marker ${VALIDATED_TAG} - rc-validate.yml has not recorded a successful validation for ${LATEST_RC}. Wait for (or re-run) validation before promoting."
            exit 1
          fi
          VAL_SHA=$(git rev-parse "${VALIDATED_TAG}^{commit}")
          if [ "$VAL_SHA" != "$RC_SHA" ]; then
            echo "::error::Validation marker ${VALIDATED_TAG} points at ${VAL_SHA}, not the RC commit ${RC_SHA}. Re-run validation."
            exit 1
          fi

          echo "Promoting $LATEST_RC to GA as $GA_TAG"
          git tag -a "$GA_TAG" -m "Release $GA_TAG (promoted from $LATEST_RC)"
          git push origin "$GA_TAG"

          # Lift the freeze: the merge queue resumes on its next tick.
          git push origin --delete release-freeze
          echo "Freeze lifted - merge queue resumes."

      - name: Update CHANGELOG.md and create the GitHub Release
        # Runs only after the GA tag above has been CREATED AND PUSHED — the
        # tag is the release identity. Everything here is therefore
        # non-fatal to the tagging: a changelog/notes/release failure logs a
        # loud annotation and continues (never aborts before the tag exists;
        # the tag lives in the previous step regardless). Exit code: non-zero
        # only when the CHANGELOG.md commit/push itself failed (that IS a
        # required deliverable and must turn the job red); notes-generation
        # and `gh release create` failures are ::warning:: only, per contract.
        if: inputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -uo pipefail
          GA_TAG="v${VERSION}"
          rc=0
          NOTES_FILE="$(mktemp)"

          # 1. Previous tag: nearest tag on the GA commit's parent. First-ever
          #    release has no predecessor — fall back to the root commit so the
          #    initial CHANGELOG section still covers full history.
          PREV="$(git describe --tags --abbrev=0 "${GA_TAG}^" 2>/dev/null || true)"
          if [ -z "$PREV" ]; then
            echo "::notice::No previous tag before ${GA_TAG}; generating the changelog from the repository root."
            PREV="$(git rev-list --max-parents=0 "$GA_TAG" | tail -n1)"
          fi
          echo "Changelog range: ${PREV}..${GA_TAG}"

          # 2. Sync the local main branch to origin/main before committing
          #    (main was frozen for the whole cut/promote cycle, but fetch
          #    anyway so the push cannot be rejected on a stale base). A
          #    failed sync must NOT reach `git push origin main` below — that
          #    would push a stale local main and falsely report success.
          if ! git fetch origin main || ! git checkout -B main origin/main; then
            echo "::error::Could not sync local main to origin/main before committing CHANGELOG.md for ${GA_TAG}. The tag is safe; re-run this step or commit manually."
            rc=1
          fi

          # 3. Generate the CHANGELOG.md section + the GitHub Release notes.
          #    stdout of the script IS the release notes body; --output
          #    upserts the section into CHANGELOG.md (idempotent on re-run).
          if [ "$rc" -eq 0 ]; then
            if ! python3 scripts/generate_changelog.py \
                --from "$PREV" --to "$GA_TAG" \
                --version "$VERSION" --output CHANGELOG.md > "$NOTES_FILE"; then
              echo "::warning::scripts/generate_changelog.py failed for ${GA_TAG}; falling back to minimal release notes. The tag itself is pushed and intact."
              printf 'See CHANGELOG.md in the repository for details.\n' > "$NOTES_FILE"
              rc=1
            fi

            # 4. Commit the updated CHANGELOG.md to main. (git add first, then
            #    diff --cached: the file does not exist on main yet, so a plain
            #    `git diff -- CHANGELOG.md` would silently miss the new file.)
            if [ "$rc" -eq 0 ]; then
              git add CHANGELOG.md
              if git diff --cached --quiet; then
                echo "CHANGELOG.md already up to date for ${GA_TAG} - nothing to commit."
              elif git commit -m "changelog: ${GA_TAG}" && git push origin main; then
                echo "CHANGELOG.md committed to main for ${GA_TAG}."
              else
                echo "::error::Failed to commit/push CHANGELOG.md for ${GA_TAG} to main. The tag is safe; re-run this step or commit manually."
                rc=1
              fi
            fi
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            printf 'See CHANGELOG.md in the repository for details.\n' > "$NOTES_FILE"
          fi

          # 5. Create the GitHub Release. NON-FATAL: on failure log a loud
          #    ::warning:: and continue — the tag is the release identity and
          #    must never be lost to a notes failure.
          if ! gh release create "$GA_TAG" --title "$GA_TAG" --notes-file "$NOTES_FILE"; then
            echo "::warning::GitHub Release creation failed for ${GA_TAG} (notes/release non-fatal). The tag ${GA_TAG} is pushed and intact; create the release manually or re-run this step."
          else
            echo "GitHub Release created for ${GA_TAG}."
          fi

          exit $rc
