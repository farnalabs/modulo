name: "DAST (OWASP ZAP)"

on:
  schedule:
    # Nightly against staging, 02:25 UTC. Report-only harness; does not block deploys.
    - cron: '25 2 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan'
        required: false
        default: 'https://staging.modulo.run'
      scan_type:
        description: 'baseline (fast) or full (deep)'
        required: false
        default: 'baseline'

permissions:
  contents: read

# Authenticate GitHub git fetches so `uv sync --frozen` can resolve git-pinned
# dependencies (e.g. pytest-bdd @ refs/pull/827/head) without an anonymous
# fetch-by-SHA, which GitHub rejects from CI runners.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf'
  GIT_CONFIG_VALUE_0: "https://github.com/"

jobs:
  dast:
    name: OWASP ZAP scan
    runs-on: ubicloud-standard-2
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Run OWASP ZAP scan
        id: zap
        shell: bash
        run: |
          TARGET="${{ github.event.inputs.target_url || 'https://staging.modulo.run' }}"
          SCAN_TYPE="${{ github.event.inputs.scan_type || 'baseline' }}"
          mkdir -p zap-report
          chmod 777 zap-report
          EXIT=0
          if [ "$SCAN_TYPE" = "full" ]; then
            docker run --rm -v "$PWD/zap-report:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py -t "$TARGET" -r zap-report.html -J zap-report.json -a || EXIT=$?
          else
            docker run --rm -v "$PWD/zap-report:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "$TARGET" -r zap-report.html -J zap-report.json -a || EXIT=$?
          fi
          echo "zap_exit=${EXIT}"
          echo "zap_exit=${EXIT}" >> "$GITHUB_OUTPUT"
          # Report-only harness: do NOT fail the workflow on ZAP findings. ZAP baseline
          # exits 0/1/2/3 (clean/fail-high/warn-medium/info). A non-zero exit only reflects
          # findings, never a harness failure. The Summarize step reports them and the
          # report artifact always uploads. The enforcement point is the dast-gate job in
          # deploy.yml (FAR-449), not this nightly.
          exit 0

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-${{ github.run_id }}
          path: zap-report/
          if-no-files-found: ignore

      - name: Summarize findings
        if: always()
        shell: bash
        run: |
          echo "ZAP scan exit code: ${{ steps.zap.outputs.zap_exit }}"
          python3 - <<'PYEOF'
          import json, os, sys
          path = "zap-report/zap-report.json"
          if not os.path.exists(path):
              print("No JSON report generated - check the scan step output.")
              sys.exit(0)
          with open(path) as f:
              data = json.load(f)
          totals = {}
          for site in data.get("site", []):
              for alert in site.get("alerts", []):
                  risk = alert.get("riskdesc", "?")
                  name = alert.get("name", "?")
                  cnt = alert.get("count", 1)
                  key = f"{risk} | {name}"
                  totals[key] = totals.get(key, 0) + cnt
          print("=== ZAP findings summary ===")
          for key in sorted(totals):
              print(f"{totals[key]:>3} x {key}")
          print(f"=== Total distinct findings: {len(totals)} ===")
          PYEOF
