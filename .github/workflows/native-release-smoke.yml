name: "Native: release smoke + canary (bundle-v*)"

# FAR-673 / ADR 031 Decision 10. Two legs:
#
# 1. RELEASE SMOKE (tag-triggered, on the EXACT release artifact):
#    the published tarball + SIGNED manifest (sha256 verified against
#    SHA256SUMS), installed via scripts/install.sh (which enforces the
#    ed25519 manifest signature), booted, then: health 200 + WS
#    handshake + authenticated API + MCP initialize + SPA index +
#    doctor green + zero-egress proof (unshare -n) + backup -> wipe ->
#    restore -> doctor green + force-kill with orphan sweep and recovery
#    health within 60s + Ctrl-C clean exit + upgrade refusal without a
#    verified dump and upgrade success with one.
# 2. NIGHTLY CANARY (cron + workflow_dispatch): the PUBLISHED latest (or
#    an explicitly requested) artifact from its public URL, verified
#    fail-closed against a build-provenance attestation BEFORE install,
#    plus the N-1 upgrade leg (previous release -> seed -> upgrade ->
#    data intact + doctor green). Failures land on ONE per-day tracking
#    issue (deduped by issue key across re-runs); a green canary
#    auto-closes that issue.
#
# Rollback tooling: workflow_dispatch with rollback_version; the manual
# playbook (triggers + actions) lives in docs/upgrade-process.md.

on:
  push:
    tags:
      - "bundle-v*"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      rollback_version:
        description: "Rollback playbook: target release (bundle-vX.Y.Z) to verify"
        required: false
        type: string
      canary_version:
        description: "Smoke-canary a specific PUBLISHED version instead of latest"
        required: false
        type: string

concurrency:
  group: native-release-smoke-${{ github.event_name }}-${{ github.ref || 'nightly' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DATA_DIR: /home/runner/.local/share/modulo/data

jobs:
  release-smoke:
    name: Release smoke (exact artifact)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      # The push trigger only fires on bundle-v* tags, so github.ref_name is
      # always the exact release artifact to smoke. Without this the fetch
      # step falls into the fatal else ("neither TAG nor the canary env is set").
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout (scripts/install.sh must exist for the from-file install)
        uses: actions/checkout@v7

      - name: Fetch the artifact to smoke + enforce the integrity gates
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.canary_version }}
        run: |
          set -euo pipefail
          if [ -n "${CANARY:-}" ]; then
            # CANARY leg: the PUBLISHED artifact from its public URL. The releases
            # feed is the source of truth; nothing is rebuilt on the runner.
            if [ -n "${REQUESTED}" ]; then
              tag="${REQUESTED}"
            else
              tag="$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')"
            fi
            if ! gh api "repos/${{ github.repository }}/releases/tags/${tag}" > /dev/null; then
              echo "::error::canary release ${tag} does not exist"; exit 1
            fi
            version="${tag#bundle-v}"
            echo "TAG=${tag}" >> "$GITHUB_ENV"
            echo "TARBALL=canary.tar.gz" >> "$GITHUB_ENV"
            curl --proto '=https' -fsSL -o canary.tar.gz \
              "https://github.com/${{ github.repository }}/releases/download/${tag}/modulo-${version}-linux-amd64.tar.gz" \
              || { echo "::error::published artifact not downloadable at ${tag}"; exit 1; }
            curl --proto '=https' -fsSL -o RELEASE_MANIFEST.json "https://github.com/${{ github.repository }}/releases/download/${tag}/RELEASE_MANIFEST.json"
            curl --proto '=https' -fsSL -o RELEASE_MANIFEST.json.sig "https://github.com/${{ github.repository }}/releases/download/${tag}/RELEASE_MANIFEST.json.sig"
            curl --proto '=https' -fsSL -o SHA256SUMS "https://github.com/${{ github.repository }}/releases/download/${tag}/SHA256SUMS"
            # FAIL-CLOSED attestation gate: SHA256SUMS alone does not protect
            # against a compromised release publisher; the artifact must carry a
            # verifiable SLSA build provenance generated by bundle-release.yml.
            if ! gh attestation verify canary.tar.gz --repo "${{ github.repository }}"; then
              echo "::error::no verifiable build-provenance attestation for ${tag} - refusing to install (fail closed)"; exit 1
            fi
          elif [ -n "${TAG:-}" ]; then
            # RELEASE-SMOKE leg: the EXACT tag-published artifact, never rebuilt.
            case "${TAG}" in
              bundle-v*) ;;
              *) echo "::error::release-smoke TAG '${TAG}' does not match bundle-v*"; exit 1 ;;
            esac
            version="${TAG#bundle-v}"
            tarball="modulo-${version}-linux-amd64.tar.gz"
            assets="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
            if ! echo "${assets}" | grep -qF "${tarball}"; then
              echo "::error::release ${TAG} does not carry ${tarball}"; exit 1
            fi
            if ! echo "${assets}" | grep -qF "RELEASE_MANIFEST.json"; then
              echo "::error::release ${TAG} is missing the SIGNED release manifest (installs enforce the signature gate)"; exit 1
            fi
            gh release download "${TAG}" --dir smoke/ \
              --pattern "${tarball}" --pattern "RELEASE_MANIFEST.json" \
              --pattern "RELEASE_MANIFEST.json.sig" --pattern "SHA256SUMS"
            expected="$(sha256sum "smoke/${tarball}" | awk '{print $1}')"
            actual="$(grep -F "${tarball}" smoke/SHA256SUMS | awk '{print $1}')"
            if [ "${expected}" != "${actual}" ]; then
              echo "::error::tarball sha256 does not match SHA256SUMS"; exit 1
            fi
            echo "TARBALL=smoke/${tarball}" >> "$GITHUB_ENV"
          else
            echo "::error::neither TAG nor the canary env is set - refusing to run a smoke with no argument"; exit 1
          fi

      - name: Install from the artifact (verified, installer enforces signature + sha256)
        run: |
          set -euo pipefail
          # Re-verify the exact artifact we are about to install (fail closed) so
          # the downloaded file is integrity-checked immediately before execution.
          tarball="$(basename "${TARBALL}")"
          expected="$(sha256sum "${TARBALL}" | awk '{print $1}')"
          actual="$(grep -F "${tarball}" smoke/SHA256SUMS | awk '{print $1}')"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::tarball sha256 does not match SHA256SUMS - refusing to install (fail closed)"; exit 1
          fi
          bash scripts/install.sh --from-file "${TARBALL}"
          export PATH="${HOME}/.local/bin:${PATH}"
          modulo --version

      - name: Boot the stack (detached) and resolve the API base
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          modulo start --detach
          for i in $(seq 1 30); do
            state_ready="$(python3 -c "import json, pathlib; p = pathlib.Path.home() / '.local' / 'share' / 'modulo' / 'data' / 'state.json'; print(json.loads(p.read_text()).get('api_port', '') if p.is_file() else '')")"
            if [ -n "${state_ready}" ]; then
              echo "BASE=http://127.0.0.1:${state_ready}" >> "$GITHUB_ENV"
              break
            fi
            sleep 2
          done
          if [ -z "${BASE:-}" ]; then
            echo "::error::state.json never appeared - boot failed"; exit 1
          fi
          modulo status

      - name: Seed the admin user
        env:
          ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          if [ -z "${ADMIN_PASSWORD}" ]; then
            echo "::error::precondition missing: SMOKE_ADMIN_PASSWORD secret is not set - refusing to run a partially-faked smoke"; exit 1
          fi
          modulo users add admin@modulo.run --admin --password "${ADMIN_PASSWORD}"

      - name: Endpoint smoke (health, SPA, authenticated API, MCP initialize, WS handshake)
        env:
          ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          curl -fsS --retry 30 --retry-connrefused --retry-max-time 60 "${BASE}/healthz" > /dev/null
          curl -fsS "${BASE}/" | grep -qi '<html'
          token="$(curl -fsS -X POST "${BASE}/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@modulo.run\",\"password\":\"${ADMIN_PASSWORD}\"}" \
            | jq -r '.access_token')"
          # MCP initialize: the remote MCP server is mounted at /mcp (api/main.py)
          curl -fsS -X POST "${BASE}/mcp" \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-03-26", "capabilities": {}, "clientInfo": {"name": "smoke", "version": "0"}}}' \
            | grep -q '"serverInfo"'
          # WS handshake against the native /ws upgrade route; the 101 line is the proof
          response="$(curl -s --http1.1 -i --max-time 10 \
            -H 'Upgrade: websocket' -H 'Connection: Upgrade' \
            -H 'Sec-WebSocket-Key: c2hvcHBlcnNlcnZpY2U=' -H 'Sec-WebSocket-Version: 13' \
            "${BASE}/ws")"
          echo "${response}" | head -n1 | grep -q '101' \
            || { echo "::error::/ws did not complete the WebSocket upgrade"; exit 1; }

      - name: Doctor green
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          modulo doctor --json | tee doctor.json > /dev/null
          echo "doctor OK (exit 0, green)"

      - name: Zero-egress proof (doctor under unshare -n)
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          unshare -n modulo doctor --json | tee offline-doctor.json > /dev/null
          echo "::notice::doctor exited 0 with zero network interfaces - zero-egress proof complete"

      - name: Backup -> wipe -> restore -> doctor green
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          modulo backup --data-dir "${DATA_DIR}" --output-dir smoke-backup
          modulo stop
          rm -rf "${DATA_DIR}"
          modulo start --detach
          modulo restore smoke-backup --data-dir "${DATA_DIR}" --yes
          modulo doctor --json | tee doctor-restore.json > /dev/null
          echo "backup/wipe/restore round-trip OK"

      - name: Force-kill the process tree; orphans reaped; recovery health within 60s
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          lock_file="$(dirname "${DATA_DIR}")/data.lock"
          launcher_pid="$(grep -oE '"pid": *[0-9]+' "${lock_file}" | grep -oE '[0-9]+' | head -n1 || true)"
          if [ -z "${launcher_pid}" ]; then
            echo "::error::no launcher PID in ${lock_file} - precondition violated"; exit 1
          fi
          pgid="$(ps -o pgid= -p "${launcher_pid}" | tr -d '[:space:]')"
          if [ -n "${pgid}" ]; then
            kill -9 -- "-${pgid}" 2>/dev/null || true
          fi
          kill -9 "${launcher_pid}" 2>/dev/null || true
          sleep 2
          if pgrep -x postgres > /dev/null || pgrep -x redis-server > /dev/null; then
            echo "::error::orphaned bundled services survived the kill-tree"; exit 1
          fi
          echo "orphans reaped"
          modulo stop || true
          modulo start --detach
          curl -fsS --retry 30 --retry-connrefused --retry-max-time 60 "${BASE}/healthz" > /dev/null
          echo "recovery health 200 within 60s OK"

      - name: Ctrl-C clean exit proof
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          modulo stop || true
          modulo start &
          pid=$!
          curl -fsS --retry 30 --retry-connrefused "${BASE}/healthz" > /dev/null
          set +e
          kill -INT "${pid}" 2>/dev/null
          wait "${pid}"
          code=$?
          set -e
          if [ "${code}" -ne 0 ]; then
            echo "::error::SIGINT did not exit cleanly (exit ${code}, expected 0)"; exit 1
          fi

      - name: Upgrade refusal without a dump; upgrade success with a dump
        env:
          ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          modulo stop || true
          # REFUSAL: the stack is stopped AND no verified snapshot exists on this
          # fresh smoke data dir, so the enforced pre-upgrade dump refuses and the
          # swap does NOT happen (launcher/upgrade.py pre_upgrade_dump refusal).
          set +e
          modulo upgrade "${TAG}" --from-file "${TARBALL}" 2>refusal.txt
          refusal_code=$?
          set -e
          if [ "${refusal_code}" -eq 0 ]; then
            echo "::error::upgrade succeeded WITHOUT a verified pre-upgrade dump - the dump gate leaked"; exit 1
          fi
          if ! grep -qi 'snapshot\|backup\|dump\|resume' refusal.txt; then
            echo "::error::the refusal printed no snapshot/backup guidance"; exit 1
          fi
          echo "upgrade refusal OK"
          # SUCCESS: boot the stack (the dump needs the bundled Postgres reachable),
          # take the verified dump via modulo backup, then upgrade --skip-backup
          # (the loud, one-flag installer ack per scripts/install.sh and FAR-675).
          modulo start --detach
          modulo backup --data-dir "${DATA_DIR}" --output-dir smoke-backup2
          modulo upgrade "${TAG}" --from-file "${TARBALL}" --skip-backup
          curl -fsS --retry 30 --retry-connrefused "${BASE}/healthz" > /dev/null
          modulo stop
          echo "upgrade success OK"

      - name: N-1 upgrade leg (canary leg only)
        if: ${{ env.CANARY == '1' && env.N_MINUS_1 != '' }}
        env:
          ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          # The canary resolve set N_MINUS_1 in a prior step; absence means the
          # release feed holds no previous bundle release yet. That is expected
          # EXACTLY once at the start of a release line - report it loudly, don't
          # silently exit 0.
          if [ -z "${N_MINUS_1:-}" ]; then
            echo "::warning::no N-1 release resolvable - expected exactly once at the start of a release line; NOT a silent skip"
            exit 0
          fi
          prev_ver="${N_MINUS_1#bundle-v}"
          curl --proto '=https' -fsSL -o n1.tar.gz \
            "https://github.com/${{ github.repository }}/releases/download/${N_MINUS_1}/modulo-${prev_ver}-linux-amd64.tar.gz"
          # Install N-1, seed identifiable data, upgrade to TAG, prove data intact.
          bash scripts/install.sh --from-file n1.tar.gz
          modulo start --detach
          modulo users add n1-seed@modulo.run --admin --password "${ADMIN_PASSWORD}"
          modulo backup --data-dir "${DATA_DIR}" --output-dir canary-backup
          modulo doctor --json | tee canary-doctor.json > /dev/null
          modulo stop || true
          bash scripts/install.sh --from-file "${TARBALL}" --skip-backup
          modulo start --detach
          modulo doctor --json | tee canary-doctor2.json > /dev/null
          modulo users list --data-dir "${DATA_DIR}" | grep -q 'n1-seed@modulo.run' \
            || { echo "::error::seeded N-1 data did not survive the upgrade"; exit 1; }
          modulo stop
          echo "N-1 upgrade leg OK (data intact + doctor green)"

  canary:
    name: Nightly canary (published artifact + N-1 upgrade)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rollback_version == '' && inputs.canary_version != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      # The retry-3-runs contract: each attempt is one leg; the tracking
      # issue at the bottom dedupes every failing attempt's comments onto
      # ONE per-day issue (the retry loop collapses to re-run semantics).
      matrix:
        attempt: [1, 2, 3]
      fail-fast: false
    env:
      CANARY: "1"
    steps:
      - name: Checkout (scripts/install.sh must exist for the from-file install)
        uses: actions/checkout@v7

      - name: Fetch the artifact to smoke + enforce the integrity gates
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.canary_version }}
        run: |
          set -euo pipefail
          if [ -n "${CANARY:-}" ]; then
            # CANARY leg: the PUBLISHED artifact from its public URL. The releases
            # feed is the source of truth; nothing is rebuilt on the runner.
            if [ -n "${REQUESTED}" ]; then
              tag="${REQUESTED}"
            else
              tag="$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')"
            fi
            if ! gh api "repos/${{ github.repository }}/releases/tags/${tag}" > /dev/null; then
              echo "::error::canary release ${tag} does not exist"; exit 1
            fi
            version="${tag#bundle-v}"
            echo "TAG=${tag}" >> "$GITHUB_ENV"
            echo "TARBALL=canary.tar.gz" >> "$GITHUB_ENV"
            # Resolve N-1 (the previous bundle-v release) so the N-1 upgrade leg
            # below is not permanently dead code. Best-effort: a resolution
            # failure must WARN, never abort the smoke.
            set +e
            release_list="$(gh api "repos/${{ github.repository }}/releases?per_page=20" \
              --jq '[.[] | select(.tag_name | startswith("bundle-v")) | .tag_name] | join("\n")' 2>/dev/null)"
            set -e
            if [ -n "${release_list}" ]; then
              readarray -t tags_arr < <(printf '%s\n' "${release_list}")
              idx=-1
              for i in "${!tags_arr[@]}"; do
                if [ "${tags_arr[i]}" = "${tag}" ]; then idx=$i; break; fi
              done
              if [ "${idx}" -ge 0 ] && [ "$((idx+1))" -lt "${#tags_arr[@]}" ]; then
                echo "N_MINUS_1=${tags_arr[idx+1]}" >> "$GITHUB_ENV"
                echo "resolved N-1 release: ${tags_arr[idx+1]}"
              else
                echo "::warning::no N-1 release resolvable for ${tag} - N-1 upgrade leg will be skipped"
              fi
            else
              echo "::warning::could not list releases to resolve N-1 for ${tag} - N-1 upgrade leg will be skipped"
            fi
            curl --proto '=https' -fsSL -o canary.tar.gz \
              "https://github.com/${{ github.repository }}/releases/download/${tag}/modulo-${version}-linux-amd64.tar.gz" \
              || { echo "::error::published artifact not downloadable at ${tag}"; exit 1; }
            curl --proto '=https' -fsSL -o RELEASE_MANIFEST.json "https://github.com/${{ github.repository }}/releases/download/${tag}/RELEASE_MANIFEST.json"
            curl --proto '=https' -fsSL -o RELEASE_MANIFEST.json.sig "https://github.com/${{ github.repository }}/releases/download/${tag}/RELEASE_MANIFEST.json.sig"
            curl --proto '=https' -fsSL -o SHA256SUMS "https://github.com/${{ github.repository }}/releases/download/${tag}/SHA256SUMS"
            # FAIL-CLOSED attestation gate: SHA256SUMS alone does not protect
            # against a compromised release publisher; the artifact must carry a
            # verifiable SLSA build provenance generated by bundle-release.yml.
            if ! gh attestation verify canary.tar.gz --repo "${{ github.repository }}"; then
              echo "::error::no verifiable build-provenance attestation for ${tag} - refusing to install (fail closed)"; exit 1
            fi
          elif [ -n "${TAG:-}" ]; then
            # RELEASE-SMOKE leg: the EXACT tag-published artifact, never rebuilt.
            case "${TAG}" in
              bundle-v*) ;;
              *) echo "::error::release-smoke TAG '${TAG}' does not match bundle-v*"; exit 1 ;;
            esac
            version="${TAG#bundle-v}"
            tarball="modulo-${version}-linux-amd64.tar.gz"
            assets="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
            if ! echo "${assets}" | grep -qF "${tarball}"; then
              echo "::error::release ${TAG} does not carry ${tarball}"; exit 1
            fi
            if ! echo "${assets}" | grep -qF "RELEASE_MANIFEST.json"; then
              echo "::error::release ${TAG} is missing the SIGNED release manifest (installs enforce the signature gate)"; exit 1
            fi
            gh release download "${TAG}" --dir smoke/ \
              --pattern "${tarball}" --pattern "RELEASE_MANIFEST.json" \
              --pattern "RELEASE_MANIFEST.json.sig" --pattern "SHA256SUMS"
            expected="$(sha256sum "smoke/${tarball}" | awk '{print $1}')"
            actual="$(grep -F "${tarball}" smoke/SHA256SUMS | awk '{print $1}')"
            if [ "${expected}" != "${actual}" ]; then
              echo "::error::tarball sha256 does not match SHA256SUMS"; exit 1
            fi
            echo "TARBALL=smoke/${tarball}" >> "$GITHUB_ENV"
          else
            echo "::error::neither TAG nor the canary env is set - refusing to run a smoke with no argument"; exit 1
          fi

      - name: Install from the artifact (verified, installer enforces signature + sha256)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Re-verify the exact artifact we are about to install (fail closed) so
          # the downloaded file is integrity-checked immediately before execution.
          gh attestation verify "${TARBALL}" --repo "${{ github.repository }}" || { echo "::error::no verifiable build-provenance attestation for ${TARBALL} - refusing to install (fail closed)"; exit 1; }
          bash scripts/install.sh --from-file "${TARBALL}"
          export PATH="${HOME}/.local/bin:${PATH}"
          modulo --version

      - name: Boot the stack (detached) and resolve the API base
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          modulo start --detach
          for i in $(seq 1 30); do
            state_ready="$(python3 -c "import json, pathlib; p = pathlib.Path.home() / '.local' / 'share' / 'modulo' / 'data' / 'state.json'; print(json.loads(p.read_text()).get('api_port', '') if p.is_file() else '')")"
            if [ -n "${state_ready}" ]; then
              echo "BASE=http://127.0.0.1:${state_ready}" >> "$GITHUB_ENV"
              break
            fi
            sleep 2
          done
          if [ -z "${BASE:-}" ]; then
            echo "::error::state.json never appeared - boot failed"; exit 1
          fi
          modulo status

      - name: Seed the admin user
        env:
          ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          if [ -z "${ADMIN_PASSWORD}" ]; then
            echo "::error::precondition missing: SMOKE_ADMIN_PASSWORD secret is not set - refusing to run a partially-faked smoke"; exit 1
          fi
          modulo users add admin@modulo.run --admin --password "${ADMIN_PASSWORD}"

      - name: Endpoint smoke (health, SPA, authenticated API, MCP initialize, WS handshake)
        env:
          ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          curl -fsS --retry 30 --retry-connrefused --retry-max-time 60 "${BASE}/healthz" > /dev/null
          curl -fsS "${BASE}/" | grep -qi '<html'
          token="$(curl -fsS -X POST "${BASE}/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@modulo.run\",\"password\":\"${ADMIN_PASSWORD}\"}" \
            | jq -r '.access_token')"
          # MCP initialize: the remote MCP server is mounted at /mcp (api/main.py)
          curl -fsS -X POST "${BASE}/mcp" \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-03-26", "capabilities": {}, "clientInfo": {"name": "smoke", "version": "0"}}}' \
            | grep -q '"serverInfo"'
          # WS handshake against the native /ws upgrade route; the 101 line is the proof
          response="$(curl -s --http1.1 -i --max-time 10 \
            -H 'Upgrade: websocket' -H 'Connection: Upgrade' \
            -H 'Sec-WebSocket-Key: c2hvcHBlcnNlcnZpY2U=' -H 'Sec-WebSocket-Version: 13' \
            "${BASE}/ws")"
          echo "${response}" | head -n1 | grep -q '101' \
            || { echo "::error::/ws did not complete the WebSocket upgrade"; exit 1; }

      - name: Doctor green
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          modulo doctor --json | tee doctor.json > /dev/null
          echo "doctor OK (exit 0, green)"

      - name: Zero-egress proof (doctor under unshare -n)
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          unshare -n modulo doctor --json | tee offline-doctor.json > /dev/null
          echo "::notice::doctor exited 0 with zero network interfaces - zero-egress proof complete"

      - name: Backup -> wipe -> restore -> doctor green
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          modulo backup --data-dir "${DATA_DIR}" --output-dir smoke-backup
          modulo stop
          rm -rf "${DATA_DIR}"
          modulo start --detach
          modulo restore smoke-backup --data-dir "${DATA_DIR}" --yes
          modulo doctor --json | tee doctor-restore.json > /dev/null
          echo "backup/wipe/restore round-trip OK"

      - name: Force-kill the process tree; orphans reaped; recovery health within 60s
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          lock_file="$(dirname "${DATA_DIR}")/data.lock"
          launcher_pid="$(grep -oE '"pid": *[0-9]+' "${lock_file}" | grep -oE '[0-9]+' | head -n1 || true)"
          if [ -z "${launcher_pid}" ]; then
            echo "::error::no launcher PID in ${lock_file} - precondition violated"; exit 1
          fi
          pgid="$(ps -o pgid= -p "${launcher_pid}" | tr -d '[:space:]')"
          if [ -n "${pgid}" ]; then
            kill -9 -- "-${pgid}" 2>/dev/null || true
          fi
          kill -9 "${launcher_pid}" 2>/dev/null || true
          sleep 2
          if pgrep -x postgres > /dev/null || pgrep -x redis-server > /dev/null; then
            echo "::error::orphaned bundled services survived the kill-tree"; exit 1
          fi
          echo "orphans reaped"
          modulo stop || true
          modulo start --detach
          curl -fsS --retry 30 --retry-connrefused --retry-max-time 60 "${BASE}/healthz" > /dev/null
          echo "recovery health 200 within 60s OK"

      - name: Ctrl-C clean exit proof
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          modulo stop || true
          modulo start &
          pid=$!
          curl -fsS --retry 30 --retry-connrefused "${BASE}/healthz" > /dev/null
          set +e
          kill -INT "${pid}" 2>/dev/null
          wait "${pid}"
          code=$?
          set -e
          if [ "${code}" -ne 0 ]; then
            echo "::error::SIGINT did not exit cleanly (exit ${code}, expected 0)"; exit 1
          fi

      - name: Upgrade refusal without a dump; upgrade success with a dump
        env:
          ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          modulo stop || true
          # REFUSAL: the stack is stopped AND no verified snapshot exists on this
          # fresh smoke data dir, so the enforced pre-upgrade dump refuses and the
          # swap does NOT happen (launcher/upgrade.py pre_upgrade_dump refusal).
          set +e
          modulo upgrade "${TAG}" --from-file "${TARBALL}" 2>refusal.txt
          refusal_code=$?
          set -e
          if [ "${refusal_code}" -eq 0 ]; then
            echo "::error::upgrade succeeded WITHOUT a verified pre-upgrade dump - the dump gate leaked"; exit 1
          fi
          if ! grep -qi 'snapshot\|backup\|dump\|resume' refusal.txt; then
            echo "::error::the refusal printed no snapshot/backup guidance"; exit 1
          fi
          echo "upgrade refusal OK"
          # SUCCESS: boot the stack (the dump needs the bundled Postgres reachable),
          # take the verified dump via modulo backup, then upgrade --skip-backup
          # (the loud, one-flag installer ack per scripts/install.sh and FAR-675).
          modulo start --detach
          modulo backup --data-dir "${DATA_DIR}" --output-dir smoke-backup2
          modulo upgrade "${TAG}" --from-file "${TARBALL}" --skip-backup
          curl -fsS --retry 30 --retry-connrefused "${BASE}/healthz" > /dev/null
          modulo stop
          echo "upgrade success OK"

      - name: N-1 upgrade leg (canary leg only)
        if: ${{ env.CANARY == '1' && env.N_MINUS_1 != '' }}
        env:
          ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          # The canary resolve set N_MINUS_1 in a prior step; absence means the
          # release feed holds no previous bundle release yet. That is expected
          # EXACTLY once at the start of a release line - report it loudly, don't
          # silently exit 0.
          if [ -z "${N_MINUS_1:-}" ]; then
            echo "::warning::no N-1 release resolvable - expected exactly once at the start of a release line; NOT a silent skip"
            exit 0
          fi
          prev_ver="${N_MINUS_1#bundle-v}"
          curl --proto '=https' -fsSL -o n1.tar.gz \
            "https://github.com/${{ github.repository }}/releases/download/${N_MINUS_1}/modulo-${prev_ver}-linux-amd64.tar.gz"
          # Install N-1, seed identifiable data, upgrade to TAG, prove data intact.
          bash scripts/install.sh --from-file n1.tar.gz
          modulo start --detach
          modulo users add n1-seed@modulo.run --admin --password "${ADMIN_PASSWORD}"
          modulo backup --data-dir "${DATA_DIR}" --output-dir canary-backup
          modulo doctor --json | tee canary-doctor.json > /dev/null
          modulo stop || true
          bash scripts/install.sh --from-file "${TARBALL}" --skip-backup
          modulo start --detach
          modulo doctor --json | tee canary-doctor2.json > /dev/null
          modulo users list --data-dir "${DATA_DIR}" | grep -q 'n1-seed@modulo.run' \
            || { echo "::error::seeded N-1 data did not survive the upgrade"; exit 1; }
          modulo stop
          echo "N-1 upgrade leg OK (data intact + doctor green)"

  canary-housekeeping:
    name: Canary tracking issue (dedupe + auto-close)
    needs: canary
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or append to the per-day tracking issue on failure
        if: needs.canary.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          issue_key="[canary] $(date -u +%F)"
          existing="$(gh issue list --search "in:title \"${issue_key}\"" --state open --json number --jq '.[0].number // ""')"
          link="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ github.run_id }}"
          body="Nightly native canary FAILED (tag: ${CANARY_TAG:-unknown}). Latest failing run: ${link}"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
            echo "appended to tracking issue #${existing} (dedupe key: ${issue_key})"
          else
            gh issue create --title "${issue_key} failed" --body "${body}" --label "bug"
            echo "opened tracking issue (dedupe key: ${issue_key})"
          fi

      - name: Auto-close the tracking issue on green
        if: needs.canary.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue_key="[canary] $(date -u +%F)"
          existing="$(gh issue list --search "in:title \"${issue_key}\"" --state open --json number --jq '.[0].number // ""')"
          if [ -n "${existing}" ]; then
            gh issue close "${existing}" --comment "green canary - auto-closed on pass"
          else
            echo "nothing to auto-close"
          fi

  rollback-verify:
    name: Rollback playbook verification
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Assert the rollback target release exists and its artifact is servable
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.rollback_version }}
        run: |
          set -euo pipefail
          case "${TARGET}" in
            bundle-v*) ;;
            *) echo "::error::rollback_version must look like bundle-vX.Y.Z; got '${TARGET}'"; exit 1 ;;
          esac
          gh api "repos/${{ github.repository }}/releases/tags/${TARGET}" > /dev/null \
            || { echo "::error::release ${TARGET} not found - refusing to verify a nonexistent rollback target"; exit 1; }
          version="${TARGET#bundle-v}"
          tarball_url="https://github.com/${{ github.repository }}/releases/download/${TARGET}/modulo-${version}-linux-amd64.tar.gz"
          curl --proto '=https' -fsSLI "${tarball_url}" | grep -q '^HTTP/. 200' \
            || { echo "::error::rollback artifact not reachable at ${tarball_url}"; exit 1; }
          echo "rollback target ${TARGET} verified - proceed with the docs/upgrade-process.md rollout actions"
