# PR Conflict Reconciler (FAR-805)
#
# WHY: When a PR becomes mergeable=CONFLICTING against a fast-moving main,
# GitHub cannot build a merge commit, so NO pull_request workflows fire.
# Consequences:
#   - The required sonarcloud-scan job never runs → quality gate freezes on stale analysis.
#   - ci.yml's notify-pr-failure never fires → Branch Fixer is never dispatched → nothing resolves the conflict.
# The PR deadlocks permanently and looks like a "stuck quality gate" (cost a whole session on PR #404).
#
# This cron reconciler detects conflicted open PRs and dispatches the existing
# Branch Fixer to resolve them. It also surfaces manual-delivery conflicts
# (human-driven PRs) without auto-dispatching.
#
# Pattern: mirrors ci.yml notify-pr-failure job's webhook invocation for the Branch Fixer,
# and merge-queue.yml's cron/gh/jq conventions.

name: "Fix: PR Conflict Reconciler"

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  pull-requests: write
  contents: read

concurrency:
  group: pr-conflict-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    name: Detect and reconcile conflicted PRs
    runs-on: ubicloud-standard-2
    steps:
      - name: Checkout (for the shared dispatch script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Find conflicted open PRs
        id: detect
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Fetch open PRs with the fields we need. NOTE: --limit caps at 200;
          # if the repo ever exceeds 200 open PRs this silently truncates and
          # conflicted PRs beyond the cap would go undetected for a cycle. Raise
          # the limit (or page) if modulo's open-PR count approaches this bound.
          #
          # --repo is required on any gh call that infers the repository.
          # Historical context: this job originally had NO actions/checkout
          # step, so there was no git remote for `gh` to infer from and such
          # calls died with `failed to run git: fatal: not a git repository`
          # (all 31 scheduled runs red when the workflow landed). The job now
          # carries a checkout (added only so the dispatch step can call the
          # shared scripts/dispatch_with_retry.sh), but the explicit
          # /repos/farnalabs/modulo/... REST paths are kept — they work
          # identically and do not depend on what the checkout happens to
          # place in the working tree. `gh pr list` here and `gh pr view` /
          # `gh pr comment` below must all pass --repo — without it on the
          # latter two the marker dedup reads "0" and every cycle re-posts
          # the manual-delivery note.
          #
          # The `|| GH_RC=$?` is a second safeguard: under `set -e` a bare
          # non-zero `gh pr list` aborts the step before the fail-open guard
          # below can run, so a transient API/token failure would be a hard red
          # instead of the documented FAR-528 graceful skip. Capture the exit
          # code instead of letting `set -e` fire.
          GH_RC=0
          gh pr list --repo farnalabs/modulo --state open --limit 200 \
            --json number,headRefName,mergeable,isDraft,labels \
            > /tmp/open_prs.json 2>/tmp/gh_pr_list_stderr.txt || GH_RC=$?

          # Validate the API call succeeded (fail open loudly, FAR-528)
          if [ "$GH_RC" -ne 0 ] || [ ! -s /tmp/open_prs.json ]; then
            ERR=$(head -c 500 /tmp/gh_pr_list_stderr.txt 2>/dev/null || true)
            echo "::warning::Failed to fetch open PRs from GitHub API (rc=$GH_RC). Reconciler cannot run this cycle.${ERR:+$'\n'}gh pr list stderr: $ERR"
            echo "api_failed=true" >> "${GITHUB_OUTPUT:-/dev/null}"
            exit 0
          fi

          # Split into: conflicting+not-draft+not-cannot-fix, then split by manual-delivery
          # PRs WITHOUT manual-delivery → dispatch (cap 5, newest first)
          # PRs WITH manual-delivery → notify (post comment + warning)
          # PRs with modulo-cannot-fix → skip entirely

          DISPATCH=$(jq '[.[] |
            select(.mergeable == "CONFLICTING") |
            select(.isDraft == false) |
            select([.labels // [] | .[].name] | index("modulo-cannot-fix") | not) |
            select([.labels // [] | .[].name] | index("manual-delivery") | not)
          ] | sort_by(-.number) | .[:5]' /tmp/open_prs.json)

          NOTIFY=$(jq '[.[] |
            select(.mergeable == "CONFLICTING") |
            select(.isDraft == false) |
            select([.labels // [] | .[].name] | index("modulo-cannot-fix") | not) |
            select([.labels // [] | .[].name] | index("manual-delivery"))
          ] | sort_by(-.number)' /tmp/open_prs.json)

          DISPATCH_COUNT=$(echo "$DISPATCH" | jq 'length')
          NOTIFY_COUNT=$(echo "$NOTIFY" | jq 'length')

          echo "dispatch=$DISPATCH_COUNT"
          echo "notify=$NOTIFY_COUNT"
          echo "api_failed=false" >> "${GITHUB_OUTPUT:-/dev/null}"

          # Write to temp files for downstream steps
          echo "$DISPATCH" > /tmp/dispatch_prs.json
          echo "$NOTIFY" > /tmp/notify_prs.json

          {
            echo "## PR Conflict Reconciler"
            echo ""
            echo "| Category | Count |"
            echo "|----------|-------|"
            echo "| Conflicted PRs (dispatch) | $DISPATCH_COUNT |"
            echo "| Conflicted PRs (manual-delivery, notify only) | $NOTIFY_COUNT |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DISPATCH_COUNT" -gt 0 ]; then
            echo "### Dispatching Branch Fixer for:" >> "$GITHUB_STEP_SUMMARY"
            echo "$DISPATCH" | jq -r '.[] | "- PR #" + (.number | tostring) + " (`" + .headRefName + "`)"' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$NOTIFY_COUNT" -gt 0 ]; then
            echo "### Manual-delivery PRs (notify only):" >> "$GITHUB_STEP_SUMMARY"
            echo "$NOTIFY" | jq -r '.[] | "- PR #" + (.number | tostring) + " (`" + .headRefName + "`)"' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$DISPATCH_COUNT" -eq 0 ] && [ "$NOTIFY_COUNT" -eq 0 ]; then
            echo "No conflicted PRs found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dispatch the Branch Fixer
        if: steps.detect.outputs.api_failed == 'false'
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
          DISPATCH_URL: ${{ secrets.MODULO_BRANCH_FIXER_WEBHOOK_URL }}
          DISPATCH_SECRET: ${{ secrets.MODULO_BRANCH_FIXER_HMAC_SECRET }}
          DISPATCH_LABEL: "Modulo Branch Fixer"
        shell: bash
        run: |
          set -euo pipefail

          DISPATCH_COUNT=$(jq 'length' /tmp/dispatch_prs.json)
          if [ "$DISPATCH_COUNT" -eq 0 ]; then
            echo "No PRs to dispatch."
            exit 0
          fi

          DISPATCHED=0
          SKIPPED=0
          FAILED=0

          # Tip of main, the volatile half of the dispatch fingerprint below.
          # The explicit REST path through the existing GH_TOKEN is the cheap
          # equivalent of `git ls-remote` (mirrors the /repos/... paths already
          # used in this step, and does not depend on the checkout's state).
          # Fail-open: if the lookup fails we fall back to a per-run nonce, so
          # the fingerprint can never freeze on a stale value and silently
          # suppress every future dispatch.
          MAIN_SHA=$(gh api repos/farnalabs/modulo/commits/main --jq '.sha' 2>/dev/null || echo "")
          if [ -z "$MAIN_SHA" ]; then
            echo "::warning::Could not resolve the tip of main; falling back to a per-run nonce so the conflict fingerprint still allows dispatch."
            MAIN_SHA="unknown-$(date +%s)"
          fi

          for i in $(seq 0 $((DISPATCH_COUNT - 1))); do
            PR_NUM=$(jq -r ".[$i].number" /tmp/dispatch_prs.json)
            BRANCH=$(jq -r ".[$i].headRefName" /tmp/dispatch_prs.json)

            # Dedup: check if the Branch Fixer was recently active on this PR.
            # The fixer commits as "modulo-branch-fixer" — fetch the PR's recent
            # commits and look for the most recent fixer-authored commit date.
            # This mirrors the committer-name signal used in ci.yml's
            # notify-pr-failure FIX_COUNT calculation.
            # Backstop: the Branch Fixer labels unresolvable PRs
            # "modulo-cannot-fix", which this workflow excludes at the detect
            # step, so re-dispatch is bounded even if the recency check misses.
            FIXER_DATE=$(gh api "/repos/farnalabs/modulo/pulls/${PR_NUM}/commits?per_page=100" \
              --jq '[.[] | select(.commit.committer.name == "modulo-branch-fixer")] | last | .commit.committer.date // empty' \
              2>/dev/null || echo "")
            if [ -n "$FIXER_DATE" ]; then
              FIXER_EPOCH=$(date -d "$FIXER_DATE" +%s 2>/dev/null || echo "0")
              NOW_EPOCH=$(date +%s)
              AGE_MINUTES=$(( (NOW_EPOCH - FIXER_EPOCH) / 60 ))
              if [ "$AGE_MINUTES" -lt 30 ]; then
                echo "Skipping PR #$PR_NUM (Branch Fixer committed ${AGE_MINUTES}m ago — within 30m recency window)"
                SKIPPED=$((SKIPPED + 1))
                continue
              fi
            fi

            # headSha: enables the engine's CI-failure coalescing, which the
            # Branch Fixer's webhook trigger keys on (prNumber, headSha) -
            # exactly what ci.yml's notify-pr-failure already sends. This
            # dispatch path sent no headSha, so it could never coalesce and
            # every 15-minute cycle minted a brand-new full fixer run for an
            # unchanged PR (PR #1773 accumulated 148 runs in a week). With the
            # PR's own head SHA a repeat dispatch for the same commit folds
            # into the run already created for it instead of minting another.
            #
            # The suppressed set is BROADER than byte-identical payloads: the
            # coalesce key carries the PR head SHA but NOT the tip of main, so
            # a re-dispatch after main has advanced (a genuinely different
            # merge to reconcile) is suppressed too - for up to the coalesce
            # window (default 1 hour) - because the PR's head SHA is unchanged.
            # The fingerprint below still varies with main, but the coalesce
            # gate does not read it. Consequence, accepted deliberately (it is
            # the point of this change): the effective retry cadence for a
            # no-commit fixer failure on this path is ~1 hour, not the
            # 30-minute fixer-recency guard above. A new commit changes the
            # head SHA and still dispatches fresh.
            #
            # FAIL OPEN: an unresolvable SHA leaves HEAD_SHA empty and the
            # payload omits the key, so the delivery behaves exactly as it did
            # before (an absent headSha derives no coalesce key) and the
            # dispatch is never blocked or skipped. The explicit REST path is
            # kept from before the job grew a checkout (see the "Find
            # conflicted open PRs" step): it works identically and does not
            # depend on remote inference.
            HEAD_SHA=""
            SHA_RC=0
            HEAD_SHA=$(gh api "/repos/farnalabs/modulo/pulls/${PR_NUM}" --jq '.head.sha' 2>/tmp/pr_head_sha_stderr.txt) || SHA_RC=$?
            if [ "$SHA_RC" -ne 0 ] || [ -z "$HEAD_SHA" ]; then
              ERR=$(head -c 300 /tmp/pr_head_sha_stderr.txt 2>/dev/null | tr '\n' ' ' || true)
              echo "::warning::Could not resolve the head SHA for PR #$PR_NUM (rc=$SHA_RC) — dispatching without headSha, so this delivery will not coalesce.${ERR:+ gh api stderr: $ERR}"
              HEAD_SHA=""
            fi

            # Deterministic dedupe key for this conflict (mirrors ci.yml's
            # notify-pr-failure payload shape). An unchanged tip of main means
            # the SAME merge to reconcile, so an identical repeat collapses to
            # one Branch Fixer run (the fixer dedupes on
            # `{{ input.fingerprint }}`). Once main advances the merge is
            # genuinely different and the fingerprint changes, so the fixer's
            # own dedupe would allow a new run - but the (prNumber, headSha)
            # coalesce gate above can still suppress the dispatch itself for up
            # to its window (see that block). The 30-minute fixer-recency guard
            # above remains the pre-dispatch retry gate.
            FINGERPRINT="conflict|pr:${PR_NUM}|main:${MAIN_SHA}"
            # taskKind marks this as a CONFLICT task so the Branch Fixer selects the
            # conflict task profile (ONE long attempt) rather than the CI-failure
            # retry ladder. Extra payload keys flow through harmlessly; an absent
            # marker keeps the ladder, so older dispatches keep working.
            BODY=$(jq -n \
              --arg branchName "$BRANCH" \
              --argjson prNumber "$PR_NUM" \
              --arg headSha "$HEAD_SHA" \
              --arg failureDescription "PR conflicts with origin/main (mergeable=CONFLICTING). merge origin/main into the branch (a MERGE commit — do NOT rebase or force-push a shared/reviewed branch). Resolve conflicts by reading all three versions (base/ours/theirs) and satisfying both intents. Do NOT re-run the test suites in the sandbox — resolve, commit, and push. The node budget is too small for a full conflict resolution plus a suite run, and the push re-arms the pull_request pipeline, which is the authoritative gate. Push — which re-arms the pull_request pipeline (CI + sonarcloud-scan)." \
              --arg repo "farnalabs/modulo" \
              --arg fingerprint "${FINGERPRINT}" \
              --arg taskKind "conflict" \
              '{branchName: $branchName, prNumber: $prNumber, failureDescription: $failureDescription, repository: $repo, fingerprint: $fingerprint, taskKind: $taskKind}
               + (if $headSha == "" then {} else {headSha: $headSha} end)')

            # One shared retry policy (scripts/dispatch_with_retry.sh):
            # 429 (capacity) and 000/502/503/504 (transient) retry with
            # exponential backoff + jitter, an attempt cap and a wall-clock
            # budget, honouring Retry-After; every other status is terminal.
            # The 400 "Duplicate webhook payload" handled no-op (FAR-1097)
            # and the per-attempt timestamp+HMAC signing (the server enforces
            # a +/-300s replay window on X-Modulo-Timestamp) are the script's
            # defaults, mirroring the inline ladder this replaced. The script
            # exits 1 when the dispatch is never delivered, and it writes
            # machine-readable results (last HTTP status / class / detail /
            # attempt count) to DISPATCH_RESULT_FILE so the durable
            # undelivered-dispatch comment below can cite the real values.
            DISPATCH_RESULT_FILE="/tmp/last_dispatch_result_${PR_NUM}.env"
            rm -f "${DISPATCH_RESULT_FILE}"
            DISPATCH_DELIVERED="false"
            if ! DISPATCH_RESULT_FILE="${DISPATCH_RESULT_FILE}" \
                 DISPATCH_BODY="${BODY}" bash scripts/dispatch_with_retry.sh; then
              # shellcheck disable=SC1090
              source "${DISPATCH_RESULT_FILE}" 2>/dev/null || true
            else
              DISPATCH_DELIVERED="true"
              DISPATCHED=$((DISPATCHED + 1))
            fi

            if [ "$DISPATCH_DELIVERED" = "false" ]; then
              LAST_HTTP="${DISPATCH_LAST_HTTP:-unknown}"
              DETAIL="${DISPATCH_LAST_DETAIL:-unknown}"
              # FAR-1949: an undelivered dispatch must never be SILENT, and it must
              # be attributable to the PR it concerns. On 2026-10-17 the dispatch was
              # refused with HTTP 429 ("Concurrent run limit of 5 reached") and the
              # conflicted PR was left with nothing durable saying the Branch Fixer
              # had never been asked to reconcile it. So: name the PR in the
              # annotation AND leave a durable comment on that PR. FAR-1939 set the
              # "never SILENT on an undelivered dispatch" requirement, but its
              # merge-queue.yml fallback emits only ::error:: + exit 1 (it posts no
              # PR comment); the durable-comment + HTML-marker pattern is mirrored
              # from this workflow's own manual-delivery note in the "Surface
              # manual-delivery conflicts" step below. The retry ladder (cap, budget,
              # backoff) is the SHARED policy now — deliberately the same
              # every other webhook dispatch step in this repo uses.
              echo "::error::Branch Fixer dispatch failed for PR #$PR_NUM (HTTP ${LAST_HTTP}: ${DETAIL}) after retries — this PR was never handed to the fixer."
              # Idempotent: this reconciler runs every 15 minutes, so a persistently
              # failing webhook (e.g. a sustained 429) would otherwise post a fresh
              # comment on every cycle. Mirror the manual-delivery note below: key
              # the note on an HTML marker and skip when it already exists.
              UNDELIVERED_MARKER="<!-- pr-conflict-reconciler:undelivered-dispatch -->"
              EXISTING=$(gh pr view "$PR_NUM" --repo farnalabs/modulo --json comments --jq "[.comments[] | select(.body | contains(\"$UNDELIVERED_MARKER\"))] | length" 2>/dev/null || echo "0")
              if [ "$EXISTING" != "0" ]; then
                echo "::notice::PR #$PR_NUM already carries an undelivered-dispatch note — not reposting."
              else
                UNDELIVERED_BODY="The PR Conflict Reconciler could NOT dispatch the Branch Fixer for this PR: every webhook attempt failed (last HTTP ${LAST_HTTP}: ${DETAIL}). Until the conflict is reconciled this PR stays conflicted against \`origin/main\` (mergeable=CONFLICTING), so no pull_request workflow will run to hand it to the fixer. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} ${UNDELIVERED_MARKER}"
                if gh pr comment "$PR_NUM" --repo farnalabs/modulo --body "$UNDELIVERED_BODY" > /dev/null 2>/tmp/undelivered_comment_stderr.txt; then
                  echo "::notice::PR #$PR_NUM: posted a comment recording that the Branch Fixer was never dispatched."
                else
                  # Name the COMMENT failure separately from the webhook failure: the
                  # reader must not misattribute the comment's stderr/HTTP status as
                  # the reason the dispatch failed.
                  COMMENT_ERR=$(head -c 300 /tmp/undelivered_comment_stderr.txt 2>/dev/null | tr '\n' ' ' || true)
                  echo "::error::PR #$PR_NUM: could not post the undelivered-notification comment either (comment post failed${COMMENT_ERR:+: $COMMENT_ERR}; the dispatch failure was webhook HTTP ${LAST_HTTP}: ${DETAIL}) — this PR has NO durable signal that the Branch Fixer was never asked to reconcile it."
                fi
              fi
              FAILED=$((FAILED + 1))
            fi
          done

          {
            echo "dispatched=$DISPATCHED"
            echo "skipped=$SKIPPED"
            echo "failed=$FAILED"
          } >> "${GITHUB_OUTPUT:-/dev/null}"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} PR(s) could not be dispatched to the Branch Fixer after retries."
            exit 1
          fi

      - name: Surface manual-delivery conflicts
        if: steps.detect.outputs.api_failed == 'false'
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail

          NOTIFY_COUNT=$(jq 'length' /tmp/notify_prs.json)
          if [ "$NOTIFY_COUNT" -eq 0 ]; then
            echo "No manual-delivery PRs to notify."
            exit 0
          fi

          MARKER="<!-- pr-conflict-reconciler:manual-delivery-note -->"

          for i in $(seq 0 $((NOTIFY_COUNT - 1))); do
            PR_NUM=$(jq -r ".[$i].number" /tmp/notify_prs.json)
            BRANCH=$(jq -r ".[$i].headRefName" /tmp/notify_prs.json)

            # Check for existing marker comment (idempotent)
            EXISTING=$(gh pr view "$PR_NUM" --repo farnalabs/modulo --json comments --jq "[.comments[] | select(.body | contains(\"$MARKER\"))] | length" 2>/dev/null || echo "0")
            if [ "$EXISTING" != "0" ]; then
              echo "PR #$PR_NUM already has a manual-delivery conflict note — skipping."
              continue
            fi

            # Post comment
            COMMENT_BODY="${MARKER}
            ## PR Conflict Detected (manual-delivery)

            This PR has a merge conflict with \`origin/main\` (\`mergeable=CONFLICTING\`).

            The **Branch Fixer was NOT dispatched** because this PR carries the \`manual-delivery\` label.

            **Action required:** merge \`origin/main\` into the branch (a MERGE commit — do NOT rebase
            or force-push a shared/reviewed branch), resolve conflicts, and push. This re-arms the
            \`pull_request\` pipeline (CI + sonarcloud-scan)."

            gh pr comment "$PR_NUM" --repo farnalabs/modulo --body "$COMMENT_BODY" 2>/dev/null || {
              echo "::warning::Failed to post manual-delivery conflict comment on PR #$PR_NUM"
            }

            echo "::warning::PR #$PR_NUM (${BRANCH}) has mergeable=CONFLICTING and carries manual-delivery label — requires human intervention."
          done
