name: Multi-Backend Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: sqlite
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/unit/ -m 'not integration' --timeout 60 -q --ignore=tests/unit/connector_hub --ignore=tests/unit/determination --ignore=tests/unit/graph_validator --ignore=tests/unit/hitl_manager --ignore=tests/unit/trigger_engine
        env:
          SECRET_KEY: "ci-secret-key-not-for-production"
          FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          MODULO_DB: sqlite

  mariadb:
    name: mariadb
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Start MariaDB
        shell: pwsh
        run: |
          docker rm -f modulo-mariadb 2>$null
          docker run -d --name modulo-mariadb `
            -e MARIADB_ROOT_PASSWORD=modulo `
            -e MARIADB_DATABASE=modulo `
            -e MARIADB_USER=modulo `
            -e MARIADB_PASSWORD=modulo `
            -p 5435:3306 `
            mariadb:11.4
          Write-Host "Waiting for MariaDB..."
          for ($i=0; $i -lt 30; $i++) {
            $ok = docker exec modulo-mariadb mysqladmin ping -uroot -pmodulo 2>$null
            if ($?) { Write-Host "MariaDB ready"; break }
            Start-Sleep -Seconds 2
          }
      - name: Stop MariaDB
        if: always()
        shell: pwsh
        run: docker rm -f modulo-mariadb 2>$null
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/unit/ -m 'not integration' --timeout 60 -q --ignore=tests/unit/connector_hub --ignore=tests/unit/determination --ignore=tests/unit/graph_validator --ignore=tests/unit/hitl_manager --ignore=tests/unit/trigger_engine
        env:
          SECRET_KEY: "ci-secret-key-not-for-production"
          FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="
          DATABASE_URL: "mysql+asyncmy://modulo:modulo@localhost:5435/modulo"
          MODULO_DB: mariadb
