name: Multi-Backend Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multi-backend:
    name: ${{ matrix.backend }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, mariadb]
        include:
          - backend: sqlite
            database_url: "sqlite+aiosqlite:///./test.db"
            modulo_db: sqlite
            pytest_marker: "not integration"
          - backend: mariadb
            database_url: "mysql+asyncmy://modulo:modulo@localhost:5435/modulo"
            modulo_db: mariadb
            pytest_marker: "not integration"
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: modulo
          MARIADB_DATABASE: modulo
          MARIADB_USER: modulo
          MARIADB_PASSWORD: modulo
        ports:
          - 5435:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/unit/ -m '${{ matrix.pytest_marker }}' --timeout 60 -q --ignore=tests/unit/connector_hub --ignore=tests/unit/determination --ignore=tests/unit/graph_validator --ignore=tests/unit/hitl_manager --ignore=tests/unit/trigger_engine
        env:
          SECRET_KEY: "ci-secret-key-not-for-production"
          FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="
          DATABASE_URL: ${{ matrix.database_url }}
          MODULO_DB: ${{ matrix.modulo_db }}
