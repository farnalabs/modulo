name: Docker Build and Scan

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-scan-publish:
    name: Build, scan, and conditionally publish
    runs-on: ubicloud-standard-4
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/anomalyco/modulo-backend
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/anomalyco/modulo-frontend
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build backend image once
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          push: false
          tags: modulo-backend:${{ github.sha }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image once
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: modulo-frontend-dev:${{ github.sha }}
          cache-from: type=gha,scope=frontend-dev
          cache-to: type=gha,mode=max,scope=frontend-dev

      - name: Build frontend production image once
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          load: true
          push: false
          tags: modulo-frontend:${{ github.sha }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan backend image with Trivy
        id: scan-backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: modulo-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL
          exit-code: 1
        continue-on-error: true

      - name: Scan frontend development image with Trivy
        id: scan-frontend-dev
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: modulo-frontend-dev:${{ github.sha }}
          format: sarif
          output: trivy-frontend-dev.sarif
          severity: CRITICAL
          exit-code: 1
        continue-on-error: true

      - name: Scan frontend production image with Trivy
        id: scan-frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: modulo-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL
          exit-code: 1
        continue-on-error: true

      - name: Upload backend SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: backend

      - name: Upload frontend SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: frontend

      - name: Upload frontend development SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-dev.sarif
          category: frontend-development

      - name: Enforce vulnerability scan results
        if: steps.scan-backend.outcome == 'failure' || steps.scan-frontend-dev.outcome == 'failure' || steps.scan-frontend.outcome == 'failure'
        shell: bash
        run: |
          Write-Host "::error::One or more container images contain critical vulnerabilities."
          exit 1

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned images to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          BACKEND_TAGS: ${{ steps.meta-backend.outputs.tags }}
          FRONTEND_TAGS: ${{ steps.meta-frontend.outputs.tags }}
        run: |
          $ErrorActionPreference = 'Stop'
          $images = @(
            @{ Local = 'modulo-backend:${{ github.sha }}'; Tags = $env:BACKEND_TAGS },
            @{ Local = 'modulo-frontend:${{ github.sha }}'; Tags = $env:FRONTEND_TAGS }
          )
          foreach ($image in $images) {
            $tags = $image.Tags -split "`r?`n" | Where-Object { $_ }
            if ($tags.Count -eq 0) { throw "No publish tags generated for $($image.Local)" }
            foreach ($tag in $tags) {
              docker tag $image.Local $tag
              if ($LASTEXITCODE -ne 0) { throw "Failed to tag $($image.Local) as $tag" }
              docker push $tag
              if ($LASTEXITCODE -ne 0) { throw "Failed to push $tag" }
            }
          }
