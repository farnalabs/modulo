# Publish backend and frontend container images to GHCR.
#
# This workflow builds and publishes the Docker images that the Helm chart
# (deploy/helm/modulo) references. Before this existed, the :latest images
# on GHCR were stale (from 2026-07-06) and did not contain the `modulo`
# Python package at all — `import modulo` raised ModuleNotFoundError and the
# backend crash-looped on any cluster. The smoke checks below exist to
# prevent that regression from shipping again.

name: "Publish: Container images to GHCR"

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Backend image
  # ---------------------------------------------------------------------------
  backend:
    name: Build & publish backend
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            # Always tag with the short git SHA for traceability.
            type=sha,prefix=
            # Tag :latest only on pushes to main — never on PRs or other branches.
            type=raw,value=latest,enable={{is_default_branch}}
            # On tag pushes (v*), tag with the version (e.g. v1.2.3 → 1.2.3).
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # -----------------------------------------------------------------
      # Smoke check: verify the published image actually contains the
      # `modulo` Python package. The 2026-07-06 :latest shipped without it,
      # causing crash-loops on every cluster. This check must never be
      # removed — it is the regression gate for that specific failure.
      # -----------------------------------------------------------------
      - name: Smoke check — import modulo
        shell: bash
        run: |
          IMAGE="${{ steps.meta.outputs.tags | head -n1 }}"
          echo "Checking image: $IMAGE"
          docker run --rm --entrypoint python "$IMAGE" -c "import modulo; print(modulo.__file__)"

  # ---------------------------------------------------------------------------
  # Frontend image
  # ---------------------------------------------------------------------------
  frontend:
    name: Build & publish frontend
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # -----------------------------------------------------------------
      # Smoke check: verify the frontend image starts and nginx config is
      # valid. Complements the backend import check above.
      # -----------------------------------------------------------------
      - name: Smoke check — nginx -t
        shell: bash
        run: |
          IMAGE="${{ steps.meta.outputs.tags | head -n1 }}"
          echo "Checking image: $IMAGE"
          docker run --rm --entrypoint nginx "$IMAGE" -t
