# Publish the container images that Modulo deployments consume to GHCR.
#
# Two deployment paths are served here:
#   * The self-hosted compose stack (deploy/compose/docker-compose.prod.yml)
#     pulls the all-in-one image `ghcr.io/farnalabs/modulo:${TAG:-latest}`,
#     which bundles the backend + frontend + nginx + supervisor
#     (deploy/docker/Dockerfile.all-in-one). This is the image the docs
#     reference (docs/deployment-security.md, docs/upgrade-process.md,
#     docs/public-launch-checklist.md).
#   * The Helm chart (FAR-1052, landing in a stacked PR) consumes the split
#     `ghcr.io/farnalabs/modulo/backend` and `/frontend` images.
#
# Before this existed the :latest image on GHCR was stale (from 2026-07-06)
# and did not contain the `modulo` Python package at all — `import modulo`
# raised ModuleNotFoundError and the backend crash-looped on any cluster.
# The smoke checks below exist to prevent that regression from shipping
# again.

name: "Publish: Container images to GHCR"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_publication:
        description: 'Set true only for the promote-owned stable publication'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # All-in-one image — the artifact the self-hosted compose stack pulls as
  # `ghcr.io/farnalabs/modulo:${TAG:-latest}`.
  # ---------------------------------------------------------------------------
  all-in-one:
    name: Build & publish all-in-one
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release freeze marker
        id: release_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
           STATUS="$(curl -sS -o /tmp/release-freeze.json -w '%{http_code}' \
             -H "Authorization: Bearer ${GH_TOKEN}" \
             -H 'Accept: application/vnd.github+json' \
             "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/release-freeze")"
           case "$STATUS" in
             200)
               FREEZE_SHA="$(jq -r '.object.sha // empty' /tmp/release-freeze.json)"
               if [ -z "$FREEZE_SHA" ]; then
                 echo "::error::release-freeze lookup returned no SHA; refusing stable publication."
                 exit 1
               fi
               echo "allow_latest=false" >> "$GITHUB_OUTPUT"
               echo "Release freeze is active at ${FREEZE_SHA}; this main push may publish only its immutable SHA tag, never stable latest."
               ;;
             404)
               HOLD_STATUS="$(curl -sS -o /tmp/release-publication-hold.json -w '%{http_code}' \
                 -H "Authorization: Bearer ${GH_TOKEN}" \
                 -H 'Accept: application/vnd.github+json' \
                 "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/release-publication-hold")"
               case "$HOLD_STATUS" in
                 200)
                   HOLD_SHA="$(jq -r '.object.sha // empty' /tmp/release-publication-hold.json)"
                   if [ -z "$HOLD_SHA" ]; then
                     echo "::error::release-publication-hold lookup returned no SHA; refusing stable publication."
                     exit 1
                   fi
                   echo "allow_latest=false" >> "$GITHUB_OUTPUT"
                   echo "Release publication hold is active at ${HOLD_SHA}; this main push may publish only its immutable SHA tag, never stable latest."
                   ;;
                 404)
                   echo "allow_latest=true" >> "$GITHUB_OUTPUT"
                   echo "No release freeze or publication hold marker; ordinary main publication may update latest."
                   ;;
                 *)
                   echo "::error::release-publication-hold lookup failed with HTTP ${HOLD_STATUS}; refusing stable publication rather than guessing."
                   cat /tmp/release-publication-hold.json
                   exit 1
                   ;;
               esac
               ;;
             *)
               echo "::error::release-freeze lookup failed with HTTP ${STATUS}; refusing stable publication rather than guessing."
               cat /tmp/release-freeze.json
               exit 1
               ;;
           esac

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Always tag with the short git SHA for traceability.
            type=sha,prefix=
            # Tag :latest on main branch pushes so :latest always means the
            # newest main build. Versioned tags are published by
            # release-unified.yml (cut/recut), not here.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && steps.release_gate.outputs.allow_latest == 'true' && inputs.release_publication != true }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push all-in-one image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile.all-in-one
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=all-in-one
          cache-to: type=gha,mode=max,scope=all-in-one

      # -----------------------------------------------------------------
      # Smoke checks: the all-in-one image must (a) contain the `modulo`
      # Python package and (b) have a valid nginx config. The 2026-07-06
      # :latest shipped without the package, causing crash-loops on every
      # cluster. These checks must never be removed — they are the
      # regression gate for that specific failure.
      # -----------------------------------------------------------------
      - name: Smoke check — import modulo
        shell: bash
        run: |
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "Checking image: $IMAGE"
          docker run --rm --entrypoint python "$IMAGE" -c "import modulo; print(modulo.__file__)"

      - name: Smoke check — nginx -t
        shell: bash
        run: |
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "Checking image: $IMAGE"
          docker run --rm --entrypoint nginx "$IMAGE" -t

  # ---------------------------------------------------------------------------
  # Backend image — consumed by the Helm chart (FAR-1052, stacked PR).
  # ---------------------------------------------------------------------------
  backend:
    name: Build & publish backend
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release freeze marker
        id: release_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
           STATUS="$(curl -sS -o /tmp/release-freeze.json -w '%{http_code}' \
             -H "Authorization: Bearer ${GH_TOKEN}" \
             -H 'Accept: application/vnd.github+json' \
             "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/release-freeze")"
           case "$STATUS" in
             200)
               FREEZE_SHA="$(jq -r '.object.sha // empty' /tmp/release-freeze.json)"
               if [ -z "$FREEZE_SHA" ]; then
                 echo "::error::release-freeze lookup returned no SHA; refusing stable publication."
                 exit 1
               fi
               echo "allow_latest=false" >> "$GITHUB_OUTPUT"
               echo "Release freeze is active at ${FREEZE_SHA}; this main push may publish only its immutable SHA tag, never stable latest."
               ;;
             404)
               HOLD_STATUS="$(curl -sS -o /tmp/release-publication-hold.json -w '%{http_code}' \
                 -H "Authorization: Bearer ${GH_TOKEN}" \
                 -H 'Accept: application/vnd.github+json' \
                 "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/release-publication-hold")"
               case "$HOLD_STATUS" in
                 200)
                   HOLD_SHA="$(jq -r '.object.sha // empty' /tmp/release-publication-hold.json)"
                   if [ -z "$HOLD_SHA" ]; then
                     echo "::error::release-publication-hold lookup returned no SHA; refusing stable publication."
                     exit 1
                   fi
                   echo "allow_latest=false" >> "$GITHUB_OUTPUT"
                   echo "Release publication hold is active at ${HOLD_SHA}; this main push may publish only its immutable SHA tag, never stable latest."
                   ;;
                 404)
                   echo "allow_latest=true" >> "$GITHUB_OUTPUT"
                   echo "No release freeze or publication hold marker; ordinary main publication may update latest."
                   ;;
                 *)
                   echo "::error::release-publication-hold lookup failed with HTTP ${HOLD_STATUS}; refusing stable publication rather than guessing."
                   cat /tmp/release-publication-hold.json
                   exit 1
                   ;;
               esac
               ;;
             *)
               echo "::error::release-freeze lookup failed with HTTP ${STATUS}; refusing stable publication rather than guessing."
               cat /tmp/release-freeze.json
               exit 1
               ;;
           esac

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && steps.release_gate.outputs.allow_latest == 'true' && inputs.release_publication != true }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # -----------------------------------------------------------------
      # Smoke check: verify the published image actually contains the
      # `modulo` Python package. The 2026-07-06 :latest shipped without it,
      # causing crash-loops on every cluster. This check must never be
      # removed — it is the regression gate for that specific failure.
      # -----------------------------------------------------------------
      - name: Smoke check — import modulo
        shell: bash
        run: |
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "Checking image: $IMAGE"
          docker run --rm --entrypoint python "$IMAGE" -c "import modulo; print(modulo.__file__)"

  # ---------------------------------------------------------------------------
  # Frontend image — consumed by the Helm chart (FAR-1052, stacked PR).
  # ---------------------------------------------------------------------------
  frontend:
    name: Build & publish frontend
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release freeze marker
        id: release_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
           STATUS="$(curl -sS -o /tmp/release-freeze.json -w '%{http_code}' \
             -H "Authorization: Bearer ${GH_TOKEN}" \
             -H 'Accept: application/vnd.github+json' \
             "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/release-freeze")"
           case "$STATUS" in
             200)
               FREEZE_SHA="$(jq -r '.object.sha // empty' /tmp/release-freeze.json)"
               if [ -z "$FREEZE_SHA" ]; then
                 echo "::error::release-freeze lookup returned no SHA; refusing stable publication."
                 exit 1
               fi
               echo "allow_latest=false" >> "$GITHUB_OUTPUT"
               echo "Release freeze is active at ${FREEZE_SHA}; this main push may publish only its immutable SHA tag, never stable latest."
               ;;
             404)
               HOLD_STATUS="$(curl -sS -o /tmp/release-publication-hold.json -w '%{http_code}' \
                 -H "Authorization: Bearer ${GH_TOKEN}" \
                 -H 'Accept: application/vnd.github+json' \
                 "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/release-publication-hold")"
               case "$HOLD_STATUS" in
                 200)
                   HOLD_SHA="$(jq -r '.object.sha // empty' /tmp/release-publication-hold.json)"
                   if [ -z "$HOLD_SHA" ]; then
                     echo "::error::release-publication-hold lookup returned no SHA; refusing stable publication."
                     exit 1
                   fi
                   echo "allow_latest=false" >> "$GITHUB_OUTPUT"
                   echo "Release publication hold is active at ${HOLD_SHA}; this main push may publish only its immutable SHA tag, never stable latest."
                   ;;
                 404)
                   echo "allow_latest=true" >> "$GITHUB_OUTPUT"
                   echo "No release freeze or publication hold marker; ordinary main publication may update latest."
                   ;;
                 *)
                   echo "::error::release-publication-hold lookup failed with HTTP ${HOLD_STATUS}; refusing stable publication rather than guessing."
                   cat /tmp/release-publication-hold.json
                   exit 1
                   ;;
               esac
               ;;
             *)
               echo "::error::release-freeze lookup failed with HTTP ${STATUS}; refusing stable publication rather than guessing."
               cat /tmp/release-freeze.json
               exit 1
               ;;
           esac

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && steps.release_gate.outputs.allow_latest == 'true' && inputs.release_publication != true }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # -----------------------------------------------------------------
      # Smoke check: verify the frontend image starts and nginx config is
      # valid. Complements the backend import check above.
      #
      # The baked-in config proxies to http://backend:8000 (see
      # frontend/Dockerfile.prod). nginx resolves upstream hostnames at
      # config-test time, so running `nginx -t` with no compose network
      # fails with `host not found in upstream "backend"` even though the
      # config itself is valid. --add-host gives the name a resolvable
      # address so the syntax/config test can run standalone.
      # -----------------------------------------------------------------
      - name: Smoke check — nginx -t
        shell: bash
        run: |
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "Checking image: $IMAGE"
          docker run --rm --add-host backend:127.0.0.1 --entrypoint nginx "$IMAGE" -t
