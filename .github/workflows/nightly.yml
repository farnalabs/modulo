name: Nightly CI Suite

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
  FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="

jobs:
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubicloud-standard-4
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run unit tests with coverage
        run: uv run --no-sync pytest tests/unit/ --tb=short -q --timeout=120 --cov=src/modulo --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: backend/coverage.xml

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubicloud-standard-4
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Start Postgres
        shell: bash
        run: |
          $ErrorActionPreference = 'Continue'
          docker rm -f modulo-nightly-pg 2>$null
          docker run -d --name modulo-nightly-pg `
            -e POSTGRES_USER=modulo_test `
            -e POSTGRES_PASSWORD=modulo_test `
            -e POSTGRES_DB=modulo_test `
            -p 5433:5432 `
            postgres:16-alpine
          Write-Host "Waiting for Postgres..."
          for ($i=0; $i -lt 60; $i++) {
            $ok = docker exec modulo-nightly-pg pg_isready -U modulo_test 2>$null
            if ($?) { Write-Host "Postgres ready"; break }
            Start-Sleep -Seconds 2
          }
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Run integration tests
        working-directory: backend
        run: uv run --no-sync pytest tests/integration/ -m integration -n 2 --cov=src/modulo --cov-report=xml -q
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo_test:modulo_test@localhost:5433/modulo_test"
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration
          path: backend/coverage.xml
      - name: Stop Postgres
        if: always()
        shell: bash
        run: |
          $ErrorActionPreference = 'Continue'
          docker rm -f modulo-nightly-pg 2>$null

  bdd-e2e:
    name: BDD / E2E Tests
    runs-on: ubicloud-standard-4
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Start Postgres
        shell: bash
        run: |
          $ErrorActionPreference = 'Continue'
          docker rm -f modulo-nightly-bdd-pg 2>$null
          docker run -d --name modulo-nightly-bdd-pg `
            -e POSTGRES_USER=modulo `
            -e POSTGRES_PASSWORD=modulo `
            -e POSTGRES_DB=modulo `
            -p 5432:5432 `
            postgres:16-alpine
          Write-Host "Waiting for Postgres..."
          for ($i=0; $i -lt 60; $i++) {
            $ok = docker exec modulo-nightly-bdd-pg pg_isready -U modulo 2>$null
            if ($?) { Write-Host "Postgres ready"; break }
            Start-Sleep -Seconds 2
          }
      - name: Start Redis
        shell: bash
        run: |
          $ErrorActionPreference = 'Continue'
          docker rm -f modulo-nightly-bdd-redis 2>$null
          docker run -d --name modulo-nightly-bdd-redis `
            -p 6379:6379 `
            redis:7-alpine
          Write-Host "Waiting for Redis..."
          for ($i=0; $i -lt 30; $i++) {
            $ok = docker exec modulo-nightly-bdd-redis redis-cli ping 2>$null
            if ($?) { Write-Host "Redis ready"; break }
            Start-Sleep -Seconds 2
          }
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Install Playwright browsers
        working-directory: backend
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Pre-create alembic_version table
        shell: bash
        run: |
          docker exec modulo-nightly-bdd-pg psql -U modulo -d modulo -c "CREATE TABLE IF NOT EXISTS alembic_version (version_num VARCHAR(255) NOT NULL PRIMARY KEY);"
      - name: Run migrations
        working-directory: backend
        run: uv run --no-sync alembic upgrade heads
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo:modulo@localhost:5432/modulo"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start backend
        working-directory: backend
        shell: bash
        run: nohup uv run --no-sync uvicorn modulo.api.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo:modulo@localhost:5432/modulo"
          MODULO_PUBLIC_URL: "http://localhost:8000"
          MODULO_USERS: "admin:admin"
          CORS_ORIGINS: "http://localhost:4173"
          MODULO_PLUGIN_DISCOVERY: "false"
          REDIS_URL: "redis://localhost:6379/0"
      - name: Serve frontend
        working-directory: frontend
        shell: bash
        run: nohup npm run preview -- --port 4173 > /dev/null 2>&1 &
      - name: Wait for healthz
        shell: bash
        run: |
          for ($i=0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:8000/healthz" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { Write-Host "Backend healthy after ${i}s"; exit 0 }
            } catch {}
            Start-Sleep -Seconds 2
          }
          Write-Host "=== Backend log ==="
          Get-Content "$env:GITHUB_WORKSPACE/backend/backend.log" -TotalCount 100 -ErrorAction SilentlyContinue
          Write-Host "=== Process check ==="
          Get-Process -Name "uv" -ErrorAction SilentlyContinue | Format-Table Id, ProcessName
          exit 1
      - name: Wait for frontend
        shell: bash
        run: npx wait-on http://localhost:4173 --timeout 30000
      - name: Run BDD tests
        working-directory: backend
        run: uv run --no-sync pytest tests/bdd/ -m e2e --base-url http://localhost:4173 -q
        env:
          DATABASE_URL: "postgresql+asyncpg://modulo:modulo@localhost:5432/modulo"
      - name: Cleanup containers
        if: always()
        shell: bash
        run: |
          $ErrorActionPreference = 'Continue'
          docker rm -f modulo-nightly-bdd-pg 2>$null
          docker rm -f modulo-nightly-bdd-redis 2>$null

  staging-e2e:
    name: Staging E2E (Smoke + WCAG + Regression)
    runs-on: ubicloud-standard-4
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wait for staging health
        shell: bash
        timeout-minutes: 5
        run: |
          Write-Host "Waiting for staging.modulo.run ..."
          for ($i=0; $i -lt 60; $i++) {
            try {
              $r = curl.exe -s -f "https://staging.modulo.run/healthz" 2>$null
              if ($LASTEXITCODE -eq 0) { Write-Host "Staging ready after ${i}s"; exit 0 }
            } catch {}
            Start-Sleep -Seconds 5
          }
          exit 1
      - name: Install frontend deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Run @smoke Playwright tests against staging
        id: smoke-tests
        run: npm run test:e2e:smoke -- --reporter=line --reporter=junit --output=test-results/smoke
        timeout-minutes: 10
        env:
          E2E_TARGET: staging
          E2E_NO_WEBSERVER: "true"
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/smoke-junit.xml
        continue-on-error: true
      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-smoke
          path: |
            frontend/test-results/smoke/
            frontend/test-results/smoke-junit.xml
      - name: Run WCAG audit on staging
        id: wcag-tests
        run: npx playwright test staging-wcag --output=test-results/wcag
        env:
          E2E_TARGET: staging
          E2E_NO_WEBSERVER: "true"
        continue-on-error: true
      - name: Upload WCAG test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-staging-wcag
          path: frontend/test-results/wcag/
      - name: Run Playwright E2E regression suite against staging
        id: regression-tests
        run: npm run test:e2e:staging -- --reporter=line --reporter=junit --output=test-results/regression
        timeout-minutes: 30
        env:
          E2E_TARGET: staging
          E2E_NO_WEBSERVER: "true"
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/regression-junit.xml
        continue-on-error: true
      - name: Upload regression test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-regression
          path: |
            frontend/test-results/regression/
            frontend/test-results/regression-junit.xml
      - name: Final cleanup
        if: always()
        shell: bash
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item -Path "$env:TEMP\ms-playwright" -Recurse -Force -ErrorAction SilentlyContinue
      - name: Fail job on test failure
        if: steps.smoke-tests.outcome == 'failure' || steps.wcag-tests.outcome == 'failure' || steps.regression-tests.outcome == 'failure'
        shell: bash
        run: |
          Write-Host "::error::One or more staging suites failed. Check the uploaded artifacts for details."
          exit 1

  schemathesis:
    name: Schemathesis API Fuzz
    runs-on: ubicloud-standard-4
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: uv sync --frozen
      - name: Run Schemathesis tests
        run: uv run --no-sync pytest tests/integration/test_schemathesis.py -x --timeout=120

  frontend:
    name: Frontend Checks
    runs-on: ubicloud-standard-4
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: WCAG contrast
        run: npx playwright test wcag-contrast
        env:
          CI: "true"
      - name: npm audit
        run: npm audit

  security-audit:
    name: Security Audit
    runs-on: ubicloud-standard-4
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        shell: bash
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/gitleaks/gitleaks/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "windows.*x64" }
          if (-not $asset) { throw "No Windows x64 asset found in latest release" }
          $zip = "$env:TEMP\gitleaks.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\gitleaks" -Force
          $exe = Get-ChildItem -Path "$env:TEMP\gitleaks" -Recurse -Filter "gitleaks.exe" | Select-Object -First 1
          if (-not $exe) { throw "gitleaks.exe not found in archive" }
          $dir = $exe.DirectoryName
          echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run gitleaks
        shell: bash
        run: gitleaks detect --no-git --source . --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: pip-audit
        working-directory: backend
        run: uv run --no-sync pip-audit

  product-map:
    name: Product Map Validation
    runs-on: ubicloud-standard-4
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Validate product map graph
        shell: bash
        run: |
          & tools\graph-validate.ps1 -CI

  manifest-validate:
    name: Manifest Validation
    runs-on: ubicloud-standard-4
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifest.yaml
        shell: bash
        run: |
          & tools\validate-manifest.ps1 -CI

  report:
    name: Nightly Report
    if: always()
    needs:
      - backend-unit
      - backend-integration
      - bdd-e2e
      - staging-e2e
      - schemathesis
      - frontend
      - security-audit
      - product-map
      - manifest-validate
    runs-on: ubicloud-standard-4
    steps:
      - name: Collect job outcomes
        shell: bash
        run: |
          $results = @(
            @{ Job = "Backend Unit Tests";       Status = "${{ needs.backend-unit.result }}" }
            @{ Job = "Backend Integration Tests"; Status = "${{ needs.backend-integration.result }}" }
            @{ Job = "BDD / E2E Tests";           Status = "${{ needs.bdd-e2e.result }}" }
            @{ Job = "Staging E2E";               Status = "${{ needs.staging-e2e.result }}" }
            @{ Job = "Schemathesis API Fuzz";     Status = "${{ needs.schemathesis.result }}" }
            @{ Job = "Frontend Checks";           Status = "${{ needs.frontend.result }}" }
            @{ Job = "Security Audit";            Status = "${{ needs.security-audit.result }}" }
            @{ Job = "Product Map Validation";    Status = "${{ needs.product-map.result }}" }
            @{ Job = "Manifest Validation";       Status = "${{ needs.manifest-validate.result }}" }
          )

          $failed = $results | Where-Object { $_.Status -ne "success" }
          $passed = $results | Where-Object { $_.Status -eq "success" }

          Write-Host "=== Nightly CI Suite Report ==="
          Write-Host ""
          Write-Host "Passed: $($passed.Count) / $($results.Count)"
          Write-Host ""

          if ($failed.Count -gt 0) {
            Write-Host "::warning::FAILED jobs:"
            foreach ($f in $failed) {
              Write-Host "::warning::  - $($f.Job): $($f.Status)"
            }
            Write-Host ""
            Write-Host "::error::One or more nightly suites failed. Check individual job artifacts for details."
            exit 1
          } else {
            Write-Host "All jobs passed successfully!"
          }

      - name: Upload consolidated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: |
            coverage-unit
            coverage-integration
