name: "K8s conformance (kind + managed)"

# Kubernetes conformance gate - FAR-1053.
#
# Three legs, one workflow (every `run` step carries an explicit
# timeout-minutes; `uses:` steps are bounded by the job-level timeout; NO
# continue-on-error anywhere - a failing leg must fail):
#
#   1. kind (pull_request + push to main, path-filtered; workflow_dispatch
#      job=kind): creates a throwaway kind cluster, runs the
#      runtime-provider conformance suite (backend/tests/conformance/,
#      marker `runtime_provider_conformance`) against it, and ALWAYS deletes
#      the cluster afterwards (if: always()). The suite includes the negative
#      suite: a deliberately broken adapter must FAIL, and a
#      kill-before-collect must be detected rather than reported as a
#      synthetic success. It also lints the Helm chart (helm lint
#      deploy/helm/modulo) - since FAR-1558 the trigger paths and the
#      step-level gate both cover deploy/helm/**, and a chart-only change
#      lints WITHOUT creating the cluster (the `chart` output gates the helm
#      install + lint; the cluster steps stay on `changed`). A green
#      chart-only run does NOT stamp the "green run" summary below - that
#      stamp asserts the conformance suite ran.
#
#   2. managed (weekly schedule Monday 04:00 UTC; workflow_dispatch
#      job=managed): rotates ONE of EKS/AKS/GKE per ISO week so all three
#      cycle over three weeks, runs the same suite against that cluster.
#
#      *** NEEDS-HUMAN - THE CLOUD SECRETS ARE NOT YET PROVISIONED ***
#      This leg requires three repository secrets, each holding the RAW
#      kubeconfig YAML of a dedicated conformance cluster:
#        - K8S_CONFORMANCE_EKS_KUBECONFIG
#        - K8S_CONFORMANCE_AKS_KUBECONFIG
#        - K8S_CONFORMANCE_GKE_KUBECONFIG
#      The kubeconfig's user must be able to create/delete namespaces and
#      use pods/exec and pods/log (cluster-conformance RBAC, not readonly).
#      Until a secret exists this leg FAILS LOUDLY with that exact message -
#      never a silent skip: no green run means that substrate is NOT claimed
#      conformant. See docs/deployment/k8s-conformance-parity.md.
#
#   3. staleness (daily schedule 05:17 UTC; workflow_dispatch
#      job=staleness): last-green visibility on the deploy-staleness-check
#      pattern. It publishes the date of the last green run (and the last
#      scheduled run) to the step summary and FAILS when the gate goes dark
#      (never green, last green older than the grace window, or the weekly
#      cron stops producing runs), so a dropped cron or a permanently red
#      suite is visible instead of silent.
#
#      FAR-1620: "green" here means the conformance SUITE ran and passed,
#      not merely that the workflow run concluded successfully. The kind
#      job's suite steps are path-gated (`steps.detect.outputs.changed`), so
#      a docs-only push to main or a chart-only PR starts this workflow,
#      SKIPS the suite step, and still completes with conclusion=success -
#      refreshing last-green while the suite is actually dark. The staleness
#      job therefore inspects each candidate run's JOB STEPS via the Actions
#      API and counts a run as green only when a step named "Run the
#      runtime-provider conformance suite" has conclusion=success. A
#      path-skipped success never refreshes the staleness clock; a jobs-API
#      read failure is never counted as fresh either (it warns loudly, and
#      fails the cycle when nothing could be verified). It pages the run
#      history back past the widest grace window (measured cadence ~23
#      runs/day would otherwise shrink the 28-day grace to a ~4-day view),
#      with a bounded per-cycle verification budget so a long-dark scan
#      cannot blow the step timeout.
#
# Claim discipline (docs/deployment/k8s-conformance-parity.md): a substrate
# is claimed conformant ONLY while its most recent conformance run is green.
# A red run withdraws the claim immediately. The parity table records what
# these runs cannot prove (workload identity, NetworkPolicy enforcement,
# Pod Security defaults on kind).
#
# `run-name` distinguishes the legs in the run history: the staleness job
# excludes its own runs from the last-green computation (a self-referencing
# measurement would keep itself fresh forever - the deploy-throttle lesson),
# and identifies the weekly managed leg by name. A workflow_dispatch run
# carries its leg as a suffix - "K8s conformance - workflow_dispatch (kind)"
# etc (FAR-1554) - so a manual staleness dispatch is named "(staleness)" and
# is excluded alongside the cron-named staleness run; without that suffix a
# repeated manual staleness dispatch counted as green and kept last-green
# fresh, masking a dead conformance leg.
#
# CROSS-LINK (staleness coupling): the template below must produce exactly the
# two names the `staleness` job matches on for SCHEDULED runs - its env
# `STALENESS_RUN_NAME` and `MANAGED_RUN_NAME` (the template must NOT alter
# those cron names). Changing this template without updating those two
# constants stops the managed leg being tracked; the staleness job now WARNS
# loudly when a scheduled run matches neither name, so the drift is visible
# rather than silent. The manual-dispatch staleness exclusion is the separate
# `*" (staleness)"` match in the staleness job's self-reference guard - keep
# it in step with this template's dispatch suffix too.

run-name: "K8s conformance - ${{ github.event_name == 'schedule' && format('cron {0}', github.event.schedule) || github.event_name }}${{ github.event_name == 'workflow_dispatch' && format(' ({0})', inputs.job) || '' }}"

on:
  pull_request:
    branches: [main]
    # FAR-1527: trigger-level filter so the kind leg's runner does not even
    # START on PRs that cannot touch the conformance surface. The list mirrors
    # the step-level `Detect changed paths` PATHS below exactly (a path in one
    # but not the other either wastes a runner or silently never runs). Safe
    # because branch protection has NO required status checks - verified at
    # implementation time: `gh api repos/farnalabs/modulo/branches/main/
    # protection --jq '.required_status_checks'` returns null/absent (a
    # path-filtered REQUIRED check would hang unrelated PRs forever).
    # push-to-main and workflow_dispatch are deliberately NOT filtered.
    #
    # `deploy/helm/**` (FAR-1558 follow-up): the chart lints inside this same
    # `kind` job, so a chart-only PR must be able to reach it at all. The
    # step-level gate splits conformance-surface changes (`changed`, spins the
    # kind cluster) from chart-only changes (`chart`, lints without a cluster)
    # - see `Detect changed paths` below.
    paths:
      - "backend/src/modulo/core/runtime_provider/**"
      - "backend/src/modulo/core/bundled_runner/**"
      - "backend/src/modulo/core/pipeline_engine/**"
      - "backend/tests/conformance/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/k8s-conformance.yml"
      - "deploy/helm/**"
  push:
    branches: [main]
  schedule:
    # Weekly managed-cloud run -> the `managed` leg (rotation inside `pick`).
    - cron: "0 4 * * 1"
    # Daily last-green staleness check -> the `staleness` leg.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which leg to run"
        type: choice
        required: true
        default: kind
        options:
          - kind
          - managed
          - staleness

env:
  # Authenticate GitHub git fetches so `uv sync --frozen` can resolve
  # git-pinned dependencies (pytest-bdd source archive) - mirrors ci.yml.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf'
  GIT_CONFIG_VALUE_0: "https://github.com/"
  # Pinned tool versions for the kind leg (and kubectl for all legs).
  # kubectl: kind v0.33.0 ships a k8s 1.37 node image (observed 2026-10),
  # and managed clusters currently run 1.35-1.37 - v1.36.0 keeps the client
  # within kubectl's supported +/-1 minor skew of BOTH.
  KIND_VERSION: v0.33.0
  KUBECTL_VERSION: v1.36.0
  HELM_VERSION: v3.21.4
  KIND_CLUSTER_NAME: modulo-conformance

permissions:
  contents: read

# Same shape as ci.yml: superseded PR pushes cancel; every other event gets a
# unique group so it can never be cancelled.
concurrency:
  group: k8s-conformance-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kind:
    name: kind cluster conformance
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.job == 'kind')
    runs-on: ubicloud-standard-2
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          # Path detection diffs against the base; no credentials persisted.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: detect
        shell: bash
        # Step-level path gate on the runner-ci-harness pattern: the job still
        # REPORTS on every PR (a job-level skip surfaces as a non-green
        # "skipped" check), but the expensive cluster steps only run when the
        # conformance surface changed. FAIL-OPEN: any diff error runs the
        # suite rather than silently skipping it.
        #
        # TWO outputs (FAR-1558 follow-up), so a chart-only change reaches
        # `helm lint` WITHOUT spinning a kind cluster:
        #   changed - the conformance surface (cluster + suite); mirrors the
        #             trigger-level `paths` list minus `deploy/helm/**`.
        #   chart   - deploy/helm/** (the chart itself); gates the tool
        #             install and `helm lint` only.
        # The trigger-level `paths` filter is the UNION of both lists - the
        # chart was in NEITHER before, so a chart-only PR never started this
        # job and the chart rotted unexercised (the exact failure FAR-1053
        # exists to prevent).
        working-directory: .
        timeout-minutes: 3
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          PATHS="backend/src/modulo/core/runtime_provider/ backend/src/modulo/core/bundled_runner/ backend/src/modulo/core/pipeline_engine/ backend/tests/conformance/ backend/pyproject.toml backend/uv.lock .github/workflows/k8s-conformance.yml"
          CHART_PATHS="deploy/helm/"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PRs check out the merge commit: HEAD^ is the base side.
            if git rev-parse -q --verify "HEAD^2" >/dev/null 2>&1; then
              BASE="HEAD^"
            else
              BASE="origin/$GITHUB_BASE_REF"
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -z "$EVENT_BEFORE" ] || [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "chart=true" >> "$GITHUB_OUTPUT"
              echo "Push without a resolvable before-SHA - running the conformance suite."
              exit 0
            fi
            BASE="$EVENT_BEFORE"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "chart=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch - running the conformance suite unconditionally."
            exit 0
          fi
          rc=0
          CHANGED="$(git diff --name-only "$BASE" HEAD -- $PATHS)" || rc=$?
          CHART="$(git diff --name-only "$BASE" HEAD -- $CHART_PATHS)" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::path-filter git diff failed (rc=$rc); running the conformance suite unconditionally (fail open)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "chart=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Conformance surface changed:"
            echo "$CHANGED"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No runtime-provider / bundled-runner / pipeline-engine / conformance changes - skipping the cluster steps."
          fi
          if [ -n "$CHART" ]; then
            echo "chart=true" >> "$GITHUB_OUTPUT"
            echo "Helm chart changed:"
            echo "$CHART"
          else
            echo "chart=false" >> "$GITHUB_OUTPUT"
            echo "No Helm chart changes."
          fi

      - name: Install helm (pinned)
        if: steps.detect.outputs.changed == 'true' || steps.detect.outputs.chart == 'true'
        working-directory: .
        shell: bash
        timeout-minutes: 5
        # Split from the kind/kubectl install (FAR-1558 follow-up): `helm lint`
        # is the ONLY step a chart-only change needs, so helm installs on
        # either output while the cluster tooling below stays gated on
        # `changed` alone.
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          tar -xzf helm.tgz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          rm -rf helm.tgz linux-amd64
          helm version

      - name: Install kind and kubectl (pinned)
        if: steps.detect.outputs.changed == 'true'
        working-directory: .
        shell: bash
        timeout-minutes: 5
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          curl -fsSL --proto '=https' --proto-redir '=https' -o ./kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x ./kubectl && sudo mv ./kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client=true

      - name: Create the kind cluster
        if: steps.detect.outputs.changed == 'true'
        working-directory: .
        shell: bash
        timeout-minutes: 10
        run: |
          kind create cluster --name "$KIND_CLUSTER_NAME" --wait 180s
          kubectl wait --for=condition=Ready nodes --all --timeout=120s

      - name: Pre-load the workspace image into the kind node
        if: steps.detect.outputs.changed == 'true'
        working-directory: .
        shell: bash
        timeout-minutes: 5
        run: |
          # The provider's default workspace image (k8s.py _DEFAULT_IMAGE).
          # Loading it into the node sidesteps Docker Hub pull limits on
          # shared runner IPs. If the default image ever changes this becomes
          # a harmless warm-up miss - the node then pulls the real default
          # itself (slower, still correct).
          docker pull python:3.13-slim
          kind load docker-image python:3.13-slim --name "$KIND_CLUSTER_NAME"

      - name: Lint the Helm chart
        if: steps.detect.outputs.changed == 'true' || steps.detect.outputs.chart == 'true'
        working-directory: .
        shell: bash
        timeout-minutes: 3
        # FAR-1053 exists because the previous Helm configs rotted away
        # unexercised - `helm lint` is the cheapest exercise that keeps the
        # chart from silently breaking. It does NOT install anything: the
        # conformance suite validates the runtime provider, not chart
        # behaviour (see the parity doc for what is and is not covered).
        #
        # FAR-1558 follow-up: gated on EITHER surface, so a chart-only change
        # (`chart=true`, `changed=false`) lints the chart while the cluster
        # steps above stay skipped - no kind cluster is created for a change
        # the suite cannot exercise anyway. Kept on `changed || chart` (not
        # `chart` alone) so conformance runs keep linting too, exactly as
        # before.
        run: helm lint deploy/helm/modulo

      - name: Sync backend deps
        if: steps.detect.outputs.changed == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true
          ignore-nothing-to-cache: true

      - name: uv sync
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        timeout-minutes: 10
        # Deliberately WITHOUT --no-build (NOSONAR githubactions:S8541):
        # pytest-bdd is a pinned source archive with no wheel, so `--no-build`
        # hard-fails the sync on a cold uv cache (FAR-791). `--frozen` locks the
        # exact revisions, so the builds are deterministic and trusted.
        run: uv sync --frozen  # NOSONAR

      - name: Run the runtime-provider conformance suite
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        timeout-minutes: 20
        # The CLI -m overrides the backend/pyproject.toml addopts deselection
        # (pytest keeps the last -m), so the selection is explicit - the suite
        # is never implicitly on and never silently skipped green here.
        run: uv run --no-build --no-sync pytest tests/conformance/ -m runtime_provider_conformance --tb=short -q --timeout=600

      - name: Cluster diagnostics (evidence dump)
        if: always() && steps.detect.outputs.changed == 'true'
        working-directory: .
        shell: bash
        timeout-minutes: 3
        # Evidence only - never gates the job (same posture as the
        # runner-ci-harness proxy log dump).
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 60 || true

      - name: Delete the kind cluster (always)
        if: always() && steps.detect.outputs.changed == 'true'
        working-directory: .
        shell: bash
        timeout-minutes: 5
        # The finally-clause: runs after success AND failure so a red run
        # never leaks the cluster on the runner.
        run: kind delete cluster --name "$KIND_CLUSTER_NAME"

      - name: Record the green run (staleness visibility)
        if: success() && steps.detect.outputs.changed == 'true'
        working-directory: .
        shell: bash
        timeout-minutes: 3
        # Publishing step: stamp this green run's date into the run summary.
        # The staleness job reads the same run history and does the
        # authoritative cross-run computation (including excluding its own
        # cron runs) - and, since FAR-1620, inspects each run's job steps so
        # a path-skipped success (suite step conclusion=skipped) never
        # refreshes last-green. This stamp is gated on `changed`, so a
        # chart-only green does not write it either.
        run: |
          STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "## Kubernetes conformance (kind) - green"
            echo ""
            echo "Green run recorded at: ${STAMP}"
            echo ""
            echo "Claim: the kind substrate is conformant while its latest run is green (docs/deployment/k8s-conformance-parity.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  pick:
    name: Pick this week's managed cloud
    if: (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.job == 'managed')
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Rotate EKS -> AKS -> GKE by ISO week
        id: pick
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          WEEK="$(date -u +%V)"
          # 10# forces base-10 so weeks like "08" are not read as octal.
          case $(( 10#$WEEK % 3 )) in
            0) CLOUD="eks" ;;
            1) CLOUD="aks" ;;
            2) CLOUD="gke" ;;
          esac
          case "$CLOUD" in
            eks) SECRET="K8S_CONFORMANCE_EKS_KUBECONFIG" ;;
            aks) SECRET="K8S_CONFORMANCE_AKS_KUBECONFIG" ;;
            gke) SECRET="K8S_CONFORMANCE_GKE_KUBECONFIG" ;;
          esac
          echo "matrix={\"include\":[{\"cloud\":\"$CLOUD\",\"kubeconfig_secret\":\"$SECRET\"}]}" >> "$GITHUB_OUTPUT"
          echo "Managed conformance target this week: ${CLOUD} (ISO week ${WEEK}: week % 3 rotates one cloud per week, all three cycle every three weeks)."

  managed:
    name: managed conformance (${{ matrix.cloud }})
    needs: [pick]
    if: (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.job == 'managed')
    runs-on: ubicloud-standard-2
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pick.outputs.matrix) }}
    defaults:
      run:
        working-directory: backend
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/conformance.yaml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install kubectl (pinned)
        working-directory: .
        shell: bash
        timeout-minutes: 5
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o ./kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x ./kubectl && sudo mv ./kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      - name: Materialise the kubeconfig and verify cluster access
        working-directory: .
        shell: bash
        timeout-minutes: 3
        env:
          CLOUD: ${{ matrix.cloud }}
          KUBECONFIG_SECRET_NAME: ${{ matrix.kubeconfig_secret }}
          KUBECONFIG_RAW: ${{ secrets[matrix.kubeconfig_secret] }}
        run: |
          if [ -z "$KUBECONFIG_RAW" ]; then
            echo "::error::FAR-1053 needs-human: the ${CLOUD} conformance kubeconfig secret '${KUBECONFIG_SECRET_NAME}' is not provisioned. Store the RAW kubeconfig YAML of a dedicated ${CLOUD} conformance cluster under that repository secret (user needs namespace create/delete plus pods/exec and pods/log). Until it exists the ${CLOUD} substrate is NOT claimed conformant, and this leg fails loudly by design - never a silent skip. See docs/deployment/k8s-conformance-parity.md."
            exit 1
          fi
          mkdir -p "$(dirname "$KUBECONFIG")"
          printf '%s\n' "$KUBECONFIG_RAW" > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl cluster-info
          kubectl get namespaces >/dev/null
          echo "Connected to the ${CLOUD} conformance cluster."

      - name: Sync backend deps
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"
          enable-cache: true
          ignore-nothing-to-cache: true

      - name: uv sync
        shell: bash
        timeout-minutes: 10
        # NOSONAR githubactions:S8541: pytest-bdd is a pinned source archive with
        # no wheel, so `--no-build` hard-fails the sync on a cold uv cache
        # (FAR-791). `--frozen` locks the exact revisions, so the builds are
        # deterministic and trusted (no untrusted setup scripts execute).
        run: uv sync --frozen  # NOSONAR

      - name: Run the runtime-provider conformance suite
        shell: bash
        timeout-minutes: 25
        run: uv run --no-build --no-sync pytest tests/conformance/ -m runtime_provider_conformance --tb=short -q --timeout=600

      - name: Cluster diagnostics (evidence dump)
        if: always()
        working-directory: .
        shell: bash
        timeout-minutes: 3
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 60 || true

      - name: Sweep conformance namespaces (always)
        if: always()
        working-directory: .
        shell: bash
        timeout-minutes: 5
        # The session fixture deletes its own namespace; this backstops a run
        # killed mid-flight. It GATES: a leaked namespace on a managed
        # cluster costs money until someone finds it.
        run: kubectl delete namespace -l modulo.conformance=true --ignore-not-found --wait=true --timeout=180s

      - name: Record the green run (staleness visibility)
        if: success()
        working-directory: .
        shell: bash
        timeout-minutes: 3
        env:
          CLOUD: ${{ matrix.cloud }}
        run: |
          STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "## Kubernetes conformance (managed ${CLOUD}) - green"
            echo ""
            echo "Green run recorded at: ${STAMP}"
            echo ""
            echo "Claim: the ${CLOUD} substrate is conformant while its latest scheduled run is green (docs/deployment/k8s-conformance-parity.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  staleness:
    name: Last-green conformance staleness
    # The staleness job reads this workflow's run history via the Actions API
    # with github.token (a token lacking this scope yields 404 - indistinguishable
    # from an empty result, so declare it explicitly). `actions: read` is scoped to
    # THIS job only (githubactions:S8264) - no other job touches the Actions API. A
    # job-level `permissions` block replaces the workflow-level one, so
    # `contents: read` is restated here.
    permissions:
      contents: read
      actions: read
    if: (github.event_name == 'schedule' && github.event.schedule == '17 5 * * *') || (github.event_name == 'workflow_dispatch' && inputs.job == 'staleness')
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - name: Compute and publish the last-green dates
        shell: bash
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: k8s-conformance.yml
          # The two run names produced by this workflow's run-name template
          # (kept in sync with the template at the top of this file - a rename
          # must update all three, or scheduled legs classify as unrecognised;
          # the scan below WARNS loudly when that happens).
          STALENESS_RUN_NAME: "K8s conformance - cron 17 5 * * *"
          MANAGED_RUN_NAME: "K8s conformance - cron 0 4 * * 1"
          # FAR-1620: the exact step name of the conformance suite step -
          # must match BOTH suite steps in this workflow (`kind` and
          # `managed`). A run counts green only when a step with this name
          # has conclusion=success in the run's job list; a path-skipped run
          # (docs-only push / chart-only PR) has it as conclusion=skipped
          # and must never refresh last-green.
          SUITE_STEP_NAME: "Run the runtime-provider conformance suite"
          # Grace windows (days), overridable via repo variables:
          #   ANY_GRACE  - the scheduled leg refreshes weekly once the secrets
          #                are provisioned, so 28d = four missed cycles; before
          #                that it is refreshed by kind-leg greens (PR runs or
          #                a manual workflow_dispatch job=kind).
          #   MANAGED_DARK_GRACE - the weekly cron must produce a run at least
          #                every ~7d; 14d means GitHub dropped the cron or the
          #                workflow was edited out from under it.
          ANY_GRACE: ${{ vars.K8S_CONFORMANCE_STALENESS_GRACE_DAYS || 28 }}
          MANAGED_DARK_GRACE: ${{ vars.K8S_CONFORMANCE_MANAGED_DARK_GRACE_DAYS || 14 }}
        run: |
          set -euo pipefail
          NOW_TS="$(date -u +%s)"
          # Scan depth: the grace-window comparisons below are only meaningful
          # if the fetched run history reaches back past the widest grace
          # window. Measured 2026-10-09: ~23 runs/day for this workflow, so a
          # single 100-run page spans only ~4 days - far short of the 28-day
          # ANY grace. After FAR-1620 (path-skipped successes no longer count
          # as green) greens are sparse enough that page depth, not the grace
          # variable, would otherwise define the effective window and cry
          # STALE on any quiet stretch. So page back until the oldest run
          # collected is older than the widest window (or history is
          # exhausted), capped at MAX_PAGES pages.
          MAX_GRACE_DAYS=$(( ANY_GRACE > MANAGED_DARK_GRACE ? ANY_GRACE : MANAGED_DARK_GRACE ))
          CUTOFF_TS=$(( NOW_TS - (MAX_GRACE_DAYS + 1) * 86400 ))
          MAX_PAGES=10
          # (.conclusion // "pending" keeps every TSV field non-empty: an empty
          # field would collapse under IFS-whitespace and shift the columns.)
          # .id rides along (FAR-1620) so each candidate green run's JOB STEPS
          # can be read - a run-level success alone is NOT proof the suite ran.
          JQ_RUNS='.workflow_runs[] | [.id, .name, .event, (.conclusion // "pending"), .created_at] | @tsv'
          RUNS_TSV=""
          PAGE=0
          COVERED=false
          while [ "${PAGE}" -lt "${MAX_PAGES}" ]; do
            PAGE=$((PAGE + 1))
            rc=0
            PAGE_TSV="$(gh api "repos/${REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=100&page=${PAGE}" \
              --jq "${JQ_RUNS}" 2>&1)" || rc=$?
            if [ "${rc}" -ne 0 ]; then
              if [ "${PAGE}" -eq 1 ]; then
                # Fail open WITH a loud warning on API failure (a token/scope
                # problem must not read as "no runs found" - the Actions
                # 404-vs-empty lesson): transient failures warn, not fail.
                echo "::warning::could not read this workflow's run history (rc=${rc}) - cannot determine staleness this cycle. Transient failures warn, not fail; if this repeats, investigate the Actions API read (token scope yields 404, which looks like an empty result)."
                {
                  echo "## Kubernetes conformance - staleness"
                  echo ""
                  echo "UNKNOWN this cycle: run-history read failed (rc=${rc})."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "::warning::run-history read failed on page ${PAGE} (rc=${rc}) - continuing with the runs already collected; if no green is found below, the scan may simply not reach back far enough."
              break
            fi
            if [ -z "${PAGE_TSV}" ]; then
              # Empty page = history exhausted; everything has been collected.
              COVERED=true
              break
            fi
            RUNS_TSV="${RUNS_TSV}${PAGE_TSV}"$'\n'
            PAGE_LINES="$(printf '%s\n' "${PAGE_TSV}" | wc -l | tr -d '[:space:]')"
            # Timestamps are fixed-width UTC ISO-8601 (Z suffix), so a
            # lexicographic min is a chronological min.
            OLDEST="$(printf '%s\n' "${PAGE_TSV}" | cut -f5 | sort | head -n1)"
            OLDEST_TS="$(date -u -d "${OLDEST}" +%s)"
            if [ "${OLDEST_TS}" -le "${CUTOFF_TS}" ]; then
              COVERED=true
              break
            fi
            if [ "${PAGE_LINES}" -lt 100 ]; then
              # Short page = last page; the whole run history is collected.
              COVERED=true
              break
            fi
          done
          if [ "${COVERED}" != "true" ]; then
            if [ "${PAGE}" -ge "${MAX_PAGES}" ]; then
              echo "::warning::run-history scan hit the ${MAX_PAGES}-page cap before reaching back past the ${MAX_GRACE_DAYS}-day grace boundary - the ages below are computed from an incomplete window (an old enough last-green may be unseen)."
            else
              echo "::warning::run-history scan is INCOMPLETE (stopped at page ${PAGE} after a read failure - see warning above) - the ages below are computed from too short a window."
            fi
          fi

          ANY_GREEN_TS=0
          ANY_GREEN_DATE=""
          MANAGED_TS=0
          MANAGED_DATE=""
          MANAGED_CONCLUSION=""
          MANAGED_GREEN_TS=0
          MANAGED_GREEN_DATE=""
          # First scheduled run whose name matches neither known leg name. A
          # run-name template rename would otherwise classify every scheduled
          # leg as "other" and silently stop tracking the managed leg.
          SCHEDULE_NAME_DRIFT=""
          # FAR-1620: count of per-run jobs-API reads that failed this cycle.
          # A run whose job list could not be read is NEVER counted green (an
          # API failure must never refresh last-green); when the failures
          # mean nothing could be verified at all, the cycle fails loud
          # below instead of reporting a false "never green".
          JOBS_READ_ERRORS=0
          # Verification budget: bounds the per-run jobs reads (each is one
          # API call). In the normal case the newest green is found within a
          # handful of candidates and the timestamp gate below stops further
          # reads, so this budget is only approached while the suite has been
          # dark for a long stretch - exactly then a loud warning is wanted.
          JOBS_VERIFIED=0
          MAX_JOBS_VERIFIED=250
          JOBS_VERIFY_CAPPED=false
          while IFS=$'\t' read -r RUN_ID NAME EVENT CONCLUSION CREATED; do
            [ -z "${CREATED}" ] && continue
            # Self-reference guard: the staleness job's own runs never count
            # (a green staleness run would otherwise refresh the last-green
            # date forever and the check could never fire). BOTH staleness
            # run names are excluded: the cron-named run (exact match) and a
            # manual workflow_dispatch job=staleness run, which the run-name
            # template names "<base> (staleness)" (FAR-1554).
            if [ "${NAME}" = "${STALENESS_RUN_NAME}" ] || [[ "${NAME}" == *" (staleness)" ]]; then
              continue
            fi
            TS="$(date -u -d "${CREATED}" +%s)"
            if [ "${NAME}" = "${MANAGED_RUN_NAME}" ]; then
              # Run-level (not suite-verified) on purpose: this row measures
              # whether the weekly cron still PRODUCES runs at all - the
              # cron-drop tripwire - so a red or step-skipped managed run
              # still refreshes it.
              if [ "${TS}" -gt "${MANAGED_TS}" ]; then
                MANAGED_TS="${TS}"
                MANAGED_DATE="${CREATED}"
                MANAGED_CONCLUSION="${CONCLUSION}"
              fi
            elif [ "${EVENT}" = "schedule" ] && [ -z "${SCHEDULE_NAME_DRIFT}" ]; then
              # A scheduled run must be one of the two known legs; anything
              # else means the run-name template drifted from the constants
              # above (or a third schedule was added). Record it so the check
              # fails loud below instead of silently under-reporting.
              SCHEDULE_NAME_DRIFT="${NAME}"
            fi
            # Suite-verified green (FAR-1620): a successful RUN is not proof
            # the suite ran - the suite step is path-gated on the kind job
            # (`steps.detect.outputs.changed`), so a docs-only push or a
            # chart-only PR concludes success with the suite step SKIPPED.
            # Read this run's job list and count it green only when a step
            # named SUITE_STEP_NAME has conclusion=success (i.e. the
            # conformance suite actually executed and passed).
            if [ "${CONCLUSION}" = "success" ]; then
              # Read the job list only when the answer could change a green
              # statistic: a run older than the current last-green cannot
              # improve it (and neither can an older managed run). The
              # timestamp gate is order-independent - if a strictly newer
              # run appears later in the iteration it still passes - so this
              # purely bounds API calls: normally the newest green is found
              # within a handful of candidates and the rest cost nothing.
              NEED_JOBS_READ=false
              if [ "${TS}" -gt "${ANY_GREEN_TS}" ]; then
                NEED_JOBS_READ=true
              fi
              if [ "${NAME}" = "${MANAGED_RUN_NAME}" ] && [ "${TS}" -gt "${MANAGED_GREEN_TS}" ]; then
                NEED_JOBS_READ=true
              fi
              if [ "${NEED_JOBS_READ}" = "true" ] && [ "${JOBS_VERIFIED}" -ge "${MAX_JOBS_VERIFIED}" ]; then
                JOBS_VERIFY_CAPPED=true
              elif [ "${NEED_JOBS_READ}" = "true" ]; then
                JOBS_VERIFIED=$((JOBS_VERIFIED + 1))
                jrc=0
                SUITE_STEPS="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
                  --jq "[.jobs[] | .steps[]? | select(.name == \"${SUITE_STEP_NAME}\" and .conclusion == \"success\")] | length" 2>&1)" || jrc=$?
                if [ "${jrc}" -ne 0 ]; then
                  JOBS_READ_ERRORS=$((JOBS_READ_ERRORS + 1))
                  echo "::warning::could not read the job list for run ${RUN_ID} ('${NAME}', rc=${jrc}) - NOT counting it as green (an API failure must never read as fresh)."
                elif [[ "${SUITE_STEPS}" =~ ^[0-9]+$ ]] && [ "${SUITE_STEPS}" -gt 0 ]; then
                  # The suite step exists in this run AND concluded success.
                  if [ "${TS}" -gt "${ANY_GREEN_TS}" ]; then
                    ANY_GREEN_TS="${TS}"
                    ANY_GREEN_DATE="${CREATED}"
                  fi
                  if [ "${NAME}" = "${MANAGED_RUN_NAME}" ] && [ "${TS}" -gt "${MANAGED_GREEN_TS}" ]; then
                    MANAGED_GREEN_TS="${TS}"
                    MANAGED_GREEN_DATE="${CREATED}"
                  fi
                else
                  echo "::notice::run ${RUN_ID} ('${NAME}') concluded success but its suite step did not run+pass (suite-step count='${SUITE_STEPS}') - excluded from last-green (FAR-1620)."
                fi
              fi
            fi
          done <<< "${RUNS_TSV}"

          if [ -n "${SCHEDULE_NAME_DRIFT}" ]; then
            echo "::warning::a scheduled run named '${SCHEDULE_NAME_DRIFT}' matches neither '${STALENESS_RUN_NAME}' nor '${MANAGED_RUN_NAME}' - the run-name template has drifted from the names this job tracks (or a new schedule was added). Update STALENESS_RUN_NAME / MANAGED_RUN_NAME to match - see the run-name template comment at the top of this workflow. Until then the managed-leg staleness signal is incomplete."
          fi

          ANY_AGE=""
          [ "${ANY_GREEN_TS}" -gt 0 ] && ANY_AGE=$(( (NOW_TS - ANY_GREEN_TS) / 86400 ))
          MANAGED_AGE=""
          [ "${MANAGED_TS}" -gt 0 ] && MANAGED_AGE=$(( (NOW_TS - MANAGED_TS) / 86400 ))
          ANY_AGE_CELL="${ANY_AGE:+${ANY_AGE}d}"
          ANY_AGE_CELL="${ANY_AGE_CELL:-n/a}"
          MANAGED_AGE_CELL="${MANAGED_AGE:+${MANAGED_AGE}d}"
          MANAGED_AGE_CELL="${MANAGED_AGE_CELL:-n/a}"

          {
            echo "## Kubernetes conformance - last-green visibility"
            echo ""
            echo "| signal | date | age |"
            echo "| --- | --- | --- |"
            echo "| Last green run (any leg, staleness-cron runs excluded; suite step must have run+passed) | ${ANY_GREEN_DATE:-none yet} | ${ANY_AGE_CELL} |"
            echo "| Last scheduled (managed) run | ${MANAGED_DATE:-none yet} (${MANAGED_CONCLUSION:-n/a}) | ${MANAGED_AGE_CELL} |"
            echo "| Last green managed run (suite-verified) | ${MANAGED_GREEN_DATE:-none yet} | |"
            echo "| Grace windows | ${ANY_GRACE}d (any green) / ${MANAGED_DARK_GRACE}d (managed cron dark) | |"
            if [ "${JOBS_READ_ERRORS}" -gt 0 ]; then
              echo "| Jobs-API reads that failed this cycle (runs not counted green) | ${JOBS_READ_ERRORS} | |"
            fi
            echo ""
            echo "Claim discipline: a substrate is claimed conformant ONLY while its most recent conformance run is green (docs/deployment/k8s-conformance-parity.md)."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${JOBS_READ_ERRORS}" -gt 0 ] && [ -z "${ANY_GREEN_DATE}" ]; then
            # Fail LOUD when nothing could be verified: reporting
            # "never green" (or worse, staying silent) on the back of a
            # token/scope failure would be exactly the 404-looks-like-empty
            # incident again. An API failure is never treated as fresh.
            echo "::error::could not VERIFY any green run this cycle: ${JOBS_READ_ERRORS} jobs-API read(s) failed (see warnings above). Refusing to claim or deny freshness from a failed API read - investigate the Actions API read (github.token must carry actions: read; a token/scope problem yields 404). Re-run with workflow_dispatch job=staleness once fixed."
            exit 1
          fi
          if [ "${JOBS_READ_ERRORS}" -gt 0 ]; then
            echo "::warning::${JOBS_READ_ERRORS} jobs-API read(s) failed this cycle; those runs were NOT counted green. Last-green above was verified from the remaining runs, but the scan is incomplete - re-run with workflow_dispatch job=staleness once the Actions API read is healthy."
          fi
          if [ "${JOBS_VERIFY_CAPPED}" = "true" ]; then
            echo "::warning::verification budget exhausted (${MAX_JOBS_VERIFIED} job-list reads this cycle) before every candidate green run could be inspected - candidate runs beyond the budget were NOT counted green. Re-run with workflow_dispatch job=staleness (or raise MAX_JOBS_VERIFIED) if last-green looks understated."
          fi

          if [ -z "${ANY_GREEN_DATE}" ]; then
            echo "::error::no suite-verified green run exists in the scanned run history (FAR-1053/FAR-1620): either the conformance suite has NEVER run green, or it has been dark for longer than the scanned window (every recent run either failed or path-skipped the suite). Establish the first green: land a PR touching the conformance surface, or run workflow_dispatch with job=kind. Until then the Kubernetes tier is not claimed conformant."
            exit 1
          fi

          if [ "${ANY_AGE}" -gt "${ANY_GRACE}" ]; then
            echo "::error::Kubernetes conformance is STALE: the last green run was ${ANY_AGE} days ago (${ANY_GREEN_DATE}), past the ${ANY_GRACE}-day grace window. Either the gate stopped running (dropped cron, path filter never matching) or every recent run failed - inspect the k8s-conformance workflow runs. A quick refresh: workflow_dispatch with job=kind. The conformance claim is withdrawn while this is red."
            exit 1
          fi

          if [ -n "${MANAGED_DATE}" ] && [ "${MANAGED_AGE}" -gt "${MANAGED_DARK_GRACE}" ]; then
            echo "::error::The weekly managed leg is DARK: its most recent run was ${MANAGED_AGE} days ago (${MANAGED_DATE}) - the scheduled cron should produce a run every 7 days. GitHub has been known to drop cron events on busy repos; verify the schedule fired and re-dispatch with job=managed if needed."
            exit 1
          fi

          if [ -n "${MANAGED_DATE}" ] && [ -z "${MANAGED_GREEN_DATE}" ]; then
            echo "::warning::The managed leg has run but has NEVER been green - EKS/AKS/GKE are not claimed conformant (FAR-1053 needs-human: provision the K8S_CONFORMANCE_*_KUBECONFIG secrets, or investigate the latest managed run)."
          fi

          echo "::notice::Kubernetes conformance last green ${ANY_AGE}d ago (${ANY_GREEN_DATE}) - within the ${ANY_GRACE}-day grace window."
