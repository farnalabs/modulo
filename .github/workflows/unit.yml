name: Unit Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12.4"
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Run unit tests with coverage threshold enforcement
        working-directory: backend
        run: ../.github/scripts/coverage-thresholds.ps1
        shell: pwsh
        env:
          DATABASE_URL: "postgresql+asyncpg://unused:unused@localhost/unused"
          SECRET_KEY: "ci-secret-key-for-github-actions-testing-only"
          FERNET_KEY: "vK-xU7GqHLflg_GqzJ1FqWI7pHWoHSIyukf4wx-tMHI="
