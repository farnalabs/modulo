name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PR is not draft and has ready label
        id: check_labels
        run: |
          PR_JSON=$(gh pr view ${{ github.event.pull_request.number }} --json isDraft,labels)
          IS_DRAFT=$(echo "$PR_JSON" | jq -r '.isDraft')
          HAS_LABEL=$(echo "$PR_JSON" | jq -r '.labels[] | select(.name == "ready for review") | .name')
          if [ "$IS_DRAFT" = "false" ] && [ -n "$HAS_LABEL" ]; then
            echo "matched=true" >> $GITHUB_OUTPUT
          else
            echo "matched=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge (squash)
        if: steps.check_labels.outputs.matched == 'true'
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --auto \
            --squash \
            --subject "${{ github.event.pull_request.title }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
