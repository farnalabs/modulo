name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Enable auto-merge
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Enable auto-merge (squash)
        run: |
          PR_JSON=$(gh pr view ${{ github.event.pull_request.number }} --json isDraft,labels)
          IS_DRAFT=$(echo "$PR_JSON" | jq -r '.isDraft')
          HAS_LABEL=$(echo "$PR_JSON" | jq -e -r '.labels[] | select(.name == "ready for review") | .name' 2>/dev/null || echo "")
          if [ "$IS_DRAFT" = "false" ] && [ -n "$HAS_LABEL" ]; then
            gh pr merge ${{ github.event.pull_request.number }} \
              --auto \
              --squash \
              --subject "${{ github.event.pull_request.title }}"
          else
            echo "Skipping: PR is draft or missing 'ready for review' label"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
