name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Enable auto-merge
    if: >
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'ready for review')
    runs-on: ubuntu-latest
    steps:
      - name: Check PR labels
        id: check_labels
        run: |
          LABELS=$(gh pr view ${{ github.event.pull_request.number }} --json labels -t '{{range .labels}}{{.name}}{{"\n"}}{{end}}')
          if echo "$LABELS" | grep -q "ready for review"; then
            echo "matched=true" >> $GITHUB_OUTPUT
          else
            echo "matched=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge (squash)
        if: steps.check_labels.outputs.matched == 'true'
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --auto \
            --squash \
            --subject "${{ github.event.pull_request.title }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
