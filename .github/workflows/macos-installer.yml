           printf 'openssl pkcs12 extraction: mode=%s status=ok\n' "$mode"
          P12_SCRIPT
          chmod 700 "$P12_SCRIPT"
          export CERTIFICATE_PASSWORD
          run_pre_smoke identity_pem_extract bash "$P12_SCRIPT" "$CERT" "$IDENTITY_PEM_PATH"

          # shellcheck disable=SC2016
          run_pre_smoke keychain_create security create-keychain -p "" "$KEYCHAIN"

          # shellcheck disable=SC2016
          run_pre_smoke keychain_settings security set-keychain-settings -lut 900 "$KEYCHAIN"
          # shellcheck disable=SC2016
          run_pre_smoke keychain_unlock security unlock-keychain -p "" "$KEYCHAIN"
