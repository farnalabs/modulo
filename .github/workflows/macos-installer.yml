                | sed -E \
                  -e 's#/(private/)?tmp/[^[:space:]]*#[TEMP_PATH]#g' \
                  -e 's#/var/folders/[^[:space:]]*#[TEMP_PATH]#g' \
                  -e 's#/(Users|private/var)/[^[:space:]]*(tmp|_temp|TemporaryItems)[^[:space:]]*#[TEMP_PATH]#Ig' \
                  -e 's#([[:alnum:]_.-]*(password|token|secret|api[_-]?key|passphrase|credential)[[:space:]]*=[[:space:]]*)[^[:space:]]+#\1[REDACTED]#Ig' \
                | awk 'NR <= 10 { remaining = 500 - used; if (remaining <= 0) exit; line = substr($0, 1, remaining); print line; used += length(line) + 1 }'
            }

            run_pre_smoke() {
              local name="$1"; shift
              local output_file="$DATA/pre-smoke-${name}.log"
              local exit_code
              rm -f "$output_file"
              set +e
              "$@" >"$output_file" 2>&1
              exit_code=$?
              set -e
              printf 'run_pre_smoke: %s command_exit=%d\n' "$name" "$exit_code"
