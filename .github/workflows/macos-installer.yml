             : > "'"$OWNED_PIDS"'"
             collect_children '"$SERVICE_PID"'
             grep -qE "^[0-9]+$" "'"$OWNED_PIDS"'" || exit 1
           ' || exit 1

           # Invalid bundled binary negative test
           INSTALLED_APP="$INSTALL_ROOT/Modulo-${VERSION_NUM}.app"
           run_assertion "invalid_bundled_binary_negative" bash -c '
             if "'"$INSTALLED_APP"'/Contents/MacOS/modulo" start --data-dir "'"$DATA"'/failure" --bin-dir "'"$DATA"'/missing-bin" >"'"$DATA"'/invalid-bin.stderr" 2>&1; then
               exit 1
             fi
             grep -Eiq "bundled binaries not found|missing:.*(initdb|postgres|redis-server)" "'"$DATA"'/invalid-bin.stderr" || exit 1
           ' || exit 1

           # Launchctl unload / cleanup path
           run_assertion "launchctl_unload" \
             launchctl unload -w "$PLIST" || exit 1

           # shellcheck disable=SC2016
           run_assertion "launchagent_gone_after_unload" bash -c '
             ! launchctl print "gui/$(id -u)/run.modulo.launcher" >/dev/null 2>&1
           ' || exit 1

           # shellcheck disable=SC2016
           run_assertion "launchagent_gone_after_cleanup" bash -c '
             ! launchctl print "gui/$(id -u)/run.modulo.launcher" >/dev/null 2>&1
           ' || exit 1

           run_assertion "no_owned_modulo_processes" bash -c '
             ! pgrep -f "'"$INSTALL_ROOT"'/.*/Contents/MacOS/modulo" >/dev/null 2>&1
           ' || exit 1

           run_assertion "no_owned_postgres_redis" bash -c '
             ! pgrep -f "'"$DATA"'/pgdata" >/dev/null 2>&1 && ! pgrep -f "'"$DATA"'/.*redis" >/dev/null 2>&1
           ' || exit 1


      - name: Upload real macOS installer
        if: ${{ env.RUN_NATIVE_BUILD == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ needs.normalize-inputs.outputs.version }}
          path: build/Modulo-${{ needs.normalize-inputs.outputs.version }}-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 30
