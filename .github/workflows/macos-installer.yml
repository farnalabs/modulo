            }

            # Diagnostic capture helper for post-install smoke assertions
            run_assertion() {
              local name="$1"; shift
              local output_file="$DATA/assertion-${name}.log"
              local exit_code
              rm -f "$output_file"
              set +e
              "$@" >"$output_file" 2>&1
              exit_code=$?
              set -e
              printf 'assertion: %s=%s (exit=%d)\n' "$name" "$([[ $exit_code -eq 0 ]] && printf ok || printf FAILED)" "$exit_code"
