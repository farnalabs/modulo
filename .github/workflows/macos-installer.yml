                printf 'assertion output: %s\n' "$name"
                redact_pre_smoke_output < "$output_file"
              fi
              if [[ $exit_code -ne 0 ]]; then
                return "$exit_code"
              fi
            }

          # shellcheck disable=SC2016
          run_pre_smoke data_directory_create prepare_data_directory
          run_pre_smoke owned_pid_file_prepare prepare_owned_pid_file
          # The vault normally stores the PKCS#12 as base64 text, but accept a
          # PEM value too. Keep the secret in files/stdin rather than passing it
          # as an argument, and avoid a pipeline so macOS base64 failures cannot
          # be hidden by a later command's exit status.
          # shellcheck disable=SC2016
          run_pre_smoke certificate_decode bash -c '
            set -euo pipefail
            certificate_path="$1"
            raw_path="${certificate_path}.raw"
            normalized_path="${certificate_path}.normalized"
            temporary_path="${certificate_path}.decode"
            rm -f "$raw_path" "$normalized_path" "$temporary_path" "$certificate_path"
            printf "%s" "${CERTIFICATE_B64:-}" > "$raw_path"
            raw_byte_count="$(LC_ALL=C wc -c < "$raw_path" | tr -d "[:space:]")"
            printf "certificate decode: raw_bytes=%s\\n" "$raw_byte_count"
            if [[ "$raw_byte_count" -eq 0 ]]; then
              printf "certificate decode: input_class=empty exit=1 class=empty-input\\n" >&2
              rm -f "$raw_path"
              exit 1
            fi
            if LC_ALL=C head -c 11 "$raw_path" | LC_ALL=C grep -Fqx -- "-----BEGIN "; then
              cp "$raw_path" "$temporary_path"
              input_class=pem
            else
              LC_ALL=C tr -d "\\r\\n \\t" < "$raw_path" > "$normalized_path"
              if ! base64 -D < "$normalized_path" > "$temporary_path"; then
                printf "certificate decode: input_class=base64 exit=1 class=invalid-base64\\n" >&2
                rm -f "$raw_path" "$normalized_path" "$temporary_path"
                exit 1
              fi
              input_class=base64
            fi
            rm -f "$raw_path" "$normalized_path"
            if [[ ! -s "$temporary_path" ]]; then
              printf "certificate decode: input_class=%s exit=1 class=empty-output\\n" "$input_class" >&2
              rm -f "$temporary_path"
              exit 1
            fi
            byte_length="$(LC_ALL=C wc -c < "$temporary_path" | tr -d "[:space:]")"
            header_bytes="$(od -An -tx1 -N8 "$temporary_path" | tr -d "[:space:]")"
            if [[ "$input_class" == pem ]]; then
