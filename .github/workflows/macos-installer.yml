          ' bash "$CERT"
          # Set up an empty keychain password so no generated password is leaked in argv.
          # OpenSSL consumes the PKCS#12 password from the child environment;
          # this keeps the real vault-backed password out of argv and logs.
          # The extracted PEM is then imported without any certificate password
          # argument. OpenSSL 3 may need its legacy provider for older PKCS#12
          # encryption, but retry only when its diagnostic identifies that case.
          # The password is deliberately preserved byte-for-byte: vault values may
          # contain meaningful whitespace, so this workflow does not trim or decode it.
          [[ -n "$CERTIFICATE_PASSWORD" ]] || { echo '::error::certificate password is required for identity PEM extraction' >&2; exit 1; }
          export CERTIFICATE_PASSWORD
          P12_SCRIPT="$DATA/extract-p12.sh"
          cat > "$P12_SCRIPT" <<'P12_SCRIPT'
           #!/usr/bin/env bash
           set -euo pipefail

           CERT="$1"
           OUTPUT="$2"
           ERROR_FILE="${OUTPUT}.openssl.stderr"
           VALIDATION_ERROR_FILE="${OUTPUT}.openssl-validation.stderr"
           PASSWORD_LENGTH="$(LC_ALL=C printf '%s' "${CERTIFICATE_PASSWORD-}" | wc -c | tr -d '[:space:]')"

           [[ -n "${CERTIFICATE_PASSWORD:-}" ]] || {
             printf 'openssl pkcs12 diagnostic: attempt=validation exit=1 class=missing-password\n' >&2
