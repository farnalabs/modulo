            elif [[ "$header_bytes" == 30* ]]; then
              header_class=asn1-der
            else
              header_class=unknown
            fi
            printf "certificate decode: input_class=%s bytes=%s header=%s\\n" "$input_class" "$byte_length" "$header_class"
            if [[ "$header_class" == unknown ]]; then
              printf "certificate decode: exit=1 class=unknown-header\\n" >&2
              rm -f "$temporary_path"
              exit 1
            fi
