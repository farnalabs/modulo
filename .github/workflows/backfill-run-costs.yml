name: "Backfill: Recompute Run Costs"

# Maintenance backfill for runs finalised with $0 before the org cost-component
# seed fix (PR #772 / backfill_run_costs.py). workflow_dispatch ONLY — this
# touches production run rows and must never fire automatically.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without writing (safety default — set false to actually backfill)"
        required: false
        default: true
        type: boolean
      limit:
        description: "Maximum number of candidate runs to recompute (0 = no limit)"
        required: false
        default: 0
        type: number
      org_id:
        description: "Restrict to a single organisation (empty = all orgs)"
        required: false
        default: ""
        type: string

jobs:
  backfill:
    name: Run cost backfill
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.MODULO_BREAK_GLASS_DATABASE_URL }}
      MODULO_DB: postgres
      # Settings requires SECRET_KEY/FERNET_KEY >= 32 bytes, but
      # MODULO_BREAK_GLASS_SECRET is only validated >= 24 chars and may be too
      # short. The backfill only needs DB access + the cost engine, so a fixed
      # 32-byte dummy satisfies the validator without carrying real key
      # material (it is never used for JWT/Fernet operations).
      SECRET_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      FERNET_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --frozen

      - name: Run cost backfill
        shell: bash
        run: |
          set -e
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=("--dry-run")
          else
            echo "WARNING: dry_run is false — this run will WRITE cost fields to the database."
          fi
          if [ -n "${{ inputs.limit }}" ] && [ "${{ inputs.limit }}" != "0" ]; then
            ARGS+=("--limit" "${{ inputs.limit }}")
          fi
          if [ -n "${{ inputs.org_id }}" ]; then
            ARGS+=("--org-id" "${{ inputs.org_id }}")
          fi
          echo "Running cost backfill with args: ${ARGS[*]:-none}"
          uv run --no-sync python -m modulo.tools.backfill_run_costs "${ARGS[@]}"
