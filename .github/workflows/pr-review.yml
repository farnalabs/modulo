name: Trigger PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number
      head_sha:
        description: 'HEAD SHA of the PR'
        required: true
        type: string
      head_branch:
        description: 'HEAD branch of the PR'
        required: true
        type: string

jobs:
  trigger-modulo-review:
    name: Trigger Modulo PR Review
    runs-on: ubuntu-latest
    steps:
      - name: Set PR details
        id: pr-details
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "repo=${{ github.repository }}" >> $GITHUB_OUTPUT
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
            echo "head_branch=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "repo=${{ github.repository }}" >> $GITHUB_OUTPUT
            echo "head_sha=${{ inputs.head_sha }}" >> $GITHUB_OUTPUT
            echo "head_branch=${{ inputs.head_branch }}" >> $GITHUB_OUTPUT
          fi

      - name: Send webhook to Modulo PR Review Agent
        id: webhook
        env:
          MODULO_WEBHOOK_URL: ${{ secrets.MODULO_PR_REVIEW_WEBHOOK_URL }}
          MODULO_WEBHOOK_SECRET: ${{ secrets.MODULO_PR_REVIEW_WEBHOOK_SECRET }}
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          REPO: ${{ steps.pr-details.outputs.repo }}
          SHA: ${{ steps.pr-details.outputs.head_sha }}
          BRANCH: ${{ steps.pr-details.outputs.head_branch }}
        run: |
          TIMESTAMP=$(date +%s)
          PAYLOAD=$(cat << ENDJSON
          {
            "action": "check_run",
            "repository": {"full_name": "${REPO}"},
            "pull_request": {
              "number": ${PR_NUMBER},
              "head": {"sha": "${SHA}", "ref": "${BRANCH}"}
            }
          }
          ENDJSON
          )
          BODY=$(echo "${PAYLOAD}")
          HMAC=$(echo -n "${TIMESTAMP}.${BODY}" | openssl dgst -sha256 -hmac "${MODULO_WEBHOOK_SECRET}" | sed 's/^.* //')
          curl -s -X POST "${MODULO_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
            -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
            -d "${BODY}"
