name: "Review: Modulo Agent"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number
      head_sha:
        description: 'HEAD SHA of the PR'
        required: false
        default: ''
        type: string
      head_branch:
        description: 'HEAD branch of the PR'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger-modulo-review:
    name: Trigger Modulo PR Review
    runs-on: ubicloud-standard-2
    steps:
      - name: Set PR details
        id: pr-details
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Event/input contexts are mapped through the step env block
          # (S7630): GitHub expressions inside a run block are interpolated
          # before the shell parses the script, so untrusted head-branch or
          # input content could break out into code execution. Via env: they
          # are data, never code. Output keys and semantics are unchanged.
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          HEAD_SHA_EVENT: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH_EVENT: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          HEAD_SHA_INPUT: ${{ inputs.head_sha }}
          HEAD_BRANCH_INPUT: ${{ inputs.head_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "pr_number=${PR_NUMBER_EVENT}" >> $GITHUB_OUTPUT
            echo "repo=${REPO}" >> $GITHUB_OUTPUT
            echo "head_sha=${HEAD_SHA_EVENT}" >> $GITHUB_OUTPUT
            echo "head_branch=${HEAD_BRANCH_EVENT}" >> $GITHUB_OUTPUT
          else
            PR_NUM="${PR_NUMBER_INPUT}"
            HEAD_SHA="${HEAD_SHA_INPUT}"
            HEAD_BRANCH="${HEAD_BRANCH_INPUT}"
            if [ -z "$HEAD_SHA" ] || [ -z "$HEAD_BRANCH" ]; then
              PR_JSON=$(gh api "repos/${REPO}/pulls/${PR_NUM}" --jq '{head_sha: .head.sha, head_branch: .head.ref}')
              HEAD_SHA=$(printf '%s' "$PR_JSON" | jq -r '.head_sha')
              HEAD_BRANCH=$(printf '%s' "$PR_JSON" | jq -r '.head_branch')
            fi
            echo "pr_number=${PR_NUM}" >> $GITHUB_OUTPUT
            echo "repo=${REPO}" >> $GITHUB_OUTPUT
            echo "head_sha=${HEAD_SHA}" >> $GITHUB_OUTPUT
            echo "head_branch=${HEAD_BRANCH}" >> $GITHUB_OUTPUT
          fi

      - name: Send webhook to Modulo PR Review Agent
        id: webhook
        env:
          MODULO_WEBHOOK_URL: ${{ secrets.MODULO_PR_REVIEW_WEBHOOK_URL }}
          MODULO_WEBHOOK_SECRET: ${{ secrets.MODULO_PR_REVIEW_WEBHOOK_SECRET }}
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          REPO: ${{ steps.pr-details.outputs.repo }}
          SHA: ${{ steps.pr-details.outputs.head_sha }}
          BRANCH: ${{ steps.pr-details.outputs.head_branch }}
        run: |
          PAYLOAD=$(cat << ENDJSON
          {
            "action": "check_run",
            "repository": {"full_name": "${REPO}"},
            "pull_request": {
              "number": ${PR_NUMBER},
              "head": {"sha": "${SHA}", "ref": "${BRANCH}"}
            }
          }
          ENDJSON
          )
          BODY=$(echo "${PAYLOAD}")
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "${RESPONSE_FILE}"' EXIT
          ACCEPTED=false
          # Retry with exponential backoff on 429/5xx (max 5 attempts).
          # The Modulo app answers 503 "Pipeline snapshot lock unavailable
          # after 5 attempts - retry the webhook delivery" while a snapshot
          # lock is contended, so a single-shot POST loses the review for
          # that PR outright: no run is created and nothing else re-drives
          # it. Mirrors the Branch Fixer webhook step's retry policy.
          for i in 1 2 3 4 5; do
            # Timestamp and HMAC are recomputed per attempt so a signature
            # is never replayed outside the app's timestamp freshness window
            # after a long backoff.
            TIMESTAMP=$(date +%s)
            HMAC=$(echo -n "${TIMESTAMP}.${BODY}" | openssl dgst -sha256 -hmac "${MODULO_WEBHOOK_SECRET}" | sed 's/^.* //')
            # Truncate the shared response file before each attempt so a curl
            # failure that writes no output cannot leak the previous attempt's
            # stale body into the logs (control flow keys off HTTP_CODE, but
            # the echoed body should stay honest).
            : > "${RESPONSE_FILE}"
            HTTP_CODE=$(curl -s --connect-timeout 10 --max-time 60 -o "${RESPONSE_FILE}" -w '%{http_code}' -X POST "${MODULO_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
              -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
              -d "${BODY}") || HTTP_CODE="000"
            echo "Modulo PR Review webhook responded with HTTP ${HTTP_CODE} (attempt ${i}/5)"
            echo "Response body:"
            cat "${RESPONSE_FILE}" || true
            echo
            case "${HTTP_CODE}" in
              2*)
                echo "Webhook POST accepted."
                ACCEPTED=true
                break
                ;;
              429|000|5*)
                if [ "${i}" -eq 5 ]; then
                  break
                fi
                DELAY=$((2 ** (i - 1) * 5))
                echo "::warning::Modulo PR Review webhook returned HTTP ${HTTP_CODE} (attempt ${i}/5) - retrying in ${DELAY}s"
                sleep "${DELAY}"
                ;;
              *)
                echo "::error::Modulo PR Review webhook POST failed with HTTP ${HTTP_CODE} (non-retryable) - no pipeline run was created."
                exit 1
                ;;
            esac
          done
          # Still fail the job when every attempt was refused: the missing
          # review is a real blockage and the Lifecycle Watchdog keys off
          # this workflow's conclusion to detect and re-drive it.
          if [ "${ACCEPTED}" != "true" ]; then
            echo "::error::Modulo PR Review webhook POST failed with HTTP ${HTTP_CODE} after 5 attempts - no pipeline run was created."
            exit 1
          fi
