name: "Review: Modulo Agent"

# FAR-1843: the PR-reviewer dispatch lives HERE — in its own workflow, driven
# by product-CI completion (workflow_run) or manual dispatch — never as a job
# inside ci.yml. When the dispatch lived inside "CI: Fast Validation"
# (job notify-pr-review), a dispatch outage (e.g. an app HTTP 429 backpressure)
# concluded the whole CI run as failure. merge-queue.yml gates every merge on
# the latest "CI: Fast Validation" conclusion, so a review-dispatch outage was
# indistinguishable from product-CI failure and blocked every merge; the red
# CI then fanned Branch Fixer runs for every PR into the org sandbox cap,
# demoting reviewer runs to pending and starving the reviewer itself —
# a self-amplifying outage that could not self-heal (2026-10-15, 5 h, 28+ PRs).
# A dispatch failure now fails only THIS workflow's own run.
#
# Review is a QUALITY GATE INDEPENDENT OF CI COLOUR. Dispatch is driven by
# product-CI COMPLETION, not by its conclusion: a red-CI PR still gets a
# quality review, while the Branch Fixer fixes its checks concurrently. The
# reviewer reports the failing checks in its review body and does not derive
# its verdict from CI colour — a CI-mirroring CHANGES_REQUESTED is forbidden in
# the reviewer prompt, so the two agents never double-report the same failure.
# Only a CANCELLED product-CI run is skipped: that run was superseded, and the
# newer run for the same head SHA owns the dispatch. ``timed_out`` and
# ``action_required`` are failure conclusions and MUST dispatch.
#
# The reviewer still reviews the PR's CURRENT head SHA, resolved below — not
# the exact tree the completed run validated — so it can be racing a
# Branch-Fixer push made after that run.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number
      head_sha:
        description: 'HEAD SHA of the PR'
        required: false
        default: ''
        type: string
      head_branch:
        description: 'HEAD branch of the PR'
        required: false
        default: ''
        type: string
  # Drive the review from product-CI COMPLETION, decoupled from the CI run
  # itself (FAR-1843 D1). Every conclusion except CANCELLED dispatches a review
  # (see the job-level `if`): a red CI is the Branch Fixer's job to fix
  # concurrently, not a reason to withhold the quality review.
  # workflow_run events fire from the default branch's copy of this file and
  # carry the triggering run's conclusion / head_sha / head_branch.
  workflow_run:
    workflows: ["CI: Fast Validation"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger-modulo-review:
    name: Trigger Modulo PR Review
    # Only a CANCELLED product-CI run is skipped (it was superseded; the newer
    # run for that head SHA owns the dispatch). Every other conclusion
    # dispatches — success, failure, timed_out, action_required, neutral,
    # stale, skipped — because review is a quality gate independent of CI
    # colour, and red CI is owned concurrently by the Branch Fixer. `timed_out`
    # and `action_required` are FAILURE conclusions and MUST dispatch.
    # Expressing the gate by EXCLUSION is deliberate: an inclusion list would
    # silently withhold the review from every conclusion it omits.
    # This gate is safe to express at job level: workflow_run-triggered runs
    # attach their check runs to the default-branch SHA, not to the PR head, so
    # skipping this job never changes the PR's own check status.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubicloud-standard-2
    steps:
      - name: Set PR details
        id: pr-details
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Event/input contexts are mapped through the step env block
          # (S7630): GitHub expressions inside a run block are interpolated
          # before the shell parses the script, so untrusted head-branch or
          # input content could break out into code execution. Via env: they
          # are data, never code. Output keys and semantics are unchanged.
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          HEAD_SHA_EVENT: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH_EVENT: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          HEAD_SHA_INPUT: ${{ inputs.head_sha }}
          HEAD_BRANCH_INPUT: ${{ inputs.head_branch }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            {
              echo "pr_number=${PR_NUMBER_EVENT}"
              echo "repo=${REPO}"
              echo "head_sha=${HEAD_SHA_EVENT}"
              echo "head_branch=${HEAD_BRANCH_EVENT}"
              echo "ready=true"
            } >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            # Product-CI completed for WORKFLOW_RUN_HEAD_SHA. Resolve the PR
            # it validated, then apply the skip conditions the old ci.yml
            # notify-pr-review job carried: superseded-run and
            # manual-delivery (dedup runs as its own step after checkout).
            HEAD_SHA="${WORKFLOW_RUN_HEAD_SHA}"
            PR_NUM=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
              --jq '[.[] | select(.state == "open")][0].number // empty' 2>/dev/null || true)
            if [ -z "$PR_NUM" ]; then
              # Not a PR CI run (push to main, workflow_dispatch of ci.yml, or
              # the PR was merged in the meantime) — nothing to review.
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "::notice::CI completion for ${HEAD_SHA} (${WORKFLOW_RUN_HEAD_BRANCH}) maps to no open PR — no review dispatch."
              exit 0
            fi
            # Superseded guard (FAR-1427 semantics, applied to CI-completion
            # dispatch): a newer push to the PR has its own CI run and owns
            # the review outcome; this completion is stale. Fail OPEN on an
            # API error (empty CURRENT_SHA) — a genuine review must not be
            # dropped on a blip; the dedup step and the engine's byte-level
            # webhook idempotency coalesce any double dispatch.
            CURRENT_SHA=$(gh api "repos/${REPO}/pulls/${PR_NUM}" --jq '.head.sha' 2>/dev/null || echo "")
            if [ -n "$CURRENT_SHA" ] && [ "$CURRENT_SHA" != "$HEAD_SHA" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "::notice::CI completed for ${HEAD_SHA} but PR #${PR_NUM} head is now ${CURRENT_SHA} — superseded run, no review dispatch."
              exit 0
            fi
            HEAD_BRANCH=$(gh api "repos/${REPO}/pulls/${PR_NUM}" --jq '.head.ref' 2>/dev/null || echo "${WORKFLOW_RUN_HEAD_BRANCH}")
            # manual-delivery label: do not auto-dispatch the reviewer (same
            # documented meaning as on the Branch Fixer dispatch in ci.yml).
            LABELS=$(gh api "repos/${REPO}/pulls/${PR_NUM}" --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
            case ",${LABELS}," in
              *,manual-delivery,*)
                echo "ready=false" >> "$GITHUB_OUTPUT"
                echo "::notice::PR #${PR_NUM} carries the manual-delivery label — no automatic review dispatch."
                exit 0
                ;;
            esac
            {
              echo "pr_number=${PR_NUM}"
              echo "repo=${REPO}"
              echo "head_sha=${HEAD_SHA}"
              echo "head_branch=${HEAD_BRANCH}"
              echo "ready=true"
            } >> "$GITHUB_OUTPUT"
          else
            PR_NUM="${PR_NUMBER_INPUT}"
            HEAD_SHA="${HEAD_SHA_INPUT}"
            HEAD_BRANCH="${HEAD_BRANCH_INPUT}"
            if [ -z "$HEAD_SHA" ] || [ -z "$HEAD_BRANCH" ]; then
              PR_JSON=$(gh api "repos/${REPO}/pulls/${PR_NUM}" --jq '{head_sha: .head.sha, head_branch: .head.ref}')
              HEAD_SHA=$(printf '%s' "$PR_JSON" | jq -r '.head_sha')
              HEAD_BRANCH=$(printf '%s' "$PR_JSON" | jq -r '.head_branch')
            fi
            {
              echo "pr_number=${PR_NUM}"
              echo "repo=${REPO}"
              echo "head_sha=${HEAD_SHA}"
              echo "head_branch=${HEAD_BRANCH}"
              echo "ready=true"
            } >> "$GITHUB_OUTPUT"
          fi

      # FAR-264: the same-repo author gate, shared with merge-queue.yml via the
      # versioned helper (.github/scripts/same-repo-author-guard.py) so the
      # auto-merge and auto-review paths cannot diverge. A fork / external-author
      # PR is NOT auto-reviewed - it needs a human review path. Unverifiable
      # state (API error, missing script output) fails CLOSED: the webhook is
      # NOT sent and the job fails loudly, never a silent green without review.
      - name: Checkout repository (for the gate scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr-details.outputs.ready == 'true'

      # Dedup: do not re-review a head SHA the reviewer already reviewed
      # (workflow_run path only — a manual workflow_dispatch is an explicit
      # operator re-trigger and bypasses this, as it always has). Ported from
      # the old ci.yml notify-pr-review job (FAR-1843 D1: same semantics).
      # The script fails OPEN (dispatch) on any load error or ambiguous state.
      - name: Skip when head already reviewed (dedup)
        id: dedup
        if: github.event_name == 'workflow_run' && steps.pr-details.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          REPO: ${{ steps.pr-details.outputs.repo }}
          HEAD_SHA: ${{ steps.pr-details.outputs.head_sha }}
        shell: bash
        run: |
          # Guard the wiring: the dedup script is a no-op if the repo was not
          # checked out (GitHub Actions runners start with an empty workspace),
          # so this workflow checks out the repo first. The deterministic path
          # must fail LOUDLY, not fall through to the fail-open
          # `|| echo "skip=false"` below, or a wiring bug silently dispatches
          # every webhook and defeats the dedup feature.
          test -f .github/scripts/pr-review-dedup.py || { echo "::error::pr-review-dedup.py not found - dedup disabled"; exit 1; }
          # Fetch the PR's reviews and commits JSON, then run the versioned
          # dedup decision script (.github/scripts/pr-review-dedup.py).
          # The script handles multi-line bodies and pipe chars correctly
          # (naive cut -d'|' is line-oriented and corrupts the SHA), and
          # fails open (dispatch) on any load error or ambiguous state.
          gh api "/repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" --paginate > /tmp/pr-reviews.json 2>/dev/null || echo "[]" > /tmp/pr-reviews.json
          gh api "/repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100" --paginate > /tmp/pr-commits.json 2>/dev/null || echo "[]" > /tmp/pr-commits.json
          SKIP_OUTPUT=$(python3 .github/scripts/pr-review-dedup.py /tmp/pr-reviews.json /tmp/pr-commits.json "${HEAD_SHA}" 2>/tmp/pr-dedup-err || echo "skip=false")
          echo "${SKIP_OUTPUT}" >> "$GITHUB_OUTPUT"
          echo "PR Reviewer dedup: ${SKIP_OUTPUT}"
          cat /tmp/pr-dedup-err

      - name: Same-repo author gate (FAR-264)
        id: author-gate
        if: steps.pr-details.outputs.ready == 'true' && steps.dedup.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          REPO: ${{ steps.pr-details.outputs.repo }}
        shell: bash
        run: |
          set -euo pipefail
          PR_FILE=$(mktemp)
          if ! gh api "repos/${REPO}/pulls/${PR_NUMBER}" > "$PR_FILE" 2>/tmp/author-gate.err; then
            echo "::error::FAR-264: could not fetch PR #${PR_NUMBER} for the same-repo author gate ($(head -1 /tmp/author-gate.err 2>/dev/null)) - failing CLOSED (no auto-review)."
            exit 1
          fi
          OUT=$(python3 .github/scripts/same-repo-author-guard.py "$PR_FILE" "$REPO" 2>/dev/null) || true
          rm -f "$PR_FILE"
          VERDICT="${OUT%%|*}"
          MSG="${OUT#*|}"
          case "$VERDICT" in
            ok)
              echo "Same-repo author gate OK: $MSG" ;;
            external)
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              echo "::notice::FAR-264: skipping auto-review for PR #${PR_NUMBER} - $MSG. A human review path is required." ;;
            *)
              echo "::error::FAR-264: same-repo author gate produced no usable verdict ($OUT) - failing CLOSED (no auto-review)."
              exit 1 ;;
          esac

      - name: Send webhook to Modulo PR Review Agent
        id: webhook
        if: steps.pr-details.outputs.ready == 'true' && steps.dedup.outputs.skip != 'true' && steps.author-gate.outputs.skipped != 'true'
        env:
          DISPATCH_URL: ${{ secrets.MODULO_PR_REVIEW_WEBHOOK_URL }}
          DISPATCH_SECRET: ${{ secrets.MODULO_PR_REVIEW_WEBHOOK_SECRET }}
          DISPATCH_LABEL: "Modulo PR Review"
          DISPATCH_ACCEPT_ANY_2XX: "1"
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          REPO: ${{ steps.pr-details.outputs.repo }}
          SHA: ${{ steps.pr-details.outputs.head_sha }}
          BRANCH: ${{ steps.pr-details.outputs.head_branch }}
        run: |
          # jq -n --arg/--argjson JSON-escapes every value, so a crafted branch
          # name (legal in git refnames, e.g. containing '"') cannot inject
          # keys or break the payload. See FAR-568.
          BODY=$(jq -n \
            --arg repo "${REPO}" \
            --argjson prNumber "${PR_NUMBER}" \
            --arg sha "${SHA}" \
            --arg ref "${BRANCH}" \
            '{action: "check_run", repository: {full_name: $repo}, pull_request: {number: $prNumber, head: {sha: $sha, ref: $ref}}}')
          # One shared retry policy (scripts/dispatch_with_retry.sh):
          # 429 (capacity) and 000/502/503/504 (transient) retry with
          # exponential backoff + jitter, an attempt cap and a wall-clock
          # budget, honouring Retry-After. Everything else is terminal.
          # The script's flags preserve this step's two contract points:
          # DISPATCH_ACCEPT_ANY_2XX=1 keeps the accept-any-2xx behaviour
          # (the app answers either 2xx or a transient 5xx while a
          # pipeline snapshot lock is contended, so a single-shot POST
          # that misses the accept window loses the review for that PR
          # outright), and DISPATCH_DUP_400_IS_OK (the script's default)
          # keeps the 400 "Duplicate webhook payload" handled no-op: the
          # identical delivery was already ACCEPTED within the ~5-min dedup
          # window (FAR-1097 follow-up; the review run already exists), and
          # failing on it produced a false CI failure the Lifecycle
          # Watchdog keyed off (observed on run 38089984823 for PR #1543).
          # Still fail the job when the dispatch is never delivered: the
          # missing review is a real blockage, and now that this dispatch
          # is decoupled from product CI (FAR-1843) a failure here fails
          # ONLY this workflow's run — it can never mark the PR's CI red
          # or block the merge queue. The app-side lifecycle watchdog
          # (PR Housekeeper) DOES re-drive genuinely missed reviews — it
          # re-dispatches pr-review.yml for PRs open >90 min with no
          # review, and for CHANGES_REQUESTED PRs whose fix commit is >2 h
          # old — so a failure here must still fail loudly for the gap
          # to be visible in minutes rather than at the watchdog cadence.
          #
          # Intended behaviour change vs the removed ci.yml job (on the
          # record, deliberately — not an accident): that job ran under
          # always() with needs: covering every fallible job and
          # therefore reviewed even a red-CI PR. This workflow now
          # matches that by design — dispatch is independent of CI
          # colour, so every conclusion except a cancelled (superseded)
          # run dispatches and a red-CI PR is reviewed here while the
          # Branch Fixer fixes its checks concurrently. The reviewer
          # reports the failing checks in its body and does not derive
          # its verdict from CI colour (a CI-mirroring
          # CHANGES_REQUESTED is forbidden in the reviewer prompt), so
          # the two agents do not double-report the same failure.
          # Dedup, the superseded guard and the lifecycle watchdog still
          # cover a genuinely missed or repeated review. The reviewer
          # covers the PR's CURRENT head SHA, so it can be racing a
          # Branch-Fixer push made after the completed run.
          DISPATCH_BODY="${BODY}" bash scripts/dispatch_with_retry.sh
