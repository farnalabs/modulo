name: Trigger PR Review Agent

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["**"]

jobs:
  trigger-modulo-review:
    name: Trigger Modulo PR Review
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Extract PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const pr = run.pull_requests[0];
            const repo = run.repository.full_name;
            core.setOutput('pr_number', pr.number);
            core.setOutput('repo', repo);
            core.setOutput('head_sha', run.head_sha);
            core.setOutput('head_branch', run.head_branch);

      - name: Send webhook to Modulo PR Review Agent
        id: webhook
        env:
          MODULO_WEBHOOK_URL: ${{ secrets.MODULO_PR_REVIEW_WEBHOOK_URL }}
          MODULO_WEBHOOK_SECRET: ${{ secrets.MODULO_PR_REVIEW_WEBHOOK_SECRET }}
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          REPO: ${{ steps.pr-details.outputs.repo }}
          SHA: ${{ steps.pr-details.outputs.head_sha }}
          BRANCH: ${{ steps.pr-details.outputs.head_branch }}
        run: |
          TIMESTAMP=$(date +%s)
          PAYLOAD=$(cat << ENDJSON
          {
            "action": "check_run",
            "repository": {"full_name": "${REPO}"},
            "pull_request": {
              "number": ${PR_NUMBER},
              "head": {"sha": "${SHA}", "ref": "${BRANCH}"}
            }
          }
          ENDJSON
          )
          BODY=$(echo "${PAYLOAD}")
          HMAC=$(echo -n "${TIMESTAMP}.${BODY}" | openssl dgst -sha256 -hmac "${MODULO_WEBHOOK_SECRET}" | sed 's/^.* //')
          curl -s -X POST "${MODULO_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Modulo-Timestamp: ${TIMESTAMP}" \
            -H "X-Modulo-Webhook-Secret: sha256=${HMAC}" \
            -d "${BODY}"
