name: Staging Auto-Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - deploy/**
      - fly.staging.toml

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to staging
    runs-on: [self-hosted, windows, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Capture git metadata
        shell: powershell
        run: |
          "GIT_SHA=$(git rev-parse HEAD)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $timestamp = git log -1 --format=%cI
          Add-Content -Path $env:GITHUB_ENV -Value "GIT_COMMIT_TIMESTAMP=$timestamp" -Encoding utf8
          $msg = git log -1 --format=%s
          $msg = $msg -replace "`r`n"," " -replace "`n"," "
          Add-Content -Path $env:GITHUB_ENV -Value "GIT_COMMIT_MESSAGE=$msg" -Encoding utf8
          $buildTimestamp = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_TIMESTAMP=$buildTimestamp" -Encoding utf8

      - id: deploy
        name: Deploy to staging
        shell: powershell
        run: |
          fly deploy --app staging-modulo --config fly.staging.toml --strategy immediate `
            --build-arg "GIT_SHA=$env:GIT_SHA" `
            --build-arg "GIT_BRANCH=$env:GIT_BRANCH" `
            --build-arg "GIT_COMMIT_TIMESTAMP=$env:GIT_COMMIT_TIMESTAMP" `
            --build-arg "GIT_COMMIT_MESSAGE=$env:GIT_COMMIT_MESSAGE" `
            --build-arg "BUILD_TIMESTAMP=$env:BUILD_TIMESTAMP"

      - name: Wait for healthz
        shell: powershell
        run: |
          Write-Host "Waiting for https://staging-modulo.fly.dev/healthz ..."
          for ($i=0; $i -lt 60; $i++) {
            try {
              $r = curl.exe -s --connect-timeout 5 --max-time 10 "https://staging-modulo.fly.dev/healthz" 2>&1
              if ($LASTEXITCODE -eq 0) { Write-Host "Healthy after ${i}s"; exit 0 }
            } catch {
              Write-Host "[$i/60] Health check failed: $_"
            }
            Start-Sleep -Seconds 2
          }
          Write-Host "Health check failed after 120s"
          exit 1

      - name: Smoke test frontend
        shell: powershell
        run: |
          for ($attempt=1; $attempt -le 2; $attempt++) {
            $resp = curl.exe -s -m 30 "https://staging-modulo.fly.dev/" 2>$null
            if ($resp -match '<title>Modulo') { Write-Host "staging-modulo.fly.dev - OK"; exit 0 }
            if ($attempt -eq 1) { Write-Host "Smoke test attempt 1 failed - retrying..."; Start-Sleep -Seconds 15 }
          }
          Write-Host "staging-modulo.fly.dev - FAILED (title not found)"
          exit 1

      - name: Rollback on verification failure
        if: failure() && steps.deploy.outcome == 'success'
        shell: powershell
        run: |
          Write-Host "Deploy succeeded but verification failed - rolling back"
          fly rollback --app staging-modulo

  consistency:
    name: Verify staging SHA
    needs: deploy
    runs-on: [self-hosted, windows, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify deployed SHA
        shell: powershell
        run: |
          $expectedSha = git rev-parse HEAD
          $expectedSha7 = $expectedSha.Substring(0, 7)
          $info = curl.exe -s -m 10 "https://staging-modulo.fly.dev/api/v1/deployment" 2>$null
          if (-not $info) {
            Write-Host "staging-modulo.fly.dev - no deployment info available"
            exit 1
          }
          $deployInfo = $info | ConvertFrom-Json
          $deployedSha = if ($deployInfo.git_sha -and $deployInfo.git_sha.Length -ge 7) { $deployInfo.git_sha.Substring(0, 7) } else { "?" }
          if ($deployedSha -ne $expectedSha7) {
            Write-Host "SHA MISMATCH: deployed=$deployedSha expected=$expectedSha7"
            exit 1
          }
          Write-Host "https://staging-modulo.fly.dev - SHA match: $deployedSha"
