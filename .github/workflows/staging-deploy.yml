name: Staging Auto-Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - deploy/**
      - fly.staging.toml

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to staging
    runs-on: [self-hosted, windows, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Capture git metadata
        id: git
        uses: ./.github/actions/capture-git-metadata

      - id: deploy
        name: Deploy to staging
        shell: powershell
        run: |
          fly deploy --app staging-modulo --config fly.staging.toml `
            --build-arg "GIT_SHA=${{ steps.git.outputs.git-sha }}" `
            --build-arg "GIT_BRANCH=${{ steps.git.outputs.git-branch }}" `
            --build-arg "GIT_COMMIT_TIMESTAMP=${{ steps.git.outputs.git-commit-timestamp }}" `
            --build-arg "GIT_COMMIT_MESSAGE=${{ steps.git.outputs.git-commit-message }}" `
            --build-arg "BUILD_TIMESTAMP=${{ steps.git.outputs.build-timestamp }}"

      - name: Verify deployment
        uses: ./.github/actions/verify-deployment
        with:
          url: https://staging.modulo.run

      - name: Rollback on verification failure
        if: failure() && steps.deploy.outcome == 'success'
        shell: powershell
        run: |
          Write-Host "Deploy succeeded but verification failed - rolling back"
          fly rollback --app staging-modulo

  consistency:
    name: Verify staging SHA
    needs: deploy
    runs-on: [self-hosted, windows, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify deployed SHA
        shell: powershell
        run: |
          $expectedSha = git rev-parse HEAD
          $expectedSha7 = $expectedSha.Substring(0, 7)
          $info = curl.exe -s -m 10 "https://staging.modulo.run/api/v1/deployment" 2>$null
          if (-not $info) {
            Write-Host "staging.modulo.run - no deployment info available"
            exit 1
          }
          $deployInfo = $info | ConvertFrom-Json
          $deployedSha = if ($deployInfo.git_sha -and $deployInfo.git_sha.Length -ge 7) { $deployInfo.git_sha.Substring(0, 7) } else { "?" }
          if ($deployedSha -ne $expectedSha7) {
            Write-Host "SHA MISMATCH: deployed=$deployedSha expected=$expectedSha7"
            exit 1
          }
          Write-Host "staging.modulo.run - SHA match: $deployedSha"
