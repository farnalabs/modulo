name: Auto Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: number
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  check_suite:
    types: [completed]

jobs:
  review:
    name: AI-Powered Code Review
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check retry limit
        id: retry-check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
        run: |
          PR_NUM="${{ github.event.inputs.pr_number || github.event.pull_request.number }}"

          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            echo "No PR number â€” can't check retry limit."
            echo "exhausted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Count how many reviews modulo-reviewbot has already submitted on this PR
          REVIEW_COUNT=$(gh api "/repos/${{ github.repository }}/pulls/${PR_NUM}/reviews?per_page=100" \
            --jq '[.[] | select(.user.login == "modulo-reviewbot")] | length' 2>/dev/null || echo "0")

          echo "review_count=$REVIEW_COUNT" >> "$GITHUB_OUTPUT"
          echo "PR #${PR_NUM} â€” modulo-reviewbot has submitted $REVIEW_COUNT review(s)."

          if [ "$REVIEW_COUNT" -ge 3 ]; then
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Auto-review exhausted after $REVIEW_COUNT reviews against PR #${PR_NUM}."
          else
            echo "exhausted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install opencode CLI
        if: steps.retry-check.outputs.exhausted == 'false'
        id: install
        shell: bash
        run: |
          npm install -g opencode-ai 2>&1 || npm install -g @opencode-ai/cli 2>&1 || true
          if command -v opencode &>/dev/null; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
            opencode --version 2>/dev/null || true
          else
            OPENCODE_VERSION="v0.0.55"
            TARBALL_URL="https://github.com/opencode-ai/opencode/releases/download/${OPENCODE_VERSION}/opencode-linux-x86_64.tar.gz"
            DEB_URL="https://github.com/opencode-ai/opencode/releases/download/${OPENCODE_VERSION}/opencode-linux-amd64.deb"
            echo "::group::Download opencode ${OPENCODE_VERSION}"
            if curl -sL "$TARBALL_URL" -o /tmp/opencode.tar.gz && [ -s /tmp/opencode.tar.gz ]; then
            sudo tar -xzf /tmp/opencode.tar.gz -C /usr/local/bin/ opencode 2>/dev/null
            if command -v opencode &>/dev/null; then
              echo "installed=true" >> "$GITHUB_OUTPUT"
              echo "::endgroup::"
              opencode --version 2>/dev/null || echo "opencode installed"
              exit 0
            fi
          fi
            fi
          if curl -sL "$DEB_URL" -o /tmp/opencode.deb && [ -s /tmp/opencode.deb ]; then
            sudo dpkg -i /tmp/opencode.deb 2>/dev/null || sudo apt-get install -f -y -qq 2>/dev/null
            if command -v opencode &>/dev/null; then
              echo "installed=true" >> "$GITHUB_OUTPUT"
              echo "::endgroup::"
              opencode --version 2>/dev/null || echo "opencode installed"
              exit 0
            fi
          fi
          echo "installed=false" >> "$GITHUB_OUTPUT"
          echo "::warning::opencode CLI could not be installed"
          echo "::endgroup::"

          fi
      - name: Configure opencode auth
        if: steps.retry-check.outputs.exhausted == 'false' && steps.install.outputs.installed == 'true'
        shell: bash
        run: |
          mkdir -p ~/.local/share/opencode
          cat > ~/.local/share/opencode/auth.json << AUTHJSON
          {"opencode":{"type":"api","key":"${{ secrets.APP_MODULO_OPENCODE_API_KEY }}"},"opencode-go":{"type":"api","key":"${{ secrets.APP_MODULO_OPENCODE_API_KEY }}"}}
          AUTHJSON

      - name: Get changed files
        if: steps.retry-check.outputs.exhausted == 'false'
        id: changed-files
        shell: bash
        run: |
          FILES=$(git diff --name-only origin/main...HEAD --diff-filter=ACM 2>/dev/null || true)
          FILES=$(echo "$FILES" | tr '\n' ' ')
          echo "files=${FILES}" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "${FILES}" | wc -w)" >> "$GITHUB_OUTPUT"

      - name: Check CI status
        if: steps.retry-check.outputs.exhausted == 'false'
        id: ci-check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN || github.token }}
        run: |
          PR_NUM="${{ github.event.inputs.pr_number || github.event.pull_request.number }}"
          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            HEAD_BRANCH="${{ github.event.check_suite.head_branch }}"
            PR_NUM=$(gh pr list --state open --head "$HEAD_BRANCH" --json number -q ".[0].number" 2>/dev/null || echo "")
          fi
          FAILED=$(gh pr view "$PR_NUM" --json statusCheckRollup --jq "'.statusCheckRollup[] | select(.status == \"COMPLETED\") | .conclusion'" 2>/dev/null | grep -c "FAILURE" || true)
          echo "ci_failed=$([ "$FAILED" -gt 0 ] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"

      - name: Run opencode review
        id: review
        if: steps.retry-check.outputs.exhausted == 'false' && steps.install.outputs.installed == 'true' && steps.changed-files.outputs.count > 0 && steps.ci-check.outputs.ci_failed == 'false'
        shell: bash
        run: |
          FILES="${{ steps.changed-files.outputs.files }}"
          REVIEW_PROMPT=".agents/skills/auto-review/REVIEW_PROMPT.md"
          if [ -f "$REVIEW_PROMPT" ]; then
            PROMPT_TEXT=$(cat "$REVIEW_PROMPT")
            QA_OUTPUT=$(opencode run --agent coder "Review these files using the guidelines: ${PROMPT_TEXT}. Files: ${FILES}" 2>&1) || true
          else
            QA_OUTPUT=$(opencode run --agent coder "Review changed files for bugs, security, and quality issues. Label each finding [critical], [major], [minor], or [nit]. Files: ${FILES}" 2>&1) || true
          fi
          echo "${QA_OUTPUT}" > /tmp/qa-output.txt || true
          CRIT_CNT=$(echo "${QA_OUTPUT}" | grep -ciF "[critical]" || true)
          echo "critical_count=${CRIT_CNT:-0}" >> "$GITHUB_OUTPUT"
          MAJ_CNT=$(echo "${QA_OUTPUT}" | grep -ciF "[major]" || true)
          echo "major_count=${MAJ_CNT:-0}" >> "$GITHUB_OUTPUT"

      - name: Post review
        if: steps.retry-check.outputs.exhausted == 'false' && steps.ci-check.outputs.ci_failed == 'false'
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN }}
          PR_NUM: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          echo "Posting review for PR #${PR_NUM}"
          if [ "${{ steps.install.outputs.installed }}" != "true" ]; then
            gh pr review "$PR_NUM" --repo "$REPO" --comment --body "## AI Code Review - Unavailable\n\nThe automated code reviewer could not run. A human review is required."
          elif [ "${{ steps.changed-files.outputs.count }}" -eq 0 ]; then
            gh pr review "$PR_NUM" --repo "$REPO" --comment --body "## AI Code Review - No Changes\n\nNo reviewable changes found. A human should verify this PR."
          else
            CRIT=${{ steps.review.outputs.critical_count }}
            MAJ=${{ steps.review.outputs.major_count }}
            if [ "${CRIT}" -gt 0 ] || [ "${MAJ}" -gt 0 ]; then
              gh pr review "$PR_NUM" --repo "$REPO" --request-changes --body "## AI Code Review - Changes Requested (${CRIT}C ${MAJ}M)"
            else
              gh pr review "$PR_NUM" --repo "$REPO" --approve --body "## AI Code Review - Approved (clean)"
            fi
          fi
