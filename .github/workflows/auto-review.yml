name: Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

env:
  OPENCODE_VERSION: "0.1.46"

jobs:
  review:
    name: Review code changes
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        shell: bash
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | tr '\n' ' ' | xargs)
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "count=$(echo $CHANGED | wc -w)" >> "$GITHUB_OUTPUT"

      - name: Exit early — no code changes
        if: steps.changed.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN }}
        shell: bash
        run: |
          gh pr review "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --approve \
            --body "## ?? Modulo Review\n\n**No code changes detected.** Auto-approved."

      - name: Install opencode CLI
        if: steps.changed.outputs.count != '0' && env.APP_MODULO_OPENCODE_API_KEY != ''
        shell: bash
        run: |
          if ! command -v opencode &>/dev/null; then
            curl -sL "https://github.com/opencode-ai/opencode/releases/download/v${OPENCODE_VERSION}/opencode_${OPENCODE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin opencode
            chmod +x /usr/local/bin/opencode
          fi
          opencode --version

      - name: Run opencode QA on changed files
        id: qa
        if: steps.changed.outputs.count != '0'
        env:
          APP_MODULO_OPENCODE_API_KEY: ${{ secrets.APP_MODULO_OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN }}
        shell: bash
        run: |
          FILES="${{ steps.changed.outputs.files }}"

          if command -v opencode &>/dev/null && [ -n "$APP_MODULO_OPENCODE_API_KEY" ]; then
            mkdir -p ~/.local/share/opencode
            cat > ~/.local/share/opencode/auth.json << 'EOF'
            {
              "opencode": {"type": "api", "key": "'"$APP_MODULO_OPENCODE_API_KEY"'"},
              "opencode-go": {"type": "api", "key": "'"$APP_MODULO_OPENCODE_API_KEY"'"}
            }
            EOF

            echo "Running opencode qa on: $FILES"
            RESULT=$(opencode qa $FILES 2>&1) || true
            echo "result<<EOF" >> "$GITHUB_OUTPUT"
            echo "$RESULT" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "source=opencode" >> "$GITHUB_OUTPUT"
          else
            echo "source=fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Post review decision
        if: always()
        env:
          GH_TOKEN: ${{ secrets.MODULO_REVIEWBOT_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          QA_RESULT: ${{ steps.qa.outputs.result }}
          QA_SOURCE: ${{ steps.qa.outputs.source }}
        shell: bash
        run: |
          echo "=== Modulo Review for PR #$PR_NUM ==="
          echo "Title: ${{ github.event.pull_request.title }}"
          echo "Files changed: ${{ steps.changed.outputs.count }}"

          if [ "$QA_SOURCE" = "opencode" ]; then
            CRITICAL=$(echo "$QA_RESULT" | grep -oiE 'critical[ :]+[0-9]+' | grep -oP '[0-9]+' | head -1)
            MAJOR=$(echo "$QA_RESULT" | grep -oiE 'major[ :]+[0-9]+' | grep -oP '[0-9]+' | head -1)
            CRITICAL=${CRITICAL:-0}
            MAJOR=${MAJOR:-0}

            echo "Findings: $CRITICAL critical, $MAJOR major"

            BODY="## ?? Modulo Review\n\n"
            BODY+="${QA_RESULT}"

            if [ "$CRITICAL" -gt 0 ] || [ "$MAJOR" -gt 0 ]; then
              BODY+="\n\n### Decision\n**CHANGES_REQUESTED** — fix critical/major findings before merge."
              gh pr review "$PR_NUM" --repo "$REPO" --request-changes --body "$BODY"
              echo "Outcome: CHANGES_REQUESTED"
            else
              BODY+="\n\n### Decision\n**APPROVED** — no critical or major issues found."
              gh pr review "$PR_NUM" --repo "$REPO" --approve --body "$BODY"
              echo "Outcome: APPROVED"
            fi
          else
            echo "opencode CLI unavailable — approving with CI trust fallback."
            gh pr review "$PR_NUM" \
              --repo "$REPO" \
              --approve \
              --body "## ?? Modulo Review\n\n**APPROVED** (opencode CLI unavailable for deep review — CI will validate)."
            echo "Outcome: APPROVED (fallback)"
          fi
