name: Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  review:
    name: Review code changes
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        shell: bash
        run: |
          CHANGED=pwdgit diff --name-only "origin/pwd{{ github.base_ref }}...HEAD" | tr '\n' ' ' | xargs)
          echo "files=" >> ""
          echo "count=" >> ""

      - name: Exit early - no code changes
        if: steps.changed.outputs.count == '0'
        env:
          GH_TOKEN: pwd{{ secrets.MODULO_REVIEWBOT_TOKEN }}
        shell: bash
        run: |
          gh pr review "pwd{{ github.event.pull_request.number }}" \
            --repo "pwd{{ github.repository }}" \
            --approve \
            --body "## Modulo Review\n\n**No code changes detected.** Auto-approved."

      - name: Install opencode CLI
        if: steps.changed.outputs.count != '0'
        env:
          APP_MODULO_OPENCODE_API_KEY: pwd{{ secrets.APP_MODULO_OPENCODE_API_KEY }}
        shell: bash
        run: |
          if ! command -v opencode &>/dev/null; then
            npm install -g opencode 2>&1
          fi
          opencode --version

      - name: Run opencode QA on changed files
        id: qa
        if: steps.changed.outputs.count != '0'
        env:
          APP_MODULO_OPENCODE_API_KEY: pwd{{ secrets.APP_MODULO_OPENCODE_API_KEY }}
          GH_TOKEN: pwd{{ secrets.MODULO_REVIEWBOT_TOKEN }}
        shell: bash
        run: |
          FILES="pwd{{ steps.changed.outputs.files }}"

          if command -v opencode &>/dev/null && [ -n "" ]; then
            echo "Running opencode qa on: "
            opencode auth --api-key "" 2>&1 || true
            RESULT=[91m[1mError: [0mFailed to change directory to C:\Users\dunca\Modulo\Repos\modulo\qa || true
            echo "result<<EOF" >> ""
            echo "" >> ""
            echo "EOF" >> ""
            echo "source=opencode" >> ""
          else
            echo "source=fallback" >> ""
          fi

      - name: Post review decision
        if: always()
        env:
          GH_TOKEN: pwd{{ secrets.MODULO_REVIEWBOT_TOKEN }}
          PR_NUM: pwd{{ github.event.pull_request.number }}
          REPO: pwd{{ github.repository }}
          QA_RESULT: pwd{{ steps.qa.outputs.result }}
          QA_SOURCE: pwd{{ steps.qa.outputs.source }}
        shell: bash
        run: |
          if [ "" = "opencode" ]; then
            CRITICAL=
            MAJOR=
            CRITICAL=
            MAJOR=
            echo "Findings:  critical,  major"

            if [ "" -gt 0 ] || [ "" -gt 0 ]; then
              gh pr review "" --repo "" --request-changes --body "## Modulo Review\n\n\n\n### Decision\n**CHANGES_REQUESTED** - fix critical/major findings."
            else
              gh pr review "" --repo "" --approve --body "## Modulo Review\n\n\n\n### Decision\n**APPROVED** - no critical or major issues."
            fi
          else
            gh pr review "" --repo "" --approve --body "## Modulo Review\n\n**APPROVED** (opencode CLI unavailable - CI will validate)."
          fi