name: "Audit chain continuity monitor"

# FAR-1466: watch our OWN audit chain on app.modulo.run so a lapse is caught
# early instead of at audit time. Follows the repo's monitor convention - a
# Linear ticket-on-failure path, the `if: failure()` pattern, and the same
# fail-open behaviour when a credential is absent.
#
# FAR-1468 (live-tested against app.modulo.run) corrected two defects in the
# original version: (1) both audit endpoints require audit.manage, which maps
# to the ADMIN org role and can never be satisfied by an API key (mintable
# only as operator/runner) - the monitor now logs in with prod admin
# credentials and uses the returned JWT; (2) verify_chain() returns
# valid=false whenever the chain is truncated past VERIFY_MAX_EVENTS (10k) and
# production is well past that, so truncation is now treated as PASS (a known
# product limitation) rather than a permanent false lapse ticket.
#
# Deliberate cadence: every 6h, NOT more often. GitHub drops high-frequency
# cron events on high-activity repos (see the merge-queue */15 lesson in the
# workspace guidance) - a */10 cron would silently stop firing, which is
# exactly the blind spot this monitor exists to close.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-audit-chain:
    name: Check app.modulo.run audit chain continuity
    runs-on: ubicloud-standard-2
    steps:
      # Authenticate (FAR-1468): BOTH audit endpoints require
      # require_permission("audit.manage"), and audit.manage maps to the ADMIN
      # org role (backend/src/modulo/auth/permissions.py:180; role order
      # viewer < runner < operator < admin). API keys are only mintable as
      # operator/runner, so `Bearer <api key>` always gets HTTP 403 here -
      # live-tested against app.modulo.run. The monitor therefore logs in with
      # the prod admin credentials (POST /api/v1/auth/login; body field is
      # `email`, NOT `username` - a `username` body returns HTTP 422) and
      # carries the returned JWT access token as MODULO_TOKEN. The token is
      # masked before it reaches $GITHUB_ENV so it never appears in logs.
      #
      # Fail-open on missing credentials (the repo's monitor convention):
      # a not-yet-configured secret must not red-queue the workflow. A FAILED
      # login, by contrast, exits 1 - the monitor cannot do its job without
      # auth, and the ticket step catches it.
      - name: Authenticate to app.modulo.run (admin login)
        id: auth
        shell: bash
        env:
          E2E_PROD_ADMIN_EMAIL: ${{ secrets.E2E_PROD_ADMIN_EMAIL }}
          E2E_PROD_ADMIN_PASSWORD: ${{ secrets.E2E_PROD_ADMIN_PASSWORD }}
        run: |
          if [ -z "$E2E_PROD_ADMIN_EMAIL" ] || [ -z "$E2E_PROD_ADMIN_PASSWORD" ]; then
            echo "::warning::E2E_PROD_ADMIN_EMAIL/E2E_PROD_ADMIN_PASSWORD not set - skipping audit-chain monitor (FAR-1468)."
            exit 0
          fi

          LOGIN_BODY="$(mktemp)"
          LOGIN_CODE=$(curl -sS -m 20 -o "$LOGIN_BODY" -w "%{http_code}" \
            -X POST "https://app.modulo.run/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg email "$E2E_PROD_ADMIN_EMAIL" --arg password "$E2E_PROD_ADMIN_PASSWORD" \
                  '{email: $email, password: $password}')" 2>/dev/null) || LOGIN_CODE="000"

          if [ "$LOGIN_CODE" != "200" ]; then
            echo "::error::Admin login to app.modulo.run failed (HTTP ${LOGIN_CODE}) - audit-chain monitor cannot authenticate (FAR-1468)."
            rm -f "$LOGIN_BODY"
            exit 1
          fi

          TOKEN=$(jq -r 'if (.access_token | type) == "string" and (.access_token | length) > 0
                          then .access_token else error("missing access_token") end' \
                   "$LOGIN_BODY" 2>/dev/null) || TOKEN=""
          rm -f "$LOGIN_BODY"

          if [ -z "$TOKEN" ]; then
            echo "::error::Admin login succeeded but the response carried no access_token - audit-chain monitor cannot authenticate (FAR-1468)."
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "MODULO_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "admin login OK - JWT access token acquired for the audit-chain checks"

      # Check 1 - integrity: recompute the hash chain server-side.
      # Endpoint verified: backend/src/modulo/api/routes/audit.py:32
      # (router prefix "/api/v1/admin/audit") + :146 (GET "/verify").
      #
      # Auth: `Authorization: Bearer ${MODULO_TOKEN}` - the admin JWT from the
      # Authenticate step above (FAR-1468). An API key can never satisfy
      # audit.manage (admin-only), so the old MODULO_SMOKE_TEST_API_KEY path
      # was removed.
      #
      # TRUNCATION IS NOT A LAPSE (FAR-1468, live-tested): verify_chain()
      # returns valid=false whenever total_events > VERIFY_MAX_EVENTS (10000,
      # backend/src/modulo/core/audit_logger/__init__.py:30,462) - production
      # has ~23.5k events, so /verify reports {"valid": false, "truncated":
      # true} on EVERY call. Check 1 therefore PASSES on truncated=true (logged
      # as an informational note - a known product limitation) and FAILS only
      # when truncated=false AND valid=false: a genuine gap or tamper. The
      # alert detail stays rich (valid/total_events/truncated/checked_events/
      # first_gap_index/first_tampered_id/chain_head_match/chain_count_mismatch)
      # so triage can still tell tampering from truncation.
      - name: Check 1 - verify audit chain integrity
        id: integrity
        shell: bash
        run: |
          # Fail-open: no token means the Authenticate step was skipped for
          # want of a credential - warn and exit 0, exactly as before.
          if [ -z "$MODULO_TOKEN" ]; then
            echo "::warning::MODULO_TOKEN not available (admin login skipped) - skipping audit-chain integrity check (FAR-1468)."
            exit 0
          fi

          BODY_FILE="$(mktemp)"

          # Short retry loop so one transient blip does not raise a false
          # ticket, but an auth failure (401/403) is NOT retried - it cannot
          # heal by waiting, and retrying would just delay the alert.
          OK=false
          HTTP_CODE="000"
          for i in 1 2 3; do
            HTTP_CODE=$(curl -sS -m 20 -o "$BODY_FILE" -w "%{http_code}" \
              -H "Authorization: Bearer ${MODULO_TOKEN}" \
              "https://app.modulo.run/api/v1/admin/audit/verify" 2>/dev/null) || HTTP_CODE="000"
            if [ "$HTTP_CODE" = "200" ]; then
              OK=true
              break
            fi
            if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
              break
            fi
            echo "verify fetch $i returned HTTP ${HTTP_CODE} - retrying in 5s"
            sleep 5
          done

          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "::error::Audit verify auth failed (HTTP ${HTTP_CODE}): the admin access token is invalid/expired, or the account lacks audit.manage (backend/src/modulo/auth/permissions.py:180 maps audit.manage to the admin role). Re-check E2E_PROD_ADMIN_EMAIL/E2E_PROD_ADMIN_PASSWORD (FAR-1468)."
            echo "integrity_detail=GET /api/v1/admin/audit/verify returned HTTP ${HTTP_CODE} (auth/permission)" >> "$GITHUB_OUTPUT"
            rm -f "$BODY_FILE"
            exit 1
          fi

          if [ "$OK" != "true" ] || [ ! -s "$BODY_FILE" ]; then
            echo "::error::GET /api/v1/admin/audit/verify unreachable or empty after 3 attempts (HTTP ${HTTP_CODE}) (FAR-1466)"
            echo "integrity_detail=verify endpoint unreachable after 3 attempts (HTTP ${HTTP_CODE})" >> "$GITHUB_OUTPUT"
            rm -f "$BODY_FILE"
            exit 1
          fi

          # Parse the body. Safe on unparseable input: jq's error() exits
          # non-zero when .valid or .truncated is missing or not a boolean,
          # and we alert on that instead of crashing the workflow. Note `jq -e`
          # alone is NOT usable here - it also exits non-zero on the legitimate
          # value `false`, which would mask a real chain break as "unparseable".
          if ! VALID=$(jq -r '
            if (.valid | type) != "boolean" then error("missing or non-boolean .valid")
            elif (.truncated | type) != "boolean" then error("missing or non-boolean .truncated")
            else (.valid | tostring) end
          ' "$BODY_FILE" 2>/dev/null); then
            echo "::error::GET /api/v1/admin/audit/verify response is not a verify result (FAR-1466)"
            echo "integrity_detail=verify response body not parseable (missing boolean .valid/.truncated)" >> "$GITHUB_OUTPUT"
            rm -f "$BODY_FILE"
            exit 1
          fi
          TRUNCATED=$(jq -r '.truncated | tostring' "$BODY_FILE")

          # Rich detail for triage - kept on BOTH the pass and fail paths so a
          # ticket (or a log reader) can tell tampering from truncation at a
          # glance.
          DETAIL=$(jq -r '
            [
              "valid=\(.valid)",
              "total_events=\(.total_events)",
              "truncated=\(.truncated)",
              "checked_events=\(.checked_events)",
              "first_gap_index=\(.first_gap_index)",
              "first_tampered_id=\(.first_tampered_id)",
              "chain_head_match=\(.chain_head_match)",
              "chain_count_mismatch=\(.chain_count_mismatch)"
            ] + (if .detail then ["detail=\(.detail)"] else [] end)
            | join("; ")
          ' "$BODY_FILE" 2>/dev/null || echo "verify result unparseable")

          if [ "$TRUNCATED" = "true" ]; then
            # PASS: a truncated chain is a known product limitation (the
            # server cannot prove the whole chain past VERIFY_MAX_EVENTS), not
            # a lapse. Log it informatively; do NOT raise a ticket for it.
            echo "audit chain verify TRUNCATED - passing on the intact checked prefix (known product limitation, FAR-1468): ${DETAIL}"
            rm -f "$BODY_FILE"
            exit 0
          fi

          if [ "$VALID" != "true" ]; then
            # truncated=false AND valid=false: a genuine gap or tamper.
            echo "::error::Audit chain FAILED verification on app.modulo.run: ${DETAIL} (FAR-1466)"
            echo "integrity_detail=${DETAIL}" >> "$GITHUB_OUTPUT"
            rm -f "$BODY_FILE"
            exit 1
          fi
          rm -f "$BODY_FILE"
          echo "audit chain verifies OK (checked_events reported by /verify)"

      # Check 2 - continuity: the newest audit event must be < 24h old.
      # Endpoint verified: audit.py:39 (GET "" on prefix "/api/v1/admin/audit")
      # with limit=1 (LIST_MIN_LIMIT=1, audit_logger/__init__.py:33), ordered
      # `created_at DESC, id DESC` (audit_logger/__init__.py:633), timestamp
      # field `created_at` (audit_logger/__init__.py:103, timezone-aware per
      # db/models/base.py:19-21).
      #
      # `if: success() || failure()` (not the default gating) so a check-1
      # failure does not hide check-2's state - one ticket carries both.
      #
      # KNOWN LIMITATION (deliberate, refine-or-retire): app.modulo.run runs
      # the whole dogfood on crons, so >= 24h of zero audit activity is itself
      # suspicious - but a genuinely quiet period could false-positive. This
      # half should be refined (or retired) once the product signal in
      # FAR-1465 exists; the 24h threshold is a heuristic, not a contract.
      - name: Check 2 - newest audit event within 24h
        id: continuity
        if: success() || failure()
        shell: bash
        run: |
          if [ -z "$MODULO_TOKEN" ]; then
            echo "::warning::MODULO_TOKEN not available (admin login skipped) - skipping audit-chain continuity check (FAR-1468)."
            exit 0
          fi

          BODY_FILE="$(mktemp)"

          OK=false
          HTTP_CODE="000"
          for i in 1 2 3; do
            HTTP_CODE=$(curl -sS -m 20 -o "$BODY_FILE" -w "%{http_code}" \
              -H "Authorization: Bearer ${MODULO_TOKEN}" \
              "https://app.modulo.run/api/v1/admin/audit?limit=1" 2>/dev/null) || HTTP_CODE="000"
            if [ "$HTTP_CODE" = "200" ]; then
              OK=true
              break
            fi
            if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
              break
            fi
            echo "audit list fetch $i returned HTTP ${HTTP_CODE} - retrying in 5s"
            sleep 5
          done

          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "::error::Audit list auth failed (HTTP ${HTTP_CODE}): the admin access token is invalid/expired, or the account lacks audit.manage (backend/src/modulo/auth/permissions.py:180). Re-check E2E_PROD_ADMIN_EMAIL/E2E_PROD_ADMIN_PASSWORD (FAR-1468)."
            echo "continuity_detail=GET /api/v1/admin/audit returned HTTP ${HTTP_CODE} (auth/permission)" >> "$GITHUB_OUTPUT"
            rm -f "$BODY_FILE"
            exit 1
          fi

          if [ "$OK" != "true" ] || [ ! -s "$BODY_FILE" ]; then
            echo "::error::GET /api/v1/admin/audit unreachable or empty after 3 attempts (HTTP ${HTTP_CODE}) (FAR-1466)"
            echo "continuity_detail=audit list endpoint unreachable after 3 attempts (HTTP ${HTTP_CODE})" >> "$GITHUB_OUTPUT"
            rm -f "$BODY_FILE"
            exit 1
          fi

          TOTAL=$(jq -r 'if (.total | type) == "number" then (.total | tostring) else "unknown" end' "$BODY_FILE" 2>/dev/null || echo "unknown")
          NEWEST=$(jq -r '
            if (.items | type) != "array" then "BAD_BODY"
            elif (.items | length) == 0 then "NO_EVENTS"
            elif (.items[0].created_at | type) != "string" then "NO_TIMESTAMP"
            else .items[0].created_at end
          ' "$BODY_FILE" 2>/dev/null || echo "BAD_BODY")
          rm -f "$BODY_FILE"

          if [ "$NEWEST" = "NO_EVENTS" ]; then
            # Zero audit events for the org is not "quiet" - it means the
            # chain has nothing in it at all, which this monitor must flag.
            echo "::error::app.modulo.run reports ZERO audit events (total=${TOTAL}) - no chain to watch (FAR-1466)"
            echo "continuity_detail=zero audit events reported (total=${TOTAL})" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$NEWEST" = "BAD_BODY" ] || [ "$NEWEST" = "NO_TIMESTAMP" ]; then
            echo "::error::GET /api/v1/admin/audit response is not an event list (FAR-1466)"
            echo "continuity_detail=audit list response missing items[0].created_at (total=${TOTAL})" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Age the newest event. Python rather than `date -d`: created_at is
          # timezone-aware (or, defensively, naive - treated as UTC), and we
          # must not let a naive-vs-UTC parse difference turn into a false
          # 24h alarm.
          if ! AGE=$(python3 -c '
          import sys
          from datetime import datetime, timezone
          raw = sys.argv[1]
          try:
              ts = datetime.fromisoformat(raw.replace("Z", "+00:00"))
          except ValueError:
              sys.exit(2)
          if ts.tzinfo is None:
              ts = ts.replace(tzinfo=timezone.utc)
          print(int((datetime.now(timezone.utc) - ts).total_seconds()))
          ' "$NEWEST" 2>/dev/null); then
            echo "::error::Newest audit event timestamp is unparseable: ${NEWEST} (FAR-1466)"
            echo "continuity_detail=newest audit event timestamp unparseable: ${NEWEST}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$AGE" -gt 86400 ]; then
            HOURS=$((AGE / 3600))
            echo "::error::Newest audit event on app.modulo.run is ${HOURS}h old (>24h): ${NEWEST} - audit activity has lapsed (FAR-1466)"
            echo "continuity_detail=newest audit event ${NEWEST} is ${HOURS}h old (>24h); total=${TOTAL}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "newest audit event ${NEWEST} is $((AGE / 60))min old - continuity OK"

      - name: Open Linear ticket on audit-chain lapse
        if: failure()
        shell: bash
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          INTEGRITY_DETAIL: ${{ steps.integrity.outputs.integrity_detail }}
          CONTINUITY_DETAIL: ${{ steps.continuity.outputs.continuity_detail }}
        run: |
          # Fail-open: only file a Linear ticket when a key is configured.
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "LINEAR_API_KEY not set - skipping ticket (workflow failure still alerts)."
            exit 0
          fi

          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Compose title + detail from whichever check(s) failed.
          if [ -n "$INTEGRITY_DETAIL" ] && [ -n "$CONTINUITY_DETAIL" ]; then
            TITLE="AUDIT-CHAIN LAPSE: integrity and continuity checks failed on app.modulo.run (FAR-1466)"
            DESC="Automated audit-chain monitor detected BOTH a chain-integrity failure and an activity lapse at ${TS}. Integrity: ${INTEGRITY_DETAIL}. Continuity: ${CONTINUITY_DETAIL}."
          elif [ -n "$INTEGRITY_DETAIL" ]; then
            TITLE="AUDIT-CHAIN LAPSE: audit chain failed verification on app.modulo.run (FAR-1466)"
            DESC="Automated audit-chain monitor found the audit chain does not verify at ${TS}. Observed: ${INTEGRITY_DETAIL}. Endpoint: GET /api/v1/admin/audit/verify. Note verify_chain() also returns valid=false when the chain is truncated past VERIFY_MAX_EVENTS (10000) - check truncated/total_events before assuming tampering."
          elif [ -n "$CONTINUITY_DETAIL" ]; then
            TITLE="AUDIT-CHAIN LAPSE: no audit event in the last 24h on app.modulo.run (FAR-1466)"
            DESC="Automated audit-chain monitor found no recent audit activity at ${TS}. Observed: ${CONTINUITY_DETAIL}. Endpoint: GET /api/v1/admin/audit?limit=1 (newest-first). Known limitation: a genuinely quiet period can false-positive - this heuristic should be refined or retired once the FAR-1465 product signal exists."
          else
            # Neither check reported detail (some other step failed) - still
            # open a ticket rather than losing the failure signal.
            TITLE="AUDIT-CHAIN LAPSE: audit-chain monitor job failed on app.modulo.run (FAR-1466)"
            DESC="Automated audit-chain monitor job failed at ${TS} without a check-level detail (see the run log)."
          fi

          # Dedup: do not stack a new ticket every 6h while one is already
          # open. Query Linear for an issue whose title contains the stable
          # marker, then keep only (a) this team's issues and (b) OPEN ones -
          # state type backlog/unstarted/started is Linear's definition of
          # open. The team + state predicates are applied HERE in jq rather
          # than in the GraphQL filter: it keeps the query to one comparator
          # shape (title contains) and an erroring filter cannot be mistaken
          # for "no existing ticket".
          # Simplification, deliberately: the marker is matched with
          # `contains` rather than an exact title, and ANY open match
          # suppresses creation - a closed/resolved ticket does not, so a
          # fresh lapse after an earlier fix still alerts.
          DEDUP_BODY=$(jq -n '{
            query: "query { issues(filter: { title: { contains: \"AUDIT-CHAIN LAPSE\" } }, first: 50) { nodes { identifier title state { type } team { id } } } }"
          }')
          if DEDUP_RESP=$(curl -sS -m 20 -X POST "https://api.linear.app/graphql" \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d "$DEDUP_BODY" 2>/dev/null); then
            OPEN_COUNT=$(printf '%s' "$DEDUP_RESP" | jq -r --arg teamId "ae855baf-6439-4980-97fb-38da80129485" '
              (((.data // {}) | (.issues // {}) | (.nodes // []))
                | map(select(((.team // {}).id // "") == $teamId))
                | map(select(
                    (.state.type // "") == "backlog"
                    or (.state.type // "") == "unstarted"
                    or (.state.type // "") == "started"
                  ))
                | length) | tostring
            ' 2>/dev/null || echo "0")
            if [ "${OPEN_COUNT:-0}" -gt 0 ] 2>/dev/null; then
              EXISTING=$(printf '%s' "$DEDUP_RESP" | jq -r '
                (((.data // {}) | (.issues // {}) | (.nodes // []))[0].identifier // "unknown")
              ' 2>/dev/null || echo "unknown")
              echo "::warning::AUDIT-CHAIN LAPSE alert ticket already open (${EXISTING}) - skipping creation."
              exit 0
            fi
          else
            # Fail toward ALERTING: if the dedup query itself fails we still
            # attempt creation (a duplicate ticket beats a lost alert).
            echo "::warning::Dedup query failed - proceeding to create the ticket without dedup confirmation."
          fi

          BODY=$(jq -n --arg ts "$TS" --arg title "$TITLE" --arg desc "$DESC" '{
            query: "mutation($i: IssueCreateInput!){ issueCreate(input:$i){ success issue { identifier url } } }",
            variables: { i: {
              teamId: "ae855baf-6439-4980-97fb-38da80129485",
              title: $title,
              description: $desc
            } }
          }')
          curl -sS -f --max-time 20 -X POST "https://api.linear.app/graphql" \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d "$BODY" || echo "::warning::Failed to create Linear ticket"
