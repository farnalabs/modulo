name: "RC Validation (pen test vs app.modulo.run + clean-host compose)"

# Runs during the alpha release freeze against the LIVE production soak
# deployment - NOT an in-process app (that is schemathesis-nightly.yml).
# Triggered automatically by release-unified.yml on cut/recut; can also be
# dispatched manually with an rc_tag.
#
# v1 scope: read-only (GET) fuzzing only. Destructive-method fuzzing against
# the live soak would mutate real dogfood data and trigger real pipeline
# runs/costs; it belongs against a disposable clone when that suite arrives.
#
# FAR-2345: `clean-host-compose` is the second gate. It validates the artefact
# an evaluator actually downloads - the compose bundle - on a host with no
# GitHub credentials and no docker login, i.e. an anonymous pull of the
# immutable RC image from public GHCR followed by `docker compose up -d` and a
# `/healthz/ready` poll. It runs BEFORE the pen test and the validation marker
# depends on it, so a release whose published artefacts cannot be brought up by
# a self-hoster can never be marked validated (and therefore never promoted).

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "The RC tag being validated (e.g. v0.1.0-rc1)"
        type: string
        required: true

concurrency:
  group: rc-validate
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Clean-host anonymous deployment of the published compose bundle (FAR-2345)
  # ---------------------------------------------------------------------------
  clean-host-compose:
    name: Clean-host anonymous compose deployment
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RC_TAG: ${{ inputs.rc_tag }}
      # Loopback port for the trial stack; the compose publishes ${PORT}:80.
      PORT: "8080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.rc_tag }}

      - name: Confirm RC tag exists and resolve its version
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${RC_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${RC_TAG} not found."
            exit 1
          fi
          case "$RC_TAG" in
            v*-rc[0-9]*) ;;
            *)
              echo "::error::rc_tag '${RC_TAG}' is not an immutable vX.Y.Z-rcN tag - refusing to run a clean-host deployment against a mutable or SHA tag."
              exit 1
              ;;
          esac
          VERSION="${RC_TAG#v}"
          VERSION="${VERSION%-rc*}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Clean-host validating ${RC_TAG} (version ${VERSION}) at $(git rev-parse --short "${RC_TAG}^{commit}")"

      - name: Set up Python for the bundle packager
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"

      - name: Package the compose bundle exactly as the release does
        shell: bash
        run: |
          set -euo pipefail
          # Same script, same arguments as release-unified.yml's
          # "Package self-hosted compose release bundle" step: this validates
          # the shipped artefact, not a hand-made equivalent.
          uv run --no-project --no-sync --no-build --with pyyaml==6.0.3 \
            python scripts/package_compose_release.py \
            --version "$VERSION" \
            --tag "$RC_TAG" \
            --output-dir "$RUNNER_TEMP/compose-bundle"
          tar -xzf "$RUNNER_TEMP/compose-bundle/modulo-${VERSION}-compose.tar.gz" \
            -C "$RUNNER_TEMP/compose-bundle"
          (cd "$RUNNER_TEMP/compose-bundle" && sha256sum --check SHA256SUMS)

      - name: Assert the bundle pins the immutable tag and never :latest
        shell: bash
        env:
          TAG_UNDER_TEST: ${{ inputs.rc_tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/compose-bundle"
          # Parse the YAML rather than grepping the raw text: the file is heavily
          # commented and a comment can never pin an image, so a text match could
          # both false-pass and false-fail.
          uv run --no-project --no-sync --no-build --with pyyaml==6.0.3 python - <<'PY'
          import os
          import sys
          import yaml

          tag = os.environ["TAG_UNDER_TEST"]
          with open("docker-compose.prod.yml", encoding="utf-8") as handle:
              compose = yaml.safe_load(handle)

          pinned = compose["services"]["modulo"]["image"]
          expected = f"ghcr.io/farnalabs/modulo:{tag}"
          print(f"Bundled image reference: {pinned}")
          if pinned != expected:
              sys.exit(f"bundled compose pins {pinned!r}, expected the immutable {expected!r}")

          floating = [
              f"{name}: {service['image']}"
              for name, service in compose["services"].items()
              if isinstance(service.get("image"), str)
              and service["image"].rsplit(":", 1)[-1] in {"latest", "stable"}
          ]
          if floating:
              sys.exit(f"bundled compose floats on a moving tag: {floating}")
          PY

      - name: Start the stack anonymously (no docker login)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/compose-bundle"
          # The exact operator path: the bundle ships no secret, so init-env.sh
          # generates .env on this host (the same script an evaluator runs).
          ./init-env.sh
          # An empty DOCKER_CONFIG guarantees no registry credential exists, so
          # the pull below can only succeed if the image is PUBLIC. A login the
          # runner happens to carry would turn this into a false pass.
          for credential_var in CR_PAT GHCR_TOKEN DOCKER_USERNAME DOCKER_PASSWORD; do
            if [ -n "$(printenv "$credential_var" || true)" ]; then
              echo "::error::registry credential ${credential_var} is present in this job's environment; the anonymous-pull guarantee cannot be proven here."
              exit 1
            fi
          done
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "$GITHUB_ENV"
          echo "Anonymous docker config: ${DOCKER_CONFIG} (no auth.json, no credential helper)"
          docker compose version
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml ps

      - name: Poll /healthz/ready until 200 OK
        shell: bash
        run: |
          set -euo pipefail
          READY_URL="http://127.0.0.1:${PORT}/healthz/ready"
          echo "Polling ${READY_URL}"
          CODE=""
          for attempt in $(seq 1 60); do
            CODE="$(curl -s -m 10 -o "$RUNNER_TEMP/ready.json" -w '%{http_code}' "$READY_URL" || true)"
            if [ "$CODE" = "200" ]; then
              echo "Ready after ${attempt} attempt(s) (HTTP 200):"
              cat "$RUNNER_TEMP/ready.json"
              exit 0
            fi
            echo "Attempt ${attempt}: ${READY_URL} returned HTTP ${CODE:-<none>}; waiting..."
            sleep 10
          done
          echo "::error::${READY_URL} never returned 200 OK within 10 minutes (last HTTP ${CODE:-<none>}). Dumping diagnostics:"
          (cd "$RUNNER_TEMP/compose-bundle" && docker compose -f docker-compose.prod.yml ps) || echo "::warning::could not dump container state"
          (cd "$RUNNER_TEMP/compose-bundle" && docker compose -f docker-compose.prod.yml logs --no-color --tail=200) || echo "::warning::could not dump container logs"
          exit 1

      - name: Tear down the trial stack
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/compose-bundle/docker-compose.prod.yml" ]; then
            echo "No bundle to tear down."
            exit 0
          fi
          cd "$RUNNER_TEMP/compose-bundle"
          # Best-effort cleanup: a teardown failure must be visible but must not
          # mask the outcome the gate already reported.
          if ! docker compose -f docker-compose.prod.yml down --volumes --remove-orphans; then
            echo "::warning::could not fully tear down the trial stack; the runner is ephemeral."
          fi

  # ---------------------------------------------------------------------------
  # Docker upgrade / failure / rollback acceptance matrix (FAR-2195)
  # ---------------------------------------------------------------------------
  docker-upgrade-rollback:
    name: Docker upgrade and rollback acceptance matrix
    needs: [clean-host-compose]
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      RC_TAG: ${{ inputs.rc_tag }}
      PORT: "18081"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.rc_tag }}
          persist-credentials: false

      - name: Set up Python for the release harness
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.12"

      - name: Package the exact RC compose asset
        shell: bash
        run: |
          set -euo pipefail
          version="${RC_TAG#v}"
          version="${version%-rc*}"
          uv run --no-project --no-sync --no-build --with pyyaml==6.0.3 \
            python scripts/package_compose_release.py \
            --version "$version" \
            --tag "$RC_TAG" \
            --output-dir "$RUNNER_TEMP/compose-matrix"
          tar -xzf "$RUNNER_TEMP/compose-matrix/modulo-${version}-compose.tar.gz" \
            -C "$RUNNER_TEMP/compose-matrix"
          (cd "$RUNNER_TEMP/compose-matrix" && sha256sum --check SHA256SUMS)
          cd "$RUNNER_TEMP/compose-matrix" && ./init-env.sh


      - name: Render matrix compose image from the phase TAG
        shell: bash
        env:
          MATRIX_COMPOSE_FILE: ${{ runner.temp }}/compose-matrix/docker-compose.prod.yml
        run: |
          set -euo pipefail
          # The packaged compose asset is intentionally hard-pinned to RC_TAG.
          # Keep that verified artefact intact, but render the working matrix
          # copy to use the TAG environment variable that each phase supplies.
          # Without this substitution every phase silently exercises RC_TAG.
          uv run --no-project --no-sync --no-build python scripts/render_validation_compose.py \
            --compose-file "$MATRIX_COMPOSE_FILE"

      - name: Resolve the previous published immutable bundle tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/release-pages.json"
          version="${RC_TAG#v}"
          version="${version%-rc*}"
          current_bundle_tag="bundle-v${version}"
          # release-unified publishes the current bundle AFTER it dispatches this
          # validation, so the current tag cannot be required in the release
          # history. Resolve the greatest already-published tag strictly below
          # the current version; the current tag itself is excluded.
          if ! bundle_tag="$(python3 scripts/validate_release_tag.py resolve-previous \
            --current "$current_bundle_tag" \
            --release-json "$RUNNER_TEMP/release-pages.json")"; then
            echo "::error::could not resolve a previous published bundle-v* release from the release history; refusing to claim Docker upgrade/rollback coverage"
            exit 1
          fi
          if [ -z "$bundle_tag" ]; then
            echo "::error::no previous published bundle-v* release exists; refusing to claim Docker upgrade/rollback coverage"
            exit 1
          fi

          case "$bundle_tag" in
            bundle-v*) ;;
            *)
              echo "::error::release resolver returned unexpected tag '${bundle_tag}'; expected bundle-vX.Y.Z"
              exit 1
              ;;
          esac

          # A bundle cut or recut is published before promotion, so its compose
          # asset may pin the RC image (for example v1.2.0-rc2), not the stable
          # v1.2.0 tag. Read the image reference from that immutable predecessor
          # bundle instead of deriving a stable tag that may not exist yet.
          bundle_version="${bundle_tag#bundle-v}"
          gh release download "$bundle_tag" \
            --repo "${{ github.repository }}" \
            --pattern "modulo-${bundle_version}-compose.tar.gz" \
            --dir "$RUNNER_TEMP" \
            --clobber
          downloaded_archive="$RUNNER_TEMP/modulo-${bundle_version}-compose.tar.gz"
          if [ ! -s "$downloaded_archive" ]; then
            echo "::error::published predecessor bundle ${bundle_tag} has no downloadable compose asset; refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          gh release download "$bundle_tag" \
            --repo "${{ github.repository }}" \
            --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP" \
            --clobber
          published_sums="$RUNNER_TEMP/SHA256SUMS"
          if [ ! -s "$published_sums" ]; then
            echo "::error::published predecessor bundle ${bundle_tag} has no SHA256SUMS artifact; refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          archive_checksum_line="$(awk -v asset="$(basename "$downloaded_archive")" '$2 == asset { print; found=1 } END { if (!found) exit 1 }' "$published_sums" || true)"
          if [ -z "$archive_checksum_line" ]; then
            echo "::error::published predecessor bundle ${bundle_tag} has no checksum for $(basename "$downloaded_archive") in SHA256SUMS; refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          if ! printf '%s\n' "$archive_checksum_line" | (cd "$RUNNER_TEMP" && sha256sum --check --status -); then
            echo "::error::checksum mismatch for published predecessor bundle asset $(basename "$downloaded_archive"); refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          bundle_dir="$(mktemp -d)"
          tar -xzf "$downloaded_archive" -C "$bundle_dir"
          compose_file="$bundle_dir/docker-compose.prod.yml"
          if [ ! -s "$compose_file" ]; then
            echo "::error::predecessor bundle ${bundle_tag} does not contain docker-compose.prod.yml; refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          old_tag="$(COMPOSE_FILE="$compose_file" BUNDLE_VERSION="$bundle_version" \
            uv run --no-project --no-sync --no-build --with pyyaml==6.0.3 python - <<'PY'
          import os
          import re
          import sys

          import yaml

          compose_path = os.environ["COMPOSE_FILE"]
          with open(compose_path, encoding="utf-8") as handle:
              compose = yaml.safe_load(handle)
          image = compose.get("services", {}).get("modulo", {}).get("image")
          prefix = "ghcr.io/farnalabs/modulo:"
          if not isinstance(image, str) or not image.startswith(prefix):
              sys.exit(f"predecessor compose has invalid modulo image reference: {image!r}")
          tag = image[len(prefix):]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-rc[0-9]+)?", tag):
              sys.exit(f"predecessor compose pins non-immutable or unexpected image tag: {tag!r}")
          expected_version = os.environ["BUNDLE_VERSION"]
          if not re.fullmatch(rf"v{re.escape(expected_version)}(?:-rc[0-9]+)?", tag):
              sys.exit(
                  f"predecessor compose image tag {tag!r} does not match "
                  f"published predecessor bundle version {expected_version!r} (including any RC suffix)"
              )
          print(tag)
          PY
          )"
          if [ -z "$old_tag" ]; then
            echo "::error::could not resolve the predecessor image tag from bundle ${bundle_tag}; refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          echo "OLD_TAG=$old_tag" >> "$GITHUB_ENV"
          echo "Using predecessor bundle image tag $old_tag (pinned by bundle $bundle_tag) as the rollback target."

          # A release tag is only a lookup key: GHCR tags can be retargeted.
          # Resolve the exact manifest digest through the authenticated registry
          # path, then require GitHub-published provenance for that digest.
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          old_image="ghcr.io/farnalabs/modulo:${old_tag}"
          old_digest="$(docker buildx imagetools inspect "$old_image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$old_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not resolve a valid GHCR manifest digest for ${old_image}: ${old_digest:-<empty>}"
            exit 1
          fi
          old_subject="oci://ghcr.io/farnalabs/modulo@${old_digest}"
          if ! gh attestation verify "$old_subject" --repo "${{ github.repository }}" --format json > "$RUNNER_TEMP/predecessor-image-attestation.json"; then
            echo "::error::no verifiable build provenance for ${old_subject}; refusing Docker upgrade/rollback coverage"
            exit 1
          fi
          uv run --no-project --no-sync --no-build python scripts/validate_release_tag.py verify-image-digest \
            --image "$old_image" \
            --digest "$old_digest" \
            --attestation-json "$RUNNER_TEMP/predecessor-image-attestation.json"
          echo "Verified predecessor image identity: ${old_image} -> ${old_digest}"

      - name: Run the Docker upgrade / failure / rollback matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_compose_upgrade_rollback.py \
            --compose-file "$RUNNER_TEMP/compose-matrix/docker-compose.prod.yml" \
            --env-file "$RUNNER_TEMP/compose-matrix/.env" \
            --old-tag "$OLD_TAG" \
            --new-tag "$RC_TAG" \
            --project-name "rc-matrix-${GITHUB_RUN_ID}" \
            --port "$PORT" \
            --evidence-dir "$RUNNER_TEMP/compose-matrix-evidence"

      - name: Upload Docker acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha-docker-upgrade-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/compose-matrix-evidence
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Read-only pen test against the live RC (the pre-existing gate)
  # ---------------------------------------------------------------------------
  pen-test:
    name: Schemathesis fuzz vs live RC
    # FAR-2195 / FAR-2345: the validation marker is pushed by this job, so
    # gating it on both acceptance legs means a release is marked validated only
    # when the downloadable artefacts come up for a self-hoster AND the Docker
    # upgrade/failure/rollback matrix passes.
    needs: [clean-host-compose, docker-upgrade-rollback]
    runs-on: ubicloud-standard-2
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BASE_URL: https://app.modulo.run
      RC_TAG: ${{ inputs.rc_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Confirm RC tag exists
        shell: bash
        run: |
          if ! git rev-parse -q --verify "refs/tags/${RC_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${RC_TAG} not found."
            exit 1
          fi
          echo "Validating RC ${RC_TAG} ($(git rev-parse --short "${RC_TAG}^{commit}")) against ${BASE_URL}"

      - name: Check pen-test credentials are configured
        env:
          RC_USER: ${{ secrets.RC_PENTEST_USERNAME }}
          RC_PASS: ${{ secrets.RC_PENTEST_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$RC_USER" ] || [ -z "$RC_PASS" ]; then
            echo "::error::Repo secrets RC_PENTEST_USERNAME / RC_PENTEST_PASSWORD are not set."
            echo "        Configure an app.modulo.run account for the pen test before cutting an RC:"
            echo "        gh secret set RC_PENTEST_USERNAME ; gh secret set RC_PENTEST_PASSWORD"
            exit 1
          fi

      - name: Wait for app availability
        shell: bash
        run: |
          for _ in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "${BASE_URL}/" || true)
            if [ -n "$CODE" ] && [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
              echo "${BASE_URL} reachable (HTTP ${CODE})"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${BASE_URL} unreachable after 5 minutes."
          exit 1

      - name: Verify live deployment serves the RC commit
        run: |
          RC_SHA=$(git rev-parse "${RC_TAG}^{commit}")
          # The deploy pipeline lags the RC tag, so a freshly-cut RC is not
          # served immediately. Retry (reusing the wait pattern) for up to ~15
          # minutes before failing closed, rather than hard-failing on the
          # first attempt.
          for attempt in $(seq 1 30); do
            INFO=$(curl -s -m 15 "${BASE_URL}/api/v1/deployment" || true)
            DEPLOYED=$(echo "$INFO" | jq -r '.git_sha // empty' 2>/dev/null || true)
            if [ -z "$DEPLOYED" ] || [ "$DEPLOYED" = "null" ]; then
              echo "Attempt $attempt: could not read git_sha from ${BASE_URL}/api/v1/deployment (got: ${INFO:-<empty>}). Retrying..."
            elif [ "${DEPLOYED:0:7}" = "${RC_SHA:0:7}" ]; then
              echo "Deployment SHA match: ${DEPLOYED:0:7} == ${RC_TAG}"
              exit 0
            else
              echo "Attempt $attempt: deployment SHA mismatch: serves ${DEPLOYED:0:7}, RC is ${RC_SHA:0:7}. Retrying..."
            fi
            sleep 30
          done
          echo "::error::Deployment SHA for ${RC_TAG} (${RC_SHA:0:7}) never matched ${BASE_URL} after 15 minutes. Wait for the deploy pipeline to ship the RC before validating."
          exit 1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Configure git
        run: |
          git config user.name "modulo-release-bot"
          git config user.email "bot@modulo.run"

      - name: Obtain Bearer JWT via login (fail-closed)
        id: jwt
        env:
          RC_USER: ${{ secrets.RC_PENTEST_USERNAME }}
          RC_PASS: ${{ secrets.RC_PENTEST_PASSWORD }}
        shell: bash
        run: |
          # The backend authenticates exclusively via Bearer JWT (HTTPBearer);
          # HTTP Basic is not supported anywhere in backend/src, so the previous
          # `--auth user:pass` (Basic) was silently ignored and every auth-gated
          # GET failed conformance, deadlocking the validated/<rc> marker. We
          # mint a JWT from the pen-test credentials and pass it as a Bearer
          # header below. Fail closed if the token cannot be obtained.
          # Keep credentials off the process list: use a netrc file and pass the
          # login body via stdin (not argv).
          NETRC_HOST=$(echo "$BASE_URL" | sed -E 's#^https?://##')
          printf 'machine %s\nlogin %s\npassword %s\n' "$NETRC_HOST" "$RC_USER" "$RC_PASS" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          RESP=$(curl -sS -m 30 --netrc "${BASE_URL}/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            --data-binary @- <<JSON
          {"email":"$RC_USER","password":"$RC_PASS"}
          JSON
          ) || { echo "::error::Login request to ${BASE_URL}/api/v1/auth/login failed."; rm -f "$HOME/.netrc"; exit 1; }
          rm -f "$HOME/.netrc"
          TOKEN=$(echo "$RESP" | jq -r '.access_token // empty' 2>/dev/null || true)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not obtain JWT from login (response: ${RESP:-<empty>}). Fail-closed."
            exit 1
          fi
          # Mask the token so it cannot leak into logs.
          echo "::add-mask::$TOKEN"
          echo "RC_JWT=$TOKEN" >> "$GITHUB_ENV"
          echo "Obtained Bearer JWT for pen-test user."

      - name: Schemathesis fuzz against live RC
        env:
          RC_JWT: ${{ env.RC_JWT }}
        shell: bash
        timeout-minutes: 45
        run: |
          # --no-build (S8541): install only from pre-built wheels - never run
          # arbitrary setup scripts during installation. schemathesis publishes
          # wheels, so this is a no-op for availability.
          uv tool install --no-build "schemathesis==4.25.2"
          schemathesis run "${BASE_URL}/openapi.json" \
            --base-url "$BASE_URL" \
            --header "Authorization: Bearer ${RC_JWT}" \
            --method GET \
            --checks all \
            --max-examples 50

      - name: Record validation success (validated/<rc_tag> marker)
        if: success()
        run: |
          VALIDATED_TAG="validated/${RC_TAG}"
          git tag -f -a "$VALIDATED_TAG" -m "rc-validate SUCCESS for ${RC_TAG}" "${RC_TAG}^{commit}"
          git push origin "$VALIDATED_TAG" --force
          echo "Validation marker pushed: $VALIDATED_TAG"
