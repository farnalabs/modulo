name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.4"
      - name: Install backend deps
        working-directory: backend
        run: uv pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: backend
        run: ruff check src/
      - name: Ruff format check
        working-directory: backend
        run: ruff format --check src/
      - name: mypy
        working-directory: backend
        run: mypy --strict src/modulo/
        continue-on-error: true
      - name: Bandit
        working-directory: backend
        run: bandit -r src/modulo/ -ll -x src/modulo/model_backends/stub/
      - name: Semgrep
        working-directory: backend
        run: semgrep --config ../.semgrep/ --error src/
      - name: import-linter
        working-directory: backend
        run: lint-imports
      - name: Frontend lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run type-check
