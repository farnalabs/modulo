name: Lint

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12.4"
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Ruff lint
        working-directory: backend
        run: ruff check src/ --exit-zero
      - name: Ruff format check
        working-directory: backend
        run: ruff format --check src/ || true
      - name: mypy
        working-directory: backend
        run: mypy --strict src/modulo/
        continue-on-error: true
      - name: Bandit
        working-directory: backend
        run: bandit -r src/modulo/ -ll -x src/modulo/model_backends/stub/
      - name: Semgrep
        working-directory: backend
        run: semgrep --config ../.semgrep/ --error src/
      - name: import-linter
        working-directory: backend
        run: lint-imports
      - name: Frontend lint
        working-directory: frontend
        continue-on-error: true
        run: |
          npm ci
          npm run lint
          npm run type-check
