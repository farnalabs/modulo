services:
  db-local:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modulo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: modulo
    ports:
      - "5434:5432"
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modulo"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis-local:
    image: redis:8-alpine
    ports:
      - "6380:6379"

  # SAQ runs worker — executes run jobs (plan F8 local dev). Runs against
  # db-local/redis-local inside the compose network. Command override only; the
  # backend image is reused (its entrypoint.sh runs uvicorn, which is overridden
  # for the worker role).
  saq-runner:
    build: ./backend
    command: ["python", "-m", "saq", "modulo.core.saq_worker.runs_settings"]
    depends_on:
      db-local:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://modulo:${POSTGRES_PASSWORD:-changeme}@db-local:5432/modulo
      MODULO_DB: postgres
      SECRET_KEY: local-dev-secret-key-not-for-production
      FERNET_KEY: ${FERNET_KEY:-local-dev-only-change-me}
      REDIS_URL: redis://redis-local:6379/0
      MODULO_PUBLIC_URL: http://localhost:8000
      MODULO_USERS: admin:admin
    volumes:
      - ./backend/src:/app/src

  # SAQ system worker — owns the scheduler (fire_due_triggers) + reconcile +
  # system crons (plan F8). REQUIRED for local cron/triggers (see Local
  # Development Setup docs). Web UI bound to 127.0.0.1:8081
  # via the custom runner (fly-ssh-only equivalent in prod).
  saq-system:
    build: ./backend
    command: ["python", "-m", "modulo.core.saq_worker"]
    depends_on:
      db-local:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://modulo:${POSTGRES_PASSWORD:-changeme}@db-local:5432/modulo
      MODULO_DB: postgres
      SECRET_KEY: local-dev-secret-key-not-for-production
      FERNET_KEY: ${FERNET_KEY:-local-dev-only-change-me}
      REDIS_URL: redis://redis-local:6379/0
      MODULO_PUBLIC_URL: http://localhost:8000
      MODULO_USERS: admin:admin
      SAQ_AUTH_USERNAME: admin
      SAQ_AUTH_PASSWORD: admin
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./backend/src:/app/src

  otel-collector:
    profiles:
      - observability
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector.yml"]
    ports:
      - "4317:4317"
    volumes:
      - ./configs/otel-collector.yml:/etc/otel-collector.yml
      - otel_data:/var/log/otel

  prometheus:
    profiles:
      - observability
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      - otel-collector

  grafana:
    profiles:
      - observability
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./configs/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./configs/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata_local:
  otel_data:
  prometheus_data:
  grafana_data:
