services:
  db-local:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modulo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: modulo
    ports:
      - "127.0.0.1:5434:5432"
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modulo"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis-local:
    image: redis:8-alpine
    # FAR-2002 — same bound/policy as the root compose's `redis` service (see
    # the long rationale there): a hard maxmemory so the host is protected, and
    # `volatile-lru` so eviction can only touch TTL-bearing job hashes the
    # reconciler can re-dispatch — never the queue's structural list/zset keys.
    command:
      - redis-server
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-256mb}"
      - "--maxmemory-policy"
      - "volatile-lru"
    ports:
      - "127.0.0.1:6380:6379"

  # SAQ runs worker — executes run jobs (plan F8 local dev). Runs against
  # db-local/redis-local inside the compose network. Command override only; the
  # backend image is reused (its entrypoint.sh runs uvicorn, which is overridden
  # for the worker role).
  saq-runner:
    build: ./backend
    command: ["python", "-m", "saq", "modulo.core.saq_worker.runs_settings"]
    depends_on:
      db-local:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://modulo:${POSTGRES_PASSWORD:-changeme}@db-local:5432/modulo
      MODULO_DB: postgres
      SECRET_KEY: local-dev-secret-key-not-for-production
      FERNET_KEY: ${FERNET_KEY:-local-dev-only-change-me}
      REDIS_URL: redis://redis-local:6379/0
      MODULO_PUBLIC_URL: http://localhost:8000
      MODULO_USERS: admin:admin
      # DB capacity monitor (FAR-1882). This worker EXECUTES runs, and two
      # run-creation paths run inside that execution: agent-signal child runs
      # (executor._fire_agent_signals -> trigger_engine.agent_signal) and
      # feedback reject-correction runs (node_runner._dispatch_reject_correction
      # -> feedback_manager) - both reaching crud.run.create_run. Without the
      # volume visible here those runs resolve capacity "none" and the 98%
      # hard-stop is inert for them.
      DB_CAPACITY_PATH: /var/lib/modulo/db-volume
    volumes:
      - ./backend/src:/app/src
      # Read-only: the monitor only statvfs()es it (fails open, stop inert, if
      # it cannot - see DB_CAPACITY_BYTES to override with an explicit size).
      - pgdata_local:/var/lib/modulo/db-volume:ro

  # SAQ system worker — owns the scheduler (fire_due_triggers) + reconcile +
  # system crons (plan F8). REQUIRED for local cron/triggers (see Local
  # Development Setup docs). Web UI bound to 127.0.0.1:8081
  # via the custom runner (fly-ssh-only equivalent in prod).
  saq-system:
    build: ./backend
    command: ["python", "-m", "modulo.core.saq_worker"]
    depends_on:
      db-local:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://modulo:${POSTGRES_PASSWORD:-changeme}@db-local:5432/modulo
      MODULO_DB: postgres
      SECRET_KEY: local-dev-secret-key-not-for-production
      FERNET_KEY: ${FERNET_KEY:-local-dev-only-change-me}
      REDIS_URL: redis://redis-local:6379/0
      MODULO_PUBLIC_URL: http://localhost:8000
      MODULO_USERS: admin:admin
      SAQ_AUTH_USERNAME: admin
      SAQ_AUTH_PASSWORD: admin
      # DB capacity monitor (FAR-1882): cron/polling triggers create their runs
      # here (cron_helpers.fire_cron_trigger / _run_poll_fire), so the volume
      # must be visible in this process for the 98% hard-stop to arm with no
      # DB_CAPACITY_BYTES set.
      DB_CAPACITY_PATH: /var/lib/modulo/db-volume
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./backend/src:/app/src
      # Read-only: the monitor only statvfs()es it (fails open, stop inert, if
      # it cannot - see DB_CAPACITY_BYTES to override with an explicit size).
      - pgdata_local:/var/lib/modulo/db-volume:ro

  otel-collector:
    profiles:
      - observability
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector.yml"]
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - ./configs/otel-collector.yml:/etc/otel-collector.yml
      - otel_data:/var/log/otel

  prometheus:
    profiles:
      - observability
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      - otel-collector

  grafana:
    profiles:
      - observability
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./configs/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./configs/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata_local:
  otel_data:
  prometheus_data:
  grafana_data:
