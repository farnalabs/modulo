# fly.toml app configuration file generated for demo-modulo on 2026-06-28T11:40:08+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'demo-modulo'
primary_region = 'lhr'

[build]
  dockerfile = "backend/Dockerfile.fly"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[env]
  MODULO_DB = "postgres"
  MODULO_PLUGIN_DISCOVERY = "false"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
