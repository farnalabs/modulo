# fly.toml app configuration for app.modulo.run
# See https://fly.io/docs/reference/configuration/

app = 'app-modulo'

# ===== Machine budget (stay within the org limit) =====
# Standing footprint (verified live 2026-09-02 via `fly scale show` / `fly machines
# list`): 1 x app (2 CPU, 2gb) + 2 x worker (1 CPU, 2gb each; one is a stopped cold
# standby of the other) = 3 machines. The [[vm]] blocks below match the live machines
# exactly. NOTE: min_machines_running=2 does NOT create or keep a second app machine -
# the August 2026 invoice (2x CPU line = 2.06 machine-months) proves prod ran ONE app
# machine all month. If app-group HA is wanted that is a manual `fly scale count
# app=2 -a app-modulo` (+1 x 2-CPU machine), not a config change.
# Whole-org standing (verified 2026-09-02): 11 machines across 7 apps in org
# `personal`, ~8 started 24/7: app-modulo 3 + staging-modulo 2 + modulo-telemetry 2
# (fra, 1 running) + library-modulo 1 (ams, autostop, mostly stopped) + 3 Fly MPG
# Postgres machines (modulo-app-db 2CPU/4gb, modulo-staging-db, library-modulo-db).
# MPG machines bill as separate "MPG Cluster" lines, NOT in the "Machines" usage
# lines (verified against the Aug 2026 invoice: the 2x CPU line fits app+staging app
# machines exactly, with zero headroom for modulo-app-db). demo-modulo
# (fly.demo.toml) is NOT provisioned - no app, no machines, no cost.
# Org `modulo-admin` (separate org/bill) additionally holds 2 MPG clusters named
# modulo-telemetry-db (fra, basic); one is ORPHANED (no attached apps) - cleanup
# candidate via `fly mpg destroy`, needs-human.
# Rolling deploys peak at N+1 per process group; each deploy also launches one-off
# pre-migrate machines (shared-cpu-1x / 1gb, deploy.yml) on staging AND prod,
# destroyed after the deploy - they bill only while running. There is no automated
# budget guard in CI: deploy.yml only prunes group-less strays ("Clean up stray
# machines") - a GROUPED stray (cloned worker, failed-rolling-deploy leftover) is
# never auto-cleaned; run `fly machines list -a <app>` after incidents. The limit is
# enforced by this standing footprint + manual review before scaling up.
# Do NOT add process groups or machines without updating this block.
primary_region = 'lhr'

[deploy]
  strategy = 'rolling'

[release]
  command = "/release.sh"

[build]
  dockerfile = "backend/Dockerfile.fly"

[processes]
  app = ""
  worker = ""

# Web process group — nginx + uvicorn, handles HTTP traffic
# Restart policy — crash-loop guard + max-restart in the entrypoint is the
# control (plan F8): no auto-restart here; a crash-looping SAQ worker fails the
# container and the LB moves traffic decisively.
# Machine-level recovery for a machine whose worker/scheduler is SILENTLY dead
# (not crash-looping) is the /healthz/ready watchdog: it 503s when THIS machine's
# SAQ workers are stale on any queue OR the fire_due_triggers system cron has not
# fired within 2x its cadence (health.py _check_saq_workers / _check_system_crons),
# so Fly removes/replaces the machine without relying on a restart policy.
[[restart]]
  processes = ['app']
  policy = "never"

[http_service]
  internal_port = 8080  # nginx serves SPA; proxies API/WS/MCP to uvicorn
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  max_machines_running = 5
  processes = ['app']
  # Graceful worker drain window (plan F8): SIGTERM drains 30s + hard deadline
  # 60s each (parallel, ~90s max). kill_timeout must exceed that.
  kill_timeout = 120

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "240s"
    method = "GET"
    path = "/healthz/ready"
    protocol = "http"

# Worker process-group health check (ADR 021). Top-level [checks], not a service
# check — it does not affect routing. The worker container exposes a liveness
# server on 8082 (entrypoint.sh worker branch) that returns 200 only while BOTH
# SAQ worker subprocesses (runs + system) are alive. The worker group has no
# service/health check today, so a machine that is "up" but running no SAQ
# workers is invisible to `fly checks list` and to rolling-deploy readiness.
[checks]
  [checks.worker_health]
    interval = "15s"
    timeout = "5s"
    grace_period = "240s"
    method = "GET"
    path = "/"
    port = 8082
    type = "http"
    processes = ['worker']

# Worker process group — SAQ workers only, ALWAYS restart (ADR 021).
# policy = "always" restarts the machine no matter the exit code. "on-failure"
# only restarts a non-zero exit, so a worker machine that a rolling deploy leaves
# `stopped` (clean exit / SIGTERM teardown) stays down — the 2026-08-08 outage
# where both worker machines were `stopped` for ~3h and needed a manual
# `fly machines start`. "always" is the Fly-documented policy for long-running
# background workers: crash, clean exit, or deploy replacement all self-heal.
[[restart]]
  processes = ['worker']
  policy = "always"

[env]
  MODULO_DB = "postgres"
  # MODULO_SYSTEM_DATABASE_URL is DERIVED AT BOOT (not set here): bootstrap_db.py
  # derives it from DATABASE_URL with the modulo_system role (LOGIN, BYPASSRLS)
  # and entrypoint.sh exports it. It contains a password, so no literal value.
  MODULO_PUBLIC_URL = "https://app.modulo.run"
  # MODULO_USERS is set with `fly secrets set` and must not be committed.
  MODULO_PLUGIN_DISCOVERY = "false"
  MODULO_MAX_LOCAL_CONCURRENCY = "4"
  SAQ_WORKER_CONCURRENCY = "20"
  # Redis pool must exceed SAQ worker concurrency (blocking dequeue holds one
  # pool connection per concurrent task). Must stay > SAQ_WORKER_CONCURRENCY.
  SAQ_REDIS_POOL_SIZE = "50"
  # REQUIRED: Upstash Redis instance. Create with:
  #   fly redis create --name modulo-app-redis -r lhr,ams --enable-eviction
  # Then store its connection string with `fly secrets set REDIS_URL=...`.
  # Plan: Fixed 250MB ($10/mo + $5 per read region = $15/mo) — NOT pay-as-you-go.
  # (2026-08: PAYG projected ~$87/mo at ~46M commands; Fixed 250MB is flat $15/mo
  # with 250MB data + 50GB bandwidth. Enable auto-upgrade on the add-on as a
  # safety net: `flyctl redis update <name>` → select plan, then enable auto-upgrade.)
  CORS_ORIGINS = "https://modulo.run,https://app.modulo.run,http://localhost:5173"

[[vm]]
  processes = ['app']
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2

[[vm]]
  processes = ['worker']
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
