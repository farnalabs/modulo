# fly.toml app configuration for app.modulo.run
# See https://fly.io/docs/reference/configuration/

app = 'app-modulo'

# ===== Machine budget (stay within the org limit) =====
# Standing footprint: 1 x app (4 shared CPU, live) + 2 x worker (2 shared CPU
# declared [FAR-1511] and live on the started worker; 2gb each, one a stopped
# cold standby still on its recorded 1-CPU config) = 3 machines (verified live
# 2026-09-02 via `fly scale show` / `fly machines list`).
# [[vm]] changes do NOT resize existing machines on their own - they apply to NEW
# machines only, so a declared size reaches a live machine only through a deploy
# that recreates it, or through an explicit `flyctl machine update <machine-id> -a
# app-modulo --vm-size <size>` (brief restart; find ids with `flyctl machines list
# -a app-modulo`).
#   APP: already done - the live prod app machine was OBSERVED at shared-cpu-4x by
#   `flyctl machine status` on 2026-10-05, so no resize step is outstanding (this
#   block previously instructed one; the "after the live resize" invoice note below
#   refers to that completed resize).
#   WORKER: already done - the started worker machine was recreated at the
#   declared shared-cpu-2x by the overnight deploy (run 37414967179), so no
#   resize step is outstanding for it. The stopped cold standby is an EXISTING
#   machine, so starting it later does NOT apply the declared 2 CPU - it keeps
#   its recorded 1-CPU config until it too is updated (`flyctl machine update
#   <standby-machine-id> ... --vm-size shared-cpu-2x`, safe while stopped) or is
#   recreated by a deploy. Until then a worker failover lands on 1 CPU.
#   Rationale + the observations behind the bump:
#   docs/operations/far-1511-worker-event-loop-stalls.md.
# NOTE: prod runs ONE standing app
# machine (agreed 2026-09-02) - the August 2026 invoice (2x CPU line = 2.06
# machine-months) proves it ran that way all month. If app-group HA is ever wanted
# that is a manual `fly scale count app=2 -a app-modulo` (+1 app machine at the
# [[vm]]-declared size), not a config change.
# Whole-org standing (verified 2026-09-02): 11 machines across 7 apps in org
# `personal`, ~8 started 24/7: app-modulo 3 + staging-modulo 2 + modulo-telemetry 2
# (fra, 1 running) + library-modulo 1 (ams, autostop, mostly stopped) + 3 Fly
# Postgres APPS, each on its own volume (modulo-app-db 2CPU/4gb,
# modulo-staging-db, library-modulo-db).
# [FAR-1882 2026-10-17] Corrected: those three are NOT "Fly MPG Postgres machines"
# (Managed Postgres clusters). Observed 2026-10-17: all three appear in
# `flyctl apps list`; modulo-app-db runs one flyio/postgres-flex:17.7 machine with
# volume vol_v8epz7le8wlll75v attached; `flyctl mpg status modulo-app-db` reports no
# such managed cluster; and `flyctl mpg list` returns exactly one MPG cluster
# (modulo-telemetry-db, below), which does NOT appear in `flyctl apps list`. The
# former sentence "MPG machines bill as separate 'MPG Cluster' lines, NOT in the
# 'Machines' usage lines (verified against the Aug 2026 invoice)" rested on that
# wrong premise and has NOT been re-checked against an invoice since - treat it as
# UNVERIFIED, not settled. The invoice-line math "the 2x CPU
# line fits app+staging app machines exactly, with zero headroom for modulo-app-db"
# no longer holds after the live resize: the prod app machine adds ~2 shared CPU to
# that line going forward, so treat post-resize figures on that line as APPROXIMATE
# until verified against the next invoice. The demo Fly instance (demo-modulo) is
# retired - not provisioned, no app, no machines, no cost.
# Org `modulo-admin` (separate org/bill) holds the only MPG cluster this token can
# see: `flyctl mpg list` -> modulo-telemetry-db (org modulo-admin, fra, basic,
# status ready, attached apps: modulo-telemetry). [FAR-1882 2026-10-17] The wording
# that stood here claimed TWO clusters with one ORPHANED and flagged a
# `fly mpg destroy` cleanup (needs-human) - corrected: no orphaned cluster was
# observed, this one is ATTACHED and serving telemetry, so destroying it would take
# telemetry down. Do not destroy it.
# Rolling deploys peak at N+1 per process group; each deploy also launches one-off
# pre-migrate machines (shared-cpu-1x / 1gb, deploy.yml) on staging AND prod,
# destroyed after the deploy - they bill only while running. There is no automated
# budget guard in CI: deploy.yml only prunes group-less strays ("Clean up stray
# machines") - a GROUPED stray (cloned worker, failed-rolling-deploy leftover) is
# never auto-cleaned; run `fly machines list -a <app>` after incidents. The limit is
# enforced by this standing footprint + manual review before scaling up.
# Do NOT add process groups or machines without updating this block.
primary_region = 'lhr'

# ===== Shutdown window (FAR-2004) =====
# These are TOP-LEVEL keys (Fly documents kill_signal/kill_timeout at the top
# level only; a value nested inside [http_service] does not reach the worker
# process group). Fly's default window is 5 seconds.
#
# The worker group runs SAQ, whose graceful shutdown is a 30s job-drain grace
# (saq_worker._SHUTDOWN_GRACE_PERIOD_S) plus up to a 60s cancellation hard
# deadline (_CANCELLATION_HARD_DEADLINE_S), and only THEN the FAR-1627 shutdown
# handoff that releases/requeues the runs still executing in that process. With
# the 5s default, Fly SIGKILLed the worker ~85-115s before the handoff could
# run: every in-flight run was orphaned as `running`, its heartbeat froze, and
# `_RECONCILE_RUNS_SQL` excludes node-started rows while claim_count <= 3, so
# the 135-minute age gate was the first reaper (58 of 70 measured
# `run.no_progress` stops fell inside a deploy window).
#
# 180s comfortably outlasts the SAQ ceiling (90s) + the entrypoint's bounded
# drain (WORKER_DRAIN_DEADLINE_S=140) + teardown, and sits well inside Fly's
# 300s cap. The entrypoint forwards SIGTERM to
# the SAQ PIDs and exits as soon as they are gone, so a stop with no in-flight
# runs is still fast — this is a ceiling, not a fixed wait.
# The coupling is enforced by
# backend/tests/architecture/test_deploy_worker_shutdown.py.
kill_signal = "SIGTERM"
kill_timeout = 180

[deploy]
  strategy = 'rolling'

[release]
  command = "/release.sh"

[build]
  dockerfile = "backend/Dockerfile.fly"

[processes]
  app = ""
  worker = ""

# Web process group - nginx + uvicorn, handles HTTP traffic
# Restart policy - crash-loop guard + max-restart in the entrypoint is the
# control (plan F8): no auto-restart here; a crash-looping SAQ worker fails the
# container and the LB moves traffic decisively.
# Recovery for a machine that is alive but SILENTLY wedged (HTTP server not
# answering, state still `started`) is the external web-watchdog workflow
# (.github/workflows/web-watchdog.yml), which keys on the process-local
# [checks.app_liveness] signal below - NOT on /healthz/ready (FAR-1193 /
# ADR 043 Decision 4: readiness is deployment-scoped since FAR-1158, so a
# restart evaluator keyed on it would restart every app machine for as long as
# ANY queue in the deployment lacked a live worker - a mass-restart storm that
# restores nothing). Fly health checks never restart machines themselves
# (ADR 021) - the restart policy is Fly's recovery mechanism, and for this
# group it is deliberately `never`.
[[restart]]
  processes = ['app']
  policy = "never"

[http_service]
  internal_port = 8080  # nginx serves SPA; proxies API/WS/MCP to uvicorn
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  # Prod runs ONE standing app machine (agreed 2026-09-02): rolling deploys bring up
  # the N+1 replacement before draining the old machine, so releases never cause
  # downtime; a wedged-but-running machine is restarted by the web-watchdog
  # workflow keyed on the process-local [checks.app_liveness] signal (Fly checks
  # observe only - they never restart or replace machines, ADR 021), and a
  # crash-loop is bounded by the entrypoint crash-loop guard (plan F8).
  # Inert while auto_stop_machines is false, but kept truthful for when auto-stop
  # is ever enabled.
  min_machines_running = 1
  max_machines_running = 5
  processes = ['app']
  # Graceful shutdown window: see the TOP-LEVEL kill_signal/kill_timeout block
  # above (FAR-2004). A kill_timeout nested here does not reach the worker
  # process group — and it was never the worker that needed it.

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "240s"
    method = "GET"
    path = "/healthz/ready"
    protocol = "http"

# App process-group LIVENESS check (FAR-1193 / ADR 043 Decision 4). Top-level
# [checks], NOT a service check: observability only, it does not affect routing
# (ADR 021: Fly checks never restart machines). It probes /healthz on port 8080
# (nginx -> uvicorn) - a PROCESS-LOCAL signal that returns 200 whenever THIS
# machine's HTTP process answers, regardless of deployment state. The external
# web-watchdog restart evaluator (.github/workflows/web-watchdog.yml) keys on
# THIS check, never on the [[http_service.checks]] readiness probe above: that
# probe is deployment-scoped since FAR-1158 (any dead queue flips it on every
# app machine), so keying restarts on it would storm-restart the whole fleet.
[checks]
  [checks.app_liveness]
    interval = "15s"
    timeout = "5s"
    grace_period = "240s"
    method = "GET"
    path = "/healthz"
    port = 8080
    type = "http"
    processes = ['app']

  # Worker process-group health check (ADR 021). Top-level [checks], not a
  # service check - it does not affect routing. The worker container exposes a
  # liveness server on 8082 (entrypoint.sh worker branch) that returns 200 only
  # while BOTH SAQ worker subprocesses (runs + system) are alive. The worker
  # group has no service/health check today, so a machine that is "up" but
  # running no SAQ workers is invisible to `fly checks list` and to
  # rolling-deploy readiness.
  [checks.worker_health]
    interval = "15s"
    timeout = "5s"
    grace_period = "240s"
    method = "GET"
    path = "/"
    port = 8082
    type = "http"
    processes = ['worker']

# Worker process group - SAQ workers only, ALWAYS restart (ADR 021).
# policy = "always" restarts the machine no matter the exit code. "on-failure"
# only restarts a non-zero exit, so a worker machine that a rolling deploy leaves
# `stopped` (clean exit / SIGTERM teardown) stays down - the 2026-08-08 outage
# where both worker machines were `stopped` for ~3h and needed a manual
# `fly machines start`. "always" is the Fly-documented policy for long-running
# background workers: crash, clean exit, or deploy replacement all self-heal.
[[restart]]
  processes = ['worker']
  policy = "always"

[env]
  MODULO_DB = "postgres"
  # Deployment environment name stamped on every operator alert email (FAR-1495).
  MODULO_ENV = "production"
  # Operator-alert environment allowlist: only these MODULO_ENVs may send
  # operator alerts on any channel (email + webhook + Teams; readiness-degradation
  # + worker-liveness watchdog alerts).
  # Set to "production" on BOTH Fly apps so staging — a CI-only E2E
  # environment with no live workload — stops paging while prod keeps alerting.
  ALERT_ENVIRONMENTS = "production"
  # MODULO_SYSTEM_DATABASE_URL is DERIVED AT BOOT (not set here): bootstrap_db.py
  # derives it from DATABASE_URL with the modulo_system role (LOGIN, BYPASSRLS)
  # and entrypoint.sh exports it. It contains a password, so no literal value.
  MODULO_PUBLIC_URL = "https://app.modulo.run"
  # MODULO_USERS is set with `fly secrets set` and must not be committed.
  MODULO_PLUGIN_DISCOVERY = "false"
  # Caps in-process local-run concurrency on the web machine to reduce worst-case event-loop load (paired with the CPU bump).
  MODULO_MAX_LOCAL_CONCURRENCY = "2"
  SAQ_WORKER_CONCURRENCY = "20"
  # Code-accurate invariant: the effective pool is >= SAQ_WORKER_CONCURRENCY
  # + 5 (max() floor in saq_worker._effective_redis_pool_size - every
  # concurrent blocking dequeue holds one pool connection, plus a 5-connection
  # reserve for the upkeep ops schedule/sweep/abort/worker_info).
  SAQ_REDIS_POOL_SIZE = "50"
  # FAR-2004: the worker entrypoint's bounded drain window. Must be >= SAQ's
  # shutdown ceiling (30s grace + 60s cancellation) + handback time, and
  # comfortably below the top-level kill_timeout (180s) so the container exits
  # before Fly SIGKILLs it. Read by deploy/fly/entrypoint.sh.
  WORKER_DRAIN_DEADLINE_S = "140"
  # REQUIRED: Upstash Redis instance. Create with:
  #   fly redis create --name modulo-app-redis -r lhr,ams --enable-eviction
  # Then store its connection string with `fly secrets set REDIS_URL=...`.
  # Plan: Fixed 250MB ($10/mo + $5 per read region = $15/mo) - NOT pay-as-you-go
  # (2026-08 decision, verified 2026-09-02 via `flyctl redis list`). Prod keeps
  # SAQ_WORKER_CONCURRENCY=20 / SAQ_REDIS_POOL_SIZE=50 (ADR 017 design target -
  # up to 5 worker machines x 20 slots) and stays cheapest on Fixed while prod
  # traffic is real. See deploy/fly/fly.staging.toml for the CANONICAL command-volume
  # audit derivation that sized these knobs (staging runs the right-sized 2/10).
  # Enable auto-upgrade on the add-on as a safety net:
  # `flyctl redis update <name>` -> select plan, then enable auto-upgrade.
  CORS_ORIGINS = "https://modulo.run,https://app.modulo.run,http://localhost:5173"
  # --- DB capacity hard stop (FAR-1882) ---
  # On Fly the app and the DB are SEPARATE machines with no mountable volume, so
  # auto-detection resolves no source ("none"), capacity_percent stays null and the
  # 98% hard stop never fires. Pin the capacity explicitly instead.
  # Value = the pg_data volume's filesystem capacity, read on modulo-app-db
  # (2026-10-17): `df -B1 /data` -> /dev/vdc total 84409147392 bytes, cross-checked
  # by `stat -f -c '%b %S' /data` -> 20607702 blocks x 4096 = 84409147392. The raw
  # device is 85882568704 bytes (80 GiB) and the volume reports "Size GB: 80"; the
  # filesystem figure is the one that matters.
  # HONEST LIMITATION - do not overclaim: on this "env" source the percentage is the
  # modulo DATABASE's size (pg_database_size) over this capacity, NOT true volume
  # consumption. True consumption is what the "filesystem" source reports, available
  # on self-hosted compose because the DB volume is mounted read-only there
  # (deploy/compose/docker-compose.prod.yml). So on Fly this is a LATE signal: it
  # fires only as that one database approaches the volume total - WAL, temp files and
  # other databases on the volume are not counted. Leave DB_CAPACITY_MODE at its
  # default "fixed": only "fixed" enforces the hard stop.
  DB_CAPACITY_BYTES = "84409147392"
  # Explicit rather than the "auto" default: on Fly auto resolves no source and the
  # gate would stay inert; "env" is the only source satisfiable here.
  DB_CAPACITY_SOURCE = "env"

# 2026-09-02 wedge: the 2-shared-CPU web machine stopped answering HTTP under
# concurrent pipeline orchestration load (service check critical for 2+ hours).
# 4 shared CPU gives event-loop headroom; memory unchanged (no memory-pressure
# evidence). Applies to NEW machines only - see the machine-budget block above
# for which declared sizes have (and have not) already reached the live machines.
[[vm]]
  processes = ['app']
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 4

[[vm]]
  processes = ['worker']
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  # 2 shared CPU from FAR-1511 (was 1). This ONE machine runs the whole
  # background fleet: the `runs` SAQ worker (SAQ_WORKER_CONCURRENCY=20), the
  # `system` SAQ worker (every system cron, including dispatcher_reconcile /
  # fire_due_triggers every 60s), and the 8082 liveness server - while the web
  # machine gets 4 shared CPU (see the [[vm]] block above). Observed on the
  # live shared-cpu-1x worker 2026-10-05: with pipeline runs executing, the
  # worker logged ~10-13 `dispatch_phase.write_timeout ... timeout=2.0s
  # (dropped)` per minute, 9x `asyncpg ConnectionDoesNotExistError: connection
  # was closed in the middle of operation` + a `ConnectionResetError: [Errno
  # 104]` during connect, four `health.readiness event-loop stall detected
  # (FAR-1439)` readings, and dispatcher_reconcile blacking out for 95s
  # (`stage=reconcile_org:<org>`) - while a 50-sample probe of the SAME
  # Postgres from the 4-vCPU app machine held steady at 24-65ms with
  # event_loop_lag 5-18ms over the same window, and with no runs executing
  # every system cron held its exact 60s cadence. Full attribution note:
  # docs/operations/far-1511-worker-event-loop-stalls.md. NOTE: [[vm]] applies
  # to NEW machines only - the started worker has already been recreated at
  # this size by a deploy (see the machine-budget block above); only the
  # stopped cold standby still carries its old recorded size.
  # 1024 MB swap: applied manually 2026-09-10 to both live worker machines
  # (flyctl machine update --swap-size 1024) after cgroup v1 near-miss
  # (Committed_As ~1.25GB > CommitLimit 0.96GB, no swap, ~755MB available at
  # peak). The swap_size_mb setting also applies to NEW machines only - the
  # live machines were updated via `flyctl machine update`, so a machine
  # created from this file needs swap_size_mb declared here to get it.
  swap_size_mb = 1024
