# fly.toml app configuration for app.modulo.run
# See https://fly.io/docs/reference/configuration/

app = 'app-modulo'
primary_region = 'lhr'

[build]
  dockerfile = "backend/Dockerfile.fly"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"
    protocol = "http"

[env]
  MODULO_DB = "postgres"
  MODULO_PUBLIC_URL = "https://app.modulo.run"
  MODULO_DEMO_MODE = "true"
  MODULO_DOGFOOD_ENABLED = "true"
  # MODULO_USERS set via `flyctl secrets set` — not committed to repo
  MODULO_PLUGIN_DISCOVERY = "false"
  MODULO_MAX_LOCAL_CONCURRENCY = "4"
  # REQUIRED: Upstash Redis instance. Create with:
  #   fly redis create --name modulo-app-redis -r lhr,ams --enable-eviction
  # Then set REDIS_URL to the connection string from `fly redis status modulo-app-redis`
  REDIS_URL = "redis://default:30a066ca47a448bbba0ce80e7863a19c@fly-modulo-app-redis.upstash.io:6379"
  CORS_ORIGINS = "https://modulo.run,http://localhost:5173"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
