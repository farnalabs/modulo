app = 'demo-modulo'
primary_region = 'lhr'

# STATUS (verified 2026-09-02): this app is NOT provisioned - `fly apps list` in org
# `personal` has no demo-modulo and `fly machines list -a demo-modulo` returns
# "app not found". This file bills NOTHING today and must not be counted in the org
# machine budget. Provisioning it (2 machines per min_machines_running below) is a
# deliberate scale-up decision: +2 x 1-CPU machines on top of the org footprint
# documented in fly.toml / fly.staging.toml.

[build]
  dockerfile = "backend/Dockerfile.fly"

# Restart policy — crash-loop guard + max-restart in the entrypoint is the
# control (plan F8); no auto-restart here.
[[restart]]
  policy = "never"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']
  # Graceful worker drain window (plan F8).
  kill_timeout = 120

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz/ready"
    protocol = "http"

[env]
  # These credentials are intentionally public and enable the demo login flow.
  MODULO_AUTO_LOGIN_USERNAME = "demo"
  MODULO_AUTO_LOGIN_PASSWORD = "demo"
  MODULO_DB = "postgres"
  # MODULO_SYSTEM_DATABASE_URL is DERIVED AT BOOT (not set here): bootstrap_db.py
  # derives it from DATABASE_URL with the modulo_system role (LOGIN, BYPASSRLS)
  # and entrypoint.sh exports it. It contains a password, so no literal value.
  MODULO_PUBLIC_URL = "https://demo.modulo.run"
  MODULO_PLUGIN_DISCOVERY = "false"
  MODULO_MAX_LOCAL_CONCURRENCY = "4"
  # REQUIRED: Upstash Redis instance. Create with:
  #   fly redis create --name modulo-demo-redis -r lhr,ams --enable-eviction
  # Then store its connection string with `fly secrets set REDIS_URL=...`.
  CORS_ORIGINS = "https://modulo.run,https://demo.modulo.run"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
