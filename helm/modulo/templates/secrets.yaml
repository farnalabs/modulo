{{- if not .Values.backend.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "modulo.backend.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "modulo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
type: Opaque
data:
  {{- if .Values.secrets.SECRET_KEY }}
  SECRET_KEY: {{ .Values.secrets.SECRET_KEY | b64enc | quote }}
  {{- else }}
  SECRET_KEY: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.FERNET_KEY }}
  FERNET_KEY: {{ .Values.secrets.FERNET_KEY | b64enc | quote }}
  {{- else }}
  FERNET_KEY: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.DATABASE_URL }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.REDIS_URL }}
  REDIS_URL: {{ .Values.secrets.REDIS_URL | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.MODULO_ADMIN_PASSWORD }}
  MODULO_ADMIN_PASSWORD: {{ .Values.secrets.MODULO_ADMIN_PASSWORD | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.MODULO_SCIM_TOKEN }}
  MODULO_SCIM_TOKEN: {{ .Values.secrets.MODULO_SCIM_TOKEN | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.MODULO_RATELIMIT_BYPASS_TOKEN }}
  MODULO_RATELIMIT_BYPASS_TOKEN: {{ .Values.secrets.MODULO_RATELIMIT_BYPASS_TOKEN | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.MODULO_LICENSE_KEY }}
  MODULO_LICENSE_KEY: {{ .Values.secrets.MODULO_LICENSE_KEY | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.MODULO_USERS }}
  MODULO_USERS: {{ .Values.secrets.MODULO_USERS | b64enc | quote }}
  {{- end }}
{{- end }}
