{{- if .Values.ingress.enabled -}}
{{- $apiVersion := include "modulo.ingress.apiVersion" . -}}
{{- $pathType := .Values.ingress.pathType | default "Prefix" }}
apiVersion: {{ $apiVersion }}
kind: Ingress
metadata:
  name: {{ include "modulo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "modulo.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if $pathType }}
            pathType: {{ $pathType }}
            {{- end }}
            backend:
              {{- if eq $apiVersion "networking.k8s.io/v1" }}
              service:
                name: {{ include "modulo.ingress.backendName" (dict "ctx" $ "service" .backend.service) }}
                port:
                  number: {{ .backend.port }}
              {{- else }}
              serviceName: {{ include "modulo.ingress.backendName" (dict "ctx" $ "service" .backend.service) }}
              servicePort: {{ .backend.port }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
