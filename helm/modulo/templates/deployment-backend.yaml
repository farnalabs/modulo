apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modulo.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "modulo.labels" . | nindent 4 }}
    {{- with .Values.backend.deployment.labels }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.backend.deployment.annotations }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "modulo.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "modulo.backend.selectorLabels" . | nindent 8 }}
        {{- with .Values.backend.podLabels }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.backend.podAnnotations }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "modulo.backend.serviceAccountName" . }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "modulo.backend.image" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "modulo.fullname" . }}
            - secretRef:
                name: {{ include "modulo.backend.secretName" . }}
          {{- with .Values.backend.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- if .Values.secrets.DATABASE_URL }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "modulo.backend.secretName" . }}
                  key: DATABASE_URL
            {{- end }}
            {{- if .Values.secrets.REDIS_URL }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "modulo.backend.secretName" . }}
                  key: REDIS_URL
            {{- end }}
            {{- if and .Values.postgresql.enabled (not .Values.secrets.DATABASE_URL) }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: password
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgresql.auth.username }}:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgresql.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgresql.auth.database }}"
            {{- end }}
            {{- if and .Values.redis.enabled (not .Values.secrets.REDIS_URL) }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis
                  key: redis-password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ .Release.Name }}-redis-master.{{ .Release.Namespace }}.svc.cluster.local:6379"
            {{- end }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "modulo.backend.secretName" . }}
                  key: SECRET_KEY
            - name: FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "modulo.backend.secretName" . }}
                  key: FERNET_KEY
            {{- if .Values.secrets.MODULO_ADMIN_PASSWORD }}
            - name: MODULO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "modulo.backend.secretName" . }}
                  key: MODULO_ADMIN_PASSWORD
            {{- end }}
            {{- if .Values.secrets.MODULO_SCIM_TOKEN }}
            - name: MODULO_SCIM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "modulo.backend.secretName" . }}
                  key: MODULO_SCIM_TOKEN
            {{- end }}
            {{- if .Values.secrets.MODULO_RATELIMIT_BYPASS_TOKEN }}
            - name: MODULO_RATELIMIT_BYPASS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "modulo.backend.secretName" . }}
                  key: MODULO_RATELIMIT_BYPASS_TOKEN
            {{- end }}
            {{- if .Values.secrets.MODULO_LICENSE_KEY }}
            - name: MODULO_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "modulo.backend.secretName" . }}
                  key: MODULO_LICENSE_KEY
            {{- end }}
            {{- if .Values.secrets.MODULO_USERS }}
            - name: MODULO_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "modulo.backend.secretName" . }}
                  key: MODULO_USERS
            {{- end }}
          {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.backend.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.backend.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.backend.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.backend.startupProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.backend.startupProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- with .Values.backend.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.backend.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
