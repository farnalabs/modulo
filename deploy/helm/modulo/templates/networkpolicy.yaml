{{- if .Values.workspaceNetworkPolicy.enabled }}
{{/*
  Workspace egress NetworkPolicy (FAR-1690, substrate-authoring posture).

  On the Kubernetes (T3) tier bounded egress is NOT enforced inside the
  workspace pod — the pod's network is owned by the cluster CNI. The K8s
  runtime provider ACCEPTS a deny-all request as a DECLARED posture and
  names NetworkPolicy as its prerequisite; it refuses only an in-pod
  selected-mode/allowlist request (the rendered policy's allowlist is
  cluster-level and cannot express a per-node allowlist). This template is
  the authoring layer for that declared deny-all: Modulo AUTHORS the policy
  as a Helm-rendered manifest and the customer's CNI enforces it. The egress
  posture Modulo records for this is `declared` (see `EgressPosture` in
  backend/src/modulo/core/pipeline_engine/egress.py) — Modulo declares the
  policy; it never observes the substrate's traffic, and the deny-all is
  never certified as an enforced guarantee.

  Scope:
    - selects the workspace pods via the label the runtime provider stamps
      (`modulo.provider: kubernetes`, see core/runtime_provider/k8s.py);
    - governs EGRESS only;
    - exact-target allowlist entries are CIDR + port (a NetworkPolicy cannot
      express a hostname — resolve names upstream if that is required);
    - cluster DNS is permitted by default so a deny-by-default policy does
      not break name resolution; the namespaceSelector is narrowed to
      `workspaceNetworkPolicy.dnsNamespace` when set (see values.yaml) and
      left cluster-wide (`{}`) when empty.

  Two constraints this manifest cannot express, and that bound what a
  `declared` posture guarantees:
    - some CNIs silently DROP fragmented traffic under NetworkPolicy — that is
      a CNI limitation, not a policy authorable here;
    - enforcement belongs to the CNI, not Modulo: enabling this asserts a
      deny-by-default egress posture for workspace pods, so confirm your CNI
      enforces NetworkPolicy.

  This is one vanilla networking.k8s.io/v1 manifest, off by default, and does
  NOT create a per-CNI policy-dialect matrix. Allowlist protocol/port entries
  are validated (TCP/UDP/SCTP casing, 1-65535 range) so typos fail fast at
  render rather than being silently rejected by the API server.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "modulo.fullname" . }}-workspace-egress
  namespace: {{ include "modulo.namespace" . }}
  labels:
    {{- include "modulo.labels" . | nindent 4 }}
    app.kubernetes.io/component: workspace-egress
spec:
  podSelector:
    matchLabels:
      modulo.provider: kubernetes
  policyTypes:
    - Egress
  egress:
    {{- if .Values.workspaceNetworkPolicy.allowDns }}
    # Cluster DNS is permitted by default so a deny-by-default policy never
    # breaks service/name resolution. namespaceSelector is narrowed to
    # .Values.workspaceNetworkPolicy.dnsNamespace when set, and left
    # cluster-wide ({}) when empty (e.g. DNS outside kube-system).
    - to:
        {{- if .Values.workspaceNetworkPolicy.dnsNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.workspaceNetworkPolicy.dnsNamespace | quote }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- range .Values.workspaceNetworkPolicy.egressAllowlist }}
    - to:
        - ipBlock:
            cidr: {{ required "workspaceNetworkPolicy.egressAllowlist[].cidr is required" .cidr | quote }}
      ports:
        {{- range .ports }}
        {{- $protocol := .protocol | default "TCP" | upper }}
        {{- if not (has $protocol (list "TCP" "UDP" "SCTP")) }}
        {{- fail (printf "workspaceNetworkPolicy.egressAllowlist[].ports[].protocol must be one of TCP/UDP/SCTP (got %q)" (.protocol | toString)) }}
        {{- end }}
        {{- $port := required "workspaceNetworkPolicy.egressAllowlist[].ports[].port is required" .port | int }}
        {{- if or (lt $port 1) (gt $port 65535) }}
        {{- fail (printf "workspaceNetworkPolicy.egressAllowlist[].ports[].port must be between 1 and 65535 (got %v)" .port) }}
        {{- end }}
        - protocol: {{ $protocol }}
          port: {{ $port }}
        {{- end }}
    {{- end }}
{{- end }}
