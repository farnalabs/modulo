apiVersion: v1
kind: Service
metadata:
  name: {{ include "modulo.fullname" . }}-backend
  namespace: {{ include "modulo.namespace" . }}
  labels:
    {{- include "modulo.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http-backend
      protocol: TCP
      name: http-backend
  selector:
    {{- include "modulo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "modulo.fullname" . }}-saq-system
  namespace: {{ include "modulo.namespace" . }}
  labels:
    {{- include "modulo.labels" . | nindent 4 }}
    app.kubernetes.io/component: saq-system
spec:
  type: {{ .Values.saqSystem.service.type }}
  ports:
    - port: {{ .Values.saqSystem.service.port }}
      targetPort: http-saq-system
      protocol: TCP
      name: http-saq-system
  selector:
    {{- include "modulo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: saq-system
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "modulo.fullname" . }}-frontend
  namespace: {{ include "modulo.namespace" . }}
  labels:
    {{- include "modulo.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http-frontend
      protocol: TCP
      name: http-frontend
  selector:
    {{- include "modulo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
