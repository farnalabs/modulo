apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modulo.fullname" . }}-saq-runner
  namespace: {{ include "modulo.namespace" . }}
  labels:
    {{- include "modulo.labels" . | nindent 4 }}
    app.kubernetes.io/component: saq-runner
spec:
  replicas: {{ .Values.saqRunner.replicaCount }}
  selector:
    matchLabels:
      {{- include "modulo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: saq-runner
  template:
    metadata:
      labels:
        {{- include "modulo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: saq-runner
      {{- with .Values.saqRunner.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "modulo.serviceAccountName" . }}
      # Opt-in via serviceAccount.automountServiceAccountToken (default
      # false): the Kubernetes runtime provider has this workload
      # create/exec/log workspace pods in-cluster, so operators enabling that
      # provider must turn this on to give it a namespaced credential. With
      # the provider off nothing here calls the Kubernetes API, and an
      # unmounted token keeps the blast radius of a compromised pod small
      # (kubernetes:S6865).
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: saq-runner
          image: {{ include "modulo.image" (dict "image" .Values.saqRunner.image) | quote }}
          imagePullPolicy: {{ .Values.saqRunner.image.pullPolicy }}
          command:
            {{- toYaml .Values.saqRunner.command | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "modulo.fullname" . }}-secrets
                  key: DATABASE_URL
            - name: MODULO_SYSTEM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "modulo.fullname" . }}-secrets
                  key: MODULO_SYSTEM_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "modulo.fullname" . }}-secrets
                  key: REDIS_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "modulo.fullname" . }}-secrets
                  key: SECRET_KEY
            - name: FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "modulo.fullname" . }}-secrets
                  key: FERNET_KEY
            {{- range $key, $value := .Values.saqRunner.env }}
            {{- if and (ne $key "DATABASE_URL") (ne $key "MODULO_SYSTEM_DATABASE_URL") (ne $key "REDIS_URL") (ne $key "SECRET_KEY") (ne $key "FERNET_KEY") (ne $key "SAQ_AUTH_USERNAME") (ne $key "SAQ_AUTH_PASSWORD") }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "modulo.fullname" . }}-config
          resources:
            limits:
              cpu: {{ .Values.saqRunner.resources.limits.cpu | quote }}
              memory: {{ .Values.saqRunner.resources.limits.memory | quote }}
              ephemeral-storage: {{ .Values.saqRunner.resources.limits.ephemeralStorage | quote }}
            requests:
              cpu: {{ .Values.saqRunner.resources.requests.cpu | quote }}
              memory: {{ .Values.saqRunner.resources.requests.memory | quote }}
              ephemeral-storage: {{ .Values.saqRunner.resources.requests.ephemeralStorage | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.saqRunner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.saqRunner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.saqRunner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
