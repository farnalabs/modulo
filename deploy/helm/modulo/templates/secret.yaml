{{/*
Secret for database, Redis, and application credentials.
SECRET_KEY and FERNET_KEY are mandatory — the chart fails at render time
if they are not supplied (the backend and SAQ workers crash-loop without
them). Other keys are optional and rendered only when provided.
*/}}
{{- $secretKey := required "backend.env.SECRET_KEY is required — generate with: openssl rand -base64 32" .Values.backend.env.SECRET_KEY -}}
{{- $fernetKey := required "backend.env.FERNET_KEY is required — generate with: python -c \"from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())\"" .Values.backend.env.FERNET_KEY -}}
{{- $dbUrl := include "modulo.databaseUrl" . -}}
{{- $dbAdminUrl := include "modulo.databaseAdminUrl" . -}}
{{- $sysUrl := include "modulo.systemDatabaseUrl" . -}}
{{- $redisUrl := include "modulo.redisUrl" . -}}
{{- $redisPassword := include "modulo.redisPassword" . -}}
{{- $saqAuthUser := "" -}}
{{- $saqAuthPass := "" -}}
{{- if .Values.backend.env.SAQ_AUTH_USERNAME -}}
{{- $saqAuthUser = .Values.backend.env.SAQ_AUTH_USERNAME -}}
{{- end -}}
{{- if .Values.backend.env.SAQ_AUTH_PASSWORD -}}
{{- $saqAuthPass = .Values.backend.env.SAQ_AUTH_PASSWORD -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "modulo.fullname" . }}-secrets
  namespace: {{ include "modulo.namespace" . }}
  labels:
    {{- include "modulo.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY: {{ $secretKey | b64enc | quote }}
  FERNET_KEY: {{ $fernetKey | b64enc | quote }}
  # Always rendered, even when empty: the workloads reference these keys with a
  # non-optional secretKeyRef, so an absent key causes CreateContainerConfigError
  # (permanent crash-loop) rather than a clear application-level error.
  DATABASE_URL: {{ $dbUrl | b64enc | quote }}
  DATABASE_ADMIN_URL: {{ $dbAdminUrl | b64enc | quote }}
  # Always rendered (may be empty), same non-optional secretKeyRef contract as
  # DATABASE_URL above. See README "Required Values" for the failure mode when
  # it is empty (saq-system crash-loop → readiness never passes).
  MODULO_SYSTEM_DATABASE_URL: {{ $sysUrl | b64enc | quote }}
  REDIS_URL: {{ $redisUrl | b64enc | quote }}
  {{- if $saqAuthUser }}
  SAQ_AUTH_USERNAME: {{ $saqAuthUser | b64enc | quote }}
  {{- end }}
  {{- if $saqAuthPass }}
  SAQ_AUTH_PASSWORD: {{ $saqAuthPass | b64enc | quote }}
  {{- end }}
  {{- if $redisPassword }}
  REDIS_PASSWORD: {{ $redisPassword | b64enc | quote }}
  {{- end }}
