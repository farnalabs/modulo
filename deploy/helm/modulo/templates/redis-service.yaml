{{- if .Values.redis.embedded }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "farna-control.fullname" . }}-redis
  namespace: {{ include "farna-control.namespace" . }}
  labels:
    {{- include "farna-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: http-redis
      protocol: TCP
      name: http-redis
  selector:
    {{- include "farna-control.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
