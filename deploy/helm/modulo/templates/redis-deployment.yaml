{{- if .Values.redis.embedded }}
{{- $redisPassword := include "farna-control.redisPassword" . }}
{{- $redisPassword = required "redis.password or redis.existingSecret is required when redis.embedded=true" $redisPassword }}
{{- /* FAR-2002: volatile-lru evicts ONLY TTL-bearing keys. The SAQ queue's
structural keys (queued/active lists, incomplete zset) carry no TTL and must
never be evicted; an allkeys-* policy can lose them with nothing to repair. */}}
{{- $redisArgs := list "redis-server" "--maxmemory" "256mb" "--maxmemory-policy" "volatile-lru" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "farna-control.fullname" . }}-redis
  namespace: {{ include "farna-control.namespace" . }}
  labels:
    {{- include "farna-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "farna-control.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "farna-control.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      serviceAccountName: {{ include "farna-control.serviceAccountName" . }}
      # Redis never calls the Kubernetes API, so its token stays unmounted
      # unconditionally (kubernetes:S6865) — Kubernetes would otherwise
      # default this to true and mount a bearer token into the queue backend.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-redis
              containerPort: 6379
              protocol: TCP
          {{- if $redisPassword }}
          command: ["sh", "-c"]
          args:
            - exec redis-server --maxmemory 256mb --maxmemory-policy volatile-lru --requirepass "$REDIS_PASSWORD"
          {{- else }}
          command:
            {{- toYaml $redisArgs | nindent 12 }}
          {{- end }}
          {{- if $redisPassword }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "farna-control.fullname" . }}-secrets
                  key: REDIS_PASSWORD
          {{- end }}
          livenessProbe:
            exec:
              {{- if $redisPassword }}
              command: ["sh", "-c", 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping']
              {{- else }}
              command: ["redis-cli", "ping"]
              {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              {{- if $redisPassword }}
              command: ["sh", "-c", 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping']
              {{- else }}
              command: ["redis-cli", "ping"]
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
{{- end }}
