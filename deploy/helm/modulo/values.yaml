# ============================================================================
# Modulo Helm Chart — values.yaml
# ============================================================================
# Vendor-neutral defaults. Runs unmodified on EKS/AKS/GKE with sensible
# resource limits and pod security policies.
#
# External Postgres is required — the chart does NOT deploy a database.
# Redis is external by default; set redis.embedded=true to deploy one in-cluster.
#
# Secrets: no literal secrets live in this file. Use existingSecret references
# or set values that get rendered into a Secret resource only when explicitly
# configured. See the README for details.
# ============================================================================

# -- Global settings --------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# -- Image Pull Secrets -----------------------------------------------------
# Required for private GHCR images (ghcr.io/farnalabs/modulo/*).
# Example: imagePullSecrets: [{name: ghcr-secret}]
# Public images would remove the need for this.
imagePullSecrets: []

# -- Namespace --------------------------------------------------------------
namespace:
  create: true
  annotations:
    # Ownership annotation so operators can identify chart-managed namespaces.
    # The chart sets this automatically; do not remove.
    app.kubernetes.io/managed-by: helm

# -- ResourceQuota ----------------------------------------------------------
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"

# -- LimitRange -------------------------------------------------------------
limitRange:
  enabled: true
  default:
    cpu: "500m"
    memory: "512Mi"
  defaultRequest:
    cpu: "100m"
    memory: "128Mi"

# -- Pod Security Admission -------------------------------------------------
# Apply "restricted" enforcement at namespace level. All Modulo containers run
# as non-root with drop-all capabilities, so this is safe.
podSecurity:
  enforce: restricted
  audit: restricted
  warn: restricted

# -- Service Account --------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- External Postgres (default) --------------------------------------------
# This chart never deploys Postgres; provide an external database via
# postgres.host (recommended) or backend.env.DATABASE_URL.
postgres:
  host: ""
  port: 5432
  database: modulo
  # The RESTRICTED runtime role used for application queries (DATABASE_URL).
  # bootstrap_role creates/modifies this role on startup with DML-only grants.
  username: modulo_app
  # The admin/superuser role used for migrations and role bootstrap
  # (DATABASE_ADMIN_URL). The operator must provision this role with
  # superuser (or at minimum CREATEROLE + CREATEDB) rights so
  # bootstrap_role can create/alter the app role.
  adminUsername: modulo
  # Password reference: use existingSecret or set password (rendered into Secret).
  # Shared between app and admin roles; split if your setup requires it.
  existingSecret: ""
  password: ""

# -- External Redis (default) -----------------------------------------------
# When embedded=true, deploy a Redis container in the chart.
# When embedded=false (default), use an external Redis.
redis:
  embedded: false
  host: redis-master
  port: 6379
  db: 0
  # Password reference: use existingSecret or set password (rendered into the
  # chart Secret as REDIS_PASSWORD and applied to the embedded Redis container;
  # REDIS_URL embeds the same password).
  existingSecret: ""
  password: ""

# -- Backend ----------------------------------------------------------------
backend:
  replicaCount: 1

  image:
    repository: ghcr.io/farnalabs/modulo/backend
    # Digest takes precedence over tag when both are set.
    # Example: sha256:abc123...
    digest: ""
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # Health checks derived from backend src/modulo/api/routes/health.py.
  #
  # Liveness MUST use /healthz (shallow — returns {"status":"ok"} immediately).
  # /healthz/ready is the DEEP readiness gate that checks database, redis,
  # SAQ workers, dispatcher reconcile, system crons, and 13 other subsystems.
  # It 503s during normal warmup. If liveness also points at /healthz/ready,
  # the kubelet kills the container before subsystems initialise — classic
  # liveness/readiness inversion (observed on the live cluster: restart loop
  # every ~75s because dispatcher_reconcile was unavailable during startup).
  livenessProbe:
    httpGet:
      path: /healthz
      port: http-backend
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /healthz/ready
      port: http-backend
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  env: {}
  # Additional environment variables (key: value).
  # Example:
  #   MODULO_LOG_LEVEL: debug
  #   MODULO_DEV_MODE: "true"

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# -- SAQ Runner (runs pipeline jobs) ----------------------------------------
saqRunner:
  replicaCount: 1

  image:
    repository: ghcr.io/farnalabs/modulo/backend
    digest: ""
    tag: "latest"
    pullPolicy: IfNotPresent

  # Command derived from docker-compose.yml: python -m saq modulo.core.saq_worker.runs_settings
  command: ["python", "-m", "saq", "modulo.core.saq_worker.runs_settings"]

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  env: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# -- SAQ System (scheduler + reconcile + system crons) ----------------------
saqSystem:
  replicaCount: 1

  image:
    repository: ghcr.io/farnalabs/modulo/backend
    digest: ""
    tag: "latest"
    pullPolicy: IfNotPresent

  # Command derived from docker-compose.yml: python -m modulo.core.saq_worker
  command: ["python", "-m", "modulo.core.saq_worker"]

  service:
    type: ClusterIP
    port: 8081

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  env: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# -- Frontend (nginx SPA) ---------------------------------------------------
frontend:
  replicaCount: 1

  image:
    repository: ghcr.io/farnalabs/modulo/frontend
    digest: ""
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  # Frontend is a static SPA — liveness/readiness are simple.
  livenessProbe:
    httpGet:
      path: /
      port: http-frontend
    initialDelaySeconds: 5
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /
      port: http-frontend
    initialDelaySeconds: 5
    periodSeconds: 10

  env: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# -- Ingress ----------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: modulo.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- HPA --------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80
