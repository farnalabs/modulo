# Bundled Runner CI harness compose overlay (FAR-773).

# Non-default compose file: this overlay is a STANDALONE test rig for the
# Bundled Runner's real topology (app -> socket-proxy -> Docker engine). It is
# NOT merged with the root docker-compose.yml and does NOT define Modulo
# services — it exists so the CI job (and any local reproduction) can boot the
# exact proxy/engine/network shape the docker-marked suite asserts against:
#
#   docker compose -f deploy/compose/runner-ci.yml --profile runner-ci up -d
#   # then: DOCKER_HOST=tcp://127.0.0.1:<proxy-port> run the docker-marked
#   # tests (see .github/workflows/ci.yml, job "Bundled Runner harness")
#
# Everything here is phase-0-spike-verified (Repos/devtools/adr/plans/
# d9-phase0-spike.md); deviations from the spike are listed at the bottom.
#
# Wall-clock budget (measured locally, Docker Desktop 29.7.2, 4 CPU / 17.5 GiB,
# compose v5.4.0, cold image cache for the proxy + dind, warm alpine:
#   compose up (incl. proxy + dind pull)  ~105 s
#   docker-marked suite (9 tests)         ~75 s  (warm; first run pays the
#                                                 in-dind alpine pull, +~30 s)
#   total harness job                     ~3 min warm, ~5 min cold
# The CI job timeout is 900 s (~1.5x the cold-path worst case); the 2-vCPU
# hosted-runner multiplier is unknown until the first CI run — revisit after.
#
# Cleanup: docker compose -f deploy/compose/runner-ci.yml --profile runner-ci
# down -v --remove-orphans   (the harness tests also clean up their own
# containers/networks; a failed run may leave modulo-ci-* strays).

services:
  # FILTERED Docker endpoint under test. The docker-marked suite points at
  # this proxy through its published 127.0.0.1 port and asserts the
  # allow/deny matrix, the nested round-trip, log completeness, and the
  # workspace isolation probe against it.
  docker-socket-proxy:
    # Digest-pinned (linuxserver/socket-proxy — the phase-0 spike
    # recommendation). The digest here is the CURRENT release at harness
    # build time (FAR-773), NOT the spike's reference digest. Digest advances
    # ride the weekly trivy cadence documented in deploy/compose/runner.yml.
    image: lscr.io/linuxserver/socket-proxy@sha256:ba211325155c463a1a6e6a038c928f21447a8e60ce02ecf41302047974097e84
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Same per-category allowlist as the production overlay
      # (deploy/compose/runner.yml) — the CI rig must exercise the REAL
      # config, not a widened test variant:
      #   CONTAINERS -> ^/containers/* (list/create/start/inspect/exec-create
      #     + residual kill/attach/rename/update/... surface)
      #   EXEC -> ^/exec/* (exec-start hijacked-stream + exec-inspect;
      #     exec-create is gated by CONTAINERS, exec-start by EXEC)
      #   IMAGES -> ^/images/* (POST /images/create = provision pulls)
      #   PING/VERSION/INFO -> health + engine-shape probes
      #   POST -> ALL non-GET methods (DELETE included — container destroy
      #     needs no extra switch; the method gate is "GET or POST-flag")
      #   ALLOW_* deny-refinements: archive/export/logs/top/change stay
      #     denied even with CONTAINERS=1 (linuxserver's strictly-better
      #     default posture; the matrix smoke test asserts the 403s).
      CONTAINERS: "1"
      EXEC: "1"
      IMAGES: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      POST: "1"
      ALLOW_ARCHIVE: "0"
      ALLOW_EXPORT: "0"
      ALLOW_LOGS: "0"
      ALLOW_TOP: "0"
      ALLOW_CHANGE: "0"
      LOG_LEVEL: "info"
    ports:
      # localhost-only publish: the Windows/macOS HOST (where pytest runs)
      # cannot reach container bridge IPs directly. Never widen this beyond
      # the loopback interface.
      - "127.0.0.1::2375"
    networks:
      - harness
    labels:
      modulo.test: runner-ci-proxy

  # The Docker ENGINE the docker-marked tests drive as the worker's
  # MODULO_DOCKER_HOST target for the docker-marked tests' engine-kill strip
  # and the in-dind nested round-trip. DOCKER_TLS_CERTDIR is deliberately
  # EMPTY (plain TCP on 2375, loopback-only publish) — spike (d) shape.
  # First-run image pulls are charged to dind's OWN store (no host-cache
  # sharing): the CI job pre-pulls alpine inside dind; locally the first
  # docker-marked run pays ~30 s for the same pull.
  dind:
    image: docker:28-dind
    restart: "no"
    privileged: true
    command:
      - --host=unix:///var/run/docker.sock
      - --host=tcp://0.0.0.0:2375
    environment:
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "127.0.0.1::2375"
    networks:
      - harness
    labels:
      modulo.test: runner-ci-dind

  # Spike surprise #1: `compose --profile` does NOT create unreferenced
  # networks. The workspace network is referenced ONLY by provisioned
  # containers (created via the proxy with NetworkingConfig at create — no
  # /networks/* API calls, which the proxy denies by design), so without a
  # reference-holding service compose never creates it and the first
  # provision's container start fails with "network not found". This
  # holder-only service exists purely to make compose materialize the
  # network; it runs and exits immediately (no image cost beyond busybox).
  workspace-network-holder:
    image: busybox:1.36
    restart: "no"
    entrypoint: ["true"]
    networks:
      - workspace
    labels:
      modulo.test: runner-ci-holder

networks:
  # The compose/backend-side network the proxy and dind attach to.
  harness:
    driver: bridge
  # The dedicated workspace bridge. Provisioned workspace containers attach
  # HERE at create-time and NEVER join `harness` — so they are name-blocked
  # (the docker-socket-proxy alias exists only on `harness`). IP-blocked
  # additionally relies on the ENGINE's bridge isolation rules, which are
  # engine-dependent (observed 2026-09-10: Docker Desktop engine 29.7.2 no
  # longer installs the DOCKER-ISOLATION ruleset — FAR-774). The isolation
  # probe therefore runs a control experiment first and skips the IP leg
  # LOUDLY when the engine demonstrably permits cross-bridge traffic;
  # operators on such engines must firewall the proxy endpoint at the host
  # (docs/security/bundled-runner-trust-boundary.md). The proxy itself never
  # attaches to this network.
  # The explicit `name:` pins the engine-side network name regardless of the
  # compose -p / directory-derived project name, so the harness tests (and
  # the DockerRuntimeProvider workspace attach) reference one stable name.
  workspace:
    driver: bridge
    name: runner-ci-workspace

# Volume note: nothing here declares volumes; the engine socket is a bind
# mount and dind keeps its nested store on its container filesystem (discarded
# with the container — the engine-kill test depends on exactly that).
