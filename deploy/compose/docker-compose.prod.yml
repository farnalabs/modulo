services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: modulo
      POSTGRES_USER: modulo
      POSTGRES_PASSWORD: ${MODULO_DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modulo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  modulo:
    image: ghcr.io/farnalabs/modulo:${TAG:-latest}
    ports:
      - "${PORT:-80}:80"
    environment:
      DATABASE_URL: postgresql+asyncpg://modulo_app:${MODULO_DB_PASSWORD:-changeme}@postgres:5432/modulo
      DATABASE_ADMIN_URL: postgresql+asyncpg://modulo:${MODULO_DB_PASSWORD:-changeme}@postgres:5432/modulo
      MODULO_REDIS_URL: redis://redis:6379/0
      MODULO_PUBLIC_URL: ${MODULO_PUBLIC_URL:-http://localhost:80}
      MODULO_ENV: production
      MODULO_LOG_LEVEL: ${MODULO_LOG_LEVEL:-info}
      MODULO_LICENSE_KEY: ${MODULO_LICENSE_KEY:-}
      MODULO_SECRET_KEY: ${MODULO_SECRET_KEY:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Health watchdog (Gatus) - same image and config as the root
  # docker-compose.yml's watchdog: built from ../watchdog and mounted from
  # there, so nothing is duplicated in this directory. Enabled by default.
  #
  # Probes THIS deployment over the compose network: the all-in-one image
  # serves the app behind nginx on port 80, whose `location /health` prefix
  # proxies /healthz/ready through to uvicorn - uvicorn's own 127.0.0.1:8000
  # is loopback-bound inside the container, so backend:8000 (the root compose's
  # target) does not exist here.
  #
  # No `depends_on` on `modulo`, deliberately: this service reports the app
  # being unhealthy, so it must start regardless. Monitoring is on from the
  # first `up`; email alerting stays off until SMTP_HOST / SMTP_PORT /
  # EMAIL_FROM / ALERT_EMAIL_TO are set (the same variables the app uses for
  # HITL email - one SMTP setup serves both). See deploy/watchdog/README.md.
  watchdog:
    build: ../watchdog
    restart: unless-stopped
    environment:
      WATCHDOG_PROBE_URL: http://modulo:80/healthz/ready
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    volumes:
      - ../watchdog/config.yaml:/config/config.yaml:ro
    ports:
      # Loopback-only dashboard. 8083 rather than the root compose's 8082 so
      # a root-compose stack and this one can share a host; it collides with
      # nothing in this file (the modulo app publishes ${PORT:-80}:80).
      - "127.0.0.1:8083:8080"
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      # start_period matches the root compose's watchdog so a slow dashboard
      # boot is not flapped unhealthy before the first probe succeeds.
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
