[supervisord]
nodaemon=true
user=www-data
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:backend]
command=uvicorn modulo.api.main:app --host 127.0.0.1 --port 8000
directory=/app
environment=PATH="/app/.venv/bin:%(ENV_PATH)s"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/backend.err.log
stdout_logfile=/var/log/supervisor/backend.out.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log

# SAQ queue workers (FAR-1509). This image is what
# deploy/compose/docker-compose.prod.yml runs, and before these two programs
# existed the artifact started only the API and the web tier: no pipeline run,
# cron trigger or polling trigger could ever execute, and /healthz/ready
# reported `saq_workers: unavailable - no live saq workers on queue(s)
# ['runs', 'system']`. The product's core function was inert.
#
# The two commands are exactly the root docker-compose.yml's `saq-runner` and
# `saq-system` services - backend/tests/architecture/test_all_in_one_supervisor_workers.py
# pins that match so the two cannot drift. Running them INSIDE the application
# container (rather than as separate compose services) is what guarantees they
# receive the same environment the application receives: supervisord inherits
# the whole container env (compose `environment:` + env_file) and each program
# re-exposes it through the PATH it declares - no duplicated DATABASE_URL /
# SECRET_KEY / FERNET_KEY block to fall out of sync (the FAR-1506 class).
#
# Logs land beside the backend and nginx logs under /var/log/supervisor/, so
# an operator reads them with:
#   docker compose -f deploy/compose/docker-compose.prod.yml exec modulo \
#     tail -f /var/log/supervisor/saq-runs.out.log

[program:saq-runs]
command=python -m saq modulo.core.saq_worker.runs_settings
directory=/app
environment=PATH="/app/.venv/bin:%(ENV_PATH)s"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/saq-runs.err.log
stdout_logfile=/var/log/supervisor/saq-runs.out.log

# The system worker owns the `system` queue: fire_due_triggers (cron +
# polling triggers) and the system crons. It also serves the SAQ web UI on
# 127.0.0.1:8081 (loopback-only inside the container, never published) and
# FAILS CLOSED without SAQ_AUTH_USERNAME / SAQ_AUTH_PASSWORD - which is why
# deploy/compose/docker-compose.prod.yml requires both rather than letting
# this program crash-loop behind a healthy-looking API.
[program:saq-system]
command=python -m modulo.core.saq_worker
directory=/app
environment=PATH="/app/.venv/bin:%(ENV_PATH)s"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/saq-system.err.log
stdout_logfile=/var/log/supervisor/saq-system.out.log
