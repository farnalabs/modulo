server {
    listen 8080;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Frontend static files (built from the SPA)
    root /usr/share/nginx/html;
    index index.html;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_connect_timeout 10;
        proxy_send_timeout 30;
        proxy_read_timeout 125;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP server — HTTP+SSE streaming endpoint.
    # DO NOT add proxy_set_header Connection ""; here — it stalls MCP tools
    # indefinitely through the Fly global load balancer (regression, tried
    # before). Keep the Connection header unset on /mcp. See backend/AGENTS.md
    # lesson "nginx /mcp SSE proxy: never set Connection "" on the /mcp location".
    location /mcp {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_set_header Host "127.0.0.1:8000";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
    }

    # Health check
    location /healthz {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_connect_timeout 5;
        proxy_read_timeout 10;
        proxy_set_header Host $host;
    }

    # Host-keyed robots.txt: staging is not indexed (unreleased data); app/demo use the static allow-all file.
    location = /robots.txt {
        default_type text/plain;
        if ($host = staging.modulo.run) {
            return 200 "User-agent: *\nDisallow: /\n";
        }
        try_files /robots.txt =404;
    }

    # SPA fallback — never cache HTML (it changes on every deploy)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
