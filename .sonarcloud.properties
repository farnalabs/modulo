# SonarCloud configuration for AUTOMATIC analysis (GitHub App).
# NOTE: automatic analysis ignores sonar-project.properties; this
# .sonarcloud.properties file is the supported way to set analysis scope.
#
# IMPORTANT: SonarCloud's automatic analysis does NOT support wildcard
# patterns (`**`) in this file — only exact file paths are honoured. The
# earlier `**/schema.ts`, `**/locales/**`, `frontend/src/__tests__/**` globs
# were silently ignored, so the duplication gate kept failing. The entries
# below use exact paths only.
#
# The following are data/framework-generated files whose repetitive structure is
# inherent and must not count against the new-code duplication gate
# (new_duplicated_lines_density):
#   * frontend/src/lib/api/schema.ts  — AUTO-GENERATED by openapi-typescript
#     (scripts/run_generate_api_types.py). Every path/operation repeats identical
#     `parameters: { query?: never; ... }` and `put?: never; ...` boilerplate.
#   * frontend/src/locales/en-US.js    — i18n translation catalog. Each entry is a
#     `"key": "value"` pair; the repetitive structure is data, not logic, and
#     newly added view namespaces are routinely flagged against existing entries.
#   * frontend/src/__tests__/LibraryView.spec.ts        — Vitest spec. The
#     `router.push` / `mount` / `nextTick` setup and inline fixture-object
#     boilerplate repeats across every `it(...)` block; this is expected test
#     scaffolding, not duplicated production logic.
#   * frontend/src/__tests__/LibraryPrimitiveCard.spec.ts — same test scaffolding
#     repetition as above.
# Excluding these keeps the duplication gate focused on hand-written source.
# They remain in sync via the CI "Schema freshness" job, so excluding them hides
# no drift and no genuine logic duplication.
sonar.exclusions=frontend/src/lib/api/schema.ts,frontend/src/locales/en-US.js,frontend/src/__tests__/LibraryView.spec.ts,frontend/src/__tests__/LibraryPrimitiveCard.spec.ts
sonar.cpd.exclusions=frontend/src/lib/api/schema.ts,frontend/src/locales/en-US.js,frontend/src/__tests__/LibraryView.spec.ts,frontend/src/__tests__/LibraryPrimitiveCard.spec.ts
