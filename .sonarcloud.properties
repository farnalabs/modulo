# SonarCloud configuration for AUTOMATIC analysis (GitHub App).
# NOTE: automatic analysis ignores sonar-project.properties; this
# .sonarcloud.properties file is the supported way to set analysis scope.
#
# SonarCloud's automatic analysis does NOT reliably honour `sonar.cpd.exclusions`,
# so generated/data files are excluded from the whole analysis with
# `sonar.exclusions` instead.
#
# The following are data/framework-generated files whose repetitive structure is
# inherent and must not count against the new-code duplication gate
# (new_duplicated_lines_density):
#   * frontend/src/lib/api/schema.ts  — AUTO-GENERATED by openapi-typescript
#     (scripts/run_generate_api_types.py). Every path/operation repeats identical
#     `parameters: { query?: never; ... }` and `put?: never; ...` boilerplate.
#   * frontend/src/locales/**         — i18n translation catalogs. Each entry is a
#     `"key": "value"` pair; the repetitive structure is data, not logic, and
#     newly added view namespaces are routinely flagged against existing entries.
#   * backend/tests/**                 — the unit/integration/BDD suites share heavy
#     mock/setup boilerplate (_make_mock_session, FakeSession, RLS GUC setup,
#     side_effect lists) with one another and with the copy-paste test_executor*
#     variants. This repetition is expected test scaffolding, not logic, and trips
#     the new-code duplication gate on every large test PR without signalling real
#     risk. Production source stays in scope so genuine logic duplication is still
#     surfaced.
# Excluding these keeps the duplication gate focused on hand-written source.
# Frontend specs (frontend/src/__tests__/**) are excluded from analysis scope:
# they are test scaffolding (mirroring the already-excluded backend/tests/**) and
# register 0% new-code coverage against themselves, which drags the new_coverage
# quality gate below threshold even when the production source they exercise is
# fully covered.
# The same reasoning applies to the Playwright e2e suite (frontend/tests/e2e/**):
# it is test scaffolding the backend/coverage scans never execute, so it would
# register 0% new-code coverage and fail the new_coverage gate on any test-only PR.
# The same applies to the visual-baseline harness (frontend/tests/visual-baseline/**):
# compare.mjs is a CLI a human runs to diff two capture directories, plus the
# captured JSON/PNG fixtures it reads; no suite imports or instruments it, so it
# scored 153 uncovered new lines and failed new_coverage on FAR-2205.
sonar.exclusions=**/schema.ts,**/locales/**,backend/tests/**,frontend/src/__tests__/**,frontend/tests/e2e/**,frontend/tests/visual-baseline/**
# Alembic migrations are excluded from the NEW-CODE COVERAGE gate for the same
# reason as backend/tests/** above: the only thing that ever executes a
# migration's upgrade()/downgrade() is (a) the integration suite under
# backend/tests/** — which is already excluded from the analysis scope, so its
# coverage does not count — and (b) `alembic upgrade` in production. The
# per-migration "unit" tests are STRUCTURAL: they import the module and assert
# on its source text / revision chain, they never run the SQL, so they register
# 0% line coverage. Counting migration source against the new_coverage quality
# gate therefore fails it on schema DDL that cannot be line-covered in CI without
# a database that the coverage scan does not exercise — an artifact, not a risk.
# Production source stays in scope for issues/duplication; only the coverage
# denominator is narrowed.
# docs/api/examples/**: illustrative documentation snippets for the public API
# docs — never executed by any suite; scoring them as uncovered production source
# is a measurement-boundary artifact (same class as the migrations exclusion
# above).
# Frontend build/tooling config files (``frontend/*.config.*``) are Node-side
# build configuration, not client source; the vitest/v8 scan never instruments
# them, so their changed lines score as uncovered without reflecting a real gap.
sonar.coverage.exclusions=backend/src/farna/db/migrations/**,docs/api/examples/**,frontend/*.config.*

# The pipelines list wraps its wide table in a horizontally scrollable region
# that must be reachable in the tab order (WCAG 2.1.1; axe
# `scrollable-region-focusable`), so it carries `tabindex="0"` plus an
# `aria-describedby` scroll instruction. This is the same focusable-scroll-
# container pattern as the compliance evidence index (CI-analysis config),
# and Web:S6845 does not model scrollable containers. Scoped to rule +
# resource only.
# scripts/package_compose_release.py is a maintainer-run release packaging CLI,
# not a request-serving module: its only inputs are flags the release operator
# types on their own machine. Two rules misfire on it:
#   * python:S2068 matches the embedded init-env.sh template because that shell
#     script contains the environment-variable names MODULO_DB_PASSWORD /
#     SAQ_AUTH_PASSWORD. The bundle ships no credential: the template derives
#     every secret locally at unpack time, which is the opposite of hard-coded.
#   * pythonsecurity:S8707 taints --output-dir/--compose-file/--env-file from
#     argv and reports the resulting mkdir/tarfile.open as a traversal sink.
#     Writing a release archive to an operator-named destination is the tool's
#     documented behaviour; there is no HTTP/MCP boundary here, so the
#     "malicious HTTP request" source is a misclassification of a CLI entry
#     point.
# Same scoped exclusion as sonar-project.properties (CI analysis), so the
# automatic-analysis check reaches the same verdict. Rule + resource only.
sonar.issue.ignore.multicriteria=e4,e5,e6
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e4.resourceKey=scripts/package_compose_release.py
sonar.issue.ignore.multicriteria.e5.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e5.resourceKey=scripts/package_compose_release.py
sonar.issue.ignore.multicriteria.e6.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.e6.resourceKey=frontend/src/views/PipelineListView.vue
