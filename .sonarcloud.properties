# SonarCloud configuration for AUTOMATIC analysis (GitHub App).
# NOTE: automatic analysis ignores sonar-project.properties; this
# .sonarcloud.properties file is the supported way to set analysis scope.
#
# SonarCloud's automatic analysis does NOT reliably honour `sonar.cpd.exclusions`,
# so generated/data files are excluded from the whole analysis with
# `sonar.exclusions` instead.
#
# The following are data/framework-generated files whose repetitive structure is
# inherent and must not count against the new-code duplication gate
# (new_duplicated_lines_density):
#   * frontend/src/lib/api/schema.ts  — AUTO-GENERATED by openapi-typescript
#     (scripts/run_generate_api_types.py). Every path/operation repeats identical
#     `parameters: { query?: never; ... }` and `put?: never; ...` boilerplate.
#   * frontend/src/locales/**         — i18n translation catalogs. Each entry is a
#     `"key": "value"` pair; the repetitive structure is data, not logic, and
#     newly added view namespaces are routinely flagged against existing entries.
#   * backend/tests/**                 — the unit/integration/BDD suites share heavy
#     mock/setup boilerplate (_make_mock_session, FakeSession, RLS GUC setup,
#     side_effect lists) with one another and with the copy-paste test_executor*
#     variants. This repetition is expected test scaffolding, not logic, and trips
#     the new-code duplication gate on every large test PR without signalling real
#     risk. Production source stays in scope so genuine logic duplication is still
#     surfaced.
# Excluding these keeps the duplication gate focused on hand-written source.
# Frontend specs (frontend/src/__tests__/**) are excluded from analysis scope:
# they are test scaffolding (mirroring the already-excluded backend/tests/**) and
# register 0% new-code coverage against themselves, which drags the new_coverage
# quality gate below threshold even when the production source they exercise is
# fully covered.
sonar.exclusions=**/schema.ts,**/locales/**,backend/tests/**,frontend/src/__tests__/**
# Alembic migrations are excluded from the NEW-CODE COVERAGE gate for the same
# reason as backend/tests/** above: the only thing that ever executes a
# migration's upgrade()/downgrade() is (a) the integration suite under
# backend/tests/** — which is already excluded from the analysis scope, so its
# coverage does not count — and (b) `alembic upgrade` in production. The
# per-migration "unit" tests are STRUCTURAL: they import the module and assert
# on its source text / revision chain, they never run the SQL, so they register
# 0% line coverage. Counting migration source against the new_coverage quality
# gate therefore fails it on schema DDL that cannot be line-covered in CI without
# a database that the coverage scan does not exercise — an artifact, not a risk.
# Production source stays in scope for issues/duplication; only the coverage
# denominator is narrowed.
sonar.coverage.exclusions=backend/src/modulo/db/migrations/**
