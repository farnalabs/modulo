# SonarCloud configuration for AUTOMATIC analysis (GitHub App).
# NOTE: automatic analysis ignores sonar-project.properties; this
# .sonarcloud.properties file is the supported way to set analysis scope.
#
# frontend/src/lib/api/schema.ts is AUTO-GENERATED by openapi-typescript
# (see scripts/run_generate_api_types.py, run by the generate-api-types hook).
# Its body is highly repetitive boilerplate: every path/operation repeats the
# same `parameters: { query?: never; header?: never; ... }` and
# `put?: never; post?: never; ...` blocks, byte-for-byte identical to thousands
# of existing lines in the same file. This is inherent to the generator output
# and must not count against the new-code duplication gate
# (new_duplicated_lines_density); otherwise every PR that regenerates the schema
# fails the quality gate. Exclude the generated file from analysis entirely
# (duplication, coverage and issue detection) so its boilerplate never counts
# against the new-code duplication gate (new_duplicated_lines_density);
# otherwise every PR that regenerates the schema fails the quality gate.
#
# NOTE: SonarCloud's automatic analysis does not reliably honour
# `sonar.cpd.exclusions`, so we exclude the file from the whole analysis with
# `sonar.exclusions` instead.
sonar.exclusions=frontend/src/lib/api/schema.ts
